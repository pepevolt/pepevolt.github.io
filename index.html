<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PVLT Tap Game</title>

<!-- ETHERS -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<!-- WALLETCONNECT -->
<script src="https://unpkg.com/@walletconnect/ethereum-provider/dist/index.umd.js"></script>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020b18;
font-family:Arial,sans-serif;
color:white;
}

/* ================= BODY ================= */

body{
display:flex;
flex-direction:column;
}

/* ================= TOP BAR ================= */

.topbar{
width:100%;
padding:14px 18px;
background:#091426;
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
font-weight:bold;
}

/* ================= MAIN ================= */

.main{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow-y:auto;
}

/* ================= TAP BUTTON ================= */

.tapBtn{
width:240px;
height:240px;
border:none;
border-radius:50%;
overflow:hidden;
margin-top:20px;
background:linear-gradient(
135deg,
#00ff99,
#00ccff
);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 30px rgba(0,255,180,0.25);
}

.tapBtn:active{
transform:scale(0.96);
}

.tapBtn img{
width:78%;
height:78%;
object-fit:contain;
pointer-events:none;
}

/* ================= CARD ================= */

.card{
width:100%;
max-width:380px;
margin-top:28px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:18px;
display:flex;
flex-direction:column;
gap:14px;
}

/* ================= INPUT ================= */

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#0c1628;
color:white;
font-size:14px;
outline:none;
}

/* ================= BUTTON ================= */

.actionBtn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
background:linear-gradient(
90deg,
#00ff99,
#00ccff
);
color:black;
}

/* ================= STATUS ================= */

.status{
text-align:center;
font-size:12px;
opacity:0.8;
display:none;
}

/* ================= INFO BOX ================= */

.info{
margin-top:16px;
font-size:12px;
line-height:1.7;
opacity:0.8;
text-align:center;
max-width:380px;
}

</style>

</head>

<body>

<!-- ================= TOP BAR ================= -->

<div class="topbar">

<div>
🔋
<span id="energy">50</span>
</div>

<div>
⚡
<span id="points">0</span>
</div>

<div>
💎
<span id="pvltg">0.0000</span>
</div>

</div>

<!-- ================= MAIN ================= -->

<div class="main">

<!-- TAP BUTTON -->

<button class="tapBtn" onclick="tap()">

<img src="images/IMG_1850.png">

</button>

<!-- CARD -->

<div class="card">

<input
id="walletInput"
placeholder="Connect Polygon Wallet"
readonly>

<button
class="actionBtn"
id="walletBtn"
onclick="connectWallet()">

CONNECT WALLET

</button>

<div
class="status"
id="walletStatus">

Wallet Connected

</div>

<button
class="actionBtn"
onclick="buyEnergy()">

BUY ENERGY

</button>

<button
class="actionBtn"
onclick="swapPoints()">

SWAP POINTS → PVLTG

</button>

<button
class="actionBtn"
onclick="claimPVLT()">

CLAIM PVLT

</button>

</div>

<!-- INFO -->

<div class="info">

1 Tap = 1 Point<br>

10000 Points = 1 PVLTG<br>

100 PVLTG = 1 PVLT

</div>

</div>

<script>

/* ================= CONFIG ================= */

const API =
"https://pvlt-server.onrender.com";

const PROJECT_ID =
"1731f99148b9cf6107dee70b6efb14b7";

/* ================= STATE ================= */

let provider;

let wallet = "";

let points = 0;

let energy = 50;

let pvltg = 0;

/* ================= UPDATE UI ================= */

function updateUI(){

document.getElementById(
"energy"
).innerText = energy;

document.getElementById(
"points"
).innerText = points;

document.getElementById(
"pvltg"
).innerText =
Number(pvltg).toFixed(4);
}

/* ================= CONNECT WALLET ================= */

async function connectWallet(){

try{

provider =
await EthereumProvider.init({

projectId:PROJECT_ID,

chains:[137],

showQrModal:true

});

await provider.enable();

const ethersProvider =
new ethers.providers.Web3Provider(
provider
);

const signer =
ethersProvider.getSigner();

wallet =
await signer.getAddress();

/* DISPLAY ADDRESS */

document.getElementById(
"walletInput"
).value =
wallet.substring(0,6)
+
"..."
+
wallet.substring(
wallet.length - 4
);

/* BUTTON */

document.getElementById(
"walletBtn"
).innerText =
"CONNECTED";

/* STATUS */

document.getElementById(
"walletStatus"
).style.display =
"block";

/* REGISTER USER */

const res =
await fetch(
API + "/user",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

/* LOAD USER */

points =
data.points || 0;

energy =
data.energy || 50;

pvltg =
data.pvltg || 0;

updateUI();

}catch(err){

console.log(err);

alert(
"Wallet connection failed"
);

}
}

/* ================= TAP ================= */

async function tap(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

try{

const res =
await fetch(
API + "/tap",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

if(data.error){

alert(data.error);

return;
}

points =
data.points;

energy =
data.energy;

updateUI();

}catch(err){

console.log(err);

alert(
"Tap failed"
);
}
}

/* ================= BUY ENERGY ================= */

async function buyEnergy(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

try{

const res =
await fetch(
API + "/refill",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

if(data.error){

alert(data.error);

return;
}

energy =
data.energy;

updateUI();

alert(
"50 Energy Added"
);

}catch(err){

console.log(err);

alert(
"Energy purchase failed"
);
}
}

/* ================= SWAP POINTS ================= */

async function swapPoints(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

try{

const res =
await fetch(
API + "/swap-points",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

if(data.error){

alert(data.error);

return;
}

points = 0;

pvltg =
data.pvltg;

updateUI();

alert(
"Points swapped to PVLTG"
);

}catch(err){

console.log(err);

alert(
"Swap failed"
);
}
}

/* ================= CLAIM PVLT ================= */
async function claimPVLT(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

if(pvltg < 100){

alert(
"Need minimum 100 PVLTG"
);

return;
}

try{

/* ================= ETHERS ================= */

const ethersProvider =
new ethers.providers.Web3Provider(
provider
);

const signer =
ethersProvider.getSigner();

/* ================= PVLTG CONTRACT ================= */

const pvltgContract =
new ethers.Contract(

"0xcaf3f8172d8accaa87d3eb9f679b693d04976aee",

[
"function approve(address spender,uint256 amount) external returns(bool)"
],

signer

);

/* ================= APPROVE ================= */

const amount =
ethers.utils.parseEther(
pvltg.toString()
);

const approveTx =
await pvltgContract.approve(

"YOUR_GAME_ENGINE_ADDRESS",

amount

);

await approveTx.wait();

/* ================= CLAIM ================= */

async function claimPVLT(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

if(pvltg < 100){

alert(
"Need minimum 100 PVLTG"
);

return;
}

try{

/* ================= ETHERS ================= */

const ethersProvider =
new ethers.providers.Web3Provider(
provider
);

const signer =
ethersProvider.getSigner();

/* ================= PVLTG CONTRACT ================= */

const pvltgContract =
new ethers.Contract(

"0xcaf3f8172d8accaa87d3eb9f679b693d04976aee",

[
"function approve(address spender,uint256 amount) external returns(bool)"
],

signer

);

/* ================= APPROVE ================= */

const amount =
ethers.utils.parseEther(
pvltg.toString()
);

const approveTx =
await pvltgContract.approve(

"YOUR_GAME_ENGINE_ADDRESS",

amount

);

await approveTx.wait();

/* ================= CLAIM ================= */

const res =
await fetch(
API + "/claim-pvltg",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

if(data.error){

alert(data.error);

return;
}

/* ================= RESET ================= */

pvltg = 0;

updateUI();

alert(
"PVLT claimed successfully\n\nTX:\n"
+
data.tx
);

}catch(err){

console.log(err);

alert(
"Claim failed"
);
}
}

/* ================= RESET ================= */

pvltg = 0;

updateUI();

alert(
"PVLT claimed successfully\n\nTX:\n"
+
data.tx
);

}catch(err){

console.log(err);

alert(
"Claim failed"
);
}
}




/* ================= AUTO REFILL ================= */

setInterval(()=>{

if(energy < 50){

energy += 1;

updateUI();
}

},30000);

/* ================= START ================= */

updateUI();

</script>

</body>
</html>
