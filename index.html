<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PVLT GAME</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#111;
    color:white;
    text-align:center;
}

button {
    padding:20px;
    font-size:20px;
    margin-top:20px;
    width:80%;
}

#box {
    margin-top:100px;
}
</style>
</head>

<body>

<div id="box">
    <h1>PVLT TAP</h1>
    <p id="points">0</p>

    <button onclick="tap()">TAP</button>
</div>

<script>
let points = 0;

async function tap() {
    const wallet = "demo_wallet";

    const res = await fetch("/tap", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({wallet})
    });

    if (!res.ok) {
        alert("Blocked or cooldown");
        return;
    }

    const data = await res.json();
    points += data.reward;

    document.getElementById("points").innerText = points;
}
</script>

</body>
</html>
