<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Tap PVLT</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #1a1a2e; color: #fff; text-align: center; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 15px; background: #16213e; border-bottom: 2px solid #0f3460; }
        .stat-item { display: flex; flex-direction: column; font-size: 0.8rem; }
        .emoji { font-size: 1.4rem; margin-bottom: 5px; }
        .tap-circle { width: 200px; height: 200px; border-radius: 50%; border: none; background: #4ecca3; font-size: 2rem; margin: 50px auto; cursor: pointer; color: #1a1a2e; font-weight: bold; }
        .controls { padding: 20px; }
        button { padding: 12px 20px; cursor: pointer; border: none; border-radius: 5px; background: #e94560; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <header class="stats">
        <div class="stat-item"><span class="emoji">⚡</span><span id="energy">0</span></div>
        <div class="stat-item"><span class="emoji">💎</span><span id="points">0</span></div>
        <div class="stat-item"><span class="emoji">🪙</span><span id="gpvlt">0.00</span></div>
    </header>

    <main>
        <button id="tap-button" class="tap-circle">TAP!</button>
        <div id="pvlt-display">Total Claimable: 0.000 PVLT</div>
    </main>

    <div class="controls">
        <button onclick="convertPoints()">Convert 50 💎 to 0.5 gPVLT</button>
    </div>

    <script>
        let energy = 0;
        let points = 0;
        let gpvlt = 0;

        function updateUI() {
            document.getElementById('energy').innerText = energy;
            document.getElementById('points').innerText = points;
            document.getElementById('gpvlt').innerText = gpvlt.toFixed(2);
            
            // 1,000 gPVLT = 1 PVLT. So, gPVLT / 1000 = PVLT
            let pvlt = gpvlt / 1000;
            document.getElementById('pvlt-display').innerText = `Total Claimable: ${pvlt.toFixed(3)} PVLT`;
        }

        document.getElementById('tap-button').addEventListener('click', () => {
            energy += 1;
            points += 1;
            updateUI();
        });

        function convertPoints() {
            if (points >= 50) {
                points -= 50;
                gpvlt += 0.5;
                updateUI();
            } else {
                alert("Need at least 50 Points to convert!");
            }
        }
    </script>
</body>
</html>
