<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt UI</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .top-nav {
            width: 100%;
            max-width: 320px;
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .tap-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #77b897 50%, #4a4f56 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            margin: 20px 0;
            cursor: pointer;
            user-select: none;
        }

        .main-container {
            background-color: #1a1f26;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
            font-weight: 600;
        }

        .secondary-btn {
            background-color: #2d3748;
            color: #a0aec0;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            margin: 8px 0;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div>⚡ 0</div>
        <div>💎 0</div>
        <div>🪙 0</div>
    </div>

    <div class="tap-circle" onclick="console.log('Tapped!')">TAP!</div>

    <button id="walletBtn" class="btn" style="max-width: 320px;" onclick="toggleWallet()">Connect Wallet</button>
    
    <div class="main-container">
        <button class="secondary-btn">Buy</button>
        <button class="secondary-btn">Convert</button>
        <button class="secondary-btn">Claim</button>
    </div>

    <script>
        let isConnected = false;

        function toggleWallet() {
            const btn = document.getElementById('walletBtn');
            if (!isConnected) {
                // Logic to connect (e.g., window.ethereum.request)
                btn.innerText = "0x8ed3...324b"; // Simulated address
                isConnected = true;
            } else {
                // Logic to disconnect
                btn.innerText = "Connect Wallet";
                isConnected = false;
            }
        }
    </script>
</body>
</html>
