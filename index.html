<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>PEPEVOLT GAME</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.glow{
    box-shadow:
        0 0 25px rgba(16,185,129,0.5),
        0 0 60px rgba(16,185,129,0.25);
}

.loader{
    width:18px;
    height:18px;
    border:2px solid rgba(255,255,255,0.3);
    border-top:2px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4 font-sans">

<!-- TITLE -->

<h1 class="text-4xl font-black text-emerald-400 mt-4 mb-6">
⚡ PEPEVOLT
</h1>

<!-- MAIN CARD -->

<div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5">

    <!-- WALLET -->

    <div class="flex flex-col gap-3 mb-6">

        <button
            id="connectBtn"
            class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all rounded-2xl p-4 font-black text-lg"
        >
            Connect Wallet
        </button>

        <div
            id="walletText"
            class="text-xs text-slate-400 break-all text-center"
        >
            Not Connected
        </div>

    </div>

    <!-- STATS -->

    <div class="grid grid-cols-3 gap-3 mb-6">

        <div class="bg-slate-800 rounded-2xl p-4 text-center">
            <div class="text-2xl mb-1">⚡</div>
            <div id="energy" class="text-2xl font-black">0</div>
            <div class="text-xs text-slate-400">
                Energy
            </div>
        </div>

        <div class="bg-slate-800 rounded-2xl p-4 text-center">
            <div class="text-2xl mb-1">💎</div>
            <div id="points" class="text-2xl font-black">0</div>
            <div class="text-xs text-slate-400">
                Points
            </div>
        </div>

        <div class="bg-slate-800 rounded-2xl p-4 text-center">
            <div class="text-2xl mb-1">🪙</div>
            <div id="gpvlt" class="text-2xl font-black">0</div>
            <div class="text-xs text-slate-400">
                gPVLT
            </div>
        </div>

    </div>

    <!-- TAP -->

    <div class="flex justify-center mb-7">

        <button
            id="tapBtn"
            class="w-56 h-56 rounded-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all glow text-5xl font-black"
        >
            TAP
        </button>

    </div>

    <!-- STATUS -->

    <div
        id="status"
        class="min-h-[24px] text-center text-sm text-slate-400 mb-6"
    >
        Ready
    </div>

    <!-- BUTTONS -->

    <div class="flex flex-col gap-3">

        <button
            id="refillBtn"
            class="bg-cyan-600 hover:bg-cyan-500 active:scale-95 transition-all rounded-2xl p-4 font-bold"
        >
            Refill Energy
        </button>

        <button
            id="buyBtn"
            class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-2xl p-4 font-bold"
        >
            Buy 10,000 Energy (100 PVLT)
        </button>

        <button
            id="convertBtn"
            class="bg-purple-600 hover:bg-purple-500 active:scale-95 transition-all rounded-2xl p-4 font-bold disabled:opacity-40"
        >
            Convert 100 Points → 1 gPVLT
        </button>

        <button
            id="claimBtn"
            class="bg-amber-600 hover:bg-amber-500 active:scale-95 transition-all rounded-2xl p-4 font-bold disabled:opacity-40"
        >
            Claim Rewards
        </button>

    </div>

</div>

<!-- ETHERS -->

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<!-- WEB3MODAL -->

<script type="module">

import {
    EthereumClient,
    w3mConnectors,
    w3mProvider
}
from
"https://unpkg.com/@web3modal/ethereum@2.7.1/dist/index.js";

import {
    Web3Modal
}
from
"https://unpkg.com/@web3modal/html@2.7.1/dist/index.js";

import {
    configureChains,
    createConfig
}
from
"https://esm.sh/wagmi";

import {
    bsc
}
from
"https://esm.sh/wagmi/chains";

/* =========================================================
   CONTRACT SETTINGS
========================================================= */

const GAME_ADDRESS =
    "YOUR_GAME_CONTRACT_ADDRESS";

const PVLT_ADDRESS =
    "YOUR_PVLT_CONTRACT_ADDRESS";

/*
GET PROJECT ID:
https://cloud.walletconnect.com
*/

const PROJECT_ID =
    "YOUR_WALLETCONNECT_PROJECT_ID";

/* =========================================================
   ABIs
========================================================= */

const ABI_GAME = [

    "function tap() external",

    "function buyEnergy() external",

    "function convertPoints() external",

    "function claimRewards() external",

    "function refillEnergy() external",

    "function getPlayer(address) external view returns(uint256,uint256,uint256,bool,uint256)"
];

const ABI_PVLT = [

    "function approve(address spender,uint256 amount) external returns(bool)"
];

/* =========================================================
   WEB3MODAL
========================================================= */

const chains = [bsc];

const { publicClient } =
    configureChains(
        chains,
        [
            w3mProvider({
                projectId: PROJECT_ID
            })
        ]
    );

const wagmiConfig =
    createConfig({

        autoConnect: true,

        connectors:
            w3mConnectors({
                projectId: PROJECT_ID,
                chains
            }),

        publicClient
    });

const ethereumClient =
    new EthereumClient(
        wagmiConfig,
        chains
    );

const modal =
    new Web3Modal(
        {
            projectId: PROJECT_ID,
            themeMode: "dark",
            themeVariables: {
                "--w3m-accent-color": "#10b981"
            }
        },
        ethereumClient
    );

/* =========================================================
   VARIABLES
========================================================= */

let provider;
let signer;
let userAddress;

let gameContract;
let pvltContract;

const energyEl =
    document.getElementById("energy");

const pointsEl =
    document.getElementById("points");

const gpvltEl =
    document.getElementById("gpvlt");

const walletText =
    document.getElementById("walletText");

const statusEl =
    document.getElementById("status");

/* =========================================================
   STATUS
========================================================= */

function setStatus(message){

    statusEl.innerHTML = message;
}

/* =========================================================
   SHORT ADDRESS
========================================================= */

function shortAddress(address){

    return
        address.slice(0,6)
        + "..."
        + address.slice(-4);
}

/* =========================================================
   CONNECT WALLET
========================================================= */

async function connectWallet(){

    try{

        setStatus(
            "Opening wallet selector..."
        );

        await modal.openModal();

        const walletProvider =
            await modal.getWalletProvider();

        provider =
            new ethers.providers.Web3Provider(
                walletProvider
            );

        signer =
            provider.getSigner();

        userAddress =
            await signer.getAddress();

        gameContract =
            new ethers.Contract(
                GAME_ADDRESS,
                ABI_GAME,
                signer
            );

        pvltContract =
            new ethers.Contract(
                PVLT_ADDRESS,
                ABI_PVLT,
                signer
            );

        walletText.innerText =
            shortAddress(userAddress);

        document.getElementById(
            "connectBtn"
        ).innerText =
            "Wallet Connected";

        setStatus(
            "Wallet connected successfully"
        );

        await updateStats();

    }catch(err){

        console.log(err);

        setStatus(
            err.message ||
            "Connection failed"
        );
    }
}

/* =========================================================
   UPDATE STATS
========================================================= */

async function updateStats(){

    try{

        if(!gameContract) return;

        const p =
            await gameContract.getPlayer(
                userAddress
            );

        const energy =
            Number(p[0]);

        const points =
            Number(p[1]);

        const gpvlt =
            Number(p[2]);

        energyEl.innerText =
            energy;

        pointsEl.innerText =
            points;

        gpvltEl.innerText =
            gpvlt;

        document.getElementById(
            "convertBtn"
        ).disabled =
            points < 100;

        document.getElementById(
            "claimBtn"
        ).disabled =
            !(gpvlt >= 100 && gpvlt <= 1000);

    }catch(err){

        console.log(err);

        setStatus(
            "Failed loading stats"
        );
    }
}

/* =========================================================
   TRANSACTION HANDLER
========================================================= */

async function execute(fn, message){

    try{

        setStatus(
            `<div class="flex justify-center">
                <div class="loader"></div>
            </div>
            <div class="mt-2">${message}</div>`
        );

        const tx =
            await fn();

        setStatus(
            "Waiting for blockchain confirmation..."
        );

        await tx.wait();

        setStatus(
            "Transaction successful"
        );

        await updateStats();

    }catch(err){

        console.log(err);

        if(
            err?.data?.message
        ){
            setStatus(
                err.data.message
            );
        }
        else{
            setStatus(
                err.message ||
                "Transaction failed"
            );
        }
    }
}

/* =========================================================
   BUTTON EVENTS
========================================================= */

document.getElementById(
    "connectBtn"
).onclick =
    connectWallet;

document.getElementById(
    "tapBtn"
).onclick =
    async () => {

        await execute(
            () =>
                gameContract.tap(),
            "Tapping..."
        );
};

document.getElementById(
    "refillBtn"
).onclick =
    async () => {

        await execute(
            () =>
                gameContract.refillEnergy(),
            "Refilling energy..."
        );
};

document.getElementById(
    "buyBtn"
).onclick =
    async () => {

        const amount =
            ethers.utils.parseEther(
                "100"
            );

        await execute(

            async () => {

                const approveTx =
                    await pvltContract.approve(
                        GAME_ADDRESS,
                        amount
                    );

                await approveTx.wait();

                return
                    gameContract.buyEnergy();
            },

            "Buying energy..."
        );
};

document.getElementById(
    "convertBtn"
).onclick =
    async () => {

        await execute(
            () =>
                gameContract.convertPoints(),
            "Converting points..."
        );
};

document.getElementById(
    "claimBtn"
).onclick =
    async () => {

        await execute(
            () =>
                gameContract.claimRewards(),
            "Claiming rewards..."
        );
};

/* =========================================================
   AUTO RELOAD
========================================================= */

window.addEventListener(
    "focus",
    async () => {

        if(gameContract){
            await updateStats();
        }
    }
);

</script>

</body>
</html>
