<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pepevolt Token Miner</title>
    <style>
        :root {
            --bg-color: #080b10;
            --card-color: #0f141c;
            --accent-color: #00ff66;
            --gov-color: #ffaa00;
            --energy-color: #00e5ff;
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; }

        .game-container { width: 100%; height: 100%; background-color: var(--card-color); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        @media (min-width: 480px) { .game-container { max-width: 430px; max-height: 850px; border-radius: 32px; height: 92vh; border: 1px solid #1e293b; } }

        .screen { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; display: flex; flex-direction: column; padding: 2rem; }
        .hidden { display: none !important; }

        /* Dashboard Styles */
        .dashboard-header { width: 100%; padding: 20px 16px; background: rgba(15, 20, 28, 0.9); border-bottom: 1px solid #1e293b; }
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .wallet-card { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 14px; text-align: center; }
        .wallet-label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; }
        .wallet-balance { font-size: 1.2rem; font-weight: 800; color: #fff; margin-top: 4px; }

        /* NEW: Claim Button Below Center */
        .claim-container { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; }
        .btn-claim { background: #1e293b; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; }

        .energy-hud { padding: 10px; background: rgba(255,255,255,0.02); border-radius: 12px; }
        .energy-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .energy-fill { height: 100%; background: var(--energy-color); width: 100%; transition: width 0.1s; }

        .dashboard-content { flex: 1; position: relative; }
        .token-target { width: 110px; height: 110px; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); border: 4px solid #fff; background: radial-gradient(circle, #00ff66 0%, #054019 100%); cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="dashboard-screen" class="screen">
            <div class="dashboard-header">
                <div class="wallet-grid">
                    <div class="wallet-card"><div class="wallet-label">PVLT</div><div class="wallet-balance" id="dash-pvlt">0.0000</div></div>
                    <div class="wallet-card"><div class="wallet-label">gPVLT</div><div class="wallet-balance" id="dash-gpvlt" style="color:var(--gov-color);">0.00</div></div>
                </div>
                
                <div class="claim-container">
                    <button class="btn-claim" onclick="alert('Claiming to Web3 Wallet...')">Claim to Wallet</button>
                </div>

                <div class="energy-hud">
                    <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--energy-color);"><span>STAMINA</span><span id="energy-text">50/50</span></div>
                    <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
                </div>
            </div>
            <div class="dashboard-content" id="play-area">
                <div id="target" class="token-target"></div>
            </div>
        </div>
    </div>
</body>
</html>
