<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
/>

<title>PepeVolt</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:white;
    touch-action:manipulation;
    user-select:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:430px;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#173052,#07111f);
}

/* TOP NAV */

.topnav{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    z-index:999;
    padding:14px;
    backdrop-filter:blur(14px);
    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.stats{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.stat{
    flex:1;
    background:rgba(255,255,255,0.08);
    border-radius:16px;
    padding:12px;
    text-align:center;
}

.stat .emoji{
    font-size:18px;
}

.stat .value{
    margin-top:6px;
    font-size:18px;
    font-weight:800;
    color:#00ff99;
}

/* CONTENT */

.content{
    padding-top:120px;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding-bottom:30px;
}

/* WALLET */

.wallet{
    width:90%;
    display:flex;
    justify-content:center;
}

.connect-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    background:#00ff99;
    color:black;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

/* TAP */

.tap-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

.tap-btn{
    width:240px;
    height:240px;
    border-radius:50%;
    border:none;
    background:
    radial-gradient(circle,#00ff99,#00b36b);
    color:black;
    font-size:34px;
    font-weight:900;
    cursor:pointer;
    transition:0.08s;
    box-shadow:
    0 0 40px rgba(0,255,153,0.5);
}

.tap-btn:active{
    transform:scale(0.92);
}

/* BUTTONS */

.actions{
    width:90%;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.action-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    background:#00ff99;
    color:black;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.secondary{
    background:#ffffff10;
    color:white;
    border:1px solid rgba(255,255,255,0.08);
}

.footer{
    margin-top:14px;
    text-align:center;
    opacity:0.7;
    font-size:13px;
}

.loading{
    opacity:0.6;
    pointer-events:none;
}

</style>
</head>

<body>

<div class="app">

    <!-- TOP NAV -->
    <div class="topnav">
        <div class="stats">

            <div class="stat">
                <div class="emoji">⚡</div>
                <div id="energy" class="value">50</div>
            </div>

            <div class="stat">
                <div class="emoji">🎯</div>
                <div id="points" class="value">0</div>
            </div>

            <div class="stat">
                <div class="emoji">🔥</div>
                <div id="gpvlt" class="value">0</div>
            </div>

        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- WALLET -->
        <div class="wallet">
            <button id="connectBtn" class="connect-btn">
                Connect Wallet
            </button>
        </div>

        <!-- TAP -->
        <div class="tap-container">
            <button id="tapBtn" class="tap-btn">
                TAP
            </button>
        </div>

        <!-- ACTIONS -->
        <div class="actions">

            <button id="convertBtn" class="action-btn secondary">
                Convert 10 Points → 1 gPVLT
            </button>

            <button id="claimBtn" class="action-btn">
                Claim 1 PVLT (10 gPVLT)
            </button>

            <button id="buyEnergyBtn" class="action-btn">
                Buy 10000 Energy (100 PVLT)
            </button>

            <div class="footer">
                Polygon Mainnet • PepeVolt
            </div>

        </div>

    </div>

</div>

<script>

const PVLT_ADDRESS =
"0x5f7df6862f439b691507dc20069f4f73a37cb08b";

const TREASURY_ADDRESS =
"0x4251Ef24D10bf637494C173621F5f84262e9Bda5";

const GAME_ADDRESS =
"0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

const GAME_ABI = [
    "function tap() external",
    "function refillEnergy() external",
    "function convertPoints() external",
    "function players(address) view returns(uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"
];

const TREASURY_ABI = [
    "function claimRewards() external"
];

const ERC20_ABI = [
    "function approve(address spender,uint256 amount) external returns(bool)",
    "function balanceOf(address owner) view returns(uint256)"
];

let provider;
let signer;
let user;

let game;
let treasury;
let pvlt;

const connectBtn =
document.getElementById("connectBtn");

async function connectWallet(){

    if(!window.ethereum){
        alert("Install MetaMask");
        return;
    }

    provider =
    new ethers.providers.Web3Provider(window.ethereum);

    await provider.send("eth_requestAccounts",[]);

    const network = await provider.getNetwork();

    if(network.chainId !== 137){
        alert("Switch to Polygon Mainnet");
        return;
    }

    signer = provider.getSigner();

    user = await signer.getAddress();

    game =
    new ethers.Contract(
        GAME_ADDRESS,
        GAME_ABI,
        signer
    );

    treasury =
    new ethers.Contract(
        TREASURY_ADDRESS,
        TREASURY_ABI,
        signer
    );

    pvlt =
    new ethers.Contract(
        PVLT_ADDRESS,
        ERC20_ABI,
        signer
    );

    connectBtn.innerText =
    user.slice(0,6) +
    "..." +
    user.slice(-4);

    await loadPlayer();
}

async function loadPlayer(){

    if(!user) return;

    try{

        const data =
        await game.players(user);

        let energy =
        Number(data.energy);

        const points =
        Number(data.points);

        const gpvlt =
        Number(data.burnedGPVLT);

        // AUTO FREE REFILL DISPLAY
        if(energy <= 0){
            energy = 50;
        }

        document.getElementById("energy").innerText =
        energy;

        document.getElementById("points").innerText =
        points;

        document.getElementById("gpvlt").innerText =
        gpvlt;

    }catch(err){
        console.log(err);
    }
}

async function execute(button,callback){

    try{

        button.classList.add("loading");

        const tx = await callback();

        await tx.wait();

        await loadPlayer();

    }catch(err){

        console.log(err);

        alert(
            err?.data?.message ||
            err?.message ||
            "Transaction failed"
        );
    }

    button.classList.remove("loading");
}

/* CONNECT */

connectBtn.onclick = connectWallet;

/* TAP */

document.getElementById("tapBtn").onclick =
async(e)=>{

    const energy =
    Number(
        document.getElementById("energy").innerText
    );

    // FREE REFILL UI LOGIC
    if(energy <= 0){

        await execute(
            e.target,
            ()=>game.refillEnergy()
        );

        return;
    }

    await execute(
        e.target,
        ()=>game.tap()
    );
};

/* CONVERT */

document.getElementById("convertBtn").onclick =
async(e)=>{

    const points =
    Number(
        document.getElementById("points").innerText
    );

    if(points < 10){
        alert("Need 10 points");
        return;
    }

    await execute(
        e.target,
        ()=>game.convertPoints()
    );
};

/* CLAIM */

document.getElementById("claimBtn").onclick =
async(e)=>{

    const gpvlt =
    Number(
        document.getElementById("gpvlt").innerText
    );

    if(gpvlt < 10){
        alert("Need 10 gPVLT");
        return;
    }

    await execute(
        e.target,
        ()=>treasury.claimRewards()
    );
};

/* BUY ENERGY */

document.getElementById("buyEnergyBtn").onclick =
async(e)=>{

    try{

        e.target.classList.add("loading");

        const amount =
        ethers.utils.parseUnits("100",18);

        const tx1 =
        await pvlt.approve(
            GAME_ADDRESS,
            amount
        );

        await tx1.wait();

        // IMPORTANT:
        // YOUR CONTRACT DOES NOT HAVE
        // BUY ENERGY FUNCTION YET

        alert(
            "Your smart contract does not include buyEnergy() yet."
        );

    }catch(err){

        console.log(err);

        alert(
            err?.message ||
            "Transaction failed"
        );
    }

    e.target.classList.remove("loading");
};

window.ethereum?.on(
    "accountsChanged",
    ()=>window.location.reload()
);

window.ethereum?.on(
    "chainChanged",
    ()=>window.location.reload()
);

</script>

</body>
</html>
