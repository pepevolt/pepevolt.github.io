<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PepeVolt Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; background: radial-gradient(circle at center, #2c3e50, #1a1a2e); }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .game-container { display: flex; flex-direction: column; height: 100vh; padding-bottom: 30px; background: transparent; color: #ffffff; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 15px 5px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .tap-circle { width: 160px; height: 160px; border-radius: 50%; border: none; font-size: 2rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; background: #4ecca3; }
        .tap-circle.disconnected { background: linear-gradient(180deg, #4ecca3 50%, #4a4a4a 50%); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-wallet { background: #3498db; color: white; width: 80%; padding: 15px; }
        .btn-wallet.connected { background: #e74c3c; }
        .game-btn { background: #4ecca3; color: #1a1a2e; width: 80%; padding: 12px; margin: 5px; }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="stats">
            <div class="stat-item">⚡ <span id="energy">Locked</span></div>
            <div class="stat-item">💎 <span id="points">Locked</span></div>
            <div class="stat-item">🪙 <span id="gpvlt">Locked</span></div>
        </header>

        <main class="interaction-area" style="display:flex; flex-direction:column; align-items:center; flex:1; justify-content:center;">
            <button id="tap-button" class="tap-circle disconnected" disabled>TAP!</button>
            <button id="wallet-btn" class="btn-wallet" onclick="toggleWallet()">Connect Wallet</button>
            <div id="pvlt-display">Balance: Locked</div>
            <button class="game-btn" onclick="claimReward()" disabled>Claim Reward</button>
        </main>
    </div>

    <script>
        let isConnected = false;
        let points = 0;

        async function toggleWallet() {
            if (!isConnected) {
                // Connect Logic
                if (window.ethereum) {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    isConnected = true;
                    document.getElementById('wallet-btn').innerText = "Disconnect Wallet";
                    document.getElementById('wallet-btn').className = "btn-wallet connected";
                    document.getElementById('tap-button').classList.remove('disconnected');
                    document.getElementById('tap-button').disabled = false;
                    updateUI();
                }
            } else {
                isConnected = false;
                window.location.reload(); // Simple reset
            }
        }

        async function claimReward() {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const address = await signer.getAddress();

            // Send to Render Server
            const res = await fetch('https://pvlt-server.onrender.com/api/claim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userAddress: address, amount: points })
            });
            const data = await res.json();
            alert("Reward Claimed! Tx: " + data.tx);
        }

        function updateUI() {
            document.getElementById('energy').innerText = isConnected ? "50/50" : "Locked";
            document.getElementById('gpvlt').innerText = isConnected ? "0.00" : "Locked";
        }
    </script>
</body>
</html>
