<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>GPVLT TAP — Polygon Energy Game</title>
  <!-- Ethers + WalletConnect (same core libs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 10%, #030e1c, #00040a);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: white;
      /* Remove global touch-action to allow tapping but prevent unwanted panning */
      touch-action: pan-y pinch-zoom;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      height: 100%;
    }

    /* TOP BAR — premium brand look */
    .topbar {
      width: 100%;
      padding: 14px 20px;
      background: rgba(5, 15, 30, 0.75);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 255, 200, 0.45);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      z-index: 10;
      flex-wrap: wrap;
      gap: 8px;
      position: sticky;
      top: 0;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      padding: 6px 16px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      border: 1px solid rgba(0, 255, 180, 0.4);
      letter-spacing: 0.3px;
    }

    .stat-card span:first-child {
      font-size: 18px;
    }

    .stat-number {
      font-weight: 800;
      background: linear-gradient(135deg, #eef5ff, #8effe0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* main game area - FIXED LAYOUT no overflow shifts */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 28px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* TAP BUTTON - enhanced touch feedback */
    .tap-wrapper {
      position: relative;
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
    }

    .tapBtn {
      width: 260px;
      height: 260px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #22ffc0, #0f6eff);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      transition: transform 0.07s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 18px 32px rgba(0, 220, 180, 0.5), 0 0 0 3px rgba(120, 255, 200, 0.6) inset, 0 0 0 6px rgba(255,255,210,0.2) inset;
      will-change: transform;
    }
    
    /* Active (tapping) state - works perfectly on mobile */
    .tapBtn:active {
      transform: scale(0.93);
      box-shadow: 0 8px 18px rgba(0, 230, 200, 0.9), 0 0 0 3px #d0ffe0 inset;
      transition: transform 0.03s;
    }

    /* Ensure tap button responds to pointer events */
    .tapBtn img {
      width: 68%;
      height: 68%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3));
    }

    /* Glassmorphism Card - FIXED width no layout shift */
    .glass-panel {
      width: 100%;
      max-width: 440px;
      margin-top: 24px;
      background: rgba(12, 24, 42, 0.65);
      backdrop-filter: blur(16px);
      border-radius: 44px;
      border: 1px solid rgba(0, 255, 180, 0.45);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 32px -12px black;
    }

    .input-fancy {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 80px;
      background: #07162f;
      color: white;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      outline: none;
      border: 1px solid rgba(0, 255, 190, 0.4);
      transition: 0.2s;
      letter-spacing: 0.4px;
    }

    .input-fancy:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 10px #00ffcc70;
    }

    .actionBtn {
      width: 100%;
      padding: 14px 12px;
      border: none;
      border-radius: 80px;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(105deg, #00ffba, #2b8eff);
      color: #010f1c;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.6px;
      box-shadow: 0 6px 14px rgba(0,220,160,0.25);
      touch-action: manipulation;
    }

    .actionBtn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px #00ffb380;
    }

    .status-badge {
      text-align: center;
      font-size: 12px;
      background: #091d36cc;
      border-radius: 40px;
      padding: 8px;
      display: none;
      backdrop-filter: blur(4px);
    }

    .info-tip {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 20px;
      border-radius: 60px;
      text-align: center;
      max-width: 440px;
      backdrop-filter: blur(4px);
      border: 0.5px solid #2affc070;
    }

    /* modal premium - fixed position */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(1, 8, 18, 0.92);
      backdrop-filter: blur(18px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 90%;
      max-width: 340px;
      background: #0c1b30f2;
      border: 1px solid #00ffc0a0;
      border-radius: 48px;
      padding: 28px 20px;
      text-align: center;
      transform: scale(0.94);
      transition: 0.2s cubic-bezier(0.2, 0.95, 0.4, 1.1);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-box h3 {
      font-size: 26px;
      background: linear-gradient(135deg, #b0ffec, #6bc8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 16px;
    }

    .modal-box p {
      font-size: 16px;
      margin-bottom: 28px;
      opacity: 0.9;
    }

    .modal-buttons {
      display: flex;
      gap: 14px;
    }

    .modal-btn {
      flex: 1;
      padding: 13px 0;
      border-radius: 60px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: 0.1s;
    }
    
    .modal-btn:active {
      transform: scale(0.96);
    }

    .btn-confirm {
      background: linear-gradient(90deg, #2effc2, #2a82ff);
      color: black;
    }

    .btn-cancel {
      background: rgba(255,255,255,0.12);
      color: white;
      border: 0.5px solid #ffffff40;
    }

    .polygon-tag {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 9px;
      background: #1e2a3a99;
      padding: 4px 12px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      pointer-events: none;
      z-index: 5;
    }
    
    /* Fix scrolling and layout stability */
    @media (max-width: 520px) {
      .tapBtn {
        width: 220px;
        height: 220px;
      }
      .stat-card {
        padding: 4px 12px;
        font-size: 13px;
      }
      .glass-panel {
        padding: 18px 16px;
      }
    }
    
    /* No overflow issues */
    .main::-webkit-scrollbar {
      width: 4px;
    }
  </style>
</head>
<body>
<div class="topbar">
  <div class="stat-card"><span>🔋</span> <span class="stat-number" id="energy">50</span></div>
  <div class="stat-card"><span>⚡</span> <span class="stat-number" id="points">0</span></div>
  <div class="stat-card"><span>💎</span> <span class="stat-number" id="gpvlt">0.0000</span></div>
</div>

<div class="main">
  <div class="tap-wrapper">
    <button class="tapBtn" id="tapButton">
      <img src="images/IMG_1850.png" alt="Tap GPVLT" onerror="this.src='https://placehold.co/300x300/0c2740/55ffcc?text=⚡TAP'">
    </button>
  </div>

  <div class="glass-panel">
    <input id="walletInput" class="input-fancy" placeholder="🔗 Polygon Wallet" readonly>
    <button class="actionBtn" id="walletBtn">🌐 CONNECT WALLET (POLYGON)</button>
    <div class="status-badge" id="walletStatus">✅ Wallet connected & synced</div>
    <button class="actionBtn" id="buyEnergyBtn">💎 BUY ENERGY (100k)</button>
    <button class="actionBtn" id="swapPointsBtn">🔄 SWAP POINTS → GPVLT</button>
    <button class="actionBtn" id="claimGpvtBtn">🏆 CLAIM GPVLT</button>
  </div>
  <div class="info-tip">
    🔹 1 Tap = 1 Point &nbsp;&nbsp;|&nbsp;&nbsp; 10,000 Points = 1 GPVLT <br>
    🔸 100 GPVLT = 1 PVLT &nbsp;|&nbsp; ⚡ Energy +1 / 30 sec &nbsp;|&nbsp; 🌐 Polygon Mainnet
  </div>
</div>
<div class="polygon-tag">⚡ POLYGON NETWORK</div>

<!-- buy modal -->
<div class="modal-overlay" id="buyModal">
  <div class="modal-box">
    <h3>⚡ ENERGY REFILL</h3>
    <p>Buy <strong style="color:#aaffdd">100,000 Energy</strong><br>for <strong style="color:#ffe0a0">100 PVLT</strong></p>
    <div class="modal-buttons">
      <button class="modal-btn btn-cancel" id="cancelModalBtn">Cancel</button>
      <button class="modal-btn btn-confirm" id="confirmPaymentBtn">Confirm</button>
    </div>
  </div>
</div>

<script>
  /* ========== POLYGON CONFIGURATION (MAINNET) ========== */
  // REPLACED all PVLTG and pvltg references to GPVLT / gpvlt as requested
  const API = "https://pvlt-server.onrender.com";
  const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";
  const PVLT_TOKEN_ADDRESS = "0xC096dB70Fa05255b210Be58Ec2508Bed61e8dfD6";
  const GPVLT_TOKEN_ADDRESS = "0x3094Dc50cB01721eE6c0ECAf18bd0D15c154ba2d"; // originally PVLTG now GPVLT
  const GAME_TREASURY_ADDRESS = "0xe2bb81bD8e36367F2C85c89F0B03570dFCaf5D57";
  const TOKEN_DECIMALS = 18;
  const POLYGON_CHAIN_ID = 137;
  const POLYGON_NETWORK_NAME = "Polygon Mainnet";

  let web3Provider = null;
  let wallet = "";
  let points = 0;
  let energy = 50;
  let gpvlt = 0; // renamed from pvltg

  // Update UI
  function updateUI() {
    document.getElementById("energy").innerText = Math.floor(energy);
    document.getElementById("points").innerText = points;
    document.getElementById("gpvlt").innerText = Number(gpvlt).toFixed(4);
  }

  // MODAL helpers
  function openBuyModal() {
    if (!wallet) { alert("🔐 Connect Polygon wallet first"); return; }
    document.getElementById("buyModal").classList.add("active");
  }
  function closeBuyModal() {
    document.getElementById("buyModal").classList.remove("active");
  }

  // Ensure Polygon network helper
  async function switchToPolygon(provider) {
    try {
      await provider.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x89" }],
      });
      return true;
    } catch (switchError) {
      if (switchError.code === 4902) {
        try {
          await provider.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: "0x89",
              chainName: "Polygon Mainnet",
              nativeCurrency: { name: "MATIC", symbol: "MATIC", decimals: 18 },
              rpcUrls: ["https://polygon-rpc.com"],
              blockExplorerUrls: ["https://polygonscan.com"]
            }]
          });
          return true;
        } catch (addError) {
          console.error(addError);
          return false;
        }
      }
      console.error(switchError);
      return false;
    }
  }

  // CONNECT WALLET + force Polygon
  async function connectWallet() {
    try {
      let providerRaw = null;
      if (window.ethereum) {
        providerRaw = window.ethereum;
        await providerRaw.request({ method: "eth_requestAccounts" });
        web3Provider = new ethers.providers.Web3Provider(providerRaw);
      } else {
        const WalletConnectProvider = window["@walletconnect/ethereum-provider"].EthereumProvider;
        const wcProvider = await WalletConnectProvider.init({
          projectId: PROJECT_ID,
          chains: [POLYGON_CHAIN_ID],
          showQrModal: true,
          optionalChains: [137],
          rpcMap: { 137: "https://polygon-rpc.com" }
        });
        await wcProvider.connect();
        web3Provider = new ethers.providers.Web3Provider(wcProvider);
        providerRaw = wcProvider;
      }

      const network = await web3Provider.getNetwork();
      if (network.chainId !== POLYGON_CHAIN_ID) {
        const switched = await switchToPolygon(providerRaw);
        if (!switched) {
          alert("⚠️ Please switch to Polygon Mainnet manually in your wallet.");
          return;
        }
        if (window.ethereum) web3Provider = new ethers.providers.Web3Provider(window.ethereum);
        const newNetwork = await web3Provider.getNetwork();
        if (newNetwork.chainId !== POLYGON_CHAIN_ID) {
          alert("❌ Wrong network. Must be Polygon Mainnet (chainId 137).");
          return;
        }
      }

      const signer = web3Provider.getSigner();
      wallet = await signer.getAddress();
      document.getElementById("walletInput").value = wallet.slice(0,6) + "..." + wallet.slice(-4);
      document.getElementById("walletBtn").innerHTML = "✅ WALLET CONNECTED (POLYGON)";
      document.getElementById("walletStatus").style.display = "block";
      
      const res = await fetch(API + "/user", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await res.json();
      points = data.points ?? 0;
      energy = data.energy ?? 50;
      gpvlt = data.pvltg ?? data.gpvlt ?? 0;  // backend compatibility: pvltg stored, map to gpvlt
      updateUI();
    } catch (err) {
      console.error(err);
      alert("Connection failed: " + (err.message || "unknown"));
    }
  }

  // TAP action - FIXED tapping fully responsive with no layout break
  async function tapAction() {
    if (!wallet) { alert("Connect wallet (Polygon) to earn points"); return; }
    try {
      const res = await fetch(API + "/tap", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      points = data.points;
      energy = data.energy;
      updateUI();
      if (navigator.vibrate) navigator.vibrate(12);
      // Visual tap ripple effect on button (instant feedback)
      const btn = document.getElementById("tapButton");
      btn.style.transform = "scale(0.93)";
      setTimeout(() => { if(btn) btn.style.transform = ""; }, 100);
    } catch (err) { console.error(err); alert("Tap error, check connection"); }
  }

  // BUY ENERGY (100 PVLT -> 100k energy)
  async function executeEnergyPurchase() {
    const confirmBtn = document.getElementById("confirmPaymentBtn");
    try {
      if (!wallet) throw new Error("Connect wallet first");
      confirmBtn.innerText = "⏳ PROCESSING...";
      confirmBtn.disabled = true;
      if (!web3Provider) throw new Error("Wallet provider missing");
      const network = await web3Provider.getNetwork();
      if (network.chainId !== POLYGON_CHAIN_ID) {
        alert("🌐 Please set your wallet to Polygon Mainnet (chainId 137)");
        return;
      }
      const signer = web3Provider.getSigner();
      const tokenContract = new ethers.Contract(
        PVLT_TOKEN_ADDRESS,
        [
          "function transfer(address to, uint256 amount) external returns(bool)",
          "function balanceOf(address owner) view returns(uint256)"
        ],
        signer
      );
      const amount = ethers.utils.parseUnits("100", TOKEN_DECIMALS);
      const balance = await tokenContract.balanceOf(wallet);
      if (balance.lt(amount)) {
        alert(`❌ Insufficient PVLT. Need 100 PVLT. Balance: ${ethers.utils.formatUnits(balance, TOKEN_DECIMALS)} PVLT`);
        return;
      }
      closeBuyModal();
      alert("📡 Confirm transaction in wallet (Polygon network)...");
      const tx = await tokenContract.transfer(GAME_TREASURY_ADDRESS, amount);
      await tx.wait();
      
      const refillRes = await fetch(API + "/refill", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet, txHash: tx.hash })
      });
      const refillData = await refillRes.json();
      if (refillData.error) throw new Error(refillData.error);
      energy = refillData.energy;
      updateUI();
      alert(`✅ +100,000 ENERGY! New energy: ${energy}`);
    } catch (err) {
      console.error(err);
      let msg = err.reason || err.data?.message || err.message || "Transaction failed";
      alert("❌ Energy purchase failed on Polygon:\n" + msg);
    } finally {
      confirmBtn.innerText = "Confirm";
      confirmBtn.disabled = false;
      closeBuyModal();
    }
  }

  // SWAP POINTS -> GPVLT (replaced pvltg)
  async function swapPointsToGPVLT() {
    if (!wallet) { alert("Connect wallet first"); return; }
    if (points < 1) { alert("No points to swap. Tap more!"); return; }
    try {
      const res = await fetch(API + "/swap-points", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      points = 0;
      gpvlt = data.pvltg; // backend returns pvltg but we assign to gpvlt variable
      updateUI();
      alert(`✨ Swapped! GPVLT balance: ${gpvlt.toFixed(4)}`);
    } catch (err) { alert("Swap failed"); console.error(err); }
  }

  // CLAIM GPVLT (rename from claimPVLT) -> Convert GPVLT to PVLT requiring 100 GPVLT
  async function claimGPVLT() {
    if (!wallet) { alert("Connect wallet"); return; }
    if (gpvlt < 100) {
      alert(`⚠️ Minimum 100 GPVLT required to claim PVLT. Current: ${gpvlt.toFixed(4)}`);
      return;
    }
    try {
      const signer = web3Provider.getSigner();
      const pvltTokenContract = new ethers.Contract(
        PVLT_TOKEN_ADDRESS,
        ["function approve(address spender, uint256 amount) external returns(bool)"],
        signer
      );
      const amountToApprove = ethers.utils.parseUnits(gpvlt.toString(), TOKEN_DECIMALS);
      const approveTx = await pvltTokenContract.approve(GAME_TREASURY_ADDRESS, amountToApprove);
      await approveTx.wait();
      
      const res = await fetch(API + "/claim-pvltg", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      gpvlt = 0;
      updateUI();
      alert("🎉 PVLT Claimed Successfully! Tokens transferred on Polygon.");
    } catch (err) {
      console.error(err);
      alert("Claim failed: " + (err.message || "unknown error"));
    }
  }

  // auto energy regeneration (local)
  let localRegenInterval = null;
  function startLocalEnergyRegen() {
    if (localRegenInterval) clearInterval(localRegenInterval);
    localRegenInterval = setInterval(() => {
      if (wallet && energy < 5000) {
        energy = Math.min(energy + 1, 9999);
        updateUI();
      } else if (!wallet) {
        // no action
      }
    }, 30000);
  }
  startLocalEnergyRegen();
  
  // ========== FIXED LAYOUT & TAPPING: attach event listeners properly ==========
  // Ensure tapping works even on mobile without layout shift. Using addEventListener for better control
  document.addEventListener("DOMContentLoaded", () => {
    const tapBtn = document.getElementById("tapButton");
    if (tapBtn) {
      // Remove any existing inline onclick to prevent duplication, use eventListener for robust
      tapBtn.removeEventListener("click", tapAction);
      tapBtn.addEventListener("click", (e) => {
        e.preventDefault();
        tapAction();
      });
      // For touch devices ensure no zoom interference
      tapBtn.addEventListener("touchstart", (e) => {
        // just to ensure fast feedback; not preventing defaults to keep scroll possible elsewhere
        tapBtn.style.transform = "scale(0.93)";
      }, { passive: false });
      tapBtn.addEventListener("touchend", () => {
        setTimeout(() => { if(tapBtn) tapBtn.style.transform = ""; }, 80);
      });
      tapBtn.addEventListener("touchcancel", () => {
        if(tapBtn) tapBtn.style.transform = "";
      });
    }
    
    // Re-assign other button actions dynamically to ensure no conflicts
    const walletConnectBtn = document.getElementById("walletBtn");
    if(walletConnectBtn) walletConnectBtn.onclick = connectWallet;
    
    const buyEnergyBtn = document.getElementById("buyEnergyBtn");
    if(buyEnergyBtn) buyEnergyBtn.onclick = openBuyModal;
    
    const swapPointsBtn = document.getElementById("swapPointsBtn");
    if(swapPointsBtn) swapPointsBtn.onclick = swapPointsToGPVLT;
    
    const claimGpvtBtn = document.getElementById("claimGpvtBtn");
    if(claimGpvtBtn) claimGpvtBtn.onclick = claimGPVLT;
    
    const confirmModalBtn = document.getElementById("confirmPaymentBtn");
    if(confirmModalBtn) confirmModalBtn.onclick = executeEnergyPurchase;
    
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    if(cancelModalBtn) cancelModalBtn.onclick = closeBuyModal;
    
    // Optional modal close on overlay click
    const modalOverlay = document.getElementById("buyModal");
    if(modalOverlay) {
      modalOverlay.addEventListener("click", (e) => {
        if(e.target === modalOverlay) closeBuyModal();
      });
    }
  });
  
  // Network & account change handlers
  if (window.ethereum) {
    window.ethereum.on('accountsChanged', (accounts) => {
      if (accounts.length === 0) {
        wallet = "";
        document.getElementById("walletInput").value = "";
        document.getElementById("walletBtn").innerHTML = "🌐 CONNECT WALLET (POLYGON)";
        document.getElementById("walletStatus").style.display = "none";
        points = 0; energy = 50; gpvlt = 0;
        updateUI();
      } else {
        window.location.reload();
      }
    });
    window.ethereum.on('chainChanged', (chainId) => {
      if (chainId !== "0x89") {
        alert("Please switch to Polygon Mainnet for gameplay.");
      }
      window.location.reload();
    });
  }
  
  updateUI();
</script>
</body>
</html>
