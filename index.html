<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PepeVolt</title>

<style>
body {
    margin:0;
    background:#0f0f12;
    font-family:sans-serif;
    color:white;
}

/* TOP NAV */
.top-nav {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:12px 10px;
    background:#11131a;
    border-bottom:1px solid #222;
    font-size:20px;
}

/* NAV ITEMS */
.nav-item {
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
}

/* CENTER LAYOUT */
.center {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
}

/* TAP CIRCLE */
.tap-circle {
    width:140px;
    height:140px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #3b82f6, #1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
    box-shadow:0 0 20px rgba(59,130,246,0.6);
    transition:0.2s;
}

.tap-circle:active {
    transform:scale(0.92);
    box-shadow:0 0 35px rgba(59,130,246,0.9);
}

/* CONNECT BUTTON */
#connect-button {
    padding:14px 28px;
    font-size:16px;
    font-weight:600;
    color:#fff;
    background:#3b82f6;
    border:none;
    border-radius:50px;
    cursor:pointer;
    transition:0.3s;
}

#connect-button:hover {
    background:#2563eb;
    transform:scale(1.05);
}

/* EXTRA BUTTONS */
.action-btn {
    width:180px;
    padding:12px;
    font-size:14px;
    font-weight:600;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
}

.buy-energy {
    background:#f59e0b;
}

.buy-energy:hover {
    background:#d97706;
}

.claim-pvlt {
    background:#10b981;
}

.claim-pvlt:hover {
    background:#059669;
}
</style>
</head>

<body>

<!-- TOP NAV -->
<div class="top-nav">
    <div class="nav-item">⚡ 0</div>
    <div class="nav-item">🪙 0</div>
    <div class="nav-item">💎 0</div>
</div>

<!-- CENTER -->
<div class="center">

    <!-- TAP CIRCLE -->
    <div class="tap-circle" id="tap-circle">
        TAP
    </div>

    <!-- CONNECT BUTTON -->
    <button id="connect-button">Connect Wallet</button>

    <!-- NEW BUTTONS -->
    <button class="action-btn buy-energy" id="buy-energy">Buy Energy</button>
    <button class="action-btn claim-pvlt" id="claim-pvlt">Claim PVLT</button>

</div>

<script type="module">
import { createAppKit } from "https://esm.sh/@reown/appkit"
import { EthersAdapter } from "https://esm.sh/@reown/appkit-adapter-ethers"
import { mainnet, polygon } from "https://esm.sh/@reown/appkit/networks"

const projectId = "1731f99148b9cf6107dee70b6efb14b7"

const modal = createAppKit({
    projectId,
    adapters: [new EthersAdapter()],
    networks: [mainnet, polygon],
    metadata: {
        name: "PepeVolt",
        description: "Connect Wallet",
        url: window.location.origin,
        icons: ["https://avatars.githubusercontent.com/u/37784886"]
    }
})

// CONNECT WALLET
document.getElementById("connect-button").addEventListener("click", () => {
    modal.open()
})

// TAP CLICK
document.getElementById("tap-circle").addEventListener("click", () => {
    console.log("Tapped!")
})

// BUY ENERGY
document.getElementById("buy-energy").addEventListener("click", () => {
    console.log("Buy Energy clicked")
})

// CLAIM PVLT
document.getElementById("claim-pvlt").addEventListener("click", () => {
    console.log("Claim PVLT clicked")
})
</script>

</body>
</html>
