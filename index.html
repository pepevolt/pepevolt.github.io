<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PepeVolt</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d1025;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:manipulation;
    user-select:none;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:430px;
    height:100vh;
    overflow:hidden;
    position:relative;
    background:
    radial-gradient(circle at top,#182b49,#0d1025 60%);
}

/* TOP NAV */

.top-nav{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    z-index:999;
    padding:18px 14px;
    background:rgba(25,38,60,0.95);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.top-grid{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.top-box{
    flex:1;
    text-align:center;
}

.top-title{
    font-size:15px;
    font-weight:700;
    color:white;
}

.top-value{
    margin-top:10px;
    font-size:20px;
    font-weight:900;
    color:#29ff8a;
}

/* MAIN */

.main{
    height:100%;
    overflow-y:auto;
    padding-top:130px;
    padding-bottom:120px;
}

/* TAP */

.tap-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:40px;
    margin-bottom:40px;
}

.tap-btn{
    width:230px;
    height:230px;
    border:none;
    border-radius:50%;
    cursor:pointer;

    background:
    radial-gradient(circle,#34d27a,#28be68);

    color:#08111f;
    font-size:58px;
    font-weight:900;

    box-shadow:
    0 0 45px rgba(52,210,122,0.55);

    transition:0.08s;
}

.tap-btn:active{
    transform:scale(0.94);
}

/* BUTTONS */

.action-area{
    width:100%;
    padding:0 22px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.action-btn{
    width:100%;
    border:none;
    border-radius:18px;
    padding:22px 18px;
    cursor:pointer;

    font-size:18px;
    font-weight:800;
    color:white;

    background:
    linear-gradient(
        135deg,
        #ff961d,
        #eb7e1a
    );

    box-shadow:
    0 10px 25px rgba(255,140,30,0.18);
}

.wallet-btn{
    background:
    linear-gradient(
        135deg,
        #31a7ff,
        #3f8fe5
    );
}

.info-box{
    margin:25px 22px;
    padding:22px;
    border-radius:22px;

    background:
    rgba(255,255,255,0.06);

    border:
    1px solid rgba(255,255,255,0.08);
}

.info-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:18px;
}

.info-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    opacity:0.9;
    line-height:1.5;
}

/* FOOTER */

.footer{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);

    width:100%;
    max-width:430px;

    background:#1a2232;

    border-top:
    1px solid rgba(255,255,255,0.08);

    display:flex;
    justify-content:space-around;

    padding:14px 0;
}

.footer-item{
    font-size:14px;
    opacity:0.85;
}

/* LOADING */

.loading{
    opacity:0.6;
    pointer-events:none;
}

</style>
</head>

<body>

<div class="app">

    <!-- TOP NAV -->
    <div class="top-nav">

        <div class="top-grid">

            <div class="top-box">
                <div class="top-title">
                    ⚡ Energy
                </div>

                <div id="energy" class="top-value">
                    50
                </div>
            </div>

            <div class="top-box">
                <div class="top-title">
                    💎 Points
                </div>

                <div id="points" class="top-value">
                    0
                </div>
            </div>

            <div class="top-box">
                <div class="top-title">
                    🌕 gPVLT
                </div>

                <div id="gpvlt" class="top-value">
                    0
                </div>
            </div>

        </div>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- TAP -->
        <div class="tap-wrap">

            <button id="tapBtn" class="tap-btn">
                TAP
            </button>

        </div>

        <!-- BUTTONS -->
        <div class="action-area">

            <button
            id="walletBtn"
            class="action-btn wallet-btn">

                Connect Wallet

            </button>

            <button
            id="buyEnergyBtn"
            class="action-btn">

                ⚡ Buy 10,000 Energy (100 PVLT)

            </button>

            <button
            id="convertBtn"
            class="action-btn">

                💎 Convert 10 Points → 1 gPVLT

            </button>

            <button
            id="claimBtn"
            class="action-btn">

                🌕 Claim 1 PVLT (10 gPVLT)

            </button>

        </div>

        <!-- INFO -->
        <div class="info-box">

            <div class="info-title">
                How it works
            </div>

            <div class="info-list">

                <div>
                    • Free users automatically refill to 50 Energy.
                </div>

                <div>
                    • Premium users receive 10,000 Energy.
                </div>

                <div>
                    • 1 Tap = 1 Point.
                </div>

                <div>
                    • 10 Points = 1 gPVLT.
                </div>

                <div>
                    • 10 gPVLT = 1 PVLT reward.
                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">

        <div class="footer-item">
            Home
        </div>

        <div class="footer-item">
            Markets
        </div>

        <div class="footer-item">
            Discover
        </div>

        <div class="footer-item">
            Assets
        </div>

    </div>

</div>

<script>

const PVLT_ADDRESS =
"0x5f7df6862f439b691507dc20069f4f73a37cb08b";

const TREASURY_ADDRESS =
"0x4251Ef24D10bf637494C173621F5f84262e9Bda5";

const GAME_ADDRESS =
"0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

const GAME_ABI = [

    "function tap() external",

    "function convertPoints() external",

    "function refillEnergy() external",

    "function players(address) view returns(uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"

];

const TREASURY_ABI = [

    "function claimRewards() external"

];

const ERC20_ABI = [

    "function approve(address spender,uint256 amount) external returns(bool)"

];

let provider;
let signer;
let user;

let game;
let treasury;
let pvlt;

const walletBtn =
document.getElementById("walletBtn");

/* CONNECT */

async function connectWallet(){

    if(!window.ethereum){

        alert("Install MetaMask");

        return;
    }

    provider =
    new ethers.providers.Web3Provider(window.ethereum);

    await provider.send(
        "eth_requestAccounts",
        []
    );

    const network =
    await provider.getNetwork();

    if(network.chainId !== 137){

        alert("Switch to Polygon Mainnet");

        return;
    }

    signer =
    provider.getSigner();

    user =
    await signer.getAddress();

    game =
    new ethers.Contract(
        GAME_ADDRESS,
        GAME_ABI,
        signer
    );

    treasury =
    new ethers.Contract(
        TREASURY_ADDRESS,
        TREASURY_ABI,
        signer
    );

    pvlt =
    new ethers.Contract(
        PVLT_ADDRESS,
        ERC20_ABI,
        signer
    );

    walletBtn.innerText =
    "Disconnect: " +
    user.slice(0,6) +
    "..." +
    user.slice(-4);

    await loadPlayer();
}

/* LOAD PLAYER */

async function loadPlayer(){

    if(!user) return;

    try{

        const data =
        await game.players(user);

        let energy =
        Number(data.energy);

        const points =
        Number(data.points);

        const gpvlt =
        Number(data.burnedGPVLT);

        // AUTO REFILL UI DISPLAY
        if(energy <= 0){

            await game.refillEnergy();

            energy = 50;
        }

        document.getElementById(
            "energy"
        ).innerText = energy;

        document.getElementById(
            "points"
        ).innerText = points;

        document.getElementById(
            "gpvlt"
        ).innerText = gpvlt;

    }catch(err){

        console.log(err);
    }
}

/* EXECUTOR */

async function execute(
    button,
    callback
){

    try{

        button.classList.add(
            "loading"
        );

        const tx =
        await callback();

        await tx.wait();

        await loadPlayer();

    }catch(err){

        console.log(err);

        alert(
            err?.data?.message ||
            err?.message ||
            "Transaction failed"
        );
    }

    button.classList.remove(
        "loading"
    );
}

/* TAP */

document.getElementById(
    "tapBtn"
).onclick = async(e)=>{

    await execute(
        e.target,
        ()=>game.tap()
    );
};

/* CONVERT */

document.getElementById(
    "convertBtn"
).onclick = async(e)=>{

    await execute(
        e.target,
        ()=>game.convertPoints()
    );
};

/* CLAIM */

document.getElementById(
    "claimBtn"
).onclick = async(e)=>{

    await execute(
        e.target,
        ()=>treasury.claimRewards()
    );
};

/* BUY ENERGY */

document.getElementById(
    "buyEnergyBtn"
).onclick = async()=>{

    alert(
        "Your smart contract does not include buyEnergy() yet."
    );
};

/* WALLET */

walletBtn.onclick =
connectWallet;

window.ethereum?.on(
    "accountsChanged",
    ()=>window.location.reload()
);

window.ethereum?.on(
    "chainChanged",
    ()=>window.location.reload()
);

</script>

</body>
</html>
