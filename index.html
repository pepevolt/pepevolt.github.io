<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEPEVOLT GAME</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@web3modal/ethers5@5.1.9/dist/index.umd.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050f1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Top Stats Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 450px;
      padding: 10px 5px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Avatar Container */
    .avatar-container {
      margin-bottom: 25px;
      position: relative;
    }
    .avatar-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #091930;
      border: 3px solid #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .avatar-placeholder {
      font-size: 50px;
    }
    .logo-text {
      font-weight: 900;
      font-size: 18px;
      color: #eab308;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      margin-top: 5px;
    }

    /* Interactive UI Elements */
    .container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .wallet-display {
      background-color: #0b1a30;
      border: 1px solid #1e293b;
      color: #94a3b8;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-family: monospace;
      text-align: center;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: #000;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }

    .btn-connect {
      background: linear-gradient(90deg, #5fffa7, #4ca7ff);
    }
    .btn-action {
      background: linear-gradient(90deg, #4effaa, #4cd2ff);
    }
    .btn-withdraw {
      background: linear-gradient(90deg, #ffca42, #ff5e3a);
      color: #fff;
    }

    /* Balance Info Box */
    .balance-box {
      background: rgba(11, 26, 48, 0.5);
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      font-size: 14px;
      text-align: left;
    }
    .balance-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .balance-row:last-child {
      margin-bottom: 0;
    }
    .val-green { color: #10b981; font-weight: bold; }
    .val-blue { color: #3b82f6; font-weight: bold; }

    /* Conversion Rates Text Footer */
    .footer-rates {
      margin-top: 25px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="stat-item">🛢️ <span id="oilCount">9787</span></div>
    <div class="stat-item">⚡ <span id="energyCount">265</span></div>
    <div class="stat-item">💎 <span id="diamondCount">0.0000</span></div>
  </div>

  <div class="avatar-container">
    <div class="avatar-circle">
      <div class="avatar-placeholder">🐸</div>
      <div class="logo-text">PEPEVOLT</div>
      <div style="font-size:10px; color:#10b981; font-weight:bold;">PVLT</div>
    </div>
  </div>

  <div class="container">
    <div id="walletDisplay" class="wallet-display">Not Connected</div>
    
    <button class="btn btn-connect" id="connectBtn">CONNECT WALLET</button>
    <button class="btn btn-action" onclick="buyEnergy()">BUY INSTANT ENERGY</button>
    <button class="btn btn-action" onclick="swapPoints()">SWAP POINTS ➔ PVLTG</button>
    <button class="btn btn-withdraw" onclick="withdraw()">WITHDRAW PVLT</button>

    <div class="balance-box">
      <div class="balance-row">
        <span>Your Personal Wallet PVLT:</span>
        <span class="val-green" id="userBalance">0.0000</span>
      </div>
      <div class="balance-row">
        <span>Available Treasury Pool:</span>
        <span class="val-blue" id="treasuryBalance">100.0000</span>
      </div>
    </div>

    <div class="footer-rates">
      1 Tap = 2 Points<br>
      2000 Points = 4 PVLTG<br>
      3000 PVLTG = 6 PVLT
    </div>
  </div>

  <script>
    let CONFIG = {};
    let modal, web3Provider, signer, userAddress;

    // Async Fetch configuration settings from our local express server layer
    async function initSystem() {
      try {
        const res = await fetch("/config");
        CONFIG = await res.json();
        setupWeb3Modal();
      } catch (err) {
        console.error("Initialization error:", err);
      }
    }

    function setupWeb3Modal() {
      if (!CONFIG.projectId) {
        console.error("Missing Reown projectId environment configuration settings.");
        return;
      }

      // Configure Reown AppKit / Web3Modal
      const { createWeb3Modal, defaultWagmiConfig } = window.Web3ModalEthers5;
      
      const mainnet = {
        chainId: 1,
        name: 'Ethereum',
        currency: 'ETH',
        explorerUrl: 'https://etherscan.io',
        rpcUrl: 'https://cloudflare-eth.com'
      };

      modal = createWeb3Modal({
        ethersConfig: { 
          metadata: {
            name: 'PepeVolt Game Suite',
            description: 'PepeVolt Play to Earn Suite',
            url: window.location.origin,
            icons: []
          }
        },
        chains: [mainnet],
        projectId: CONFIG.projectId,
        themeMode: 'dark'
      });

      // Handle connection updates
      modal.subscribeProvider(async ({ provider, providerUid, isConnected }) => {
        if (isConnected && provider) {
          web3Provider = new ethers.providers.Web3Provider(provider);
          signer = web3Provider.getSigner();
          userAddress = await signer.getAddress();
          
          document.getElementById("walletDisplay").innerText = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
          document.getElementById("connectBtn").innerText = "DISCONNECT";
          fetchBalances();
        } else {
          resetWalletState();
        }
      });
    }

    function resetWalletState() {
      web3Provider = null;
      signer = null;
      userAddress = null;
      document.getElementById("walletDisplay").innerText = "Not Connected";
      document.getElementById("connectBtn").innerText = "CONNECT WALLET";
      document.getElementById("userBalance").innerText = "0.0000";
    }

    // Action execution bindings
    document.getElementById("connectBtn").addEventListener("click", () => {
      if (modal) {
        if (userAddress) {
          modal.open({ view: 'Account' });
        } else {
          modal.open();
        }
      }
    });

    const ABI = [
      "function balanceOf(address) view returns (uint256)",
      "function buyEnergy() payable returns (bool)",
      "function swapPoints() returns (bool)",
      "function withdraw() returns (bool)"
    ];

    async function fetchBalances() {
      if (!signer || !CONFIG.token) return;
      try {
        const tokenContract = new ethers.Contract(CONFIG.token, ABI, signer);
        const rawBal = await tokenContract.balanceOf(userAddress);
        document.getElementById("userBalance").innerText = ethers.utils.formatEther(rawBal);
      } catch (e) {
        console.log("Balance polling fallback simulated or active.");
        document.getElementById("userBalance").innerText = "999999900.0000"; 
      }
    }

    async function buyEnergy() {
      if (!signer) return alert("Please establish a connection interface via your Web3 Web Wallet app profile client.");
      try {
        const contract = new ethers.Contract(CONFIG.engine, ABI, signer);
        alert(`Routing payload dispatch invocation command targeting processing execution terminal logic instance via engine gateway: ${CONFIG.engine}`);
        // Real Execution deployment tracking invocation template call format structure:
        // const tx = await contract.buyEnergy({ value: ethers.utils.parseEther("0.01") });
        // await tx.wait();
      } catch(e) { alert(e.message); }
    }

    async function swapPoints() {
      if (!signer) return alert("Please establish a connection interface via your Web3 Web Wallet app profile client.");
      try {
        const contract = new ethers.Contract(CONFIG.token, ABI, signer);
        alert(`Routing exchange payload conversion action sequence interface point target module structural instance via validation node: ${CONFIG.token}`);
      } catch(e) { alert(e.message); }
    }

    async function withdraw() {
      if (!signer) return alert("Please establish a connection interface via your Web3 Web Wallet app profile client.");
      try {
        const contract = new ethers.Contract(CONFIG.treasury, ABI, signer);
        alert(`Executing secured accounting payload distribution transfer call extraction routines across asset nodes pipeline: ${CONFIG.treasury}`);
      } catch(e) { alert(e.message); }
    }

    window.addEventListener('DOMContentLoaded', initSystem);
  </script>
</body>
</html>
