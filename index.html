<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020b18] text-white p-6">
    <div class="max-w-sm mx-auto space-y-6">
        <div class="flex justify-between p-4 bg-slate-900 rounded-xl">
            <span id="energy">🔋 0</span>
            <span id="points">⚡ 0</span>
        </div>

        <button onclick="apiCall('tap')" class="w-full h-64 bg-green-500 rounded-full text-8xl">🐸</button>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="apiCall('buyEnergy')" class="p-4 bg-purple-600 rounded-xl">BUY</button>
            <button onclick="apiCall('convertPoints')" class="p-4 bg-blue-600 rounded-xl">CONVERT</button>
            <button onclick="apiCall('claimRewards')" class="col-span-2 p-4 bg-green-600 rounded-xl">CLAIM</button>
        </div>
    </div>

    <script>
        // Your Render Server URL
        const SERVER_URL = "https://your-app-name.onrender.com";

        async function apiCall(endpoint) {
            const wallet = localStorage.getItem('wallet'); // Assuming wallet stored after login
            const res = await fetch(`${SERVER_URL}/${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ wallet })
            });
            const data = await res.json();
            alert(data.message || "Success");
            updateStats();
        }

        async function updateStats() {
            const wallet = localStorage.getItem('wallet');
            const res = await fetch(`${SERVER_URL}/status?wallet=${wallet}`);
            const data = await res.json();
            document.getElementById('energy').innerText = `🔋 ${data.energy}`;
            document.getElementById('points').innerText = `⚡ ${data.points}`;
        }
    </script>
</body>
</html>
