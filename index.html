<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
/>

<title>PEPE VOLT</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:manipulation;
}

body{
    overscroll-behavior:none;
}

.container{
    width:100%;
    max-width:420px;
    margin:auto;
    height:100vh;
    overflow-y:auto;
    padding:20px;
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid #00ff99;
    margin-top:10px;
    box-shadow:0 0 20px #00ff99;
}

h1{
    margin-top:15px;
    color:#00ff99;
    font-size:32px;
}

.contract{
    margin-top:15px;
    font-size:12px;
    color:#94a3b8;
    word-break:break-all;
}

.card{
    margin-top:20px;
    background:#111827;
    padding:20px;
    border-radius:18px;
}

.points{
    margin-top:15px;
    font-size:48px;
    color:#00ff99;
    font-weight:bold;
}

.small{
    margin-top:12px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
}

.tap-btn{

    width:220px;
    height:220px;

    border:none;
    border-radius:50%;

    margin-top:25px;

    background:#00ff99;
    color:black;

    font-size:34px;
    font-weight:bold;

    touch-action:manipulation;

    user-select:none;
    -webkit-user-select:none;

    cursor:pointer;

    transition:transform 0.05s ease;
}

.tap-btn:active{
    transform:scale(0.96);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    margin-top:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.connect{
    background:#00ff99;
    color:black;
}

.withdraw{
    background:#facc15;
    color:black;
}

.dashboard{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.box{
    flex:1;
    background:#111827;
    padding:15px;
    border-radius:15px;
}

.box h3{
    color:#00ff99;
    margin-bottom:8px;
}

.reward{
    margin-top:10px;
    color:#00ff99;
    font-size:20px;
}

.footer{
    margin-top:20px;
    margin-bottom:40px;
    color:#64748b;
    font-size:12px;
}

</style>
</head>

<body>

<div class="container">

<img
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Bitmap_VS_SVG.svg"
/>

<h1>PEPE VOLT</h1>

<div class="contract">
0xa263d765b897b4777f0ad4a938d12d79e789ffff
</div>

<button
class="connect"
id="connectBtn"
>
Connect Wallet
</button>

<div class="card">

<h2>Tap To Earn</h2>

<div
class="points"
id="points"
>
0
</div>

<div class="small">
1 Tap = 1 Point
<br>
1000 Points = 1 PVLT
<br>
1 PVLT = 0.000000001 BNB
<br><br>
Stop tapping for 3 seconds and current session resets.
</div>

<button
class="tap-btn"
id="tapBtn"
>
⚡ TAP
</button>

</div>

<div class="dashboard">

<div class="box">
<h3>Wallet</h3>

<p id="wallet">
Not Connected
</p>

</div>

<div class="box">
<h3>Global</h3>

<p id="globalPoints">
0
</p>

</div>

</div>

<div class="card">

<h2>Rewards</h2>

<div
class="reward"
id="tokenBalance"
>
0 PVLT
</div>

<div
class="reward"
id="bnbValue"
>
0 BNB
</div>

<button
class="withdraw"
id="withdrawBtn"
>
Withdraw
</button>

</div>

<div class="footer">
PEPE VOLT Telegram Mini App
</div>

</div>

<script>

if(window.Telegram && Telegram.WebApp){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

}

let points = 0;
let globalPoints = 0;
let wallet = null;
let inactiveTimer = null;

const pointsEl =
document.getElementById("points");

const globalEl =
document.getElementById("globalPoints");

const tokenEl =
document.getElementById("tokenBalance");

const bnbEl =
document.getElementById("bnbValue");

function updateUI(){

    pointsEl.innerText = points;

    globalEl.innerText = globalPoints;

    const tokens =
    globalPoints / 1000;

    const bnb =
    tokens * 0.000000001;

    tokenEl.innerText =
    tokens.toFixed(4) + " PVLT";

    bnbEl.innerText =
    bnb.toFixed(12) + " BNB";

    if(wallet){

        localStorage.setItem(
            wallet+"_global",
            globalPoints
        );

    }
}

async function connectWallet(){

    if(typeof window.ethereum === "undefined"){

        alert(
            "Open inside MetaMask or Trust Wallet browser"
        );

        return;
    }

    try{

        const accounts =
        await window.ethereum.request({
            method:"eth_requestAccounts"
        });

        wallet = accounts[0];

        document.getElementById("wallet")
        .innerText =
        wallet.substring(0,6)
        + "..."
        +
        wallet.substring(wallet.length-4);

        document.getElementById("connectBtn")
        .innerText =
        "Connected";

        const saved =
        localStorage.getItem(
            wallet+"_global"
        );

        if(saved){

            globalPoints =
            parseInt(saved);

        }

        updateUI();

    }catch(e){

        alert("Wallet connection failed");

    }
}

function tapCoin(){

    points++;

    globalPoints++;

    updateUI();

    if(inactiveTimer){

        clearTimeout(inactiveTimer);

    }

    inactiveTimer = setTimeout(()=>{

        points = 0;

        updateUI();

    },3000);
}

function withdrawReward(){

    const tokens =
    globalPoints / 1000;

    if(tokens < 1){

        alert(
            "Minimum 1 PVLT required"
        );

        return;
    }

    alert(
        "Withdraw request submitted for "
        + tokens.toFixed(4)
        + " PVLT"
    );
}

document
.getElementById("connectBtn")
.addEventListener(
"touchstart",
connectWallet,
{passive:true}
);

document
.getElementById("tapBtn")
.addEventListener(
"touchstart",
function(e){

    e.preventDefault();

    tapCoin();

},
{passive:false}
);

document
.getElementById("withdrawBtn")
.addEventListener(
"touchstart",
function(e){

    e.preventDefault();

    withdrawReward();

},
{passive:false}
);

document.addEventListener(
"gesturestart",
function(e){
    e.preventDefault();
}
);

let lastTouchEnd = 0;

document.addEventListener(
"touchend",
function(event){

    const now =
    (new Date()).getTime();

    if(now - lastTouchEnd <= 300){

        event.preventDefault();

    }

    lastTouchEnd = now;

},
false
);

updateUI();

</script>

</body>
</html>
