<script>
let userAddress = null;
let provider = null;
let signer = null;

let energy = 50;
let points = 0;

const TREASURY_ADDRESS = "YOUR_TREASURY";
const PVLT_ADDRESS = "YOUR_PVLT";
const BACKEND_URL = "http://localhost:3000";

const ERC20_ABI = [
  "function balanceOf(address) view returns (uint256)",
  "function allowance(address,address) view returns (uint256)",
  "function approve(address,uint256) returns (bool)"
];

const TREASURY_ABI = [
  "function buyEnergyPack()",
  "function claimReward(uint256,uint256,bytes)"
];

// CONNECT WALLET
async function connectWallet() {
  provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();
  userAddress = await signer.getAddress();

  document.getElementById("wallet-display").innerText = userAddress;

  syncEnergy();
  syncPVLT();
}

// ENERGY SYNC FROM CONTRACT (FIXED)
async function syncEnergy() {
  const contract = new ethers.Contract(TREASURY_ADDRESS, ["function getEnergy(address) view returns(uint)"], provider);
  energy = await contract.getEnergy(userAddress);
  document.getElementById("top-energy").innerText = energy;
}

// PVLT BALANCE
async function syncPVLT() {
  const token = new ethers.Contract(PVLT_ADDRESS, ERC20_ABI, provider);
  const bal = await token.balanceOf(userAddress);
  document.getElementById("top-pvlt").innerText = ethers.utils.formatEther(bal);
}

// TAP
async function tap() {
  if (energy <= 0) return alert("No energy");

  energy--;
  points++;

  document.getElementById("top-energy").innerText = energy;
  document.getElementById("top-points").innerText = points;

  await fetch(`${BACKEND_URL}/tap`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ wallet: userAddress })
  });
}

// BUY ENERGY (FIXED)
async function buyEnergy() {
  const contract = new ethers.Contract(TREASURY_ADDRESS, TREASURY_ABI, signer);
  const token = new ethers.Contract(PVLT_ADDRESS, ERC20_ABI, signer);

  const cost = ethers.utils.parseEther("100");

  const allowance = await token.allowance(userAddress, TREASURY_ADDRESS);
  if (allowance.lt(cost)) {
    const tx = await token.approve(TREASURY_ADDRESS, cost);
    await tx.wait();
  }

  const tx2 = await contract.buyEnergyPack();
  await tx2.wait();

  alert("Energy Purchased");
  syncEnergy();
}

// CLAIM REWARD (FIXED SIGN FLOW)
async function claimReward() {

  const pvlt = Math.floor(points / 1000); // FIXED CONVERSION

  if (pvlt < 10) return alert("Min 10 PVLT");

  const nonce = Date.now();

  const res = await fetch(`${BACKEND_URL}/sign-reward`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      wallet: userAddress,
      amount: ethers.utils.parseEther(pvlt.toString()),
      nonce
    })
  });

  const data = await res.json();

  const contract = new ethers.Contract(TREASURY_ADDRESS, TREASURY_ABI, signer);

  const tx = await contract.claimReward(
    ethers.utils.parseEther(pvlt.toString()),
    nonce,
    data.signature
  );

  await tx.wait();

  alert("Reward Claimed");

  points = 0;
  document.getElementById("top-points").innerText = 0;

  syncPVLT();
}
</script>
