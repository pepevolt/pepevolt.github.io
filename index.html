<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>

html, body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
touch-action:none;
-webkit-text-size-adjust:100%;
}

body{
font-family:Arial;
background:radial-gradient(circle at top,#0b1220,#020617);
color:white;
position:fixed;
width:100%;
text-align:center;
}

.navbar{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;

background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);

border-bottom:1px solid rgba(255,255,255,0.08);

font-size:12px;
}

.container{
position:absolute;
top:60px;
left:0;
right:0;
bottom:0;

display:flex;
flex-direction:column;
align-items:center;

padding:15px;
gap:14px;
overflow:hidden;
}

h2{
margin:5px 0;
font-size:24px;

background:linear-gradient(90deg,#00ff99,#00ccff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tap{
width:190px;
height:190px;
border-radius:50%;

border:none;

background:linear-gradient(135deg,#00ff99,#00ccff);

font-size:24px;
font-weight:bold;
color:black;

box-shadow:0 0 30px rgba(0,255,200,0.35);
}

.tap:active{
transform:scale(0.96);
}

.live{
font-size:14px;
opacity:0.8;
}

.card{
width:90%;
max-width:360px;

padding:14px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.08);
border-radius:14px;

display:flex;
flex-direction:column;
gap:10px;
}

input{
width:100%;
padding:14px;

border:none;
outline:none;
border-radius:12px;

box-sizing:border-box;

background:rgba(0,0,0,0.35);
color:white;

font-size:14px;
}

button{
width:100%;
padding:14px;

border:none;
border-radius:12px;

font-weight:bold;
font-size:14px;

background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.info{
font-size:11px;
opacity:0.6;
}

.status{
font-size:12px;
color:#00ff99;
display:none;
}

.liveBox{
font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="navbar">

<div>
⚡ TOTAL:
<span id="totalPoints">0</span>
</div>

<div>
💎 TOTAL:
<span id="totalTokens">0.0000</span>
</div>

<div>
👤 <span id="userId">guest</span>
</div>

</div>

<!-- ================= MAIN ================= -->

<div class="container">

<h2>PVLT TAP GAME</h2>

<button
class="tap"
onclick="tap()"
>
TAP
</button>

<!-- LIVE SESSION -->

<div class="liveBox">
SESSION POINTS:
<span id="sessionPoints">0</span>
</div>

<div class="liveBox">
SESSION TOKENS:
<span id="sessionTokens">0.0000</span>
</div>

<div class="live">
1 Tap = 1 Point
</div>

<!-- WALLET -->

<div class="card">

<input
id="wallet"
placeholder="Paste BSC wallet address"
>

<button
id="walletBtn"
onclick="toggleWallet()"
>
CONNECT WALLET
</button>

<div
id="walletStatus"
class="status"
>
Wallet connected
</div>

</div>

<!-- INFO -->

<div class="card">

<div style="font-size:13px;">
🤖 Auto Withdrawal Enabled
</div>

<div class="info">

Minimum: 100 Tokens
<br>

Maximum: 500 Tokens

<br><br>

1 Token = 10,000 Points

<br>

1 Token Price = 0.000000001 BNB

<br><br>

Auto payout works once every 24 hours

</div>

</div>

</div>

<script>

/* ================= CONFIG ================= */

const POINTS_PER_TOKEN = 10000;

const MIN_WITHDRAW = 100;

const MAX_WITHDRAW = 500;

const DAILY_LIMIT =
24 * 60 * 60 * 1000;

/* ================= STATE ================= */

let wallet = "";

let totalPoints = 0;

let totalTokens = 0;

let sessionPoints = 0;

let sessionTokens = 0;

let lastWithdraw = 0;

/* ================= UI ================= */

function set(id,val){

let el =
document.getElementById(id);

if(el){
el.innerText = val;
}

}

/* ================= UPDATE ================= */

function updateUI(){

if(!wallet){

set("totalPoints",0);

set("totalTokens","0.0000");

set("sessionPoints",0);

set("sessionTokens","0.0000");

set("userId","guest");

return;

}

/* total stored assets */
set(
"totalPoints",
totalPoints
);

set(
"totalTokens",
totalTokens.toFixed(4)
);

/* live session */
set(
"sessionPoints",
sessionPoints
);

set(
"sessionTokens",
sessionTokens.toFixed(4)
);

/* wallet as user id */
set(
"userId",
wallet.slice(0,6) +
"..." +
wallet.slice(-4)
);

}

/* ================= SAVE ================= */

function saveData(){

if(!wallet) return;

localStorage.setItem(

"pvlt_" + wallet,

JSON.stringify({

totalPoints: totalPoints,

totalTokens: totalTokens,

lastWithdraw: lastWithdraw

})

);

}

/* ================= LOAD ================= */

function loadData(){

let saved =
localStorage.getItem(
"pvlt_" + wallet
);

if(saved){

let data =
JSON.parse(saved);

totalPoints =
data.totalPoints || 0;

totalTokens =
data.totalTokens || 0;

lastWithdraw =
data.lastWithdraw || 0;

}else{

totalPoints = 0;

totalTokens = 0;

lastWithdraw = 0;

}

}

/* ================= CONNECT ================= */

function toggleWallet(){

let btn =
document.getElementById(
"walletBtn"
);

let status =
document.getElementById(
"walletStatus"
);

let input =
document.getElementById(
"wallet"
);

/* CONNECT */
if(!wallet){

let addr =
input.value.trim();

if(
!addr.startsWith("0x") ||
addr.length !== 42
){

alert("Invalid wallet");

return;

}

wallet = addr;

/* detect wallet as user id */
loadData();

btn.innerText =
"DISCONNECT WALLET";

status.style.display =
"block";

/* reset live session */
sessionPoints = 0;

sessionTokens = 0;

updateUI();

alert("Wallet connected");

}

/* DISCONNECT */
else{

saveData();

wallet = "";

sessionPoints = 0;

sessionTokens = 0;

totalPoints = 0;

totalTokens = 0;

input.value = "";

btn.innerText =
"CONNECT WALLET";

status.style.display =
"none";

updateUI();

alert("Wallet disconnected");

}

}

/* ================= TAP ================= */

function tap(){

if(!wallet){

alert(
"Connect wallet first"
);

return;

}

/* live session */
sessionPoints++;

sessionTokens =
sessionPoints /
POINTS_PER_TOKEN;

/* background assets */
totalPoints++;

totalTokens =
totalPoints /
POINTS_PER_TOKEN;

saveData();

updateUI();

/* ================= AUTO PAYOUT ================= */

let now =
Date.now();

if(
now - lastWithdraw <
DAILY_LIMIT
){
return;
}

if(totalTokens >= MIN_WITHDRAW){

let payout =
totalTokens;

if(payout > MAX_WITHDRAW){
payout = MAX_WITHDRAW;
}

/* reset total assets after claim */
totalPoints = 0;

totalTokens = 0;

sessionPoints = 0;

sessionTokens = 0;

lastWithdraw = now;

saveData();

updateUI();

alert(

"✅ AUTO PAYOUT SUCCESS\n\n" +

"Payout: " +

payout.toFixed(4) +

" PVLT\n\nWallet:\n" +

wallet +

"\n\nNext payout in 24 hours"

);

}

}

/* ================= START ================= */

window.addEventListener(
"DOMContentLoaded",
updateUI
);

</script>

</body>

</html>
