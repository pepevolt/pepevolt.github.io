<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Points Controller</h1>

        <div class="space-y-4 mb-8">
            <div class="bg-gray-50 p-3 rounded">
                <p class="text-sm text-gray-500">Energy Price</p>
                <p class="font-mono font-semibold break-all">100,000,000,000,000,000,000</p>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-50 p-3 rounded">
                    <p class="text-sm text-blue-600">Free Cap</p>
                    <p class="text-xl font-bold">50</p>
                </div>
                <div class="bg-green-50 p-3 rounded">
                    <p class="text-sm text-green-600">Paid Cap</p>
                    <p class="text-xl font-bold">10,000</p>
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <button onclick="handleTap()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                Tap
            </button>
            <button onclick="handleConvert()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition">
                Convert Points
            </button>
        </div>
    </div>

    <script>
        function handleTap() {
            console.log("Tap function triggered");
            // Add your ethers.js or web3.js contract interaction here
        }

        function handleConvert() {
            console.log("Convert Points function triggered");
            // Add your ethers.js or web3.js contract interaction here
        }
    </script>
</body>
</html>
