<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PepeVolt | Tap & Earn PVLT on Polygon</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  background:radial-gradient(circle at top, #183153 0%, #07111f 75%);
  display:flex;
  flex-direction:column;
  padding:16px;
  position:relative;
}

.top-nav{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.nav-box{
  flex:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:12px;
  text-align:center;
}

.nav-title{
  font-size:11px;
  color:#9fb2d0;
}

.nav-value{
  font-size:20px;
  font-weight:bold;
  color:white;
  font-family:monospace;
}

#connectBtn{
  margin-bottom:14px;
  width:100%;
  border:none;
  border-radius:18px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg, #00b894, #00cec9);
  cursor:pointer;
  transition:transform 0.1s ease;
}
#connectBtn:active{transform:scale(0.98);}

.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.tap-circle{
  position:relative;
  width:min(60vw,230px);
  height:min(60vw,230px);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #00d2a8, #00a884);
  border:8px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 70px rgba(0,255,180,0.25);
  cursor:pointer;
  overflow:hidden;
  transition:transform 0.05s linear;
}
.tap-circle:active{transform:scale(0.96);}
.tap-circle img{
  width:80%;
  object-fit:contain;
  pointer-events:none;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:12px;
}

.action-btn{
  padding:16px;
  border:none;
  border-radius:20px;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  transition:transform 0.1s ease;
}
.action-btn:active{transform:scale(0.97);}

.buy{
  background:linear-gradient(135deg, #00b894, #00cec9);
}
.claim{
  background:linear-gradient(135deg, #f59e0b, #ea580c);
}

.float{
  position:fixed;
  color:#00ffcc;
  font-weight:bold;
  text-shadow:0 0 5px black;
  pointer-events:none;
  animation:floatUp 0.8s ease-out forwards;
  z-index:9999;
  font-size:1.2rem;
}

@keyframes floatUp{
  0%{ opacity:1; transform:translateY(0px);}
  100%{ opacity:0; transform:translateY(-60px);}
}

.wallet-status{
  text-align:center;
  font-size:11px;
  margin-top:10px;
  color:#7e8cac;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script type="importmap">
  {
    "imports": {
      "@walletconnect/ethereum-provider": "https://esm.sh/@walletconnect/ethereum-provider@2.11.0"
    }
  }
</script>
</head>

<body>

<div class="app">

  <div class="top-nav">
    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">50</div>
    </div>
    <div class="nav-box">
      <div class="nav-title">💎 Points</div>
      <div class="nav-value" id="points">0</div>
    </div>
    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>
  </div>

  <button id="connectBtn">🔗 Connect Wallet (Polygon)</button>
  <div class="wallet-status" id="walletStatus">⚡ Free mode: 50 Energy</div>

  <div class="center">
    <div class="tap-circle" id="tapBtn">
      <img src="https://i.imgur.com/8Km9tLL.png" alt="pepe">
    </div>
  </div>

  <div class="actions">
    <button class="action-btn buy" id="buyEnergyBtn">⚡ Buy 10,000 Energy (100 PVLT)</button>
    <button class="action-btn claim" id="claimPvltBtn">💎 Claim PVLT → Wallet</button>
  </div>

</div>

<script type="module">
  import { EthereumProvider } from "@walletconnect/ethereum-provider";

  // ========== DOM ELEMENTS ==========
  const connectBtn = document.getElementById('connectBtn');
  const walletStatusDiv = document.getElementById('walletStatus');
  const energySpan = document.getElementById('energy');
  const pointsSpan = document.getElementById('points');
  const pvltSpan = document.getElementById('pvlt');
  const tapCircle = document.getElementById('tapBtn');
  const buyEnergyBtn = document.getElementById('buyEnergyBtn');
  const claimPvltBtn = document.getElementById('claimPvltBtn');

  // ========== GAME STATE (In-Game Currency) ==========
  let energy = 50;           // Free user starts with 50
  let points = 0;            // Tap points
  let inGamePvlt = 0;        // PVLT earned in-game (shown in top nav)

  // ========== WALLET STATE ==========
  let provider = null;
  let signer = null;
  let userAccount = null;

  // ========== TOKEN CONTRACT (Replace with your actual PVLT token on Polygon) ==========
  // You need to deploy an ERC20 token on Polygon and replace this address
  const PVLT_TOKEN_ADDRESS = "0x0000000000000000000000000000000000000000"; // ⚠️ REPLACE WITH REAL TOKEN ADDRESS
  const PVLT_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address to, uint256 amount) returns (bool)",
    "function mint(address to, uint256 amount) external"
  ];
  let tokenContract = null;

  // ========== HELPER FUNCTIONS ==========
  function updateUI() {
    energySpan.innerText = Math.floor(energy);
    pointsSpan.innerText = Math.floor(points);
    pvltSpan.innerText = Math.floor(inGamePvlt);

    // Buy button: needs 100 in-game PVLT
    if (buyEnergyBtn) {
      if (userAccount && inGamePvlt >= 100) buyEnergyBtn.style.opacity = '1';
      else buyEnergyBtn.style.opacity = '0.6';
    }
    // Claim button: needs connected wallet and at least 1 in-game PVLT
    if (claimPvltBtn) {
      if (userAccount && inGamePvlt >= 1) claimPvltBtn.style.opacity = '1';
      else claimPvltBtn.style.opacity = '0.5';
    }

    if (userAccount) {
      walletStatusDiv.innerHTML = `✅ Connected: ${userAccount.slice(0,6)}...${userAccount.slice(-4)} | 💎 In-Game PVLT: ${Math.floor(inGamePvlt)} | ⚡ Energy: ${Math.floor(energy)}/10000`;
    } else {
      walletStatusDiv.innerHTML = `⚡ Free mode: ${Math.floor(energy)}/10000 Energy (connect wallet to claim PVLT & buy energy)`;
    }
    
    saveGame();
  }

  function saveGame() {
    const data = { energy, points, inGamePvlt };
    localStorage.setItem('pepevolt_data', JSON.stringify(data));
  }

  function loadGame() {
    const saved = localStorage.getItem('pepevolt_data');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        energy = data.energy ?? 50;
        points = data.points ?? 0;
        inGamePvlt = data.inGamePvlt ?? 0;
      } catch(e) {}
    }
    if (energy < 0) energy = 0;
    if (energy > 10000) energy = 10000;
    updateUI();
  }

  function showFloating(x, y, text, color = '#00ffcc') {
    const el = document.createElement('div');
    el.className = 'float';
    el.innerText = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  // ========== TAP LOGIC ==========
  function handleTap(clientX, clientY) {
    if (energy <= 0) {
      showFloating(clientX, clientY, '❌ No Energy', '#ff8888');
      return;
    }

    energy -= 1;
    points += 1;
    if (energy < 0) energy = 0;

    // Every 100 points = +1 in-game PVLT (auto-convert, points loop)
    if (points >= 100) {
      const convertCount = Math.floor(points / 100);
      inGamePvlt += convertCount;
      points = points % 100;
      showFloating(clientX, clientY - 20, `✨ +${convertCount} PVLT ✨`, '#ffd966');
    }

    updateUI();
    showFloating(clientX, clientY, '+1⭐ -1⚡', '#7bed9f');
    if (navigator.vibrate) navigator.vibrate(20);
  }

  // ========== BUY ENERGY: Spend 100 in-game PVLT → +10,000 Energy ==========
  async function buyEnergy() {
    if (!userAccount) {
      alert('🔗 Please connect wallet first');
      return;
    }
    if (inGamePvlt < 100) {
      alert(`❌ Need 100 in-game PVLT to buy 10,000 Energy.\nYou have: ${Math.floor(inGamePvlt)} PVLT`);
      return;
    }

    // Deduct in-game PVLT
    inGamePvlt -= 100;
    energy = Math.min(energy + 10000, 10000);
    updateUI();
    
    showFloating(window.innerWidth / 2, window.innerHeight - 120, `+10,000 ⚡ ENERGY`, '#60a5fa');
    alert(`✅ Purchased 10,000 Energy!`);
  }

  // ========== CLAIM PVLT: Transfer in-game PVLT to real wallet on Polygon ==========
  async function claimToWallet() {
    if (!userAccount) {
      alert('🔗 Connect your wallet first to claim PVLT');
      return;
    }
    if (inGamePvlt < 1) {
      alert(`No PVLT to claim. Keep tapping! (100 points = 1 PVLT)`);
      return;
    }
    if (!provider || !signer) {
      alert('Wallet not ready. Please reconnect.');
      return;
    }
    if (!tokenContract) {
      alert('⚠️ Token contract not configured. Please set PVLT_TOKEN_ADDRESS to your actual token on Polygon.');
      return;
    }

    const amountToClaim = Math.floor(inGamePvlt);
    const amountWei = ethers.utils.parseEther(amountToClaim.toString());

    try {
      showFloating(window.innerWidth/2, window.innerHeight/2, '⏳ Claiming PVLT to wallet...', '#c084fc');
      
      // Transfer in-game PVLT to real wallet via smart contract mint/transfer
      // Option 1: If you have a mint function (recommended for claiming)
      // const tx = await tokenContract.mint(userAccount, amountWei);
      
      // Option 2: If tokens are already in game contract, transfer them
      const tx = await tokenContract.transfer(userAccount, amountWei);
      
      alert(`⏳ Claim transaction submitted!\nHash: ${tx.hash}\nWaiting for confirmation...`);
      await tx.wait(1);
      
      // Deduct claimed amount from in-game balance
      inGamePvlt -= amountToClaim;
      updateUI();
      
      alert(`✅ Successfully claimed ${amountToClaim} PVLT to your wallet!\nTransaction: ${tx.hash}`);
      showFloating(window.innerWidth / 2, 150, `+${amountToClaim} PVLT claimed!`, '#c084fc');
    } catch (err) {
      console.error(err);
      alert(`Claim failed: ${err.message || 'Transaction rejected'}`);
    }
  }

  // ========== ENERGY REGENERATION ==========
  setInterval(() => {
    if (energy < 10000) {
      energy = Math.min(energy + 1, 10000);
      updateUI();
    }
  }, 15000);

  // ========== WALLET CONNECTION (WalletConnect - Polygon Mainnet) ==========
  async function connectWallet() {
    try {
      const wcProvider = await EthereumProvider.init({
        projectId: "1731f99148b9cf6107dee70b6efb14b7",
        chains: [137], // Polygon Mainnet
        showQrModal: true,
        methods: ["eth_sendTransaction", "personal_sign", "eth_signTypedData"],
        optionalMethods: ["eth_accounts", "eth_requestAccounts", "eth_chainId"],
        rpcMap: {
          137: "https://polygon-rpc.com"
        },
        metadata: {
          name: "PepeVolt",
          description: "Tap to Earn PVLT on Polygon",
          url: window.location.origin,
          icons: ["https://cdn-icons-png.flaticon.com/512/825/825508.png"]
        }
      });

      await wcProvider.connect();
      const accounts = await wcProvider.request({ method: "eth_accounts" });
      userAccount = accounts[0];
      
      // Setup ethers provider
      provider = wcProvider;
      signer = new ethers.providers.Web3Provider(wcProvider).getSigner();
      
      // Initialize token contract (REPLACE WITH YOUR ACTUAL TOKEN ADDRESS)
      if (PVLT_TOKEN_ADDRESS !== "0x0000000000000000000000000000000000000000") {
        tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      } else {
        console.warn("⚠️ PVLT_TOKEN_ADDRESS not set. Claims will not work.");
        // For demo purposes, we'll still allow the UI but show error on claim
      }
      
      connectBtn.innerText = `✅ ${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
      
      // IMPORTANT: Wallet connection does NOT give 10000 energy automatically
      // User starts with whatever energy they had (capped at 50 if new)
      if (energy < 50 && energy < 10000) {
        // Keep existing energy
      }
      updateUI();
      
      // Listen for account changes
      wcProvider.on("accountsChanged", (accs) => {
        if (accs.length === 0) {
          userAccount = null;
          connectBtn.innerText = "🔗 Connect Wallet (Polygon)";
          updateUI();
        } else {
          userAccount = accs[0];
          connectBtn.innerText = `✅ ${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
          updateUI();
        }
      });
      
      wcProvider.on("chainChanged", (chainId) => {
        if (chainId !== "0x89") {
          alert("Please switch to Polygon Mainnet for claiming PVLT");
        }
      });
      
    } catch (err) {
      console.error(err);
      alert("Wallet connection failed. Please try again.");
    }
  }

  // ========== EVENT LISTENERS ==========
  tapCircle.addEventListener('click', (e) => {
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (!clientX || !clientY) {
      const rect = tapCircle.getBoundingClientRect();
      clientX = rect.left + rect.width / 2;
      clientY = rect.top + rect.height / 2;
    }
    handleTap(clientX, clientY);
  });

  tapCircle.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    if (touch) handleTap(touch.clientX, touch.clientY);
  }, { passive: false });

  buyEnergyBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await buyEnergy();
  });

  claimPvltBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await claimToWallet();
  });

  connectBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    connectWallet();
  });

  // ========== INIT ==========
  loadGame();
  
  console.log("✅ Option B: Top nav PVLT = in-game currency. Claim button sends to real wallet.");
  console.log("⚠️ IMPORTANT: Set PVLT_TOKEN_ADDRESS to your actual ERC20 token address on Polygon Mainnet");
</script>
</body>
</html>
