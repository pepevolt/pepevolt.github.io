<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PepeVolt</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  background: radial-gradient(circle at top,#183153 0%,#07111f 75%);
  display:flex;
  flex-direction:column;
  padding:16px;
}

.top-nav{
  display:flex;
  gap:10px;
}

.nav-box{
  flex:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:12px;
  text-align:center;
}

.nav-title{font-size:11px;color:#9fb2d0;}
.nav-value{font-size:18px;font-weight:bold;color:white;}

#connectBtn{
  margin-top:14px;
  width:100%;
  border:none;
  border-radius:18px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg,#00b894,#00cec9);
  cursor:pointer;
}

.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.tap-circle{
  position:relative;
  width:min(60vw,230px);
  height:min(60vw,230px);
  border-radius:50%;
  background: radial-gradient(circle at 30% 30%,#ffcc00,#ff8800);
  border:8px solid white;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 70px rgba(255,180,0,0.4);
  cursor:pointer;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.action-btn{
  padding:16px;
  border:none;
  border-radius:18px;
  color:white;
  font-weight:bold;
}

.buy{background:linear-gradient(135deg,#00b894,#00cec9);}
.claim{background:linear-gradient(135deg,#ffb347,#ff7b54);}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:85%;
  background:#0f1c2e;
  border-radius:20px;
  padding:20px;
  color:white;
}

.modal-box button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.meta{background:#f6851b;color:white;}
.wc{background:#3b99fc;color:white;}

.float{
  position:fixed;
  color:white;
  font-weight:bold;
  animation:floatUp 1s linear forwards;
  pointer-events:none;
}

@keyframes floatUp{
  0%{opacity:1;transform:translateY(0);}
  100%{opacity:0;transform:translateY(-70px);}
}
</style>
</head>

<body>

<div class="app">

  <div class="top-nav">
    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">100</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">💎 Points</div>
      <div class="nav-value" id="points">0</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>
  </div>

  <button id="connectBtn">Connect Wallet</button>

  <div class="center">
    <div class="tap-circle" id="tapBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/825/825508.png" width="32%">
    </div>
  </div>

  <div class="actions">
    <button class="action-btn buy">Buy 10000 Energy</button>
    <button class="action-btn claim">Claim PVLT</button>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="walletModal">
  <div class="modal-box">
    <h3>Select Wallet</h3>
    <button class="meta" id="metaBtn">MetaMask</button>
    <button class="wc" id="wcBtn">WalletConnect</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
const connectBtn = document.getElementById("connectBtn");
const modal = document.getElementById("walletModal");

let account = null;

connectBtn.onclick = () => {
  modal.style.display = "flex";
};

window.closeModal = () => {
  modal.style.display = "none";
};

/* META MASK */
document.getElementById("metaBtn").onclick = async () => {
  if (!window.ethereum) {
    alert("Install MetaMask");
    return;
  }

  const acc = await window.ethereum.request({
    method: "eth_requestAccounts"
  });

  account = acc[0];
  connectBtn.innerText = account.slice(0,6)+"..."+account.slice(-4);
  modal.style.display = "none";
};

/* WALLETCONNECT FIXED */
document.getElementById("wcBtn").onclick = async () => {
  try {
    const { EthereumProvider } = await import(
      "https://unpkg.com/@walletconnect/ethereum-provider@2.11.0/dist/index.es.js"
    );

    const provider = await EthereumProvider.init({
      projectId: "1731f99148b9cf6107dee70b6efb14b7",
      chains: [1],
      showQrModal: true,
      rpcMap: {
        1: "https://rpc.ankr.com/eth"
      },
      metadata: {
        name: "PepeVolt",
        description: "Tap Game",
        url: window.location.origin,
        icons: ["https://cdn-icons-png.flaticon.com/512/825/825508.png"]
      }
    });

    await provider.connect();

    const accounts = await provider.request({
      method: "eth_accounts"
    });

    account = accounts[0];
    connectBtn.innerText = account.slice(0,6)+"..."+account.slice(-4);

    modal.style.display = "none";

  } catch (e) {
    console.log(e);
    alert("WalletConnect failed. Open console.");
  }
};

/* TAP */
let energy = 100;
let points = 0;
let pvlt = 0;

document.getElementById("tapBtn").onclick = (e) => {
  if (!account) {
    alert("Connect Wallet First");
    return;
  }

  if (energy <= 0) return;

  energy--;
  points++;

  if (points >= 1000) {
    pvlt += Math.floor(points / 1000);
    points = points % 1000;
  }

  document.getElementById("energy").innerText = energy;
  document.getElementById("points").innerText = points;
  document.getElementById("pvlt").innerText = pvlt;

  const f = document.createElement("div");
  f.className = "float";
  f.innerText = "+1";
  f.style.left = e.clientX + "px";
  f.style.top = e.clientY + "px";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
};
</script>

</body>
</html>
