<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.11.0/dist/index.umd.js"></script>

<script>

const GAME_ADDRESS =
"0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

const TREASURY_ADDRESS =
"0x4251Ef24D10bf637494C173621F5f84262e9Bda5";

const PROJECT_ID =
"1731f99148b9cf6107dee70b6efb14b7";

const GAME_ABI = [

"function tap() external",

"function refillEnergy() external",

"function convertPoints() external",

"function players(address) view returns(uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"

];

const TREASURY_ABI = [

"function claimRewards() external"

];

let provider;
let signer;
let game;
let treasury;
let wallet;

const energyEl =
document.getElementById("energy");

const pointsEl =
document.getElementById("points");

const gpvltEl =
document.getElementById("gpvlt");

const walletDisplay =
document.getElementById("walletDisplay");

async function connectWallet(){

try{

/* ================= INJECTED WALLET ================= */

if(window.ethereum){

await window.ethereum.request({
method:"eth_requestAccounts"
});

provider =
new ethers.providers.Web3Provider(
window.ethereum
);

}

/* ================= WALLETCONNECT ================= */

else{

const EthereumProvider =
window.EthereumProvider ||
window["@walletconnect/ethereum-provider"];

if(!EthereumProvider){

alert("WalletConnect failed to load");

return;

}

const wcProvider =
await EthereumProvider.init({

projectId: PROJECT_ID,

chains:[137],

showQrModal:true,

methods:[
"eth_sendTransaction",
"personal_sign",
"eth_signTransaction",
"eth_signTypedData",
"eth_signTypedData_v4"
]

});

await wcProvider.connect();

provider =
new ethers.providers.Web3Provider(
wcProvider
);

}

/* ================= NETWORK ================= */

const network =
await provider.getNetwork();

if(network.chainId !== 137){

try{

await provider.send(
"wallet_switchEthereumChain",
[{ chainId:"0x89" }]
);

}catch(switchError){

console.log(switchError);

alert("Please switch to Polygon Mainnet");

}

}

/* ================= SIGNER ================= */

signer =
provider.getSigner();

wallet =
await signer.getAddress();

/* ================= UI ================= */

walletDisplay.innerText =
wallet.slice(0,6) +
"..." +
wallet.slice(-4);

/* ================= CONTRACTS ================= */

game =
new ethers.Contract(
GAME_ADDRESS,
GAME_ABI,
signer
);

treasury =
new ethers.Contract(
TREASURY_ADDRESS,
TREASURY_ABI,
signer
);

/* ================= LOAD PLAYER ================= */

loadPlayer();

}catch(err){

console.log(err);

alert(
err.message ||
"Wallet connection failed"
);

}

}

/* ================= LOAD PLAYER ================= */

async function loadPlayer(){

if(!game || !wallet) return;

try{

const data =
await game.players(wallet);

energyEl.innerText =
Number(data.energy);

pointsEl.innerText =
Number(data.points);

gpvltEl.innerText =
Number(data.burnedGPVLT);

}catch(err){

console.log(err);

}

}

/* ================= TAP ================= */

async function tapGame(){

if(!game){

alert("Connect wallet first");

return;

}

try{

const tx =
await game.tap();

await tx.wait();

loadPlayer();

}catch(err){

console.log(err);

alert("Tap failed");

}

}

/* ================= REFILL ================= */

async function refillEnergy(){

if(!game){

alert("Connect wallet first");

return;

}

try{

const tx =
await game.refillEnergy();

await tx.wait();

loadPlayer();

}catch(err){

console.log(err);

alert("Refill failed");

}

}

/* ================= CONVERT ================= */

async function convertPoints(){

if(!game){

alert("Connect wallet first");

return;

}

try{

const tx =
await game.convertPoints();

await tx.wait();

loadPlayer();

}catch(err){

console.log(err);

alert("Need 10 points");

}

}

/* ================= CLAIM ================= */

async function claimPVLT(){

if(!treasury){

alert("Connect wallet first");

return;

}

try{

const tx =
await treasury.claimRewards();

await tx.wait();

loadPlayer();

alert("PVLT claimed");

}catch(err){

console.log(err);

alert("Claim failed");

}

}

/* ================= BUTTONS ================= */

document
.getElementById("connectBtn")
.addEventListener(
"click",
connectWallet
);

document
.getElementById("tapBtn")
.addEventListener(
"click",
tapGame
);

document
.getElementById("refillBtn")
.addEventListener(
"click",
refillEnergy
);

document
.getElementById("convertBtn")
.addEventListener(
"click",
convertPoints
);

document
.getElementById("claimBtn")
.addEventListener(
"click",
claimPVLT
);

/* ================= AUTO RECONNECT ================= */

window.addEventListener(
"load",
async()=>{

if(window.ethereum){

const accounts =
await window.ethereum.request({
method:"eth_accounts"
});

if(accounts.length > 0){

connectWallet();

}

}

}
);

</script>
