<!DOCTYPE html>
<html lang="en">
<body>
    <appkit-button></appkit-button>
    <div id="game-ui">
        <button id="tap-btn" onclick="handleTap()">TAP!</button>
        <div id="status-msg"></div>
    </div>

    <script type="module">
        import { ethers } from "https://esm.sh/ethers";
        
        // Use a Loading State UI
        async function handleTap() {
            const btn = document.getElementById('tap-btn');
            const status = document.getElementById('status-msg');
            
            try {
                btn.disabled = true;
                status.innerText = "Confirm in wallet...";
                
                // 1. Trigger Contract Transaction
                const tx = await contract.tap();
                status.innerText = "Mining...";
                await tx.wait(); // Wait for block confirmation
                
                // 2. Notify Backend only AFTER success
                await fetch('https://your-server.onrender.com/api/v1/log-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'tap', txHash: tx.hash })
                });
                
                status.innerText = "Success!";
            } catch (err) {
                status.innerText = "Error: " + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
