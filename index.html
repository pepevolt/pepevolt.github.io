<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PepeVolt | Tap to Earn PVLT</title>
<link rel="icon" href="images/logo.PNG">
<meta name="theme-color" content="#090912">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

:root {
  --bg: #090912;
  --card: #0e0f1a;
  --primary: #00ffcc;
  --secondary: #ffd700;
  --muted: #9ba3c2;
  --border: rgba(0,255,204,0.2);
  --radius: 16px;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 440px;
  margin: 0 auto;
  padding: 16px;
  overflow: hidden;
}

.energy-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.energy-left .val { font-family: monospace; font-weight: 800; font-size: 20px; color: var(--primary); }
.energy-right { width: 52%; }
.prog-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.prog-bar-fill { height: 100%; background: var(--primary); transition: width .4s ease; }
.regen-lbl { font-size: 9px; color: var(--muted); text-align: right; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-card.primary-card { border: 1px solid var(--border); }
.stat-card.secondary-card { border: 1px solid rgba(255,215,0,0.2); }
.stat-card .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
.stat-card .val { font-family: monospace; font-weight: 800; font-size: 22px; }
.stat-card.secondary-card .val { color: var(--secondary); }

.wallet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.wallet-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
}
.wallet-card .lbl { font-size: 9px; color: var(--muted); }
.wallet-card .val { font-family: monospace; font-size: 13px; }

main { flex: 1; display: flex; align-items: center; justify-content: center; }
.pepe-btn {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #00ebbc, #008f74);
  border: 4px solid rgba(0,255,204,0.5);
  cursor: pointer;
  transition: transform .08s;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0,255,204,0.4);
}
.pepe-btn:active { transform: scale(.95); }
.pepe-btn.no-energy { opacity: 0.5; cursor: not-allowed; }
.pepe-btn img { width: 70%; height: 70%; object-fit: contain; }

footer {
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 12px;
  margin-top: 8px;
}
.status-txt { text-align: center; font-size: 11px; font-family: monospace; color: var(--muted); margin-bottom: 10px; }
.btn {
  width: 100%;
  border: none;
  border-radius: 44px;
  padding: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #000; }
.btn-secondary { background: var(--secondary); color: #000; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.2); color: #fff; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-small { padding: 10px; font-size: 13px; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #000; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--card);
  border-radius: 24px;
  padding: 20px;
  width: 90%;
  max-width: 320px;
  border: 1px solid var(--border);
}
.modal-title { font-size: 18px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 16px; }
.wallet-option {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03);
  cursor: pointer;
  width: 100%;
  margin-bottom: 10px;
}
.wallet-option:hover { background: rgba(0,255,204,.1); }
.wallet-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255,255,255,.1); }
.modal-close { float: right; cursor: pointer; font-size: 20px; color: var(--muted); }
</style>
</head>
<body>

<div class="app">
  <div class="energy-row">
    <div class="energy-left"><div class="val" id="energyVal">100 / 100</div></div>
    <div class="energy-right">
      <div class="prog-bar"><div class="prog-bar-fill" id="energyBar" style="width:100%"></div></div>
      <div class="regen-lbl" id="regenLbl"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card primary-card">
      <div class="lbl">Points</div>
      <div class="val"><span id="pointsVal">0</span><span style="font-size:14px">/100</span></div>
    </div>
    <div class="stat-card secondary-card">
      <div class="lbl">💎 Game PVLT</div>
      <div class="val" id="gamePvltVal">0</div>
    </div>
  </div>

  <div class="wallet-row">
    <div class="wallet-card"><div class="lbl">💼 Wallet</div><div class="val" id="walletVal">0.00</div></div>
    <div class="wallet-card"><div class="lbl">🏦 Treasury</div><div class="val" id="treasuryVal">0</div></div>

  <main>
    <button class="pepe-btn no-energy" id="tapBtn">
      <img src="images/logo.PNG" alt="Pepe" onerror="this.innerHTML='🐸'">
    </button>
  </main>

  <footer>
    <div class="status-txt" id="statusTxt">🔒 Connect wallet to start</div>
    <div id="stateDisconnected">
      <button class="btn btn-primary" id="connectBtn">💼 CONNECT WALLET</button>
    </div>
    <div id="stateConnected" style="display:none">
      <button class="btn btn-outline" id="disconnectBtn" style="display:none"></button>
      <div class="action-grid" id="actionGrid" style="display:none">
        <button class="btn btn-secondary btn-small" id="buyBtn">⚡ BUY ENERGY<span>(100 PVLT)</span></button>
        <button class="btn btn-primary btn-small" id="claimBtn">💎 CLAIM<span id="claimSub">TO WALLET</span></button>
      </div>
    </div>
  </footer>
</div>

<div id="walletModal" class="modal-overlay">
  <div class="modal-sheet">
    <div style="text-align:right"><span class="modal-close" id="closeModal">✕</span></div>
    <div class="modal-title">Connect Wallet</div>
    <button class="wallet-option" id="metaMaskOption">
      <div class="wallet-icon">🦊</div>
      <div>MetaMask</div>
    </button>
    <div style="text-align:center; font-size:11px; color:var(--muted); margin-top:12px">
      Make sure you're on <span style="color:var(--primary)">Polygon Mainnet</span>
    </div>
  </div>
</div>

<script>
// ============ WALLET CONNECTION MODULE ============
class WalletManager {
  constructor() {
    this.provider = null;
    this.signer = null;
    this.account = null;
    this.chainId = null;
    this.onAccountChange = null;
    this.onChainChange = null;
  }

  async connect() {
    if (!window.ethereum) {
      throw new Error("Please install MetaMask!");
    }

    try {
      // Request account access
      const accounts = await window.ethereum.request({ 
        method: 'eth_requestAccounts' 
      });
      this.account = accounts[0];
      
      // Setup provider
      this.provider = new ethers.providers.Web3Provider(window.ethereum);
      this.signer = this.provider.getSigner();
      
      // Get network info
      const network = await this.provider.getNetwork();
      this.chainId = network.chainId;
      
      // Setup event listeners
      this._setupEventListeners();
      
      return this.account;
    } catch (error) {
      console.error("Connection error:", error);
      throw error;
    }
  }

  async switchToPolygon() {
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: '0x89' }] // Polygon Mainnet
      });
      return true;
    } catch (switchError) {
      // If chain not added, add it
      if (switchError.code === 4902) {
        try {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: '0x89',
              chainName: 'Polygon Mainnet',
              nativeCurrency: { name: 'MATIC', symbol: 'MATIC', decimals: 18 },
              rpcUrls: ['https://polygon-rpc.com/'],
              blockExplorerUrls: ['https://polygonscan.com/']
            }]
          });
          return true;
        } catch (addError) {
          throw new Error("Failed to add Polygon network");
        }
      }
      throw switchError;
    }
  }

  _setupEventListeners() {
    if (window.ethereum) {
      window.ethereum.on('accountsChanged', (accounts) => {
        if (accounts.length === 0) {
          this.account = null;
          if (this.onAccountChange) this.onAccountChange(null);
        } else if (accounts[0] !== this.account) {
          this.account = accounts[0];
          if (this.onAccountChange) this.onAccountChange(this.account);
        }
      });

      window.ethereum.on('chainChanged', (chainId) => {
        this.chainId = parseInt(chainId, 16);
        if (this.onChainChange) this.onChainChange(this.chainId);
        window.location.reload(); // Recommended by MetaMask
      });
    }
  }

  disconnect() {
    this.provider = null;
    this.signer = null;
    this.account = null;
    this.chainId = null;
  }

  getShortAccount() {
    if (!this.account) return "";
    return this.account.slice(0, 6) + "..." + this.account.slice(-4);
  }

  isConnected() {
    return this.account !== null;
  }

  async getBalance(contractAddress, abi) {
    if (!this.provider || !contractAddress) return null;
    try {
      const contract = new ethers.Contract(contractAddress, abi, this.provider);
      const balance = await contract.balanceOf(this.account);
      return balance;
    } catch (error) {
      console.error("Balance fetch error:", error);
      return null;
    }
  }

  async sendTransaction(to, data, value = 0) {
    if (!this.signer) throw new Error("Wallet not connected");
    
    const tx = {
      from: this.account,
      to: to,
      data: data,
      value: value
    };
    
    return await this.signer.sendTransaction(tx);
  }
}

// ============ GAME STATE MANAGER ============
class GameStateManager {
  constructor() {
    this.maxEnergy = 100;
    this.energy = 100;
    this.points = 0;
    this.gamePvlt = 0;
    this.lastRegen = Date.now();
    this.onStateChange = null;
  }

  load(accountId) {
    if (!accountId) return;
    try {
      const data = JSON.parse(localStorage.getItem(`pv_${accountId}`) || '{}');
      this.maxEnergy = data.maxEnergy ?? 100;
      this.points = data.points ?? 0;
      this.gamePvlt = data.gamePvlt ?? 0;
      this.lastRegen = data.lastRegen ?? Date.now();
      
      // Calculate offline energy regeneration
      const secondsOffline = Math.floor((Date.now() - this.lastRegen) / 1000);
      const regenerated = Math.floor(secondsOffline / 15);
      this.energy = Math.min((data.energy ?? 100) + regenerated, this.maxEnergy);
      
      if (regenerated > 0) this.lastRegen = Date.now();
    } catch(e) {
      console.error("Load error:", e);
    }
  }

  save(accountId) {
    if (!accountId) return;
    localStorage.setItem(`pv_${accountId}`, JSON.stringify({
      energy: this.energy,
      maxEnergy: this.maxEnergy,
      points: this.points,
      gamePvlt: this.gamePvlt,
      lastRegen: this.lastRegen
    }));
  }

  tap() {
    if (this.energy <= 0) {
      return { success: false, reason: "No energy" };
    }
    
    this.energy--;
    this.points++;
    
    let earnedPvlt = 0;
    if (this.points >= 100) {
      earnedPvlt = Math.floor(this.points / 100);
      this.gamePvlt += earnedPvlt;
      this.points = this.points % 100;
    }
    
    if (this.onStateChange) {
      this.onStateChange(this.getState());
    }
    
    return { success: true, earnedPvlt, points: 1 };
  }
  
  regenEnergy() {
    if (this.energy < this.maxEnergy) {
      const secondsPassed = Math.floor((Date.now() - this.lastRegen) / 1000);
      const gained = Math.floor(secondsPassed / 15);
      
      if (gained > 0) {
        this.energy = Math.min(this.energy + gained, this.maxEnergy);
        this.lastRegen = Date.now();
        
        if (this.onStateChange) {
          this.onStateChange(this.getState());
        }
      }
      
      const remainingSeconds = 15 - (secondsPassed % 15);
      return remainingSeconds;
    }
    return 0;
  }
  
  addEnergy(amount) {
    this.maxEnergy += amount;
    this.energy += amount;
    if (this.onStateChange) {
      this.onStateChange(this.getState());
    }
  }
  
  claimGamePvlt() {
    const claimed = this.gamePvlt;
    this.gamePvlt = 0;
    this.points = 0;
    if (this.onStateChange) {
      this.onStateChange(this.getState());
    }
    return claimed;
  }
  
  getState() {
    return {
      energy: this.energy,
      maxEnergy: this.maxEnergy,
      points: this.points,
      gamePvlt: this.gamePvlt
    };
  }
  
  reset() {
    this.maxEnergy = 100;
    this.energy = 100;
    this.points = 0;
    this.gamePvlt = 0;
    this.lastRegen = Date.now();
    if (this.onStateChange) {
      this.onStateChange(this.getState());
    }
  }
}

// ============ CONTRACT MANAGER ============
class ContractManager {
  constructor() {
    this.PVLT_TOKEN_ADDRESS = "0x03741F950eaFD9CbAa217E2B0491a0F143492f0A";
    this.GAME_CONTRACT_ADDRESS = "0xE522370EA3A22D9075bB446027c7E46b5D979806";
    this.TREASURY_ADDRESS = "0x2f5d721F771f53F55845AA927b95E40d5Ad30EF4";
    
    this.GAME_ABI = [
      "function buyEnergy(uint256 pvltAmount) external",
      "function claimRewards(uint256 pvltAmount) external",
      "function getTreasuryBalance() view returns (uint256)"
    ];
    this.PVLT_ABI = [
      "function balanceOf(address) view returns (uint256)",
      "function approve(address,uint256) returns (bool)",
      "function allowance(address,address) view returns (uint256)",
      "function decimals() view returns (uint8)"
    ];
    
    this.tokenContract = null;
    this.gameContract = null;
    this.decimals = 18;
    this.signer = null;
  }
  
  setSigner(signer) {
    this.signer = signer;
    if (signer) {
      this.tokenContract = new ethers.Contract(this.PVLT_TOKEN_ADDRESS, this.PVLT_ABI, signer);
      this.gameContract = new ethers.Contract(this.GAME_CONTRACT_ADDRESS, this.GAME_ABI, signer);
    }
  }
  
  async initDecimals() {
    if (this.tokenContract) {
      this.decimals = await this.tokenContract.decimals();
    }
  }
  
  async getWalletBalance(address) {
    if (!this.tokenContract) return 0;
    try {
      const balance = await this.tokenContract.balanceOf(address);
      return parseFloat(ethers.utils.formatUnits(balance, this.decimals));
    } catch(e) {
      console.error("Wallet balance error:", e);
      return 0;
    }
  }
  
  async getTreasuryBalance() {
    if (!this.gameContract) return 0;
    try {
      const balance = await this.gameContract.getTreasuryBalance();
      return parseFloat(ethers.utils.formatUnits(balance, this.decimals));
    } catch(e) {
      console.error("Treasury balance error:", e);
      return 0;
    }
  }
  
  async buyEnergy(amount, onStatus) {
    if (!this.gameContract || !this.tokenContract) throw new Error("Contract not initialized");
    
    const amountWei = ethers.utils.parseUnits(amount.toString(), this.decimals);
    
    // Check allowance
    if (onStatus) onStatus("⏳ Checking allowance...");
    const allowance = await this.tokenContract.allowance(
      await this.signer.getAddress(), 
      this.GAME_CONTRACT_ADDRESS
    );
    
    if (allowance.lt(amountWei)) {
      if (onStatus) onStatus("⏳ Approving PVLT...");
      const approveTx = await this.tokenContract.approve(this.GAME_CONTRACT_ADDRESS, amountWei);
      if (onStatus) onStatus("⏳ Waiting for approval confirmation...");
      await approveTx.wait();
      if (onStatus) onStatus("✅ Approval confirmed! Buying energy...");
    }
    
    // Buy energy
    const gasEstimate = await this.gameContract.estimateGas.buyEnergy(amountWei);
    const tx = await this.gameContract.buyEnergy(amountWei, { 
      gasLimit: gasEstimate.mul(12).div(10) 
    });
    
    if (onStatus) onStatus("⏳ Transaction sent. Waiting for confirmation...");
    await tx.wait();
    
    return tx;
  }
  
  async claimRewards(amount, onStatus) {
    if (!this.gameContract) throw new Error("Contract not initialized");
    
    const amountWei = ethers.utils.parseUnits(amount.toString(), this.decimals);
    const gasEstimate = await this.gameContract.estimateGas.claimRewards(amountWei);
    const tx = await this.gameContract.claimRewards(amountWei, { 
      gasLimit: gasEstimate.mul(12).div(10) 
    });
    
    if (onStatus) onStatus("⏳ Waiting for confirmation...");
    await tx.wait();
    
    return tx;
  }
}

// ============ MAIN APP ============
// Initialize managers
const walletManager = new WalletManager();
const gameManager = new GameStateManager();
const contractManager = new ContractManager();

// DOM Elements
const $ = id => document.getElementById(id);
const energyValEl = $('energyVal');
const energyBarEl = $('energyBar');
const regenLblEl = $('regenLbl');
const pointsValEl = $('pointsVal');
const gamePvltValEl = $('gamePvltVal');
const walletValEl = $('walletVal');
const treasuryValEl = $('treasuryVal');
const tapBtnEl = $('tapBtn');
const statusTxtEl = $('statusTxt');
const connectBtnEl = $('connectBtn');
const stateDisc = $('stateDisconnected');
const stateConn = $('stateConnected');
const disconnBtnEl = $('disconnectBtn');
const actionGridEl = $('actionGrid');
const buyBtnEl = $('buyBtn');
const claimBtnEl = $('claimBtn');
const claimSubEl = $('claimSub');
const walletModal = $('walletModal');
const closeModal = $('closeModal');
const metaMaskOption = $('metaMaskOption');

// UI Update Function
function updateUI() {
  const state = gameManager.getState();
  energyValEl.textContent = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
  energyBarEl.style.width = `${(state.energy / state.maxEnergy) * 100}%`;
  pointsValEl.textContent = state.points;
  gamePvltValEl.textContent = state.gamePvlt.toFixed(0);
  claimSubEl.textContent = state.gamePvlt >= 1 ? `${Math.floor(state.gamePvlt)} PVLT` : 'TO WALLET';
  
  if (walletManager.isConnected()) {
    tapBtnEl.classList.remove('no-energy');
    stateDisc.style.display = 'none';
    stateConn.style.display = 'block';
    disconnBtnEl.style.display = 'block';
    actionGridEl.style.display = 'grid';
    disconnBtnEl.textContent = `🔴 ${walletManager.getShortAccount()}`;
    buyBtnEl.disabled = window.walletBalance < 100;
    claimBtnEl.disabled = state.gamePvlt < 1;
  } else {
    tapBtnEl.classList.add('no-energy');
    stateDisc.style.display = 'block';
    stateConn.style.display = 'none';
  }
}

// Game state change handler
gameManager.onStateChange = (state) => {
  updateUI();
  if (walletManager.isConnected()) {
    gameManager.save(walletManager.account);
  }
};

// Regeneration timer
let regenInterval;
function startRegenTimer() {
  if (regenInterval) clearInterval(regenInterval);
  regenInterval = setInterval(() => {
    if (walletManager.isConnected()) {
      const remaining = gameManager.regenEnergy();
      if (remaining > 0) {
        regenLblEl.textContent = `⚡ +1 in ${remaining}s`;
      } else {
        regenLblEl.textContent = '';
      }
      updateUI();
    }
  }, 1000);
}

// Refresh blockchain balances
let walletBalance = 0;
let treasuryBalance = 0;

async function refreshBalances() {
  if (!walletManager.isConnected()) return;
  
  try {
    walletBalance = await contractManager.getWalletBalance(walletManager.account);
    treasuryBalance = await contractManager.getTreasuryBalance();
    walletValEl.textContent = walletBalance.toFixed(2);
    treasuryValEl.textContent = treasuryBalance.toFixed(0);
    buyBtnEl.disabled = walletBalance < 100;
    claimBtnEl.disabled = gameManager.getState().gamePvlt < 1;
  } catch(e) {
    console.error("Balance refresh error:", e);
  }
}

// Tap handler
let tapLock = false;
function showFloat(x, y, text, color = '#fff') {
  const el = document.createElement('div');
  el.textContent = text;
  el.style.cssText = `position:fixed;left:${x-20}px;top:${y-20}px;color:${color};font-family:monospace;font-weight:800;font-size:22px;pointer-events:none;z-index:999;animation:floatUp 1s forwards;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function handleTap(x, y) {
  if (!walletManager.isConnected()) {
    setStatus("🔒 Connect wallet first!");
    return;
  }
  
  if (tapLock) return;
  tapLock = true;
  setTimeout(() => tapLock = false, 80);
  
  const result = gameManager.tap();
  if (!result.success) {
    setStatus("❌ No energy! Wait for regen or buy more!");
    tapLock = false;
    return;
  }
  
  showFloat(x, y, '+1 ⚡', '#00ffcc');
  if (result.earnedPvlt > 0) {
    showFloat(x, y-40, `+${result.earnedPvlt} PVLT! 🎉`, '#ffd700');
  }
  
  gameManager.save(walletManager.account);
  setStatus(`⚡ Tapped! +1 Point`);
}

// Event handlers
async function connectWallet() {
  setStatus("🦊 Connecting to MetaMask...");
  connectBtnEl.innerHTML = '<span class="spinner"></span> CONNECTING...';
  connectBtnEl.disabled = true;
  
  try {
    const account = await walletManager.connect();
    const network = await walletManager.provider.getNetwork();
    
    if (network.chainId !== 137) {
      setStatus("⚠️ Switching to Polygon Mainnet...");
      await walletManager.switchToPolygon();
    }
    
    contractManager.setSigner(walletManager.signer);
    await contractManager.initDecimals();
    
    gameManager.load(account);
    await refreshBalances();
    
    setStatus(`✅ Connected: ${walletManager.getShortAccount()}`);
    updateUI();
    startRegenTimer();
    
    // Periodic balance refresh
    setInterval(refreshBalances, 10000);
    
  } catch(error) {
    console.error("Connection error:", error);
    setStatus(`❌ ${error.message || "Connection failed"}`);
    walletManager.disconnect();
    updateUI();
  } finally {
    connectBtnEl.innerHTML = '💼 CONNECT WALLET';
    connectBtnEl.disabled = false;
  }
}

async function disconnectWallet() {
  gameManager.save(walletManager.account);
  walletManager.disconnect();
  gameManager.reset();
  updateUI();
  setStatus("🔒 Disconnected");
  if (regenInterval) clearInterval(regenInterval);
}

async function buyEnergy() {
  if (!walletManager.isConnected()) {
    setStatus("Connect wallet first!");
    return;
  }
  
  if (walletBalance < 100) {
    setStatus(`❌ Need 100 PVLT. You have ${walletBalance.toFixed(2)}`);
    return;
  }
  
  buyBtnEl.disabled = true;
  
  try {
    await contractManager.buyEnergy(100, setStatus);
    gameManager.addEnergy(1000);
    gameManager.save(walletManager.account);
    await refreshBalances();
    setStatus(`✅ +1000 Energy! Max: ${gameManager.getState().maxEnergy}`);
    showFloat(window.innerWidth/2, window.innerHeight/2 - 80, '⚡ +1000 ENERGY!', '#ffd700');
  } catch(error) {
    console.error("Buy error:", error);
    setStatus(`❌ ${error.message?.slice(0,80) || "Transaction failed"}`);
  } finally {
    buyBtnEl.disabled = walletBalance < 100;
  }
}

async function claimRewards() {
  const state = gameManager.getState();
  if (!walletManager.isConnected()) {
    setStatus("Connect wallet first!");
    return;
  }
  
  if (state.gamePvlt < 1) {
    setStatus(`❌ No GAME PVLT to claim!`);
    return;
  }
  
  if (treasuryBalance < state.gamePvlt) {
    setStatus(`❌ Treasury low! Has ${treasuryBalance.toFixed(0)} PVLT`);
    return;
  }
  
  claimBtnEl.disabled = true;
  const amount = Math.floor(state.gamePvlt);
  
  try {
    await contractManager.claimRewards(amount, setStatus);
    const claimed = gameManager.claimGamePvlt();
    gameManager.save(walletManager.account);
    await refreshBalances();
    setStatus(`✅ Claimed ${claimed} REAL PVLT!`);
    showFloat(window.innerWidth/2, window.innerHeight/2 - 80, `💎 +${claimed} PVLT!`, '#00ffcc');
  } catch(error) {
    console.error("Claim error:", error);
    setStatus(`❌ ${error.message?.slice(0,80) || "Claim failed"}`);
  } finally {
    const newState = gameManager.getState();
    claimBtnEl.disabled = newState.gamePvlt < 1;
  }
}

function setStatus(msg) {
  statusTxtEl.textContent = msg;
}

// Modal handlers
function openModal() { walletModal.classList.add('open'); }
function closeModalFn() { walletModal.classList.remove('open'); }

// Event listeners
tapBtnEl.addEventListener('click', (e) => {
  const rect = tapBtnEl.getBoundingClientRect();
  handleTap(rect.left + rect.width/2, rect.top + rect.height/2);
});

tapBtnEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  handleTap(touch.clientX, touch.clientY);
}, { passive: false });

connectBtnEl.onclick = openModal;
closeModal.onclick = closeModalFn;
walletModal.onclick = (e) => { if (e.target === walletModal) closeModalFn(); };
metaMaskOption.onclick = async () => {
  closeModalFn();
  await connectWallet();
};
disconnBtnEl.onclick = disconnectWallet;
buyBtnEl.onclick = buyEnergy;
claimBtnEl.onclick = claimRewards;

// Animation style
const style = document.createElement('style');
style.textContent = `@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}`;
document.head.appendChild(style);

// Initialize
updateUI();
setStatus('🔒 Click CONNECT WALLET to start');
window.walletBalance = 0;
</script>
