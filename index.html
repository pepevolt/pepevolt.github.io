<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PVLT Mining Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#070a12;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:12px;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.stat{
  text-align:center;
  font-size:12px;
}

.stat b{
  display:block;
  font-size:14px;
  margin-top:3px;
}

/* WALLET */
.wallet{
  text-align:center;
  padding:10px;
  font-size:12px;
  opacity:0.8;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:18px;
}

/* MINE BUTTON */
.mine{
  width:min(240px, 70vw);
  height:min(240px, 70vw);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #ffd700, #ff6a00);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  user-select:none;
  box-shadow:0 0 50px rgba(255,170,0,0.25);
  transition:0.08s;
}

.mine:active{
  transform:scale(0.95);
}

/* BUTTONS */
button{
  padding:10px 16px;
  border:none;
  border-radius:12px;
  background:#ffffff10;
  color:white;
  backdrop-filter: blur(10px);
}

button:active{
  transform:scale(0.97);
}
</style>
</head>

<body>

<!-- TOP STATS -->
<div class="topbar">
  <div class="stat">⚡ Energy <b id="energy">50</b></div>
  <div class="stat">⛏ Points <b id="points">0</b></div>
  <div class="stat">🪙 PVLT <b id="pvlt">0</b></div>
</div>

<!-- WALLET -->
<div class="wallet">
  <button onclick="connect()">Connect Wallet</button>
  <div id="wallet">Not Connected</div>
</div>

<!-- GAME -->
<div class="main">

  <div class="mine" onclick="mine()">MINE</div>

  <button onclick="claim()">Claim Rewards</button>

</div>

<script>
let energy = 50;
let points = 0;
let pvlt = 0;

let signer;
let user;
let nonce = 0;

/* CONTRACT CONFIG */
const contractAddress = "YOUR_MINING_CONTRACT_ADDRESS";

/* ENERGY REGEN */
setInterval(()=>{
  if(energy < 50){
    energy++;
    update();
  }
}, 2500);

/* UPDATE UI */
function update(){
  document.getElementById("energy").innerText = energy;
  document.getElementById("points").innerText = points;
  document.getElementById("pvlt").innerText = pvlt;
}

/* MINE */
function mine(){
  if(energy <= 0) return;

  energy--;
  points++;

  update();
}

/* CONNECT WALLET */
async function connect(){
  if(!window.ethereum){
    alert("Install MetaMask");
    return;
  }

  const provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);

  signer = provider.getSigner();
  user = await signer.getAddress();

  document.getElementById("wallet").innerText =
    user.slice(0,6)+"..."+user.slice(-4);
}

/* CLAIM (SIGNATURE-BASED READY) */
async function claim(){
  if(!signer){
    alert("Connect wallet first");
    return;
  }

  let rewardPoints = points;
  if(rewardPoints < 100){
    alert("Need at least 100 points");
    return;
  }

  try{
    /* CREATE MESSAGE HASH */
    const message = ethers.utils.solidityKeccak256(
      ["address","uint","uint","address"],
      [user, rewardPoints, nonce, contractAddress]
    );

    /* SIGN MESSAGE */
    const signature = await signer.signMessage(
      ethers.utils.arrayify(message)
    );

    /* HERE YOU WOULD CALL CONTRACT */
    console.log({
      user,
      rewardPoints,
      nonce,
      signature
    });

    /* MOCK REWARD (replace with real contract call) */
    let earned = Math.floor(rewardPoints / 100);
    pvlt += earned;

    points = 0;
    nonce++;

    alert("Claimed " + earned + " PVLT (mock)");

    update();

  } catch(e){
    alert("Claim failed");
  }
}

update();
</script>

</body>
</html>
