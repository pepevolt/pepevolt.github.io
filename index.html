<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tap Tap Game</title>
    <style>
        /* ... (Existing styles remain the same) ... */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; background: radial-gradient(circle at center, #2c3e50, #1a1a2e); }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .game-container { display: flex; flex-direction: column; height: 100vh; padding-bottom: 30px; color: #ffffff; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 15px 5px; background: rgba(255, 255, 255, 0.1); text-align: center; backdrop-filter: blur(10px); }
        .stat-item { display: flex; flex-direction: column; font-size: 0.75rem; }
        .emoji { font-size: 1.2rem; margin-bottom: 4px; }
        .interaction-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 10px; }
        .tap-circle { width: 160px; height: 160px; border-radius: 50%; border: none; font-size: 2rem; font-weight: bold; cursor: pointer; background: #4ecca3; box-shadow: 0 8px 0 #3a9b7c; }
        .tap-circle.disconnected { background: #4a4a4a; box-shadow: 0 8px 0 #333; }
        .energy-bar { width: 80%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .energy-fill { height: 100%; background: #4ecca3; width: 0%; transition: width 0.3s; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-wallet { background: #3498db; color: white; width: 80%; padding: 12px; border-radius: 5px; border: none; font-weight: bold; }
        .game-btn { background: #4ecca3; color: #1a1a2e; width: 80%; padding: 12px; border-radius: 5px; border: none; font-weight: bold; }
        .buy-menu { background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 10px; width: 90%; text-align: center; }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="stats">
            <div class="stat-item"><span class="emoji">⚡</span><span id="energy">Locked</span></div>
            <div class="stat-item"><span class="emoji">💎</span><span id="points">Locked</span></div>
            <div class="stat-item"><span class="emoji">🪙</span><span id="gpvlt">Locked</span></div>
        </header>

        <main class="interaction-area">
            <button id="tap-button" class="tap-circle disconnected" disabled>TAP!</button>
            <button id="wallet-btn" class="btn-wallet" onclick="toggleWallet()">Connect Wallet</button>
            <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
            <div id="pvlt-display">Balance: Locked</div>
            <button id="buy-btn" class="game-btn" onclick="confirmRefill()" disabled>Buy 10,000 Energy (100 PVLT)</button>
        </main>
    </div>

    <script>
        let energy = 0, points = 0, gpvlt = 0, pvlt = 150, isWalletConnected = false, isPaidUser = false;
        const FREE_CAP = 50, PAID_CAP = 10000;

        function toggleWallet() {
            isWalletConnected = !isWalletConnected;
            document.getElementById('wallet-btn').innerText = isWalletConnected ? "Disconnect" : "Connect Wallet";
            document.getElementById('tap-button').disabled = !isWalletConnected;
            document.getElementById('buy-btn').disabled = !isWalletConnected;
            updateUI();
        }

        function updateUI() {
            const cap = isPaidUser ? PAID_CAP : FREE_CAP;
            if (!isWalletConnected) {
                document.getElementById('energy').innerText = "Locked";
            } else {
                document.getElementById('energy').innerText = `${energy}/${cap}`;
                document.getElementById('energy-fill').style.width = (energy / cap * 100) + "%";
                document.getElementById('pvlt-display').innerText = `Balance: ${pvlt.toFixed(2)} PVLT`;
            }
        }

        async function confirmRefill() {
            if (pvlt < 100) return alert("Not enough PVLT!");
            
            const btn = document.getElementById('buy-btn');
            btn.innerText = "Verifying Transaction...";
            btn.disabled = true;

            // Simulate blockchain confirmation delay
            await new Promise(resolve => setTimeout(resolve, 2000));

            pvlt -= 100;
            isPaidUser = true;
            energy += 10000;
            
            btn.innerText = "Purchased!";
            setTimeout(() => { btn.innerText = "Buy 10,000 Energy (100 PVLT)"; btn.disabled = false; }, 2000);
            updateUI();
        }

        document.getElementById('tap-button').addEventListener('click', () => {
            if (energy > 0) { energy--; points++; updateUI(); }
        });

        setInterval(() => {
            const cap = isPaidUser ? PAID_CAP : FREE_CAP;
            if (isWalletConnected && energy < cap) { energy++; updateUI(); }
        }, 1000);
    </script>
</body>
</html>
