<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PVLT Safe Web3 Tap</title>

<style>

/* BACKGROUND */
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle at top, #0b1220, #020617);
color:white;
text-align:center;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;left:0;right:0;
height:60px;

display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;

background: rgba(255,255,255,0.06);
backdrop-filter: blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);

font-size:12px;
z-index:10;
}

/* MAIN */
.container{
padding-top:90px;
}

/* TITLE */
h2{
margin:10px 0;
font-size:22px;
background: linear-gradient(90deg,#00ff99,#00ccff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* TAP BUTTON */
.tap{
width:170px;
height:170px;
border-radius:50%;

background: linear-gradient(135deg,#00ff99,#00ccff);
border:none;

font-size:22px;
font-weight:bold;
color:black;

box-shadow:0 0 25px rgba(0,255,200,0.3);
}

.tap:active{
transform:scale(0.96);
}

/* CARD */
.card{
margin:15px;
padding:15px;

background: rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:14px;
}

/* INPUT */
input{
width:90%;
padding:12px;

border-radius:10px;
border:1px solid rgba(255,255,255,0.1);

background: rgba(0,0,0,0.3);
color:white;
outline:none;
}

/* BUTTON */
button{
padding:12px 18px;
border:none;
border-radius:10px;
margin-top:10px;

background: linear-gradient(90deg,#00ff99,#00ccff);
color:black;
font-weight:bold;
}

small{opacity:0.7;}

</style>

</head>

<body>

<!-- NAVBAR (ALWAYS VISIBLE) -->
<div class="navbar">
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0</span></div>
<div>👤 <span id="userId">guest</span></div>
</div>

<!-- MAIN -->
<div class="container">

<h2>PVLT TAP GAME</h2>
<small>Safe Mode • No Crash Version</small>

<br><br>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<input id="wallet" placeholder="Enter wallet">
<br>
<button onclick="saveWallet()">LINK WALLET</button>
</div>

<div class="card">
<input id="withdraw" placeholder="100 - 500 tokens">
<br>
<button onclick="withdraw()">WITHDRAW</button>
</div>

</div>

<script>

/* ================= SAFE STATE ================= */
let points = 0;
let tokens = 0;
let wallet = "";
let userId = "guest";

/* ================= SAFE DOM UPDATE ================= */
function set(id,val){
  let el = document.getElementById(id);
  if(el) el.innerText = val;
}

/* ================= SAFE INIT ================= */
function init(){

try{

if(window.Telegram && window.Telegram.WebApp){

let tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

userId = tg.initDataUnsafe?.user?.id || "guest";

}

}catch(e){
console.log("Telegram not available");
}

set("userId", userId);

}

/* ================= TAP ================= */
function tap(){
points++;
set("points", points);
}

/* ================= WALLET ================= */
function saveWallet(){

let w = document.getElementById("wallet");

if(!w || !w.value){
alert("Enter wallet");
return;
}

wallet = w.value;
alert("Wallet linked");

}

/* ================= WITHDRAW ================= */
function withdraw(){

let w = document.getElementById("withdraw");

if(!wallet){
alert("Link wallet first");
return;
}

if(!w || !w.value){
alert("Enter amount");
return;
}

let amt = parseInt(w.value);

if(amt < 100 || amt > 500){
alert("Only 100-500 tokens");
return;
}

let required = amt * 100000;

if(points < required){
alert("Not enough points");
return;
}

points -= required;
tokens += amt;

set("points", points);
set("tokens", tokens);

alert("Withdraw request sent (demo)");

}

/* ================= GLOBAL SAFETY ================= */
window.onerror = function(){
  return true; // prevents freeze
};

/* ================= START ================= */
window.addEventListener("DOMContentLoaded", init);

</script>

</body>
</html>
