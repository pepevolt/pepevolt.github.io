<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PVLT Safe Tap App</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

/* NAV */
.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:55px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
font-size:12px;
z-index:10;
}

/* MAIN */
.container{
padding-top:80px;
}

/* TAP BUTTON */
.tap{
width:160px;
height:160px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:22px;
font-weight:bold;
}

/* CARD */
.card{
margin:15px;
background:#111827;
padding:15px;
border-radius:10px;
}

/* INPUT */
input{
width:85%;
padding:10px;
border:none;
border-radius:8px;
}

/* BUTTON */
button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

</style>

</head>

<body>

<!-- UI ALWAYS VISIBLE -->
<div class="navbar">
<div>Points: <span id="points">0</span></div>
<div>Tokens: <span id="tokens">0</span></div>
<div>ID: <span id="userId">loading</span></div>
</div>

<div class="container">

<h2>Tap Game</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<input id="wallet" placeholder="Wallet address">
<br>
<button onclick="saveWallet()">SAVE</button>
</div>

<div class="card">
<input id="withdraw" placeholder="100 - 500 tokens">
<br>
<button onclick="withdraw()">WITHDRAW</button>
</div>

</div>

<script>

/* ================= SAFE STATE ================= */
let points = 0;
let tokens = 0;
let wallet = null;
let userId = "guest";

/* ================= SAFE DOM ================= */
function set(id, value){
  let el = document.getElementById(id);
  if(el) el.innerText = value;
}

/* ================= ERROR PROTECTION ================= */
window.onerror = function(msg){
  console.log("ERROR:", msg);
  return true; // prevents freeze
};

/* ================= INIT ================= */
function init(){

try{

if(window.Telegram && Telegram.WebApp){

Telegram.WebApp.ready();
Telegram.WebApp.expand();

userId =
Telegram.WebApp.initDataUnsafe &&
Telegram.WebApp.initDataUnsafe.user
? Telegram.WebApp.initDataUnsafe.user.id
: "guest";

}

}catch(e){
console.log("Telegram init error", e);
}

set("userId", userId);

}

/* ================= RENDER ================= */
function render(){
set("points", points);
set("tokens", tokens);
}

/* ================= TAP ================= */
function tap(){
points++;
render();
}

/* ================= WALLET ================= */
function saveWallet(){

let w = document.getElementById("wallet");

if(!w || !w.value){
alert("Enter wallet");
return;
}

wallet = w.value;
alert("Wallet saved");

}

/* ================= WITHDRAW ================= */
function withdraw(){

let w = document.getElementById("withdraw");

if(!wallet){
alert("Link wallet first");
return;
}

if(!w || !w.value){
alert("Enter amount");
return;
}

let amt = parseInt(w.value);

if(amt < 100 || amt > 500){
alert("Only 100-500 allowed");
return;
}

let required = amt * 100000;

if(points < required){
alert("Not enough points");
return;
}

points -= required;
tokens += amt;

render();

alert("Withdraw request submitted (demo)");

}

/* ================= START SAFE ================= */
window.addEventListener("DOMContentLoaded", function(){
init();
render();
});

</script>

</body>
</html>
