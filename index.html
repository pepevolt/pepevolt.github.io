<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVLT TAP GAME</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030a16;
            --card-bg: #091324;
            --border-color: #16243d;
            --text-primary: #ffffff;
            --text-secondary: #8ba2c0;
            --accent-green: #00ffaa;
            --accent-purple: #7000ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Top Status Bar */
        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px 10px;
            background: rgba(9, 19, 36, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-item i {
            font-size: 14px;
        }
        .fa-battery-half { color: #ff4a4a; }
        .fa-bolt { color: #ffcc00; }
        .fa-gem { color: #00ccff; }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Avatar / Tap Button Container */
        .avatar-container {
            position: relative;
            margin-top: 10px;
        }

        #tapBtn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            border: 4px solid var(--border-color);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            transition: transform 0.1s ease, box-shadow 0.2s;
            padding: 0;
        }

        #tapBtn:active {
            transform: scale(0.95);
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.5);
        }

        #tapBtn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Modular Cards */
        .card {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
        }

        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-green);
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .card-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: var(--text-secondary);
        }

        .value {
            font-weight: 600;
        }

        .value.highlight {
            color: var(--accent-green);
        }

        .value.pool {
            color: #ffcc00;
        }

        /* Connection element inside identity card */
        .wallet-address {
            background: rgba(3, 10, 22, 0.5);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        /* Action Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #10203e, #162c54);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .btn:hover {
            background: linear-gradient(90deg, #162c54, #1c386a);
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--accent-purple), #5000b8);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #821cff, var(--accent-purple));
        }

        .btn-connect {
            background: none;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--text-primary);
        }

        .nav-item i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="status-item">
            <i class="fa-solid fa-battery-half"></i>
            <span>Energy: <span id="energy-top">50</span></span>
        </div>
        <div class="status-item">
            <i class="fa-solid fa-bolt"></i>
            <span>Points: <span id="points-top">0</span></span>
        </div>
        <div class="status-item">
            <i class="fa-solid fa-gem"></i>
            <span>PVLT: 0.0000</span>
        </div>
    </div>

    <div class="container">

        <div class="avatar-container">
            <button id="tapBtn" onclick="tap()">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0Yw59x40A2q_8w-p-6Xon0-bY8xL6Wp3fCg&s" alt="PepeVolt Clicker">
            </button>
        </div>

        <div class="card">
            <div class="card-title">Identity & Access</div>
            <div class="wallet-address" id="wallet">Not Connected</div>
            <button class="btn btn-connect" onclick="connectWallet()">Connect Wallet</button>
        </div>

        <div class="card">
            <div class="card-title">Token Ledger (Contract #1)</div>
            <div class="card-row">
                <span class="label">Personal Wallet PVLT:</span>
                <span class="value highlight" id="points-ledger">0</span>
            </div>
            <div class="card-row">
                <span class="label">Game Treasury Pool:</span>
                <span class="value pool" id="treasury-pool">0.00 MATIC</span>
            </div>
            <div class="card-row">
                <span class="label">Current Energy Pool:</span>
                <span class="value" id="energy-ledger">50/50</span>
            </div>
            <div style="margin-top: 15px;">
                <button class="btn" onclick="buyEnergyPack()">Buy 10,000 Energy</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Staking Engine (Contract #2)</div>
            <div class="card-row">
                <span class="label">Accumulated Points:</span>
                <span class="value" id="points-rewards">0</span>
            </div>
            <div style="margin-top: 15px;">
                <button class="btn btn-primary" onclick="claimRewards()">Claim Rewards</button>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-chart-simple"></i>
            <span>Markets</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-right-left"></i>
            <span>Trade</span>
        </div>
        <div class="nav-item active">
            <i class="fa-solid fa-compass"></i>
            <span>Discover</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-wallet"></i>
            <span>Assets</span>
        </div>
    </div>

    <script>
        let provider;
        let signer;
        let user;

        let energy = 50;
        let maxEnergy = 50;
        let points = 0;

        const CONTRACT = "YOUR_TREASURY_CONTRACT";
        const ABI = [
            "function buyEnergyPack() external",
            "function claimRewards(uint amount) external"
        ];

        function updateUIElements() {
            document.getElementById("energy-top").innerHTML = energy;
            document.getElementById("energy-ledger").innerHTML = energy + "/" + maxEnergy;
            
            document.getElementById("points-top").innerHTML = points;
            document.getElementById("points-ledger").innerHTML = points;
            document.getElementById("points-rewards").innerHTML = points;
        }

        // New feature: Fetches contract's native token balance (or update to track ERC20 pool)
        async function updateTreasuryPoolBalance() {
            if (!provider || CONTRACT === "YOUR_TREASURY_CONTRACT") return;
            try {
                const balance = await provider.getBalance(CONTRACT);
                const formattedBalance = ethers.utils.formatEther(balance);
                // Rounds native token balance representation cleanly to 4 decimals
                document.getElementById("treasury-pool").innerHTML = parseFloat(formattedBalance).toFixed(4) + " MATIC";
            } catch(err) {
                console.error("Could not fetch pool balance", err);
            }
        }

        async function connectWallet(){
            try {
                await window.ethereum.request({ method: "eth_requestAccounts" });
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                user = await signer.getAddress();
                
                const displayAddress = user.substring(0, 6) + "..." + user.substring(user.length - 4);
                
                document.getElementById("wallet").innerHTML = displayAddress + "<br><span style='color:#00ffaa; font-size:11px; font-family:sans-serif;'>CONNECTED NETWORK: POLYGON</span>";
                
                // Get the pool balance as soon as wallet is connected
                updateTreasuryPoolBalance();
            } catch (err) {
                console.error("Wallet connection failed", err);
            }
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                updateUIElements();
            }
        }, 1000);

        async function tap(){
            if (energy <= 0) {
                alert("No energy");
                return;
            }

            energy--;
            points++;
            updateUIElements();

            try {
                await fetch("/tap", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet: user, points: 1 })
                });
            } catch(e) {}
        }

        async function buyEnergyPack(){
            try {
                const contract = new ethers.Contract(CONTRACT, ABI, signer);
                const tx = await contract.buyEnergyPack();
                await tx.wait();

                energy += 10000;
                updateUIElements();
                updateTreasuryPoolBalance(); // Update pool if it takes fees
                alert("Energy Purchased");
            } catch(err) {
                alert("Transaction failed or rejected.");
            }
        }

        async function claimRewards(){
            let pvlt = Math.floor(points / 100);

            if (pvlt < 10) {
                alert("Minimum 10 PVLT needed to claim");
                return;
            }

            try {
                const contract = new ethers.Contract(CONTRACT, ABI, signer);
                const tx = await contract.claimRewards(ethers.utils.parseEther(pvlt.toString()));
                await tx.wait();

                alert("Rewards Claimed");
                points = 0;
                updateUIElements();
                updateTreasuryPoolBalance(); // Update balance as pool changes
            } catch(err) {
                alert("Transaction failed.");
            }
        }
        
        updateUIElements();
    </script>
</body>
</html>
