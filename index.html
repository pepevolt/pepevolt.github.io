<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEPEVOLT GAME</title>
    
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@web3modal/standalone@2.4.3/dist/index.umd.js"></script>

    <style>
        body {
            margin: 0; padding: 0;
            background: #000; color: #fff;
            font-family: Arial, sans-serif; text-align: center;
        }
        .topbar {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px; background: #111; font-size: 24px; font-weight: bold;
            position: sticky; top: 0; z-index: 999;
        }
        .info { margin-top: 10px; font-size: 14px; color: #aaa; }
        .tap-btn {
            width: 240px; height: 240px; border-radius: 50%;
            background: #151515; display: flex; align-items: center; justify-content: center;
            margin: 40px auto; font-size: 42px; font-weight: bold; cursor: pointer;
            transition: 0.2s; border: 4px solid #333; user-select: none;
        }
        .tap-btn:active { transform: scale(0.95); }
        .buttons { margin-top: 30px; }
        button {
            padding: 14px 22px; margin: 10px; font-size: 18px;
            border: none; border-radius: 12px; background: #222; color: #fff; cursor: pointer;
        }
        button:hover { background: #333; }
        .balance { margin-top: 10px; font-size: 16px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="topbar">
        <div>⚡ <span id="energy">0</span></div>
        <div>🪙 <span id="gpvlt">0</span></div>
        <div>💰 <span id="pvlt">0</span></div>
    </div>

    <div class="info">
        <div>TreasuryVolt: <span id="treasuryBalance">0</span> PVLT</div>
        <div>Wallet: <span id="walletBalance">0</span> PVLT</div>
    </div>

    <br>
    <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
    <div id="wallet" class="balance">Please connect wallet...</div>

    <div class="tap-btn" onclick="tap()">TAP</div>

    <div class="buttons">
        <button onclick="buyEnergy()">Buy Energy</button>
        <button onclick="convertGPVLT()">Convert</button>
        <button onclick="claimReward()">Claim</button>
    </div>

<script>
    let PVLT_CONTRACT = "";
    let TREASURY_CONTRACT = "";
    let GAME_CONTRACT = "";
    
    // Configured Reown project ID
    const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7"; 

    let provider;
    let signer;
    let userAddress;
    
    let wcProvider;
    let web3Modal;

    const GAME_ABI = [
        "function tap() external",
        "function refillEnergy() external",
        "function convertToPVLT(uint256 amount) external",
        "function claimPVLT(uint256 amount) external",
        "function energy(address) view returns(uint256)",
        "function gPVLT(address) view returns(uint256)"
    ];

    const ERC20_ABI = [
        "function balanceOf(address owner) view returns(uint256)",
        "function approve(address spender, uint256 amount) external returns(bool)"
    ];

    const TREASURY_ABI = [
        "function treasuryBalance() view returns(uint256)"
    ];

    // Grabs values directly from your working server
    async function initConfig() {
        try {
            const response = await fetch("https://pvlt-server.onrender.com/api/config");
            const config = await response.json();
            
            PVLT_CONTRACT = config.pvlt;
            TREASURY_CONTRACT = config.treasury;
            GAME_CONTRACT = config.game;
            console.log("Production Configurations Loaded Safely.");
            
            initUniversalWalletConnect();
        } catch (err) {
            console.error("Critical configuration endpoint read error:", err);
        }
    }

    async function initUniversalWalletConnect() {
        try {
            // 1. Setup the standard standalone Web3Modal view layout
            web3Modal = new window.Web3ModalStandalone.Web3Modal({
                projectId: PROJECT_ID,
                walletConnectVersion: 2,
                standaloneChains: ["eip155:137"], // Polygon Mainnet Namespace standard
                themeMode: "dark"
            });

            // 2. Initialize the Raw Ethereum Provider interface
            wcProvider = await window.WalletConnectEthereumProvider.EthereumProvider.init({
                projectId: PROJECT_ID,
                chains: [137], 
                showQrModal: false, // Disables internal modal to let Web3Modal handle the wallet list grid layout UI
                metadata: {
                    name: "PepeVolt Game",
                    description: "PepeVolt Ecosystem",
                    url: "https://pepevolt.github.io",
                    icons: ["https://pepevolt.github.io/favicon.ico"]
                }
            });

            // Listeners for sync updates
            wcProvider.on("display_uri", (uri) => {
                web3Modal.openModal({ uri });
            });

            wcProvider.on("accountsChanged", (accounts) => {
                if (accounts.length > 0) {
                    web3Modal.closeModal();
                    setupBlockchainConnection(wcProvider);
                }
            });

            wcProvider.on("disconnect", () => {
                document.getElementById("wallet").innerHTML = "Disconnected.";
                document.getElementById("connectBtn").innerText = "Connect Wallet";
                signer = null;
            });

        } catch (err) {
            console.error("Failed to link WalletConnect Core Provider:", err);
        }
    }

    async function connectWallet() {
        if (!GAME_CONTRACT) {
            alert("Render Backend is wake up from sleep mode. Try again in a minute.");
            return;
        }

        // Direct injection detection (MetaMask In-App Browser)
        if (window.ethereum) {
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                document.getElementById("wallet").innerHTML = "Connected: " + userAddress;
                document.getElementById("connectBtn").innerText = "Wallet Connected ✅";
                loadAllData();
                return;
            } catch (e) {
                console.error("In-app injection error", e);
            }
        }

        // Fallback for regular browsers (Safari, Chrome) to trigger the beautiful Grid UI
        if (!wcProvider || !web3Modal) {
            alert("Engine setting up. Please try again in 2 seconds.");
            return;
        }

        try {
            if (wcProvider.connected) {
                setupBlockchainConnection(wcProvider);
            } else {
                await wcProvider.connect();
            }
        } catch (err) {
            console.log("User closed connection window framework:", err);
            web3Modal.closeModal();
        }
    }

    async function setupBlockchainConnection(rawProvider) {
        provider = new ethers.providers.Web3Provider(rawProvider);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        document.getElementById("wallet").innerHTML = "Connected: " + userAddress;
        document.getElementById("connectBtn").innerText = "Wallet Connected ✅";
        loadAllData();
    }

    async function loadAllData() {
        if (!signer) return;

        const game = new ethers.Contract(GAME_CONTRACT, GAME_ABI, signer);
        const pvlt = new ethers.Contract(PVLT_CONTRACT, ERC20_ABI, signer);
        const treasury = new ethers.Contract(TREASURY_CONTRACT, TREASURY_ABI, signer);

        try {
            const energy = await game.energy(userAddress);
            document.getElementById("energy").innerHTML = energy.toString();

            const gpvlt = await game.gPVLT(userAddress);
            document.getElementById("gpvlt").innerHTML = ethers.utils.formatEther(gpvlt);

            const walletPVLT = await pvlt.balanceOf(userAddress);
            document.getElementById("walletBalance").innerHTML = ethers.utils.formatEther(walletPVLT);
            document.getElementById("pvlt").innerHTML = ethers.utils.formatEther(walletPVLT);

            const treasuryPVLT = await treasury.treasuryBalance();
            document.getElementById("treasuryBalance").innerHTML = ethers.utils.formatEther(treasuryPVLT);
        } catch (err) {
            console.error("Data tracking failed:", err);
        }
    }

    async function tap() {
        try {
            if (!signer) return alert("Connect wallet first!");
            const game = new ethers.Contract(GAME_CONTRACT, GAME_ABI, signer);
            const tx = await game.tap();
            await tx.wait();
            loadAllData();
        } catch(err) {
            alert(err.data?.message || err.message);
        }
    }

    async function buyEnergy() {
        try {
            if (!signer) return alert("Connect wallet first!");
            const pvlt = new ethers.Contract(PVLT_CONTRACT, ERC20_ABI, signer);
            const game = new ethers.Contract(GAME_CONTRACT, GAME_ABI, signer);

            const approveTx = await pvlt.approve(GAME_CONTRACT, ethers.utils.parseEther("300"));
            await approveTx.wait();

            const tx = await game.refillEnergy();
            await tx.wait();
            alert("10,000 Energy added successfully!");
            loadAllData();
        } catch(err) {
            alert(err.data?.message || err.message);
        }
    }

    async function convertGPVLT() {
        try {
            if (!signer) return alert("Connect wallet first!");
            const amount = prompt("Enter gPVLT Amount to Convert:");
            if (!amount) return;

            const game = new ethers.Contract(GAME_CONTRACT, GAME_ABI, signer);
            const tx = await game.convertToPVLT(ethers.utils.parseEther(amount));
            await tx.wait();
            alert("Converted successfully!");
            loadAllData();
        } catch(err) {
            alert(err.data?.message || err.message);
        }
    }

    async function claimReward() {
        try {
            if (!signer) return alert("Connect wallet first!");
            const amount = prompt("Enter PVLT Amount to Claim:");
            if (!amount) return;

            const game = new ethers.Contract(GAME_CONTRACT, GAME_ABI, signer);
            const tx = await game.claimPVLT(ethers.utils.parseEther(amount));
            await tx.wait();
            alert("Claim successful!");
            loadAllData();
        } catch(err) {
            alert(err.data?.message || err.message);
        }
    }

    window.addEventListener("load", initConfig);
</script>
</body>
</html>
