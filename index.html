<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.tap{
width:200px;
height:200px;
border-radius:50%;
background:#00ff99;
font-size:30px;
font-weight:bold;
border:none;
margin-top:20px;
}

button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.card{
margin-top:20px;
background:#111827;
padding:20px;
border-radius:15px;
}

.green{
color:#00ff99;
}

</style>

</head>

<body>

<h2>PEPE VOLT TAP GAME</h2>

<div>Wallet: <span id="wallet">Not Connected</span></div>

<div>Points: <span id="points">0</span></div>

<div>PVLT Balance: <span id="balance">0</span></div>

<button onclick="connect()">Connect Wallet</button>

<button class="tap" onclick="tap()">TAP</button>

<button onclick="claim()">CLAIM TOKENS</button>

<script>

const tapContract = "YOUR_TAP_CONTRACT";
const tokenContract = "YOUR_PVLT_TOKEN";

const tapAbi = [
"function tap(uint256)",
"function getPoints(address) view returns (uint256)",
"function claimTokens()"
];

const tokenAbi = [
"function balanceOf(address) view returns (uint256)"
];

let provider, signer, tap, token, wallet;

async function connect(){

provider = new ethers.providers.Web3Provider(window.ethereum);
await provider.send("eth_requestAccounts", []);

signer = provider.getSigner();
wallet = await signer.getAddress();

document.getElementById("wallet").innerText =
wallet.slice(0,6)+"..."+wallet.slice(-4);

tap = new ethers.Contract(tapContract, tapAbi, signer);
token = new ethers.Contract(tokenContract, tokenAbi, signer);

load();

}

function tapGame(){
tap.tap(1);
load();
}

async function load(){

let p = await tap.getPoints(wallet);
let b = await token.balanceOf(wallet);

document.getElementById("points").innerText = p;
document.getElementById("balance").innerText =
ethers.utils.formatEther(b);

}

async function tap(){
await tapGame();
}

async function claim(){
await tap.claimTokens();
load();
}

</script>

</body>
</html>
