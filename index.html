<script type="module">
import { createAppKit } from "https://esm.sh/@reown/appkit"
import { EthersAdapter } from "https://esm.sh/@reown/appkit-adapter-ethers"
import { mainnet, polygon } from "https://esm.sh/@reown/appkit/networks"

const projectId = "1731f99148b9cf6107dee70b6efb14b7"

const modal = createAppKit({
    projectId,
    adapters: [new EthersAdapter()],
    networks: [mainnet, polygon],
    metadata: {
        name: "PepeVolt",
        description: "Connect Wallet",
        url: window.location.origin,
        icons: ["https://avatars.githubusercontent.com/u/37784886"]
    }
})

document.getElementById("connect-button").addEventListener("click", () => {
    modal.open()
    
    // Start checking connection AFTER modal opens
    checkWalletConnection()
})

async function checkWalletConnection() {
    const interval = setInterval(async () => {
        try {
            // get wallet client from appkit
            const walletClient = await modal.getWalletProvider?.()

            if (walletClient?.accounts?.length > 0) {
                clearInterval(interval)

                const address = walletClient.accounts[0]
                console.log("Connected:", address)

                // redirect
                window.location.href =
                    "https://pepevolt.github.io/dashboard.html"
            }
        } catch (e) {
            console.log("waiting for wallet...")
        }
    }, 500)
}
</script>
