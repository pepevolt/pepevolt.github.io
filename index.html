<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PVLT Tap Game</title>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
-webkit-text-size-adjust:100%;
overscroll-behavior:none;
}

body{
display:flex;
flex-direction:column;
}

/* ================= NAV ================= */

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

/* ================= MAIN ================= */

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

/* ================= TAP ================= */

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:20px;

background:linear-gradient(135deg,#00ff99,#00ccff);

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;
position:relative;

/* MOBILE FIX */
touch-action:manipulation;
user-select:none;
-webkit-user-select:none;
}

.tap:active{
transform:scale(0.96);
}

/* LOGO */

.tapLogo{
width:75%;
height:75%;
object-fit:contain;
pointer-events:none;
}

/* ================= CARD ================= */

.bigCard{
width:90%;
max-width:380px;
margin-top:20px;
padding:18px;

background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;

display:flex;
flex-direction:column;
gap:12px;
}

/* ================= INPUT ================= */

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

/* ================= BUTTON ================= */

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

/* ================= SMALL ================= */

.small{
font-size:12px;
opacity:0.7;
text-align:center;
}

</style>

</head>

<body>

<!-- NAV -->
<div class="nav">

<div>🔋 <span id="energy">50</span></div>
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0.0000</span></div>

</div>

<!-- MAIN -->
<div class="container">

<button class="tap" onclick="tap()">
  <img src="images/IMG_1850.png" class="tapLogo">
</button>

<div class="small">1 Tap = 1 Point</div>

<!-- CARD -->
<div class="bigCard">

<input id="walletInput" placeholder="Paste BSC wallet">

<button onclick="toggleWallet()">
CONNECT WALLET
</button>

<button onclick="buyEnergy()">
BUY ENERGY (REFILL)
</button>

<button onclick="claim()">
CLAIM TOKENS
</button>

</div>

</div>

<script>

/* ================= STATE ================= */

let wallet = "";
let points = 0;
let energy = 50;

/* ================= STORAGE SYSTEM ================= */

function saveState(){
  if(!wallet) return;

  localStorage.setItem(wallet, JSON.stringify({
    points,
    energy
  }));
}

function loadState(addr){
  let data = localStorage.getItem(addr);

  if(data){
    let obj = JSON.parse(data);
    points = obj.points || 0;
    energy = obj.energy || 50;
  } else {
    points = 0;
    energy = 50;
  }
}

/* ================= UI ================= */

function updateUI(){

document.getElementById("energy").innerText = energy;
document.getElementById("points").innerText = points;
document.getElementById("tokens").innerText =
(points / 10000).toFixed(4);

}

/* ================= TAP ================= */

function tap(){

if(!wallet){
alert("Connect wallet first");
return;
}

if(energy <= 0){
alert("No energy");
return;
}

energy--;
points++;

saveState();
updateUI();

}

/* ================= WALLET ================= */

function toggleWallet(){

const input = document.getElementById("walletInput");

if(wallet){

// disconnect ONLY UI session
wallet = "";
points = 0;
energy = 50;

input.value = "";

updateUI();

return;
}

let w = input.value.trim();

if(!w.startsWith("0x") || w.length !== 42){
alert("Invalid wallet");
return;
}

wallet = w.toLowerCase();

loadState(wallet);
updateUI();

}

/* ================= BUY ENERGY ================= */

function buyEnergy(){

if(!wallet){
alert("Connect wallet first");
return;
}

alert("Energy purchase via PVLT Token Contract");

energy = 50;

saveState();
updateUI();

}

/* ================= CLAIM ================= */

function claim(){

if(!wallet){
alert("Connect wallet first");
return;
}

let tokens = points / 10000;

if(tokens < 100){
alert("Minimum 100 tokens required");
return;
}

if(tokens > 500){
tokens = 500;
}

points = 0;

saveState();
updateUI();

alert("CLAIM SUCCESS\nTokens: " + tokens.toFixed(4));

}

</script>

</body>
</html>
