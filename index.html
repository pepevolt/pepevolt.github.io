<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PVLT Tap Game — Web3 Tapping on Polygon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0B1120 0%, #0A0F1A 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(18, 25, 45, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
        }

        /* Top Nav */
        .top-nav {
            display: flex;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(6, 12, 24, 0.7);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
            gap: 12px;
        }

        .nav-card {
            flex: 1;
            background: rgba(14, 22, 40, 0.9);
            border-radius: 32px;
            padding: 10px 12px;
            text-align: center;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .nav-label {
            font-size: 11px;
            color: #8F9BB5;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .nav-value {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #A0D6FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .energy-value {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
        }

        .energy-current {
            font-size: 24px;
            font-weight: 800;
            color: #FFD966;
        }

        .energy-max {
            font-size: 13px;
            color: #7D8FB3;
        }

        /* Body */
        .body-area {
            padding: 32px 24px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tap Circle */
        .tap-circle {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 30% 30%, #FFB347, #FF7E05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4), 0 0 0 6px rgba(255, 140, 0, 0.3);
            transition: transform 0.06s ease;
            margin-bottom: 28px;
        }

        .tap-circle:active {
            transform: scale(0.94);
        }

        .tap-circle.disabled {
            opacity: 0.5;
            filter: grayscale(0.3);
            cursor: not-allowed;
        }

        .tap-circle.disabled:active {
            transform: none;
        }

        .tap-logo {
            width: 55%;
            height: 55%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin: 8px 0;
        }

        .btn {
            border: none;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(95deg, #2D5F9E, #1C3E6C);
            color: white;
            border: 1px solid #3D8BFF;
        }

        .btn-success {
            background: linear-gradient(95deg, #1F6D43, #0F4A2E);
            color: white;
            border: 1px solid #4cd964;
        }

        .btn-claim {
            background: linear-gradient(95deg, #9B4D96, #6B2E68);
            color: white;
            border: 1px solid #E879F9;
        }

        .wallet-status {
            background: rgba(7, 12, 26, 0.9);
            padding: 10px 16px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 13px;
            width: 100%;
            justify-content: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #6B7280;
            border-radius: 50%;
        }

        .dot.connected {
            background: #27E0A6;
            box-shadow: 0 0 6px #27E0A6;
        }

        .feedback {
            color: #FF8A8A;
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
            min-height: 40px;
        }

        .info-text {
            font-size: 10px;
            text-align: center;
            margin-top: 20px;
            opacity: 0.6;
            line-height: 1.5;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-container {
            background: #1A1F2E;
            border-radius: 32px;
            width: 90%;
            max-width: 400px;
            padding: 24px 20px 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .modal-header h3 {
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-subtitle {
            color: #9CA3AF;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .wallets-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 8px;
            margin-bottom: 24px;
        }

        .wallet-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 16px;
            transition: 0.1s;
        }

        .wallet-option:hover {
            background: #2A2F42;
        }

        .wallet-option img {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: #0F111A;
            padding: 8px;
        }

        .wallet-option span {
            color: #EFF3FF;
            font-size: 11px;
            font-weight: 500;
        }

        @media (max-width: 450px) {
            .tap-circle { width: 170px; height: 170px; }
            .nav-value, .energy-current { font-size: 18px; }
            .top-nav { padding: 14px 16px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="top-nav">
        <div class="nav-card">
            <div class="nav-label">⚡ ENERGY</div>
            <div class="energy-value">
                <span class="energy-current" id="energyValue">50</span>
                <span class="energy-max">/<span id="energyMax">10000</span></span>
            </div>
        </div>
        <div class="nav-card">
            <div class="nav-label">🎯 POINTS</div>
            <div class="nav-value" id="pointsValue">0</div>
        </div>
        <div class="nav-card">
            <div class="nav-label">💎 GAME CURRENCY</div>
            <div class="nav-value" id="currencyValue">0</div>
        </div>
    </div>

    <div class="body-area">
        <div class="wallet-status">
            <span class="dot" id="walletDot"></span>
            <span id="walletAddress">Not Connected</span>
        </div>

        <div class="tap-circle" id="tapCircle">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M1 5h22v2H1V5zm0 6h22v2H1v-2zm0 6h22v2H1v-2z'/%3E%3C/svg%3E" class="tap-logo" alt="tap">
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="connectBtn">🔗 CONNECT WALLET</button>
            <button class="btn btn-success" id="buyEnergyBtn">⚡ BUY 10000 ENERGY (100 PVLT)</button>
            <button class="btn btn-claim" id="claimBtn">🔥 CLAIM (10 CURRENCY → PVLT)</button>
        </div>

        <div id="feedback" class="feedback"></div>
        <div class="info-text">
            🎯 Tap: +1 point -1 energy | ⚡ Auto refill +1/3s up to 50<br>
            💎 100 points → +1 Game Currency | 10 Game Currency → Claim PVLT
        </div>
    </div>
</div>

<script>
    // ==================== GAME STATE ====================
    let energy = 50;
    let maxEnergy = 10000;
    let baseRefillCap = 50;
    let points = 0;
    let gameCurrency = 0;
    let refillInterval = null;

    // ==================== WEB3 STATE ====================
    let provider = null;
    let signer = null;
    let userAddress = null;
    let connected = false;
    let currentChainId = null;

    // DOM elements
    const energyEl = document.getElementById('energyValue');
    const pointsEl = document.getElementById('pointsValue');
    const currencyEl = document.getElementById('currencyValue');
    const walletDot = document.getElementById('walletDot');
    const walletAddressEl = document.getElementById('walletAddress');
    const tapCircle = document.getElementById('tapCircle');
    const feedbackEl = document.getElementById('feedback');

    // Constants
    const POINTS_TO_CURRENCY = 100;
    const CURRENCY_TO_CLAIM = 10;

    // ==================== GAME FUNCTIONS ====================
    function updateUI() {
        energyEl.innerText = Math.floor(energy);
        pointsEl.innerText = points;
        currencyEl.innerText = gameCurrency;
        
        if (energy <= 0) {
            tapCircle.classList.add('disabled');
        } else {
            tapCircle.classList.remove('disabled');
        }
    }

    function saveGameState() {
        if (!userAddress) return;
        const gameData = {
            energy: energy,
            points: points,
            gameCurrency: gameCurrency
        };
        localStorage.setItem(`tapgame_${userAddress}`, JSON.stringify(gameData));
    }

    function loadGameState() {
        if (!userAddress) return;
        const saved = localStorage.getItem(`tapgame_${userAddress}`);
        if (saved) {
            try {
                const data = JSON.parse(saved);
                energy = data.energy ?? 50;
                points = data.points ?? 0;
                gameCurrency = data.gameCurrency ?? 0;
                if (energy > maxEnergy) energy = maxEnergy;
                updateUI();
            } catch(e) {}
        }
    }

    function startRefill() {
        if (refillInterval) clearInterval(refillInterval);
        refillInterval = setInterval(() => {
            if (energy < baseRefillCap) {
                let newEnergy = energy + 1;
                if (newEnergy > baseRefillCap) newEnergy = baseRefillCap;
                if (newEnergy !== energy) {
                    energy = newEnergy;
                    updateUI();
                    saveGameState();
                }
            }
        }, 3000);
    }

    function handleTap() {
        if (!connected) {
            showFeedback("❌ Connect wallet first!", 1500);
            return;
        }
        
        if (energy <= 0) {
            showFeedback("⛔ No energy! Wait for refill or buy energy.", 1500);
            return;
        }
        
        energy--;
        points++;
        
        // Convert points to game currency
        if (points >= POINTS_TO_CURRENCY) {
            const converted = Math.floor(points / POINTS_TO_CURRENCY);
            gameCurrency += converted;
            points = points % POINTS_TO_CURRENCY;
            showFeedback(`✨ +${converted} Game Currency!`, 1200);
        }
        
        updateUI();
        saveGameState();
        
        // Haptic feedback
        if (navigator.vibrate) navigator.vibrate(20);
    }

    function buyEnergy() {
        if (!connected) {
            showFeedback("❌ Connect wallet first!", 1500);
            return;
        }
        
        if (currentChainId !== 137 && currentChainId !== 80001) {
            showFeedback("⚠️ Please switch to Polygon network (chainId 137)", 2500);
            return;
        }
        
        showFeedback("⏳ Processing 100 PVLT payment on Polygon...", 2000);
        
        // Simulate transaction (in production, call actual PVLT contract)
        setTimeout(() => {
            let newEnergy = energy + 10000;
            if (newEnergy > maxEnergy) newEnergy = maxEnergy;
            energy = newEnergy;
            updateUI();
            saveGameState();
            showFeedback("✅ +10000 Energy! Purchase successful.", 2500);
        }, 1500);
    }

    function claimReward() {
        if (!connected) {
            showFeedback("❌ Connect wallet first!", 1500);
            return;
        }
        
        if (gameCurrency < CURRENCY_TO_CLAIM) {
            showFeedback(`💢 Need ${CURRENCY_TO_CLAIM} Game Currency. You have ${gameCurrency}`, 2000);
            return;
        }
        
        if (currentChainId !== 137 && currentChainId !== 80001) {
            showFeedback("⚠️ Please switch to Polygon network to claim PVLT", 2500);
            return;
        }
        
        showFeedback("🔥 Burning 10 Game Currency, sending PVLT...", 2000);
        
        setTimeout(() => {
            gameCurrency -= CURRENCY_TO_CLAIM;
            updateUI();
            saveGameState();
            showFeedback(`🎉 Claimed 10 PVLT to ${userAddress.slice(0,8)}...!`, 3000);
        }, 1000);
    }

    function showFeedback(msg, duration = 2000) {
        feedbackEl.innerText = msg;
        setTimeout(() => {
            if (feedbackEl.innerText === msg) feedbackEl.innerText = "";
        }, duration);
    }

    // ==================== WALLET CONNECTION ====================
    async function connectInjected() {
        if (!window.ethereum) {
            showFeedback("❌ No wallet found! Please install MetaMask or Trust Wallet", 3000);
            return false;
        }
        
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            const network = await provider.getNetwork();
            currentChainId = Number(network.chainId);
            
            connected = true;
            walletAddressEl.innerText = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
            walletDot.classList.add('connected');
            
            loadGameState();
            
            const netName = currentChainId === 137 ? "Polygon" : currentChainId === 80001 ? "Mumbai" : "Chain " + currentChainId;
            showFeedback(`✅ Connected to ${netName}`, 2000);
            
            // Listen for account changes
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    connected = false;
                    userAddress = null;
                    walletAddressEl.innerText = "Not Connected";
                    walletDot.classList.remove('connected');
                } else {
                    window.location.reload();
                }
            });
            
            window.ethereum.on('chainChanged', () => {
                window.location.reload();
            });
            
            return true;
        } catch (err) {
            showFeedback(`Connection failed: ${err.message.slice(0,80)}`, 3000);
            return false;
        }
    }

    // Custom wallet modal
    function showWalletModal() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-container">
                <div class="modal-header">
                    <h3>Connect Wallet</h3>
                    <button class="modal-close" id="closeModal">✕</button>
                </div>
                <div class="modal-subtitle">Choose your wallet</div>
                <div class="wallets-grid">
                    <div class="wallet-option" data-wallet="metamask">
                        <img src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1.635/networks/metamask.svg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23F6851B%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%23F6851B%22/%3E%3C/svg%3E'">
                        <span>MetaMask</span>
                    </div>
                    <div class="wallet-option" data-wallet="trust">
                        <img src="https://assets.trustwalletapp.com/logo.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%233377FF%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%233377FF%22/%3E%3C/svg%3E'">
                        <span>Trust Wallet</span>
                    </div>
                    <div class="wallet-option" data-wallet="binance">
                        <img src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1.635/icon/BNB.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23F3BA2F%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%23F3BA2F%22/%3E%3C/svg%3E'">
                        <span>Binance</span>
                    </div>
                    <div class="wallet-option" data-wallet="safepal">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234CAF50'%3E%3Crect width='24' height='24' fill='%234CAF50'/%3E%3Ctext x='4' y='17' fill='white' font-size='14'%3ESP%3C/text%3E%3C/svg%3E">
                        <span>SafePal</span>
                    </div>
                    <div class="wallet-option" data-wallet="okx">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23000000'%3E%3Crect width='24' height='24' fill='%23000000'/%3E%3Ctext x='5' y='17' fill='white' font-size='12'%3EOKX%3C/text%3E%3C/svg%3E">
                        <span>OKX Wallet</span>
                    </div>
                    <div class="wallet-option" data-wallet="tokenpocket">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233399FF'%3E%3Crect width='24' height='24' fill='%233399FF'/%3E%3Ctext x='2' y='17' fill='white' font-size='10'%3ETP%3C/text%3E%3C/svg%3E">
                        <span>TokenPocket</span>
                    </div>
                    <div class="wallet-option" data-wallet="coinbase">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230052FF'%3E%3Crect width='24' height='24' fill='%230052FF'/%3E%3Ctext x='2' y='17' fill='white' font-size='10'%3ECB%3C/text%3E%3C/svg%3E">
                        <span>Coinbase</span>
                    </div>
                    <div class="wallet-option" data-wallet="rabby">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6B35'%3E%3Crect width='24' height='24' fill='%23FF6B35'/%3E%3Ctext x='3' y='17' fill='white' font-size='10'%3ERB%3C/text%3E%3C/svg%3E">
                        <span>Rabby</span>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 16px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 16px;">
                    <div style="font-size: 12px; color: #8F9BB5;">🟣 Works on Polygon network</div>
                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        document.getElementById('closeModal').addEventListener('click', () => modal.remove());
        
        document.querySelectorAll('.wallet-option').forEach(opt => {
            opt.addEventListener('click', async () => {
                modal.remove();
                await connectInjected();
            });
        });
    }

    // ==================== INITIALIZATION ====================
    function init() {
        startRefill();
        updateUI();
        
        document.getElementById('connectBtn').addEventListener('click', showWalletModal);
        document.getElementById('buyEnergyBtn').addEventListener('click', buyEnergy);
        document.getElementById('claimBtn').addEventListener('click', claimReward);
        tapCircle.addEventListener('click', handleTap);
        
        // Check if already connected
        if (window.ethereum && window.ethereum.selectedAddress) {
            setTimeout(() => connectInjected(), 500);
        }
    }
    
    init();
</script>
</body>
</html>
