<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapTap Blitz!</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1e1e24;
            --accent-color: #ff4757;
            --accent-hover: #ff6b81;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            max-height: 750px;
            background-color: var(--card-color);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Screens styling */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        /* Typography & Buttons */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            background: linear-gradient(45deg, #ff4757, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #a4b0be;
            margin-bottom: 2rem;
            text-align: center;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Game HUD */
        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 1.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
        }

        .hud-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Play Area & Target */
        .play-area {
            flex: 1;
            width: 100%;
            position: relative;
            cursor: pointer;
        }

        .target {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ff4757 0%, #ff6b81 70%, #ff4757 100%);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
            cursor: pointer;
            transition: width 0.1s, height 0.1s;
        }

        .target:active {
            width: 70px;
            height: 70px;
        }

        /* Pop effect for score */
        .pop {
            position: absolute;
            color: #ffa502;
            font-weight: bold;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="screen">
            <h1>TapTap Blitz</h1>
            <p>Tap the red target as many times as you can before the timer runs out!</p>
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen hidden" style="padding: 0; justify-content: flex-start;">
            <div class="hud">
                <div class="hud-item">Score: <span id="score-display">0</span></div>
                <div class="hud-item">Time: <span id="time-display">20</span>s</div>
            </div>
            <div class="play-area" id="play-area">
                <div id="target" class="target"></div>
            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="end-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p>Great effort! Here is how you did:</p>
            <div style="font-size: 1.5rem; margin-bottom: 2rem;">
                Final Score: <strong id="final-score" style="color: var(--accent-color);">0</strong>
            </div>
            <button class="btn" onclick="showScreen('start-screen')">Main Menu</button>
        </div>

    </div>

    <script>
        // Game State Variables
        let score = 0;
        let timeLeft = 20;
        let gameInterval;
        const gameDuration = 20; // 20 seconds game

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        
        const target = document.getElementById('target');
        const playArea = document.getElementById('play-area');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const finalScore = document.getElementById('final-score');

        // Navigation Helper
        function showScreen(screenId) {
            startScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            endScreen.classList.add('hidden');

            document.getElementById(screenId).classList.remove('hidden');
        }

        // Initialize and Start Game
        function startGame() {
            score = 0;
            timeLeft = gameDuration;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            
            showScreen('game-screen');
            moveTarget();
            
            // Start Countdown Timer
            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // Move target to a random spot within the bounds of the play area
        function moveTarget() {
            const areaWidth = playArea.clientWidth;
            const areaHeight = playArea.clientHeight;

            // Give padding so the button doesn't spawn halfway off-screen
            const padding = 50; 
            
            const randomX = Math.random() * (areaWidth - padding * 2) + padding;
            const randomY = Math.random() * (areaHeight - padding * 2) + padding;

            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;
        }

        // Handle Tap / Click on Target
        target.addEventListener('click', (e) => {
            score++;
            scoreDisplay.textContent = score;
            
            // Create a floating score indicator (+1)
            createPopEffect(e.clientX, e.clientY);
            
            // Move target to next position
            moveTarget();
        });

        // Add a nice visual indicator where the player clicked
        function createPopEffect(x, y) {
            const pop = document.createElement('div');
            pop.classList.add('pop');
            pop.textContent = '+1';
            
            // Absolute positioning relative to the whole page for simplicity
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;
            
            document.body.appendChild(pop);
            
            // Clean up element after animation finishes
            setTimeout(() => {
                pop.remove();
            }, 600);
        }

        // Handle Game Over
        function endGame() {
            clearInterval(gameInterval);
            finalScore.textContent = score;
            showScreen('end-screen');
        }
    </script>
</body>
</html>
