<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tap Tap Game</title>
    <style>
        /* CSS Styling */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            text-align: center;
        }

        .stats {
            padding: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            background: #16213e;
        }

        .interaction-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tap-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle, #4ecca3, #45b791);
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.05s, box-shadow 0.05s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tap-circle:active {
            transform: scale(0.92);
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .shop-panel {
            padding: 20px;
            background: #0f3460;
        }

        .upgrade-btn {
            padding: 10px 25px;
            font-size: 1rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="stats">
            Score: <span id="score">0</span>
        </header>

        <main class="interaction-area">
            <button id="tap-button" class="tap-circle">TAP!</button>
        </main>

        <footer class="shop-panel">
            <button class="upgrade-btn" onclick="buyUpgrade()">Upgrade Power (+1)</button>
        </footer>
    </div>

    <script>
        // Game Logic
        let score = 0;
        let clickPower = 1;

        const scoreDisplay = document.getElementById('score');
        const tapButton = document.getElementById('tap-button');

        tapButton.addEventListener('click', () => {
            score += clickPower;
            scoreDisplay.innerText = score;
            
            // Optional: Vibrate on mobile
            if (navigator.vibrate) navigator.vibrate(20);
        });

        function buyUpgrade() {
            if (score >= 10) {
                score -= 10;
                clickPower += 1;
                scoreDisplay.innerText = score;
                alert("Upgrade purchased!");
            } else {
                alert("Not enough score!");
            }
        }
    </script>
</body>
</html>
