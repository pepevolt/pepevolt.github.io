<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<style>

/* ================= GLOBAL ================= */
html, body {
margin:0;
padding:0;
height:100%;
overflow:hidden;
touch-action:none;
-webkit-text-size-adjust:100%;
}

body{
font-family:Arial;
background: radial-gradient(circle at top, #0b1220, #020617);
color:white;
position:fixed;
width:100%;
text-align:center;
}

/* ================= NAVBAR ================= */
.navbar{
position:relative;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
background: rgba(255,255,255,0.06);
backdrop-filter: blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:12px;
}

/* ================= MAIN ================= */
.container{
position:absolute;
top:60px;
left:0;
right:0;
bottom:0;
display:flex;
flex-direction:column;
align-items:center;
padding:15px;
overflow:hidden;
gap:12px;
}

/* ================= TAP ================= */
.tap{
width:180px;
height:180px;
border-radius:50%;
background: linear-gradient(135deg,#00ff99,#00ccff);
border:none;
font-size:22px;
font-weight:bold;
color:black;
box-shadow:0 0 25px rgba(0,255,200,0.3);
}

/* ================= CARD (FIXED LAYOUT) ================= */
.card{
width:90%;
max-width:360px;

padding:14px;
background: rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:14px;

display:flex;
flex-direction:column;
gap:10px;
}

/* ================= INPUT FIX ================= */
input{
width:100%;
padding:12px;

border-radius:10px;
border:none;
outline:none;

background: rgba(0,0,0,0.35);
color:white;

box-sizing:border-box;
}

/* ================= BUTTON FIX ================= */
button{
width:100%;
padding:12px;

border:none;
border-radius:10px;

background: linear-gradient(90deg,#00ff99,#00ccff);
color:black;
font-weight:bold;
}

/* ================= DISCONNECT ================= */
.disconnect{
background: linear-gradient(90deg,#ff4d4d,#ff9900);
}

/* ================= LIVE TEXT ================= */
.live{
margin-top:10px;
font-size:14px;
opacity:0.9;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<div>⚡ POINTS: <span id="totalPoints">0</span></div>
<div>💎 TOKENS: <span id="totalTokens">0.0000</span></div>
<div>👤 <span id="userId">guest</span></div>
</div>

<!-- MAIN -->
<div class="container">

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="live">
Tap to earn points
</div>

<!-- WALLET CARD -->
<div class="card">
<input id="wallet" placeholder="Paste BSC wallet address">
<button id="walletBtn" onclick="toggleWallet()">CONNECT WALLET</button>
</div>

<!-- WITHDRAW CARD -->
<div class="card">
<input id="withdraw" placeholder="100 - 500 tokens">
<button onclick="withdraw()">WITHDRAW</button>
</div>

</div>

<script>

/* ================= STATE ================= */
let wallet = "";
let totalPoints = 0;
let userId = "guest";

const POINTS_PER_TOKEN = 10000;

/* ================= STORAGE ================= */
function saveData(){
if(wallet){
localStorage.setItem(wallet, JSON.stringify({ points: totalPoints }));
}
}

function loadData(w){
let data = localStorage.getItem(w);
if(data){
totalPoints = JSON.parse(data).points || 0;
}
}

/* ================= UI ================= */
function set(id,val){
let el=document.getElementById(id);
if(el) el.innerText=val;
}

function resetUI(){
set("totalPoints",0);
set("totalTokens","0.0000");
set("userId","guest");
}

/* ================= UPDATE ================= */
function updateUI(){
if(!wallet){
resetUI();
return;
}

set("totalPoints", totalPoints);
set("totalTokens", (totalPoints/POINTS_PER_TOKEN).toFixed(4));
}

/* ================= TAP ================= */
function tap(){
if(!wallet) return alert("Connect wallet first");

totalPoints++;
updateUI();
saveData();
}

/* ================= WALLET TOGGLE ================= */
function toggleWallet(){

let input=document.getElementById("wallet");
let addr=input.value.trim();
let btn=document.getElementById("walletBtn");

/* CONNECT */
if(!wallet){

if(!addr.startsWith("0x") || addr.length !== 42){
alert("Invalid wallet");
return;
}

wallet = addr;
loadData(wallet);

userId = wallet.slice(0,6)+"..."+wallet.slice(-4);
set("userId",userId);

btn.innerText = "DISCONNECT WALLET";

updateUI();

alert("Wallet connected");

}

/* DISCONNECT */
else{

saveData();

wallet = "";
totalPoints = 0;
userId = "guest";

btn.innerText = "CONNECT WALLET";

resetUI();

alert("Wallet disconnected");
}
}

/* ================= WITHDRAW ================= */
function withdraw(){

if(!wallet) return alert("Connect wallet first");

let amt=parseInt(document.getElementById("withdraw").value);

if(amt<100 || amt>500)
return alert("Only 100–500 tokens");

let requiredPoints = amt * POINTS_PER_TOKEN;

if(totalPoints < requiredPoints)
return alert("Not enough points");

totalPoints -= requiredPoints;

updateUI();
saveData();

alert("Withdrawal success");
}

/* ================= START ================= */
window.addEventListener("DOMContentLoaded",resetUI);

</script>

</body>

</html>
