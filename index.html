<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PEPEVOLT X</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>

body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
overflow-x:hidden;
}

.nav{
display:flex;
justify-content:space-around;
padding:15px;
background:#101010;
font-size:24px;
position:sticky;
top:0;
z-index:999;
}

.container{
width:92%;
margin:auto;
}

.hero{
margin-top:20px;
padding:22px;
border-radius:24px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(18px);
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:20px;
}

.box{
padding:18px;
background:#111;
border-radius:16px;
text-align:center;
}

.tap-btn{
width:260px;
height:260px;
border-radius:50%;
margin:40px auto;
background:radial-gradient(circle,#1f1f1f,#090909);
display:flex;
justify-content:center;
align-items:center;
font-size:48px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 60px rgba(0,255,150,0.25);
transition:0.2s;
}

.tap-btn:active{
transform:scale(0.94);
}

.actions{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
padding-bottom:40px;
}

button{
padding:15px 22px;
font-size:18px;
border:none;
border-radius:14px;
background:#151515;
color:#fff;
cursor:pointer;
}

.wallet{
margin-top:10px;
font-size:14px;
color:#aaa;
word-break:break-all;
}

</style>

</head>

<body>

<div class="nav">

<div>⚡ <span id="energy">0</span></div>

<div>🪙 <span id="gpvlt">0</span></div>

<div>💰 <span id="pvlt">0</span></div>

</div>

<div class="container">

<div class="hero">

<h2>PEPEVOLT X</h2>

<button onclick="connectWallet()">
Connect Wallet
</button>

<div class="wallet" id="wallet">
Wallet Not Connected
</div>

<div class="stats">

<div class="box">
Treasury
<br><br>
<span id="treasury">0</span>
</div>

<div class="box">
Wallet PVLT
<br><br>
<span id="walletPVLT">0</span>
</div>

<div class="box">
Daily Claim
<br><br>
10 - 1000
</div>

<div class="box">
Energy Cost
<br><br>
300 PVLT
</div>

</div>

</div>

<div class="tap-btn" onclick="tap()">
TAP
</div>

<div class="actions">

<button onclick="buyEnergy()">
Buy Energy
</button>

<button onclick="convert()">
Convert
</button>

<button onclick="claim()">
Claim
</button>

</div>

</div>

<script>

// CONTRACTS

const GAME =
"YOUR_GAME_CONTRACT";

const PVLT =
"YOUR_PVLT_CONTRACT";

const TREASURY =
"YOUR_TREASURY_CONTRACT";

let provider;
let signer;
let user;

const GAME_ABI = [

"function tap() external",

"function refillEnergy() external",

"function convertToPVLT(uint256 amount) external",

"function claimPVLT(uint256 amount) external",

"function energy(address) view returns(uint256)",

"function gPVLT(address) view returns(uint256)"

];

const TREASURY_ABI = [

"function treasuryBalance() view returns(uint256)"

];

const ERC20_ABI = [

"function balanceOf(address) view returns(uint256)",

"function approve(address,uint256) returns(bool)"

];

async function connectWallet(){

provider =
new ethers.providers.Web3Provider(
window.ethereum
);

await provider.send(
"eth_requestAccounts",
[]
);

signer = provider.getSigner();

user = await signer.getAddress();

document.getElementById("wallet")
.innerHTML = user;

loadData();

}

async function loadData(){

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const treasury =
new ethers.Contract(
TREASURY,
TREASURY_ABI,
signer
);

const pvlt =
new ethers.Contract(
PVLT,
ERC20_ABI,
signer
);

document.getElementById("energy")
.innerHTML =
ethers.utils.formatEther(
await game.energy(user)
);

document.getElementById("gpvlt")
.innerHTML =
ethers.utils.formatEther(
await game.gPVLT(user)
);

const walletBalance =
await pvlt.balanceOf(user);

document.getElementById("walletPVLT")
.innerHTML =
ethers.utils.formatEther(
walletBalance
);

document.getElementById("pvlt")
.innerHTML =
ethers.utils.formatEther(
walletBalance
);

document.getElementById("treasury")
.innerHTML =
ethers.utils.formatEther(
await treasury.treasuryBalance()
);

}

async function tap(){

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const tx =
await game.tap();

await tx.wait();

loadData();

}

async function buyEnergy(){

const pvlt =
new ethers.Contract(
PVLT,
ERC20_ABI,
signer
);

await pvlt.approve(
GAME,
ethers.utils.parseEther("300")
);

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const tx =
await game.refillEnergy();

await tx.wait();

loadData();

}

async function convert(){

const amount =
prompt("Enter gPVLT");

if(!amount) return;

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const tx =
await game.convertToPVLT(
ethers.utils.parseEther(amount)
);

await tx.wait();

loadData();

}

async function claim(){

const amount =
prompt("Enter PVLT");

if(!amount) return;

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const tx =
await game.claimPVLT(
ethers.utils.parseEther(amount)
);

await tx.wait();

loadData();

}

</script>

</body>
</html>
