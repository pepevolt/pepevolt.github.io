<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PepeVolt Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6 font-sans">

    <div class="flex justify-between w-full max-w-sm mb-10 text-lg bg-slate-800 p-4 rounded-xl">
        <div>⚡ <span id="energy">0</span></div>
        <div>💎 <span id="points">0</span></div>
        <div>🪙 <span id="gpvlt">0</span></div>
    </div>

    <button id="tapBtn" class="w-64 h-64 rounded-full bg-emerald-600 hover:bg-emerald-500 transition shadow-lg flex items-center justify-center text-4xl font-bold mb-8">TAP!</button>

    <div class="w-full max-w-sm flex flex-col gap-4">
        <button id="buyBtn" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold">Buy 10,000 Energy (100 PVLT)</button>
        <button id="convertBtn" class="bg-purple-600 disabled:opacity-30 p-4 rounded-xl font-bold">Convert Points</button>
        <button id="claimBtn" class="bg-amber-600 disabled:opacity-30 p-4 rounded-xl font-bold">Claim Rewards</button>
    </div>

    <script>
        const GAME_ADDRESS = "YOUR_GAME_CONTRACT_ADDRESS";
        const PVLT_ADDRESS = "YOUR_PVLT_CONTRACT_ADDRESS";
        const ABI_GAME = ["function tap() external", "function buyEnergy() external", "function convertPoints() external", "function claimRewards() external", "function getPlayer(address) view returns(uint256, uint256, uint256, bool, uint256)"];
        const ABI_PVLT = ["function approve(address spender, uint256 amount) external returns (bool)"];

        let provider, signer, gameContract, pvltContract, userAddress;

        async function init() {
            if (!window.ethereum) return alert("Install MetaMask");
            provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            userAddress = await signer.getAddress();
            
            gameContract = new ethers.Contract(GAME_ADDRESS, ABI_GAME, signer);
            pvltContract = new ethers.Contract(PVLT_ADDRESS, ABI_PVLT, signer);
            updateStats();
        }

        async function updateStats() {
            const p = await gameContract.getPlayer(userAddress);
            document.getElementById('energy').innerText = p[0];
            document.getElementById('points').innerText = p[1];
            document.getElementById('gpvlt').innerText = p[2];
            
            document.getElementById('convertBtn').disabled = p[1] < 100;
            document.getElementById('claimBtn').disabled = !(p[2] >= 100 && p[2] <= 1000);
        }

        document.getElementById('tapBtn').onclick = async () => {
            await (await gameContract.tap()).wait();
            updateStats();
        };

        document.getElementById('buyBtn').onclick = async () => {
            const amount = ethers.utils.parseEther("100");
            await (await pvltContract.approve(GAME_ADDRESS, amount)).wait();
            await (await gameContract.buyEnergy()).wait();
            updateStats();
        };

        document.getElementById('convertBtn').onclick = async () => {
            await (await gameContract.convertPoints()).wait();
            updateStats();
        };

        document.getElementById('claimBtn').onclick = async () => {
            await (await gameContract.claimRewards()).wait();
            updateStats();
        };

        init();
    </script>
</body>
</html>
