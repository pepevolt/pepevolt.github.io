<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PepeVolt</title>

<style>
body {
    margin:0;
    background:#0f0f12;
    font-family:sans-serif;
    color:white;
}

/* TOP NAV */
.top-nav {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:12px 10px;
    background:#11131a;
    border-bottom:1px solid #222;
    font-size:18px;
}

/* CENTER */
.center {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
}

/* TAP CIRCLE */
.tap-circle {
    width:140px;
    height:140px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #3b82f6, #1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
    box-shadow:0 0 20px rgba(59,130,246,0.6);
    transition:0.2s;
}

.tap-circle:active {
    transform:scale(0.92);
}

/* BUTTONS */
button {
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

#connect-button { background:#3b82f6; color:white; }
#buy-energy { background:#f59e0b; color:white; }
#claim-pvlt { background:#10b981; color:white; }

.locked {
    opacity:0.4;
    pointer-events:none;
}
</style>
</head>

<body>

<!-- TOP NAV -->
<div class="top-nav">
    <div id="energy">⚡ -</div>
    <div id="points">🪙 -</div>
    <div id="pvlt">💎 -</div>
</div>

<!-- CENTER -->
<div class="center">

    <div class="tap-circle" id="tap-circle">LOCKED</div>

    <button id="connect-button">Connect Wallet</button>
    <button id="buy-energy" class="locked">Buy Energy</button>
    <button id="claim-pvlt" class="locked">Claim PVLT</button>

</div>

<script type="module">
import { createAppKit } from "https://esm.sh/@reown/appkit"
import { EthersAdapter } from "https://esm.sh/@reown/appkit-adapter-ethers"
import { mainnet, polygon } from "https://esm.sh/@reown/appkit/networks"

const modal = createAppKit({
    projectId: "1731f99148b9cf6107dee70b6efb14b7",
    adapters: [new EthersAdapter()],
    networks: [mainnet, polygon],
    metadata: {
        name: "PepeVolt",
        description: "Connect Wallet",
        url: window.location.origin,
        icons: ["https://avatars.githubusercontent.com/u/37784886"]
    }
});

/* ---------------- STATE ---------------- */
let isConnected = false;
let energy = 0;
let points = 0;
let pvlt = 0;

/* ---------------- UI UPDATE ---------------- */
function updateUI() {
    if (!isConnected) return;

    document.getElementById("energy").innerText = `⚡ ${energy}`;
    document.getElementById("points").innerText = `🪙 ${points}`;
    document.getElementById("pvlt").innerText = `💎 ${pvlt}`;
}

/* ---------------- LOCK GAME ---------------- */
function lockGame() {
    isConnected = false;

    document.getElementById("tap-circle").innerText = "LOCKED";

    document.querySelectorAll("#buy-energy, #claim-pvlt").forEach(btn => {
        btn.classList.add("locked");
    });
}

/* ---------------- UNLOCK GAME ---------------- */
function unlockGame() {
    isConnected = true;

    energy = 50;
    points = 0;
    pvlt = 0;

    document.getElementById("tap-circle").innerText = "TAP";

    document.querySelectorAll("#buy-energy, #claim-pvlt").forEach(btn => {
        btn.classList.remove("locked");
    });

    updateUI();
}

/* ---------------- TAP ---------------- */
document.getElementById("tap-circle").addEventListener("click", () => {
    if (!isConnected) return;
    if (energy <= 0) return;

    energy -= 1;
    points += 1;

    if (points >= 100) {
        pvlt += Math.floor(points / 100);
        points = points % 100;
    }

    updateUI();
});

/* ---------------- CONNECT WALLET ---------------- */
document.getElementById("connect-button").addEventListener("click", async () => {
    modal.open();

    const check = setInterval(async () => {
        try {
            const provider = await modal.getWalletProvider?.();

            if (provider?.accounts?.length > 0) {
                clearInterval(check);
                unlockGame();
            }
        } catch (e) {}
    }, 500);
});

/* ---------------- BUY ENERGY ---------------- */
document.getElementById("buy-energy").addEventListener("click", () => {
    if (!isConnected) return;

    energy += 50;
    updateUI();
});

/* ---------------- CLAIM PVLT ---------------- */
document.getElementById("claim-pvlt").addEventListener("click", () => {
    if (!isConnected) return;

    alert(`Claimed ${pvlt} PVLT`);
    pvlt = 0;
    updateUI();
});

lockGame();
</script>

</body>
</html>
