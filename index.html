<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tap Energy: PVLT Converter</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* main card */
        .game-container {
            max-width: 560px;
            width: 100%;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(2px);
            border-radius: 64px 64px 48px 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            padding: 20px 18px 32px;
            transition: all 0.2s;
            border: 1px solid rgba(90, 150, 220, 0.25);
        }

        /* top nav : Energy, Points, gPVLT */
        .top-stats {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            background: #0b1120dd;
            border-radius: 120px;
            padding: 12px 20px;
            margin-bottom: 28px;
            backdrop-filter: blur(4px);
            border: 1px solid #2a3a60;
            box-shadow: inset 0 1px 3px #00000030, 0 6px 12px #00000020;
        }

        .stat-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #010a1a;
            border-radius: 60px;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            box-shadow: inset 0 1px 2px #4c6e9e30, 0 2px 4px #00000040;
        }

        .stat-emoji {
            font-size: 1.7rem;
            filter: drop-shadow(0 2px 2px black);
        }

        .stat-value {
            font-family: 'Monaco', 'Courier New', monospace;
            font-weight: 800;
            background: linear-gradient(135deg, #f9f3c1, #ffd966);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 4px #ffb34730;
            font-size: 1.4rem;
        }

        /* tapping area */
        .tap-zone {
            background: radial-gradient(circle at 30% 20%, #1f2c44, #0e1625);
            border-radius: 90px;
            margin: 15px 0 20px;
            padding: 28px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.07s linear, box-shadow 0.1s;
            border: 2px solid #ffd966aa;
            box-shadow: 0 12px 0px #0b0f1a, inset 0 1px 4px rgba(255, 215, 120, 0.6);
        }

        .tap-zone:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0px #0b0f1a;
        }

        .tap-icon {
            font-size: 5rem;
            display: inline-block;
            filter: drop-shadow(0 6px 6px #00000066);
            margin-bottom: 10px;
        }

        .tap-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffecb3;
            text-shadow: 0 2px 5px black;
            letter-spacing: 1px;
        }

        .tap-energy-cost {
            font-size: 0.9rem;
            background: #1e2a3a;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            margin-top: 8px;
            color: #b9e2ff;
        }

        /* BUTTONS panel */
        .action-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 20px 0 18px;
            justify-content: center;
        }

        .game-btn {
            background: #121f2f;
            border: none;
            font-family: inherit;
            font-weight: bold;
            padding: 12px 18px;
            border-radius: 60px;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 #03060c;
            color: #f0f3fa;
            flex: 1 0 auto;
            justify-content: center;
        }

        .game-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #03060c;
        }

        .btn-buy {
            background: #2c4f6e;
            color: #ffe5b4;
            border-bottom: 2px solid #ffbc6e;
        }

        .btn-claim {
            background: #3f2e3e;
            color: #ffdfa5;
            border-bottom: 2px solid #d4af37;
        }

        .connect-btn {
            background: #264653;
            color: #b8f2e6;
            border-bottom: 2px solid #2a9d8f;
        }

        .disconnect-btn {
            background: #642c3b;
            color: #ffbcb5;
            border-bottom: 2px solid #bc4a6b;
        }

        hr {
            border-color: #2a3f5e;
            margin: 12px 0;
        }

        .info-text {
            font-size: 0.75rem;
            text-align: center;
            color: #8aa1c0;
            background: #010a1c60;
            padding: 10px;
            border-radius: 40px;
            margin-top: 18px;
        }

        .status-led {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 12px;
            background: #4caf50;
            box-shadow: 0 0 6px #00ffaa;
            margin-right: 6px;
        }

        .disconnect-led {
            background: #b33b4a;
            box-shadow: none;
        }

        button:disabled {
            opacity: 0.5;
            transform: translateY(0);
            cursor: not-allowed;
        }

        @keyframes tapGlow {
            0% { text-shadow: 0 0 0 gold; }
            100% { text-shadow: 0 0 18px #ffb347; }
        }

        .tap-feedback {
            animation: tapGlow 0.2s ease-out;
        }

        @media (max-width: 480px) {
            .stat-value { font-size: 1.1rem; }
            .stat-emoji { font-size: 1.4rem; }
            .tap-icon { font-size: 4rem; }
            .tap-text { font-size: 1.5rem; }
            .game-btn { padding: 10px 12px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="game-container" id="gameRoot">
    <!-- Top Nav: 1.Energy 2.Points 3.gPVLT (as emoji + value) -->
    <div class="top-stats">
        <div class="stat-card"><span class="stat-emoji">⚡</span><span class="stat-value" id="energyVal">0</span></div>
        <div class="stat-card"><span class="stat-emoji">⭐</span><span class="stat-value" id="pointsVal">0</span></div>
        <div class="stat-card"><span class="stat-emoji">💎</span><span class="stat-value" id="gpvltVal">0.00</span></div>
    </div>

    <!-- Tapping Area -->
    <div class="tap-zone" id="tapArea">
        <div class="tap-icon">👆⚡</div>
        <div class="tap-text">TAP +1 POINT</div>
        <div class="tap-energy-cost">Cost: -1 Energy | +0.2 Energy/5s regen</div>
    </div>

    <!-- Connect / Disconnect Button and status row -->
    <div style="display: flex; gap: 12px; margin-bottom: 18px;">
        <button class="game-btn connect-btn" id="connectBtn">🔌 CONNECT</button>
        <button class="game-btn disconnect-btn" id="disconnectBtn">⛔ DISCONNECT</button>
    </div>
    <div id="connectionStatus" style="text-align: center; margin-top: -8px; margin-bottom: 12px; font-size: 0.8rem; font-weight: bold;">
        <span id="statusLed" class="status-led"></span> <span id="statusText">DISCONNECTED</span>
    </div>

    <!-- Conversion row: 10000 Energy = 100 PVLT (Buy Button) -->
    <div class="action-panel">
        <button class="game-btn btn-buy" id="buyPVLTbtn">🛒 10000⚡ → 100 PVLT</button>
        <button class="game-btn btn-claim" id="claimGpvlBtn">✨ 10 gPVLT → 1 PVLT (Burn 10gPVLT)</button>
    </div>

    <!-- extra info & bottom notes -->
    <div class="info-text">
        💡 Auto-convert: 100 Points = 1 gPVLT (instant).<br>
        💎 gPVLT = stored grams of PVLT | 1 PVLT = 10 gPVLT burned.
    </div>
    <div class="info-text" id="debugMsg" style="font-size:0.7rem; opacity:0.8;">⚡ Energy regen: +1 per 5 sec (capped 50/10000)</div>
</div>

<script>
    // --- Game State ---
    let energy = 50;           // current energy (starting 50)
    let points = 0;            // raw points (100 points -> 1 gPVLT auto)
    let gpvlt = 0;             // gPVLT (grams) used for claim
    let pvltBalance = 0;       // actual PVLT tokens (displayed? we'll show in info modal)
    
    // UI elements
    const energySpan = document.getElementById('energyVal');
    const pointsSpan = document.getElementById('pointsVal');
    const gpvltSpan = document.getElementById('gpvltVal');
    const tapArea = document.getElementById('tapArea');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const buyPVLTbtn = document.getElementById('buyPVLTbtn');
    const claimGpvlBtn = document.getElementById('claimGpvlBtn');
    const statusLedSpan = document.getElementById('statusLed');
    const statusTextSpan = document.getElementById('statusText');
    const debugMsgSpan = document.getElementById('debugMsg');
    
    // Connection state: if disconnected -> tapping / buy / claim disabled (regen still works? but spec says connect/disconnect button semantic)
    // Typically connect enables core features, disconnect disables interactions.
    let isConnected = false;   // start disconnected -> user must press connect
    
    // Energy regen timer: +1 Energy every 5 seconds, capped at 50 max (but also overall max is 10000 according to top nav)
    // According to description: "+1 Energy/5 seconds up to 50/10000" -> means regen only works until 50 energy? 
    // Actually spec "1 Tap=+1 Points-1Energy+1Energy/5 seconds up to 50/10000(top nav in emoji 1.Energy,2.Points 3.gPVLT)"
    // Also shows max storage: 50/10000 -> current energy / max energy (10000 max). Regen stops at 50? or regen until 50? Typically may refer to regen stops at 50? but also you can buy energy via PVLT conversion.
    // But I'll implement: Energy maximum = 10000, regeneration of +1 energy every 5 seconds BUT only if energy < 50? Or regen works until 50? 
    // Since design says "+1Energy/5 seconds up to 50/10000" means passive regen brings you up to 50 (softcap), but you can exceed 50 by buying energy? The Buy Button: 10000Energy=100PVLT -> spending energy to get PVLT. So energy can go above 50 via purchases? From where you gain energy? Actually the only gain of energy: regen 1 per 5 seconds (soft up to 50) and maybe from other mechanics? no. So tapping costs energy, regen up to 50. That's fine.
    // Also no direct +energy except regen. Thus max normal energy is 50 from regen, but you can have more than 50? We'll allow max cap 10000 but only regen when <50, otherwise no regen. So if you buy PVLT using energy (cost 10000 energy) you need to store high energy? But you can't exceed 50 with regen so not possible. But maybe user can get extra energy from ??? We'll just allow cap 10000 but regen only under 50. But tapping requires energy, so user cannot spam forever. That's okay, because the buy button would never be reachable unless we provide additional gain. So to make the game functional: we must allow points to buy energy or other? However spec defined 10000Energy = 100PVLT (Buy Button). We also have auto points -> gPVLT -> PVLT. Additionally let's implement an exchange: But there is no way to get 10000 energy without any external boost. I need to adjust: let regen always happen up to max energy 10000? Or provide additional energy generation through points? But spec just describes tap and regen. Also no other energy source. That would make 10000 energy impossible. However users can store energy gradually if regen goes all the way to 10000, which would take many hours. To remain faithful and playable, I'll allow energy regen every 5 seconds up to full cap 10000, so over time players can stockpile energy (but still tap cost 1). So we change regen rule: +1 Energy / 5 seconds, never above maxEnergy = 10000. So players can accumulate energy up to 10000 and then use Buy button to exchange 10000 energy -> 100 PVLT. This is consistent and playable. "up to 50/10000" might display current/max but regen works until max? We'll use max 10000, and top nav shows current/max like 320/10000? I'll implement current Energy value and max limit: maxEnergy = 10000, regen unconditionally if energy < 10000. The "up to 50" wording might just be initial, but we show clearly. I'll show max as 10000.
    let maxEnergy = 10000;
    
    // Energy regen interval
    let regenInterval = null;
    
    // Helper: update all UI
    function updateUI() {
        // format numbers
        energySpan.innerText = `${Math.floor(energy)}/${maxEnergy}`;
        pointsSpan.innerText = Math.floor(points);
        gpvltSpan.innerText = gpvlt.toFixed(2);
        // Update button states based on connection & resources
        buyPVLTbtn.disabled = !isConnected || energy < 10000;
        claimGpvlBtn.disabled = !isConnected || gpvlt < 10;
        // Also show tooltip style
        if (energy < 10000) buyPVLTbtn.title = "Need 10000 Energy";
        else buyPVLTbtn.title = "Exchange 10000⚡ → 100 PVLT";
        if (gpvlt < 10) claimGpvlBtn.title = `Need 10 gPVLT (you have ${gpvlt.toFixed(2)})`;
        else claimGpvlBtn.title = "Burn 10 gPVLT → +1 PVLT";
        // status led
        if (isConnected) {
            statusLedSpan.className = "status-led";
            statusTextSpan.innerText = "CONNECTED ⚡";
        } else {
            statusLedSpan.classList.add("disconnect-led");
            statusLedSpan.className = "status-led disconnect-led";
            statusTextSpan.innerText = "DISCONNECTED";
        }
    }
    
    // Auto convert points to gPVLT when points >= 100
    function autoConvertPoints() {
        if (points >= 100) {
            let convertCount = Math.floor(points / 100);
            let earnedGpvlt = convertCount;      // 100 points = 1 gPVLT
            gpvlt += earnedGpvlt;
            points -= convertCount * 100;
            // feedback message optional
            if (earnedGpvlt > 0) {
                flashMsg(`${earnedGpvlt} gPVLT earned!`);
            }
            updateUI();
            // recursive in case points still >=100 (edge)
            if (points >= 100) autoConvertPoints();
        }
    }
    
    // Helper flash for debug (tiny)
    function flashMsg(msg) {
        const oldText = debugMsgSpan.innerText;
        debugMsgSpan.innerText = `✨ ${msg}`;
        setTimeout(() => { if(debugMsgSpan) debugMsgSpan.innerText = oldText; }, 1500);
    }
    
    // Tap action: +1 Point, -1 Energy (only if energy >=1 AND connected)
    function performTap() {
        if (!isConnected) {
            flashMsg("⛔ Not connected. Press CONNECT first!");
            return;
        }
        if (energy < 1) {
            flashMsg("💤 Not enough energy! Wait for regen.");
            return;
        }
        // deduct energy, add point
        energy -= 1;
        points += 1;
        // auto convert points to gPVLT after increment
        autoConvertPoints();
        // visual effect for tap
        tapArea.classList.add('tap-feedback');
        setTimeout(() => tapArea.classList.remove('tap-feedback'), 150);
        updateUI();
        // additional boundary: energy below zero fix
        if (energy < 0) energy = 0;
        // check if any conversion updated gpvlt again? but autoConvertPoints handled
    }
    
    // Energy regen: +1 every 5 seconds, capped maxEnergy
    function regenEnergyTick() {
        if (energy < maxEnergy) {
            energy = Math.min(energy + 1, maxEnergy);
            updateUI();
            // optional regen message clean
        }
    }
    
    // buy: 10000 Energy = 100 PVLT  (requires connected)
    function buyPVLT() {
        if (!isConnected) {
            flashMsg("Connect first to trade!");
            return;
        }
        if (energy >= 10000) {
            energy -= 10000;
            pvltBalance += 100;
            flashMsg(`✅ +100 PVLT! Total PVLT: ${pvltBalance}`);
            updateUI();
            // extra top up? no other changes.
        } else {
            flashMsg(`❌ Not enough energy. Need ${10000 - energy} more.`);
        }
    }
    
    // claim: 10 gPVLT burned -> +1 PVLT
    function claimPVLTfromGrams() {
        if (!isConnected) {
            flashMsg("Connect to claim PVLT.");
            return;
        }
        if (gpvlt >= 10) {
            gpvlt -= 10;
            pvltBalance += 1;
            flashMsg(`🔥 Burned 10 gPVLT → +1 PVLT! Total PVLT: ${pvltBalance}`);
            updateUI();
        } else {
            flashMsg(`⛔ Need 10 gPVLT (currently ${gpvlt.toFixed(2)})`);
        }
    }
    
    // connection logic: enabling/disabling interactive features (tapping and buttons functionality)
    function setConnected(state) {
        isConnected = state;
        if (isConnected) {
            // ensure regen interval is on (always on regardless, but keep global)
            flashMsg("🔌 System ONLINE. Tap to earn!");
        } else {
            flashMsg("⚡ System OFFLINE. Reconnect to earn & convert.");
        }
        updateUI();
    }
    
    // initialization and intervals
    function init() {
        energy = 50;
        points = 0;
        gpvlt = 0;
        pvltBalance = 0;
        isConnected = false;
        updateUI();
        
        // start energy regen loop
        if (regenInterval) clearInterval(regenInterval);
        regenInterval = setInterval(() => {
            regenEnergyTick();
        }, 5000); // 5 seconds
        
        // attach event listeners
        tapArea.addEventListener('click', (e) => {
            e.stopPropagation();
            performTap();
        });
        
        connectBtn.addEventListener('click', () => {
            setConnected(true);
        });
        
        disconnectBtn.addEventListener('click', () => {
            setConnected(false);
        });
        
        buyPVLTbtn.addEventListener('click', () => {
            buyPVLT();
        });
        
        claimGpvlBtn.addEventListener('click', () => {
            claimPVLTfromGrams();
        });
        
        // auxiliary: display PVLT balance in info line (not shown in main stats but we add optional)
        const container = document.querySelector('.game-container');
        const pvltDisplayDiv = document.createElement('div');
        pvltDisplayDiv.className = 'info-text';
        pvltDisplayDiv.style.background = '#0b1424';
        pvltDisplayDiv.style.marginTop = '10px';
        pvltDisplayDiv.style.fontWeight = 'bold';
        pvltDisplayDiv.innerHTML = `💰 PVLT Balance: <span id="pvltBalanceSpan">0</span> PVLT`;
        container.appendChild(pvltDisplayDiv);
        
        // update pvlt balance display function extension
        function updatePvltDisplay() {
            const span = document.getElementById('pvltBalanceSpan');
            if (span) span.innerText = pvltBalance;
        }
        // override updateUI to include pvlt span
        const originalUpdate = updateUI;
        window.updateUI = function() {
            originalUpdate();
            const pvltSpan = document.getElementById('pvltBalanceSpan');
            if (pvltSpan) pvltSpan.innerText = pvltBalance;
            // also show max energy tooltip
        };
        updateUI = window.updateUI;
        // also call original hook
        updateUI();
        // also add manual interval for pvlt refresh
        setInterval(() => {
            if (document.getElementById('pvltBalanceSpan')) 
                document.getElementById('pvltBalanceSpan').innerText = pvltBalance;
        }, 200);
        
        // handle connection state to prevent negative tapping on disabled area
        // Also extra safety: ensure energy boundaries
    }
    
    // start the game
    init();
    
    // additional check for display: auto convert points also on any points increase from other events? Only tap changes points, but also no other points source. autoConvertPoints already called.
    // also after buying pvlt, no points change, fine.
    // make sure regen works even when disconnected (still passive)
    // Small patch for buy button: if not connected, disable and show
    // Adding extra UI explanation: we also update the disconnect status effect on tapping.
    // Final spec details: top nav shows energy/points/gpvlt and we have connect/disconnect buttons. 
    // Also additional: 10000Energy=100 PVLT has Buy Button and 10gPVLT burned claim 1 PVLT button. done.
    // Ensure that when we auto-convert points -> gpvlt, we show correct.
    // For large click, it's stable.
    // One more extra: since points are automatically converted every time we hit multiple of 100, we also add conversion after any adjustment.
    // Might call autoConvertPoints after every points change, but we already inside performTap.
    // Edge case: if points overflow from other (none) fine.
    // User can see current PVLT via bottom line, and also gPVLT is visible.
    // Enhance toast like.
    
    // Also disable context menu on tap zone to avoid right click
    tapArea.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // Provide slight manual interval for ui sync 
    setInterval(() => {
        if (energy < 0) energy = 0;
        if (energy > maxEnergy) energy = maxEnergy;
        if (points < 0) points = 0;
        updateUI();
    }, 300);
</script>
</body>
</html>
