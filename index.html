<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt UI</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-accent: #00ffcc;
            --text-color: #ffffff;
        }

        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-color);
            display: flex; justify-content: center; padding: 20px;
        }

        .game-container { width: 100%; max-width: 400px; }

        /* Top Stats Bar */
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }

        /* The Pepe Circle */
        .pepe-circle { 
            width: 200px; height: 100px; margin: 20px auto;
            background: radial-gradient(circle, #00ffcc, #0099ff);
            border-radius: 50% / 50%;
            display: flex; align-items: center; justify-content: center;
        }

        /* Main Content Card */
        .main-card { 
            background: var(--card-bg); padding: 20px; border-radius: 20px; 
            border: 1px solid #30363d;
        }

        .connect-text { margin-bottom: 15px; color: #8b949e; }

        /* Buttons */
        .btn { 
            width: 100%; padding: 18px; border-radius: 12px; border: none;
            font-weight: 800; font-size: 1rem; cursor: pointer;
            margin-bottom: 15px; text-transform: uppercase;
            background: linear-gradient(90deg, #00ffcc, #0099ff);
            color: black;
        }

        /* Treasury/Wallet Section */
        .info-box { 
            background: #0d1117; padding: 15px; border-radius: 12px;
            margin-bottom: 20px; font-size: 0.9rem;
        }
        .info-row { display: flex; justify-content: space-between; margin: 5px 0; }
        .highlight { color: var(--primary-accent); }

        .footer-text { text-align: center; font-size: 0.8rem; color: #8b949e; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-bar">
            <span>🔋 50</span> <span>⚡ 0</span> <span>💎 0.0000</span>
        </div>

        <div class="pepe-circle">
            <img src="https://via.placeholder.com/60" alt="Pepe">
        </div>

        <div class="main-card">
            <div class="connect-text">Connect Polygon Wallet</div>
            <button class="btn">Connect Wallet</button>

            <div class="info-box">
                <div class="info-row"><span>🏛 Treasury Vault:</span> <span class="highlight">0.00 PVLT</span></div>
                <div class="info-row"><span>💩 Your Wallet:</span> <span class="highlight">0.00 PVLT</span></div>
            </div>

            <button class="btn">Convert gPVLT</button>
            <button class="btn">Buy Energy</button>
            <button class="btn">Claim PVLT</button>
        </div>

        <div class="footer-text">
            <p>1 Tap = 1 gPVLT<br>10,000 gPVLT = 1 PVLT Token</p>
            <p style="color: var(--primary-accent);">Claim Limits: Minimum 100 PVLT - Maximum 500 PVLT</p>
        </div>
    </div>
</body>
</html>
