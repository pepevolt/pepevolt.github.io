<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

button{
padding:15px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.tap{
width:200px;
height:200px;
border-radius:50%;
background:#00ff99;
font-size:30px;
}

.card{
margin-top:20px;
background:#111827;
padding:20px;
border-radius:15px;
}

</style>

</head>

<body>

<h2>Tap To Earn (BSC)</h2>

<div>Wallet: <span id="wallet">Not Connected</span></div>

<div>Points: <span id="points">0</span></div>

<button onclick="connect()">Connect</button>

<button class="tap" onclick="tap()">TAP</button>

<button onclick="sendBatch()">SEND TO BSC</button>

<div class="card">
<h3>Leaderboard</h3>
<div id="board"></div>
</div>

<script>

const contractAddress = "YOUR_CONTRACT_ADDRESS";

const abi = [
"function tap(uint256 amount)",
"function getPoints(address) view returns (uint256)"
];

let provider, signer, contract, wallet;

let localPoints = 0;

async function connect(){

if(!window.ethereum){
alert("Install wallet");
return;
}

provider = new ethers.providers.Web3Provider(window.ethereum);

await provider.send("eth_requestAccounts", []);

signer = provider.getSigner();

wallet = await signer.getAddress();

document.getElementById("wallet").innerText =
wallet.slice(0,6)+"..."+wallet.slice(-4);

contract = new ethers.Contract(contractAddress, abi, signer);

load();

}

function tap(){

localPoints++;

document.getElementById("points").innerText = localPoints;

}

async function sendBatch(){

if(localPoints === 0) return;

try{

let tx = await contract.tap(localPoints);

await tx.wait();

localPoints = 0;

document.getElementById("points").innerText = 0;

load();

}catch(e){

console.log(e);

}

}

async function load(){

let p = await contract.getPoints(wallet);

document.getElementById("points").innerText = p;

}

</script>

</body>
</html>
