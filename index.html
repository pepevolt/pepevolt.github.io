<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>PVLT Tap Hub</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3modal@1.9.12/dist/index.js"></script>

    <style>
        :root {
            --bg-color: #050a12;
            --panel-bg: rgba(16, 24, 40, 0.65);
            --border-glow: rgba(0, 255, 153, 0.15);
            --primary: #00ff99;
            --secondary: #00e5ff;
            --text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, rgba(0, 229, 255, 0.12), transparent 50%),
                              radial-gradient(circle at 50% 80%, rgba(0, 255, 153, 0.05), transparent 50%);
            color: var(--text);
            overflow: hidden;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* FIXED TOP STATS BAR */
        .header-stats {
            display: flex;
            justify-content: space-around;
            background: rgba(9, 14, 26, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 10px;
            z-index: 10;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 800;
        }

        .stat-value.green { color: var(--primary); }
        .stat-value.blue { color: var(--secondary); }

        /* VIEWPORT CONTAINER */
        .view-container {
            flex: 1;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .app-view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.25s ease-out forwards;
        }

        .app-view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* TAP ZONE VIEW */
        .clicker-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin: auto 0;
        }

        .tap-target {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,153,0.18) 0%, rgba(5,10,18,0.8) 70%);
            border: 4px solid rgba(0, 255, 153, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(0, 255, 153, 0.15), inset 0 0 20px rgba(0, 229, 255, 0.15);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.08s ease;
            position: relative;
        }

        .tap-target:active {
            transform: scale(0.95);
            border-color: var(--secondary);
            box-shadow: 0 0 45px rgba(0, 229, 255, 0.35);
        }

        .tap-target img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            pointer-events: none;
        }

        .energy-bar-container {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .energy-text {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.8;
        }

        .energy-track {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            box-shadow: 0 0 10px var(--primary);
            transition: width 0.2s ease;
        }

        /* GLASS PANELS */
        .panel {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        .panel-header {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
            margin-bottom: 12px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .data-row:last-of-type { border-bottom: none; }

        .data-label { opacity: 0.7; }
        .data-value { font-weight: 600; }
        .data-value.highlight { color: var(--primary); }

        /* BUTTON LAYERS */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.99); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary { background: linear-gradient(90deg, var(--primary), var(--secondary)); color: #000; }
        .btn-purple { background: linear-gradient(90deg, #b066ff, var(--secondary)); color: #fff; }
        .btn-orange { background: linear-gradient(90deg, #ff9900, #ff5500); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #fff; }

        /* NAVIGATION FOOTER */
        .bottom-nav {
            width: 100%;
            background: rgba(9, 14, 26, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 100;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #ffffff;
            opacity: 0.4;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .nav-tab.active {
            opacity: 1;
            color: var(--primary);
        }

        .nav-icon { font-size: 20px; }

        /* INTERACTIVE MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 11, 24, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            width: 88%;
            max-width: 330px;
            background: #0d1527;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-box h3 { margin-bottom: 10px; font-size: 18px; color: var(--primary); }
        .modal-box p { font-size: 13px; opacity: 0.8; line-height: 1.5; margin-bottom: 20px; }
        .modal-btns { display: flex; gap: 10px; }

        /* FLOATING TEXT ANIMATION (+1 EFFECT) */
        .floating-text {
            position: absolute;
            color: var(--primary);
            font-size: 26px;
            font-weight: 800;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 0 8px rgba(0,255,153,0.6);
            z-index: 200;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }
    </style>
</head>
<body>

    <div class="header-stats">
        <div class="stat-item">
            <span class="stat-label">⚡ Points</span>
            <span class="stat-value" id="points">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">💎 PVLTG</span>
            <span class="stat-value blue" id="pvltg">0.0000</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Wallet PVLT</span>
            <span class="stat-value green" id="userPvltBalance">0.0000</span>
        </div>
    </div>

    <div class="view-container">

        <div class="app-view active" id="view-mine">
            <div class="clicker-box">
                <div class="tap-target" id="tapZone">
                    <img src="images/IMG_1850.png" alt="Target Coin">
                </div>
                
                <div class="energy-bar-container">
                    <div class="energy-text">🛢️ <span id="energy">50</span> / 50</div>
                    <div class="energy-track">
                        <div class="energy-fill" id="energyBar"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-view" id="view-wallet">
            <div class="panel">
                <div class="panel-header">Identity</div>
                <button class="btn btn-primary" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
                <div class="data-row" id="walletRow" style="display:none; border:none; padding:4px 0;">
                    <span class="data-label">Connected Wallet</span>
                    <span class="data-value highlight" id="walletInput">Not Connected</span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Pool Reserves</div>
                <div class="data-row">
                    <span class="data-label">Available Treasury Pool</span>
                    <span class="data-value" style="color:var(--secondary);" id="treasuryPvltPool">0.0000</span>
                </div>
            </div>

            <button class="btn btn-primary" style="margin-bottom:12px;" onclick="openBuyModal()">BUY INSTANT ENERGY (+100k Pack)</button>
            <button class="btn btn-purple" style="margin-bottom:12px;" id="swapBtn" onclick="openSwapModal()">SWAP POINTS → PVLTG</button>
            <button class="btn btn-orange" id="withdrawBtn" onclick="claimPVLT()">WITHDRAW PVLT TO WALLET</button>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-tab active" onclick="switchTab('mine', this)">
            <div class="nav-icon">⛏️</div>
            <div>Mine</div>
        </button>
        <button class="nav-tab" onclick="switchTab('wallet', this)">
            <div class="nav-icon">💼</div>
            <div>Ecosystem</div>
        </button>
    </div>

    <div class="modal-overlay" id="buyModal">
        <div class="modal-box">
            <h3>Buy Energy Pack</h3>
            <p>Spend <b>100 PVLT</b> to instantly refill 100,000 Energy units?</p>
            <div class="modal-btns">
                <button class="btn btn-outline" style="margin:0;" onclick="closeBuyModal()">Cancel</button>
                <button class="btn btn-primary" id="confirmPaymentBtn" onclick="executeEnergyPurchase()">Confirm</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="swapModal">
        <div class="modal-box">
            <h3>Swap Credits</h3>
            <p id="swapModalText">Convert accumulated points into PVLTG internal tokens?</p>
            <div class="modal-btns">
                <button class="btn btn-outline" style="margin:0;" onclick="closeSwapModal()">Cancel</button>
                <button class="btn btn-purple" id="confirmSwapBtn" onclick="executePointsSwap()">Confirm Swap</button>
            </div>
        </div>
    </div>

<script>
    const API = "https://pepevolt-game-suite.onrender.com/";
    const PVLT_TOKEN_ADDRESS = "0xf4c400280f0d6aF9340fCD491F0cb5A7b51f70F1";
    const GAME_TREASURY_ADDRESS = "0x1dC8375d5D8C3fbCBaD85417ce66E9740D6b05e7";
    const TOKEN_DECIMALS = 18;

    let web3Modal = null, web3Provider = null, wallet = "";
    let points = 0, energy = 50, pvltg = 0;

    window.addEventListener('DOMContentLoaded', () => {
        try {
            const providerOptions = {
                walletconnect: {
                    package: window.WalletConnectProvider ? window.WalletConnectProvider.default : null,
                    options: { rpc: { 137: "https://polygon-rpc.com" }, chainId: 137 }
                }
            };
            web3Modal = new window.Web3Modal.default({ cacheProvider: false, providerOptions, theme: "dark" });
        } catch (e) { console.error("Web3Modal loading skipped.", e); }
    });

    function switchTab(tabId, element) {
        document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        
        document.getElementById(`view-${tabId}`).classList.add('active');
        element.classList.add('active');
    }

    function updateUI() {
        document.getElementById("energy").innerText = energy;
        document.getElementById("points").innerText = points;
        document.getElementById("pvltg").innerText = Number(pvltg).toFixed(4);
        
        const maxEnergy = 50; 
        const pct = Math.min((energy / maxEnergy) * 100, 100);
        document.getElementById("energyBar").style.width = `${pct}%`;
    }

    function openBuyModal() { if(!wallet) return alert("Connect wallet first"); document.getElementById("buyModal").classList.add("active"); }
    function closeBuyModal() { document.getElementById("buyModal").classList.remove("active"); }
    
    function openSwapModal() {
        if (!wallet) return alert("Connect wallet first!");
        if (points <= 0) return alert("No points available to swap.");
        document.getElementById("swapModalText").innerHTML = `Swap <b>${points} Points</b> to acquire roughly <b>${(points/10000).toFixed(4)} PVLTG</b>?`;
        document.getElementById("swapModal").classList.add("active");
    }
    function closeSwapModal() { document.getElementById("swapModal").classList.remove("active"); }

    async function fetchOnChainBalances() {
        if (!web3Provider || !wallet) return;
        try {
            const signer = web3Provider.getSigner();
            const tokenABI = ["function balanceOf(address o) view returns (uint256)"];
            const tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, tokenABI, signer);
            
            const userBalRaw = await tokenContract.balanceOf(wallet);
            const treasuryBalRaw = await tokenContract.balanceOf(GAME_TREASURY_ADDRESS);
            
            document.getElementById("userPvltBalance").innerText = Number(ethers.utils.formatUnits(userBalRaw, TOKEN_DECIMALS)).toFixed(4);
            document.getElementById("treasuryPvltPool").innerText = Number(ethers.utils.formatUnits(treasuryBalRaw, TOKEN_DECIMALS)).toFixed(4);
        } catch(e){ console.error("Balance loading error skipped.", e); }
    }

    async function connectWallet() {
        try {
            let instance;
            if (window.ethereum && (window.ethereum.isUXUY || window.ethereum.isMetaMask || navigator.userAgent.includes("Web3"))) {
                await window.ethereum.request({ method: "eth_requestAccounts" });
                instance = window.ethereum;
            } else {
                if (!web3Modal) return alert("Framework elements initializing. Click again.");
                instance = await web3Modal.connect();
            }

            web3Provider = new ethers.providers.Web3Provider(instance);
            wallet = await web3Provider.getSigner().getAddress();

            document.getElementById("walletBtn").style.display = "none";
            document.getElementById("walletRow").style.display = "flex";
            document.getElementById("walletInput").innerText = wallet.slice(0,6) + "..." + wallet.slice(-4);

            let res = await fetch(API + "user", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
            const data = await res.json();
            points = data.points || 0; 
            energy = data.energy || 50; 
            pvltg = data.pvltg || 0;

            updateUI();
            await fetchOnChainBalances();
            
            if (instance.on) { instance.on("accountsChanged", () => location.reload()); }
        } catch(e){ console.error(e); alert("Wallet pairing dropped."); }
    }

    function createTapTextAnimation(e) {
        const target = document.getElementById("tapZone");
        const rect = target.getBoundingClientRect();
        
        let clientX = e.clientX, clientY = e.clientY;
        if(e.touches && e.touches[0]) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }

        const txt = document.createElement("div");
        txt.className = "floating-text";
        txt.innerText = "+1";
        txt.style.left = `${clientX - rect.left - 10}px`;
        txt.style.top = `${clientY - rect.top - 20}px`;

        target.appendChild(txt);
        setTimeout(() => txt.remove(), 600);
    }

    async function tap(e) {
        if (!wallet) return alert("Connect wallet first");
        if (energy <= 0) return;
        createTapTextAnimation(e);
        try {
            const res = await fetch(API + "tap", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
            const data = await res.json();
            if(data.error) return;
            points = data.points; 
            energy = data.energy;
            updateUI();
        } catch (err) {}
    }

    document.getElementById("tapZone").addEventListener("pointerdown", (e) => { e.preventDefault(); tap(e); });

    async function executeEnergyPurchase() {
        const btn = document.getElementById("confirmPaymentBtn");
        try {
            btn.innerText = "Processing..."; btn.disabled = true;
            const signer = web3Provider.getSigner();
            const token = new ethers.Contract(PVLT_TOKEN_ADDRESS, ["function approve(address s, uint256 a) external returns(bool)"], signer);
            const txa = await token.approve(GAME_TREASURY_ADDRESS, ethers.utils.parseUnits("100", TOKEN_DECIMALS)); await txa.wait();

            const treasury = new ethers.Contract(GAME_TREASURY_ADDRESS, ["function buyEnergyPack(uint256 a) external"], signer);
            const tx = await treasury.buyEnergyPack(ethers.utils.parseUnits("100", TOKEN_DECIMALS)); closeBuyModal(); await tx.wait();

            const res = await fetch(API + "refill", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet, txHash: tx.hash }) });
            const data = await res.json(); energy = data.energy; updateUI(); await fetchOnChainBalances();
            alert("Refilled!");
        } catch(e){ alert("Transaction reverted or dropped."); } finally { btn.innerText = "Confirm"; btn.disabled = false; closeBuyModal(); }
    }

    async function executePointsSwap() {
        const btn = document.getElementById("confirmSwapBtn");
        try {
            btn.innerText = "Processing..."; btn.disabled = true;
            const res = await fetch(API + "swap-points", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
            const data = await res.json();
            if (data.error) return alert(data.error);
            points = data.points; pvltg = data.pvltg; updateUI(); closeSwapModal();
            alert("Swapped successfully!");
        } catch (e){ alert("Network routing failed."); } finally { btn.innerText = "Confirm Swap"; btn.disabled = false; closeSwapModal(); }
    }

    async function claimPVLT() {
        if (!wallet) return alert("Connect wallet first!");
        if (pvltg < 100) return alert("Need minimum 100 PVLTG to pull assets.");
        const btn = document.getElementById("withdrawBtn");
        try {
            btn.innerText = "WITHDRAWING..."; btn.disabled = true;
            const res = await fetch(API + "claim-pvltg", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
            const data = await res.json(); if(data.error) return alert(data.error);
            pvltg = data.pvltg; updateUI(); await fetchOnChainBalances(); alert("Fulfillment Complete!");
        } catch(e){ alert("Failed to contact token distribution node."); } finally { btn.innerText = "WITHDRAW PVLT TO WALLET"; btn.disabled = false; }
    }

    setInterval(() => { if (wallet && energy < 50) { energy += 1; updateUI(); } }, 30000);
    updateUI();
</script>
</body>
</html>
