<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:55px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
font-size:12px;
z-index:10;
}

.val{color:#00ff99;font-weight:bold;}

/* MAIN */
.container{
padding-top:80px;
}

/* TAP BUTTON */
.tap{
width:170px;
height:170px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:26px;
font-weight:bold;
color:black;
box-shadow:0 0 20px #00ff99;
}

.tap:active{
transform:scale(0.97);
}

/* CARDS */
.card{
margin:20px;
background:#111827;
padding:15px;
border-radius:12px;
}

/* INPUT */
input{
width:85%;
padding:10px;
border-radius:8px;
border:none;
margin-top:10px;
}

button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<div>Points: <span id="points">0</span></div>
<div>PVLT: <span id="tokens">0</span></div>
<div>ID: <span id="userId">---</span></div>
</div>

<!-- MAIN -->
<div class="container">

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<h3>Link Wallet (optional)</h3>
<input id="wallet" placeholder="Enter BSC address">
<br>
<button onclick="saveWallet()">SAVE WALLET</button>
</div>

<div class="card">
<button onclick="claim()">CLAIM TOKENS</button>
</div>

</div>

<script>

let tg = null;
let userId = "guest";

/* SAFE TELEGRAM INIT */
function initTelegram(){

try{

if(window.Telegram && Telegram.WebApp){

tg = Telegram.WebApp;
tg.expand();

let user = tg.initDataUnsafe?.user;

if(user){
userId = user.id;
}

}

}catch(e){
console.log("Telegram init failed");
}

document.getElementById("userId").innerText = userId;

}

/* SAFE STATE */
let points = 0;
let tokens = 0;
let walletAddress = null;

/* SAFE LOAD UI */
function render(){
document.getElementById("points").innerText = points;
document.getElementById("tokens").innerText = tokens;
}

/* TAP FUNCTION */
function tap(){
points += 1;
render();
}

/* SAVE WALLET */
function saveWallet(){

let w = document.getElementById("wallet").value;

if(!w){
alert("Enter wallet address");
return;
}

walletAddress = w;

alert("Wallet saved for later claiming");
}

/* CLAIM LOGIC (DEMO SAFE) */
function claim(){

if(points < 100){
alert("Need at least 100 points");
return;
}

if(!walletAddress){
alert("Please link wallet first");
return;
}

/* convert */
tokens = Math.floor(points / 10000);
points = points % 10000;

render();

alert("Claim successful (demo mode)");

}

/* SAFE START */
window.addEventListener("load", () => {
initTelegram();
render();
});

</script>

</body>

</html>
