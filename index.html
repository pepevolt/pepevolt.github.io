<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PepeVolt | Tap to Earn PVLT</title>
<link rel="icon" href="images/logo.PNG">
<meta name="theme-color" content="#090912">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

:root {
  --bg: #090912;
  --card: #0e0f1a;
  --primary: #00ffcc;
  --secondary: #ffd700;
  --muted: #9ba3c2;
  --border: rgba(0,255,204,0.2);
  --radius: 16px;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 440px;
  margin: 0 auto;
  padding: 16px;
  overflow: hidden;
}

.energy-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.energy-left .val { font-family: monospace; font-weight: 800; font-size: 20px; color: var(--primary); }
.energy-right { width: 52%; }
.prog-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.prog-bar-fill { height: 100%; background: var(--primary); transition: width .4s ease; }
.regen-lbl { font-size: 9px; color: var(--muted); text-align: right; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-card.primary-card { border: 1px solid var(--border); }
.stat-card.secondary-card { border: 1px solid rgba(255,215,0,0.2); }
.stat-card .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
.stat-card .val { font-family: monospace; font-weight: 800; font-size: 22px; }
.stat-card.secondary-card .val { color: var(--secondary); }

.wallet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.wallet-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
}
.wallet-card .lbl { font-size: 9px; color: var(--muted); }
.wallet-card .val { font-family: monospace; font-size: 13px; }

main { flex: 1; display: flex; align-items: center; justify-content: center; }
.pepe-btn {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #00ebbc, #008f74);
  border: 4px solid rgba(0,255,204,0.5);
  cursor: pointer;
  transition: transform .08s;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0,255,204,0.4);
}
.pepe-btn:active { transform: scale(.95); }
.pepe-btn.no-energy { opacity: 0.5; cursor: not-allowed; }
.pepe-btn img { width: 70%; height: 70%; object-fit: contain; }

footer {
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 12px;
  margin-top: 8px;
}
.status-txt { text-align: center; font-size: 11px; font-family: monospace; color: var(--muted); margin-bottom: 10px; }
.btn {
  width: 100%;
  border: none;
  border-radius: 44px;
  padding: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #000; }
.btn-secondary { background: var(--secondary); color: #000; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-small { padding: 10px; font-size: 13px; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #000; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.float-text {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-family: monospace;
  font-weight: 800;
  font-size: 22px;
  animation: floatUp 1s forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-80px); }
}
</style>
</head>
<body>

<div class="app">
  <div class="energy-row">
    <div class="energy-left"><div class="val" id="energyVal">100 / 100</div></div>
    <div class="energy-right">
      <div class="prog-bar"><div class="prog-bar-fill" id="energyBar" style="width:100%"></div></div>
      <div class="regen-lbl" id="regenLbl"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card primary-card">
      <div class="lbl">Points</div>
      <div class="val"><span id="pointsVal">0</span><span style="font-size:14px">/100</span></div>
    </div>
    <div class="stat-card secondary-card">
      <div class="lbl">💎 Game PVLT</div>
      <div class="val" id="gamePvltVal">0</div>
    </div>
  </div>

  <div class="wallet-row">
    <div class="wallet-card"><div class="lbl">💼 Wallet</div><div class="val" id="walletVal">0.00</div></div>
    <div class="wallet-card"><div class="lbl">🏦 Treasury</div><div class="val" id="treasuryVal">0</div></div>
  </div>

  <main>
    <button class="pepe-btn no-energy" id="tapBtn">
      <img src="images/logo.PNG" alt="Pepe" onerror="this.innerHTML='🐸'">
    </button>
  </main>

  <footer>
    <div class="status-txt" id="statusTxt">🔒 Connect wallet to start</div>
    <div id="stateDisconnected">
      <button class="btn btn-primary" id="connectBtn">💼 CONNECT WALLET</button>
    </div>
    <div id="stateConnected" style="display:none">
      <button class="btn btn-outline" id="disconnectBtn" style="display:none"></button>
      <div class="action-grid" id="actionGrid" style="display:none">
        <button class="btn btn-secondary btn-small" id="buyBtn">⚡ BUY ENERGY<span>(100 PVLT)</span></button>
        <button class="btn btn-primary btn-small" id="claimBtn">💎 CLAIM<span id="claimSub">TO WALLET</span></button>
      </div>
    </div>
  </footer>
</div>

<script type="module">
  import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2.11.0"

  // Contract Addresses
  const PVLT_TOKEN_ADDRESS = "0x03741F950eaFD9CbAa217E2B0491a0F143492f0A";
  const GAME_CONTRACT_ADDRESS = "0xE522370EA3A22D9075bB446027c7E46b5D979806";
  const TREASURY_ADDRESS = "0x2f5d721F771f53F55845AA927b95E40d5Ad30EF4";

  const GAME_ABI = [
    "function buyEnergy(uint256 pvltAmount) external",
    "function claimRewards(uint256 pvltAmount) external",
    "function getTreasuryBalance() view returns (uint256)"
  ];
  const PVLT_ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function approve(address,uint256) returns (bool)",
    "function allowance(address,address) view returns (uint256)",
    "function decimals() view returns (uint8)"
  ];

  // DOM Elements
  const $ = id => document.getElementById(id);
  const elements = {
    energyVal: $('energyVal'), energyBar: $('energyBar'), regenLbl: $('regenLbl'),
    pointsVal: $('pointsVal'), gamePvltVal: $('gamePvltVal'),
    walletVal: $('walletVal'), treasuryVal: $('treasuryVal'),
    tapBtn: $('tapBtn'), statusTxt: $('statusTxt'), connectBtn: $('connectBtn'),
    stateDisc: $('stateDisconnected'), stateConn: $('stateConnected'),
    disconnectBtn: $('disconnectBtn'), actionGrid: $('actionGrid'),
    buyBtn: $('buyBtn'), claimBtn: $('claimBtn'), claimSub: $('claimSub')
  };

  let provider = null, account = null, tokenC = null, gameC = null, decimals = 18;
  let maxEnergy = 100, energy = 100, points = 0, gamePvlt = 0, walletBal = 0, treasuryBal = 0, lastRegen = Date.now();
  let regenTimer = null;

  function save() { if (account) localStorage.setItem('pv_' + account, JSON.stringify({ energy, points, gamePvlt, lastRegen, maxEnergy })); }
  function load() {
    if (!account) return;
    try {
      const d = JSON.parse(localStorage.getItem('pv_' + account) || '{}');
      maxEnergy = d.maxEnergy ?? 100;
      points = d.points ?? 0;
      gamePvlt = d.gamePvlt ?? 0;
      lastRegen = d.lastRegen ?? Date.now();
      const offSecs = Math.floor((Date.now() - lastRegen) / 1000);
      const offRegen = Math.floor(offSecs / 15);
      energy = Math.min((d.energy ?? 100) + offRegen, maxEnergy);
      if (offRegen > 0) lastRegen = Date.now();
    } catch(e) {}
  }

  function render() {
    elements.energyVal.textContent = `${Math.floor(energy)} / ${maxEnergy}`;
    elements.energyBar.style.width = Math.min((energy / maxEnergy) * 100, 100) + '%';
    elements.pointsVal.textContent = points;
    elements.gamePvltVal.textContent = gamePvlt.toFixed(0);
    elements.walletVal.textContent = walletBal.toFixed(2);
    elements.treasuryVal.textContent = treasuryBal.toFixed(0);
    elements.claimSub.textContent = gamePvlt >= 1 ? `${Math.floor(gamePvlt)} PVLT` : 'TO WALLET';

    if (account) {
      elements.tapBtn.classList.remove('no-energy');
      elements.stateDisc.style.display = 'none';
      elements.stateConn.style.display = 'block';
      elements.disconnectBtn.style.display = 'block';
      elements.actionGrid.style.display = 'grid';
      elements.disconnectBtn.textContent = `🔴 ${account.slice(0,6)}...${account.slice(-4)}`;
      elements.buyBtn.disabled = walletBal < 100;
      elements.claimBtn.disabled = gamePvlt < 1;
    } else {
      elements.tapBtn.classList.add('no-energy');
      elements.stateDisc.style.display = 'block';
      elements.stateConn.style.display = 'none';
    }
  }

  function tick() {
    if (account && energy < maxEnergy) {
      const secs = Math.floor((Date.now() - lastRegen) / 1000);
      const gained = Math.floor(secs / 15);
      if (gained > 0) {
        energy = Math.min(energy + gained, maxEnergy);
        lastRegen = Date.now();
        save();
      }
      const rem = 15 - (Math.floor((Date.now() - lastRegen) / 1000) % 15);
      elements.regenLbl.textContent = `⚡ +1 in ${rem}s`;
    } else {
      elements.regenLbl.textContent = '';
    }
    render();
  }

  async function refreshBalances() {
    if (!account || !tokenC) return;
    try {
      const [b, t] = await Promise.all([
        tokenC.balanceOf(account),
        gameC.getTreasuryBalance().catch(() => ethers.BigNumber.from(0))
      ]);
      walletBal = parseFloat(ethers.utils.formatUnits(b, decimals));
      treasuryBal = parseFloat(ethers.utils.formatUnits(t, decimals));
      render();
    } catch(e) { console.error('Balance error', e); }
  }

  function showFloat(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.cssText = `left:${x-20}px;top:${y-20}px;color:${color}`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  let tapLock = false;
  function doTap(x, y) {
    if (!account || energy <= 0 || tapLock) return;
    tapLock = true; setTimeout(() => tapLock = false, 80);
    energy--; points++;
    if (points >= 100) {
      const earned = Math.floor(points / 100);
      gamePvlt += earned; points %= 100;
      showFloat(x, y-40, `+${earned} PVLT! 🎉`, '#ffd700');
    }
    showFloat(x, y, '+1 ⚡', '#00ffcc');
    save(); render();
  }

  elements.tapBtn.addEventListener('click', (e) => {
    const rect = elements.tapBtn.getBoundingClientRect();
    doTap(rect.left + rect.width/2, rect.top + rect.height/2);
  });
  elements.tapBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    doTap(touch.clientX, touch.clientY);
  }, { passive: false });

  // WalletConnect
  elements.connectBtn.onclick = async () => {
    if (account) {
      if (regenTimer) clearInterval(regenTimer);
      save();
      if (provider?.disconnect) await provider.disconnect();
      account = null;
      provider = null;
      tokenC = gameC = null;
      walletBal = treasuryBal = 0;
      energy = maxEnergy = 100;
      points = gamePvlt = 0;
      elements.connectBtn.innerHTML = '💼 CONNECT WALLET';
      elements.connectBtn.disabled = false;
      elements.statusTxt.textContent = '🔒 Disconnected';
      render();
      return;
    }

    try {
      elements.connectBtn.innerHTML = '<span class="spinner"></span> CONNECTING...';
      elements.connectBtn.disabled = true;
      elements.statusTxt.textContent = '⏳ Opening WalletConnect...';

      provider = await EthereumProvider.init({
        projectId: "1731f99148b9cf6107dee70b6efb14b7",
        chains: [137],
        showQrModal: true,
        methods: ["eth_sendTransaction", "personal_sign", "eth_signTypedData"],
        optionalMethods: ["eth_accounts", "eth_requestAccounts", "eth_chainId"],
        rpcMap: { 137: "https://polygon-rpc.com" },
        metadata: {
          name: "PepeVolt",
          description: "PepeVolt Game",
          url: window.location.origin,
          icons: ["https://cdn-icons-png.flaticon.com/512/825/825508.png"]
        }
      });

      await provider.connect();
      const accounts = await provider.request({ method: "eth_accounts" });
      account = accounts[0];
      
      const ethersProvider = new ethers.providers.Web3Provider(provider);
      const signer = ethersProvider.getSigner();
      
      tokenC = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      gameC = new ethers.Contract(GAME_CONTRACT_ADDRESS, GAME_ABI, signer);
      decimals = await tokenC.decimals();

      load();
      await refreshBalances();
      
      elements.connectBtn.innerHTML = `🔴 ${account.slice(0,6)}...${account.slice(-4)}`;
      elements.statusTxt.textContent = `✅ Connected: ${account.slice(0,6)}...${account.slice(-4)}`;
      render();

      if (regenTimer) clearInterval(regenTimer);
      regenTimer = setInterval(async () => { tick(); await refreshBalances(); }, 1000);

      provider.on("disconnect", () => {
        if (regenTimer) clearInterval(regenTimer);
        account = null;
        elements.connectBtn.innerHTML = '💼 CONNECT WALLET';
        elements.connectBtn.disabled = false;
        elements.statusTxt.textContent = '🔒 Disconnected';
        render();
      });

    } catch(err) {
      console.log(err);
      elements.statusTxt.textContent = err.message.includes("closed") ? '🔒 Connect to start' : '❌ Wallet connection failed';
      elements.connectBtn.innerHTML = '💼 CONNECT WALLET';
      elements.connectBtn.disabled = false;
    }
  };

  elements.disconnectBtn.onclick = () => elements.connectBtn.click();

  // Buy Energy
  async function buyEnergy() {
    if (!account) { elements.statusTxt.textContent = "Connect wallet first"; return; }
    if (walletBal < 100) { elements.statusTxt.textContent = `❌ Need 100 PVLT. You have ${walletBal.toFixed(2)}`; return; }

    elements.buyBtn.disabled = true;
    elements.statusTxt.textContent = "⏳ Checking allowance...";

    try {
      const amount = ethers.utils.parseUnits("100", decimals);
      const allowance = await tokenC.allowance(account, GAME_CONTRACT_ADDRESS);

      if (allowance.lt(amount)) {
        elements.statusTxt.textContent = "⏳ Approving 100 PVLT...";
        const approveTx = await tokenC.approve(GAME_CONTRACT_ADDRESS, amount);
        await approveTx.wait();
        elements.statusTxt.textContent = "✅ Approval confirmed!";
        await new Promise(r => setTimeout(r, 1500));
      }

      elements.statusTxt.textContent = "⏳ Buying 1000 Energy...";
      const gasEstimate = await gameC.estimateGas.buyEnergy(amount);
      const tx = await gameC.buyEnergy(amount, { gasLimit: gasEstimate.mul(12).div(10) });
      elements.statusTxt.textContent = "⏳ Confirming...";
      await tx.wait();
      
      maxEnergy += 1000;
      energy += 1000;
      save();
      await refreshBalances();
      elements.statusTxt.textContent = `✅ +1000 Energy! Max: ${maxEnergy}`;
      showFloat(window.innerWidth/2, window.innerHeight/2 - 80, '⚡ +1000 ENERGY!', '#ffd700');

    } catch(e) {
      console.error(e);
      let errorMsg = e.message || "Transaction failed";
      if (errorMsg.includes("insufficient funds")) errorMsg = "Insufficient MATIC for gas!";
      else if (errorMsg.includes("user rejected")) errorMsg = "Transaction rejected";
      elements.statusTxt.textContent = `❌ ${errorMsg.slice(0,80)}`;
    } finally {
      elements.buyBtn.disabled = walletBal < 100;
    }
  }

  // Claim Rewards
  async function claimRewards() {
    if (!account) { elements.statusTxt.textContent = "Connect wallet first"; return; }
    if (gamePvlt < 1) { elements.statusTxt.textContent = `❌ No GAME PVLT! You have ${gamePvlt}`; return; }
    if (treasuryBal < gamePvlt) { elements.statusTxt.textContent = `❌ Treasury low! Has ${treasuryBal.toFixed(0)} PVLT`; return; }

    const amount = Math.floor(gamePvlt);
    const amountWei = ethers.utils.parseUnits(amount.toString(), decimals);
    elements.claimBtn.disabled = true;
    elements.statusTxt.textContent = `⏳ Claiming ${amount} PVLT...`;

    try {
      const gasEstimate = await gameC.estimateGas.claimRewards(amountWei);
      const tx = await gameC.claimRewards(amountWei, { gasLimit: gasEstimate.mul(12).div(10) });
      elements.statusTxt.textContent = "⏳ Confirming...";
      await tx.wait();
      
      gamePvlt = 0; points = 0;
      save();
      await refreshBalances();
      elements.statusTxt.textContent = `✅ Claimed ${amount} REAL PVLT!`;
      showFloat(window.innerWidth/2, window.innerHeight/2 - 80, `💎 +${amount} PVLT!`, '#00ffcc');
    } catch(e) {
      console.error(e);
      elements.statusTxt.textContent = `❌ ${e.message?.slice(0,80) || "Claim failed"}`;
    } finally {
      elements.claimBtn.disabled = gamePvlt < 1;
    }
  }

  elements.buyBtn.onclick = buyEnergy;
  elements.claimBtn.onclick = claimRewards;
  
  render();
  setInterval(tick, 1000);
  elements.statusTxt.textContent = '🔒 Click CONNECT WALLET to start';
</script>
</body>
</html>
