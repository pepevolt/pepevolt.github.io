<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPE VOLT</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
}

.container{
    max-width:400px;
    margin:auto;
    padding:20px;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    margin-top:30px;
    border:3px solid #00ff99;
}

h1{
    color:#00ff99;
    margin-top:15px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

button,a{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    margin-top:15px;
    display:block;
    text-decoration:none;
    font-weight:bold;
    box-sizing:border-box;
}

button{
    background:#00ff99;
    color:black;
}

.buy{
    background:#facc15;
    color:black;
}

.contract{
    word-break:break-all;
    font-size:12px;
    margin-top:15px;
    opacity:0.8;
}

.balance{
    font-size:28px;
    color:#00ff99;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<img
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Bitmap_VS_SVG.svg"
>

<h1>PEPE VOLT</h1>

<div class="contract">
0xa263d765b897b4777f0ad4a938d12d79e789ffff
</div>

<button onclick="connectWallet()">
Connect Wallet
</button>

<div class="card">
<h2>Balance</h2>

<div id="balance" class="balance">
0 PVLT
</div>
</div>

<a
class="buy"
href="https://pancakeswap.finance/swap?outputCurrency=0xa263d765b897b4777f0ad4a938d12d79e789ffff"
target="_blank"
>
Buy Token
</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>

<script>
const tokenAddress =
"0xa263d765b897b4777f0ad4a938d12d79e789ffff";

const abi = [
{
"constant":true,
"inputs":[{"name":"owner","type":"address"}],
"name":"balanceOf",
"outputs":[{"name":"","type":"uint256"}],
"type":"function"
},
{
"constant":true,
"inputs":[],
"name":"decimals",
"outputs":[{"name":"","type":"uint8"}],
"type":"function"
}
];

async function connectWallet(){

if(typeof window.ethereum === 'undefined'){
alert("Install MetaMask or Trust Wallet");
return;
}

try{

await window.ethereum.request({
method:'eth_requestAccounts'
});

const web3 = new Web3(window.ethereum);

const accounts = await web3.eth.getAccounts();

const user = accounts[0];

const contract =
new web3.eth.Contract(abi, tokenAddress);

const decimals =
await contract.methods.decimals().call();

const balance =
await contract.methods.balanceOf(user).call();

const finalBalance =
balance / (10 ** decimals);

document.getElementById("balance").innerHTML =
Number(finalBalance).toFixed(2) + " PVLT";

}catch(e){

console.log(e);

alert("Connection Failed");

}
}
</script>

</body>
</html>
