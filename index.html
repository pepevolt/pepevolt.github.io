<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PepeVolt</title>

    <script src="https://unpkg.com/@walletconnect/web3modal@1.9.1/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

    <style>
        /* ... Your existing CSS remains identical ... */
        *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body{ width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; background:#07111f; }
        body{ display:flex; justify-content:center; align-items:center; }
        .app{ width:100%; max-width:430px; height:100vh; height:100dvh; background:radial-gradient(circle at top,#183153 0%,#07111f 75%); display:flex; flex-direction:column; padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); overflow:hidden; }
        .top-nav{ width:100%; display:flex; gap:10px; margin-top:5px; }
        .nav-box{ flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:12px 8px; text-align:center; }
        .nav-title{ font-size:11px; color:#9fb2d0; margin-bottom:6px; }
        .nav-value{ font-size:18px; font-weight:bold; color:white; }
        .wallet-wrap{ width:100%; margin-top:16px; }
        #connectBtn{ width:100%; border:none; outline:none; border-radius:18px; padding:15px; color:white; font-size:16px; font-weight:bold; cursor:pointer; background:linear-gradient(135deg, #00b894, #00cec9); }
        .center{ flex:1; display:flex; justify-content:center; align-items:center; }
        .tap-circle{ width:min(62vw,240px); height:min(62vw,240px); border-radius:50%; background:radial-gradient(circle at 30% 30%, #ffcc00, #ff8800); border:8px solid white; display:flex; justify-content:center; align-items:center; box-shadow:0 0 80px rgba(255,180,0,0.45); cursor:pointer; user-select:none; }
        .tap-circle:active{ transform:scale(0.95); }
        .tap-circle img{ width:30%; height:30%; pointer-events:none; }
        .actions{ width:100%; display:flex; flex-direction:column; gap:12px; }
        .action-btn{ width:100%; border:none; outline:none; border-radius:18px; padding:16px; color:white; font-size:16px; font-weight:bold; cursor:pointer; }
        .buy{ background:linear-gradient(135deg, #00b894, #00cec9); }
        .claim{ background:linear-gradient(135deg, #ffb347, #ff7b54); }
        .float{ position:fixed; color:white; font-weight:bold; pointer-events:none; z-index:9999; animation:floatUp 1s linear forwards; }
        @keyframes floatUp{ 0%{ opacity:1; transform:translateY(0); } 100%{ opacity:0; transform:translateY(-70px); } }
    </style>
</head>

<body>
<div class="app">
    <div class="top-nav">
        <div class="nav-box"><div class="nav-title">⚡ Energy</div><div class="nav-value" id="energy">100</div></div>
        <div class="nav-box"><div class="nav-title">💎 Points</div><div class="nav-value" id="points">0</div></div>
        <div class="nav-box"><div class="nav-title">🪙 PVLT</div><div class="nav-value" id="pvlt">0</div></div>
    </div>
    <div class="wallet-wrap"><button id="connectBtn">Connect Wallet</button></div>
    <div class="center">
        <div class="tap-circle" id="tapBtn"><img src="https://cdn-icons-png.flaticon.com/512/825/825508.png"></div>
    </div>
    <div class="actions">
        <button class="action-btn buy" id="buyBtn">Buy 10000 Energy</button>
        <button class="action-btn claim" id="claimBtn">Claim PVLT</button>
    </div>
</div>

<script>
    // Initialize Web3Modal
    const Web3Modal = window.Web3Modal.default;
    const web3Modal = new Web3Modal({ cacheProvider: true });

    let connected = false;
    let userAddress = '';
    let energy = 100;
    let points = 0;
    let pvlt = 0;

    const connectBtn = document.getElementById('connectBtn');
    const energyEl = document.getElementById('energy');
    const pointsEl = document.getElementById('points');
    const pvltEl = document.getElementById('pvlt');

    /* UPDATED CONNECT LOGIC */
    connectBtn.addEventListener('click', async () => {
        try {
            const provider = await web3Modal.connect();
            const ethersProvider = new ethers.providers.Web3Provider(provider);
            const signer = ethersProvider.getSigner();
            userAddress = await signer.getAddress();
            
            connected = true;
            connectBtn.innerText = userAddress.slice(0,6) + '...' + userAddress.slice(-4);
        } catch (err) {
            console.error("Connection error:", err);
            alert('Failed to connect wallet. Please try again.');
        }
    });

    /* TAP, BUY, and CLAIM logic remains the same */
    document.getElementById('tapBtn').addEventListener('click', (e) => {
        if(!connected) return alert('Connect Wallet First');
        if(energy <= 0) return alert('No Energy');
        energy--; points++;
        if(points >= 100) { points -= 100; pvlt += 1; }
        energyEl.innerText = energy; pointsEl.innerText = points; pvltEl.innerText = pvlt;
        
        const float = document.createElement('div');
        float.className = 'float'; float.innerText = '+1 Point';
        float.style.left = e.clientX + 'px'; float.style.top = e.clientY + 'px';
        document.body.appendChild(float);
        setTimeout(() => float.remove(), 1000);
    });

    document.getElementById('buyBtn').addEventListener('click', () => {
        if(!connected) return alert('Connect Wallet First');
        if(pvlt < 100) return alert('Need 100 PVLT');
        pvlt -= 100; energy += 10000;
        energyEl.innerText = energy; pvltEl.innerText = pvlt;
    });

    document.getElementById('claimBtn').addEventListener('click', () => {
        if(!connected) return alert('Connect Wallet First');
        if(pvlt <= 0) return alert('No PVLT To Claim');
        alert('Claimed PVLT to wallet: ' + userAddress);
        pvlt = 0; pvltEl.innerText = pvlt;
    });
</script>
</body>
</html>
