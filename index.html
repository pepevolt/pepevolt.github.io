<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PepeVolt | Tap to Earn PVLT</title>
<link rel="icon" href="images/logo.PNG">
<meta name="theme-color" content="#090912">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

:root {
  --bg: #090912;
  --card: #0e0f1a;
  --primary: #00ffcc;
  --secondary: #ffd700;
  --muted: #9ba3c2;
  --border: rgba(0,255,204,0.2);
  --radius: 16px;
  --modal-bg: #1a1b2e;
  --modal-card: #252638;
  --modal-hover: #2e3050;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 440px;
  margin: 0 auto;
  padding: 16px;
  overflow: hidden;
}

.energy-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.energy-left .val { font-family: monospace; font-weight: 800; font-size: 20px; color: var(--primary); }
.energy-right { width: 52%; }
.prog-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.prog-bar-fill { height: 100%; background: var(--primary); transition: width .4s ease; }
.regen-lbl { font-size: 9px; color: var(--muted); text-align: right; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-card.primary-card { border: 1px solid var(--border); }
.stat-card.secondary-card { border: 1px solid rgba(255,215,0,0.2); }
.stat-card .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
.stat-card .val { font-family: monospace; font-weight: 800; font-size: 22px; }
.stat-card.secondary-card .val { color: var(--secondary); }

.wallet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.wallet-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
}
.wallet-card .lbl { font-size: 9px; color: var(--muted); }
.wallet-card .val { font-family: monospace; font-size: 13px; }

main { flex: 1; display: flex; align-items: center; justify-content: center; }
.pepe-btn {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #00ebbc, #008f74);
  border: 4px solid rgba(0,255,204,0.5);
  cursor: pointer;
  transition: transform .08s;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0,255,204,0.4);
}
.pepe-btn:active { transform: scale(.95); }
.pepe-btn.no-energy { opacity: 0.5; cursor: not-allowed; }
.pepe-btn img { width: 70%; height: 70%; object-fit: contain; }

footer {
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 12px;
  margin-top: 8px;
}
.status-txt { text-align: center; font-size: 11px; font-family: monospace; color: var(--muted); margin-bottom: 10px; }
.btn {
  width: 100%;
  border: none;
  border-radius: 44px;
  padding: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #000; }
.btn-secondary { background: var(--secondary); color: #000; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.2); color: #fff; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-small { padding: 10px; font-size: 13px; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #000; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== WALLET MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  background: var(--modal-bg);
  border-radius: 24px 24px 0 0;
  padding: 0;
  width: 100%;
  max-width: 440px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  animation: slideUp .28s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  flex-shrink: 0;
}
.modal-title {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .2px;
}
.modal-close-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 16px;
  transition: background .15s;
}
.modal-close-btn:hover { background: rgba(255,255,255,.18); }

.modal-search-row {
  padding: 12px 16px;
  flex-shrink: 0;
}
.modal-search {
  width: 100%;
  background: var(--modal-card);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 10px 14px 10px 38px;
  font-size: 14px;
  color: #fff;
  outline: none;
  position: relative;
}
.modal-search::placeholder { color: var(--muted); }
.search-wrap {
  position: relative;
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 15px;
  pointer-events: none;
}

.modal-body {
  overflow-y: auto;
  flex: 1;
  padding: 8px 16px 24px;
  -webkit-overflow-scrolling: touch;
}

.wallets-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.wallet-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 8px 12px;
  background: var(--modal-card);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.06);
  cursor: pointer;
  transition: background .15s, transform .1s;
  position: relative;
}
.wallet-cell:active { transform: scale(.95); }
.wallet-cell:hover { background: var(--modal-hover); }
.wallet-cell.disabled { opacity: 0.4; cursor: not-allowed; }

.wallet-cell-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  overflow: hidden;
  flex-shrink: 0;
}
.wallet-cell-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 14px;
}
.wallet-cell-name {
  font-size: 11px;
  color: #c8cde8;
  text-align: center;
  line-height: 1.3;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wallet-cell-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
}

.modal-note {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 16px;
  line-height: 1.6;
}
.modal-note span { color: var(--primary); }

.no-results {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 32px 0;
  display: none;
}
</style>
</head>
<body>

<div class="app">
  <div class="energy-row">
    <div class="energy-left"><div class="val" id="energyVal">100 / 100</div></div>
    <div class="energy-right">
      <div class="prog-bar"><div class="prog-bar-fill" id="energyBar" style="width:100%"></div></div>
      <div class="regen-lbl" id="regenLbl"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card primary-card">
      <div class="lbl">Points</div>
      <div class="val"><span id="pointsVal">0</span><span style="font-size:14px">/100</span></div>
    </div>
    <div class="stat-card secondary-card">
      <div class="lbl">💎 Game PVLT</div>
      <div class="val" id="gamePvltVal">0</div>
    </div>
  </div>

  <div class="wallet-row">
    <div class="wallet-card"><div class="lbl">💼 Wallet</div><div class="val" id="walletVal">0.00</div></div>
    <div class="wallet-card"><div class="lbl">🏦 Treasury</div><div class="val" id="treasuryVal">0</div></div>
  </div>

  <main>
    <button class="pepe-btn no-energy" id="tapBtn">
      <img src="images/logo.PNG" alt="Pepe" onerror="this.innerHTML='🐸'">
    </button>
  </main>

  <footer>
    <div class="status-txt" id="statusTxt">🔒 Connect wallet to start</div>
    <div id="stateDisconnected">
      <button class="btn btn-primary" id="connectBtn">💼 CONNECT WALLET</button>
    </div>
    <div id="stateConnected" style="display:none">
      <button class="btn btn-outline" id="disconnectBtn" style="display:none"></button>
      <div class="action-grid" id="actionGrid" style="display:none">
        <button class="btn btn-secondary btn-small" id="buyBtn">⚡ BUY ENERGY<span>(100 PVLT)</span></button>
        <button class="btn btn-primary btn-small" id="claimBtn">💎 CLAIM<span id="claimSub">TO WALLET</span></button>
      </div>
    </div>
  </footer>
</div>

<!-- ===== ALL WALLETS MODAL ===== -->
<div id="walletModal" class="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">All Wallets</div>
      <button class="modal-close-btn" id="closeModal">✕</button>
    </div>

    <div class="modal-search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="modal-search" id="walletSearch" type="text" placeholder="Search wallet" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
    </div>

    <div class="modal-body">
      <div class="wallets-grid" id="walletsGrid"></div>
      <div class="no-results" id="noResults">No wallets found</div>
      <div class="modal-note">
        Make sure you're on <span>Polygon Mainnet</span><br>
        Tap a wallet to connect
      </div>
    </div>
  </div>
</div>

<script>
  // ============ CONTRACT ADDRESSES ============
  const PVLT_TOKEN_ADDRESS = "0x03741F950eaFD9CbAa217E2B0491a0F143492f0A";
  const GAME_CONTRACT_ADDRESS = "0xE522370EA3A22D9075bB446027c7E46b5D979806";
  const TREASURY_ADDRESS = "0x2f5d721F771f53F55845AA927b95E40d5Ad30EF4";

  const GAME_ABI = [
    "function buyEnergy(uint256 pvltAmount) external",
    "function claimRewards(uint256 pvltAmount) external",
    "function getTreasuryBalance() view returns (uint256)"
  ];
  const PVLT_ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function approve(address,uint256) returns (bool)",
    "function allowance(address,address) view returns (uint256)",
    "function decimals() view returns (uint8)"
  ];

  // ============ WALLET DEFINITIONS ============
  // Each wallet: id, name, icon (emoji or img url), getProvider fn, installUrl
  const WALLETS = [
    {
      id: 'metamask',
      name: 'MetaMask',
      icon: 'https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg',
      getProvider: () => {
        if (!window.ethereum) return null;
        if (window.ethereum.providers) {
          return window.ethereum.providers.find(p => p.isMetaMask) || null;
        }
        return window.ethereum.isMetaMask ? window.ethereum : null;
      },
      installUrl: 'https://metamask.io/download/'
    },
    {
      id: 'trust',
      name: 'Trust Wallet',
      icon: 'https://trustwallet.com/assets/images/media/assets/TWT.png',
      getProvider: () => {
        if (window.trustwallet) return window.trustwallet;
        if (window.ethereum && window.ethereum.isTrust) return window.ethereum;
        if (window.ethereum && window.ethereum.providers) {
          return window.ethereum.providers.find(p => p.isTrust) || null;
        }
        return null;
      },
      installUrl: 'https://trustwallet.com/download'
    },
    {
      id: 'okx',
      name: 'OKX Wallet',
      icon: 'https://static.okx.com/cdn/assets/imgs/247/58E63FEA47A2B7D7.png',
      getProvider: () => window.okxwallet || null,
      installUrl: 'https://www.okx.com/web3/wallet/download'
    },
    {
      id: 'binance',
      name: 'Binance',
      icon: 'https://public.bnbstatic.com/image/pgc/202301/9f7027b5a9b748a09b5e09ee8fe2ba2e.png',
      getProvider: () => window.BinanceChain || null,
      installUrl: 'https://www.bnbchain.org/en/binance-wallet'
    },
    {
      id: 'safepal',
      name: 'SafePal',
      icon: 'https://s2.coinmarketcap.com/static/img/coins/64x64/8119.png',
      getProvider: () => {
        if (window.ethereum && window.ethereum.isSafePal) return window.ethereum;
        if (window.ethereum && window.ethereum.providers) {
          return window.ethereum.providers.find(p => p.isSafePal) || null;
        }
        return null;
      },
      installUrl: 'https://safepal.com/download'
    },
    {
      id: 'coinbase',
      name: 'Coinbase',
      icon: 'https://www.coinbase.com/assets/press/coinbase-mark/coinbase-mark-blue.png',
      getProvider: () => {
        if (window.coinbaseWalletExtension) return window.coinbaseWalletExtension;
        if (window.ethereum && window.ethereum.isCoinbaseWallet) return window.ethereum;
        if (window.ethereum && window.ethereum.providers) {
          return window.ethereum.providers.find(p => p.isCoinbaseWallet) || null;
        }
        return null;
      },
      installUrl: 'https://www.coinbase.com/wallet/downloads'
    },
    {
      id: 'tokenpocket',
      name: 'TokenPocket',
      icon: 'https://tp-statics.tokenpocket.pro/logo/TokenPocket-20220308172350.png',
      getProvider: () => {
        if (window.ethereum && window.ethereum.isTokenPocket) return window.ethereum;
        if (window.ethereum && window.ethereum.providers) {
          return window.ethereum.providers.find(p => p.isTokenPocket) || null;
        }
        return null;
      },
      installUrl: 'https://www.tokenpocket.pro/en/download/app'
    },
    {
      id: 'bitget',
      name: 'Bitget Wallet',
      icon: 'https://img.bitkeep.com/common/img/logo/logo_400_400.png',
      getProvider: () => window.bitkeep?.ethereum || null,
      installUrl: 'https://web3.bitget.com/en/wallet-download'
    },
    {
      id: 'bybit',
      name: 'Bybit Wallet',
      icon: 'https://s2.coinmarketcap.com/static/img/coins/64x64/1.png',
      getProvider: () => window.bybitWallet || null,
      installUrl: 'https://www.bybit.com/en/web3/'
    },
    {
      id: 'uniswap',
      name: 'Uniswap',
      icon: 'https://app.uniswap.org/favicon.png',
      getProvider: () => {
        if (window.ethereum && window.ethereum.isUniswap) return window.ethereum;
        return null;
      },
      installUrl: 'https://wallet.uniswap.org/'
    },
    {
      id: 'phantom',
      name: 'Phantom',
      icon: 'https://www.phantom.app/img/phantom-logo.png',
      getProvider: () => window.phantom?.ethereum || null,
      installUrl: 'https://phantom.app/'
    },
    {
      id: 'zerion',
      name: 'Zerion',
      icon: 'https://zerion.io/favicon.ico',
      getProvider: () => {
        if (window.ethereum && window.ethereum.isZerion) return window.ethereum;
        return null;
      },
      installUrl: 'https://zerion.io/download'
    }
  ];

  // DOM
  const $ = id => document.getElementById(id);
  const energyValEl   = $('energyVal');
  const energyBarEl   = $('energyBar');
  const regenLblEl    = $('regenLbl');
  const pointsValEl   = $('pointsVal');
  const gamePvltValEl = $('gamePvltVal');
  const walletValEl   = $('walletVal');
  const treasuryValEl = $('treasuryVal');
  const tapBtnEl      = $('tapBtn');
  const statusTxtEl   = $('statusTxt');
  const connectBtnEl  = $('connectBtn');
  const stateDisc     = $('stateDisconnected');
  const stateConn     = $('stateConnected');
  const disconnBtnEl  = $('disconnectBtn');
  const actionGridEl  = $('actionGrid');
  const buyBtnEl      = $('buyBtn');
  const claimBtnEl    = $('claimBtn');
  const claimSubEl    = $('claimSub');
  const walletModal   = $('walletModal');
  const walletsGrid   = $('walletsGrid');
  const walletSearch  = $('walletSearch');
  const noResults     = $('noResults');

  // State
  let account = null;
  let provider = null;
  let signer = null;
  let tokenC = null;
  let gameC = null;
  let decimals = 18;
  let maxEnergy = 100;
  let energy = 100;
  let points = 0;
  let gamePvlt = 0;
  let walletBal = 0;
  let treasuryBal = 0;
  let lastRegen = Date.now();
  let regenTimer = null;

  // ============ SAVE / LOAD ============
  function save() {
    if (!account) return;
    localStorage.setItem('pv_' + account, JSON.stringify({ energy, points, gamePvlt, lastRegen, maxEnergy }));
  }
  function load() {
    if (!account) return;
    try {
      const d = JSON.parse(localStorage.getItem('pv_' + account) || '{}');
      maxEnergy = d.maxEnergy ?? 100;
      points = d.points ?? 0;
      gamePvlt = d.gamePvlt ?? 0;
      lastRegen = d.lastRegen ?? Date.now();
      const offSecs = Math.floor((Date.now() - lastRegen) / 1000);
      const offRegen = Math.floor(offSecs / 15);
      energy = Math.min((d.energy ?? 100) + offRegen, maxEnergy);
      if (offRegen > 0) lastRegen = Date.now();
    } catch(e) {}
  }

  // ============ RENDER ============
  function render() {
    energyValEl.textContent = `${Math.floor(energy)} / ${maxEnergy}`;
    energyBarEl.style.width = Math.min((energy / maxEnergy) * 100, 100) + '%';
    pointsValEl.textContent = points;
    gamePvltValEl.textContent = gamePvlt.toFixed(0);
    walletValEl.textContent = walletBal.toFixed(2);
    treasuryValEl.textContent = treasuryBal.toFixed(0);
    claimSubEl.textContent = gamePvlt >= 1 ? `${Math.floor(gamePvlt)} PVLT` : 'TO WALLET';

    if (account) {
      tapBtnEl.classList.remove('no-energy');
      stateDisc.style.display = 'none';
      stateConn.style.display = 'block';
      disconnBtnEl.style.display = 'block';
      actionGridEl.style.display = 'grid';
      disconnBtnEl.textContent = `🔴 ${account.slice(0,6)}...${account.slice(-4)}`;
      buyBtnEl.disabled = walletBal < 100;
      claimBtnEl.disabled = gamePvlt < 1;
    } else {
      tapBtnEl.classList.add('no-energy');
      stateDisc.style.display = 'block';
      stateConn.style.display = 'none';
    }
  }

  function tick() {
    if (account && energy < maxEnergy) {
      const secs = Math.floor((Date.now() - lastRegen) / 1000);
      const gained = Math.floor(secs / 15);
      if (gained > 0) {
        energy = Math.min(energy + gained, maxEnergy);
        lastRegen = Date.now();
        save();
      }
      const rem = 15 - (Math.floor((Date.now() - lastRegen) / 1000) % 15);
      regenLblEl.textContent = `⚡ +1 in ${rem}s`;
    } else {
      regenLblEl.textContent = '';
    }
    render();
  }

  async function refreshBalances() {
    if (!account || !tokenC) return;
    try {
      const [b, t] = await Promise.all([
        tokenC.balanceOf(account),
        gameC.getTreasuryBalance().catch(() => ethers.BigNumber.from(0))
      ]);
      walletBal = parseFloat(ethers.utils.formatUnits(b, decimals));
      treasuryBal = parseFloat(ethers.utils.formatUnits(t, decimals));
      render();
    } catch(e) { console.error('Balance error', e); }
  }

  function showFloat(x, y, text, color = '#fff') {
    const el = document.createElement('div');
    el.textContent = text;
    el.style.cssText = `position:fixed;left:${x-20}px;top:${y-20}px;color:${color};font-family:monospace;font-weight:800;font-size:22px;pointer-events:none;z-index:999;animation:floatUp 1s forwards;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  const style = document.createElement('style');
  style.textContent = `@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}`;
  document.head.appendChild(style);

  // ============ TAP LOGIC ============
  let tapLock = false;
  function doTap(x, y) {
    if (!account || energy <= 0 || tapLock) return;
    tapLock = true; setTimeout(() => tapLock = false, 80);
    energy--; points++;
    if (points >= 100) {
      const earned = Math.floor(points / 100);
      gamePvlt += earned; points %= 100;
      showFloat(x, y-40, `+${earned} PVLT! 🎉`, '#ffd700');
    }
    showFloat(x, y, '+1 ⚡', '#00ffcc');
    save(); render();
  }

  tapBtnEl.addEventListener('click', (e) => {
    const rect = tapBtnEl.getBoundingClientRect();
    doTap(rect.left + rect.width/2, rect.top + rect.height/2);
  });
  tapBtnEl.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    doTap(touch.clientX, touch.clientY);
  }, { passive: false });

  // ============ CONNECT VIA PROVIDER ============
  async function connectWithProvider(ethProvider, walletName) {
    try {
      setStatus(`⏳ Connecting ${walletName}...`);
      const accounts = await ethProvider.request({ method: 'eth_requestAccounts' });
      account = accounts[0];

      provider = new ethers.providers.Web3Provider(ethProvider);
      signer = provider.getSigner();

      const network = await provider.getNetwork();
      if (network.chainId !== 137) {
        setStatus('⚠️ Switching to Polygon...');
        try {
          await ethProvider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] });
        } catch(e) {
          await ethProvider.request({ method: 'wallet_addEthereumChain', params: [{
            chainId: '0x89', chainName: 'Polygon Mainnet',
            nativeCurrency: { name: 'MATIC', symbol: 'MATIC', decimals: 18 },
            rpcUrls: ['https://polygon-rpc.com/'],
            blockExplorerUrls: ['https://polygonscan.com/']
          }]});
        }
        provider = new ethers.providers.Web3Provider(ethProvider);
        signer = provider.getSigner();
      }

      tokenC = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      gameC  = new ethers.Contract(GAME_CONTRACT_ADDRESS, GAME_ABI, signer);
      decimals = await tokenC.decimals();

      load();
      await refreshBalances();
      setStatus(`✅ ${walletName}: ${account.slice(0,6)}...${account.slice(-4)}`);
      render();

      if (regenTimer) clearInterval(regenTimer);
      regenTimer = setInterval(async () => { tick(); await refreshBalances(); }, 1000);

      ethProvider.on('accountsChanged', (accs) => {
        if (!accs.length) disconnect();
        else if (accs[0] !== account) location.reload();
      });

      return true;
    } catch(e) {
      console.error(e);
      account = null;
      setStatus('❌ ' + (e.message?.slice(0,60) || 'Connection failed'));
      return false;
    }
  }

  // ============ DISCONNECT ============
  async function disconnect() {
    if (regenTimer) clearInterval(regenTimer);
    save();
    account = null; walletBal = 0; treasuryBal = 0;
    energy = 100; maxEnergy = 100; points = 0; gamePvlt = 0;
    connectBtnEl.innerHTML = '💼 CONNECT WALLET';
    connectBtnEl.disabled = false;
    setStatus('🔒 Disconnected');
    render();
  }

  // ============ BUY ENERGY ============
  async function buyEnergy() {
    if (!account) { setStatus("Connect wallet first"); return; }
    if (walletBal < 100) { setStatus(`❌ Need 100 PVLT. You have ${walletBal.toFixed(2)}`); return; }
    buyBtnEl.disabled = true;
    setStatus("⏳ Checking allowance...");
    try {
      const amount = ethers.utils.parseUnits("100", decimals);
      const allowance = await tokenC.allowance(account, GAME_CONTRACT_ADDRESS);
      if (allowance.lt(amount)) {
        setStatus("⏳ Approving 100 PVLT...");
        const approveTx = await tokenC.approve(GAME_CONTRACT_ADDRESS, amount);
        setStatus("⏳ Waiting for approval...");
        await approveTx.wait();
        setStatus("✅ Approved! Buying energy...");
        await new Promise(r => setTimeout(r, 2000));
      }
      setStatus("⏳ Buying 1000 Energy...");
      const gasEstimate = await gameC.estimateGas.buyEnergy(amount);
      const tx = await gameC.buyEnergy(amount, { gasLimit: gasEstimate.mul(12).div(10) });
      setStatus("⏳ Waiting for confirmation...");
      await tx.wait();
      maxEnergy += 1000; energy += 1000;
      save(); await refreshBalances();
      setStatus(`✅ +1000 Energy! Max: ${maxEnergy}`);
      showFloat(window.innerWidth/2, window.innerHeight/2 - 80, '⚡ +1000 ENERGY!', '#ffd700');
    } catch(e) {
      console.error("Buy error:", e);
      let msg = e.message || "Transaction failed";
      if (msg.includes("insufficient funds")) msg = "Insufficient MATIC for gas!";
      else if (msg.includes("user rejected")) msg = "Transaction rejected";
      else if (msg.includes("execution reverted")) msg = "Contract execution failed";
      setStatus(`❌ ${msg.slice(0,80)}`);
    } finally { buyBtnEl.disabled = walletBal < 100; }
  }

  // ============ CLAIM REWARDS ============
  async function claimRewards() {
    if (!account) { setStatus("Connect wallet first"); return; }
    if (gamePvlt < 1) { setStatus(`❌ No GAME PVLT!`); return; }
    if (treasuryBal < gamePvlt) { setStatus(`❌ Treasury low! Has ${treasuryBal.toFixed(0)} PVLT`); return; }
    const amount = Math.floor(gamePvlt);
    const amountWei = ethers.utils.parseUnits(amount.toString(), decimals);
    claimBtnEl.disabled = true;
    setStatus(`⏳ Claiming ${amount} PVLT...`);
    try {
      const gasEstimate = await gameC.estimateGas.claimRewards(amountWei);
      const tx = await gameC.claimRewards(amountWei, { gasLimit: gasEstimate.mul(12).div(10) });
      setStatus("⏳ Waiting for confirmation...");
      await tx.wait();
      gamePvlt = 0; points = 0;
      save(); await refreshBalances();
      setStatus(`✅ Claimed ${amount} REAL PVLT!`);
      showFloat(window.innerWidth/2, window.innerHeight/2 - 80, `💎 +${amount} PVLT!`, '#00ffcc');
    } catch(e) {
      console.error("Claim error:", e);
      setStatus(`❌ ${e.message?.slice(0,80) || "Claim failed"}`);
    } finally { claimBtnEl.disabled = gamePvlt < 1; }
  }

  function setStatus(msg) { statusTxtEl.textContent = msg; }

  // ============ WALLET MODAL ============
  function buildWalletCell(w) {
    const cell = document.createElement('div');
    cell.className = 'wallet-cell';
    cell.dataset.walletId = w.id;
    cell.dataset.walletName = w.name.toLowerCase();

    const hasProvider = !!w.getProvider();

    const iconDiv = document.createElement('div');
    iconDiv.className = 'wallet-cell-icon';

    const img = document.createElement('img');
    img.src = w.icon;
    img.alt = w.name;
    img.onerror = () => {
      iconDiv.textContent = w.name[0];
      iconDiv.style.cssText = 'background:rgba(255,255,255,.12);font-size:22px;font-weight:800;color:#fff;';
    };
    iconDiv.appendChild(img);

    const nameEl = document.createElement('div');
    nameEl.className = 'wallet-cell-name';
    nameEl.textContent = w.name.length > 10 ? w.name.slice(0,9) + '…' : w.name;

    if (hasProvider) {
      const badge = document.createElement('div');
      badge.className = 'wallet-cell-badge';
      badge.title = 'Detected';
      cell.appendChild(badge);
    }

    cell.appendChild(iconDiv);
    cell.appendChild(nameEl);

    cell.addEventListener('click', () => handleWalletClick(w));
    return cell;
  }

  function renderWallets(filter = '') {
    walletsGrid.innerHTML = '';
    const q = filter.toLowerCase().trim();
    const list = q ? WALLETS.filter(w => w.name.toLowerCase().includes(q)) : WALLETS;
    noResults.style.display = list.length === 0 ? 'block' : 'none';
    list.forEach(w => walletsGrid.appendChild(buildWalletCell(w)));
  }

  async function handleWalletClick(w) {
    const ethProvider = w.getProvider();

    if (!ethProvider) {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        const deepLinks = {
          metamask:    `https://metamask.app.link/dapp/${location.host}${location.pathname}`,
          trust:       `https://link.trustwallet.com/open_url?coin_id=966&url=${encodeURIComponent(location.href)}`,
          okx:         `okx://wallet/dapp/url?dappUrl=${encodeURIComponent(location.href)}`,
          tokenpocket: `tpoutside://pull.activity?param=${encodeURIComponent(JSON.stringify({url: location.href}))}`,
          bitget:      `bitkeep://bkconnect?action=dapp&url=${encodeURIComponent(location.href)}`
        };
        const dl = deepLinks[w.id];
        if (dl) {
          closeModalFn();
          setStatus(`📱 Opening ${w.name}...`);
          window.location.href = dl;
          return;
        }
      }
      const open = confirm(`${w.name} not detected.\n\nOpen install page?`);
      if (open) window.open(w.installUrl, '_blank');
      return;
    }

    closeModalFn();
    connectBtnEl.innerHTML = '<span class="spinner"></span> CONNECTING...';
    connectBtnEl.disabled = true;

    const success = await connectWithProvider(ethProvider, w.name);
    if (!success) {
      connectBtnEl.innerHTML = '💼 CONNECT WALLET';
      connectBtnEl.disabled = false;
    }
  }

  function openModal() {
    walletModal.classList.add('open');
    walletSearch.value = '';
    renderWallets();
    setTimeout(() => walletSearch.focus(), 200);
  }
  function closeModalFn() { walletModal.classList.remove('open'); }

  walletSearch.addEventListener('input', () => renderWallets(walletSearch.value));

  connectBtnEl.onclick = () => {
    if (account) disconnect();
    else openModal();
  };
  $('closeModal').onclick = closeModalFn;
  walletModal.onclick = (e) => { if (e.target === walletModal) closeModalFn(); };

  disconnBtnEl.onclick = () => disconnect();
  buyBtnEl.onclick   = buyEnergy;
  claimBtnEl.onclick = claimRewards;

  render();
  setInterval(tick, 1000);
  setStatus('🔒 Click CONNECT WALLET to start');
</script>
</body>
</html>
