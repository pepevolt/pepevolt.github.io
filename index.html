<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:#fff;
  text-align:center;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#1f6feb;
  color:white;
}

button:disabled{
  background:#555;
}

.card{
  background:#111a2e;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
  text-align:left;
}
</style>
</head>

<body>

<div class="container">

<h2>⚡ PVLT TAP GAME</h2>

<button id="connectBtn">Connect Wallet</button>

<div class="card">
<p><b>Address:</b> <span id="addr">-</span></p>
<p><b>Energy:</b> <span id="energy">0</span></p>
<p><b>Points:</b> <span id="points">0</span></p>
<p><b>Burned GPVLT:</b> <span id="burned">0</span></p>
</div>

<button id="tapBtn" disabled>👆 TAP</button>
<button id="refillBtn" disabled>⚡ Refill Energy</button>
<button id="convertBtn" disabled>🔁 Convert Points</button>
<button id="claimBtn" disabled>💰 Claim Rewards</button>

</div>

<script>
/* =======================
   CONTRACT ADDRESSES
======================= */
const PVLT_ADDRESS = "0x5f7df6862f439b691507dc20069f4f73a37cb08b";
const TREASURY_ADDRESS = "0x4251Ef24D10bf637494C173621F5f84262e9Bda5";
const GAME_ADDRESS = "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

/* =======================
   ABIs (YOUR EXACT)
======================= */
const GAME_ABI = [
{"inputs":[],"name":"tap","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[],"name":"refillEnergy","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[],"name":"convertPoints","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"players","outputs":[
{"internalType":"uint256","name":"energy","type":"uint256"},
{"internalType":"uint256","name":"points","type":"uint256"},
{"internalType":"uint256","name":"burnedGPVLT","type":"uint256"},
{"internalType":"bool","name":"paidUser","type":"bool"},
{"internalType":"uint256","name":"lastClaimDay","type":"uint256"}
],"stateMutability":"view","type":"function"}
];

const TREASURY_ABI = [
{"inputs":[],"name":"claimRewards","outputs":[],"stateMutability":"nonpayable","type":"function"}
];

/* =======================
   GLOBAL STATE
======================= */
let provider, signer, user, game, treasury;

/* =======================
   UI ELEMENTS
======================= */
const connectBtn = document.getElementById("connectBtn");
const tapBtn = document.getElementById("tapBtn");
const refillBtn = document.getElementById("refillBtn");
const convertBtn = document.getElementById("convertBtn");
const claimBtn = document.getElementById("claimBtn");

/* =======================
   CONNECT WALLET
======================= */
connectBtn.onclick = async () => {
  if (!window.ethereum) return alert("Install MetaMask");

  provider = new ethers.BrowserProvider(window.ethereum);
  await window.ethereum.request({ method: "eth_requestAccounts" });

  signer = await provider.getSigner();
  user = await signer.getAddress();

  game = new ethers.Contract(GAME_ADDRESS, GAME_ABI, signer);
  treasury = new ethers.Contract(TREASURY_ADDRESS, TREASURY_ABI, signer);

  document.getElementById("addr").innerText = user;

  tapBtn.disabled = false;
  refillBtn.disabled = false;
  convertBtn.disabled = false;
  claimBtn.disabled = false;

  loadData();
};

/* =======================
   LOAD PLAYER DATA
======================= */
async function loadData(){
  const p = await game.players(user);

  document.getElementById("energy").innerText = p.energy.toString();
  document.getElementById("points").innerText = p.points.toString();
  document.getElementById("burned").innerText = p.burnedGPVLT.toString();
}

/* =======================
   TAP
======================= */
tapBtn.onclick = async () => {
  try{
    const tx = await game.tap();
    await tx.wait();
    loadData();
  }catch(e){
    alert("Tap failed");
  }
};

/* =======================
   REFILL ENERGY
======================= */
refillBtn.onclick = async () => {
  try{
    const tx = await game.refillEnergy();
    await tx.wait();
    loadData();
  }catch(e){
    alert("Refill failed");
  }
};

/* =======================
   CONVERT POINTS
======================= */
convertBtn.onclick = async () => {
  try{
    const tx = await game.convertPoints();
    await tx.wait();
    loadData();
  }catch(e){
    alert("Convert failed");
  }
};

/* =======================
   CLAIM REWARDS
======================= */
claimBtn.onclick = async () => {
  try{
    const tx = await treasury.claimRewards();
    await tx.wait();
    loadData();
  }catch(e){
    alert("Claim failed");
  }
};
</script>

</body>
</html>
