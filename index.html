<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PVLT Tap Game</title>

<!-- ETHERS.JS -->
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
-webkit-text-size-adjust:100%;
overscroll-behavior:none;
}

body{
display:flex;
flex-direction:column;
}

/* ================= NAV ================= */

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

/* ================= MAIN ================= */

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow:auto;
}

/* ================= TAP ================= */

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:20px;

background:linear-gradient(135deg,#00ff99,#00ccff);

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;
position:relative;

touch-action:manipulation;
user-select:none;
-webkit-user-select:none;
}

.tap:active{
transform:scale(0.96);
}

.tapLogo{
width:75%;
height:75%;
object-fit:contain;
pointer-events:none;
}

/* ================= CARD ================= */

.bigCard{
width:90%;
max-width:380px;
margin-top:20px;
padding:18px;

background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);

border-radius:16px;

display:flex;
flex-direction:column;
gap:12px;
}

/* ================= INPUT ================= */

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

/* ================= BUTTON ================= */

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
cursor:pointer;
}

/* ================= STATUS ================= */

.status{
font-size:12px;
text-align:center;
margin-top:5px;
display:none;
color:#00ff99;
}

/* ================= CONNECTED ================= */

.connected{
background:linear-gradient(90deg,#ff4d4d,#ff1a1a)!important;
color:white!important;
}

</style>

</head>

<body>

<!-- ================= NAV ================= -->

<div class="nav">

<div>
🔋 <span id="energy">50</span>
</div>

<div>
⚡ <span id="points">0</span>
</div>

<div>
💎 <span id="tokens">0.0000</span>
</div>

</div>

<!-- ================= MAIN ================= -->

<div class="container">

<button class="tap" onclick="tap()">

<img
src="images/IMG_1850.png"
class="tapLogo"
>

</button>

<div class="bigCard">

<input
id="walletInput"
placeholder="Paste BSC wallet"
>

<button
id="walletBtn"
onclick="toggleWallet()"
>
CONNECT WALLET
</button>

<div
id="walletStatus"
class="status"
>
Wallet Connected
</div>

<button onclick="buyEnergy()">
BUY ENERGY (REFILL)
</button>

<button onclick="claim()">
CLAIM TOKENS
</button>

</div>

</div>

<script>

/* =================================================
PVLT FULL PRODUCTION CONFIG
================================================= */

// RENDER BACKEND
const API =
"https://YOUR-RENDER.onrender.com";

// GAME CONTRACT
const GAME_CONTRACT =
"0xYOUR_GAME_CONTRACT";

// BSC CHAIN ID
const CHAIN_ID = 56;

/* =================================================
GAME CONTRACT ABI
================================================= */

const ABI = [

"function claim(uint256,uint256,bytes) external"

];

/* =================================================
STATE
================================================= */

let wallet = "";
let points = 0;
let energy = 50;
let lastClaimTime = 0;

/* =================================================
SAVE STORAGE
================================================= */

function saveState(){

if(!wallet) return;

localStorage.setItem(
wallet,
JSON.stringify({
points,
energy,
lastClaimTime
})
);

}

/* =================================================
LOAD STORAGE
================================================= */

function loadState(addr){

let data =
localStorage.getItem(addr);

if(data){

let obj =
JSON.parse(data);

points =
obj.points || 0;

energy =
obj.energy || 50;

lastClaimTime =
obj.lastClaimTime || 0;

}else{

points = 0;
energy = 50;
lastClaimTime = 0;

}

}

/* =================================================
UPDATE UI
================================================= */

function updateUI(){

document.getElementById(
"energy"
).innerText = energy;

document.getElementById(
"points"
).innerText = points;

document.getElementById(
"tokens"
).innerText =
(points / 10000).toFixed(4);

}

/* =================================================
TAP
================================================= */

function tap(){

if(!wallet){

alert(
"Connect wallet first"
);

return;

}

if(energy <= 0){

alert("No energy");
return;

}

energy--;
points++;

saveState();
updateUI();

}

/* =================================================
CONNECT / DISCONNECT
================================================= */

function toggleWallet(){

const input =
document.getElementById(
"walletInput"
);

const btn =
document.getElementById(
"walletBtn"
);

const status =
document.getElementById(
"walletStatus"
);

/* DISCONNECT */

if(wallet){

wallet = "";
points = 0;
energy = 50;
lastClaimTime = 0;

input.value = "";

btn.innerText =
"CONNECT WALLET";

btn.classList.remove(
"connected"
);

status.style.display =
"none";

updateUI();

return;

}

/* CONNECT */

let w =
input.value.trim();

if(
!w.startsWith("0x") ||
w.length !== 42
){

alert("Invalid wallet");
return;

}

wallet =
w.toLowerCase();

loadState(wallet);

btn.innerText =
"DISCONNECT WALLET";

btn.classList.add(
"connected"
);

status.style.display =
"block";

updateUI();

}

/* =================================================
BUY ENERGY
================================================= */

function buyEnergy(){

if(!wallet){

alert(
"Connect wallet first"
);

return;

}

let amt = prompt(
"Enter Energy Amount\n(10000 Energy = $1)"
);

if(
!amt ||
isNaN(amt) ||
amt <= 0
) return;

let energyAmount =
Number(amt);

let price =
energyAmount / 10000;

alert(
"Price: $" +
price.toFixed(4) +
"\nPayment via PVLT / BNB"
);

/* PRODUCTION PLACEHOLDER */

energy += energyAmount;

saveState();
updateUI();

}

/* =================================================
SECURE CLAIM SYSTEM
================================================= */

async function claim(){

if(!wallet){

alert(
"Connect wallet first"
);

return;

}

let now = Date.now();

let ONE_DAY =
24 * 60 * 60 * 1000;

/* COOLDOWN */

if(
now - lastClaimTime
< ONE_DAY
){

alert(
"You can claim once per day"
);

return;

}

/* POINTS → TOKENS */

let tokens =
points / 10000;

if(tokens < 100){

alert(
"Minimum 100 tokens required"
);

return;

}

if(tokens > 500){

tokens = 500;

}

try{

/* =========================================
GET SIGNATURE FROM RENDER
========================================= */

let res = await fetch(
API + "/claim",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
address: wallet,
points: points
})
}
);

let data =
await res.json();

if(!data.signature){

alert(
"Backend rejected claim"
);

return;

}

/* =========================================
CONNECT METAMASK
========================================= */

if(!window.ethereum){

alert(
"Install MetaMask"
);

return;

}

const provider =
new ethers.BrowserProvider(
window.ethereum
);

await provider.send(
"eth_requestAccounts",
[]
);

const signer =
await provider.getSigner();

/* =========================================
SWITCH BSC
========================================= */

await window.ethereum.request({
method:"wallet_switchEthereumChain",
params:[
{
chainId:"0x38"
}
]
});

/* =========================================
CALL SMART CONTRACT
========================================= */

const contract =
new ethers.Contract(
GAME_CONTRACT,
ABI,
signer
);

const tx =
await contract.claim(
data.amount,
data.nonce,
data.signature
);

alert(
"Transaction submitted"
);

/* WAIT TX */

await tx.wait();

/* RESET */

points = 0;

lastClaimTime =
Date.now();

saveState();
updateUI();

alert(
"CLAIM SUCCESS\n\n" +
"TX:\n" +
tx.hash
);

}catch(err){

console.log(err);

alert(
"Claim failed"
);

}

}

/* =================================================
INIT
================================================= */

updateUI();

</script>

</body>

</html>
