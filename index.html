<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEPEVOLT GAME</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <style>
        body {
            margin: 0; padding: 0;
            background: #000; color: #fff;
            font-family: Arial, sans-serif; text-align: center;
        }
        .topbar {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px; background: #111; font-size: 24px; font-weight: bold;
            position: sticky; top: 0; z-index: 999;
        }
        .info { margin-top: 10px; font-size: 14px; color: #aaa; }
        .tap-btn {
            width: 240px; height: 240px; border-radius: 50%;
            background: #151515; display: flex; align-items: center; justify-content: center;
            margin: 40px auto; font-size: 42px; font-weight: bold; cursor: pointer;
            transition: 0.2s; border: 4px solid #333; user-select: none;
        }
        .tap-btn:active { transform: scale(0.95); }
        .buttons { margin-top: 30px; }
        button {
            padding: 14px 22px; margin: 10px; font-size: 18px;
            border: none; border-radius: 12px; background: #222; color: #fff; cursor: pointer;
        }
        button:hover { background: #333; }
        .balance { margin-top: 10px; font-size: 16px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="topbar">
        <div>⚡ <span id="energy">0</span></div>
        <div>🪙 <span id="points">0</span></div>
        <div>⛓️ <span id="gpvlt">0</span></div>
    </div>

    <div class="info">
        <div>TreasuryVolt: <span id="treasuryBalance">0</span> PVLT</div>
        <div>Wallet Balance: <span id="walletBalance">0</span> PVLT</div>
    </div>

    <br>
    <button onclick="connectWallet()">Connect Wallet</button>
    <div id="wallet" class="balance">Please connect wallet...</div>

    <div class="tap-btn" onclick="tap()">TAP</div>

    <div class="buttons">
        <button onclick="buyEnergy()">Buy Energy</button>
        <button onclick="convertPointsToGPVLT()">Convert Points to gPVLT</button>
        <button onclick="claimReward()">Claim PVLT</button>
    </div>

    <script type="module">
        import { createAppKit } from 'https://esm.sh/@reown/appkit?bundle';
        import { Ethers5Adapter } from 'https://esm.sh/@reown/appkit-adapter-ethers5?bundle';
        import { polygon } from 'https://esm.sh/@reown/appkit/networks?bundle';

        const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";
        window.appKitModal = null;

        async function initModalFallback() {
            try {
                window.appKitModal = createAppKit({
                    adapters: [new Ethers5Adapter()],
                    networks: [polygon],
                    metadata: {
                        name: 'PepeVolt Game',
                        description: 'PepeVolt Tap Ecosystem',
                        url: 'https://pepevolt.github.io',
                        icons: ['https://pepevolt.github.io/favicon.ico']
                    },
                    projectId: PROJECT_ID,
                    features: { analytics: false }
                });

                window.appKitModal.subscribeAccount(async (state) => {
                    if (state.isConnected && state.address) {
                        window.userAddress = state.address;
                        document.getElementById("wallet").innerHTML = "Connected: " + window.userAddress;
                        
                        const baseWalletProvider = window.appKitModal.getWalletProvider();
                        if (baseWalletProvider) {
                            window.provider = new ethers.providers.Web3Provider(baseWalletProvider);
                            window.signer = window.provider.getSigner();
                            window.loadAllData();
                        }
                    }
                });
            } catch (e) {
                console.error("AppKit framework loading failure:", e);
            }
        }
        window.addEventListener("load", initModalFallback);
    </script>

<script>
    let PVLT_CONTRACT = "";
    let TREASURY_CONTRACT = "";
    let GAME_CONTRACT = "";

    let provider;
    let signer;
    let userAddress;

    let localPoints = 0;
    let localEnergy = 0;
    let saveTimeout = null;

    const GAME_ABI = [
        "function tap() external",
        "function refillEnergy() external",
        "function convertToPVLT(uint256 amount) external",
        "function claimPVLT(uint256 amount) external",
        "function gPVLT(address) view returns(uint256)"
    ];

    const ERC20_ABI = [
        "function balanceOf(address owner) view returns(uint256)",
        "function approve(address spender, uint256 amount) external returns(bool)"
    ];

    const TREASURY_ABI = [
        "function treasuryBalance() view returns(uint256)"
    ];

    async function initConfig() {
        try {
            const response = await fetch("https://pvlt-server.onrender.com/api/config");
            const config = await response.json();
            
            PVLT_CONTRACT = config.pvlt;
            TREASURY_CONTRACT = config.treasury;
            GAME_CONTRACT = config.game;
            console.log("Production Configurations Loaded Safely.");
        } catch (err) {
            console.error("Critical configuration retrieval problem:", err);
        }
    }

    async function connectWallet() {
        if (!GAME_CONTRACT) {
            alert("Backend configurations are waking up. Try again in a few seconds.");
            return;
        }

        if (window.ethereum) {
            try {
                window.provider = new ethers.providers.Web3Provider(window.ethereum);
                await window.provider.send("eth_requestAccounts", []);
                window.signer = window.provider.getSigner();
                window.userAddress = await window.signer.getAddress();
                document.getElementById("wallet").innerHTML = "Connected: " + window.userAddress;
                loadAllData();
                return;
            } catch (err) {
                console.error("Wallet injection bypass error:", err);
            }
        }

        if (window.appKitModal) {
            try {
                await window.appKitModal.open();
            } catch (err) {
                console.error("Multi-wallet activation failure:", err);
            }
        }
    }

    async function loadAllData() {
        const activeSigner = window.signer || signer;
        const activeAddress = window.userAddress || userAddress;
        
        if (!activeSigner || !activeAddress) return;

        const pvlt = new ethers.Contract(PVLT_CONTRACT, ERC20_ABI, activeSigner);
        const treasury = new ethers.Contract(TREASURY_CONTRACT, TREASURY_ABI, activeSigner);
        const game = new ethers.Contract(GAME_CONTRACT, GAME_ABI, activeSigner);

        try {
            // Load off-chain stats (Energy & Points) from server database
            const response = await fetch(`https://pvlt-server.onrender.com/api/user-stats?address=${activeAddress}`);
            const stats = await response.json();

            localEnergy = stats.energy;
            localPoints = stats.points;

            document.getElementById("energy").innerHTML = localEnergy.toString();
            document.getElementById("points").innerHTML = localPoints.toFixed(2);

            // Load on-chain smart contract data (gPVLT)
            const gPvltBalance = await game.gPVLT(activeAddress);
            document.getElementById("gpvlt").innerHTML = ethers.utils.formatEther(gPvltBalance);

            // Load ERC20 token ledger totals
            const walletPVLT = await pvlt.balanceOf(activeAddress);
            document.getElementById("walletBalance").innerHTML = ethers.utils.formatEther(walletPVLT);

            const treasuryPVLT = await treasury.treasuryBalance();
            document.getElementById("treasuryBalance").innerHTML = ethers.utils.formatEther(treasuryPVLT);
        } catch (err) {
            console.error("Data visualization sync breakdown:", err);
        }
    }

    window.loadAllData = loadAllData;

    function tap() {
        const activeAddress = window.userAddress || userAddress;
        if (!activeAddress) return alert("Please connect your wallet first!");

        if (localEnergy <= 0) {
            alert("Out of Energy! Wait for replenishment or buy a refill pack.");
            return;
        }

        localEnergy -= 1;
        localPoints += 1;

        document.getElementById("energy").innerHTML = localEnergy.toString();
        document.getElementById("points").innerHTML = localPoints.toFixed(2);

        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(syncTapsToBackend, 1500);
    }

    async function syncTapsToBackend() {
        const activeAddress = window.userAddress || userAddress;
        if (!activeAddress) return;

        try {
            await fetch("https://pvlt-server.onrender.com/api/sync-progress", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    walletAddress: activeAddress,
                    currentPoints: localPoints,
                    currentEnergy: localEnergy
                })
            });
            console.log("Progress saved on backend database server.");
        } catch (err) {
            console.error("Tracking checkpoint synchronization issue:", err);
        }
    }

    async function buyEnergy() {
        const activeSigner = window.signer || signer;
        if (!activeSigner) return alert("Connect wallet first!");
        try {
            const pvlt = new ethers.Contract(PVLT_CONTRACT, ERC20_ABI, activeSigner);
            const game = new ethers.Contract(GAME_CONTRACT, GAME_ABI, activeSigner);

            const approveTx = await pvlt.approve(GAME_CONTRACT, ethers.utils.parseEther("300"));
            await approveTx.wait();

            const tx = await game.refillEnergy();
            await tx.wait();
            alert("10,000 Energy added successfully!");
            loadAllData();
        } catch(err) {
            alert(err.data?.message || err.message);
        }
    }

    // Step 1: Submit accumulated points to smart contract ledger state as gPVLT
    async function convertPointsToGPVLT() {
        const activeSigner = window.signer || signer;
        const activeAddress = window.userAddress || userAddress;
        if (!activeSigner || !activeAddress) return alert("Connect wallet first!");
        
        try {
            if (localPoints <= 0) {
                alert("No points available to synchronize on-chain.");
                return;
            }

            alert("Syncing game points onto the blockchain ledger... Stand by.");
            
            const syncResponse = await fetch("https://pvlt-server.onrender.com/api/blockchain-sync", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ walletAddress: activeAddress })
            });
            const syncResult = await syncResponse.json();

            if (!syncResult.success) {
                alert("Verification failed: " + syncResult.error);
                return;
            }

            alert("Points converted to gPVLT on-chain successfully!");
            loadAllData();
        } catch(err) {
            alert(err.message);
        }
    }

    // Step 2: Swap finalized on-chain gPVLT score states directly for deployable PVLT ERC20 tokens
    async function claimReward() {
        const activeSigner = window.signer || signer;
        const activeAddress = window.userAddress || userAddress;
        if (!activeSigner || !activeAddress) return alert("Connect wallet first!");
        
        try {
            const amount = prompt("Enter gPVLT Amount to Convert into PVLT Tokens:");
            if (!amount || parseFloat(amount) <= 0) return;

            const game = new ethers.Contract(GAME_CONTRACT, GAME_ABI, activeSigner);
            
            // Check contract state before prompting MetaMask validation
            const currentGPvlt = await game.gPVLT(activeAddress);
            if (ethers.utils.parseEther(amount).gt(currentGPvlt)) {
                alert("Insufficient gPVLT balance on-chain to handle token conversion.");
                return;
            }

            const tx = await game.convertToPVLT(ethers.utils.parseEther(amount));
            await tx.wait();
            alert("Tokens successfully claimed into your wallet!");
            loadAllData();
        } catch(err) {
            alert(err.data?.message || err.message);
        }
    }

    window.addEventListener("load", initConfig);
</script>
</body>
</html>
