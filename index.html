<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
font-size:12px;
z-index:10;
}

.val{color:#00ff99;font-weight:bold;}

.container{
padding-top:80px;
text-align:center;
}

.tap{
width:200px;
height:200px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:28px;
font-weight:bold;
}

.bar{
width:80%;
height:10px;
background:#1f2937;
margin:15px auto;
border-radius:10px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
}

.card{
margin:20px;
background:#111827;
padding:15px;
border-radius:10px;
}

button{
padding:12px;
border-radius:10px;
border:none;
margin-top:10px;
font-weight:bold;
}

.connect{background:#38bdf8;}

</style>

</head>

<body>

<div class="navbar">

<div>Points: <span class="val" id="pointsNav">0</span></div>

<div>PVLT: <span class="val" id="tokenNav">0</span></div>

<div>Wallet: <span class="val" id="walletNav">---</span></div>

</div>

<div class="container">

<h2>PVLT TAP GAME</h2>

<button class="connect" onclick="connect()">Connect Wallet</button>

<div class="bar"><div class="fill" id="bar"></div></div>

<div id="progress">0 / 10000</div>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<button onclick="claim()">CLAIM (100–500 tokens)</button>
</div>

<div class="card">
<h3>Leaderboard</h3>
<div id="board">Loading...</div>
</div>

</div>

<script>

let provider, signer, wallet;
let contract, tokenContract;

let points = 0;

const TAP = "YOUR_TAP_CONTRACT";
const TOKEN = "YOUR_PVLT_TOKEN";

const tapAbi = [
"function tap(uint256)",
"function getPoints(address) view returns (uint256)"
];

const tokenAbi = [
"function balanceOf(address) view returns (uint256)"
];

async function connect(){

provider = new ethers.providers.Web3Provider(window.ethereum);
await provider.send("eth_requestAccounts", []);

signer = provider.getSigner();
wallet = await signer.getAddress();

document.getElementById("walletNav").innerText =
wallet.slice(0,4)+"..."+wallet.slice(-4);

contract = new ethers.Contract(TAP, tapAbi, signer);
tokenContract = new ethers.Contract(TOKEN, tokenAbi, provider);

load();

}

async function tap(){

points++;

document.getElementById("pointsNav").innerText = points;

updateBar();

await contract.tap(1);

load();

}

function updateBar(){

let p = points % 10000;

document.getElementById("bar").style.width =
(p / 10000) * 100 + "%";

document.getElementById("progress").innerText =
p + " / 10000";

}

async function claim(){

try{

let tx = await contract.claim();
await tx.wait();

alert("Claim successful!");

load();

}catch(e){
alert(e.message);
}

}

async function load(){

let p = await contract.getPoints(wallet);
document.getElementById("pointsNav").innerText = p;

let bal = await tokenContract.balanceOf(wallet);
document.getElementById("tokenNav").innerText =
ethers.utils.formatEther(bal);

document.getElementById("board").innerHTML =
"1. You - " + p;

}

</script>

</body>
</html>
