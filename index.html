<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
        .card { background: #2c3e50; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat { background: #16a085; padding: 10px; border-radius: 5px; font-size: 0.9rem; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-connect { background-color: #3498db; color: white; }
        .btn-tap { background-color: #2ecc71; color: #1a1a2e; height: 100px; border-radius: 50%; width: 100px; margin: 20px auto; display: block; font-size: 1.2rem; }
        .btn-action { background-color: #e67e22; color: white; }
        .btn-refill { background-color: #f1c40f; color: #1a1a2e; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #status-feed { font-size: 0.8rem; color: #bdc3c7; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>PepeVolt Tap Game</h1>

    <div class="card">
        <button id="wallet-btn" class="btn-connect" onclick="toggleWallet()">Connect Wallet</button>
        <p id="pvlt-display">Balance: Locked</p>
    </div>

    <div class="card">
        <div class="grid">
            <div class="stat">⚡ Energy<br><span id="energy">0</span></div>
            <div class="stat">💎 Points<br><span id="points">0</span></div>
            <div class="stat">🪙 gPVLT<br><span id="gpvlt">0</span></div>
        </div>

        <button id="tap-button" class="btn-tap" onclick="handleTap()" disabled>TAP!</button>
    </div>

    <div class="card">
        <button id="free-refill-btn" class="btn-refill" onclick="triggerFreeRefill()" disabled>⚡ Free Contract Refill (+1)</button>
        <button id="convert-btn" class="btn-action" onclick="convertPoints()" disabled>Convert 100 Points → 1 gPVLT</button>
        <button id="claim-btn" class="btn-action" onclick="claimReward()" disabled>Claim Reward (100-1000 gPVLT)</button>
        <button id="buy-energy-btn" class="btn-action" onclick="confirmRefill()" disabled>Buy Full 10,000 Energy (100 PVLT)</button>
    </div>

    <p id="status-feed">Please connect your Web3 wallet inside Polygon Network.</p>

    <script>
        const POLYGON_CHAIN_ID = "0x89";
        const CONTRACT_ADDRESSES = {
            PVLT: "0xb8010fD52D5208eC05574a7D5A939c0d446A862a",
            PepeVoltGame: "0x151803532A33837E4bBc2Afc23c6b1f59039B82D"
        };

        const ABIs = {
            PVLT: [
                "function balanceOf(address account) view returns (uint256)",
                "function allowance(address owner, address spender) view returns (uint256)",
                "function approve(address spender, uint256 amount) returns (bool)"
            ],
            PepeVoltGame: [
                "function players(address) view returns (uint256 energy, uint256 points, uint256 burnedGPVLT, bool paidUser, uint256 lastClaimDay)",
                "function tap() external",
                "function buyEnergy() external",
                "function convertPoints() external",
                "function claimRewards() external",
                "function refillEnergy() external",
                "function FREE_CAP() view returns (uint256)",
                "function PAID_CAP() view returns (uint256)"
            ]
        };

        let provider, signer, userAddress;
        let pvltContract, gameContract;
        let isWalletConnected = false;
        let actionInFlight = false;

        async function checkAndSwitchNetwork() {
            try {
                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (currentChainId !== POLYGON_CHAIN_ID) {
                    document.getElementById('status-feed').innerText = "Switching to Polygon...";
                    try {
                        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: POLYGON_CHAIN_ID }] });
                    } catch (err) {
                        if (err.code === 4902) {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: POLYGON_CHAIN_ID,
                                    chainName: 'Polygon Mainnet',
                                    nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
                                    rpcUrls: ['https://polygon-rpc.com/'],
                                    blockExplorerUrls: ['https://polygonscan.com/']
                                }]
                            });
                        } else { throw err; }
                    }
                }
                return true;
            } catch (err) {
                document.getElementById('status-feed').innerText = "Network switch rejected.";
                return false;
            }
        }

        async function toggleWallet() {
            if (isWalletConnected) {
                isWalletConnected = false; userAddress = null; provider = null; signer = null; pvltContract = null; gameContract = null;
                document.getElementById('wallet-btn').innerText = "Connect Wallet";
                setButtonsState(true);
                document.getElementById('status-feed').innerText = "Wallet disconnected.";
            } else {
                if (!window.ethereum) { alert("Please use a Web3 browser or app dApp wallet."); return; }
                try {
                    if (!await checkAndSwitchNetwork()) return;
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = await signer.getAddress();

                    pvltContract = new ethers.Contract(CONTRACT_ADDRESSES.PVLT, ABIs.PVLT, signer);
                    gameContract = new ethers.Contract(CONTRACT_ADDRESSES.PepeVoltGame, ABIs.PepeVoltGame, signer);

                    isWalletConnected = true;
                    document.getElementById('wallet-btn').innerText = `Disconnect: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`;
                    setButtonsState(false);
                    await syncContractState();
                } catch (err) {
                    console.error(err);
                    document.getElementById('status-feed').innerText = "Connection failed.";
                }
            }
        }

        function setButtonsState(disabled) {
            document.getElementById('tap-button').disabled = disabled;
            document.getElementById('convert-btn').disabled = disabled;
            document.getElementById('claim-btn').disabled = disabled;
            document.getElementById('free-refill-btn').disabled = disabled;
            document.getElementById('buy-energy-btn').disabled = disabled;
        }

        async function syncContractState() {
            if (!gameContract || !userAddress || !isWalletConnected) return;
            try {
                const playerData = await gameContract.players(userAddress);
                const pvltBalance = await pvltContract.balanceOf(userAddress);

                document.getElementById('energy').innerText = Number(playerData.energy).toLocaleString();
                document.getElementById('points').innerText = Number(playerData.points).toLocaleString();
                document.getElementById('gpvlt').innerText = Number(playerData.burnedGPVLT).toLocaleString();
                document.getElementById('pvlt-display').innerText = `Balance: ${parseFloat(ethers.formatEther(pvltBalance)).toFixed(3)} PVLT`;
                document.getElementById('status-feed').innerText = "Data updated from contract.";
            } catch (err) {
                console.error(err);
            }
        }

        async function handleTap() {
            if (!isWalletConnected || actionInFlight) return;
            try {
                actionInFlight = true;
                document.getElementById('status-feed').innerText = "Confirm transaction in your wallet...";
                const tx = await gameContract.tap();
                document.getElementById('status-feed').innerText = "Waiting for block confirmation...";
                await tx.wait(1);
                document.getElementById('status-feed').innerText = "Tap recorded!";
            } catch (err) {
                document.getElementById('status-feed').innerText = "Transaction canceled.";
            } finally {
                actionInFlight = false;
                await syncContractState();
            }
        }

        async function triggerFreeRefill() {
            if (!isWalletConnected || actionInFlight) return;
            try {
                actionInFlight = true;
                document.getElementById('status-feed').innerText = "Sending refill tx...";
                const tx = await gameContract.refillEnergy();
                await tx.wait(1);
                document.getElementById('status-feed').innerText = "Energy +1 added!";
            } catch (err) {
                document.getElementById('status-feed').innerText = "Refill failed.";
            } finally {
                actionInFlight = false;
                await syncContractState();
            }
        }

        async function confirmRefill() {
            if (!isWalletConnected || actionInFlight) return;
            try {
                actionInFlight = true;
                const price = ethers.parseEther("100");
                const currentAllowance = await pvltContract.allowance(userAddress, CONTRACT_ADDRESSES.PepeVoltGame);
                
                if (currentAllowance < price) {
                    document.getElementById('status-feed').innerText = "Approving PVLT...";
                    const approveTx = await pvltContract.approve(CONTRACT_ADDRESSES.PepeVoltGame, price);
                    await approveTx.wait(1);
                }

                document.getElementById('status-feed').innerText = "Buying full energy...";
                const buyTx = await gameContract.buyEnergy();
                await buyTx.wait(1);
                alert("Bought 10,000 Energy!");
            } catch (err) {
                document.getElementById('status-feed').innerText = "Purchase aborted.";
            } finally {
                actionInFlight = false;
                await syncContractState();
            }
        }

        async function convertPoints() {
            if (!isWalletConnected || actionInFlight) return;
            try {
                actionInFlight = true;
                document.getElementById('status-feed').innerText = "Converting points...";
                const tx = await gameContract.convertPoints();
                await tx.wait(1);
                document.getElementById('status-feed').innerText = "Conversion complete.";
            } catch (err) {
                document.getElementById('status-feed').innerText = "Conversion failed.";
            } finally {
                actionInFlight = false;
                await syncContractState();
            }
        }

        async function claimReward() {
            if (!isWalletConnected || actionInFlight) return;
            try {
                actionInFlight = true;
                document.getElementById('status-feed').innerText = "Claiming rewards...";
                const tx = await gameContract.claimRewards();
                await tx.wait(1);
                alert("Rewards claimed!");
            } catch (err) {
                alert("Failed: Check daily cooldown or gPVLT thresholds (100-1000).");
            } finally {
                actionInFlight = false;
                await syncContractState();
            }
        }

        if (window.ethereum) {
            window.ethereum.on('chainChanged', () => window.location.reload());
            window.ethereum.on('accountsChanged', () => window.location.reload());
        }
    </script>
</body>
</html>
