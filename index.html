<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEPE VOLT ⚡ Tap Game</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0b0b0b;
      color: white;
    }

    button {
      padding: 15px 20px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .box {
      margin-top: 30px;
    }
  </style>
</head>

<body>

<h1>⚡ PEPE VOLT TAP GAME</h1>

<button onclick="connectWallet()">Connect Wallet</button>

<p id="wallet">Not connected</p>

<div class="box">
  <h2>Score: <span id="score">0</span></h2>

  <button onclick="tap()">⚡ TAP</button>
  <button onclick="claim()">💰 CLAIM REWARDS</button>
</div>

<script>
let wallet = null;

// 🔗 CONNECT WALLET
async function connectWallet() {
  if (!window.ethereum) {
    alert("Install MetaMask");
    return;
  }

  const accounts = await window.ethereum.request({
    method: "eth_requestAccounts"
  });

  wallet = accounts[0];
  document.getElementById("wallet").innerText = wallet;
}

// ⚡ TAP FUNCTION
async function tap() {
  if (!wallet) return alert("Connect wallet first");

  const res = await fetch("https://pvlt-server.onrender.com/tap", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ walletAddr: wallet })
  });

  const data = await res.json();

  if (data.score !== undefined) {
    document.getElementById("score").innerText = data.score;
  } else {
    alert(data.error);
  }
}

// 💰 CLAIM FUNCTION
async function claim() {
  if (!wallet) return alert("Connect wallet first");

  const res = await fetch("https://pvlt-server.onrender.com/claim", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ walletAddr: wallet })
  });

  const data = await res.json();

  if (data.success) {
    alert("🎉 You received " + data.minted + " PVLTG");
  } else {
    alert(data.error || "No rewards");
  }
}
</script>

</body>
</html>
