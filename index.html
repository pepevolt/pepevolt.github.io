<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#0f172a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
border-bottom:1px solid #1f2937;
font-size:12px;
z-index:10;
}

.nav{
color:#94a3b8;
}

.val{
color:#00ff99;
font-weight:bold;
}

/* MAIN */
.container{
padding-top:80px;
text-align:center;
}

h2{
color:#00ff99;
}

/* TAP */
.tap{
width:200px;
height:200px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:28px;
font-weight:bold;
color:black;
box-shadow:0 0 20px #00ff99;
}

.tap:active{
transform:scale(0.97);
}

/* PROGRESS */
.bar{
width:80%;
height:10px;
background:#1f2937;
border-radius:20px;
margin:15px auto;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:0.2s;
}

/* LEADERBOARD */
.card{
margin:20px 10px;
background:#111827;
padding:15px;
border-radius:12px;
}

.leader{
text-align:left;
font-size:13px;
}

button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.connect{
background:#38bdf8;
color:black;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div>Points: <span class="val" id="pointsNav">0</span></div>

<div>PVLT: <span class="val" id="tokenNav">0</span></div>

<div>Wallet: <span class="val" id="walletNav">---</span></div>

</div>

<div class="container">

<h2>PVLT TAP ARENA</h2>

<button class="connect" onclick="connectWallet()">
Connect Wallet
</button>

<!-- PROGRESS -->
<div class="bar">
<div class="fill" id="bar"></div>
</div>

<div id="progressText">0 / 10000</div>

<button class="tap" onclick="tap()">⚡ TAP</button>

<!-- LEADERBOARD -->
<div class="card">
<h3>🏆 REAL LEADERBOARD</h3>
<div class="leader" id="board">Loading...</div>
</div>

</div>

<script>

let provider, signer, wallet;
let contract, tokenContract;

let points = 0;

/* CONTRACTS */
const TAP = "YOUR_TAP_CONTRACT";
const TOKEN = "YOUR_PVLT_TOKEN";

/* ABI */
const tapAbi = [
"function tap(uint256)",
"function getPoints(address) view returns (uint256)",
"function getTopPlayers() view returns (address[])"
];

const tokenAbi = [
"function balanceOf(address) view returns (uint256)"
];

/* CONNECT */
async function connectWallet(){

provider = new ethers.providers.Web3Provider(window.ethereum);
await provider.send("eth_requestAccounts", []);

signer = provider.getSigner();
wallet = await signer.getAddress();

document.getElementById("walletNav").innerText =
wallet.slice(0,4)+"..."+wallet.slice(-4);

contract = new ethers.Contract(TAP, tapAbi, signer);
tokenContract = new ethers.Contract(TOKEN, tokenAbi, provider);

load();

}

/* TAP */
async function tap(){

points++;

document.getElementById("pointsNav").innerText = points;

updateBar();

await contract.tap(1);

load();

}

/* PROGRESS */
function updateBar(){

let percent = (points % 10000) / 10000 * 100;

document.getElementById("bar").style.width = percent + "%";

document.getElementById("progressText").innerText =
(points % 10000) + " / 10000";

}

/* LOAD */
async function load(){

if(!wallet) return;

let p = await contract.getPoints(wallet);
document.getElementById("pointsNav").innerText = p;

/* PVLT */
let bal = await tokenContract.balanceOf(wallet);
document.getElementById("tokenNav").innerText =
ethers.utils.formatEther(bal);

/* REAL LEADERBOARD */
let list = await contract.getTopPlayers();

let html = "";

for(let i=0;i<list.length;i++){

html += (i+1) + ". " +
list[i].slice(0,6)+"..." +
list[i].slice(-4) + "<br>";

}

document.getElementById("board").innerHTML = html || "No players yet";

}

</script>

</body>
</html>
