<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Universal Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
font-size:12px;
z-index:10;
}

.val{color:#00ff99;font-weight:bold;}

.container{
padding-top:80px;
text-align:center;
}

.tap{
width:200px;
height:200px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:28px;
font-weight:bold;
color:black;
}

button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.connect{background:#38bdf8;}

.card{
margin:20px;
background:#111827;
padding:15px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="navbar">

<div>Points: <span class="val" id="pointsNav">0</span></div>

<div>PVLT: <span class="val" id="tokenNav">0</span></div>

<div>Wallet: <span class="val" id="walletNav">---</span></div>

</div>

<div class="container">

<h2>PVLT UNIVERSAL TAP</h2>

<button class="connect" onclick="connectWallet()">
Connect Wallet
</button>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<button onclick="claim()">CLAIM</button>
</div>

</div>

<script>

let provider, signer, wallet;
let contract, tokenContract;

/* CONTRACTS */
const TAP = "YOUR_TAP_CONTRACT";
const TOKEN = "YOUR_PVLT_TOKEN";

/* ABI */
const tapAbi = [
"function tap(uint256)",
"function getPoints(address) view returns (uint256)",
"function claim()"
];

const tokenAbi = [
"function balanceOf(address) view returns (uint256)"
];

/* UNIVERSAL WALLET CONNECT */
async function connectWallet(){

try{

/* 1. Telegram check */
if(window.Telegram && Telegram.WebApp){
Telegram.WebApp.ready();
Telegram.WebApp.expand();
}

/* 2. injected wallet */
if(window.ethereum){

provider = new ethers.providers.Web3Provider(window.ethereum, "any");
await provider.send("eth_requestAccounts", []);
signer = provider.getSigner();

wallet = await signer.getAddress();

}else{

/* 3. fallback deep link */
let bscLink =
"https://metamask.app.link/dapp/" + window.location.href;

alert("Open wallet: " + bscLink);
window.location.href = bscLink;
return;

}

/* UI */
document.getElementById("walletNav").innerText =
wallet.slice(0,4)+"..."+wallet.slice(-4);

contract = new ethers.Contract(TAP, tapAbi, signer);
tokenContract = new ethers.Contract(TOKEN, tokenAbi, provider);

load();

}catch(e){
console.log(e);
alert("Wallet connection failed");
}

}

/* TAP */
async function tap(){

if(!wallet) return;

await contract.tap(1);
load();

}

/* CLAIM */
async function claim(){

try{
await contract.claim();
alert("Claim success");
load();
}catch(e){
alert(e.message);
}

}

/* LOAD */
async function load(){

if(!wallet) return;

let p = await contract.getPoints(wallet);
document.getElementById("pointsNav").innerText = p;

let b = await tokenContract.balanceOf(wallet);
document.getElementById("tokenNav").innerText =
ethers.utils.formatEther(b);

}

</script>

</body>
</html>
