<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt Game</title>
    <style>
        /* Add your CSS here to match the provided design */
        body { background-color: #0d1117; color: white; font-family: sans-serif; text-align: center; }
        .container { border: 1px solid #30363d; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        button { display: block; width: 100%; margin: 10px 0; padding: 15px; border-radius: 5px; border: none; cursor: pointer; background: linear-gradient(90deg, #60ff8e, #00d2ff); }
    </style>
</head>
<body>

    <div class="container">
        <h1>PepeVolt</h1>
        <div id="stats">Energy: <span id="energy">0</span> | Points: <span id="points">0</span></div>
        
        <button id="connectBtn">CONNECT WALLET</button>
        <button onclick="buyEnergy()">BUY ENERGY</button>
        <button onclick="swapPoints()">SWAP POINTS -> PVLTG</button>
        <button onclick="claimRewards()">CLAIM PVLT</button>
    </div>

    <script type="module">
        import { createAppKit, defaultConfig } from 'https://cdn.jsdelivr.net/npm/@reown/appkit@latest/+esm';
        import { ethers } from 'https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js';

        const PROJECT_ID = '1731f99148b9cf6107dee70b6efb14b7';
        const GAME_ADDR = "0x151803532A33837E4bBc2Afc23c6b1f59039B82D";
        
        // Initialize AppKit
        const modal = createAppKit({
            projectId: PROJECT_ID,
            chains: [ { id: 137, name: 'Polygon', currency: 'MATIC', explorerUrl: 'https://polygonscan.com', rpcUrl: 'https://polygon-rpc.com' } ]
        });

        // Event listener for connect
        document.getElementById('connectBtn').onclick = () => modal.open();

        // Transaction functions
        window.buyEnergy = async () => {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const contract = new ethers.Contract(GAME_ADDR, ["function buyEnergy() external"], signer);
            const tx = await contract.buyEnergy();
            await tx.wait();
            alert("Energy bought!");
        };

        window.swapPoints = async () => {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const contract = new ethers.Contract(GAME_ADDR, ["function convertPoints() external"], signer);
            await (await contract.convertPoints()).wait();
            alert("Swapped!");
        };

        window.claimRewards = async () => {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const contract = new ethers.Contract(GAME_ADDR, ["function claimRewards() external"], signer);
            await (await contract.claimRewards()).wait();
            alert("Claimed!");
        };
    </script>
</body>
</html>
