<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PVLT Tap Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>
       <style>
        /* ================= RESET ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020b18;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* ================= BODY ================= */
        body {
            display: flex;
            flex-direction: column;
        }

        /* ================= TOP BAR ================= */
        .topbar {
            width: 100%;
            padding: 14px 18px;
            background: #091426;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        /* ================= MAIN ================= */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        /* ================= TAP BUTTON ================= */
        .tapBtn {
            width: 240px;
            height: 240px;
            border: none;
            border-radius: 50%;
            overflow: hidden;
            margin-top: 20px;
            background: linear-gradient(135deg, #00ff99, #00ccff);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 255, 180, 0.25);
            cursor: pointer;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .tapBtn:active {
            transform: scale(0.96);
        }

        .tapBtn img {
            width: 78%;
            height: 78%;
            object-fit: contain;
            pointer-events: none;
        }

        /* ================= CARD ================= */
        .card {
            width: 100%;
            max-width: 380px;
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ================= INPUT ================= */
        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #0c1628;
            color: white;
            font-size: 14px;
            outline: none;
        }

        /* ================= BUTTON ================= */
        .actionBtn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff99, #00ccff);
            color: black;
            cursor: pointer;
        }

        /* ================= STATUS ================= */
        .status {
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
            display: none;
        }

        /* ================= INFO BOX ================= */
        .info {
            margin-top: 16px;
            font-size: 12px;
            line-height: 1.7;
            opacity: 0.8;
            text-align: center;
            max-width: 380px;
        }

        /* ================= BUY MODAL POPUP ================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 11, 24, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 90%;
            max-width: 340px;
            background: #091426;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #00ff99;
        }

        .modal-box p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-confirm {
            background: linear-gradient(90deg, #00ff99, #00ccff);
            color: black;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div>🔋 <span id="energy">50</span></div>
        <div>⚡ <span id="points">0</span></div>
        <div>💎 <span id="gpvlt">0.0000</span></div>
    </div>

    <div class="main">
        <button class="tapBtn" onclick="tap()">
            <img src="images/IMG_1850.png" alt="Tap Target">
        </button>

        <div class="card">
            <input id="walletInput" placeholder="Connect Polygon Wallet" readonly>
            <button class="actionBtn" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
            <button class="actionBtn" onclick="openBuyModal()">BUY ENERGY</button>
            <button class="actionBtn" onclick="swapPoints()">SWAP POINTS → gPVLT</button>
            <button class="actionBtn" onclick="claimPVLT()">CLAIM PVLT</button>
        </div>
    </div>

    <script>
        const API = "https://pvlt-server.onrender.com";
        const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";
        const PVLT = "0xb8010fD52D5208eC05574a7D5A939c0d446A862a"; 
        const TreasuryVolt = "0x3c25FE15e6fa0Eeb226Af53D1c9D8f8FA8BA21bc";

        let web3Provider, wallet, points = 0, energy = 50, gpvlt = 0;

        function updateUI(){
            document.getElementById("energy").innerText = energy;
            document.getElementById("points").innerText = points;
            document.getElementById("gpvlt").innerText = Number(gpvlt).toFixed(4);
        }

        /* ================= SWAP POINTS (Burn Flow) ================= */
        async function swapPoints() {
            if (!wallet) return alert("Connect wallet first");
            try {
                // 1. Backend sync: Get the amount of gPVLT to burn
                const res = await fetch(API + "/swap-points", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet })
                });
                const data = await res.json();
                if (data.error) return alert(data.error);

                // 2. On-Chain track: Call trackBurn on TreasuryVolt
                const signer = web3Provider.getSigner();
                const treasuryContract = new ethers.Contract(TreasuryVolt, ["function trackBurn(uint256 amount) external"], signer);
                
                const tx = await treasuryContract.trackBurn(ethers.utils.parseUnits(data.gpvlt.toString(), 18));
                await tx.wait();

                gpvlt = data.gpvlt;
                points = 0;
                updateUI();
                alert("Burn tracked on-chain successfully!");
            } catch (err) {
                console.error(err);
                alert("Swap/Burn failed: " + err.message);
            }
        }

        /* ================= CLAIM PVLT (Reward Flow) ================= */
        async function claimPVLT() {
            if (!wallet) return alert("Connect wallet first");
            try {
                // Notify server to execute the authorized sendReward call
                const res = await fetch(API + "/claim-pvltg", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet })
                });
                const data = await res.json();
                if (data.error) return alert(data.error);

                alert("Reward request processed! Check your wallet for PVLT tokens.");
                gpvlt = 0;
                updateUI();
            } catch (err) {
                console.error(err);
                alert("Claim failed.");
            }
        }

        // ... (Include your connectWallet, tap, executeEnergyPurchase, and refill logic here)
    </script>
</body>
</html>
