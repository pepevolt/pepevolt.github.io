<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Safe Web3 Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>

html,body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
touch-action:none;
-webkit-text-size-adjust:100%;
}

body{
font-family:Arial;
background: radial-gradient(circle at top,#0b1220,#020617);
color:white;
position:fixed;
width:100%;
height:100%;
text-align:center;
}

.navbar{
position:fixed;
top:0;left:0;right:0;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
background: rgba(255,255,255,0.06);
backdrop-filter: blur(12px);
font-size:12px;
}

.container{
position:absolute;
top:60px;
left:0;right:0;bottom:0;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
}

.tap{
width:170px;
height:170px;
border-radius:50%;
background: linear-gradient(135deg,#00ff99,#00ccff);
border:none;
font-size:22px;
font-weight:bold;
color:black;
}

.card{
margin:12px;
padding:15px;
width:85%;
background: rgba(255,255,255,0.05);
border-radius:14px;
border:1px solid rgba(255,255,255,0.08);
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background: rgba(0,0,0,0.3);
color:white;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
margin-top:10px;
background: linear-gradient(90deg,#00ff99,#00ccff);
color:black;
font-weight:bold;
}

</style>

</head>

<body>

<div class="navbar">
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0</span></div>
<div>👤 <span id="userId">guest</span></div>
</div>

<div class="container">

<h2>PVLT SAFE GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<input id="wallet" placeholder="Wallet (optional)">
<br>
<button onclick="connectWallet()">CONNECT (optional)</button>
</div>

<div class="card">
<input id="withdraw" placeholder="100 - 500 tokens">
<br>
<button onclick="withdraw()">WITHDRAW</button>
</div>

</div>

<script>

/* ================= SAFE STATE ================= */
let points = 0;
let tokens = 0;
let wallet = "";
let userId = "guest";

let provider = null;
let signer = null;
let contract = null;

/* ================= SAFE UI ================= */
function set(id,val){
let el=document.getElementById(id);
if(el) el.innerText=val;
}

/* ================= INIT ================= */
function init(){

try{
if(window.Telegram && window.Telegram.WebApp){
Telegram.WebApp.ready();
Telegram.WebApp.expand();
userId = Telegram.WebApp.initDataUnsafe?.user?.id || "guest";
}
}catch(e){}

set("userId", userId);
}

/* ================= TAP ================= */
function tap(){
points++;
set("points", points);
}

/* ================= WALLET CONNECT (SAFE) ================= */
async function connectWallet(){

try{

if(!window.ethereum){
alert("Wallet not available (still OK to play)");
return;
}

provider = new ethers.providers.Web3Provider(window.ethereum);
await provider.send("eth_requestAccounts", []);

signer = provider.getSigner();
wallet = await signer.getAddress();

alert("Wallet connected: " + wallet.slice(0,6));

}catch(e){
console.log("wallet error", e);
alert("Wallet connection failed but game continues");
}

}

/* ================= WITHDRAW (SAFE DEMO MODE) ================= */
function withdraw(){

let amt = parseInt(document.getElementById("withdraw").value);

if(!wallet){
alert("Wallet not linked (demo mode only)");
return;
}

if(!amt || amt < 100 || amt > 500){
alert("100-500 only");
return;
}

let required = amt * 100000;

if(points < required){
alert("Not enough points");
return;
}

points -= required;
tokens += amt;

set("points", points);
set("tokens", tokens);

alert("Withdraw request sent (backend not connected yet)");
}

/* ================= GLOBAL SAFETY ================= */
window.onerror = function(){
return true;
};

/* ================= START ================= */
window.addEventListener("DOMContentLoaded", init);

</script>

</body>

</html>
