<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PEPE VOLT ⚡ Game</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0b0b0b;
      color: white;
    }

    button {
      padding: 14px 18px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .box { margin-top: 30px; }
  </style>
</head>

<body>

<h1>⚡ PEPE VOLT TAP GAME</h1>

<button id="connectBtn">Connect Wallet</button>

<p id="wallet">Not connected</p>

<div class="box">
  <h2>Score: <span id="score">0</span></h2>

  <button onclick="tap()">⚡ TAP</button>
  <button onclick="claim()">💰 CLAIM</button>
</div>

<!-- Reown WalletConnect -->
<script type="module">
import { createAppKit } from "https://unpkg.com/@reown/appkit@latest/dist/index.js";

const appKit = createAppKit({
  projectId: "1731f99148b9cf6107dee70b6efb14b7",
  networks: [137], // Polygon mainnet
  defaultNetwork: 137
});

let wallet = null;

// CONNECT WALLET
document.getElementById("connectBtn").onclick = async () => {
  const result = await appKit.open();

  wallet = result.address;

  document.getElementById("wallet").innerText = wallet;
};

// TAP FUNCTION
window.tap = async function () {
  if (!wallet) return alert("Connect wallet first");

  const res = await fetch("https://pvlt-server.onrender.com/tap", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ wallet })
  });

  const data = await res.json();

  if (data.score !== undefined) {
    document.getElementById("score").innerText = data.score;
  } else {
    alert(data.error);
  }
};

// CLAIM FUNCTION
window.claim = async function () {
  if (!wallet) return alert("Connect wallet first");

  const res = await fetch("https://pvlt-server.onrender.com/claim", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ wallet })
  });

  const data = await res.json();

  if (data.success) {
    alert("🎉 Reward sent: " + data.minted + " PVLTG");
  } else {
    alert(data.error || "No reward");
  }
};
</script>

</body>
</html>
