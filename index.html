<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PEPEVOLT BOT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script type="module">
        import { createWeb3Modal, defaultWagmiConfig } from 'https://esm.run/@web3modal/wagmi@3.5.0';
        import { polygon } from 'https://esm.run/viem/chains';
        
        const projectId = 'YOUR_REOWN_PROJECT_ID_HERE'; 

        const metadata = {
            name: 'PepeVolt Tap Game',
            description: 'PepeVolt Mini App System Engine',
            url: window.location.origin,
            icons: ['images/IMG_1850.png']
        };

        const chains = [polygon];
        const wagmiConfig = defaultWagmiConfig({ chains, projectId, metadata });
        
        window.web3Modal = createWeb3Modal({ wagmiConfig, projectId, chains });
    </script>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; user-select: none; -webkit-user-select: none;
        }
        body { 
            background: #050f1e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: white; display: flex; flex-direction: column; min-height: 100vh; align-items: center;
            overflow-y: auto; overflow-x: hidden; padding: 0 0 env(safe-area-inset-bottom) 0;
        }
        
        .topbar { 
            position: sticky; top: 0; z-index: 999; background: #050f1e; width: 100%; max-width: 100%;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 15px; 
            padding: calc(14px + env(safe-area-inset-top)) 24px 14px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .stat-item { display: flex; align-items: center; gap: 6px; }

        .main-container { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            flex-grow: 1; gap: 25px; width: 100%; padding: 25px 0 20px 0;
        }
        
        .character-btn { background: none; border: none; cursor: pointer; outline: none; border-radius: 50%; transition: transform 0.05s ease; }
        .character-btn:active { transform: scale(0.95); }
        .character-btn img { width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 0 40px rgba(0, 255, 153, 0.3); }
        
        .ui-card { width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .address-display { width: 100%; padding: 14px; border-radius: 14px; background: #0a182c; color: #8fa3bf; border: 1px solid rgba(255, 255, 255, 0.02); font-size: 14px; text-align: center; font-weight: bold; outline: none; }
        
        .btn { 
            width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 15px; font-weight: bold; 
            color: black; cursor: pointer; background: linear-gradient(90deg, #00ff99, #00ccff); 
            transition: opacity 0.2s, transform 0.1s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn:active { opacity: 0.9; transform: scale(0.99); }
        .btn-withdraw { background: linear-gradient(90deg, #ffcc00, #ff3300); color: white; }
        
        .live-balances-box {
            background: rgba(255, 255, 255, 0.02); margin-top: 5px; padding: 12px; border-radius: 12px;
            font-size: 12px; color: #a2b7d4; display: flex; flex-direction: column; gap: 6px; text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .balance-line { display: flex; justify-content: space-between; }
        .balance-val { font-weight: bold; color: #00ff99; }

        .footer-rules { font-size: 11px; line-height: 1.6; color: #697d95; text-align: center; margin-bottom: 25px; font-weight: 500; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="stat-item">🛢️ <span id="energy">0</span></div>
    <div class="stat-item">⚡ <span id="points">0</span></div>
    <div class="stat-item">💎 <span id="pvltg">0.0000</span></div>
</div>

<div class="main-container">
    <button class="character-btn" onclick="handleTap()">
        <img src="images/IMG_1850.png" alt="PepeVolt">
    </button>
    <div class="ui-card">
        <input class="address-display" id="walletDisplay" value="Wallet Not Connected" readonly>
        <button class="btn" id="connectBtn" onclick="handleWalletAction()">CONNECT WALLET</button>
        <button class="btn" onclick="triggerBuyEnergy()">BUY INSTANT ENERGY</button>
        <button class="btn" onclick="swapPoints()">SWAP POINTS → PVLTG</button>
        <button class="btn btn-withdraw" onclick="triggerWithdrawal()">WITHDRAWAL PVLT</button>

        <div class="live-balances-box">
            <div class="balance-line">
                <span>Your Personal Wallet PVLT:</span>
                <span class="balance-val" id="userWalletPvlt">0.0000</span>
            </div>
            <div class="balance-line">
                <span>Available Treasury Pool:</span>
                <span class="balance-val" id="treasuryVaultPvlt" style="color:#00ccff;">0.0000</span>
            </div>
        </div>
    </div>
</div>

<div class="footer-rules">
    1 Tap = 2 Points<br>
    2000 Points = 4 PVLTG<br>
    3000 PVLTG = 6 PVLT<br>
    Min Withdrawal: 10 PVLT | Max: 1000 PVLT
</div>

<script>
    const API_URL = "https://pvlt-server.onrender.com"; 
    
    const MAIN_TOKEN_CONTRACT = "YOUR_DEPLOYED_CONTRACT_1_ADDRESS";
    const TREASURY_CONTRACT = "YOUR_DEPLOYED_CONTRACT_3_ADDRESS";
    const ERC20_ABI = ["function balanceOf(address owner) view returns (uint256)"];

    let walletAddress = "", points = 0, energy = 0, pvltg = 0;
    let autoRefillInterval = null;

    function updateUI() {
        document.getElementById("energy").innerText = energy;
        document.getElementById("points").innerText = points;
        document.getElementById("pvltg").innerText = Number(pvltg).toFixed(4);
    }

    function initializeEnergyTracking() {
        if (autoRefillInterval) clearInterval(autoRefillInterval);
        autoRefillInterval = setInterval(() => {
            if (energy === 0) {
                energy = 1;
                updateUI();
            } else if (energy > 0 && energy < 20) {
                energy += 1;
                updateUI();
            }
        }, 1000);
    }

    async function handleWalletAction() {
        if (window.web3Modal) {
            await window.web3Modal.open();
            const verificationTracker = setInterval(async () => {
                if (window.ethereum && window.ethereum.selectedAddress) {
                    clearInterval(verificationTracker);
                    walletAddress = window.ethereum.selectedAddress;
                    document.getElementById("walletDisplay").value = walletAddress.slice(0,6) + "..." + walletAddress.slice(-4);
                    document.getElementById("connectBtn").innerText = "DISCONNECT";
                    
                    const res = await fetch(`${API_URL}/user`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ wallet: walletAddress })
                    });
                    const data = await res.json();
                    points = data.points; energy = data.energy; pvltg = data.pvltg;
                    updateUI();
                    loadOnChainBalances();
                }
            }, 1000);
        }
    }

    async function loadOnChainBalances() {
        if (!window.ethereum || !walletAddress) return;
        try {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const tokenContractInstance = new ethers.Contract(MAIN_TOKEN_CONTRACT, ERC20_ABI, provider);
            
            const rawUserBalance = await tokenContractInstance.balanceOf(walletAddress);
            document.getElementById("userWalletPvlt").innerText = Number(ethers.utils.formatEther(rawUserBalance)).toFixed(4);
            
            const rawTreasuryBalance = await tokenContractInstance.balanceOf(TREASURY_CONTRACT);
            document.getElementById("treasuryVaultPvlt").innerText = Number(ethers.utils.formatEther(rawTreasuryBalance)).toFixed(4);
        } catch(err) { console.error("Blockchain sync data load failure:", err); }
    }

    async function handleTap() {
        if (!walletAddress) return alert("Connect your wallet first to start earning points!");
        const res = await fetch(`${API_URL}/tap`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet: walletAddress })
        });
        const data = await res.json();
        if (data.error) return alert(data.error);
        points = data.points; energy = data.energy;
        updateUI();
    }

    async function triggerBuyEnergy() {
        if (!walletAddress) return alert("Connect account wallet first");
        
        alert("Approving transaction signature parameters via Polygon infrastructure...");
        try {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            const tokenInstance = new ethers.Contract(MAIN_TOKEN_CONTRACT, ["function approve(address spender, uint256 value) returns (bool)"], signer);
            
            const approveTx = await tokenInstance.approve(TREASURY_CONTRACT, ethers.utils.parseEther("1000"));
            await approveTx.wait();

            const res = await fetch(`${API_URL}/buy-energy`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ wallet: walletAddress })
            });
            const data = await res.json();
            if(data.error) return alert(data.error);
            
            energy = data.energy;
            updateUI();
            loadOnChainBalances();
            alert("Refill Confirmed on-chain! Added 10,000 Energy.");
        } catch (e) {
            alert("Transaction decline: Insufficient balance or rejection parameters encountered.");
        }
    }

    async function swapPoints() {
        if (!walletAddress) return;
        const res = await fetch(`${API_URL}/swap-points`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet: walletAddress })
        });
        const data = await res.json();
        if (data.error) return alert(data.error);
        pvltg = data.pvltg; points = data.remainingPoints;
        updateUI();
    }

    async function triggerWithdrawal() {
        if (!walletAddress) return alert("Connect wallet first");
        
        const expectedPayout = pvltg / 500;
        if (expectedPayout < 10) return alert("Quantity below 10 PVLT minimum threshold requirement.");
        if (expectedPayout > 1000) return alert("Quantity exceeds 1000 PVLT maximum threshold authorization.");

        const res = await fetch(`${API_URL}/withdraw-pvltg`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet: walletAddress })
        });
        const data = await res.json();
        if (data.error) return alert(data.error);
        
        pvltg = 0; 
        updateUI();
        loadOnChainBalances();
        alert("Withdrawal Complete! Converted assets dispatched directly to your personal crypto wallet.");
    }

    updateUI();
    initializeEnergyTracking();
</script>
</body>
</html>
