<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-bg: var(--tg-theme-bg-color, #0f141c); --tg-text: var(--tg-theme-text-color, #fff); --accent: #00ff66; }
        body { background: var(--tg-bg); color: var(--tg-text); font-family: sans-serif; margin: 0; overflow: hidden; }
        
        /* Layout */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 20px; display: flex; justify-content: space-between; font-weight: bold; }
        .main-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Mining Circle */
        .tap-circle { width: 200px; height: 200px; background: radial-gradient(#00ff66, #054019); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 3rem; box-shadow: 0 0 50px rgba(0,255,102,0.3); }
        
        /* Bottom Dock */
        .dock { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 20px; border-top: 1px solid #333; }
        button { padding: 10px; border-radius: 12px; border: none; background: #222; color: white; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--accent); color: #000; }
        
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>Points: <span id="pts">0</span></div>
        <div>gPVLT: <span id="gpvlt">0</span></div>
        <div>PVLT: <span id="pvlt">0</span></div>
    </div>

    <div class="main-view">
        <div class="tap-circle" onclick="mine()">🐸</div>
    </div>

    <div class="dock">
        <button onclick="showModal('swap')">Swap</button>
        <button onclick="showModal('convert')">Convert</button>
        <button class="btn-main" onclick="buyTokens()">Buy</button>
    </div>
</div>

<div id="swap-modal" class="modal">
    <h3>Swap Points to gPVLT</h3>
    <p>10 Points = 0.1 gPVLT</p>
    <button onclick="execSwap()" class="btn-main">Confirm Swap</button>
    <button onclick="hideModals()">Close</button>
</div>

<script>
    let pts = 0, gpvlt = 0, pvlt = 0;
    const tg = window.Telegram.WebApp;
    tg.expand();

    function mine() {
        pts++;
        document.getElementById('pts').textContent = pts;
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function showModal(id) { document.getElementById(`${id}-modal`).style.display = 'flex'; }
    function hideModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    function execSwap() {
        if(pts >= 10) {
            pts -= 10; gpvlt += 0.1;
            document.getElementById('pts').textContent = pts;
            document.getElementById('gpvlt').textContent = gpvlt.toFixed(2);
            hideModals();
        }
    }

    function buyTokens() {
        tg.MainButton.setText("Connect Wallet");
        tg.MainButton.show();
        // Integration point for TON Connect
    }
</script>
</body>
</html>
