<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { background: #111827; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .container { width: 90%; max-width: 400px; text-align: center; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 40px; }
        .tap-btn { width: 200px; height: 200px; border-radius: 50%; border: none; background: #374151; color: #3b82f6; font-size: 24px; font-weight: bold; cursor: pointer; margin-bottom: 30px; }
        .action-btn { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: none; background: #10b981; color: white; font-weight: bold; cursor: pointer; }
        .progress-bar { width: 100%; height: 20px; background: #374151; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
        .progress { width: 40%; height: 100%; background: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats">
        <div>⚡ <br> 21</div>
        <div>💎 <br> 63</div>
        <div>🌕 <br> 5.00</div>
    </div>

    <button class="tap-btn" onclick="tap()">TAP!</button>

    <button class="action-btn" onclick="disconnect()">Disconnect</button>
    <button class="action-btn" onclick="buyEnergy()">Buy 10,000 Energy (100 PVLT)</button>
    
    <div class="progress-bar"><div class="progress"></div></div>
    
    <button class="action-btn" onclick="convert()">Convert</button>
    <button class="action-btn" onclick="claim()">Claim</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
    // Replace with your logic
    async function tap() { alert("Tapping..."); }
    async function buyEnergy() { alert("Buying..."); }
    async function convert() { alert("Converting..."); }
    async function claim() { alert("Claiming..."); }
    function disconnect() { location.reload(); }
</script>
</body>
</html>
