<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PepeVolt</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  background: radial-gradient(circle at top,#183153 0%,#07111f 75%);
  display:flex;
  flex-direction:column;
  padding:16px;
}

.top-nav{
  display:flex;
  gap:10px;
}

.nav-box{
  flex:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:12px;
  text-align:center;
}

.nav-title{
  font-size:11px;
  color:#9fb2d0;
}

.nav-value{
  font-size:18px;
  font-weight:bold;
  color:white;
}

#connectBtn{
  margin-top:14px;
  width:100%;
  border:none;
  border-radius:18px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg,#00b894,#00cec9);
  cursor:pointer;
}

.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.tap-circle{
  position:relative;
  width:min(60vw,230px);
  height:min(60vw,230px);
  border-radius:50%;
  background: radial-gradient(circle at 30% 30%,#00d2a8,#00a884);
  border:8px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 70px rgba(0,255,180,0.25);
  cursor:pointer;
  overflow:hidden;
}

.tap-circle img{
  width:80%;
  object-fit:contain;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.action-btn{
  padding:16px;
  border:none;
  border-radius:18px;
  color:white;
  font-weight:bold;
}

.buy{
  background:linear-gradient(135deg,#00b894,#00cec9);
}

.claim{
  background:linear-gradient(135deg,#ffb347,#ff7b54);
}

.float{
  position:fixed;
  color:white;
  font-weight:bold;
  animation:floatUp 1s linear forwards;
  pointer-events:none;
  z-index:999;
}

@keyframes floatUp{
  0%{
    opacity:1;
    transform:translateY(0);
  }
  100%{
    opacity:0;
    transform:translateY(-70px);
  }
}

/* HIDE WEB3MODAL BUTTON */
w3m-button{
  position:fixed;
  opacity:0;
  pointer-events:none;
  z-index:-999;
}

</style>

<!-- OFFICIAL WALLETCONNECT -->
<script type="module" src="https://unpkg.com/@web3modal/html@2.7.1/dist/index.js"></script>

</head>

<body>

<div class="app">

  <div class="top-nav">

    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">100</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">💎 Points</div>
      <div class="nav-value" id="points">0</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>

  </div>

  <button id="connectBtn">Connect Wallet</button>

  <div class="center">

    <div class="tap-circle" id="tapBtn">

      <img src="https://i.imgur.com/8Km9tLL.png">

    </div>

  </div>

  <div class="actions">

    <button class="action-btn buy">
      Buy 10000 Energy
    </button>

    <button class="action-btn claim">
      Claim PVLT
    </button>

  </div>

</div>

<!-- REAL WALLETCONNECT BUTTON -->
<w3m-button></w3m-button>

<script type="module">

import {
  EthereumClient,
  w3mConnectors,
  w3mProvider
} from "https://unpkg.com/@web3modal/ethereum@2.7.1"

import {
  Web3Modal
} from "https://unpkg.com/@web3modal/html@2.7.1"

import {
  configureChains,
  createConfig
} from "https://unpkg.com/@wagmi/core@1.4.13"

import {
  mainnet
} from "https://unpkg.com/@wagmi/core@1.4.13/chains"

const chains = [mainnet]

const projectId =
"1731f99148b9cf6107dee70b6efb14b7"

const { publicClient } = configureChains(
  chains,
  [w3mProvider({ projectId })]
)

const wagmiConfig = createConfig({
  autoConnect:true,
  connectors:w3mConnectors({
    projectId,
    chains
  }),
  publicClient
})

const ethereumClient =
new EthereumClient(
  wagmiConfig,
  chains
)

new Web3Modal(
  {
    projectId,
    walletImages:{
      trust:
      "https://trustwallet.com/assets/images/media/assets/TWT.png"
    },
    themeMode:"dark",
    themeVariables:{
      "--w3m-accent":"#00b894"
    }
  },
  ethereumClient
)

const connectBtn =
document.getElementById("connectBtn")

connectBtn.onclick = () => {

  const realBtn =
  document.querySelector("w3m-button")

  const shadowBtn =
  realBtn.shadowRoot.querySelector("button")

  shadowBtn.click()

}

/* AUTO UPDATE CONNECT BUTTON */

setInterval(()=>{

  const text =
  document.querySelector("w3m-button")
    ?.shadowRoot
    ?.textContent
    ?.trim()

  if(
    text &&
    text.length > 6 &&
    !text.includes("Connect")
  ){
    connectBtn.innerText = text
  }

},1000)

/* TAP GAME */

let energy = 100
let points = 0
let pvlt = 0

const energyEl =
document.getElementById("energy")

const pointsEl =
document.getElementById("points")

const pvltEl =
document.getElementById("pvlt")

document.getElementById("tapBtn")
.onclick = (e)=>{

  const connected =
  connectBtn.innerText !== "Connect Wallet"

  if(!connected){
    alert("Connect Wallet First")
    return
  }

  if(energy <= 0){
    alert("No Energy")
    return
  }

  energy--
  points++

  if(points >= 1000){

    pvlt += Math.floor(points / 1000)

    points = points % 1000

  }

  energyEl.innerText = energy
  pointsEl.innerText = points
  pvltEl.innerText = pvlt

  const f =
  document.createElement("div")

  f.className = "float"
  f.innerText = "+1 Point"

  f.style.left = e.clientX + "px"
  f.style.top = e.clientY + "px"

  document.body.appendChild(f)

  setTimeout(()=>{
    f.remove()
  },1000)

}

/* ENERGY REGEN */

setInterval(()=>{

  if(energy < 100){

    energy++

    energyEl.innerText = energy

  }

},5000)

</script>

</body>
</html>
