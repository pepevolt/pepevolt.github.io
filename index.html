<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PVLT Tap Game</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020b18;
font-family:Arial,sans-serif;
color:white;
touch-action: manipulation;
}

body{
display:flex;
flex-direction:column;
}

.topbar{
width:100%;
padding:14px 18px;
background:#091426;
display:flex;
justify-content:space-between;
font-size:14px;
font-weight:bold;
}

.main{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow-y:auto;
}

.tapBtn{
width:240px;
height:240px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#00ff99,#00ccff);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 30px rgba(0,255,180,0.25);
}

.tapBtn:active{
transform:scale(0.97);
}

.card{
width:100%;
max-width:380px;
margin-top:28px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:18px;
display:flex;
flex-direction:column;
gap:14px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#0c1628;
color:white;
}

.actionBtn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
font-weight:bold;
cursor:pointer;
}

.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(2,11,24,0.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
}

.modal-overlay.active{
opacity:1;
pointer-events:auto;
}

.modal-box{
background:#091426;
padding:24px;
border-radius:20px;
max-width:340px;
width:90%;
text-align:center;
}

</style>

</head>

<body>

<div class="topbar">
<div>🔋 <span id="energy">50</span></div>
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="pvltg">0</span></div>
</div>

<div class="main">

<button class="tapBtn" onclick="tap()">
Tap
</button>

<div class="card">

<input id="walletInput" placeholder="Connect Wallet" readonly>

<button class="actionBtn" onclick="connectWallet()">
CONNECT WALLET
</button>

<button class="actionBtn" onclick="openBuyModal()">
BUY ENERGY
</button>

</div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="buyModal">
<div class="modal-box">

<h3>Buy Energy</h3>

<p>100,000 Energy for 100 PVLT</p>

<button onclick="executeEnergyPurchase()">
CONFIRM
</button>

<button onclick="closeBuyModal()">
CANCEL
</button>

</div>
</div>

<script>

/* ================= CONFIG ================= */

const API = "https://pvlt-server.onrender.com";
const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";

const PVLT_TOKEN_ADDRESS =
"0xC096dB70Fa05255b210Be58Ec2508Bed61e8dfD6";

const GAME_TREASURY_ADDRESS =
"0xe2bb81bD8e36367F2C85c89F0B03570dFCaf5D57";

let web3Provider;
let wallet = "";

/* ================= WALLET CONNECT FIX ================= */

async function connectWallet(){

try{

let provider;

if(window.ethereum){

await window.ethereum.request({
method:"eth_requestAccounts"
});

provider = window.ethereum;

}else{

const WalletConnectProvider =
window["@walletconnect/ethereum-provider"].EthereumProvider;

/* 🔥 FIXED CONFIG */
const wcProvider = await WalletConnectProvider.init({

projectId: PROJECT_ID,
chains: [137],
showQrModal: true,

metadata: {
name: "PVLT Tap Game",
description: "Telegram Mini App",
url: window.location.origin,
icons: ["https://walletconnect.com/walletconnect-logo.png"]
}

});

/* 🔥 FIX TIMEOUT WRAPPER */
await Promise.race([
wcProvider.connect(),
new Promise((_, reject)=>
setTimeout(()=>reject(new Error("Wallet connect timeout")), 30000)
)
]);

provider = wcProvider;
}

web3Provider = new ethers.providers.Web3Provider(provider);

const signer = web3Provider.getSigner();
wallet = await signer.getAddress();

document.getElementById("walletInput").value =
wallet.slice(0,6)+"..."+wallet.slice(-4);

}catch(err){

console.error(err);
alert("Wallet connection failed or cancelled");

}

}

/* ================= MODAL ================= */

function openBuyModal(){
document.getElementById("buyModal").classList.add("active");
}

function closeBuyModal(){
document.getElementById("buyModal").classList.remove("active");
}

/* ================= BUY ENERGY ================= */

async function executeEnergyPurchase(){

try{

const signer = web3Provider.getSigner();

const contract = new ethers.Contract(
PVLT_TOKEN_ADDRESS,
["function transfer(address,uint256)"],
signer
);

const amount =
ethers.utils.parseUnits("100", 18);

const tx = await contract.transfer(
GAME_TREASURY_ADDRESS,
amount
);

await tx.wait();

alert("Success");

closeBuyModal();

}catch(err){

console.error(err);

alert("Transaction failed");

}

}

/* ================= TAP ================= */

async function tap(){
if(!wallet) return alert("Connect wallet");
}

</script>

</body>
</html>
