<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PVLT Tap Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
}

body{
display:flex;
flex-direction:column;
}

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow:hidden;
}

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:25px;

font-size:28px;
font-weight:bold;

background:linear-gradient(135deg,#00ff99,#00ccff);
color:black;
}

.tap:active{
transform:scale(0.96);
}

.card{
width:90%;
max-width:360px;
margin-top:15px;
padding:15px;

background:rgba(255,255,255,0.05);
border-radius:14px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>

</head>

<body>

<!-- NAV -->
<div class="nav">

<div>🔋 <span id="energy">50</span></div>
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0.0000</span></div>

</div>

<!-- MAIN -->
<div class="container">

<div class="small">
Free Energy: 50 | Buy for more via PVLT token contract
</div>

<button class="tap" onclick="tap()">TAP</button>

<!-- WALLET -->
<div class="card">

<input id="walletInput" placeholder="Paste BSC wallet">

<button onclick="toggleWallet()">
CONNECT WALLET
</button>

</div>

<!-- ENERGY BUY -->
<div class="card">

<div class="small">
Buy Energy = Paid via PVLT Token (REAL CONTRACT)
</div>

<button onclick="buyEnergy()">
BUY ENERGY (REFILL)
</button>

</div>

<!-- CLAIM -->
<div class="card">

<button onclick="claim()">
CLAIM TOKENS
</button>

</div>

</div>

<script>

/* ================= STATE ================= */

let wallet = "";
let points = 0;

/* FREE ENERGY */
let energy = 50;
const MAX_FREE_ENERGY = 50;

/* ================= TAP ================= */

function tap(){

if(!wallet){
alert("Connect wallet");
return;
}

if(energy <= 0){
alert("Buy energy");
return;
}

energy--;
points++;

updateUI();

}

/* ================= ENERGY BUY (REAL CONTRACT HOOK) ================= */

async function buyEnergy(){

if(!wallet){
alert("Connect wallet first");
return;
}

/*
🔴 REAL WEB3 LOGIC PLACEHOLDER:

Here you will integrate:

1. PVLT Token Contract (REAL)
2. approve()
3. transferFrom()
4. backend verification OR direct tx

Example flow:
- user pays PVLT tokens
- backend confirms tx hash
- energy is refilled
*/

alert(
"🔋 Energy purchase initiated\n\n" +
"Payment: PVLT Token Contract\n" +
"Wallet: " + wallet + "\n\n" +
"After blockchain confirmation → Energy refilled"
);

/* simulate instant refill for UI */
energy = MAX_FREE_ENERGY;

updateUI();

}

/* ================= STORAGE ================= */

function saveData(){
if(!wallet) return;

localStorage.setItem(wallet, JSON.stringify({
points: points
}));
}

function loadData(addr){

let data = localStorage.getItem(addr);

if(data){
points = JSON.parse(data).points || 0;
}else{
points = 0;
}

}

/* ================= UI ================= */

function updateUI(){

document.getElementById("energy").innerText = energy;
document.getElementById("points").innerText = points;

document.getElementById("tokens").innerText =
(points / 10000).toFixed(4);

}

/* ================= WALLET ================= */

function toggleWallet(){

const input=document.getElementById("walletInput");

if(wallet){

wallet="";
points=0;
energy=50;

input.value="";

updateUI();

return;
}

let w=input.value.trim();

if(!w.startsWith("0x")||w.length!==42){
alert("Invalid wallet");
return;
}

wallet=w.toLowerCase();

loadData(wallet);

updateUI();

}

/* ================= CLAIM ================= */

function claim(){

if(!wallet){
alert("Connect wallet");
return;
}

let tokens = points / 10000;

/* RULES */
if(tokens < 100){
alert("Min 100 tokens required");
return;
}

if(tokens > 500){
tokens = 500;
}

/* RESET AFTER CLAIM */
points = 0;

saveData();
updateUI();

alert(
"CLAIM SUCCESS\nTokens: " + tokens.toFixed(4)
);

}

/* ================= INIT ================= */

updateUI();

</script>

</body>
</html>
