<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVLT DApp</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>

<body style="background:#111;color:white;text-align:center;font-family:Arial">

<h2>PVLT ECOSYSTEM</h2>

<button onclick="connect()">CONNECT</button>

<p>Energy: <span id="e">-</span></p>
<p>Points: <span id="p">-</span></p>

<button onclick="tap()">TAP</button>
<button onclick="convert()">CONVERT</button>

<script>

const GAME = "YOUR_GAME_ADDRESS";
let provider, signer, game, user;

async function connect() {

    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    user = await signer.getAddress();

    game = new ethers.Contract(GAME, [
        "function players(address) view returns (uint256 energy,uint256 points,uint256 lastTap,uint256 stake,uint256 joined,uint256 nonce,uint256 risk)",
        "function tap(uint256 nonce)",
        "function convertPoints()",
        "function refillEnergy() payable"
    ], signer);

    load();
}

async function load() {
    const p = await game.players(user);
    document.getElementById("e").innerText = p.energy;
    document.getElementById("p").innerText = p.points;
}

async function tap() {
    const p = await game.players(user);
    const tx = await game.tap(p.nonce);
    await tx.wait();
    load();
}

async function convert() {
    const tx = await game.convertPoints();
    await tx.wait();
    load();
}

</script>

</body>
</html>
