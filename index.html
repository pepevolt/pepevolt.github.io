<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,user-scalable=no"
/>

<title>PEPE VOLT</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container{
    padding:20px;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid #00ff99;
    margin-top:20px;
}

h1{
    color:#00ff99;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:20px;
    margin-top:20px;
}

.points{
    font-size:50px;
    color:#00ff99;
    font-weight:bold;
    margin-top:10px;
}

.tap{

    width:220px;
    height:220px;

    border:none;
    border-radius:50%;

    background:#00ff99;
    color:black;

    font-size:35px;
    font-weight:bold;

    margin-top:20px;
}

.tap:active{
    transform:scale(0.95);
}

.info{
    margin-top:15px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.5;
}

.row{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.box{
    flex:1;
    background:#111827;
    padding:15px;
    border-radius:15px;
}

.green{
    color:#00ff99;
}

.footer{
    margin-top:20px;
    color:#64748b;
    font-size:12px;
}

</style>

</head>

<body>

<div class="container">

<img
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Bitmap_VS_SVG.svg"
>

<h1>PEPE VOLT</h1>

<div style="font-size:12px;color:#94a3b8;">
0xa263d765b897b4777f0ad4a938d12d79e789ffff
</div>

<div class="card">

<h2>Tap To Earn</h2>

<div
class="points"
id="points"
>
0
</div>

<button
class="tap"
id="tapBtn"
>
⚡ TAP
</button>

<div class="info">
1 Tap = 1 Point
<br>
1000 Points = 1 PVLT
<br>
3 Seconds Inactive = Reset Current Points
</div>

</div>

<div class="row">

<div class="box">

<h3 class="green">
Global
</h3>

<div id="globalPoints">
0
</div>

</div>

<div class="box">

<h3 class="green">
PVLT
</h3>

<div id="tokenBalance">
0
</div>

</div>

</div>

<div class="card">

<h2>BNB Value</h2>

<div
class="points"
style="font-size:28px;"
id="bnbValue"
>
0
</div>

</div>

<div class="footer">
PEPE VOLT Telegram Mini App
</div>

</div>

<script>

var points = 0;

var globalPoints = 0;

var timer;

function loadData(){

    var saved =
    localStorage.getItem("pvlt_global");

    if(saved){

        globalPoints =
        parseInt(saved);

    }

    updateUI();
}

function updateUI(){

    document.getElementById("points")
    .innerHTML = points;

    document.getElementById("globalPoints")
    .innerHTML = globalPoints;

    var tokens =
    globalPoints / 1000;

    document.getElementById("tokenBalance")
    .innerHTML =
    tokens.toFixed(4);

    var bnb =
    tokens * 0.000000001;

    document.getElementById("bnbValue")
    .innerHTML =
    bnb.toFixed(12) + " BNB";

    localStorage.setItem(
        "pvlt_global",
        globalPoints
    );
}

function tapGame(){

    points++;

    globalPoints++;

    updateUI();

    clearTimeout(timer);

    timer = setTimeout(function(){

        points = 0;

        updateUI();

    },3000);
}

document
.getElementById("tapBtn")
.addEventListener(
"click",
tapGame
);

loadData();

</script>

</body>
</html>
