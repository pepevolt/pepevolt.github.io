<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect Wallet Example</title>
</head>
<body>

    <button id="connect-button">Connect Wallet</button>

    <script type="module">
        import { createWeb3Modal, defaultConfig } from 'https://cdn.jsdelivr.net/npm/@web3modal/ethers@latest/+esm'

        // 1. Get Project ID from https://cloud.walletconnect.com/
        const projectId = '1731f99148b9cf6107dee70b6efb14b7'

        // 2. Define chains
        const mainnet = {
            chainId: 1,
            name: 'Ethereum',
            currency: 'ETH',
            explorerUrl: 'https://etherscan.io',
            rpcUrl: 'https://cloudflare-eth.com'
        }

        // 3. Create Modal
        const modal = createWeb3Modal({
            ethersConfig: defaultConfig({ metadata: { name: 'My App', description: 'Web3 App', url: 'https://mywebsite.com', icons: [] } }),
            chains: [mainnet],
            projectId
        })

        // 4. Attach event to button
        document.getElementById('connect-button').addEventListener('click', () => {
            modal.open()
        })
    </script>
</body>
</html>
