<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PepeVolt | Tap to Earn PVLT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
body{font-family:'Inter',system-ui,sans-serif;background:#03060c;min-height:100vh;display:flex;justify-content:center;align-items:center;}
.app{width:100%;max-width:440px;min-height:100vh;background:radial-gradient(circle at 30% 0%,#13223f 0%,#03060c 90%);padding:20px 16px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:rgba(10,20,35,0.7);backdrop-filter:blur(8px);border:1px solid rgba(0,255,200,0.3);border-radius:16px;padding:10px 5px;text-align:center;}
.stat-label{font-size:10px;color:#8aaee0;margin-bottom:5px;}
.stat-value{font-size:20px;font-weight:bold;color:white;font-family:monospace;}
.energy-bar{background:rgba(0,0,0,0.5);border-radius:10px;height:8px;margin-bottom:20px;overflow:hidden;}
.energy-fill{background:linear-gradient(90deg,#46c9b0,#00ffd5);width:100%;height:100%;transition:width 0.3s;}
.progress-card{background:rgba(10,20,35,0.7);border-radius:16px;padding:12px;margin-bottom:20px;text-align:center;}
.progress-bar{background:rgba(255,255,255,0.1);border-radius:10px;height:6px;margin:8px 0;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,#ffd966,#f5b042);width:0%;height:100%;transition:width 0.3s;}
button{width:100%;border:none;border-radius:44px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:12px;transition:transform 0.1s;}
button:active{transform:scale(0.97);}
button:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(95deg,#46c9b0,#1d9b87);color:white;}
.btn-warning{background:linear-gradient(95deg,#ffd966,#f5b042);color:#0a1a22;}
.btn-danger{background:linear-gradient(95deg,#ef4444,#dc2626);color:white;}
.tap-area{display:flex;justify-content:center;margin:20px 0;}
.pepe{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#00ebbc,#008f74);border:4px solid rgba(255,255,255,0.3);display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform 0.05s;}
.pepe:active{transform:scale(0.95);}
.pepe img{width:120px;pointer-events:none;}
.status{background:rgba(0,0,0,0.5);border-radius:12px;padding:10px;margin:10px 0;font-size:11px;color:#b9d0ff;text-align:center;}
.info{font-size:10px;text-align:center;color:#4f699b;margin-top:15px;}
.loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:white;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.energy-text{font-size:11px;color:#46c9b0;margin-top:5px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
<div class="app">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">⚡ ENERGY</div><div class="stat-value" id="energyVal">50</div><div class="energy-text" id="energyTimer"></div></div>
    <div class="stat-card"><div class="stat-label">🎯 POINTS</div><div class="stat-value" id="pointsVal">0/100</div></div>
    <div class="stat-card"><div class="stat-label">💎 GAME PVLT</div><div class="stat-value" id="gamePvltVal">0</div></div>
    <div class="stat-card"><div class="stat-label">💼 WALLET</div><div class="stat-value" id="walletVal">0</div></div>
  </div>
  <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
  <div class="progress-card"><div>🎯 PROGRESS TO NEXT PVLT</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div id="progressText">0/100 points = 0 GAME PVLT</div></div>
  <button id="connectBtn" class="btn-primary">🦊 CONNECT WALLET (POLYGON)</button>
  <div class="status" id="statusMsg">🔒 Connect wallet to start</div>
  <div class="tap-area"><div class="pepe" id="tapBtn"><img src="https://i.imgur.com/8Km9tLL.png" alt="PEPE"></div></div>
  <button id="buyBtn" class="btn-warning" disabled>⚡ BUY 1000 ENERGY (100 PVLT)</button>
  <button id="claimBtn" class="btn-primary" disabled>💎 CLAIM GAME PVLT → WALLET</button>
  <div class="info">🏆 100 points = 1 GAME PVLT | Energy regens every 15s | Tapping is FREE!</div>
</div>
<script>
  // ============ YOUR NEW CONTRACT ADDRESSES ============
  const PVLT_ADDR = "0x80E6f64635E4627bA54E1939624E6111A3d8917c";
  const GAME_ADDR = "0x6FA81DC0eA8545216D923D994C92f511cd9cfBbA";
  const TREASURY_ADDR = "0x0760aA32F1DfC7B82252deD7d5A9D39c13F76668";
  
  const PVLT_ABI = ["function balanceOf(address) view returns (uint256)","function approve(address,uint256) returns (bool)","function allowance(address,address) view returns (uint256)","function decimals() view returns (uint8)","function transfer(address,uint256) returns (bool)"];
  const GAME_ABI = ["function buyEnergy() external","function claimRewards() external","function getPlayer(address) view returns (uint256,uint256,uint256,uint256)"];
  const TREASURY_ABI = ["function getBalance() view returns (uint256)"];

  const connectBtn = document.getElementById("connectBtn");
  const tapBtn = document.getElementById("tapBtn");
  const buyBtn = document.getElementById("buyBtn");
  const claimBtn = document.getElementById("claimBtn");
  const energyVal = document.getElementById("energyVal");
  const energyFill = document.getElementById("energyFill");
  const energyTimer = document.getElementById("energyTimer");
  const pointsVal = document.getElementById("pointsVal");
  const gamePvltVal = document.getElementById("gamePvltVal");
  const walletVal = document.getElementById("walletVal");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const statusMsg = document.getElementById("statusMsg");

  let account = null, provider, signer, pvltContract, gameContract, treasuryContract;
  let decimals = 18, energy = 50, points = 0, gamePvlt = 0, walletBalance = 0, lastRegen = Date.now(), refreshTimer = null;

  function log(msg) { console.log(msg); statusMsg.innerHTML = msg; }
  function saveGame() { if(account) localStorage.setItem(`pvlt_${account}`, JSON.stringify({energy, points, gamePvlt, lastRegen})); }
  function loadGame() {
    if(account) {
      const saved = localStorage.getItem(`pvlt_${account}`);
      if(saved) { const d = JSON.parse(saved); energy = d.energy ?? 50; points = d.points ?? 0; gamePvlt = d.gamePvlt ?? 0; lastRegen = d.lastRegen ?? Date.now(); }
      if(energy > 50) energy = 50;
    }
    updateUI();
  }
  async function updateWallet() {
    if(!account || !pvltContract) { walletBalance = 0; return; }
    try { const bal = await pvltContract.balanceOf(account); walletBalance = parseFloat(ethers.utils.formatUnits(bal, decimals)); } catch(e) { walletBalance = 0; }
  }
  async function checkTreasury() {
    if(!treasuryContract) return;
    try { const bal = await treasuryContract.getBalance(); const balNum = parseFloat(ethers.utils.formatUnits(bal, decimals)); log(`💰 Treasury: ${balNum.toFixed(2)} PVLT`); if(balNum < 10) log(`⚠️ Send PVLT to treasury: ${TREASURY_ADDR}`); } catch(e) {}
  }
  function updateUI() {
    energyVal.innerText = Math.floor(energy);
    let pct = (energy / 50) * 100; if(pct > 100) pct = 100;
    energyFill.style.width = `${pct}%`;
    pointsVal.innerText = `${points}/100`;
    const progPct = (points / 100) * 100;
    progressFill.style.width = `${progPct}%`;
    progressText.innerText = `${points}/100 points = ${(points/100).toFixed(2)} GAME PVLT`;
    gamePvltVal.innerText = gamePvlt.toFixed(4);
    walletVal.innerText = walletBalance.toFixed(4);
    if(account) { buyBtn.disabled = (walletBalance < 100); claimBtn.disabled = (gamePvlt < 1); }
    if(energy < 50) { const secSince = Math.floor((Date.now() - lastRegen) / 1000); const left = 15 - (secSince % 15); energyTimer.innerText = `next +1 in ${left}s`; } else { energyTimer.innerText = "⚡ full"; }
  }
  function regenEnergy() {
    if(!account) return;
    const now = Date.now();
    const secPassed = Math.floor((now - lastRegen) / 1000);
    if(secPassed >= 15 && energy < 50) { const add = Math.min(Math.floor(secPassed / 15), 50 - energy); if(add > 0) { energy = Math.min(energy + add, 50); lastRegen = now; saveGame(); updateUI(); } }
  }
  function tap() {
    if(!account) { log("🔒 Connect first!"); return; }
    if(energy <= 0) { log("❌ No energy! Wait or buy more!"); return; }
    energy--; points++;
    if(points >= 100) { const earned = Math.floor(points / 100); gamePvlt += earned; points = points % 100; log(`🎉 +${earned} GAME PVLT!`); }
    updateUI(); saveGame();
  }
  async function buyEnergy() {
    if(!account) { alert("Connect first"); return; }
    if(walletBalance < 100) { alert(`❌ Need 100 PVLT. You have ${walletBalance.toFixed(2)} PVLT`); return; }
    try {
      log("⏳ Approving 100 PVLT...");
      const amount = ethers.utils.parseUnits("100", decimals);
      const approveTx = await pvltContract.approve(GAME_ADDR, amount);
      await approveTx.wait();
      log("✅ Approved!");
      log("⏳ Buying 1000 energy...");
      const tx = await gameContract.buyEnergy();
      await tx.wait();
      log("✅ +1000 Energy!");
      energy = Math.min(energy + 1000, 50);
      saveGame();
      await updateWallet();
      updateUI();
    } catch(e) { log(`❌ Error: ${e.message.slice(0,80)}`); alert("Failed: " + e.message.slice(0,100)); }
  }
  async function claimRewards() {
    if(!account) { alert("Connect first"); return; }
    if(gamePvlt < 1) { alert("❌ Need at least 1 GAME PVLT to claim!"); return; }
    
    const toClaim = Math.floor(gamePvlt);
    
    try {
      log(`⏳ Claiming ${toClaim} GAME PVLT...`);
      // claimRewards takes NO parameter in your Game.sol
      const tx = await gameContract.claimRewards();
      await tx.wait();
      log(`✅ Claimed ${toClaim} PVLT!`);
      gamePvlt = 0;
      saveGame();
      await updateWallet();
      updateUI();
      await checkTreasury();
    } catch(e) {
      log(`❌ Claim error: ${e.message.slice(0,80)}`);
      alert("Claim failed: " + e.message.slice(0,100));
    }
  }
  async function connectWallet() {
    if(!window.ethereum) { alert("❌ Install MetaMask!"); return; }
    try {
      connectBtn.innerHTML = '<span class="loading"></span> CONNECTING...';
      connectBtn.disabled = true;
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      account = accounts[0];
      provider = new ethers.providers.Web3Provider(window.ethereum);
      signer = provider.getSigner();
      const network = await provider.getNetwork();
      if(network.chainId !== 137) {
        log("⚠️ Please switch to Polygon Mainnet");
        try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] }); } catch(e) { alert("Switch to Polygon Mainnet manually"); throw new Error("Wrong network"); }
      }
      pvltContract = new ethers.Contract(PVLT_ADDR, PVLT_ABI, signer);
      gameContract = new ethers.Contract(GAME_ADDR, GAME_ABI, signer);
      treasuryContract = new ethers.Contract(TREASURY_ADDR, TREASURY_ABI, provider);
      decimals = await pvltContract.decimals();
      loadGame();
      await updateWallet();
      await checkTreasury();
      updateUI();
      connectBtn.innerHTML = `🔴 DISCONNECT ${account.slice(0,6)}...${account.slice(-4)}`;
      connectBtn.classList.add("btn-danger");
      connectBtn.classList.remove("btn-primary");
      log("✅ Connected! Tap to earn!");
      if(refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(async () => { if(account) { regenEnergy(); await updateWallet(); updateUI(); } }, 1000);
      window.ethereum.on('accountsChanged', (accs) => { if(accs.length === 0) disconnect(); else if(accs[0] !== account) window.location.reload(); });
    } catch(e) { log(`❌ Connection error: ${e.message.slice(0,80)}`); alert("Connection failed"); account = null; connectBtn.innerHTML = "🦊 CONNECT WALLET (POLYGON)"; connectBtn.classList.remove("btn-danger"); connectBtn.classList.add("btn-primary"); } finally { connectBtn.disabled = false; }
  }
  function disconnect() {
    if(refreshTimer) clearInterval(refreshTimer);
    saveGame();
    account = null;
    connectBtn.innerHTML = "🦊 CONNECT WALLET (POLYGON)";
    connectBtn.classList.remove("btn-danger");
    connectBtn.classList.add("btn-primary");
    energy = 50; points = 0; gamePvlt = 0; walletBalance = 0;
    updateUI();
    log("🔒 Disconnected");
  }
  connectBtn.onclick = () => account ? disconnect() : connectWallet();
  tapBtn.onclick = () => tap();
  tapBtn.ontouchstart = (e) => { e.preventDefault(); tap(); };
  buyBtn.onclick = buyEnergy;
  claimBtn.onclick = claimRewards;
  updateUI();
  log("🎮 Ready! Connect wallet to start");
</script>
</body>
</html>
