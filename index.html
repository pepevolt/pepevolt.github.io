<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tap Game</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .nav { display: flex; gap: 20px; padding: 20px; }
        .tap-area { width: 200px; height: 200px; background: orange; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-top: 50px; box-shadow: 0 0 20px orange; }
        .controls { margin-top: 30px; display: flex; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="nav">
    <div>Energy: <span id="energy">50</span>/50</div>
    <div>Points: <span id="points">0</span></div>
    <div>PVLT: <span id="pvlt">0</span></div>
    <button id="connectBtn">Connect Wallet</button>
</div>

<div class="tap-area" id="tapButton">TAP</div>

<div class="controls">
    <button onclick="buyEnergy()">Buy 10k Energy (100 PVLT)</button>
    <button onclick="claimPvlt()">Claim PVLT</button>
</div>

<script>
    let energy = 50;
    let points = 0;
    let pvlt = 0;

    // Energy Refill Logic (50 per 3 seconds)
    setInterval(() => {
        if (energy < 50) {
            energy = Math.min(energy + 1, 50);
            document.getElementById('energy').innerText = energy;
        }
    }, 60); // 3000ms / 50 steps = 60ms

    // Tap Logic
    document.getElementById('tapButton').addEventListener('click', () => {
        if (energy > 0) {
            energy--;
            points++;
            if (points >= 100) {
                points -= 100;
                pvlt++;
            }
            document.getElementById('energy').innerText = energy;
            document.getElementById('points').innerText = points;
            document.getElementById('pvlt').innerText = pvlt;
        }
    });

    function buyEnergy() {
        if (pvlt >= 100) {
            pvlt -= 100;
            energy += 10000;
            document.getElementById('pvlt').innerText = pvlt;
            document.getElementById('energy').innerText = energy;
            alert("Energy purchased!");
        } else {
            alert("Not enough PVLT!");
        }
    }

    function claimPvlt() {
        if (pvlt >= 10) {
            alert("Claiming " + pvlt + " PVLT to your wallet...");
            // Integrate Web3.js here to trigger smart contract transaction
        } else {
            alert("Minimum 10 PVLT required to claim.");
        }
    }
</script>
</body>
</html>
