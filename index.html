<!DOCTYPE html>
<html>
<head>
    <title>PepeVolt Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@reown/appkit@latest"></script>
</head>
<body>
    <appkit-button></appkit-button>
    <div id="game">
        <button onclick="tapGame()">TAP!</button>
        <p id="status"></p>
    </div>

    <script>
        // Initialize Reown/AppKit here (as per Reown documentation)
        const GAME_ADDRESS = "YOUR_CONTRACT_ADDRESS";
        
        async function tapGame() {
            // Use ethers.js to call the 'tap()' function on your contract
            // Then, send a notification to your backend
            await fetch('https://your-render-app.onrender.com/log-tap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: "USER_ADDRESS" })
            });
        }
    </script>
</body>
</html>
