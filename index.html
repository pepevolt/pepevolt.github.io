<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0b0f1a;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* SAFE AREA SUPPORT (iPhone notch fix) */
body{
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.stat{
  flex:1;
  text-align:center;
  font-size:12px;
  opacity:0.9;
}

.stat b{
  display:block;
  font-size:14px;
  margin-top:2px;
  color:#fff;
}

/* WALLET */
.wallet{
  text-align:center;
  padding:10px 12px;
  font-size:12px;
  opacity:0.8;
}

/* MAIN AREA */
.main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* TAP CIRCLE */
.circle{
  width:min(260px, 70vw);
  height:min(260px, 70vw);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #ff00cc, #3a2fff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  user-select:none;
  box-shadow:0 0 50px rgba(255,0,200,0.25);
  transition:transform 0.08s ease;
}

.circle:active{
  transform:scale(0.95);
}

/* BOTTOM */
.bottom{
  padding:16px;
  display:flex;
  justify-content:center;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  font-size:14px;
  background:#ffffff10;
  color:white;
  backdrop-filter: blur(10px);
}

button:active{
  transform:scale(0.97);
}
</style>
</head>

<body>

<!-- TOP STATS -->
<div class="topbar">
  <div class="stat">⚡ Energy <b id="energy">50</b></div>
  <div class="stat">⭐ Points <b id="points">0</b></div>
  <div class="stat">🪙 PVLT <b id="pvlt">0</b></div>
</div>

<!-- WALLET -->
<div class="wallet">
  <button onclick="connectWallet()">Connect Wallet</button>
  <div id="walletAddress">Not Connected</div>
</div>

<!-- TAP AREA -->
<div class="main">
  <div class="circle" onclick="tap()">TAP</div>
</div>

<!-- CLAIM -->
<div class="bottom">
  <button onclick="claim()">Claim Rewards</button>
</div>

<script>
let energy = 50;
let points = 0;
let pvlt = 0;

let signer, user;

const contractAddress = "YOUR_CONTRACT_ADDRESS";
const abi = [
"function reward(address to, uint amount) external"
];

function updateUI(){
  document.getElementById("energy").innerText = energy;
  document.getElementById("points").innerText = points;
  document.getElementById("pvlt").innerText = pvlt;
}

function tap(){
  if(energy <= 0) return;

  energy--;
  points++;

  updateUI();
}

/* ENERGY REGEN */
setInterval(()=>{
  if(energy < 50){
    energy++;
    updateUI();
  }
}, 3000);

/* WALLET */
async function connectWallet(){
  if(!window.ethereum){
    alert("Install MetaMask");
    return;
  }

  const provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);

  signer = provider.getSigner();
  user = await signer.getAddress();

  document.getElementById("walletAddress").innerText =
    user.slice(0,6)+"..."+user.slice(-4);
}

/* CLAIM */
async function claim(){
  if(!signer) return alert("Connect wallet first");

  const contract = new ethers.Contract(contractAddress, abi, signer);

  let tokens = Math.floor(points / 100);
  if(tokens <= 0) return alert("Not enough points");

  try{
    const tx = await contract.reward(user, tokens);
    await tx.wait();

    pvlt += tokens;
    points = 0;

    updateUI();
    alert("Claimed "+tokens+" PVLT");
  }catch(e){
    alert("Transaction failed");
  }
}

updateUI();
</script>

</body>
</html>
