<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PVLT Tap Game</title>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>

    <style>
        /* ================= RESET ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020b18;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* ================= BODY ================= */
        body {
            display: flex;
            flex-direction: column;
        }

        /* ================= TOP BAR ================= */
        .topbar {
            width: 100%;
            padding: 14px 18px;
            background: #091426;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        /* ================= MAIN ================= */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        /* ================= TAP BUTTON ================= */
        .tapBtn {
            width: 240px;
            height: 240px;
            border: none;
            border-radius: 50%;
            overflow: hidden;
            margin-top: 20px;
            background: linear-gradient(135deg, #00ff99, #00ccff);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 255, 180, 0.25);
            cursor: pointer;
        }

        .tapBtn:active {
            transform: scale(0.96);
        }

        .tapBtn img {
            width: 78%;
            height: 78%;
            object-fit: contain;
            pointer-events: none;
        }

        /* ================= CARD ================= */
        .card {
            width: 100%;
            max-width: 380px;
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ================= INPUT ================= */
        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #0c1628;
            color: white;
            font-size: 14px;
            outline: none;
        }

        /* ================= BUTTON ================= */
        .actionBtn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff99, #00ccff);
            color: black;
            cursor: pointer;
        }

        /* ================= STATUS ================= */
        .status {
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
            display: none;
        }

        /* ================= INFO BOX ================= */
        .info {
            margin-top: 16px;
            font-size: 12px;
            line-height: 1.7;
            opacity: 0.8;
            text-align: center;
            max-width: 380px;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div>🔋 <span id="energy">50</span></div>
        <div>⚡ <span id="points">0</span></div>
        <div>💎 <span id="pvltg">0.0000</span></div>
    </div>

    <div class="main">
        <button class="tapBtn" onclick="tap()">
            <img src="images/IMG_1850.png" alt="Tap Target">
        </button>

        <div class="card">
            <input id="walletInput" placeholder="Connect Polygon Wallet" readonly>

            <button class="actionBtn" id="walletBtn" onclick="connectWallet()">
                CONNECT WALLET
            </button>

            <div class="status" id="walletStatus">
                Wallet Connected
            </div>

            <button class="actionBtn" onclick="buyEnergy()">
                BUY ENERGY
            </button>

            <button class="actionBtn" onclick="swapPoints()">
                SWAP POINTS → PVLTG
            </button>

            <button class="actionBtn" onclick="claimPVLT()">
                CLAIM PVLT
            </button>
        </div>

        <div class="info">
            1 Tap = 1 Point<br>
            10000 Points = 1 PVLTG<br>
            100 PVLTG = 1 PVLT
        </div>
    </div>

    <script>
        /* ================= CONFIG ================= */
        const API = "https://pvlt-server.onrender.com";
        const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";

        /* ================= STATE ================= */
        let web3Provider; 
        let wallet = "";
        let points = 0;
        let energy = 50;
        let pvltg = 0;

        /* ================= UPDATE UI ================= */
        function updateUI(){
            document.getElementById("energy").innerText = energy;
            document.getElementById("points").innerText = points;
            document.getElementById("pvltg").innerText = Number(pvltg).toFixed(4);
        }

        /* ================= CONNECT WALLET ================= */
        async function connectWallet(){
            try {
                // 1. Check if user is opening this inside a native Web3 wallet browser
                if (typeof window.ethereum !== 'undefined') {
                    console.log("In-app Web3 browser detected.");
                    await window.ethereum.request({ method: "eth_requestAccounts" });
                    web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                } 
                // 2. Fallback to WalletConnect if they are on Safari/Chrome/Telegram standard UI
                else {
                    console.log("Standard browser detected. Initializing WalletConnect...");
                    const WalletConnectProvider = window["@walletconnect/ethereum-provider"].EthereumProvider;
                    
                    const wcProvider = await WalletConnectProvider.init({
                        projectId: PROJECT_ID,
                        chains: [137], // Polygon Mainnet
                        showQrModal: true,
                        optionalMethods: [
                            "eth_sendTransaction",
                            "eth_signTransaction",
                            "personal_sign",
                            "eth_signTypedData",
                            "eth_signTypedData_v4"
                        ],
                        qrModalOptions: { themeMode: "dark" }
                    });

                    // Trigger mobile workflow connection modal
                    await wcProvider.connect();
                    web3Provider = new ethers.providers.Web3Provider(wcProvider);
                }

                // 3. Extract the signer and user address
                const signer = web3Provider.getSigner();
                wallet = await signer.getAddress();

                /* DISPLAY ADDRESS */
                document.getElementById("walletInput").value =
                    wallet.substring(0,6) + "..." + wallet.substring(wallet.length - 4);

                /* UPDATE BUTTONS */
                document.getElementById("walletBtn").innerText = "CONNECTED";
                document.getElementById("walletStatus").style.display = "block";

                /* REGISTER / FETCH USER FROM RENDER BACKEND */
                const res = await fetch(API + "/user", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet })
                });

                const data = await res.json();
                if (data.error) {
                    alert("Server Error: " + data.error);
                    return;
                }

                /* SYNC STATE */
                points = data.points ?? 0;
                energy = data.energy ?? 50;
                pvltg = data.pvltg ?? 0;

                updateUI();

            } catch(err) {
                console.error("Connection detailed error log:", err);
                alert("Wallet connection failed: " + (err.message || JSON.stringify(err)));
            }
        }

        /* ================= TAP ================= */
        async function tap(){
            if(!wallet) return alert("Connect wallet first");

            try{
                const res = await fetch(API + "/tap", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet })
                });
                const data = await res.json();

                if(data.error) return alert(data.error);

                points = data.points;
                energy = data.energy;
                updateUI();
            } catch(err){
                console.error(err);
                alert("Tap failed");
            }
        }

        /* ================= BUY ENERGY ================= */
        async function buyEnergy(){
            if(!wallet) return alert("Connect wallet first");

            try{
                const res = await fetch(API + "/refill", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet })
                });
                const data = await res.json();

                if(data.error) return alert(data.error);

                energy = data.energy;
                updateUI();
                alert("50 Energy Added");
            } catch(err){
                console.error(err);
                alert("Energy purchase failed");
            }
        }

        /* ================= SWAP POINTS ================= */
        async function swapPoints(){
            if(!wallet) return alert("Connect wallet first");

            try{
                const res = await fetch(API + "/swap-points", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet })
                });
                const data = await res.json();

                if(data.error) return alert(data.error);

                points = 0;
                pvltg = data.pvltg;
                updateUI();
                alert("Points swapped to PVLTG");
            } catch(err){
                console.error(err);
                alert("Swap failed");
            }
        }

        /* ================= CLAIM PVLT ================= */
        async function claimPVLT(){
            if(!wallet) return alert("Connect wallet first");
            if(pvltg < 100) return alert("Need minimum 100 PVLTG");

            try{
                const signer = web3Provider.getSigner();
                const pvltgContract = new ethers.Contract(
                    "0x3094Dc50cB01721eE6c0ECAf18bd0D15c154ba2d",
                    ["function approve(address spender,uint256 amount) external returns(bool)"],
                    signer
                );

                const amount = ethers.utils.parseEther(pvltg.toString());
                const approveTx = await pvltgContract.approve(
                    "0xe2bb81bD8e36367F2C85c89F0B03570dFCaf5D57",
                    amount
                );
                await approveTx.wait();

                const res = await fetch(API + "/claim-pvltg", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet })
                });
                const data = await res.json();

                if(data.error) return alert(data.error);

                pvltg = 0;
                updateUI();
                alert("PVLT claimed successfully!\n\nTX:\n" + data.tx);
            } catch(err){
                console.error(err);
                alert("Claim failed");
            }
        }

        /* ================= AUTO REFILL ================= */
        setInterval(()=>{
            if(energy < 50){
                energy += 1;
                updateUI();
            }
        }, 30000);

        /* ================= START ================= */
        updateUI();
    </script>
</body>

</html>
