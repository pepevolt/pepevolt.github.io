<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.6.2/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

.tap{
width:180px;
height:180px;
border-radius:50%;
background:linear-gradient(135deg,#00ff99,#00ccff);
font-size:22px;
font-weight:bold;
border:none;
margin-top:50px;
}

.card{
margin-top:20px;
padding:15px;
background:rgba(255,255,255,0.05);
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#00ff99;
font-weight:bold;
}

</style>

</head>

<body>

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<p>Points: <span id="points">0</span></p>
<p>Tokens: <span id="tokens">0</span></p>
</div>

<div class="card">

<input id="wallet" placeholder="Paste wallet">

<br><br>

<button onclick="connect()">CONNECT</button>

<br><br>

<button onclick="claim()">CLAIM TOKENS</button>

</div>

<script>

let points = 0;

const RATE = 10000;

const contractAddress = "YOUR_CONTRACT_ADDRESS";

const abi = [
"function claim(uint amount) public"
];

let provider, signer, contract;

/* TAP */
function tap(){
points++;
document.getElementById("points").innerText = points;
document.getElementById("tokens").innerText = (points/RATE).toFixed(4);
}

/* CONNECT WALLET */
async function connect(){

if(window.ethereum){

await window.ethereum.request({ method: "eth_requestAccounts" });

provider = new ethers.BrowserProvider(window.ethereum);

signer = await provider.getSigner();

contract = new ethers.Contract(contractAddress, abi, signer);

alert("Wallet connected");

}else{
alert("Install MetaMask / BSC wallet");
}

}

/* CLAIM */
async function claim(){

let tokenAmount = Math.floor(points / RATE);

if(tokenAmount <= 0){
alert("Not enough points");
return;
}

try{

let tx = await contract.claim(tokenAmount);
await tx.wait();

alert("Claim successful");

points = 0;
document.getElementById("points").innerText = 0;
document.getElementById("tokens").innerText = 0;

}catch(e){
alert("Claim failed");
}

}

</script>

</body>
</html>
