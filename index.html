<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PepeVolt - Tap & Earn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }
        .wallet-info {
            background: rgba(0,0,0,0.5);
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .connect-btn, .claim-btn {
            background: #4CAF50;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .connect-btn:active, .claim-btn:active { transform: scale(0.95); }
        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
            margin: 20px 0;
        }
        .tap-area {
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c92a2a);
            width: 250px;
            height: 250px;
            border-radius: 50%;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transition: transform 0.05s linear;
        }
        .tap-area:active { transform: scale(0.97); }
        .pepe-emoji { font-size: 100px; }
        .status { margin-top: 20px; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 10px; font-size: 12px; color: #ccc; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        @media (max-width: 480px) {
            .tap-area { width: 200px; height: 200px; }
            .pepe-emoji { font-size: 80px; }
            .score-display { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="wallet-info">
            <span id="walletAddress">Not Connected</span>
            <button id="connectWallet" class="connect-btn">Connect Wallet</button>
        </div>
        
        <div class="score-display">
            <span id="tapCount">0</span> / <span id="maxTaps">50</span>
        </div>
        
        <div id="tapArea" class="tap-area" style="opacity: 0.5; pointer-events: none;">
            <div class="pepe-emoji">🐸⚡</div>
        </div>
        
        <button id="claimReward" class="claim-btn" disabled>Claim PVLT Tokens</button>
        
        <div class="status" id="statusMsg">
            ⚡ Connect wallet to start tapping
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3wallet@1.9.0/dist/index.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
