<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PepeVolt ⚡ | Web3 WalletConnect</title>
<!-- WalletConnect SDK -->
<script src="https://cdn.jsdelivr.net/npm/@walletconnect/modal-sign-react@2.0.0/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3wallet@1.10.0/dist/index.umd.js"></script>
<!-- Ethers for blockchain interactions -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
    background: radial-gradient(circle at 20% 30%, #0a0f1f, #03060f);
    color: #ffffff;
  }

  /* Main App Container */
  .app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    backdrop-filter: blur(2px);
  }

  /* GLASS TOP NAVIGATION */
  .top-nav {
    width: 100%;
    padding: 18px 20px 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: rgba(8, 18, 32, 0.55);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .stats {
    flex: 1;
    display: flex;
    gap: 12px;
  }

  .card {
    flex: 1;
    background: rgba(17, 27, 46, 0.7);
    backdrop-filter: blur(4px);
    border-radius: 28px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(255, 215, 0, 0.2);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    transition: all 0.2s ease;
  }

  .card:hover {
    border-color: rgba(250, 204, 21, 0.5);
    background: rgba(25, 40, 65, 0.8);
  }

  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
    opacity: 0.7;
    margin-bottom: 6px;
  }

  .value {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #FFF, #facc15);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 8px rgba(250, 204, 21, 0.3);
  }

  #connectBtn {
    border: none;
    background: linear-gradient(105deg, #1e3a5f, #0f2b44);
    backdrop-filter: blur(4px);
    color: #ffea9e;
    padding: 12px 22px;
    border-radius: 60px;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.8px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(250, 204, 21, 0.4);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #connectBtn:active {
    transform: scale(0.96);
  }

  /* wallet address badge */
  .wallet-badge {
    background: #22c55e20;
    border-radius: 60px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid #22c55e50;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* CENTER TAP ZONE */
  .center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding-bottom: 140px;
  }

  .tap-area {
    width: 270px;
    height: 270px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #facc15, #ea580c, #b91c1c);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 42px;
    font-weight: 900;
    font-family: monospace;
    letter-spacing: 3px;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 0 35px rgba(234, 88, 12, 0.7), 0 0 90px rgba(249, 115, 22, 0.4), inset 0 5px 20px rgba(255, 240, 150, 0.7);
    transition: transform 0.06s linear, box-shadow 0.1s;
    text-shadow: 0 2px 8px black;
    border: 2px solid rgba(255, 215, 0, 0.7);
  }

  .tap-area:active {
    transform: scale(0.93);
    box-shadow: 0 0 45px #f97316, inset 0 2px 12px gold;
  }

  .tap-disabled {
    opacity: 0.55;
    pointer-events: none;
    filter: grayscale(0.2);
    box-shadow: 0 0 15px rgba(100, 100, 100, 0.4);
  }

  /* FLOATING +1 ANIMATION */
  .float {
    position: absolute;
    color: #facc15;
    font-size: 32px;
    font-weight: 900;
    text-shadow: 0 0 6px #ff7b00;
    pointer-events: none;
    z-index: 200;
    filter: drop-shadow(0 0 6px gold);
    animation: floatUp 0.85s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
  }

  @keyframes floatUp {
    0% {
      opacity: 1;
      transform: translateY(0px) scale(0.8);
    }
    40% {
      opacity: 1;
      transform: translateY(-35px) scale(1.2);
    }
    100% {
      opacity: 0;
      transform: translateY(-110px) scale(0.5);
    }
  }

  .float-pvlt {
    color: #c084fc;
    text-shadow: 0 0 6px #a855f7;
    font-size: 26px;
    font-weight: bold;
  }

  /* BOTTOM FIXED PANEL */
  .bottom-fixed {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(8, 20, 35, 0.85);
    backdrop-filter: blur(20px);
    padding: 18px 22px 28px 22px;
    border-top: 1px solid rgba(250, 204, 21, 0.25);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .energy-section {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 60px;
    padding: 8px 16px;
  }

  .energy-bar {
    width: 100%;
    height: 20px;
    background: #1e2a3e;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: inset 0 1px 4px #00000055;
  }

  .energy-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #facc15, #f97316, #ef4444);
    border-radius: 40px;
    transition: width 0.25s ease-out;
    box-shadow: 0 0 6px #ffb347;
  }

  .energy-text {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    opacity: 0.85;
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .regen-badge {
    background: #22c55e20;
    padding: 2px 10px;
    border-radius: 30px;
    font-size: 11px;
    border: 0.5px solid #22c55e60;
  }

  .action-buttons {
    width: 100%;
    display: flex;
    gap: 14px;
  }

  .action-buttons button {
    flex: 1;
    height: 56px;
    border: none;
    border-radius: 44px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    background: rgba(20, 30, 50, 0.9);
    backdrop-filter: blur(4px);
    color: #fff5e0;
    border: 1px solid rgba(250, 204, 21, 0.4);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
  }

  .action-buttons button:active {
    transform: scale(0.96);
  }

  .buy-btn {
    background: linear-gradient(115deg, #1e3a8a, #2b4f9e);
    border-bottom: 2px solid #60a5fa;
  }

  .claim-btn {
    background: linear-gradient(115deg, #6b21a5, #9333ea);
    border-bottom: 2px solid #d8b4fe;
  }

  .toast-msg {
    position: fixed;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293bdd;
    backdrop-filter: blur(16px);
    color: #facc15;
    padding: 10px 20px;
    border-radius: 60px;
    font-size: 14px;
    font-weight: 600;
    z-index: 300;
    border: 1px solid #facc15;
    box-shadow: 0 6px 20px black;
    pointer-events: none;
    animation: fadeUp 1.2s forwards;
  }

  @keyframes fadeUp {
    0% {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
    }
    15% {
      opacity: 1;
      transform: translateX(-50%) translateY(0px);
    }
    85% {
      opacity: 1;
      transform: translateX(-50%) translateY(0px);
    }
    100% {
      opacity: 0;
      transform: translateX(-50%) translateY(-25px);
    }
  }

  @media (max-width: 560px) {
    .tap-area {
      width: 220px;
      height: 220px;
      font-size: 34px;
    }
    .top-nav {
      flex-direction: column;
      align-items: stretch;
    }
    .stats {
      width: 100%;
    }
    #connectBtn {
      width: 100%;
      justify-content: center;
    }
    .value {
      font-size: 20px;
    }
    .action-buttons button {
      height: 50px;
      font-size: 13px;
    }
    .bottom-fixed {
      padding: 14px 16px 22px;
    }
  }
</style>
</head>
<body>

<div class="app">
  <div class="top-nav">
    <div class="stats">
      <div class="card">
        <div class="label">⚡ ENERGY</div>
        <div class="value">
          <span id="energy">50</span> / <span id="maxEnergy">50</span>
        </div>
      </div>
      <div class="card">
        <div class="label">💎 POINTS</div>
        <div class="value">
          <span id="points">0</span>
        </div>
      </div>
      <div class="card">
        <div class="label">🐸 PVLT</div>
        <div class="value">
          <span id="pvlt">0</span>
        </div>
      </div>
    </div>
    <button id="connectBtn">
      🔌 CONNECT WALLET
    </button>
  </div>

  <div class="center">
    <div class="tap-area tap-disabled" id="tapButton">
      ⚡ TAP ⚡
    </div>
  </div>
</div>

<div class="bottom-fixed">
  <div class="energy-section">
    <div class="energy-bar">
      <div class="energy-fill" id="energyFill"></div>
    </div>
    <div class="energy-text">
      <span>🔋 Recharge</span>
      <span class="regen-badge">+1 / 3s</span>
      <span>⚡ Max: <span id="maxEnergyLabel">50</span></span>
    </div>
  </div>
  <div class="action-buttons">
    <button class="buy-btn" id="buyEnergyBtn">💰 BUY 10K ENERGY</button>
    <button class="claim-btn" id="claimPvltBtn">🎁 CLAIM PVLT</button>
  </div>
</div>

<script>
  // -------------------- GAME STATE --------------------
  let connected = false;
  let maxEnergy = 50;
  let energy = 50;
  let points = 0;
  let pvlt = 0;
  let userWalletAddress = null;
  let web3Provider = null;
  let signer = null;

  // DOM Elements
  const energySpan = document.getElementById("energy");
  const maxEnergySpan = document.getElementById("maxEnergy");
  const pointsSpan = document.getElementById("points");
  const pvltSpan = document.getElementById("pvlt");
  const energyFillDiv = document.getElementById("energyFill");
  const tapButton = document.getElementById("tapButton");
  const connectBtn = document.getElementById("connectBtn");
  const buyBtn = document.getElementById("buyEnergyBtn");
  const claimBtn = document.getElementById("claimPvltBtn");
  const maxEnergyLabelSpan = document.getElementById("maxEnergyLabel");

  // Helper: update UI
  function updateUI() {
    energySpan.innerText = Math.floor(energy);
    maxEnergySpan.innerText = Math.floor(maxEnergy);
    pointsSpan.innerText = Math.floor(points);
    pvltSpan.innerText = Math.floor(pvlt);
    maxEnergyLabelSpan.innerText = Math.floor(maxEnergy);
    let percent = (energy / maxEnergy) * 100;
    if (percent < 0) percent = 0;
    if (percent > 100) percent = 100;
    energyFillDiv.style.width = percent + "%";
  }

  // Show toast notifications
  function showToast(message, isError = false) {
    const toast = document.createElement("div");
    toast.className = "toast-msg";
    toast.innerText = message;
    if (isError) toast.style.color = "#ffb347";
    toast.style.background = "#0f172ae6";
    toast.style.border = isError ? "1px solid #f97316" : "1px solid #facc15";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  // Floating animation
  function showFloatingText(text, x, y, isPVLT = false) {
    const floatEl = document.createElement("div");
    floatEl.className = "float";
    if (isPVLT) floatEl.classList.add("float-pvlt");
    floatEl.innerText = text;
    floatEl.style.left = x + "px";
    floatEl.style.top = y + "px";
    document.body.appendChild(floatEl);
    setTimeout(() => floatEl.remove(), 850);
  }

  // -------------------- WALLETCONNECT INTEGRATION --------------------
  let web3wallet = null;
  let session = null;
  let walletConnectInitialized = false;

  async function initWalletConnect() {
    if (walletConnectInitialized) return;
    try {
      // Project ID from user
      const projectId = "1731f99148b9cf6107dee70b6efb14b7";
      
      // Create Web3Wallet client
      const { Web3Wallet } = window;
      if (!Web3Wallet) {
        console.warn("Web3Wallet not loaded, fallback to ethers modal?");
        showToast("Loading WalletConnect... retry", true);
        return;
      }
      
      web3wallet = await Web3Wallet.init({
        projectId: projectId,
        metadata: {
          name: "PepeVolt",
          description: "Tap to earn PVLT tokens",
          url: window.location.origin,
          icons: ["https://walletconnect.com/walletconnect-logo.png"]
        }
      });
      
      walletConnectInitialized = true;
      console.log("WalletConnect client ready");
      
      // Check for existing session
      const sessions = web3wallet.getActiveSessions();
      const sessionValues = Object.values(sessions);
      if (sessionValues.length > 0) {
        session = sessionValues[0];
        await onWalletConnected(session);
      }
    } catch (err) {
      console.error("WalletConnect init error:", err);
      showToast("Failed to init WalletConnect SDK", true);
    }
  }

  async function onWalletConnected(wcSession) {
    try {
      const accounts = wcSession.namespaces.eip155?.accounts;
      if (!accounts || accounts.length === 0) throw new Error("No accounts");
      const address = accounts[0].split(":")[2];
      userWalletAddress = address;
      connected = true;
      
      // Update UI
      connectBtn.innerHTML = `🟢 ${address.slice(0,6)}...${address.slice(-4)}`;
      connectBtn.style.background = "linear-gradient(105deg, #2b5a3a, #166534)";
      tapButton.classList.remove("tap-disabled");
      
      // Setup ethers provider for potential future transactions
      if (window.ethereum) {
        web3Provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = web3Provider.getSigner();
      }
      
      showToast(`Wallet connected: ${address.slice(0,6)}...${address.slice(-4)}`, false);
      updateUI();
    } catch (err) {
      console.error("Connection error:", err);
      showToast("Connection failed", true);
    }
  }

  async function connectWithWalletConnect() {
    if (!walletConnectInitialized) {
      await initWalletConnect();
      if (!web3wallet) {
        showToast("WalletConnect SDK still loading, try again", true);
        return;
      }
    }
    
    try {
      // Required chains: Ethereum mainnet, Polygon, BSC etc.
      const requiredNamespaces = {
        eip155: {
          methods: ["eth_sendTransaction", "eth_sign", "personal_sign"],
          chains: ["eip155:1", "eip155:137", "eip155:56"],
          events: ["chainChanged", "accountsChanged"]
        }
      };
      
      const { uri, approval } = await web3wallet.connect({
        requiredNamespaces
      });
      
      if (uri) {
        // Open WalletConnect modal (Web3Modal style with QR code)
        // We'll create a simple floating modal since we are not using external lib.
        showWalletConnectModal(uri);
      }
      
      // Wait for session approval
      session = await approval();
      await onWalletConnected(session);
      closeWalletConnectModal();
    } catch (err) {
      console.error("Connection rejected or error:", err);
      closeWalletConnectModal();
      showToast("Connection cancelled or error", true);
    }
  }

  // Modal for QR code (WalletConnect style)
  let modalOverlay = null;
  function showWalletConnectModal(uri) {
    if (modalOverlay) closeWalletConnectModal();
    modalOverlay = document.createElement("div");
    modalOverlay.style.position = "fixed";
    modalOverlay.style.top = "0";
    modalOverlay.style.left = "0";
    modalOverlay.style.width = "100%";
    modalOverlay.style.height = "100%";
    modalOverlay.style.backgroundColor = "rgba(0,0,0,0.85)";
    modalOverlay.style.backdropFilter = "blur(8px)";
    modalOverlay.style.zIndex = "10000";
    modalOverlay.style.display = "flex";
    modalOverlay.style.flexDirection = "column";
    modalOverlay.style.alignItems = "center";
    modalOverlay.style.justifyContent = "center";
    modalOverlay.style.fontFamily = "sans-serif";
    
    const modalCard = document.createElement("div");
    modalCard.style.backgroundColor = "#111827";
    modalCard.style.borderRadius = "32px";
    modalCard.style.padding = "24px";
    modalCard.style.maxWidth = "340px";
    modalCard.style.width = "90%";
    modalCard.style.textAlign = "center";
    modalCard.style.border = "1px solid #facc15";
    modalCard.style.boxShadow = "0 25px 40px black";
    
    const title = document.createElement("h3");
    title.innerText = "WalletConnect";
    title.style.color = "#facc15";
    title.style.marginBottom = "16px";
    modalCard.appendChild(title);
    
    const qrContainer = document.createElement("div");
    qrContainer.id = "walletconnect-qr";
    qrContainer.style.display = "flex";
    qrContainer.style.justifyContent = "center";
    qrContainer.style.margin = "16px 0";
    modalCard.appendChild(qrContainer);
    
    // Generate QR code using embedded library or fallback
    // We'll use a simple QR code lib via CDN
    if (window.QRCode) {
      new QRCode(qrContainer, {
        text: uri,
        width: 220,
        height: 220,
        colorDark: "#facc15",
        colorLight: "#1f2937",
        correctLevel: QRCode.CorrectLevel.M
      });
    } else {
      const qrText = document.createElement("p");
      qrText.innerText = "Scan with WalletConnect app:";
      qrText.style.color = "white";
      qrContainer.appendChild(qrText);
      const uriSpan = document.createElement("span");
      uriSpan.innerText = uri.slice(0, 40) + "...";
      uriSpan.style.fontSize = "12px";
      uriSpan.style.wordBreak = "break-all";
      uriSpan.style.color = "#aaa";
      qrContainer.appendChild(uriSpan);
    }
    
    const instruction = document.createElement("p");
    instruction.innerText = "Open WalletConnect compatible wallet & scan QR";
    instruction.style.fontSize = "13px";
    instruction.style.marginTop = "12px";
    instruction.style.color = "#cbd5e1";
    modalCard.appendChild(instruction);
    
    const closeBtn = document.createElement("button");
    closeBtn.innerText = "Cancel";
    closeBtn.style.marginTop = "20px";
    closeBtn.style.background = "#ef4444";
    closeBtn.style.border = "none";
    closeBtn.style.padding = "10px 20px";
    closeBtn.style.borderRadius = "40px";
    closeBtn.style.fontWeight = "bold";
    closeBtn.style.color = "white";
    closeBtn.style.cursor = "pointer";
    closeBtn.onclick = () => {
      closeWalletConnectModal();
      if (web3wallet) web3wallet.disconnectSession?.();
    };
    modalCard.appendChild(closeBtn);
    
    modalOverlay.appendChild(modalCard);
    document.body.appendChild(modalOverlay);
    
    // Dynamically load QRCode if not present
    if (typeof QRCode === "undefined") {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";
      script.onload = () => {
        if (modalOverlay && uri) {
          const container = document.getElementById("walletconnect-qr");
          if (container) {
            container.innerHTML = "";
            new QRCode(container, {
              text: uri,
              width: 220,
              height: 220,
              colorDark: "#facc15",
              colorLight: "#1f2937"
            });
          }
        }
      };
      document.head.appendChild(script);
    }
  }
  
  function closeWalletConnectModal() {
    if (modalOverlay) {
      modalOverlay.remove();
      modalOverlay = null;
    }
  }
  
  // Connect button handler: open WalletConnect modal
  connectBtn.onclick = async () => {
    if (connected) {
      showToast(`Already connected: ${userWalletAddress?.slice(0,6)}...`, false);
      return;
    }
    await connectWithWalletConnect();
  };
  
  // -------------------- TAP MECHANICS --------------------
  function getTapCoords(e) {
    let clientX, clientY;
    if (e.touches) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    return { x: clientX, y: clientY };
  }
  
  function handleTap(e) {
    if (!connected) {
      showToast("🔌 Connect wallet first to earn PVLT", true);
      return;
    }
    if (energy <= 0) {
      showToast("💔 No Energy! Wait or buy more.", true);
      return;
    }
    energy--;
    points++;
    let pvltEarned = 0;
    if (points >= 100) {
      pvltEarned = Math.floor(points / 100);
      pvlt += pvltEarned;
      points = points % 100;
    }
    updateUI();
    const coords = getTapCoords(e);
    showFloatingText("+1 ⚡", coords.x, coords.y, false);
    if (pvltEarned > 0) {
      showFloatingText(`+${pvltEarned} 🐸 PVLT`, coords.x - 20, coords.y - 35, true);
    }
    tapButton.style.transform = "scale(0.93)";
    setTimeout(() => { if (tapButton) tapButton.style.transform = ""; }, 80);
  }
  
  tapButton.addEventListener("click", handleTap);
  tapButton.addEventListener("touchstart", (e) => { e.preventDefault(); handleTap(e); });
  
  // Energy regen
  setInterval(() => {
    if (connected && energy < maxEnergy) {
      energy = Math.min(energy + 1, maxEnergy);
      updateUI();
    }
  }, 3000);
  
  // Buy energy
  function buyEnergy() {
    if (!connected) { showToast("Connect wallet first", true); return; }
    if (pvlt < 100) { showToast(`Need 100 PVLT (you have ${Math.floor(pvlt)})`, true); return; }
    pvlt -= 100;
    energy += 10000;
    maxEnergy += 10000;
    updateUI();
    showToast(`✨ +10,000 ENERGY! Max increased!`, false);
    const rect = tapButton.getBoundingClientRect();
    showFloatingText("💥 +10k ENERGY", rect.left + rect.width/2, rect.top + rect.height/2, false);
  }
  
  function claimPvlt() {
    if (!connected) { showToast("Connect wallet to claim", true); return; }
    if (pvlt < 10) { showToast(`Need at least 10 PVLT. Current: ${Math.floor(pvlt)}`, true); return; }
    const claimedAmount = Math.floor(pvlt);
    showToast(`🎉 Claimed ${claimedAmount} PVLT tokens to wallet! 🎉`, false);
    pvlt = 0;
    updateUI();
    const rect = claimBtn.getBoundingClientRect();
    showFloatingText(`🎁 +${claimedAmount} PVLT`, rect.left + rect.width/2, rect.top - 10, true);
  }
  
  buyBtn.addEventListener("click", buyEnergy);
  claimBtn.addEventListener("click", claimPvlt);
  
  // Initialize WalletConnect on page load
  initWalletConnect();
  updateUI();
  tapButton.classList.add("tap-disabled");
  
  // Disable context menu on tap area
  tapButton.addEventListener("contextmenu", (e) => e.preventDefault());
  
  // Final CSS additional
  const style = document.createElement("style");
  style.textContent = `.tap-area { transition: transform 0.05s cubic-bezier(0.1, 1.2, 0.5, 1), box-shadow 0.1s; }`;
  document.head.appendChild(style);
</script>
