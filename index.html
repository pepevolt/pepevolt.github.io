<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>PVLT Tap Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
}

button,input{
font-size:16px;
touch-action:manipulation;
}

body{
display:flex;
flex-direction:column;
}

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow:hidden;
}

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:30px;

font-size:28px;
font-weight:bold;

background:linear-gradient(135deg,#00ff99,#00ccff);
color:black;
}

.tap:active{
transform:scale(0.96);
}

.card{
width:90%;
max-width:360px;
margin-top:15px;
padding:15px;

background:rgba(255,255,255,0.05);
border-radius:14px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>

</head>

<body>

<!-- NAV -->
<div class="nav">
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0.0000</span></div>
<div>🔋 <span id="energy">50</span></div>
<div>👤 <span id="walletView">guest</span></div>
</div>

<!-- MAIN -->
<div class="container">

<button class="tap" onclick="tap()">TAP</button>

<div class="small">Energy capped at 50 (free regen)</div>

<div class="card">

<input id="walletInput" placeholder="Paste BSC wallet">

<button onclick="toggleWallet()">
CONNECT WALLET
</button>

</div>

<div class="card">

<div class="small">
Buy Energy = Paid via PVLT Token Contract
</div>

<button onclick="buyEnergy()">
BUY ENERGY (RECHARGE)
</button>

</div>

</div>

<script>

/* ================= STATE ================= */

let wallet="";
let points=0;

let energy=50;
const MAX_ENERGY=50;

/* ================= ENERGY REGEN ================= */

setInterval(()=>{

if(energy < MAX_ENERGY){
energy += 1;
document.getElementById("energy").innerText = energy;
}

},4000);

/* ================= TAP ================= */

function tap(){

if(!wallet){
alert("Connect wallet");
return;
}

if(energy <= 0){
alert("No energy");
return;
}

energy -= 1;
points += 1;

updateUI();

}

/* ================= BUY ENERGY ================= */

function buyEnergy(){

if(!wallet){
alert("Connect wallet first");
return;
}

/*
REAL WEB3 PLACEHOLDER:
Here you will call your token contract:
- approve()
- transferFrom()
- or direct pay function
*/

alert(
"Energy purchase initiated\n\n" +
"Cost: Paid in PVLT Token\n" +
"Wallet: " + wallet
);

/* instant refill */
energy = MAX_ENERGY;

updateUI();

}

/* ================= WALLET ================= */

function toggleWallet(){

const input=document.getElementById("walletInput");
const view=document.getElementById("walletView");

if(wallet){

wallet="";
points=0;
energy=50;

input.value="";

view.innerText="guest";

updateUI();

return;
}

let w=input.value.trim();

if(!w.startsWith("0x")||w.length!==42){
alert("Invalid wallet");
return;
}

wallet=w.toLowerCase();

view.innerText=
wallet.slice(0,6)+"..."+wallet.slice(-4);

}

/* ================= UI ================= */

function updateUI(){

document.getElementById("points").innerText=points;
document.getElementById("tokens").innerText=(points/10000).toFixed(4);
document.getElementById("energy").innerText=energy;

}

</script>

</body>
</html>
