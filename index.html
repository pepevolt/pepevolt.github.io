<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt UI</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .tap-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #77b897 50%, #4a4f56 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            margin: 40px 0;
            cursor: pointer;
            user-select: none;
        }

        .main-container {
            background-color: #1a1f26;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
            font-weight: 600;
        }

        .secondary-btn {
            background-color: #2d3748;
            color: #a0aec0;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            margin: 8px 0;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="tap-circle" onclick="console.log('Tapped!')">TAP!</div>

    <button class="btn" style="max-width: 320px;">Connect Wallet</button>
    
    <div class="main-container">
        <button class="secondary-btn">Buy</button>
        <button class="secondary-btn">Convert</button>
        <button class="secondary-btn">Claim</button>
    </div>

</body>
</html>
