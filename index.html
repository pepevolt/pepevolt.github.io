<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt | Tap & Earn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .stat-card { background: #1e293b; border: 1px solid #334155; }
        .tap-circle { 
            width: 280px; height: 280px; 
            background: radial-gradient(circle, #34d399 0%, #10b981 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-weight: bold; font-size: 2rem; transition: transform 0.1s;
        }
        .tap-circle:active { transform: scale(0.95); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4">

    <div class="flex gap-4 w-full max-w-sm mb-8">
        <div class="stat-card flex-1 p-3 rounded-xl text-center">
            <p class="text-[10px] uppercase text-slate-400">Energy</p>
            <p id="energy" class="font-bold">0</p>
        </div>
        <div class="stat-card flex-1 p-3 rounded-xl text-center">
            <p class="text-[10px] uppercase text-slate-400">Points</p>
            <p id="points" class="font-bold">0</p>
        </div>
        <div class="stat-card flex-1 p-3 rounded-xl text-center">
            <p class="text-[10px] uppercase text-slate-400">PVLT</p>
            <p id="pvlt" class="font-bold">0</p>
        </div>
    </div>

    <button onclick="handleAction('tap')" class="tap-circle shadow-[0_0_50px_rgba(16,185,129,0.3)] mb-8">
        TAP!
    </button>

    <button id="connectBtn" class="w-full max-w-sm bg-blue-600 py-4 rounded-xl font-bold mb-6">
        Connect Wallet
    </button>

    <div class="w-full max-w-sm space-y-3">
        <button onclick="handleAction('refillEnergy')" class="w-full bg-slate-800 p-4 rounded-xl border border-slate-700">Refill Energy</button>
        <button onclick="handleAction('convertPoints')" class="w-full bg-slate-800 p-4 rounded-xl border border-slate-700">Convert</button>
        <button onclick="handleAction('claimRewards')" class="w-full bg-slate-800 p-4 rounded-xl border border-slate-700">Claim</button>
    </div>

    <script>
        // Configuration
        const CONTRACT_ADDRESS = "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";
        const ABI = [{"inputs":[],"name":"tap","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"refillEnergy","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"convertPoints","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"players","outputs":[{"internalType":"uint256","name":"energy","type":"uint256"},{"internalType":"uint256","name":"points","type":"uint256"},{"internalType":"uint256","name":"burnedGPVLT","type":"uint256"},{"internalType":"bool","name":"paidUser","type":"bool"},{"internalType":"uint256","name":"lastClaimDay","type":"uint256"}],"stateMutability":"view","type":"function"}];

        let provider, signer, contract;

        document.getElementById('connectBtn').onclick = async () => {
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
            document.getElementById('connectBtn').innerText = "Wallet Connected";
            updateStats();
        };

        async function updateStats() {
            if (!contract) return;
            const addr = await signer.getAddress();
            const stats = await contract.players(addr);
            document.getElementById('energy').innerText = stats.energy.toString();
            document.getElementById('points').innerText = stats.points.toString();
        }

        async function handleAction(fn) {
            if (!contract) return alert("Connect Wallet first!");
            try {
                const tx = await contract[fn]();
                await tx.wait();
                updateStats();
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
