<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PepeVolt</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* APP */

.app{

  width:100%;
  max-width:430px;

  height:100vh;
  height:100dvh;

  background:
  radial-gradient(circle at top,#183153 0%,#07111f 75%);

  display:flex;
  flex-direction:column;

  padding:
  max(16px, env(safe-area-inset-top))
  16px
  max(16px, env(safe-area-inset-bottom));

  overflow:hidden;
}

/* TOP NAV */

.top-nav{

  width:100%;

  display:flex;
  gap:10px;

  margin-top:5px;
}

.nav-box{

  flex:1;

  background:rgba(255,255,255,0.05);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:18px;

  padding:12px 8px;

  text-align:center;
}

.nav-title{

  font-size:11px;

  color:#9fb2d0;

  margin-bottom:6px;
}

.nav-value{

  font-size:18px;
  font-weight:bold;

  color:white;
}

/* CONNECT */

.wallet-wrap{

  width:100%;

  margin-top:16px;
}

#connectBtn{

  width:100%;

  border:none;
  outline:none;

  border-radius:18px;

  padding:15px;

  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  background:
  linear-gradient(
  135deg,
  #00b894,
  #00cec9
  );
}

#connectBtn:active{
  transform:scale(0.98);
}

/* CENTER */

.center{

  flex:1;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* TAP */

.tap-circle{

  width:min(62vw,240px);
  height:min(62vw,240px);

  border-radius:50%;

  background:
  radial-gradient(
  circle at 30% 30%,
  #ffcc00,
  #ff8800
  );

  border:8px solid white;

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:
  0 0 80px rgba(255,180,0,0.45);

  cursor:pointer;

  user-select:none;
}

.tap-circle:active{
  transform:scale(0.95);
}

.tap-circle img{

  width:30%;
  height:30%;

  pointer-events:none;
}

/* BUTTONS */

.actions{

  width:100%;

  display:flex;
  flex-direction:column;

  gap:12px;
}

.action-btn{

  width:100%;

  border:none;
  outline:none;

  border-radius:18px;

  padding:16px;

  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;
}

.action-btn:active{
  transform:scale(0.98);
}

.buy{
  background:
  linear-gradient(
  135deg,
  #00b894,
  #00cec9
  );
}

.claim{
  background:
  linear-gradient(
  135deg,
  #ffb347,
  #ff7b54
  );
}

/* FLOAT */

.float{

  position:fixed;

  color:white;

  font-weight:bold;

  pointer-events:none;

  z-index:9999;

  animation:floatUp 1s linear forwards;
}

@keyframes floatUp{

  0%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-70px);
  }
}

</style>
</head>

<body>

<div class="app">

  <div class="top-nav">

    <div class="nav-box">

      <div class="nav-title">
        ⚡ Energy
      </div>

      <div
      class="nav-value"
      id="energy">
        100
      </div>

    </div>

    <div class="nav-box">

      <div class="nav-title">
        💎 Points
      </div>

      <div
      class="nav-value"
      id="points">
        0
      </div>

    </div>

    <div class="nav-box">

      <div class="nav-title">
        🪙 PVLT
      </div>

      <div
      class="nav-value"
      id="pvlt">
        0
      </div>

    </div>

  </div>

  <div class="wallet-wrap">

    <button id="connectBtn">
      Connect Wallet
    </button>

  </div>

  <div class="center">

    <div
    class="tap-circle"
    id="tapBtn">

      <img
      src="https://cdn-icons-png.flaticon.com/512/825/825508.png">

    </div>

  </div>

  <div class="actions">

    <button
    class="action-btn buy"
    id="buyBtn">
      Buy 10000 Energy
    </button>

    <button
    class="action-btn claim"
    id="claimBtn">
      Claim PVLT
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<script>

/* ELEMENTS */

const connectBtn =
document.getElementById('connectBtn');

const tapBtn =
document.getElementById('tapBtn');

const buyBtn =
document.getElementById('buyBtn');

const claimBtn =
document.getElementById('claimBtn');

const energyEl =
document.getElementById('energy');

const pointsEl =
document.getElementById('points');

const pvltEl =
document.getElementById('pvlt');

/* GAME STATE */

let connected = false;

let userAddress = '';

let energy = 100;

let points = 0;

let pvlt = 0;

/* CONNECT WALLET */

connectBtn.addEventListener('click', async ()=>{

  try{

    if(!window.ethereum){

      alert('Please Install MetaMask');

      return;
    }

    const accounts =
    await window.ethereum.request({

      method:'eth_requestAccounts'

    });

    userAddress = accounts[0];

    connected = true;

    connectBtn.innerText =
    userAddress.slice(0,6)
    + '...'
    + userAddress.slice(-4);

  }catch(err){

    console.log(err);

    alert('Wallet Connection Failed');

  }

});

/* TAP */

tapBtn.addEventListener('click',(e)=>{

  if(!connected){

    alert('Connect Wallet First');

    return;
  }

  if(energy <= 0){

    alert('No Energy');

    return;
  }

  /* ENERGY */

  energy--;

  /* 1 TAP = 1 Point */

  points++;

  /* AUTO CONVERT */

  if(points >= 100){

    points -= 100;

    pvlt += 1;
  }

  /* UPDATE */

  energyEl.innerText = energy;

  pointsEl.innerText = points;

  pvltEl.innerText = pvlt;

  /* FLOAT */

  const float =
  document.createElement('div');

  float.className = 'float';

  float.innerText = '+1 Point';

  float.style.left =
  e.clientX + 'px';

  float.style.top =
  e.clientY + 'px';

  document.body.appendChild(float);

  setTimeout(()=>{

    float.remove();

  },1000);

});

/* BUY ENERGY */

buyBtn.addEventListener('click',()=>{

  if(!connected){

    alert('Connect Wallet First');

    return;
  }

  if(pvlt < 100){

    alert('Need 100 PVLT');

    return;
  }

  /* COST */

  pvlt -= 100;

  /* REFILL */

  energy += 10000;

  /* UPDATE */

  energyEl.innerText = energy;

  pvltEl.innerText = pvlt;

  alert('+10000 Energy Added');

});

/* CLAIM */

claimBtn.addEventListener('click',()=>{

  if(!connected){

    alert('Connect Wallet First');

    return;
  }

  if(pvlt <= 0){

    alert('No PVLT To Claim');

    return;
  }

  alert(

    pvlt +

    ' PVLT Claimed To Wallet:\n\n'

    + userAddress

  );

  /* RESET */

  pvlt = 0;

  pvltEl.innerText = pvlt;

});

</script>

</body>
</html>
