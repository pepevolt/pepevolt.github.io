<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt UI</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* The Tap Circle */
        .tap-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #77b897 50%, #4a4f56 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            margin: 40px 0;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Buttons and Containers */
        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            border: none;
            width: 100%;
            max-width: 300px;
            margin: 10px 0;
            cursor: pointer;
        }

        .container {
            background-color: #1a1f26;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        .disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="tap-circle" onclick="alert('Tapped!')">TAP!</div>

    <button class="btn">Connect Wallet</button>
    
    <div class="container">
        <p>Balance: Locked</p>
        <button class="btn disabled">Convert 💎 → 1 gPVLT</button>
        <button class="btn disabled">Claim Reward</button>
    </div>

    <div class="container" style="margin-top: 20px;">
        <p>Locked</p>
        <button class="btn disabled">Confirm Refill</button>
    </div>

</body>
</html>
