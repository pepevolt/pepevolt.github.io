<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PEPEVOLT BOT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<style>
body{margin:0;background:#050f1e;color:white;font-family:sans-serif;text-align:center}
button{padding:14px;margin:8px;border-radius:10px;border:none;font-weight:bold}
.connect{background:linear-gradient(90deg,#00ff99,#00ccff)}
.action{background:linear-gradient(90deg,#ffcc00,#ff6600)}
.danger{background:linear-gradient(90deg,#ff3333,#990000)}
input{padding:12px;width:80%;border-radius:10px;text-align:center}
</style>
</head>

<body>

<h2>PEPEVOLT GAME</h2>

<input id="walletDisplay" value="Wallet Not Connected" readonly />

<br>

<button class="connect" onclick="connectWallet()" id="connectBtn">
CONNECT WALLET
</button>

<br>

<button class="action" onclick="buyEnergy()">BUY ENERGY</button>
<button class="action" onclick="swapPoints()">SWAP POINTS</button>
<button class="danger" onclick="withdraw()">WITHDRAW</button>

<script>

let walletAddress = "";
let CONFIG = {};

async function loadConfig(){
  const res = await fetch("/config");
  CONFIG = await res.json();
  console.log("Contracts:", CONFIG);
}

loadConfig();

async function connectWallet(){

  if(walletAddress){
    walletAddress = "";
    document.getElementById("walletDisplay").value = "Wallet Not Connected";
    document.getElementById("connectBtn").innerText = "CONNECT WALLET";
    return;
  }

  if(!window.ethereum){
    alert("Install MetaMask");
    return;
  }

  const provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  const signer = provider.getSigner();

  walletAddress = await signer.getAddress();

  document.getElementById("walletDisplay").value =
    walletAddress.slice(0,6)+"..."+walletAddress.slice(-4);

  document.getElementById("connectBtn").innerText = "DISCONNECT";
}

async function buyEnergy(){
  alert("Would call ENGINE contract: " + CONFIG.engine);
}

async function swapPoints(){
  alert("Would call TOKEN contract: " + CONFIG.token);
}

async function withdraw(){
  alert("Would call TREASURY contract: " + CONFIG.treasury);
}

</script>

</body>
</html>
