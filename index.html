<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PEPEVOLT</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial;
overflow-x:hidden;
}

.topbar{
display:flex;
justify-content:space-around;
padding:15px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:100;
font-size:24px;
font-weight:bold;
}

.panel{
width:92%;
margin:auto;
margin-top:20px;
padding:18px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.08);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.card{
padding:18px;
border-radius:16px;
background:#111;
text-align:center;
}

.tap{
width:250px;
height:250px;
border-radius:50%;
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
margin:40px auto;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 40px rgba(0,255,100,0.2);
transition:0.15s;
}

.tap:active{
transform:scale(0.95);
}

.buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
padding-bottom:40px;
}

button{
padding:14px 24px;
border:none;
border-radius:14px;
font-size:18px;
background:#141414;
color:#fff;
cursor:pointer;
}

.wallet{
text-align:center;
margin-top:10px;
color:#aaa;
word-break:break-all;
}

</style>

</head>

<body>

<div class="topbar">

<div>⚡ <span id="energy">0</span></div>

<div>🪙 <span id="points">0</span></div>

<div>💰 <span id="pvlt">0</span></div>

</div>

<div class="panel">

<h2>PEPEVOLT</h2>

<div class="wallet" id="wallet">
Wallet Not Connected
</div>

<br>

<button onclick="connectWallet()">
Connect Wallet
</button>

<div class="grid">

<div class="card">
Treasury
<br><br>
<span id="treasury">0</span>
</div>

<div class="card">
Burned
<br><br>
<span id="burned">0</span>
</div>

<div class="card">
Revenue
<br><br>
<span id="revenue">0</span>
</div>

<div class="card">
Rewards Paid
<br><br>
<span id="rewards">0</span>
</div>

</div>

</div>

<div class="tap" onclick="tap()">
TAP
</div>

<div class="buttons">

<button onclick="buyEnergy()">
Buy Energy
</button>

<button onclick="convertPoints()">
Convert
</button>

<button onclick="claimRewards()">
Claim
</button>

</div>

<script>

const GAME =
"YOUR_GAME_CONTRACT";

const PVLT =
"YOUR_PVLT_CONTRACT";

const TREASURY =
"YOUR_TREASURY_CONTRACT";

let provider;
let signer;
let user;

const GAME_ABI = [

"function tap() external",

"function buyEnergy() external",

"function convertPoints() external",

"function claimRewards() external",

"function getPlayer(address) view returns(uint256,uint256,uint256,bool,uint256)"

];

const TREASURY_ABI = [

"function treasuryBalance() view returns(uint256)",

"function totalRevenue() view returns(uint256)",

"function totalRewardsPaid() view returns(uint256)",

"function totalBurnedGPVLT() view returns(uint256)"

];

const ERC20_ABI = [

"function balanceOf(address) view returns(uint256)",

"function approve(address,uint256) returns(bool)"

];

async function connectWallet(){

provider =
new ethers.providers.Web3Provider(
window.ethereum
);

await provider.send(
"eth_requestAccounts",
[]
);

signer = provider.getSigner();

user = await signer.getAddress();

document.getElementById("wallet")
.innerHTML = user;

loadData();

}

async function loadData(){

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const treasury =
new ethers.Contract(
TREASURY,
TREASURY_ABI,
signer
);

const pvlt =
new ethers.Contract(
PVLT,
ERC20_ABI,
signer
);

const player =
await game.getPlayer(user);

document.getElementById("energy")
.innerHTML = player[0];

document.getElementById("points")
.innerHTML = player[1];

document.getElementById("burned")
.innerHTML = player[2];

const walletPVLT =
await pvlt.balanceOf(user);

document.getElementById("pvlt")
.innerHTML =
ethers.utils.formatEther(walletPVLT);

document.getElementById("treasury")
.innerHTML =
ethers.utils.formatEther(
await treasury.treasuryBalance()
);

document.getElementById("revenue")
.innerHTML =
ethers.utils.formatEther(
await treasury.totalRevenue()
);

document.getElementById("rewards")
.innerHTML =
ethers.utils.formatEther(
await treasury.totalRewardsPaid()
);

}

async function tap(){

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const tx =
await game.tap();

await tx.wait();

loadData();

}

async function buyEnergy(){

const pvlt =
new ethers.Contract(
PVLT,
ERC20_ABI,
signer
);

await pvlt.approve(
GAME,
ethers.utils.parseEther("100")
);

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const tx =
await game.buyEnergy();

await tx.wait();

loadData();

}

async function convertPoints(){

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const tx =
await game.convertPoints();

await tx.wait();

loadData();

}

async function claimRewards(){

const game =
new ethers.Contract(
GAME,
GAME_ABI,
signer
);

const tx =
await game.claimRewards();

await tx.wait();

loadData();

}

</script>

</body>
</html>
