<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PVLT Web3 Tap</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* BACKGROUND */
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle at top, #0f172a, #020617);
color:white;
text-align:center;
overflow-x:hidden;
}

/* TOP NAV GLASS */
.navbar{
position:fixed;
top:0;left:0;right:0;
height:60px;

display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;

background: rgba(255,255,255,0.05);
backdrop-filter: blur(12px);
border-bottom:1px solid rgba(255,255,255,0.1);

font-size:12px;
z-index:10;
}

/* MAIN */
.container{
padding-top:90px;
}

/* TITLE */
h2{
font-size:22px;
background: linear-gradient(90deg,#00ff99,#00ccff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* TAP BUTTON */
.tap{
width:180px;
height:180px;
border-radius:50%;

background: linear-gradient(135deg,#00ff99,#00ccff);
border:none;

font-size:24px;
font-weight:bold;
color:black;

box-shadow:0 0 30px rgba(0,255,200,0.4);
transition:0.1s;
}

.tap:active{
transform:scale(0.95);
}

/* CARDS */
.card{
margin:15px;
padding:16px;

background: rgba(255,255,255,0.05);
backdrop-filter: blur(10px);

border:1px solid rgba(255,255,255,0.1);
border-radius:14px;
}

/* INPUT */
input{
width:90%;
padding:12px;

border-radius:10px;
border:1px solid rgba(255,255,255,0.1);

background: rgba(0,0,0,0.3);
color:white;
outline:none;
}

/* BUTTON */
button{
padding:12px 18px;
border:none;
border-radius:10px;
margin-top:10px;

background: linear-gradient(90deg,#00ff99,#00ccff);
color:black;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(0.97);
}

/* SMALL TEXT */
small{
opacity:0.7;
}

</style>

</head>

<body>

<div class="navbar">
<div>⚡ Points: <span id="points">0</span></div>
<div>💎 Tokens: <span id="tokens">0</span></div>
<div>👤 ID: <span id="userId">---</span></div>
</div>

<div class="container">

<h2>PVLT WEB3 TAP</h2>
<small>Tap • Earn • Withdraw</small>

<br><br>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<h3>Wallet</h3>
<input id="wallet" placeholder="Enter BSC wallet">
<br>
<button onclick="saveWallet()">LINK WALLET</button>
</div>

<div class="card">
<h3>Withdraw</h3>
<input id="withdraw" placeholder="100 - 500 tokens">
<br>
<button onclick="withdraw()">REQUEST WITHDRAW</button>
</div>

</div>

<script>

/* SAFE STATE */
let points = 0;
let tokens = 0;
let wallet = null;
let userId = "guest";

/* SAFE INIT */
function init(){

try{

if(window.Telegram && Telegram.WebApp){
Telegram.WebApp.ready();
Telegram.WebApp.expand();

userId =
Telegram.WebApp.initDataUnsafe?.user?.id || "guest";
}

}catch(e){}

document.getElementById("userId").innerText = userId;

}

/* SAFE RENDER */
function render(){
document.getElementById("points").innerText = points;
document.getElementById("tokens").innerText = tokens;
}

/* TAP */
function tap(){
points++;
render();
}

/* WALLET */
function saveWallet(){

let w = document.getElementById("wallet").value;

if(!w) return alert("Enter wallet");

wallet = w;
alert("Wallet linked");

}

/* WITHDRAW */
function withdraw(){

let amt = parseInt(document.getElementById("withdraw").value);

if(!wallet) return alert("Link wallet first");

if(amt < 100 || amt > 500)
return alert("Only 100–500 tokens");

let required = amt * 100000;

if(points < required)
return alert("Not enough points");

points -= required;
tokens += amt;

render();

alert("Withdraw request sent");

}

/* ERROR SAFE */
window.onerror = function(){ return true; };

/* START */
window.addEventListener("DOMContentLoaded", init);

</script>

</body>

</html>
