<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>PVLT Tap Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
}

body{
display:flex;
flex-direction:column;
}

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow:hidden;
}

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:25px;

font-size:28px;
font-weight:bold;

background:linear-gradient(135deg,#00ff99,#00ccff);
color:black;
}

.tap:active{
transform:scale(0.96);
}

.card{
width:90%;
max-width:360px;
margin-top:15px;
padding:15px;

background:rgba(255,255,255,0.05);
border-radius:14px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>

</head>

<body>

<!-- NAV -->
<div class="nav">

<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0.0000</span></div>
<div>👤 <span id="walletView">guest</span></div>

</div>

<!-- MAIN -->
<div class="container">

<button class="tap" onclick="tap()">TAP</button>

<div class="small">1 Tap = 1 Point</div>

<div class="card">

<input id="walletInput" placeholder="Paste BSC wallet">

<button onclick="toggleWallet()">
CONNECT WALLET
</button>

</div>

<div class="card">

<button onclick="claim()">
CLAIM TOKENS
</button>

</div>

</div>

<script>

/* ================= STATE ================= */

let wallet = "";
let points = 0;

const RATE = 10000;

/* ================= STORAGE ================= */

function saveData(){
if(!wallet) return;

localStorage.setItem(wallet, JSON.stringify({
points: points
}));
}

function loadData(addr){

let data = localStorage.getItem(addr);

if(data){
let obj = JSON.parse(data);
points = obj.points || 0;
}else{
points = 0;
}
}

/* ================= UI ================= */

function updateUI(){

if(!wallet){
document.getElementById("points").innerText = 0;
document.getElementById("tokens").innerText = "0.0000";
document.getElementById("walletView").innerText = "guest";
return;
}

document.getElementById("points").innerText = points;

document.getElementById("tokens").innerText =
(points / RATE).toFixed(4);

document.getElementById("walletView").innerText =
wallet.slice(0,6)+"..."+wallet.slice(-4);
}

/* ================= TAP ================= */

function tap(){

if(!wallet){
alert("Connect wallet first");
return;
}

points++;

saveData();
updateUI();

}

/* ================= CONNECT / DISCONNECT ================= */

function toggleWallet(){

const input = document.getElementById("walletInput");

if(wallet){

wallet = "";
points = 0;

input.value = "";

updateUI();
return;
}

let w = input.value.trim();

if(!w.startsWith("0x") || w.length !== 42){
alert("Invalid wallet");
return;
}

wallet = w.toLowerCase();

loadData(wallet);

updateUI();

}

/* ================= CLAIM ================= */

function claim(){

if(!wallet){
alert("Connect wallet first");
return;
}

let tokens = points / RATE;

/* RULES */
if(tokens < 100){
alert("Minimum 100 tokens required");
return;
}

if(tokens > 500){
tokens = 500;
}

/* RESET AFTER CLAIM */
points = 0;

saveData();
updateUI();

alert(
"CLAIM SUCCESS\nTokens: " + tokens.toFixed(4)
);

}

/* ================= INIT ================= */

updateUI();

</script>

</body>
</html>
