<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVLT Tap Game</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

.tap{
width:180px;
height:180px;
border-radius:50%;
background:linear-gradient(135deg,#00ff99,#00ccff);
font-size:22px;
font-weight:bold;
border:none;
margin-top:40px;
}

.card{
margin-top:20px;
padding:15px;
background:rgba(255,255,255,0.05);
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:none;
outline:none;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#00ff99;
font-weight:bold;
margin-top:10px;
width:95%;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>

</head>

<body>

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">

<p>Points: <span id="points">0</span></p>
<p>Tokens: <span id="tokens">0</span></p>

</div>

<div class="card">

<input id="wallet" placeholder="Paste BSC wallet address">

<button onclick="injectWallet()">CONNECT WALLET</button>

<p class="small" id="walletInfo">Not connected</p>

</div>

<div class="card">

<button onclick="claim()">CLAIM TOKENS</button>

</div>

<script>

/* ================= STATE ================= */

let points = 0;
const RATE = 10000;

let wallet = "";

/* ================= TAP ================= */

function tap(){
if(!wallet){
alert("Connect wallet first");
return;
}

points++;
updateUI();
}

/* ================= UI ================= */

function updateUI(){

document.getElementById("points").innerText = points;
document.getElementById("tokens").innerText = (points/RATE).toFixed(4);

}

/* ================= INJECT WALLET ================= */

function injectWallet(){

let addr = document.getElementById("wallet").value.trim();

if(!addr.startsWith("0x") || addr.length !== 42){
alert("Invalid BSC wallet");
return;
}

wallet = addr;

document.getElementById("walletInfo").innerText =
"Connected: " + wallet.slice(0,6) + "..." + wallet.slice(-4);

alert("Wallet injected successfully");

}

/* ================= CLAIM (SIMULATED ON-CHAIN CALL) ================= */

function claim(){

if(!wallet){
alert("Connect wallet first");
return;
}

let tokenAmount = Math.floor(points / RATE);

if(tokenAmount <= 0){
alert("Not enough points");
return;
}

/* RESET AFTER CLAIM */
points = 0;
updateUI();

alert(
"Claim request sent for " +
tokenAmount +
" PVLT to wallet:\n" +
wallet
);

}

</script>

</body>
</html>
