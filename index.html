<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PVLT Tap Game</title>

<!-- ETHERS -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<!-- WALLETCONNECT / REOWN -->
<script src="https://unpkg.com/@walletconnect/ethereum-provider/dist/index.umd.js"></script>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
-webkit-text-size-adjust:100%;
overscroll-behavior:none;
}

body{
display:flex;
flex-direction:column;
}

/* ================= NAV ================= */

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

/* ================= CONTAINER ================= */

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

/* ================= TAP BUTTON ================= */

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:20px;
background:linear-gradient(135deg,#00ff99,#00ccff);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative;
touch-action:manipulation;
user-select:none;
-webkit-user-select:none;
}

.tap:active{
transform:scale(0.96);
}

/* ================= LOGO ================= */

.tapLogo{
width:75%;
height:75%;
object-fit:contain;
pointer-events:none;
}

/* ================= CARD ================= */

.bigCard{
width:90%;
max-width:380px;
margin-top:20px;
padding:18px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;
display:flex;
flex-direction:column;
gap:12px;
}

/* ================= INPUT ================= */

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
font-size:14px;
}

/* ================= BUTTON ================= */

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
font-size:16px;
background:linear-gradient(
90deg,
#00ff99,
#00ccff
);
color:black;
}

/* ================= STATUS ================= */

.status{
font-size:12px;
text-align:center;
margin-top:5px;
display:none;
}

</style>

</head>

<body>

<!-- ================= TOP NAV ================= -->

<div class="nav">

<div>
🔋
<span id="energy">50</span>
</div>

<div>
⚡
<span id="points">0</span>
</div>

<div>
💎
<span id="tokens">0.0000</span>
</div>

</div>

<!-- ================= MAIN ================= -->

<div class="container">

<!-- TAP BUTTON -->

<button class="tap" onclick="tap()">

<img
src="images/IMG_1850.png"
class="tapLogo">

</button>

<!-- CARD -->

<div class="bigCard">

<input
id="walletInput"
placeholder="Connect Polygon Wallet"
readonly>

<button
id="walletBtn"
onclick="toggleWallet()">

CONNECT WALLET

</button>

<div
id="walletStatus"
class="status">

Wallet Connected

</div>

<button onclick="buyEnergy()">

BUY ENERGY (REFILL)

</button>

<button onclick="swapPoints()">

SWAP POINTS → PVLTG

</button>

<button onclick="claim()">

CLAIM PVLTG

</button>

</div>

</div>

<!-- ================= SCRIPT ================= -->

<script>

/* ================= STATE ================= */

let wallet = "";
let points = 0;
let energy = 50;
let pvltg = 0;

let provider;

/* ================= BACKEND URL ================= */

const API =
"https://pvlt-server.onrender.com";

/* ================= UI ================= */

function updateUI(){

document.getElementById(
"energy"
).innerText = energy;

document.getElementById(
"points"
).innerText = points;

document.getElementById(
"tokens"
).innerText =
Number(pvltg).toFixed(4);
}

/* ================= CONNECT WALLET ================= */

async function toggleWallet(){

try{

provider =
await EthereumProvider.init({

projectId:
"1731f99148b9cf6107dee70b6efb14b7",

chains:[137],

showQrModal:true

});

await provider.enable();

/* ================= ETHERS ================= */

const ethersProvider =
new ethers.providers.Web3Provider(
provider
);

const signer =
ethersProvider.getSigner();

wallet =
await signer.getAddress();

/* ================= SHOW ADDRESS ================= */

document.getElementById(
"walletInput"
).value =
wallet.substring(0,6)
+
"..."
+
wallet.substring(
wallet.length - 4
);

/* ================= BUTTON ================= */

document.getElementById(
"walletBtn"
).innerText =
"CONNECTED";

/* ================= STATUS ================= */

document.getElementById(
"walletStatus"
).style.display =
"block";

/* ================= REGISTER USER ================= */

const res =
await fetch(
API + "/user",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

/* ================= LOAD USER ================= */

points =
data.points || 0;

energy =
data.energy || 50;

pvltg =
data.pvltg || 0;

/* ================= UPDATE UI ================= */

updateUI();

}catch(err){

console.log(err);

alert(
"Wallet connection failed"
);

}
}

/* ================= TAP ================= */

async function tap(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

try{

const res =
await fetch(
API + "/tap",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

if(data.error){

alert(data.error);

return;
}

/* ================= UPDATE ================= */

points =
data.points;

energy =
data.energy;

updateUI();

}catch(err){

console.log(err);

alert("Tap failed");
}
}

/* ================= BUY ENERGY ================= */

async function buyEnergy(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

try{

const res =
await fetch(
API + "/refill",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

if(data.error){

alert(data.error);

return;
}

/* ================= UPDATE ================= */

energy =
data.energy;

updateUI();

alert(
"50 energy added"
);

}catch(err){

console.log(err);

alert(
"Refill failed"
);
}
}

/* ================= SWAP POINTS ================= */

async function swapPoints(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

try{

const res =
await fetch(
API + "/swap-points",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

if(data.error){

alert(data.error);

return;
}

/* ================= UPDATE ================= */

points = 0;

pvltg =
data.pvltg;

updateUI();

alert(
"Points swapped to PVLTG"
);

}catch(err){

console.log(err);

alert(
"Swap failed"
);
}
}

/* ================= CLAIM ================= */

async function claim(){

if(!wallet){

alert(
"Connect wallet first"
);

return;
}

try{

const res =
await fetch(
API + "/claim-pvltg",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
wallet
})
}
);

const data =
await res.json();

if(data.error){

alert(data.error);

return;
}

/* ================= RESET PVLTG ================= */

pvltg = 0;

updateUI();

alert(
"PVLTG claimed successfully\n\nTX:\n"
+
data.tx
);

}catch(err){

console.log(err);

alert(
"Claim failed"
);
}
}

/* ================= START ================= */

updateUI();

</script>

</body>
</html>
