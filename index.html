<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>PepeVolt</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  background:
  radial-gradient(circle at top,
  #183153 0%,
  #07111f 75%);
  display:flex;
  flex-direction:column;
  padding:16px;
}

.top-nav{
  display:flex;
  gap:10px;
}

.nav-box{
  flex:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:12px;
  text-align:center;
}

.nav-title{
  font-size:11px;
  color:#9fb2d0;
}

.nav-value{
  font-size:18px;
  font-weight:bold;
  color:white;
}

#connectBtn{
  margin-top:14px;
  width:100%;
  border:none;
  border-radius:18px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:
  linear-gradient(135deg,
  #00b894,
  #00cec9);
  cursor:pointer;
}

.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.tap-circle{
  position:relative;
  width:min(60vw,230px);
  height:min(60vw,230px);
  border-radius:50%;
  background:
  radial-gradient(circle at 30% 30%,
  #00d2a8,
  #00a884);
  border:8px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:
  0 0 70px rgba(0,255,180,0.25);
  cursor:pointer;
  overflow:hidden;
}

.tap-circle img{
  width:80%;
  object-fit:contain;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.action-btn{
  padding:16px;
  border:none;
  border-radius:18px;
  color:white;
  font-weight:bold;
}

.buy{
  background:
  linear-gradient(135deg,
  #00b894,
  #00cec9);
}

.claim{
  background:
  linear-gradient(135deg,
  #ffb347,
  #ff7b54);
}

.float{
  position:fixed;
  color:white;
  font-weight:bold;
  pointer-events:none;
  animation:floatUp 1s linear forwards;
  z-index:9999;
}

@keyframes floatUp{
  0%{
    opacity:1;
    transform:translateY(0);
  }
  100%{
    opacity:0;
    transform:translateY(-70px);
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

</head>

<body>

<div class="app">

  <div class="top-nav">
    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">100</div>
    </div>
    <div class="nav-box">
      <div class="nav-title">💎 Points</div>
      <div class="nav-value" id="points">0</div>
    </div>
    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>
  </div>

  <button id="connectBtn">Connect Wallet</button>

  <div class="center">
    <div class="tap-circle" id="tapBtn">
      <img src="https://i.imgur.com/8Km9tLL.png">
    </div>
  </div>

  <div class="actions">
    <button class="action-btn buy">Buy 10000 Energy</button>
    <button class="action-btn claim">Claim PVLT</button>
  </div>

</div>

<script type="module">

import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2.11.0"

const connectBtn = document.getElementById("connectBtn")
let provider = null
let account = null

/* CONNECT - Configured for Polygon */
connectBtn.onclick = async ()=>{
  try{
    provider = await EthereumProvider.init({
      projectId: "1731f99148b9cf6107dee70b6efb14b7",
      chains: [137], // Polygon Mainnet
      showQrModal: true,
      methods: ["eth_sendTransaction", "personal_sign", "eth_signTypedData"],
      optionalMethods: ["eth_accounts", "eth_requestAccounts", "eth_chainId"],
      rpcMap: {
        137: "https://polygon-rpc.com"
      },
      metadata: {
        name: "PepeVolt",
        description: "PepeVolt Game",
        url: window.location.origin,
        icons: ["https://cdn-icons-png.flaticon.com/512/825/825508.png"]
      }
    })

    await provider.connect()
    const accounts = await provider.request({ method: "eth_accounts" })
    account = accounts[0]
    connectBtn.innerText = account.slice(0,6) + "..." + account.slice(-4)
  } catch(err) {
    console.log(err)
    alert("Wallet connection failed")
  }
}

/* TAP */
let energy = 100
let points = 0
let pvlt = 0

const energyEl = document.getElementById("energy")
const pointsEl = document.getElementById("points")
const pvltEl = document.getElementById("pvlt")

document.getElementById("tapBtn").onclick = (e)=>{
  if(!account){
    alert("Connect Wallet First")
    return
  }
  if(energy <= 0){
    alert("No Energy")
    return
  }
  energy--
  points++
  if(points >= 1000){
    pvlt += Math.floor(points / 1000)
    points = points % 1000
  }
  energyEl.innerText = energy
  pointsEl.innerText = points
  pvltEl.innerText = pvlt
  const f = document.createElement("div")
  f.className = "float"
  f.innerText = "+1"
  f.style.left = e.clientX + "px"
  f.style.top = e.clientY + "px"
  document.body.appendChild(f)
  setTimeout(()=>{ f.remove() },1000)
}

/* ENERGY REGEN */
setInterval(()=>{
  if(energy < 100){
    energy++
    energyEl.innerText = energy
  }
},5000)

</script>
</body>
</html>
