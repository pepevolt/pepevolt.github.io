<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tap Tap Game - Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: radial-gradient(circle at center, #1a1a2e, #16213e); color: #ffffff; }
        .game-container { display: flex; flex-direction: column; height: 100vh; padding-bottom: 20px; }
        
        /* Production Stats Bar */
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 20px 10px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .stat-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; }
        .emoji { font-size: 1.4rem; margin-bottom: 5px; }

        /* Main Interaction Area */
        .interaction-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; padding: 20px; }
        
        .tap-circle { width: 180px; height: 180px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.1); font-size: 2rem; font-weight: 800; cursor: pointer; background: #4ecca3; color: #1a1a2e; transition: transform 0.1s, box-shadow 0.2s; box-shadow: 0 10px 20px rgba(78, 204, 163, 0.3); }
        .tap-circle:active { transform: scale(0.95); }
        .tap-circle.disconnected { background: #4a4a4a; box-shadow: none; color: #aaa; }

        .energy-bar { width: 90%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; margin: 10px 0; }
        .energy-fill { height: 100%; background: linear-gradient(90deg, #4ecca3, #45b791); width: 0%; transition: width 0.4s ease-out; }

        .game-btn { background: #4ecca3; color: #1a1a2e; width: 90%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        .btn-wallet { background: #3498db; color: white; }
        button:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="stats">
            <div class="stat-item"><span class="emoji">⚡</span><span id="energy-display">0</span></div>
            <div class="stat-item"><span class="emoji">💎</span><span id="points-display">0</span></div>
            <div class="stat-item"><span class="emoji">🪙</span><span id="burned-display">0.00</span></div>
        </header>

        <main class="interaction-area">
            <button id="tap-button" class="tap-circle disconnected" disabled>TAP!</button>
            <button id="wallet-btn" class="btn-wallet" onclick="toggleWallet()">Connect Wallet</button>
            
            <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
            
            <button id="buy-btn" class="game-btn" onclick="confirmRefill()" disabled>Buy 10,000 Energy (100 PVLT)</button>
            <button id="convert-btn" class="game-btn" onclick="convertPVLT()" disabled>Convert Points</button>
            <button id="claim-btn" class="game-btn" onclick="claimPVLT()" disabled>Claim Rewards</button>
        </main>
    </div>

    <script>
        let energy = 0, points = 500, pvlt = 200, burnedGpvlt = 0;
        let isWalletConnected = false, isPaidUser = false, lastClaimDate = null;
        const FREE_CAP = 50, PAID_CAP = 10000;

        function updateUI() {
            const cap = isPaidUser ? PAID_CAP : FREE_CAP;
            document.getElementById('energy-display').innerText = energy;
            
            if (!isWalletConnected) {
                document.getElementById('points-display').innerText = "0";
                document.getElementById('burned-display').innerText = "0.00";
            } else {
                document.getElementById('points-display').innerText = points;
                document.getElementById('burned-display').innerText = burnedGpvlt.toFixed(2);
                document.getElementById('energy-fill').style.width = (energy / cap * 100) + "%";
            }
        }

        function toggleWallet() {
            isWalletConnected = !isWalletConnected;
            document.getElementById('wallet-btn').innerText = isWalletConnected ? "Disconnect Wallet" : "Connect Wallet";
            document.getElementById('tap-button').disabled = !isWalletConnected;
            document.getElementById('buy-btn').disabled = !isWalletConnected;
            document.getElementById('convert-btn').disabled = !isWalletConnected;
            document.getElementById('claim-btn').disabled = !isWalletConnected;
            updateUI();
        }

        function confirmRefill() {
            if (pvlt >= 100) {
                const btn = document.getElementById('buy-btn');
                btn.innerText = "Processing Polygon...";
                btn.disabled = true;
                
                setTimeout(() => {
                    pvlt -= 100;
                    isPaidUser = true;
                    energy = PAID_CAP;
                    btn.innerText = "Buy 10,000 Energy (100 PVLT)";
                    btn.disabled = false;
                    updateUI();
                    alert("Transaction Confirmed on Polygon! Energy refilled to 10,000.");
                }, 2000);
            } else { 
                alert("Insufficient PVLT balance on Polygon network!"); 
            }
        }

        function convertPVLT() {
            if (points >= 100) {
                const btn = document.getElementById('convert-btn');
                btn.innerText = "Processing...";
                btn.disabled = true;

                setTimeout(() => {
                    points -= 100;
                    burnedGpvlt += 1;
                    btn.innerText = "Convert Points";
                    btn.disabled = false;
                    updateUI();
                    alert("Points converted successfully on Polygon!");
                }, 1500);
            } else { alert("Need 100 💎"); }
        }

        function claimPVLT() {
            const today = new Date().toDateString();
            if (lastClaimDate === today) { alert("Already claimed today!"); return; }
            
            if (burnedGpvlt >= 100 && burnedGpvlt <= 1000) {
                const btn = document.getElementById('claim-btn');
                btn.innerText = "Claiming on Polygon...";
                btn.disabled = true;

                setTimeout(() => {
                    let reward = Math.floor(burnedGpvlt / 100); 
                    alert(`Success! Transferring ${reward} PVLT to your connected wallet.`);
                    burnedGpvlt = 0;
                    lastClaimDate = today;
                    btn.innerText = "Claim Rewards";
                    btn.disabled = false;
                    updateUI();
                }, 2000);
            } else {
                alert("You need between 100 and 1000 gPVLT to claim.");
            }
        }

        document.getElementById('tap-button').addEventListener('click', () => {
            if (energy > 0) { energy--; points++; updateUI(); }
        });

        setInterval(() => {
            const cap = isPaidUser ? PAID_CAP : FREE_CAP;
            if (isWalletConnected && energy < cap) { energy++; updateUI(); }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
