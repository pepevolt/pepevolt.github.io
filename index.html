<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";

        // --- DEPLOYED ADDRESSES ---
        const PVLT_ADDRESS = "0xb8010fD52D5208eC05574a7D5A939c0d446A862a";
        const TREASURY_ADDRESS = "0x3c25FE15e6fa0Eeb226Af53D1c9D8f8FA8BA21bc";
        const GAME_ADDRESS = "0x151803532A33837E4bBc2Afc23c6b1f59039B82D";

        // --- ABIs ---
        const PVLT_ABI = ["function approve(address spender, uint256 amount) external returns (bool)"];
        const TREASURY_ABI = ["function treasuryBalance() external view returns (uint256)"];
        const GAME_ABI = [
            "function tap() external",
            "function buyEnergy() external",
            "function convertPoints() external",
            "function claimRewards() external",
            "function getPlayer(address user) external view returns (uint256, uint256, uint256, bool, uint256)"
        ];

        let signer, gameContract, pvltContract, treasuryContract;

        async function init() {
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            gameContract = new ethers.Contract(GAME_ADDRESS, GAME_ABI, signer);
            pvltContract = new ethers.Contract(PVLT_ADDRESS, PVLT_ABI, signer);
            treasuryContract = new ethers.Contract(TREASURY_ADDRESS, TREASURY_ABI, signer);
            updateDashboard();
        }

        async function updateDashboard() {
            const addr = await signer.getAddress();
            const player = await gameContract.getPlayer(addr);
            const treasury = await treasuryContract.treasuryBalance();
            
            document.getElementById('energy').innerText = player[0].toString();
            document.getElementById('points').innerText = player[1].toString();
            document.getElementById('vault').innerText = ethers.formatEther(treasury).slice(0, 6) + " PVLT";
        }

        window.connect = async () => {
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            init();
        };

        window.tap = async () => { await (await gameContract.tap()).wait(); updateDashboard(); };
        window.convert = async () => { await (await gameContract.convertPoints()).wait(); updateDashboard(); };
        window.claim = async () => { await (await gameContract.claimRewards()).wait(); updateDashboard(); };
        window.buy = async () => {
            const price = ethers.parseEther("100");
            await (await pvltContract.approve(GAME_ADDRESS, price)).wait();
            await (await gameContract.buyEnergy()).wait();
            updateDashboard();
        };
    </script>
</head>
<body class="bg-[#0b1120] text-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm p-6 bg-[#111827] rounded-2xl border border-gray-700 shadow-xl">
        <h1 class="text-teal-400 font-bold text-2xl text-center mb-6">PEPEVOLT</h1>
        
        <div class="grid grid-cols-3 gap-2 text-center mb-6 text-sm">
            <div>🔋 <span id="energy">0</span></div>
            <div>🏛 <span id="vault">0.00</span></div>
            <div>💎 <span id="points">0</span></div>
        </div>

        <button onclick="connect()" class="w-full py-3 mb-3 bg-cyan-500 text-black font-bold rounded-lg">CONNECT WALLET</button>
        <button onclick="tap()" class="w-full py-3 mb-3 bg-blue-600 font-bold rounded-lg">TAP!</button>
        <button onclick="buy()" class="w-full py-3 mb-3 bg-purple-600 font-bold rounded-lg">BUY 10,000 ENERGY</button>
        <div class="flex gap-2">
            <button onclick="convert()" class="w-full py-2 bg-gray-700 rounded-lg">CONVERT</button>
            <button onclick="claim()" class="w-full py-2 bg-green-600 rounded-lg">CLAIM</button>
        </div>
    </div>
</body>
</html>
