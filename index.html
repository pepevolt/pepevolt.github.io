<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>PVLT TAP GAME</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

button{
padding:15px;
margin:10px;
font-size:18px;
}

#tapBtn{
width:200px;
height:200px;
border-radius:100%;
font-size:30px;
}

</style>

</head>

<body>

<h2>PVLT TAP GAME</h2>

<div id="wallet">Not Connected</div>

<h3>Energy:
<span id="energy">50</span>
</h3>

<h3>Points:
<span id="points">0</span>
</h3>

<button onclick="connectWallet()">
Connect Wallet
</button>

<br>

<button id="tapBtn" onclick="tap()">
TAP
</button>

<br>

<button onclick="buyEnergyPack()">
Buy 10,000 Energy
</button>

<button onclick="claimRewards()">
Claim Rewards
</button>

<script>

let provider;
let signer;
let user;

let energy = 50;
let maxEnergy = 50;

let points = 0;

const CONTRACT =
"YOUR_TREASURY_CONTRACT";

const ABI = [

"function buyEnergyPack() external",

"function claimRewards(uint amount) external"

];

async function connectWallet(){

await window.ethereum.request({
method:"eth_requestAccounts"
});

provider =
new ethers.providers.Web3Provider(window.ethereum);

signer = provider.getSigner();

user = await signer.getAddress();

document.getElementById("wallet")
.innerHTML = user;

}

setInterval(()=>{

if(energy < maxEnergy){

energy++;

document.getElementById("energy")
.innerHTML = energy;

}

},1000);

async function tap(){

if(energy <= 0){

alert("No energy");

return;
}

energy--;

points++;

document.getElementById("energy")
.innerHTML = energy;

document.getElementById("points")
.innerHTML = points;

await fetch("/tap",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

wallet:user,
points:1

})

});

}

async function buyEnergyPack(){

const contract =
new ethers.Contract(
CONTRACT,
ABI,
signer
);

const tx =
await contract.buyEnergyPack();

await tx.wait();

energy += 10000;

document.getElementById("energy")
.innerHTML = energy;

alert("Energy Purchased");

}

async function claimRewards(){

let pvlt =
Math.floor(points / 100);

if(pvlt < 10){

alert("Minimum 10 PVLT");

return;
}

const contract =
new ethers.Contract(
CONTRACT,
ABI,
signer
);

const tx =
await contract.claimRewards(
ethers.utils.parseEther(
pvlt.toString()
)
);

await tx.wait();

alert("Rewards Claimed");

points = 0;

document.getElementById("points")
.innerHTML = points;

}

</script>

</body>
</html>
