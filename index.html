<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PVLT Tap Game</title>

<style>

body{
margin:0;
font-family:Arial;
background:#08111f;
color:white;
text-align:center;
overflow:hidden;
}

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

.container{
padding:20px;
}

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;

font-size:28px;
font-weight:bold;

background:linear-gradient(135deg,#00ff99,#00ccff);
color:black;
margin-top:30px;
}

.tap:active{
transform:scale(0.96);
}

.card{
margin-top:20px;
padding:15px;
background:rgba(255,255,255,0.05);
border-radius:14px;
}

input{
width:90%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

button{
width:95%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>

</head>

<body>

<div class="nav">
<div>⚡ POINTS: <span id="points">0</span></div>
<div>💎 TOKENS: <span id="tokens">0.0000</span></div>
<div>👤 <span id="wallet">guest</span></div>
</div>

<div class="container">

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="small">1 Tap = 1 Point</div>

<div class="card">

<input id="walletInput" placeholder="Paste BSC wallet">

<button onclick="connectWallet()">CONNECT WALLET</button>

</div>

</div>

<script>

/* ================= STATE ================= */

let wallet = "";
let points = 0;

const POINTS_PER_TOKEN = 10000;

/* ================= UI ================= */

function set(id,val){
document.getElementById(id).innerText = val;
}

/* ================= TAP ================= */

function tap(){

if(!wallet){
alert("Connect wallet");
return;
}

points++;

set("points",points);

set("tokens",(points/POINTS_PER_TOKEN).toFixed(4));

}

/* ================= CONNECT ================= */

function connectWallet(){

let w = document.getElementById("walletInput").value.trim();

if(!w.startsWith("0x") || w.length !== 42){
alert("Invalid wallet");
return;
}

wallet = w.toLowerCase();

set("wallet",
wallet.slice(0,6)+"..."+wallet.slice(-4)
);

points = 0;

set("points",0);
set("tokens","0.0000");

alert("Wallet connected");

}

</script>

</body>
</html>
