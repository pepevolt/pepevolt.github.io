<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PepeVolt Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050a14; color: white; touch-action: manipulation; }
        .tap-circle { background: radial-gradient(circle, #00ff99 0%, #0066cc 100%); }
    </style>

<body class="min-h-screen flex flex-col">

    <div class="flex justify-between p-6 bg-slate-900 border-b border-slate-800">
        <div class="flex gap-4 font-mono text-sm">
            <span>🔋 <span id="energy">50</span></span>
            <span>⚡ <span id="points">0</span></span>
            <span>💎 <span id="pvltg">0.0000</span></span>
        </div>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center p-6">
        <button onclick="tap()" class="tap-circle w-64 h-64 rounded-full flex items-center justify-center shadow-2xl hover:scale-105 transition-transform active:scale-95">
            <img src="images/IMG_1850.png" alt="Tap" class="w-40 h-40 object-contain">
        </button>

        <div class="w-full max-w-sm mt-10 space-y-4">
            <input id="walletInput" class="w-full p-4 rounded-xl bg-slate-800 text-center" placeholder="Connect Wallet" readonly>
            <button id="walletBtn" onclick="connectWallet()" class="w-full p-4 rounded-xl bg-green-500 font-bold text-black">CONNECT WALLET</button>
            <button onclick="openBuyModal()" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 font-bold">BUY ENERGY</button>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="swapPoints()" class="p-4 rounded-xl bg-slate-800 text-sm">SWAP</button>
                <button onclick="claimPVLT()" class="p-4 rounded-xl bg-slate-800 text-sm">CLAIM</button>
            </div>
        </div>
    </main>

    <div id="buyModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-700 text-center">
            <h3 class="text-xl font-bold mb-4">Buy Energy Pack</h3>
            <p class="mb-6">100,000 Energy for 100 PVLT</p>
            <div class="flex gap-4">
                <button onclick="closeBuyModal()" class="flex-1 p-3 rounded-xl bg-slate-800">Cancel</button>
                <button id="confirmPaymentBtn" onclick="executeEnergyPurchase()" class="flex-1 p-3 rounded-xl bg-green-500 text-black">Confirm</button>
            </div>
        </div>
    </div>

        function openBuyModal() { document.getElementById('buyModal').classList.remove('hidden'); }
        function closeBuyModal() { document.getElementById('buyModal').classList.add('hidden'); }
