<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Blocks mobile browser window-scaling/zooming gestures completely -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PepeVolt Clicker</title>
    <!-- Tailwind CSS for clean dark UI styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for layout icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=500;700;800&display=swap');
        
        /* Fixed layout rules prevent scrolling and native zooming completely */
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #111d18 0%, #070a09 100%);
        }

        /* Prevents selections or blue click highlights on web elements */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Allows rapid tapping behavior specifically on interactive button targets */
        .tap-target {
            touch-action: manipulation;
        }
        .tap-target:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="text-gray-200 flex flex-col justify-between items-center p-4">

    <!-- Top Navigation Bar (Stats Layout) -->
    <nav class="w-full max-w-md bg-black/40 border border-emerald-900/40 rounded-2xl px-4 py-3 flex justify-between items-center shadow-lg backdrop-blur-md mt-2">
        <!-- 1. Energy Tracking Module -->
        <div class="flex flex-col items-center flex-1 border-r border-emerald-950/60">
            <span class="text-[10px] text-gray-400 uppercase tracking-wider font-bold flex items-center gap-1">
                <i class="fa-solid fa-bolt text-emerald-400"></i> Energy
            </span>
            <span class="text-sm font-black text-white mt-0.5">
                <span id="currentEnergy">50</span>/<span id="maxEnergy">50</span>
            </span>
        </div>

        <!-- 2. Points Tracking Module -->
        <div class="flex flex-col items-center flex-1 border-r border-emerald-950/60">
            <span class="text-[10px] text-gray-400 uppercase tracking-wider font-bold flex items-center gap-1">
                <i class="fa-solid fa-star text-yellow-400"></i> Points
            </span>
            <span class="text-sm font-black text-white mt-0.5" id="playerPoints">0</span>
        </div>

        <!-- 3. gPVLT Tracking Module -->
        <div class="flex flex-col items-center flex-1">
            <span class="text-[10px] text-gray-400 uppercase tracking-wider font-bold flex items-center gap-1">
                <i class="fa-solid fa-fire text-orange-400"></i> gPVLT
            </span>
            <span class="text-sm font-black text-orange-400 mt-0.5" id="playerGPVLT">0</span>
        </div>
    </nav>

    <!-- Main Game Section -->
    <main class="w-full max-w-md flex flex-col items-center gap-8 my-auto">
        
        <!-- Center Giant Tap Tap Target Button -->
        <div class="relative flex flex-col items-center">
            <div class="absolute -inset-2 bg-emerald-500/10 rounded-full blur-xl"></div>
            <!-- Handled using unified pointer events below for instant touch response -->
            <button id="tapBtn" class="tap-target relative w-56 h-56 rounded-full bg-gradient-to-b from-emerald-500 to-teal-600 flex flex-col items-center justify-center border-4 border-emerald-400 shadow-2xl transition-transform duration-75 cursor-pointer outline-none">
                <i class="fa-solid fa-frog text-8xl text-black/80 mb-2 pointer-events-none"></i>
                <span class="text-xs uppercase font-black tracking-widest text-black/60 pointer-events-none">Tap Tap</span>
            </button>
        </div>

        <!-- Wallet Interface & Energy Visualizer Combo -->
        <div class="w-full px-2 flex flex-col gap-2">
            <div class="w-full bg-gray-950 rounded-full h-2 overflow-hidden border border-emerald-950/30">
                <div id="energyProgress" class="bg-gradient-to-r from-emerald-400 to-teal-400 h-full rounded-full transition-all duration-150" style="width: 100%"></div>
            </div>
            <div class="flex justify-between items-center text-xs px-1 text-gray-400">
                <span>Wallet Balance:</span>
                <span class="font-bold text-gray-200" id="walletBalance">500.00 PVLT</span>
            </div>
        </div>

        <!-- System Pipeline Action Controls -->
        <div class="w-full flex flex-col gap-3">
            <button onclick="handleBuyEnergy()" class="tap-target w-full bg-emerald-500 hover:bg-emerald-600 text-black font-black py-3.5 rounded-xl tracking-wide transition-all shadow-lg shadow-emerald-500/10 cursor-pointer text-sm outline-none">
                Buy 10,000 Energy (100 PVLT)
            </button>

            <button onclick="handleConvert()" class="tap-target w-full bg-gray-900 hover:bg-gray-800 border border-white/5 hover:border-white/10 font-bold py-3.5 rounded-xl tracking-wide transition-all cursor-pointer text-sm outline-none">
                Convert Points to gPVLT
            </button>

            <button onclick="handleClaim()" class="tap-target w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl tracking-wide transition-all shadow-lg shadow-blue-600/10 cursor-pointer text-sm outline-none">
                Claim PVLT
            </button>
        </div>

    </main>

    <!-- Simple Identification Footer -->
    <footer class="text-[10px] text-gray-600 text-center pb-2" id="userTier">
        Standard Ecosystem Profile Tier
    </footer>

    <!-- Local Simulation Application Logic -->
    <script>
        let gameState = {
            energy: 50,
            maxEnergy: 50,
            points: 0,
            burnedGPVLT: 0,
            paidUser: false,
            walletBalance: 500
        };

        function updateUI() {
            document.getElementById('currentEnergy').innerText = gameState.energy;
            document.getElementById('maxEnergy').innerText = gameState.maxEnergy;
            document.getElementById('playerPoints').innerText = gameState.points;
            document.getElementById('playerGPVLT').innerText = gameState.burnedGPVLT;
            document.getElementById('walletBalance').innerText = gameState.walletBalance.toFixed(2) + " PVLT";
            
            const percent = (gameState.energy / gameState.maxEnergy) * 100;
            document.getElementById('energyProgress').style.width = percent + '%';

            const footerTier = document.getElementById('userTier');
            if (gameState.paidUser) {
                footerTier.innerText = "Premium Upgrade Verified Mode";
                footerTier.classList.add('text-emerald-500');
            }
        }

        // Processing Logic for Taps
        function executeTapLogic() {
            if (gameState.energy > 0) {
                gameState.energy -= 1;
                gameState.points += 1;
                updateUI();
            } else {
                alert("Out of interaction energy!");
            }
        }

        // Setup instant touch event listener for mobile devices
        const tapButtonElement = document.getElementById('tapBtn');
        
        // Listens to native touch inputs directly, bypassing 300ms mobile browser delays
        tapButtonElement.addEventListener('touchstart', function(event) {
            event.preventDefault(); // Kills zoom/gestures
            executeTapLogic();
        }, { passive: false });

        // Fallback option for standard desktop mouse testing
        tapButtonElement.addEventListener('mousedown', function(event) {
            // Only fire if it's a mouse click, not an emulated touch event
            if (event.type === 'mousedown' && 'ontouchstart' in window) return;
            executeTapLogic();
        });

        // Action: Buy 10,000 Energy
        function handleBuyEnergy() {
            if (gameState.walletBalance >= 100) {
                gameState.walletBalance -= 100;
                gameState.paidUser = true;
                gameState.maxEnergy = 10000;
                gameState.energy = 10000;
                updateUI();
            } else {
                alert("Insufficient wallet funds.");
            }
        }

        // Action: Convert Points
        function handleConvert() {
            if (gameState.points >= 100) {
                gameState.points -= 100;
                gameState.burnedGPVLT += 1;
                updateUI();
            } else {
                alert("Requires a minimum balance of 100 points.");
            }
        }

        // Action: Claim Payout
        function handleClaim() {
            if (gameState.burnedGPVLT >= 100 && gameState.burnedGPVLT <= 1000) {
                let reward = Math.floor(gameState.burnedGPVLT / 100);
                gameState.walletBalance += reward;
                gameState.burnedGPVLT = 0;
                updateUI();
                alert(`Transaction Processed: Claimed ${reward} PVLT!`);
            } else {
                alert("Threshold unmatched. Target requirements range between 100 and 1000 gPVLT.");
            }
        }

        // Structural window level double-tap override block
        let lastTouchEndTime = 0;
        document.addEventListener('touchend', function (event) {
            let currentTime = (new Date()).getTime();
            if (currentTime - lastTouchEndTime <= 300) {
                event.preventDefault();
            }
            lastTouchEndTime = currentTime;
        }, false);

        // Initialize display configuration state values
        updateUI();
    </script>
</body>
</html>
