<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:white;
  text-align:center;
}

.container {
  padding:20px;
}

button {
  padding:12px 18px;
  border:none;
  border-radius:10px;
  margin:10px;
  font-size:16px;
}

#tapArea {
  width:200px;
  height:200px;
  border-radius:50%;
  background:linear-gradient(145deg,#ff00cc,#3333ff);
  margin:30px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  user-select:none;
}

.energy {
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>⚡ PVLT Tap Game</h2>

<button onclick="connectWallet()">Connect Wallet</button>
<div id="wallet">Not connected</div>

<div id="tapArea">TAP</div>

<div class="energy">
Energy: <span id="energy">50</span>/50
</div>

<div>
Points: <span id="points">0</span>
</div>

<button onclick="claim()">Claim PVLT</button>

</div>

<script>
let provider, signer, user;

let energy = 50;
let points = 0;

const contractAddress = "YOUR_CONTRACT_ADDRESS_HERE";

const abi = [
"function reward(address to, uint amount) external"
];

async function connectWallet() {
  if (!window.ethereum) return alert("Install MetaMask");

  provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();
  user = await signer.getAddress();

  document.getElementById("wallet").innerText = user;
}

function regenEnergy() {
  setInterval(() => {
    if (energy < 50) energy++;
    document.getElementById("energy").innerText = energy;
  }, 3000);
}
regenEnergy();

document.getElementById("tapArea").onclick = () => {
  if (energy <= 0) return alert("No energy!");

  energy--;
  points++;

  document.getElementById("energy").innerText = energy;
  document.getElementById("points").innerText = points;
};

async function claim() {
  if (!signer) return alert("Connect wallet first");

  const contract = new ethers.Contract(contractAddress, abi, signer);

  // 100 points = 1 PVLT (example rule)
  let tokens = Math.floor(points / 100);

  if (tokens <= 0) return alert("Not enough points");

  try {
    const tx = await contract.reward(user, tokens);
    await tx.wait();

    alert("Claimed " + tokens + " PVLT!");
    points = 0;

  } catch (e) {
    alert("Transaction failed");
  }
}
</script>

</body>
</html>
