<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>PVLT Telegram Node</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #05070f;
      --card: #0c1020;
      --primary: #2481cc;
      --success: #10b981;
      --warning: #fbbf24;
      --danger: #ef4444;
      --text: #ffffff;
      --text-muted: #53657d;
      --border: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: fixed;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-container {
      flex: 1;
      width: 100%;
      max-width: 420px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Top Stats Bar & Telegram Profile Tracker */
    .top-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .score-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--warning);
    }

    .token-value {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
      margin-top: 2px;
    }

    .profile-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .avatar-circle {
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 11px;
    }

    /* Web3 Connection Status Box */
    .web3-strip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    
    .connect-btn-fallback {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .addr-lbl {
      font-family: monospace;
      font-size: 12px;
      color: var(--success);
    }

    /* Massive Tap Target Area */
    .tap-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      position: relative;
    }

    .tap-circle {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2481cc 0%, #1a65a3 100%);
      box-shadow: 0 0 40px rgba(36, 129, 204, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.05s ease;
      touch-action: none;
      border: 6px solid rgba(255, 255, 255, 0.1);
    }

    .tap-circle:active {
      transform: scale(0.93);
    }

    .tap-icon { font-size: 60px; }

    .cooldown-text {
      margin-top: 14px;
      font-size: 12px;
      color: var(--danger);
      font-weight: bold;
      height: 18px;
      visibility: hidden;
    }

    /* Financial Hub Interface */
    .vault-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-box input {
      width: 70%;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }

    .input-box span {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: bold;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:active { opacity: 0.85; }
    .btn-withdraw { background: #8b5cf6; color: white; }
    .btn-deposit { background: var(--success); color: white; }

    .status-terminal {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      min-height: 15px;
    }
  </style>
</head>
<body>

<div class="game-container">
  
  <div class="top-bar">
    <div>
      <div class="score-title">Mining Pool</div>
      <div id="ui-points" class="score-value">0</div>
      <div id="ui-tokens" class="token-value">0.00 PVLT</div>
    </div>
    
    <div id="tg-identity-block">
      <div class="profile-pill" id="tg-user-pill">
        <div class="avatar-circle" id="tg-avatar">?</div>
        <span id="tg-username">Guest Node</span>
      </div>
      <div id="tg-widget-mount" style="margin-top:4px;"></div>
    </div>
  </div>

  <div class="web3-strip">
    <span class="score-title">BSC Wallet:</span>
    <button id="web3-connect-btn" class="connect-btn-fallback" onclick="toggleWalletConnect()">Link Wallet</button>
  </div>

  <div class="tap-zone">
    <div id="tap-target" class="tap-circle">
      <span class="tap-icon">⚡</span>
    </div>
    <div id="ui-cooldown" class="cooldown-text">⚠️ SECURING POOL STORAGE IN: <span id="ui-timer">3.0</span>s</div>
  </div>

  <div class="vault-card">
    <div class="section-header">Protocol Settlement Engine</div>
    
    <div class="action-row">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="input-box">
          <input id="amt-withdraw" type="number" placeholder="0" />
          <span>OUT</span>
        </div>
        <button class="btn btn-withdraw" onclick="executeWithdrawal()">Withdraw</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="input-box">
          <input id="amt-deposit" type="number" placeholder="0" />
          <span>IN</span>
        </div>
        <button class="btn btn-deposit" onclick="executeDeposit()">Deposit</button>
      </div>
    </div>

    <div id="status-feed" class="status-terminal">Awaiting distributed commands...</div>
  </div>

</div>

<script>
// Smart Ecosystem Variables Definitions
const TOKEN_CONTRACT_ADDRESS = "0xa263d765b897b4777f0ad4a938d12d79e789ffff";
const MASTER_VAULT_RECEIVER = "0xFa664f30ad1D468A65641566316a68FB3c36a8AF";
const LOCAL_STORAGE_SAVED_POINTS = "pvlt_tg_total_points";

let savedPoints = parseInt(localStorage.getItem(LOCAL_STORAGE_SAVED_POINTS)) || 0;
let sessionActivePoints = 0;

let runTimeout;
let runInterval;
let timerCountdown = 3.0;

let customProvider = null;
let userAddress = null;
let isWalletConnected = false;

// Direct Web3 Injection Link Handler (Bypasses compilation errors)
async function toggleWalletConnect() {
  const feed = document.getElementById('status-feed');
  if (typeof window.ethereum !== 'undefined') {
    try {
      feed.innerText = "Connecting to provider...";
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      userAddress = accounts[0];
      isWalletConnected = true;
      
      // Update UI state securely
      const btn = document.getElementById('web3-connect-btn');
      btn.className = "addr-lbl";
      btn.onclick = null;
      btn.innerText = userAddress.substring(0,6) + "..." + userAddress.substring(38);
      feed.innerText = "Wallet linked successfully!";
    } catch (err) {
      feed.innerText = "Connection rejected.";
    }
  } else {
    alert("Please open this app inside a Web3 enabled browser wallet (Trust Wallet/MetaMask) or Telegram wallet container.");
  }
}

// Telegram Authentication Native/Widget Handler
function initializeTelegramIdentityEngine() {
  const tma = window.Telegram?.WebApp;
  
  if (tma && tma.initDataUnsafe && Object.keys(tma.initDataUnsafe).length > 0) {
    tma.ready();
    tma.expand();
    window.isTelegramAuthenticated = true;
    
    const user = tma.initDataUnsafe.user;
    if (user) {
      const displayTag = user.username ? `@${user.username}` : user.first_name;
      document.getElementById('tg-username').innerText = displayTag;
      document.getElementById('tg-avatar').innerText = displayTag.charAt(0).toUpperCase().replace('@','');
    }
  } else {
    window.isTelegramAuthenticated = false;
    
    window.onTelegramAuth = function(user) {
      window.isTelegramAuthenticated = true;
      document.getElementById('tg-username').innerText = user.username ? `@${user.username}` : user.first_name;
      document.getElementById('tg-avatar').innerText = user.first_name.charAt(0).toUpperCase();
      document.getElementById('tg-widget-mount').style.display = 'none';
    };

    const script = document.createElement('script');
    script.async = true;
    script.src = "https://telegram.org/js/telegram-widget.js?22";
    script.setAttribute('data-telegram-login', 'PVLT_Verification_Bot'); // Replace with your registered Bot Name via @BotFather
    script.setAttribute('data-size', 'small');
    script.setAttribute('data-onauth', 'onTelegramAuth(user)');
    script.setAttribute('data-request-access', 'write');
    document.getElementById('tg-widget-mount').appendChild(script);
  }
}

function updateDisplayEngine() {
  const displayTotal = savedPoints + sessionActivePoints;
  document.getElementById('ui-points').innerText = displayTotal.toLocaleString();
  document.getElementById('ui-tokens').innerText = (displayTotal / 100000).toFixed(2) + " PVLT";
}

// Start Main Systems
initializeTelegramIdentityEngine();
updateDisplayEngine();

document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

const tapArea = document.getElementById('tap-target');
tapArea.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  processTapAction();
});

function processTapAction() {
  sessionActivePoints += 1000;
  updateDisplayEngine();
  resetInactivityTimer();
}

function resetInactivityTimer() {
  clearTimeout(runTimeout);
  clearInterval(runInterval);

  timerCountdown = 3.0;
  const cdBar = document.getElementById('ui-cooldown');
  cdBar.style.visibility = 'visible';
  document.getElementById('ui-timer').innerText = timerCountdown.toFixed(1);

  runInterval = setInterval(() => {
    timerCountdown -= 0.1;
    if (timerCountdown <= 0) {
      clearInterval(runInterval);
    } else {
      document.getElementById('ui-timer').innerText = timerCountdown.toFixed(1);
    }
  }, 100);

  runTimeout = setTimeout(() => {
    finalizeSessionScore();
  }, 3000);
}

function finalizeSessionScore() {
  if (window.isTelegramAuthenticated) {
    savedPoints += sessionActivePoints;
    localStorage.setItem(LOCAL_STORAGE_SAVED_POINTS, savedPoints.toString());
  } else {
    alert("Please authorize via Telegram login to save points!");
  }
  
  sessionActivePoints = 0;
  updateDisplayEngine();
  document.getElementById('ui-cooldown').style.visibility = 'hidden';

  setTimeout(() => { window.location.reload(); }, 100);
}

// Web3 Execution - WITHDRAWAL
async function executeWithdrawal() {
  const feed = document.getElementById('status-feed');
  try {
    if (!window.isTelegramAuthenticated) {
      alert("Please log into your Telegram profile first.");
      return;
    }
    if (!isWalletConnected) {
      alert("Please link your wallet destination first.");
      return;
    }

    const valueOut = parseFloat(document.getElementById('amt-withdraw').value);
    if (!valueOut || valueOut < 100) {
      alert("Minimum withdrawal threshold is 100 PVLT!");
      return;
    }

    const necessaryPoints = valueOut * 100000;
    if (savedPoints < necessaryPoints) {
      alert("Insufficient points inside local ledger.");
      return;
    }

    feed.innerText = "Constructing payment pipeline...";
    const providerInstance = new ethers.providers.Web3Provider(window.ethereum);
    const networkSigner = providerInstance.getSigner();

    const gasCompensation = ethers.utils.parseEther("0.001");
    const encodedPayloadMemo = ethers.utils.hexlify(ethers.utils.toUtf8Bytes(`Claim:${valueOut}-Tokens`));

    clearTimeout(runTimeout);
    clearInterval(runInterval);
    document.getElementById('ui-cooldown').style.visibility = 'hidden';

    const txResponse = await networkSigner.sendTransaction({
      to: MASTER_VAULT_RECEIVER,
      value: gasCompensation,
      data: encodedPayloadMemo
    });

    feed.innerText = "Awaiting BSC confirmation ledger blocks...";
    await txResponse.wait();

    savedPoints -= necessaryPoints;
    localStorage.setItem(LOCAL_STORAGE_SAVED_POINTS, savedPoints.toString());
    updateDisplayEngine();

    feed.innerText = "✅ Withdrawal successfully confirmed!";
    setTimeout(() => { window.location.reload(); }, 1200);

  } catch (err) {
    console.error(err);
    feed.innerText = "❌ Transaction signature rejected.";
  }
}

// Web3 Execution - DEPOSIT
async function executeDeposit() {
  const feed = document.getElementById('status-feed');
  try {
    if (!isWalletConnected) {
      alert("Please link network connection parameters first.");
      return;
    }

    const valueIn = document.getElementById('amt-deposit').value;
    if (!valueIn || valueIn <= 0) return;

    feed.innerText = "Checking pipeline metrics...";
    const providerInstance = new ethers.providers.Web3Provider(window.ethereum);
    const networkSigner = providerInstance.getSigner();

    const gasExecutionFee = ethers.utils.parseEther("0.0001");
    const activeContract = new ethers.Contract(TOKEN_CONTRACT_ADDRESS, [
      "function transfer(address to, uint256 value) returns (bool)"
    ], networkSigner);

    // Reliable public RPC fallback for decimals verification
    const backupStaticProvider = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org/");
    const verifyContract = new ethers.Contract(TOKEN_CONTRACT_ADDRESS, ["function decimals() view returns (uint8)"], backupStaticProvider);
    const currentDecimals = await verifyContract.decimals();

    feed.innerText = "Awaiting transaction approval...";
    const fixedTokenHexAmount = ethers.utils.parseUnits(valueIn.toString(), currentDecimals);
    
    const txResponse = await activeContract.transfer(
      MASTER_VAULT_RECEIVER,
      fixedTokenHexAmount,
      { value: gasExecutionFee }
    );

    feed.innerText = "Confirming block updates on BSC network...";
    await txResponse.wait();

    feed.innerText = "✅ Deposit validation successfully verified!";
  } catch (err) {
    console.error(err);
    feed.innerText = "❌ Transaction routing engine failed.";
  }
}
</script>

</body>
</html>
