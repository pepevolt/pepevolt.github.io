<!DOCTYPE html>
<html>
<body>

    <h2>PepeVolt Simple UI</h2>
    
    <button onclick="connect()">Connect Wallet</button>
    <p id="status">Wallet: Not connected</p>

    <hr>

    <h3>Game Controls</h3>
    <button onclick="tap()">Tap</button>
    <button onclick="buyEnergy()">Buy Energy (100 PVLT)</button>
    <button onclick="claim()">Claim Rewards</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script>
        const GAME_ADDR = "PASTE_GAME_CONTRACT_ADDRESS_HERE";
        const ABI = ["function tap()", "function buyEnergy()", "function claimRewards()"];
        let signer, contract;

        async function connect() {
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            contract = new ethers.Contract(GAME_ADDR, ABI, signer);
            document.getElementById("status").innerText = "Wallet: " + signer.address;
        }

        async function tap() {
            await contract.tap();
            alert("Tapped!");
        }

        async function buyEnergy() {
            // Note: You must run token.approve() first in a real app
            await contract.buyEnergy();
            alert("Energy Bought!");
        }

        async function claim() {
            await contract.claimRewards();
            alert("Rewards Claimed!");
        }
    </script>
</body>
</html>
