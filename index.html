<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PVLT Game v2</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(180deg,#070b14,#0b1a33);
  color:white;
  text-align:center;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

/* HEADER */
h2{
  margin-bottom:10px;
}

/* CARD */
.card{
  background:#111a2e;
  padding:15px;
  border-radius:14px;
  margin:10px 0;
  text-align:left;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

/* BUTTONS */
button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
  background:#2b6fff;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

button:active{
  transform:scale(0.97);
}

button:disabled{
  background:#444;
}

/* ENERGY BAR */
.bar{
  width:100%;
  height:12px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00ff99,#00b3ff);
  transition:0.4s;
}

/* TAP FLOAT TEXT */
.float{
  position:absolute;
  color:#00ff99;
  font-weight:bold;
  animation:floatUp 0.8s ease-out forwards;
}

@keyframes floatUp{
  0%{opacity:1; transform:translateY(0);}
  100%{opacity:0; transform:translateY(-60px);}
}

.game-area{
  position:relative;
  padding:20px;
  margin-top:10px;
  background:#0f1a30;
  border-radius:16px;
}
</style>
</head>

<body>

<div class="container">

<h2>⚡ PVLT TAP v2</h2>

<button id="connectBtn">Connect Wallet</button>

<div class="card">
<p><b>Wallet:</b> <span id="addr">-</span></p>
<p><b>Energy:</b> <span id="energy">0</span></p>

<div class="bar">
  <div class="fill" id="energyBar"></div>
</div>

<p><b>Points:</b> <span id="points">0</span></p>
<p><b>Burned:</b> <span id="burned">0</span></p>
</div>

<div class="game-area" id="gameArea">
  <h3>Tap Area</h3>
  <button id="tapBtn" disabled>👆 TAP</button>
</div>

<button id="refillBtn" disabled>⚡ Refill Energy</button>
<button id="convertBtn" disabled>🔁 Convert</button>
<button id="claimBtn" disabled>💰 Claim Rewards</button>

</div>

<script>
/* CONTRACTS */
const GAME_ADDRESS = "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";
const TREASURY_ADDRESS = "0x4251Ef24D10bf637494C173621F5f84262e9Bda5";

/* ABI (minimal) */
const GAME_ABI = [
"function tap()",
"function refillEnergy()",
"function convertPoints()",
"function players(address) view returns (uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"
];

const TREASURY_ABI = [
"function claimRewards()"
];

let provider, signer, user, game, treasury;

/* UI */
const connectBtn = document.getElementById("connectBtn");
const tapBtn = document.getElementById("tapBtn");
const refillBtn = document.getElementById("refillBtn");
const convertBtn = document.getElementById("convertBtn");
const claimBtn = document.getElementById("claimBtn");

/* CONNECT */
connectBtn.onclick = async () => {
  if (!window.ethereum) return alert("Install wallet");

  provider = new ethers.BrowserProvider(window.ethereum);
  await window.ethereum.request({ method: "eth_requestAccounts" });

  signer = await provider.getSigner();
  user = await signer.getAddress();

  game = new ethers.Contract(GAME_ADDRESS, GAME_ABI, signer);
  treasury = new ethers.Contract(TREASURY_ADDRESS, TREASURY_ABI, signer);

  document.getElementById("addr").innerText =
    user.slice(0,6) + "..." + user.slice(-4);

  tapBtn.disabled = false;
  refillBtn.disabled = false;
  convertBtn.disabled = false;
  claimBtn.disabled = false;

  load();
  setInterval(load, 2500);
};

/* LOAD DATA */
async function load(){
  const p = await game.players(user);

  let energy = Number(p.energy);
  let points = Number(p.points);
  let burned = Number(p.burnedGPVLT);

  document.getElementById("energy").innerText = energy;
  document.getElementById("points").innerText = points;
  document.getElementById("burned").innerText = burned;

  // energy bar (max assumed 100 for UI)
  let percent = Math.min((energy / 100) * 100, 100);
  document.getElementById("energyBar").style.width = percent + "%";
}

/* TAP + FLOAT ANIMATION */
tapBtn.onclick = async (e) => {
  try{
    spawnFloat(e);
    tapBtn.disabled = true;

    const tx = await game.tap();
    await tx.wait();

    tapBtn.disabled = false;
    load();
  }catch(err){
    tapBtn.disabled = false;
  }
};

/* FLOAT TEXT */
function spawnFloat(e){
  const el = document.createElement("div");
  el.className = "float";
  el.innerText = "+1";

  const rect = tapBtn.getBoundingClientRect();
  el.style.left = rect.left + rect.width/2 + "px";
  el.style.top = rect.top + "px";

  document.body.appendChild(el);
  setTimeout(()=>el.remove(),800);
}

/* ACTIONS */
refillBtn.onclick = async () => {
  const tx = await game.refillEnergy();
  await tx.wait();
  load();
};

convertBtn.onclick = async () => {
  const tx = await game.convertPoints();
  await tx.wait();
  load();
};

claimBtn.onclick = async () => {
  const tx = await treasury.claimRewards();
  await tx.wait();
  load();
};
</script>

</body>
</html>
