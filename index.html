<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PepeVolt</title>

<style>
body {
    margin:0;
    background:#0f0f12;
    font-family:sans-serif;
    color:white;
}

/* TOP NAV */
.top-nav {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:12px 10px;
    background:#11131a;
    border-bottom:1px solid #222;
    font-size:20px;
}

/* NAV ITEMS */
.nav-item {
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
}

/* CENTER CONTENT */
.center {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

#connect-button {
    padding:14px 28px;
    font-size:16px;
    font-weight:600;
    color:#fff;
    background:#3b82f6;
    border:none;
    border-radius:50px;
    cursor:pointer;
    transition:0.3s;
}

#connect-button:hover {
    background:#2563eb;
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- TOP NAV -->
<div class="top-nav">
    <div class="nav-item">⚡ 0</div>
    <div class="nav-item">🪙 0</div>
    <div class="nav-item">💎 0</div>
</div>

<!-- CENTER BUTTON -->
<div class="center">
    <button id="connect-button">Connect Wallet</button>
</div>

<script type="module">
import { createAppKit } from "https://esm.sh/@reown/appkit"
import { EthersAdapter } from "https://esm.sh/@reown/appkit-adapter-ethers"
import { mainnet, polygon } from "https://esm.sh/@reown/appkit/networks"

const projectId = "1731f99148b9cf6107dee70b6efb14b7"

const modal = createAppKit({
    projectId,
    adapters: [new EthersAdapter()],
    networks: [mainnet, polygon],
    metadata: {
        name: "PepeVolt",
        description: "Connect Wallet",
        url: window.location.origin,
        icons: ["https://avatars.githubusercontent.com/u/37784886"]
    }
})

// OPEN WALLET
document.getElementById("connect-button").addEventListener("click", () => {
    modal.open()
})
</script>

</body>
</html>
