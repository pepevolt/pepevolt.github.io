<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap Gaming</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg-dark: #0a0b10;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body { 
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #050505; color: white; overflow: hidden;
            background: radial-gradient(circle at top, #1a1a2e, #000);
        }

        .game-container { display: flex; flex-direction: column; height: 100vh; padding: 20px; gap: 20px; }

        /* Modern Dashboard Stats */
        .stats { 
            display: flex; justify-content: space-around; 
            background: var(--card-bg); padding: 15px; border-radius: 20px; 
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-item { text-align: center; }
        .stat-val { display: block; font-size: 1.2rem; font-weight: bold; color: var(--primary); }

        /* The Interaction Area */
        .interaction-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px; }

        .tap-circle { 
            width: 200px; height: 200px; border-radius: 50%; border: 4px solid var(--primary);
            background: transparent; color: var(--primary); font-size: 1.5rem; font-weight: 800;
            cursor: pointer; box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            transition: transform 0.1s, box-shadow 0.3s;
        }
        .tap-circle:active { transform: scale(0.95); box-shadow: 0 0 50px var(--primary); }
        .tap-circle:disabled { border-color: #444; color: #444; box-shadow: none; }

        /* Energy Bar */
        .energy-wrapper { width: 100%; max-width: 300px; }
        .energy-bar { height: 12px; background: #222; border-radius: 6px; overflow: hidden; }
        .energy-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #7000ff); width: 0%; }

        /* Buttons Grid */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 300px; }
        .btn { padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: #000; }
        .btn-sec { background: var(--card-bg); color: white; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="stats">
            <div class="stat-item">⚡ <span class="stat-val" id="energy-display">0</span></div>
            <div class="stat-item">💎 <span class="stat-val" id="points-display">0</span></div>
            <div class="stat-item">🪙 <span class="stat-val" id="burned-display">0.00</span></div>
        </header>

        <main class="interaction-area">
            <button id="tap-button" class="tap-circle" disabled>TAP</button>
            
            <div class="energy-wrapper">
                <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
            </div>

            <div class="controls">
                <button id="wallet-btn" class="btn btn-main" onclick="toggleWallet()">Connect</button>
                <button id="buy-btn" class="btn btn-sec" onclick="confirmRefill()" disabled>Refill</button>
                <button id="convert-btn" class="btn btn-sec" onclick="convertPVLT()" disabled>Convert</button>
                <button id="claim-btn" class="btn btn-main" onclick="claimPVLT()" disabled>Claim</button>
            </div>
        </main>
    </div>

    <!-- Keep your existing script logic here -->
</body>
</html>
