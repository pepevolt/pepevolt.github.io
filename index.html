<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt dApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";

        // --- CONFIGURE THESE AFTER DEPLOYMENT ---
        const PVLT_ADDRESS = "0x..."; 
        const TREASURY_ADDRESS = "0x..."; 
        const GAME_ADDRESS = "0x..."; 
        
        // Paste your ABIs here
        const PVLT_ABI = ["function approve(address spender, uint256 amount) external returns (bool)"];
        const GAME_ABI = ["function buyEnergy() external", "function tap() external", "function getPlayer(address) view returns (uint256, uint256, uint256, bool, uint256)"];
        const TREASURY_ABI = ["function treasuryBalance() external view returns (uint256)"];

        let signer, gameContract, pvltContract, treasuryContract;

        async function init() {
            if (!window.ethereum) return alert("Please install MetaMask");
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            
            gameContract = new ethers.Contract(GAME_ADDRESS, GAME_ABI, signer);
            pvltContract = new ethers.Contract(PVLT_ADDRESS, PVLT_ABI, signer);
            treasuryContract = new ethers.Contract(TREASURY_ADDRESS, TREASURY_ABI, signer);
            
            updateDashboard();
        }

        async function updateDashboard() {
            const address = await signer.getAddress();
            const player = await gameContract.getPlayer(address);
            const treasury = await treasuryContract.treasuryBalance();
            
            document.getElementById('energy').innerText = player[0].toString();
            document.getElementById('vault').innerText = ethers.formatEther(treasury) + " PVLT";
            document.getElementById('points').innerText = player[1].toString();
        }

        window.connectWallet = async () => {
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            await init();
        };

        window.buyEnergy = async () => {
            const price = ethers.parseEther("100");
            await (await pvltContract.approve(GAME_ADDRESS, price)).wait();
            await (await gameContract.buyEnergy()).wait();
            updateDashboard();
        };

        window.tap = async () => {
            await (await gameContract.tap()).wait();
            updateDashboard();
        };
    </script>
    <style>
        body { background-color: #0b1120; }
        .gradient-btn { background: linear-gradient(to right, #06b6d4, #3b82f6); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white font-sans">

    <div class="w-full max-w-sm p-4">
        <div class="flex justify-between mb-8 text-sm">
            <span>🔋 <span id="energy">0</span></span>
            <span>⚡ 0</span>
            <span>💎 <span id="points">0</span></span>
        </div>

        <div class="bg-[#111827] border border-gray-700 rounded-2xl p-6">
            <button id="connectBtn" onclick="connectWallet()" class="w-full py-3 rounded-lg font-bold text-black bg-cyan-400 mb-6">CONNECT WALLET</button>

            <div class="space-y-3 mb-6">
                <div class="flex justify-between text-sm">
                    <span class="text-teal-400">🏛 Treasury Vault:</span>
                    <span id="vault">0.00 PVLT</span>
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="tap()" class="w-full py-3 rounded-lg font-bold text-white bg-blue-600">TAP</button>
                <button onclick="buyEnergy()" class="w-full py-3 rounded-lg font-bold text-white gradient-btn">BUY ENERGY</button>
            </div>
        </div>
    </div>
</body>
</html>
