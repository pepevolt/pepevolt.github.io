<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>PepeVolt</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#050b16;
  color:white;
}

/* MAIN APP */

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  margin:auto;
  position:relative;

  background:
  radial-gradient(circle at top,#13233d 0%,#050b16 70%);

  overflow:hidden;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
  env(safe-area-inset-top)
  16px
  env(safe-area-inset-bottom);
}

/* TOP NAV */

.top-nav{
  width:100%;
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
}

.nav-box{
  flex:1;
  min-width:0;

  background:rgba(255,255,255,0.05);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:18px;

  padding:12px 8px;

  text-align:center;

  backdrop-filter:blur(10px);
}

.nav-title{
  font-size:11px;
  color:#9eb0cb;
  margin-bottom:6px;
}

.nav-value{
  font-size:17px;
  font-weight:bold;
}

/* CONNECT BUTTON */

.wallet-wrap{
  width:100%;
  margin-top:16px;
}

#connectBtn{
  width:100%;
  border:none;
  border-radius:18px;
  padding:15px;

  font-size:15px;
  font-weight:bold;

  color:white;
  cursor:pointer;

  background:
  linear-gradient(
  135deg,
  #00b894,
  #00cec9
  );

  box-shadow:
  0 0 25px rgba(0,255,200,0.2);

  transition:0.15s;
}

#connectBtn:active{
  transform:scale(0.98);
}

/* CENTER AREA */

.center-area{
  flex:1;

  width:100%;

  display:flex;
  justify-content:center;
  align-items:center;

  position:relative;
}

/* TAP BUTTON */

.tap-circle{

  width:min(58vw,240px);
  height:min(58vw,240px);

  border-radius:50%;

  background:
  radial-gradient(
  circle at 30% 30%,
  #ffcc00,
  #ff8800
  );

  border:7px solid rgba(255,255,255,0.9);

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;

  box-shadow:
  0 0 70px rgba(255,170,0,0.45),
  inset 0 0 30px rgba(255,255,255,0.15);

  transition:0.08s;

  position:relative;
}

.tap-circle:active{
  transform:scale(0.94);
}

.tap-circle img{
  width:28%;
  height:28%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
}

/* ACTION BUTTONS */

.actions{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:12px;

  margin-bottom:14px;
}

.action-btn{
  width:100%;
  border:none;
  border-radius:18px;

  padding:16px;

  color:white;
  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  transition:0.15s;
}

.action-btn:active{
  transform:scale(0.98);
}

.buy{
  background:
  linear-gradient(
  135deg,
  #00b894,
  #00cec9
  );
}

.convert{
  background:
  linear-gradient(
  135deg,
  #6c5ce7,
  #8e7dff
  );
}

.claim{
  background:
  linear-gradient(
  135deg,
  #ffb347,
  #ff7b54
  );
}

/* FLOAT TEXT */

.float{
  position:absolute;
  color:white;
  font-weight:bold;
  pointer-events:none;

  animation:floatUp 1s linear forwards;
}

@keyframes floatUp{

  0%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-70px);
  }
}

/* MOBILE FIX */

@media (max-height:700px){

  .tap-circle{
    width:190px;
    height:190px;
  }

  .actions{
    gap:10px;
  }

  .action-btn{
    padding:14px;
  }
}

</style>
</head>

<body>

<div class="app">

  <!-- TOP NAV -->

  <div class="top-nav">

    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">
        100
      </div>
    </div>

    <div class="nav-box">
      <div class="nav-title">💎 gPVLT</div>
      <div class="nav-value" id="gpvlt">
        0
      </div>
    </div>

    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">
        0
      </div>
    </div>

  </div>

  <!-- CONNECT -->

  <div class="wallet-wrap">

    <button id="connectBtn">
      Connect Wallet
    </button>

  </div>

  <!-- CENTER -->

  <div class="center-area">

    <div class="tap-circle" id="tapBtn">

      <img
      src="https://cdn-icons-png.flaticon.com/512/825/825508.png">

    </div>

  </div>

  <!-- ACTIONS -->

  <div class="actions">

    <button class="action-btn buy">
      Buy
    </button>

    <button class="action-btn convert">
      Convert
    </button>

    <button class="action-btn claim">
      Claim
    </button>

  </div>

</div>

<script type="module">

import { createAppKit }
from 'https://esm.sh/@reown/appkit@latest';

import { EthersAdapter }
from 'https://esm.sh/@reown/appkit-adapter-ethers@latest';

import { polygon }
from 'https://esm.sh/@reown/appkit/networks@latest';

const projectId =
'1731f99148b9cf6107dee70b6efb14b7';

const modal = createAppKit({

  adapters:[new EthersAdapter()],

  networks:[polygon],

  metadata:{
    name:'PepeVolt',
    description:'PepeVolt Game',
    url:'https://pepevolt.github.io',
    icons:[
      'https://avatars.githubusercontent.com/u/179229932'
    ]
  },

  projectId,

  features:{
    analytics:true
  }

});

const connectBtn =
document.getElementById('connectBtn');

connectBtn.addEventListener('click',()=>{

  modal.open();

});

modal.subscribeState((state)=>{

  if(state.isConnected && state.address){

    const address = state.address;

    connectBtn.innerText =
    address.slice(0,6)
    + '...'
    + address.slice(-4);

  }else{

    connectBtn.innerText =
    'Connect Wallet';

  }

});

/* TAP SYSTEM */

const tapBtn =
document.getElementById('tapBtn');

let energy = 100;
let points = 0;
let gpvlt = 0;
let pvlt = 0;

tapBtn.addEventListener('click',(e)=>{

  if(energy <= 0) return;

  energy--;
  points++;

  document.getElementById('energy')
  .innerText = energy;

  if(points >= 100){

    points = 0;

    gpvlt++;

    document.getElementById('gpvlt')
    .innerText = gpvlt;
  }

  if(gpvlt >= 100){

    gpvlt = 0;

    pvlt++;

    document.getElementById('gpvlt')
    .innerText = gpvlt;

    document.getElementById('pvlt')
    .innerText = pvlt;
  }

  /* FLOATING */

  const float =
  document.createElement('div');

  float.className = 'float';

  float.innerText = '+1';

  const rect =
  tapBtn.getBoundingClientRect();

  float.style.left =
  rect.left + rect.width/2 - 10 + 'px';

  float.style.top =
  rect.top + rect.height/2 - 20 + 'px';

  document.body.appendChild(float);

  setTimeout(()=>{
    float.remove();
  },1000);

});

</script>

</body>
</html>
