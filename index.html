<!DOCTYPE html>
<html>
<body>
    <h1>PepeVolt Game</h1>
    <button onclick="connectWallet()">Connect Wallet</button>
    <button onclick="claimRewards()">Claim Rewards</button>

    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <script>
        const treasuryAddress = "0x4251Ef24D10bf637494C173621F5f84262e9Bda5";
        const treasuryABI = [ /* PASTE YOUR TREASURY ABI HERE */ ];

        async function connectWallet() {
            if (window.ethereum) {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
            } else { alert("Install MetaMask!"); }
        }

        async function claimRewards() {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            const treasury = new ethers.Contract(treasuryAddress, treasuryABI, signer);
            try {
                const tx = await treasury.claimRewards();
                await tx.wait();
                alert("Rewards claimed!");
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
