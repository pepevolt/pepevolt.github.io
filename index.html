<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background: #080f1e; color: white; }
        .card { background: #0f172a; border: 1px solid #1e293b; }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">
    
    <div class="w-full max-w-sm flex justify-between p-4 card rounded-2xl mb-6">
        <span class="text-xs">🔋 <span id="energy">--</span>/10k</span>
        <span class="text-xs">⚡ <span id="points">--</span> pts</span>
        <span class="text-xs">💎 <span id="burned">--</span> gPVLT</span>
    </div>

    <button onclick="interact('tap')" class="w-64 h-64 bg-green-500 rounded-full mb-8 shadow-[0_0_50px_rgba(34,197,94,0.3)] hover:scale-105 transition-all text-8xl">🐸</button>

    <div class="w-full max-w-sm grid grid-cols-2 gap-3">
        <button onclick="buyEnergyFlow()" class="p-4 card rounded-xl font-bold text-sm">BUY ENERGY</button>
        <button onclick="interact('refillEnergy')" class="p-4 card rounded-xl font-bold text-sm">REFILL</button>
        <button onclick="interact('convertPoints')" class="p-4 card rounded-xl font-bold text-sm">CONVERT</button>
        <button onclick="interact('claimRewards')" class="p-4 card rounded-xl font-bold text-sm text-green-400">CLAIM</button>
    </div>

    <script>
        const GAME_ADDR = "0x151803532A33837E4bBc2Afc23c6b1f59039B82D";
        const PVLT_ADDR = "0xb8010fD52D5208eC05574a7D5A939c0d446A862a";
        const ABI = [{"inputs":[{"internalType":"address","name":"_pvlt","type":"address"},{"internalType":"address","name":"_treasury","type":"address"}],"stateMutability":"nonpayable","type":"constructor"},{"inputs":[],"name":"buyEnergy","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"claimRewards","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"convertPoints","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getPlayer","outputs":[{"internalType":"uint256","name":"energy","type":"uint256"},{"internalType":"uint256","name":"points","type":"uint256"},{"internalType":"uint256","name":"burnedGPVLT","type":"uint256"},{"internalType":"bool","name":"paidUser","type":"bool"},{"internalType":"uint256","name":"lastClaimDay","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"refillEnergy","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"tap","outputs":[],"stateMutability":"nonpayable","type":"function"}];
        
        let contract, signer;

        async function connect() {
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            contract = new ethers.Contract(GAME_ADDR, ABI, signer);
            refresh();
        }

        async function refresh() {
            const p = await contract.getPlayer(await signer.getAddress());
            document.getElementById('energy').innerText = p.energy.toString();
            document.getElementById('points').innerText = p.points.toString();
            document.getElementById('burned').innerText = p.burnedGPVLT.toString();
        }

        async function interact(fn) {
            try { (await contract[fn]()).wait().then(refresh); } 
            catch (e) { alert(e.reason || "Action failed"); }
        }

        async function buyEnergyFlow() {
            const token = new ethers.Contract(PVLT_ADDR, ["function approve(address,uint256) external returns(bool)"], signer);
            await (await token.approve(GAME_ADDR, ethers.parseEther("100"))).wait();
            interact('buyEnergy');
        }

        window.onload = connect;
    </script>
</body>
</html>
