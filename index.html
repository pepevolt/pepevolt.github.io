<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
/>

<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>

:root{
    --bg:#07111f;
    --card:#111c31;
    --green:#59e3bb;
    --greenDark:#27b58f;
    --text:#ffffff;
    --muted:#9ca9c7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:manipulation;
    font-family:Arial,sans-serif;
    background:
    radial-gradient(circle at top,
    #22396f 0%,
    #07111f 60%);
    color:var(--text);
    position:fixed;
    inset:0;
}

/* MAIN APP */

.app{
    width:100%;
    max-width:500px;
    height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* HEADER */

.header{
    width:100%;
    padding:
    calc(env(safe-area-inset-top) + 12px)
    14px
    14px
    14px;

    display:flex;
    justify-content:space-between;
    gap:10px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);

    border-bottom:
    1px solid rgba(255,255,255,0.06);

    flex-shrink:0;
}

.stat-box{
    flex:1;
    background:rgba(255,255,255,0.05);
    border-radius:18px;
    padding:12px 8px;
    text-align:center;
}

.stat-icon{
    font-size:24px;
    margin-bottom:5px;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
}

.stat-label{
    margin-top:3px;
    font-size:12px;
    color:var(--muted);
}

/* CONTENT */

.content{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:22px 18px 140px;
    -webkit-overflow-scrolling:touch;
}

/* TAP AREA */

.tap-section{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.tap-ring{
    width:290px;
    height:290px;
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle,
    rgba(89,227,187,0.28),
    rgba(89,227,187,0.04));

    margin-top:18px;
    margin-bottom:25px;
}

.tap-btn{
    width:230px;
    height:230px;
    border:none;
    border-radius:50%;

    background:
    linear-gradient(
    180deg,
    #6cf3d0,
    #3fd0aa);

    color:#1163ff;
    font-size:52px;
    font-weight:900;

    box-shadow:
    0 14px 0 #239578,
    0 0 45px rgba(89,227,187,0.4);

    transition:0.08s ease;
    user-select:none;
}

.tap-btn:active{
    transform:translateY(8px);

    box-shadow:
    0 6px 0 #239578,
    0 0 20px rgba(89,227,187,0.3);
}

/* BUTTONS */

.btn{
    width:100%;
    border:none;
    border-radius:20px;
    padding:18px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.connect-btn{
    background:#ef4b3f;
    color:white;
    margin-bottom:18px;
}

.action-btn{
    background:var(--green);
    color:#07111f;
    margin-top:14px;
}

/* PROGRESS */

.progress-wrap{
    width:100%;
    height:26px;
    background:rgba(255,255,255,0.08);
    border-radius:40px;
    overflow:hidden;
    margin-bottom:18px;
}

.progress{
    width:0%;
    height:100%;
    background:var(--green);
    border-radius:40px;
    transition:0.25s;
}

/* BALANCE */

.balance{
    text-align:center;
    margin-bottom:20px;
}

.balance-title{
    color:var(--muted);
    margin-bottom:8px;
    font-size:15px;
}

.balance-value{
    font-size:32px;
    font-weight:900;
}

/* CARD */

.card{
    width:100%;
    background:rgba(255,255,255,0.06);
    border:
    1px solid rgba(255,255,255,0.06);

    border-radius:24px;
    padding:20px;
    margin-top:18px;
}

.card h2{
    font-size:24px;
    text-align:center;
    margin-bottom:18px;
}

.rules{
    line-height:1.8;
    color:#d8e2ff;
    font-size:15px;
}

/* STATUS */

.status{
    margin-top:18px;
    text-align:center;
    color:var(--green);
    font-size:15px;
    word-break:break-word;
}

/* FLOAT TEXT */

.float{
    position:fixed;
    color:var(--green);
    font-size:32px;
    font-weight:bold;
    pointer-events:none;
    animation:floatUp 1s linear forwards;
    z-index:9999;
}

@keyframes floatUp{
    0%{
        opacity:1;
        transform:translateY(0);
    }
    100%{
        opacity:0;
        transform:translateY(-90px);
    }
}

/* MOBILE FIX */

button,
input,
select,
textarea{
    font-size:16px;
}

/* SMALL DEVICE */

@media(max-width:420px){

    .tap-ring{
        width:250px;
        height:250px;
    }

    .tap-btn{
        width:200px;
        height:200px;
        font-size:44px;
    }

    .balance-value{
        font-size:26px;
    }

}

</style>

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="stat-box">
            <div class="stat-icon">⚡</div>
            <div class="stat-value" id="energy">
                0/50
            </div>
            <div class="stat-label">
                Energy
            </div>
        </div>

        <div class="stat-box">
            <div class="stat-icon">💎</div>
            <div class="stat-value" id="points">
                0
            </div>
            <div class="stat-label">
                Points
            </div>
        </div>

        <div class="stat-box">
            <div class="stat-icon">🪙</div>
            <div class="stat-value" id="gpvlt">
                0
            </div>
            <div class="stat-label">
                gPVLT
            </div>
        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <div class="tap-section">

            <div class="tap-ring">

                <button
                class="tap-btn"
                id="tapBtn">
                    TAP
                </button>

            </div>

        </div>

        <button
        class="btn connect-btn"
        id="connectBtn">
            Connect Wallet
        </button>

        <div class="progress-wrap">
            <div
            class="progress"
            id="progress"></div>
        </div>

        <div class="balance">

            <div class="balance-title">
                PVLT Balance
            </div>

            <div
            class="balance-value"
            id="pvltBalance">
                0.000
            </div>

        </div>

        <button
        class="btn action-btn"
        id="convertBtn">
            Convert 10 Points → 1 gPVLT
        </button>

        <button
        class="btn action-btn"
        id="claimBtn">
            Claim PVLT Rewards
        </button>

        <button
        class="btn action-btn"
        id="refillBtn">
            Refill Energy
        </button>

        <div class="card">

            <h2>
                Reward Rules
            </h2>

            <div class="rules">
                • 1 Tap = 1 Point<br>
                • 10 Points = 1 gPVLT<br>
                • 10 gPVLT = 1 PVLT<br>
                • Minimum Claim = 1 PVLT<br>
                • Max Daily Claim = 100 PVLT
            </div>

        </div>

        <div
        class="status"
        id="status">
            Ready
        </div>

    </div>

</div>

<script>

/* =========================
   CONFIG
========================= */

const GAME_ADDRESS =
"0x151803532A33837E4bBc2";

const TREASURY_ADDRESS =
"0x3c25FE15e6fa0Eeb226Af53D1c9D8f8FA8BA21bc";

const PVLT_ADDRESS =
"0xb8010fD52D5208eC05574a7D5A939c0d446A862a";

const CHAIN_ID = 137;

/* =========================
   ABI
========================= */

const GAME_ABI = [
"function tap() external",
"function convertPoints() external",
"function refillEnergy() external",
"function players(address) view returns(uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"
];

const TREASURY_ABI = [
"function claimRewards() external"
];

const ERC20_ABI = [
"function balanceOf(address) view returns(uint256)"
];

/* =========================
   GLOBALS
========================= */

let provider;
let signer;
let userAddress;

let game;
let treasury;
let pvlt;

/* =========================
   ELEMENTS
========================= */

const connectBtn =
document.getElementById("connectBtn");

const tapBtn =
document.getElementById("tapBtn");

const convertBtn =
document.getElementById("convertBtn");

const refillBtn =
document.getElementById("refillBtn");

const claimBtn =
document.getElementById("claimBtn");

const energyEl =
document.getElementById("energy");

const pointsEl =
document.getElementById("points");

const gpvltEl =
document.getElementById("gpvlt");

const progressEl =
document.getElementById("progress");

const pvltBalanceEl =
document.getElementById("pvltBalance");

const statusEl =
document.getElementById("status");

/* =========================
   CONNECT WALLET
========================= */

async function connectWallet(){

    try{

        if(!window.ethereum){
            alert("Install MetaMask");
            return;
        }

        provider =
        new ethers.providers.Web3Provider(window.ethereum);

        await provider.send(
            "eth_requestAccounts",
            []
        );

        signer = provider.getSigner();

        userAddress =
        await signer.getAddress();

        const network =
        await provider.getNetwork();

        if(network.chainId !== CHAIN_ID){
            alert("Switch to Polygon Mainnet");
            return;
        }

        game =
        new ethers.Contract(
            GAME_ADDRESS,
            GAME_ABI,
            signer
        );

        treasury =
        new ethers.Contract(
            TREASURY_ADDRESS,
            TREASURY_ABI,
            signer
        );

        pvlt =
        new ethers.Contract(
            PVLT_ADDRESS,
            ERC20_ABI,
            provider
        );

        connectBtn.innerHTML =
        "Wallet Connected";

        statusEl.innerHTML =
        "Connected Successfully";

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Wallet Connection Failed";

    }

}

/* =========================
   LOAD PLAYER
========================= */

async function loadPlayer(){

    try{

        if(!userAddress) return;

        const data =
        await game.players(userAddress);

        const energy =
        Number(data.energy);

        const points =
        Number(data.points);

        const gpvlt =
        Number(data.burnedGPVLT);

        const balance =
        await pvlt.balanceOf(userAddress);

        const pvltFormatted =
        ethers.utils.formatEther(balance);

        energyEl.innerHTML =
        energy + "/50";

        pointsEl.innerHTML =
        points;

        gpvltEl.innerHTML =
        gpvlt;

        pvltBalanceEl.innerHTML =
        Number(pvltFormatted).toFixed(3);

        const progress =
        Math.min(
        (points / 10) * 100,
        100
        );

        progressEl.style.width =
        progress + "%";

    }catch(err){

        console.log(err);

    }

}

/* =========================
   FLOAT EFFECT
========================= */

function showFloat(){

    const div =
    document.createElement("div");

    div.className = "float";

    div.innerHTML = "+1";

    const rect =
    tapBtn.getBoundingClientRect();

    div.style.left =
    rect.left + rect.width/2 + "px";

    div.style.top =
    rect.top + "px";

    document.body.appendChild(div);

    setTimeout(()=>{
        div.remove();
    },1000);

}

/* =========================
   TAP
========================= */

async function tap(){

    try{

        if(!game){
            alert("Connect Wallet");
            return;
        }

        showFloat();

        const tx =
        await game.tap();

        await tx.wait();

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Tap Failed";

    }

}

/* =========================
   CONVERT
========================= */

async function convert(){

    try{

        const tx =
        await game.convertPoints();

        statusEl.innerHTML =
        "Converting Points...";

        await tx.wait();

        statusEl.innerHTML =
        "Converted Successfully";

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Convert Failed";

    }

}

/* =========================
   CLAIM
========================= */

async function claim(){

    try{

        const tx =
        await treasury.claimRewards();

        statusEl.innerHTML =
        "Claiming Rewards...";

        await tx.wait();

        statusEl.innerHTML =
        "Rewards Claimed";

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Claim Failed";

    }

}

/* =========================
   REFILL
========================= */

async function refill(){

    try{

        const tx =
        await game.refillEnergy();

        statusEl.innerHTML =
        "Refilling Energy...";

        await tx.wait();

        statusEl.innerHTML =
        "Energy Refilled";

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Refill Failed";

    }

}

/* =========================
   EVENTS
========================= */

connectBtn.addEventListener(
"click",
connectWallet
);

tapBtn.addEventListener(
"click",
tap
);

convertBtn.addEventListener(
"click",
convert
);

claimBtn.addEventListener(
"click",
claim
);

refillBtn.addEventListener(
"click",
refill
);

</script>

</body>
</html>
