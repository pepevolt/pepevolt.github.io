<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f0f12;
            font-family: sans-serif;
        }
        #connect-button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #3b82f6;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }
        #connect-button:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <button id="connect-button">Connect Wallet</button>

    <script type="module">
        import { createWeb3Modal, defaultConfig } from 'https://cdn.jsdelivr.net/npm/@web3modal/ethers@latest/+esm'

        // IMPORTANT: Replace this with your own ID from https://cloud.walletconnect.com/
        const projectId = '1731f99148b9cf6107dee70b6efb14b7' 

        const metadata = {
            name: 'My Website',
            description: 'Connect Wallet Example',
            url: window.location.origin, 
            icons: ['https://avatars.githubusercontent.com/u/37784886']
        }

        const modal = createWeb3Modal({
            ethersConfig: defaultConfig({ metadata }),
            chains: [{
                chainId: 1,
                name: 'Ethereum',
                currency: 'ETH',
                explorerUrl: 'https://etherscan.io',
                rpcUrl: 'https://cloudflare-eth.com'
            }],
            projectId
        })

        document.getElementById('connect-button').addEventListener('click', () => {
            modal.open()
        })
    </script>
</body>
</html>
