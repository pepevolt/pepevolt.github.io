<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PVLT Mining</title>

<style>

body{
margin:0;
font-family:Arial;
background:#08111f;
color:white;
text-align:center;
overflow:hidden;
}

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:40px;

background:linear-gradient(135deg,#00ff99,#00ccff);
font-size:28px;
font-weight:bold;
color:black;
}

.card{
margin-top:20px;
padding:15px;
background:rgba(255,255,255,0.05);
border-radius:14px;
}

input,button{
width:95%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
}

button{
background:linear-gradient(90deg,#00ff99,#00ccff);
font-weight:bold;
}

</style>

</head>

<body>

<div class="nav">
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0.0000</span></div>
<div>👤 <span id="wallet">guest</span></div>
</div>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">

<input id="walletInput" placeholder="Paste BSC wallet">

<button onclick="connect()">CONNECT</button>

</div>

<script>

const API = "https://your-backend.onrender.com";

let wallet="";
let signature="";
let points=0;

async function connect(){

wallet=document.getElementById("walletInput").value;

let r=await fetch(API+"/connect",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet})
});

let d=await r.json();

points=d.points;

update();

}

async function tap(){

let r=await fetch(API+"/mine",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet})
});

let d=await r.json();

points=d.points;
signature=d.signature;

update();

}

function update(){

document.getElementById("points").innerText=points;
document.getElementById("tokens").innerText=(points/10000).toFixed(4);

document.getElementById("wallet").innerText=
wallet.slice(0,6)+"..."+wallet.slice(-4);

}

</script>

</body>
</html>
