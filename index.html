<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PepeVolt</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#07111f;
  color:white;
  display:flex;
  justify-content:center;
}

.app {
  width: 100vw; /* Use viewport width */
  max-width: 430px;
  height: 100dvh; /* Dynamic viewport height for mobile browsers */
  padding: 16px;
  box-sizing: border-box; /* Crucial: includes padding in total width/height */
  display: flex;
  flex-direction: column;
  gap: 15px; /* Adds consistent spacing between components */
}

.top{
  display:flex;
  gap:10px;
}

.box{
  flex:1;
  background:#ffffff10;
  padding:10px;
  border-radius:12px;
  text-align:center;
}

.center {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden; /* Prevents button overflow */
}

.circle{
  width:220px;
  height:220px;
  border-radius:50%;
  background:orange;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

button {
  width: 100%; /* Ensures full width */
  box-sizing: border-box;
}


.buy{background:#00cec9;color:white;}
.claim{background:#ff7b54;color:white;}
.connect{background:#00b894;color:white;}

</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="box">⚡ <div id="energy">100</div></div>
    <div class="box">💎 <div id="points">0</div></div>
    <div class="box">🪙 <div id="pvlt">0</div></div>
  </div>

  <button class="connect" id="connectBtn">Connect Wallet</button>

  <div class="center">
    <div class="circle" id="tapBtn">TAP</div>
  </div>

  <button class="buy" id="buyBtn">Buy 10000 Energy (100 PVLT)</button>
  <button class="claim" id="claimBtn">Claim PVLT</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<script>

const GAME_CONTRACT_ADDRESS="0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";
const PVLT_ADDRESS="0x5f7df6862f439b691507dc20069f4f73a37cb08b";

const ABI_GAME=[
"function tap()",
"function buyEnergy()",
"function claim()",
"function getPlayer(address) view returns(uint256,uint256,uint256)"
];

const ABI_ERC20=[
"function approve(address,uint256) returns(bool)"
];

let provider,signer,game,user;

let energy=100,points=0,pvlt=0;
let connected=false;

const energyEl=document.getElementById("energy");
const pointsEl=document.getElementById("points");
const pvltEl=document.getElementById("pvlt");

document.getElementById("connectBtn").onclick=async()=>{

  await ethereum.request({method:"eth_requestAccounts"});

  provider=new ethers.providers.Web3Provider(window.ethereum);
  signer=provider.getSigner();

  user=await signer.getAddress();

  game=new ethers.Contract(GAME_CONTRACT_ADDRESS,ABI_GAME,signer);

  connected=true;
};

document.getElementById("tapBtn").onclick=async()=>{

  if(!connected) return alert("Connect wallet");

  await game.tap();

  const data=await game.getPlayer(user);

  energy=data[0].toNumber();
  points=data[1].toNumber();
  pvlt=data[2].toNumber();

  energyEl.innerText=energy;
  pointsEl.innerText=points;
  pvltEl.innerText=pvlt;
};

document.getElementById("buyBtn").onclick=async()=>{

  const token=new ethers.Contract(PVLT_ADDRESS,ABI_ERC20,signer);

  await token.approve(GAME_CONTRACT_ADDRESS,ethers.utils.parseEther("100"));
  await game.buyEnergy();

};

document.getElementById("claimBtn").onclick=async()=>{

  await game.claim();

  const data=await game.getPlayer(user);

  pvlt=data[2].toNumber();
  pvltEl.innerText=pvlt;

};

</script>

</body>
</html>
