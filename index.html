<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPE VOLT Mini App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b1020;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

.container{
    max-width:420px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    margin-top:20px;
    border:4px solid #00ff99;
    object-fit:cover;
    box-shadow:0 0 20px #00ff99;
}

h1{
    margin-top:20px;
    font-size:32px;
    color:#00ff99;
}

.subtitle{
    color:#94a3b8;
    margin-top:10px;
    font-size:14px;
}

.contract{
    margin-top:15px;
    background:#111827;
    padding:12px;
    border-radius:12px;
    font-size:12px;
    word-break:break-all;
}

.card{
    background:#111827;
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    box-shadow:0 0 15px rgba(0,255,153,0.1);
}

.balance{
    font-size:28px;
    margin-top:10px;
    color:#00ff99;
    font-weight:bold;
}

button,
.buy-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    margin-top:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.connect-btn{
    background:#00ff99;
    color:black;
}

.buy-btn{
    background:#facc15;
    color:black;
    text-decoration:none;
    display:block;
}

.footer{
    margin-top:25px;
    color:#64748b;
    font-size:12px;
}

.stats{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.stat-box{
    flex:1;
    background:#111827;
    padding:15px;
    border-radius:15px;
}

.stat-box h3{
    color:#00ff99;
    margin-bottom:8px;
}

.glow{
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        box-shadow:0 0 10px #00ff99;
    }
    to{
        box-shadow:0 0 25px #00ff99;
    }
}
</style>
</head>

<body>

<div class="container">

    <img
        src="https://i.imgur.com/8Km9tLL.png"
        class="logo glow"
    >

    <h1>PEPE VOLT</h1>

    <p class="subtitle">
        BSC Meme Token Powered By Telegram
    </p>

    <div class="contract">
        0xa263d765b897b4777f0ad4a938d12d79e789ffff
    </div>

    <button class="connect-btn" id="connectBtn">
        Connect Wallet
    </button>

    <div class="card">
        <h2>Your Balance</h2>

        <div class="balance" id="balance">
            0 PVLT
        </div>
    </div>

    <div class="stats">

        <div class="stat-box">
            <h3>Network</h3>
            <p>BSC</p>
        </div>

        <div class="stat-box">
            <h3>Status</h3>
            <p>Live</p>
        </div>

    </div>

    <a
        class="buy-btn"
        href="https://pancakeswap.finance/swap?outputCurrency=0xa263d765b897b4777f0ad4a938d12d79e789ffff"
        target="_blank"
    >
        Buy On PancakeSwap
    </a>

    <div class="footer">
        Powered by PEPE VOLT • Telegram Mini App
    </div>

</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

const tokenAddress =
"0xa263d765b897b4777f0ad4a938d12d79e789ffff";

const abi = [
    "function balanceOf(address owner) view returns (uint256)",
    "function decimals() view returns (uint8)"
];

let provider;
let signer;
let userAddress;

async function connectWallet(){

    if(typeof window.ethereum === "undefined"){
        alert("Please install MetaMask or Trust Wallet");
        return;
    }

    try{

        provider =
        new ethers.providers.Web3Provider(window.ethereum);

        await provider.send("eth_requestAccounts", []);

        signer = provider.getSigner();

        userAddress = await signer.getAddress();

        document.getElementById("connectBtn").innerText =
        userAddress.substring(0,6)
        + "..."
        + userAddress.substring(userAddress.length - 4);

        loadBalance();

    }catch(err){

        console.log(err);

        alert("Wallet connection failed");

    }
}

async function loadBalance(){

    try{

        const contract =
        new ethers.Contract(
            tokenAddress,
            abi,
            provider
        );

        const balance =
        await contract.balanceOf(userAddress);

        const decimals =
        await contract.decimals();

        const formatted =
        ethers.utils.formatUnits(balance, decimals);

        document.getElementById("balance").innerText =
        parseFloat(formatted).toFixed(2)
        + " PVLT";

    }catch(err){

        console.log(err);

    }
}

document
.getElementById("connectBtn")
.addEventListener("click", connectWallet);
</script>

</body>
</html>
