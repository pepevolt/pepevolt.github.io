<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pepevolt Token Miner</title>
    <style>
        :root {
            --bg-color: #080b10;
            --card-color: #0f141c;
            --accent-color: #00ff66; /* Pepe Green */
            --accent-hover: #33ff88;
            --text-color: #ffffff;
            --gold-color: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed viewport handling for modern mobile browsers */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        body {
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container scales nicely on desktop, but goes true full-screen on mobile */
        .game-container {
            width: 100%;
            height: 100%;
            background-color: var(--card-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        @media (min-width: 480px) {
            .game-container {
                max-width: 430px;
                max-height: 850px;
                border-radius: 32px;
                height: 92vh;
                box-shadow: 0 0 40px rgba(0, 255, 102, 0.15);
                border: 1px solid rgba(0, 255, 102, 0.1);
            }
        }

        /* Screen standardizations */
        .screen {
            position: absolute;
            top: env(safe-area-inset-top, 0);
            bottom: env(safe-area-inset-bottom, 0);
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            z-index: 5;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            background: linear-gradient(45deg, var(--accent-color), #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0,255,102,0.3));
        }

        p {
            color: #64748b;
            margin-bottom: 2rem;
            text-align: center;
            line-height: 1.5;
            max-width: 85%;
            font-size: 0.95rem;
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
            width: 85%;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background-color: transparent;
            color: #64748b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 1rem;
            box-shadow: none;
        }

        /* Fixed Top HUD System */
        .hud {
            width: 100%;
            display: flex;
            justify-between;
            gap: 12px;
            padding: 16px;
            z-index: 20;
            position: absolute;
            top: 0;
            left: 0;
        }

        .hud-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .hud-item strong {
            display: block;
            font-size: 1.2rem;
            color: #fff;
            margin-top: 2px;
        }

        #score-display {
            color: var(--accent-color);
        }

        /* True Play Area Mechanics */
        .play-area {
            position: absolute;
            top: 90px; /* Safe padding below HUD layout */
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        /* Beautiful Neon Pepe Coin Target */
        .token-target {
            width: 95px;
            height: 95px;
            background: radial-gradient(circle, #00ff66 0%, #054019 100%);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.6), inset 0 0 15px rgba(255,255,255,0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            border: 3px solid #ffffff;
            touch-action: manipulation;
        }

        /* Dynamic Pop Element */
        .pop {
            position: absolute;
            color: var(--accent-color);
            font-weight: 800;
            font-size: 1.5rem;
            animation: floatUp 0.5s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            z-index: 30;
        }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) translateY(-80px) scale(1.3); opacity: 0; }
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.02);
            width: 85%;
            padding: 24px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="start-screen" class="screen">
            <div style="font-size: 4.5rem; margin-bottom: 1rem;">⚡🐸</div>
            <h1>PEPEVOLT</h1>
            <p>Tap the lightning Pepe coin before the timer runs dry to claim your allocation!</p>
            <button class="btn" onclick="startGame()">Start Mining</button>
        </div>

        <div id="game-screen" class="screen hidden" style="padding: 0;">
            <div class="hud">
                <div class="hud-item">Mined: <strong id="score-display">0 $VOLT</strong></div>
                <div class="hud-item">Time Left: <strong id="time-display">15s</strong></div>
            </div>
            <div class="play-area" id="play-area">
                <div id="target" class="token-target">🐸</div>
            </div>
        </div>

        <div id="end-screen" class="screen hidden">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🎉</div>
            <h1>Round Done</h1>
            <p>Your mining session secure. Claim your $VOLT tokens directly to your web3 stack.</p>
            
            <div class="stat-box">
                <div style="color: #64748b; font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; margin-bottom: 5px;">ACCUMULATED BALANCE</div>
                <div style="font-size: 2.5rem; font-weight: 800; color: var(--accent-color);">
                    <span id="final-score">0</span> $VOLT
                </div>
            </div>

            <button class="btn" id="claim-btn" onclick="claimTokens()">Claim Rewards</button>
            <button class="btn btn-secondary" onclick="showScreen('start-screen')">Mine Again</button>
        </div>

    </div>

    <script>
        let score = 0;
        let timeLeft = 15; 
        let gameInterval;
        const gameDuration = 15; 

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        
        const target = document.getElementById('target');
        const playArea = document.getElementById('play-area');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const finalScore = document.getElementById('final-score');
        const claimBtn = document.getElementById('claim-btn');

        function showScreen(screenId) {
            startScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame() {
            score = 0;
            timeLeft = gameDuration;
            scoreDisplay.textContent = `${score} $VOLT`;
            timeDisplay.textContent = `${timeLeft}s`;
            claimBtn.textContent = "Claim Rewards";
            claimBtn.disabled = false;
            
            showScreen('game-screen');
            moveTarget();
            
            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function moveTarget() {
            const areaWidth = playArea.clientWidth;
            const areaHeight = playArea.clientHeight;
            
            // Safe bounds margins so it never overlaps edges or the HUD container top boundary
            const paddingX = 55;
            const paddingY = 60; 
            
            const randomX = Math.random() * (areaWidth - paddingX * 2) + paddingX;
            const randomY = Math.random() * (areaHeight - paddingY * 2) + paddingY;

            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;
        }

        // Pointerdown handles modern mobile touch intervals much faster than 'click'
        target.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            score += 1;
            scoreDisplay.textContent = `${score} $VOLT`;
            
            // Calculate absolute coords inside viewport
            createPopEffect(e.clientX, e.clientY);
            moveTarget();
        });

        function createPopEffect(x, y) {
            const pop = document.createElement('div');
            pop.classList.add('pop');
            pop.textContent = '+1 $VOLT';
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;
            
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 500);
        }

        function endGame() {
            clearInterval(gameInterval);
            finalScore.textContent = score;
            showScreen('end-screen');
        }

        function claimTokens() {
            claimBtn.textContent = "Signing Block Transaction...";
            claimBtn.disabled = true;

            setTimeout(() => {
                claimBtn.textContent = "Success! Deposited";
                alert(`Successfully minted and pushed ${score} $VOLT to your linked application profile!`);
            }, 1600);
        }
    </script>
</body>
</html>
