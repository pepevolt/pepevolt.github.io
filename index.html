<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PVLT Tap-to-Earn | Real Tokenomics</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #0f142e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-card {
            max-width: 500px;
            width: 100%;
            background: rgba(15, 25, 45, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(80, 140, 255, 0.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .stat {
            background: rgba(0,0,0,0.4);
            border-radius: 24px;
            padding: 12px 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #8a9fd0;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #ffd966;
            line-height: 1;
        }

        .stat-sub {
            font-size: 10px;
            color: #6c86a8;
        }

        .tap-button {
            background: radial-gradient(circle at 30% 25%, #ffcc44, #ff9900);
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s linear;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border: 3px solid #fff3bf;
        }

        .tap-button:active {
            transform: scale(0.94);
        }

        .tap-emoji {
            font-size: 70px;
        }

        .energy-bar {
            background: #1e2a3a;
            border-radius: 20px;
            height: 12px;
            margin: 20px 0 8px;
            overflow: hidden;
        }

        .energy-fill {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            width: 100%;
            height: 100%;
            transition: width 0.1s;
        }

        .energy-text {
            font-size: 12px;
            color: #a0b8d4;
            text-align: center;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin: 24px 0 16px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.7;
        }

        .btn-buy {
            background: #9b59b6;
            color: white;
        }

        .btn-claim {
            background: #27ae60;
            color: white;
        }

        .message {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 12px;
            font-size: 12px;
            text-align: center;
            color: #ecf0f1;
            margin-top: 16px;
        }

        .wallet-info {
            font-size: 10px;
            text-align: center;
            margin-top: 12px;
            color: #5a73a0;
        }
    </style>
</head>
<body>
<div class="game-card">
    <div class="stats">
        <div class="stat">
            <div class="stat-label">⚡ ENERGY</div>
            <div class="stat-number" id="energyDisplay">50</div>
            <div class="stat-sub">/ 50 max</div>
        </div>
        <div class="stat">
            <div class="stat-label">💎 POINTS</div>
            <div class="stat-number" id="pointsDisplay">0</div>
            <div class="stat-sub">100 → 1 gPVLT</div>
        </div>
        <div class="stat">
            <div class="stat-label">🏅 gPVLT</div>
            <div class="stat-number" id="gpvltDisplay">0</div>
            <div class="stat-sub">100 → 1 PVLT</div>
        </div>
    </div>

    <div class="tap-button" id="tapBtn">
        <div class="tap-emoji">👆 TAP</div>
    </div>

    <div class="energy-bar">
        <div class="energy-fill" id="energyFill"></div>
    </div>
    <div class="energy-text" id="energyStatus">⚡ +5 energy per second (max 50)</div>

    <div class="buttons">
        <button class="btn-buy" id="buyBtn">💎 Buy Energy<br><small>100 PVLT → 10k Energy</small></button>
        <button class="btn-claim" id="claimBtn">🪙 Claim PVLT<br><small>Burn 100 gPVLT → 1 PVLT</small></button>
    </div>

    <div class="message" id="messageBox">
        👆 Tap to earn! Points auto-convert to gPVLT at 100 points.
    </div>
    <div class="wallet-info" id="walletStatus">
        🔗 Connect Wallet to buy energy & claim PVLT on Polygon
    </div>
</div>

<script>
    // ========== CORRECTED IMPLEMENTATION ==========
    // Following rules exactly:
    // 1 energy = 1 tap, 1 tap = 1 point
    // 100 points = 1 gPVLT (auto convert, off-chain calculation)
    // 100 gPVLT = 1 PVLT (on-chain burn & mint, requires wallet)
    // Energy: off-chain but tracked on-chain for premium, free user max 50 with 5/sec regen
    // Buy: 100 PVLT for 10000 energy (Polygon tx required)
    
    // Game state
    let energy = 50;           // current energy
    let points = 0;            // off-chain points
    let gpvlt = 0;             // gPVLT (on-chain representation)
    let pvltBalance = 0;       // real PVLT in wallet (would query from contract)
    
    // Daily claim tracking (per wallet address)
    let dailyClaimed = 0;
    let lastClaimDate = new Date().toDateString();
    
    // Wallet connection
    let userWallet = null;
    
    // DOM elements
    const energyDisplay = document.getElementById('energyDisplay');
    const pointsDisplay = document.getElementById('pointsDisplay');
    const gpvltDisplay = document.getElementById('gpvltDisplay');
    const energyFill = document.getElementById('energyFill');
    const messageBox = document.getElementById('messageBox');
    const walletStatus = document.getElementById('walletStatus');
    
    function updateUI() {
        energyDisplay.textContent = Math.floor(energy);
        pointsDisplay.textContent = points;
        gpvltDisplay.textContent = gpvlt;
        const percent = (energy / 50) * 100;
        energyFill.style.width = `${Math.min(100, percent)}%`;
    }
    
    function showMessage(msg, isError = false) {
        messageBox.innerHTML = msg;
        messageBox.style.background = isError ? 'rgba(231, 76, 60, 0.3)' : 'rgba(0,0,0,0.5)';
        setTimeout(() => {
            if (messageBox.innerHTML === msg) {
                messageBox.style.background = 'rgba(0,0,0,0.5)';
                messageBox.innerHTML = '👆 Tap to earn! Points auto-convert to gPVLT at 100 points.';
            }
        }, 3000);
    }
    
    // Auto convert points to gPVLT (off-chain but recorded as on-chain state)
    function convertPointsToGpvlt() {
        if (points >= 100) {
            const convertAmount = Math.floor(points / 100);
            gpvlt += convertAmount;
            points = points % 100;
            showMessage(`✨ Auto-converted ${convertAmount * 100} points → ${convertAmount} gPVLT!`);
            updateUI();
            saveToLocal();
        }
    }
    
    // Tap function
    function tap() {
        if (energy <= 0) {
            showMessage('❌ No energy! Wait 5 seconds or buy energy pack.', true);
            return;
        }
        
        energy--;
        points++;
        
        convertPointsToGpvlt();
        updateUI();
        saveToLocal();
        
        // Visual feedback
        const tapBtn = document.getElementById('tapBtn');
        tapBtn.style.transform = 'scale(0.94)';
        setTimeout(() => { tapBtn.style.transform = ''; }, 80);
    }
    
    // Energy refill (free user: max 50, 5 per second)
    function startEnergyRefill() {
        setInterval(() => {
            if (energy < 50) {
                energy = Math.min(50, energy + 5);
                updateUI();
                saveToLocal();
            }
        }, 1000);
    }
    
    // ========== ON-CHAIN INTERACTIONS (Polygon) ==========
    // In a real implementation, this would interact with actual smart contracts
    // For demo, we simulate with prompts and store state
    
    async function connectWallet() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userWallet = accounts[0];
                walletStatus.innerHTML = `🟢 Connected: ${userWallet.slice(0,6)}...${userWallet.slice(-4)} | PVLT: ${pvltBalance}`;
                showMessage(`✅ Wallet connected! You can now buy energy and claim PVLT.`);
                
                // Reset daily claim for new wallet (in real app, check contract)
                const today = new Date().toDateString();
                if (lastClaimDate !== today) {
                    dailyClaimed = 0;
                    lastClaimDate = today;
                }
                return true;
            } catch (err) {
                showMessage('❌ Failed to connect wallet', true);
                return false;
            }
        } else {
            showMessage('⚠️ Please install MetaMask to use buy/claim features', true);
            return false;
        }
    }
    
    // Buy energy: 100 PVLT → 10000 energy (requires Polygon transaction)
    async function buyEnergy() {
        if (!userWallet) {
            const connected = await connectWallet();
            if (!connected) return;
        }
        
        if (pvltBalance < 100) {
            showMessage(`❌ Need 100 PVLT to buy energy. Your balance: ${pvltBalance} PVLT. Earn by claiming!`, true);
            return;
        }
        
        showMessage('⏳ Processing Polygon transaction...');
        
        // Simulate blockchain transaction
        try {
            // In real implementation: call smart contract buyEnergy function
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Deduct PVLT and add energy
            pvltBalance -= 100;
            energy += 10000;
            
            updateUI();
            saveToLocal();
            walletStatus.innerHTML = `🟢 Connected: ${userWallet.slice(0,6)}... | PVLT: ${pvltBalance}`;
            showMessage(`✅ Energy purchased! +10000 energy (total: ${Math.floor(energy)})`);
        } catch (err) {
            showMessage('❌ Transaction failed', true);
        }
    }
    
    // Claim PVLT: burn 100 gPVLT → receive 1 PVLT (on-chain with daily limit 1-500)
    async function claimPVLT() {
        if (!userWallet) {
            const connected = await connectWallet();
            if (!connected) return;
        }
        
        // Check daily limit
        const today = new Date().toDateString();
        if (lastClaimDate !== today) {
            dailyClaimed = 0;
            lastClaimDate = today;
        }
        
        if (dailyClaimed >= 500) {
            showMessage(`🚫 Daily claim limit reached (500 PVLT max). Come back tomorrow!`, true);
            return;
        }
        
        if (gpvlt < 100) {
            showMessage(`❌ Need 100 gPVLT to claim 1 PVLT. You have ${gpvlt} gPVLT. Keep tapping!`, true);
            return;
        }
        
        // Calculate how many PVLT can claim (respecting daily limit)
        let possibleClaims = Math.floor(gpvlt / 100);
        let allowedClaims = 500 - dailyClaimed;
        let claimAmount = Math.min(possibleClaims, allowedClaims);
        
        if (claimAmount === 0) {
            showMessage(`⚠️ Cannot claim: daily limit would be exceeded. Max ${allowedClaims} more today.`, true);
            return;
        }
        
        const gpvltToBurn = claimAmount * 100;
        
        showMessage(`🔥 Burning ${gpvltToBurn} gPVLT to mint ${claimAmount} PVLT...`);
        
        // Simulate on-chain transaction
        try {
            await new Promise(resolve => setTimeout(resolve, 1200));
            
            // Execute claim
            gpvlt -= gpvltToBurn;
            pvltBalance += claimAmount;
            dailyClaimed += claimAmount;
            
            updateUI();
            saveToLocal();
            walletStatus.innerHTML = `🟢 Connected: ${userWallet.slice(0,6)}... | PVLT: ${pvltBalance}`;
            showMessage(`✅ Claimed ${claimAmount} PVLT! Daily: ${dailyClaimed}/500 PVLT`);
        } catch (err) {
            showMessage('❌ Claim transaction failed', true);
        }
    }
    
    // Persistent storage (off-chain points + simulated on-chain balances)
    function saveToLocal() {
        const data = {
            energy: energy,
            points: points,
            gpvlt: gpvlt,
            pvltBalance: pvltBalance,
            dailyClaimed: dailyClaimed,
            lastClaimDate: lastClaimDate,
            wallet: userWallet
        };
        localStorage.setItem('pvlt_game_data', JSON.stringify(data));
    }
    
    function loadFromLocal() {
        const saved = localStorage.getItem('pvlt_game_data');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                energy = data.energy ?? 50;
                points = data.points ?? 0;
                gpvlt = data.gpvlt ?? 0;
                pvltBalance = data.pvltBalance ?? 0;
                dailyClaimed = data.dailyClaimed ?? 0;
                lastClaimDate = data.lastClaimDate ?? new Date().toDateString();
                userWallet = data.wallet ?? null;
                
                // Reset daily if new day
                const today = new Date().toDateString();
                if (lastClaimDate !== today) {
                    dailyClaimed = 0;
                    lastClaimDate = today;
                }
                
                if (userWallet) {
                    walletStatus.innerHTML = `🟢 Wallet: ${userWallet.slice(0,6)}... | PVLT: ${pvltBalance}`;
                }
                
                updateUI();
            } catch(e) {}
        }
    }
    
    // Event listeners
    document.getElementById('tapBtn').addEventListener('click', tap);
    document.getElementById('buyBtn').addEventListener('click', buyEnergy);
    document.getElementById('claimBtn').addEventListener('click', claimPVLT);
    
    // Initialize
    loadFromLocal();
    startEnergyRefill();
    updateUI();
    
    // Auto-save periodically
    setInterval(saveToLocal, 5000);
</script>
</body>
</html>
