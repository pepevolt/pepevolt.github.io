<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PVLT Mining</title>
</head>

<body style="background:#08111f;color:white;text-align:center;font-family:Arial;">

<h2>PVLT MINING</h2>

<button onclick="tap()" style="
width:200px;height:200px;border-radius:50%;
font-size:30px;background:linear-gradient(90deg,#00ff99,#00ccff);
border:none;">
TAP
</button>

<br><br>

<input id="wallet" placeholder="wallet" style="padding:10px;width:80%">

<button onclick="connect()">CONNECT</button>

<p>Points: <span id="p">0</span></p>

<script>

const API = "https://YOUR-RENDER.onrender.com";

let wallet = "";
let signature = "";

async function connect(){

wallet = document.getElementById("wallet").value;

let r = await fetch(API+"/connect",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet})
});

let d = await r.json();

document.getElementById("p").innerText = d.points;

}

async function tap(){

let r = await fetch(API+"/mine",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet})
});

let d = await r.json();

signature = d.signature;

document.getElementById("p").innerText = d.points;

}

async function claim(){

await fetch(API+"/claim",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
wallet,
signature
})
});

alert("Claim sent");
}

</script>

</body>
</html>
