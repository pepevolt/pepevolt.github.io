<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PepeVolt ⚡ | No TX Tapping</title>
<!-- Ethers.js -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0a0c15;
    color: white;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* TOP NAV */
.top-nav {
    width: 100%;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(8, 18, 32, 0.85);
    backdrop-filter: blur(12px);
    z-index: 10;
    border-bottom: 1px solid rgba(250, 204, 21, 0.2);
}

.stats {
    flex: 1;
    display: flex;
    gap: 10px;
}

.card {
    flex: 1;
    background: #111b2ecc;
    backdrop-filter: blur(4px);
    border-radius: 24px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(255, 215, 0, 0.2);
    transition: 0.2s;
}

.label {
    font-size: 10px;
    opacity: 0.7;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-transform: uppercase;
}

.value {
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, #facc15);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

#connectBtn {
    border: none;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: white;
    padding: 12px 20px;
    border-radius: 44px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid rgba(250, 204, 21, 0.4);
    white-space: nowrap;
}

#connectBtn:active { transform: scale(0.96); }
.wallet-connected { background: #22c55e30 !important; border-color: #22c55e; }

/* CENTER TAP */
.center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding-bottom: 150px;
}

.tap-area {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #facc15, #ea580c, #b91c1c);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: 900;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 0 30px rgba(249, 115, 22, 0.6), inset 0 6px 15px rgba(255, 255, 255, 0.4);
    transition: transform 0.06s linear;
    text-shadow: 0 2px 8px black;
}

.tap-area:active { transform: scale(0.93); }
.tap-disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.2); }

/* FLOATING ANIMATION */
.float {
    position: absolute;
    color: #facc15;
    font-size: 32px;
    font-weight: bold;
    pointer-events: none;
    z-index: 200;
    animation: floatUp 0.85s forwards;
}
.float-pvlt { color: #c084fc; text-shadow: 0 0 6px #a855f7; }
@keyframes floatUp {
    0% { opacity: 1; transform: translateY(0px) scale(0.7); }
    100% { opacity: 0; transform: translateY(-100px) scale(0.5); }
}

/* BOTTOM PANEL */
.bottom-fixed {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0d1728dd;
    backdrop-filter: blur(20px);
    padding: 16px 20px 28px;
    border-top: 1px solid rgba(250, 204, 21, 0.25);
    border-radius: 28px 28px 0 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.energy-bar {
    width: 100%;
    height: 20px;
    background: #1a2940;
    border-radius: 40px;
    overflow: hidden;
}
.energy-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #facc15, #f97316, #ef4444);
    border-radius: 40px;
    transition: 0.25s;
}
.energy-text {
    margin-top: 6px;
    font-size: 11px;
    text-align: center;
    opacity: 0.8;
    display: flex;
    justify-content: center;
    gap: 14px;
}
.action-buttons {
    display: flex;
    gap: 12px;
}
.action-buttons button {
    flex: 1;
    height: 52px;
    border: none;
    border-radius: 44px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.1s;
    color: white;
}
.action-buttons button:active { transform: scale(0.96); }
.buy-btn { background: linear-gradient(135deg, #1e3a8a, #2563eb); }
.claim-btn { background: linear-gradient(135deg, #6b21a5, #9333ea); }
.sync-btn { background: linear-gradient(135deg, #2d3748, #4a5568); }

.toast {
    position: fixed;
    bottom: 30%;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172fe6;
    backdrop-filter: blur(12px);
    padding: 10px 20px;
    border-radius: 60px;
    font-size: 13px;
    font-weight: 600;
    z-index: 1000;
    border: 1px solid #facc15;
    animation: fadeOut 1.8s forwards;
    pointer-events: none;
    white-space: nowrap;
}
@keyframes fadeOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(15px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-15px); }
}

/* Loading spinner */
.loading-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 0.6s linear infinite;
    margin-left: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 560px) {
    .tap-area { width: 210px; height: 210px; font-size: 32px; }
    .top-nav { flex-direction: column; align-items: stretch; }
    .stats { width: 100%; }
    #connectBtn { width: 100%; justify-content: center; }
    .value { font-size: 18px; }
}
</style>
</head>
<body>
<div class="app">
    <div class="top-nav">
        <div class="stats">
            <div class="card"><div class="label">⚡ ENERGY</div><div class="value"><span id="energy">0</span> / <span id="maxEnergy">0</span></div></div>
            <div class="card"><div class="label">💎 POINTS</div><div class="value"><span id="points">0</span></div></div>
            <div class="card"><div class="label">🐸 PVLT</div><div class="value"><span id="pvltBalance">0</span></div></div>
        </div>
        <button id="connectBtn">🔌 CONNECT WALLET</button>
    </div>
    <div class="center">
        <div class="tap-area tap-disabled" id="tapButton">⚡ TAP ⚡</div>
    </div>
</div>
<div class="bottom-fixed">
    <div><div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div><div class="energy-text"><span>🔋 Regen +1 / 3s</span><span>⚡ Max: <span id="maxLabel">0</span></span></div></div>
    <div class="action-buttons">
        <button class="buy-btn" id="buyEnergyBtn">💰 Buy 10K Energy (100 PVLT)</button>
        <button class="claim-btn" id="claimPvltBtn">🎁 Claim PVLT from Points</button>
        <button class="sync-btn" id="syncBtn">🔄 Sync</button>
    </div>
</div>

<script>
    // -------------------- CONTRACT ADDRESSES (POLYGON) --------------------
    const PVLT_ADDRESS = "0x5f7df6862f439b691507dc20069f4f73a37cb08b";
    const GAME_ADDRESS = "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

    // ERC20 ABI (minimal for balance & approve)
    const ERC20_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function approve(address spender, uint256 amount) returns (bool)",
        "function allowance(address owner, address spender) view returns (uint256)",
        "function decimals() view returns (uint8)",
        "function symbol() view returns (string)"
    ];

    // GAME CONTRACT ABI (view functions + buyEnergy & claimPVLT - NO tap transaction)
    // tap() is NOT called on-chain to avoid tx costs. We handle tapping locally.
    const GAME_ABI = [
        "function buyEnergy(uint256 amount) external",
        "function claimPVLT() external",
        "function getEnergy(address player) view returns (uint256)",
        "function getPoints(address player) view returns (uint256)",
        "function getMaxEnergy(address player) view returns (uint256)",
        "function pointsToPVLTRate() view returns (uint256)"
    ];

    // -------------------- GLOBAL STATE --------------------
    let signer = null;
    let provider = null;
    let userAddress = null;
    let connected = false;

    // LOCAL game state (no transaction on tap)
    let energy = 0;
    let maxEnergy = 0;
    let points = 0;
    let pvltBalance = 0;

    // Contract instances
    let pvltContract = null;
    let gameContract = null;

    // DOM elements
    const energySpan = document.getElementById("energy");
    const maxEnergySpan = document.getElementById("maxEnergy");
    const pointsSpan = document.getElementById("points");
    const pvltBalanceSpan = document.getElementById("pvltBalance");
    const energyFillDiv = document.getElementById("energyFill");
    const maxLabelSpan = document.getElementById("maxLabel");
    const tapButton = document.getElementById("tapButton");
    const connectBtn = document.getElementById("connectBtn");
    const buyBtn = document.getElementById("buyEnergyBtn");
    const claimBtn = document.getElementById("claimPvltBtn");
    const syncBtn = document.getElementById("syncBtn");

    // Helper: Toast
    function showToast(msg, isError = false) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerText = msg;
        if (isError) toast.style.borderColor = "#f97316";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // Update UI from local state
    function updateUI() {
        energySpan.innerText = Math.floor(energy);
        maxEnergySpan.innerText = Math.floor(maxEnergy);
        pointsSpan.innerText = Math.floor(points);
        pvltBalanceSpan.innerText = pvltBalance.toFixed(2);
        maxLabelSpan.innerText = Math.floor(maxEnergy);
        let percent = (energy / maxEnergy) * 100;
        if (isNaN(percent)) percent = 0;
        energyFillDiv.style.width = Math.min(100, Math.max(0, percent)) + "%";
    }

    // Save local game state to localStorage (persistence)
    function saveLocalState() {
        if (!userAddress) return;
        const key = `pepevolt_${userAddress.toLowerCase()}`;
        const state = { energy, maxEnergy, points, pvltBalance, timestamp: Date.now() };
        localStorage.setItem(key, JSON.stringify(state));
    }

    function loadLocalState() {
        if (!userAddress) return false;
        const key = `pepevolt_${userAddress.toLowerCase()}`;
        const saved = localStorage.getItem(key);
        if (saved) {
            try {
                const state = JSON.parse(saved);
                energy = state.energy || 50;
                maxEnergy = state.maxEnergy || 50;
                points = state.points || 0;
                pvltBalance = state.pvltBalance || 0;
                updateUI();
                return true;
            } catch(e) {}
        }
        return false;
    }

    // Fetch on-chain data (PVLT balance only, plus game stats if available)
    async function fetchOnChainData() {
        if (!connected || !gameContract || !pvltContract) return;
        try {
            // Fetch PVLT balance
            const pvltWei = await pvltContract.balanceOf(userAddress);
            pvltBalance = Number(ethers.utils.formatEther(pvltWei));
            
            // Try to get game stats from contract (if they exist, otherwise keep local)
            try {
                const energyVal = await gameContract.getEnergy(userAddress);
                const pointsVal = await gameContract.getPoints(userAddress);
                const maxEnergyVal = await gameContract.getMaxEnergy(userAddress);
                // Only override if contract returns non-zero (some contracts may not have these)
                if (maxEnergyVal > 0) {
                    energy = Number(energyVal);
                    points = Number(pointsVal);
                    maxEnergy = Number(maxEnergyVal);
                }
            } catch (err) {
                console.log("Contract view functions not available, keeping local state");
            }
            updateUI();
            saveLocalState();
        } catch (err) {
            console.warn("fetchOnChainData error:", err);
        }
    }

    // ---------- TAP LOGIC (NO TRANSACTION - pure local) ----------
    function performTap(e) {
        if (!connected) {
            showToast("🔌 Connect wallet first", true);
            return;
        }
        if (energy <= 0) {
            showToast("💔 No energy! Wait or buy more", true);
            return;
        }
        
        // Consume energy, gain points
        energy--;
        points++;
        
        // Auto-convert points to PVLT (100 points = 1 PVLT) - locally
        let pvltGained = 0;
        if (points >= 100) {
            pvltGained = Math.floor(points / 100);
            pvltBalance += pvltGained;
            points = points % 100;
        }
        
        updateUI();
        saveLocalState();
        
        // Floating effect
        const coords = getTapCoords(e);
        showFloating("+1 ⚡", coords.x, coords.y);
        if (pvltGained > 0) {
            showFloating(`+${pvltGained} 🐸 PVLT`, coords.x - 15, coords.y - 35, true);
        }
        
        // Visual feedback
        tapButton.style.transform = "scale(0.93)";
        setTimeout(() => { if (tapButton) tapButton.style.transform = ""; }, 90);
    }

    function getTapCoords(e) {
        let clientX, clientY;
        if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
        else { clientX = e.clientX; clientY = e.clientY; }
        return { x: clientX, y: clientY };
    }
    
    function showFloating(text, x, y, isPvlt = false) {
        const floatDiv = document.createElement("div");
        floatDiv.className = "float";
        if (isPvlt) floatDiv.classList.add("float-pvlt");
        floatDiv.innerText = text;
        floatDiv.style.left = x + "px";
        floatDiv.style.top = y + "px";
        document.body.appendChild(floatDiv);
        setTimeout(() => floatDiv.remove(), 800);
    }

    // ---------- BUY ENERGY (contract transaction: spends PVLT) ----------
    async function buyEnergy() {
        if (!connected) { showToast("Connect wallet first", true); return; }
        const costPVLT = 100;
        if (pvltBalance < costPVLT) {
            showToast(`❌ Need ${costPVLT} PVLT (you have ${pvltBalance.toFixed(2)})`, true);
            return;
        }
        
        // Add loading state
        const originalText = buyBtn.innerText;
        buyBtn.innerHTML = "Processing... <span class='loading-spinner'></span>";
        buyBtn.disabled = true;
        
        try {
            // Check allowance
            const costWei = ethers.utils.parseEther(costPVLT.toString());
            const allowance = await pvltContract.allowance(userAddress, GAME_ADDRESS);
            
            if (allowance.lt(costWei)) {
                showToast("Approving PVLT spend...", false);
                const approveTx = await pvltContract.approve(GAME_ADDRESS, ethers.utils.parseEther("10000"));
                await approveTx.wait(1);
                showToast("Approval confirmed!", false);
            }
            
            showToast("Purchasing 10,000 energy...", false);
            const buyTx = await gameContract.buyEnergy(costWei);
            await buyTx.wait(1);
            
            // On success: increase local energy & max energy
            energy += 10000;
            maxEnergy += 10000;
            pvltBalance -= costPVLT;
            updateUI();
            saveLocalState();
            showToast("✅ +10,000 Energy added! Max energy increased", false);
            
            // Refresh on-chain data
            await fetchOnChainData();
        } catch (err) {
            console.error(err);
            showToast("Buy failed: " + (err.message?.slice(0, 70) || "tx error"), true);
        } finally {
            buyBtn.innerHTML = originalText;
            buyBtn.disabled = false;
        }
    }

    // ---------- CLAIM PVLT (convert on-chain points to PVLT) ----------
    async function claimPVLT() {
        if (!connected) { showToast("Connect wallet", true); return; }
        
        // Check if we have enough points locally
        if (points < 10) {
            showToast(`Need at least 10 points to claim, current: ${points}`, true);
            return;
        }
        
        const originalText = claimBtn.innerText;
        claimBtn.innerHTML = "Claiming... <span class='loading-spinner'></span>";
        claimBtn.disabled = true;
        
        try {
            showToast("Claiming PVLT on-chain...", false);
            const claimTx = await gameContract.claimPVLT();
            await claimTx.wait(1);
            
            // After successful claim, reset points locally (contract deducts points)
            points = 0;
            updateUI();
            saveLocalState();
            
            // Refresh balances
            await fetchOnChainData();
            showToast("🎉 PVLT claimed to your wallet!", false);
        } catch (err) {
            console.error(err);
            showToast("Claim failed: " + (err.message?.slice(0, 70) || "contract error"), true);
        } finally {
            claimBtn.innerHTML = originalText;
            claimBtn.disabled = false;
        }
    }

    // ---------- Sync with blockchain (manual) ----------
    async function syncWithBlockchain() {
        if (!connected) { showToast("Connect wallet first", true); return; }
        syncBtn.innerHTML = "Syncing... <span class='loading-spinner'></span>";
        syncBtn.disabled = true;
        try {
            await fetchOnChainData();
            showToast("Data synced with blockchain", false);
        } catch (err) {
            showToast("Sync error", true);
        } finally {
            syncBtn.innerHTML = "🔄 Sync";
            syncBtn.disabled = false;
        }
    }

    // ---------- ENERGY REGENERATION (local only, no tx) ----------
    let regenInterval = null;
    function startRegenSimulation() {
        if (regenInterval) clearInterval(regenInterval);
        regenInterval = setInterval(() => {
            if (connected && energy < maxEnergy) {
                energy = Math.min(energy + 1, maxEnergy);
                updateUI();
                saveLocalState();
            }
        }, 3000);
    }

    // ---------- WALLET CONNECTION ----------
    async function connectWallet() {
        if (!window.ethereum) {
            showToast("❌ Please install MetaMask or any Web3 wallet", true);
            return;
        }
        try {
            const providerWeb3 = new ethers.providers.Web3Provider(window.ethereum);
            const accounts = await providerWeb3.send("eth_requestAccounts", []);
            userAddress = accounts[0];
            signer = providerWeb3.getSigner();
            provider = providerWeb3;
            
            // Switch to Polygon network (chainId 137)
            try {
                await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: "0x89" }]
                });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    await window.ethereum.request({
                        method: "wallet_addEthereumChain",
                        params: [{
                            chainId: "0x89",
                            chainName: "Polygon Mainnet",
                            nativeCurrency: { name: "MATIC", symbol: "MATIC", decimals: 18 },
                            rpcUrls: ["https://polygon-rpc.com"],
                            blockExplorerUrls: ["https://polygonscan.com"]
                        }]
                    });
                } else { throw switchError; }
            }
            
            // Init contracts
            pvltContract = new ethers.Contract(PVLT_ADDRESS, ERC20_ABI, signer);
            gameContract = new ethers.Contract(GAME_ADDRESS, GAME_ABI, signer);
            
            connected = true;
            connectBtn.innerHTML = `🟢 ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
            connectBtn.classList.add("wallet-connected");
            tapButton.classList.remove("tap-disabled");
            
            // Load local saved state or initialize defaults
            const loaded = loadLocalState();
            if (!loaded) {
                energy = 50;
                maxEnergy = 50;
                points = 0;
                updateUI();
            }
            
            // Fetch on-chain PVLT balance
            await fetchOnChainData();
            startRegenSimulation();
            
            // Setup event listeners
            window.ethereum.on("accountsChanged", (newAccounts) => {
                if (newAccounts.length === 0) { disconnectWallet(); }
                else { 
                    userAddress = newAccounts[0]; 
                    connectBtn.innerHTML = `🟢 ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                    loadLocalState();
                    fetchOnChainData();
                }
            });
            window.ethereum.on("chainChanged", () => window.location.reload());
            
            showToast(`Connected to Polygon: ${userAddress.slice(0,6)}...`, false);
        } catch (err) {
            console.error(err);
            showToast("Connection failed: " + err.message, true);
        }
    }
    
    function disconnectWallet() {
        connected = false;
        userAddress = null;
        connectBtn.innerHTML = "🔌 CONNECT WALLET";
        connectBtn.classList.remove("wallet-connected");
        tapButton.classList.add("tap-disabled");
        if (regenInterval) clearInterval(regenInterval);
        energy = 0; maxEnergy = 0; points = 0; pvltBalance = 0;
        updateUI();
    }

    // Button handlers
    connectBtn.onclick = () => {
        if (connected) { showToast(`Connected: ${userAddress?.slice(0,6)}...`, false); }
        else { connectWallet(); }
    };
    
    tapButton.addEventListener("click", performTap);
    tapButton.addEventListener("touchstart", (e) => { e.preventDefault(); performTap(e); });
    buyBtn.addEventListener("click", buyEnergy);
    claimBtn.addEventListener("click", claimPVLT);
    syncBtn.addEventListener("click", syncWithBlockchain);
    
    tapButton.addEventListener("contextmenu", (e) => e.preventDefault());
    
    // Initial UI
    updateUI();
    tapButton.classList.add("tap-disabled");
</script>
</body>
</html>
