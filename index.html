<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap2Earn - Token Clicker</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-color: #151a26;
            --accent-color: #00ffcc;
            --accent-hover: #33ffdd;
            --text-color: #ffffff;
            --gold-color: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            max-height: 750px;
            background-color: var(--card-color);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
            border: 1px solid rgba(0, 255, 204, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Screens styling */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .hidden {
            display: none !important;
        }

        /* Typography & Buttons */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            background: linear-gradient(45deg, var(--accent-color), #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 2rem;
            text-align: center;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.3);
            width: 80%;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 4px 25px rgba(0, 255, 204, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background-color: transparent;
            color: #7f8c8d;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 1rem;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        /* Game HUD */
        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
        }

        .hud-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #score-display {
            color: var(--gold-color);
        }

        /* Play Area & Token Target */
        .play-area {
            flex: 1;
            width: 100%;
            position: relative;
            cursor: pointer;
        }

        .token-target {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--gold-color) 0%, #d35400 100%);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.8rem;
            color: #fff;
            border: 4px solid #fff;
            transition: width 0.05s, height 0.05s;
        }

        /* Floating +Token Pop Effect */
        .pop {
            position: absolute;
            color: var(--gold-color);
            font-weight: 800;
            font-size: 1.4rem;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
        }

        /* Token Stat Grid */
        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            width: 80%;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="screen">
            <h1>$TAP Blitz</h1>
            <p>Mine as many tokens as you can before the mining pool locks for the round!</p>
            <button class="btn" onclick="startGame()">Start Mining</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen hidden" style="padding: 0; justify-content: flex-start;">
            <div class="hud">
                <div class="hud-item">Mined: <span id="score-display">0</span> $TAP</div>
                <div class="hud-item">Pool Closes: <span id="time-display">15</span>s</div>
            </div>
            <div class="play-area" id="play-area">
                <!-- Main Crypto Coin Target -->
                <div id="target" class="token-target">🪙</div>
            </div>
        </div>

        <!-- END SCREEN (CLAIM TOKENS) -->
        <div id="end-screen" class="screen hidden">
            <h1>Session Ended</h1>
            <p>Your mining session is complete. Claim your block rewards to your wallet.</p>
            
            <div class="stat-box">
                <div style="color: #7f8c8d; font-size: 0.9rem; margin-bottom: 5px;">TOTAL MINED</div>
                <div style="font-size: 2.2rem; font-weight: bold; color: var(--gold-color);">
                    <span id="final-score">0</span> $TAP
                </div>
            </div>

            <button class="btn" id="claim-btn" onclick="claimTokens()">Claim Rewards</button>
            <button class="btn btn-secondary" onclick="showScreen('start-screen')">Mine Again</button>
        </div>

    </div>

    <script>
        // Game Settings
        let score = 0;
        let timeLeft = 15; // 15-second blitz rounds work best for micro-games
        let gameInterval;
        const gameDuration = 15; 

        // DOM elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        
        const target = document.getElementById('target');
        const playArea = document.getElementById('play-area');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const finalScore = document.getElementById('final-score');
        const claimBtn = document.getElementById('claim-btn');

        function showScreen(screenId) {
            startScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame() {
            score = 0;
            timeLeft = gameDuration;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            claimBtn.textContent = "Claim Rewards";
            claimBtn.disabled = false;
            
            showScreen('game-screen');
            moveTarget();
            
            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // Randomly moves the coin inside the layout boundaries
        function moveTarget() {
            const areaWidth = playArea.clientWidth;
            const areaHeight = playArea.clientHeight;
            const padding = 60; 
            
            const randomX = Math.random() * (areaWidth - padding * 2) + padding;
            const randomY = Math.random() * (areaHeight - padding * 2) + padding;

            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;
        }

        // Tap Event
        target.addEventListener('pointerdown', (e) => {
            score += 1; // You can change this to a dynamic tap-multiplier later
            scoreDisplay.textContent = score;
            
            createPopEffect(e.clientX, e.clientY);
            moveTarget();
        });

        // Floating +1 $TAP text dynamic effect
        function createPopEffect(x, y) {
            const pop = document.createElement('div');
            pop.classList.add('pop');
            pop.textContent = '+1 $TAP';
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;
            
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 600);
        }

        function endGame() {
            clearInterval(gameInterval);
            finalScore.textContent = score;
            showScreen('end-screen');
        }

        // Web3 Sandbox Placeholder Interaction
        function claimTokens() {
            claimBtn.textContent = "Connecting & Signing...";
            claimBtn.disabled = true;

            // Simulating smart contract execution delays
            setTimeout(() => {
                claimBtn.textContent = "Success! Tokens Deposited";
                alert(`Successfully sent ${score} $TAP tokens to your wallet stack!`);
            }, 1500);
        }
    </script>
</body>
</html>
