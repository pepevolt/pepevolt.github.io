<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Web3 Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* ================= LOCK UI ================= */
html, body {
margin:0;
padding:0;
height:100%;
overflow:hidden;
touch-action:none;
-webkit-text-size-adjust:100%;
}

body{
font-family:Arial;
background: radial-gradient(circle at top, #0b1220, #020617);
color:white;
position:fixed;
width:100%;
height:100%;
text-align:center;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;left:0;right:0;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
background: rgba(255,255,255,0.06);
backdrop-filter: blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:12px;
z-index:10;
}

/* MAIN */
.container{
position:absolute;
top:60px;
left:0;
right:0;
bottom:0;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
}

/* TAP */
.tap{
width:170px;
height:170px;
border-radius:50%;
background: linear-gradient(135deg,#00ff99,#00ccff);
border:none;
font-size:22px;
font-weight:bold;
color:black;
}

/* CARD */
.card{
margin:12px;
padding:15px;
width:85%;
background: rgba(255,255,255,0.05);
border-radius:14px;
border:1px solid rgba(255,255,255,0.08);
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background: rgba(0,0,0,0.3);
color:white;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
margin-top:10px;
background: linear-gradient(90deg,#00ff99,#00ccff);
color:black;
font-weight:bold;
}

</style>

</head>

<body>

<!-- NAV -->
<div class="navbar">
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0</span></div>
<div>👤 <span id="userId">guest</span></div>
</div>

<!-- MAIN -->
<div class="container">

<h2>PVLT WEB3 GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<input id="wallet" placeholder="Connect wallet address">
<br>
<button onclick="connectWallet()">CONNECT WALLET</button>
</div>

<div class="card">
<input id="withdraw" placeholder="100 - 500 tokens">
<br>
<button onclick="claim()">CLAIM TOKENS</button>
</div>

</div>

<script>

/* ================= CONFIG ================= */
const CONTRACT_ADDRESS = "YOUR_CONTRACT_ADDRESS";

const ABI = [
"function tap()",
"function getPoints(address) view returns (uint256)",
"function claim(uint256)"
];

let provider;
let signer;
let contract;
let walletAddress;

/* ================= STATE ================= */
let points = 0;
let tokens = 0;
let userId = "guest";

/* ================= SAFE UI ================= */
function set(id,val){
let el=document.getElementById(id);
if(el) el.innerText=val;
}

/* ================= INIT TELEGRAM ================= */
function init(){

try{
if(window.Telegram && Telegram.WebApp){
Telegram.WebApp.ready();
Telegram.WebApp.expand();
userId = Telegram.WebApp.initDataUnsafe?.user?.id || "guest";
}
}catch(e){}

set("userId", userId);
}

/* ================= WALLET CONNECT ================= */
async function connectWallet(){

try{

if(!window.ethereum){
alert("Install wallet (MetaMask / Trust Wallet)");
return;
}

provider = new ethers.providers.Web3Provider(window.ethereum);
await provider.send("eth_requestAccounts", []);

signer = provider.getSigner();
walletAddress = await signer.getAddress();

contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

alert("Wallet connected");

}catch(e){
alert("Wallet error");
console.log(e);
}

}

/* ================= TAP (REAL CONTRACT) ================= */
async function tap(){

try{

if(!contract){
alert("Connect wallet first");
return;
}

let tx = await contract.tap();
await tx.wait();

points++;

set("points", points);

}catch(e){
alert("Tap failed");
}

}

/* ================= CLAIM ================= */
async function claim(){

let amt = parseInt(document.getElementById("withdraw").value);

if(!contract){
alert("Connect wallet first");
return;
}

if(!amt || amt < 100 || amt > 500){
alert("100-500 only");
return;
}

try{

let tx = await contract.claim(amt);
await tx.wait();

tokens += amt;

set("tokens", tokens);

alert("Claim success");

}catch(e){
alert("Claim failed");
}

}

/* ================= START SAFE ================= */
window.addEventListener("DOMContentLoaded", init);

</script>

</body>

</html>
