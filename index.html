<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PEPEVOLT BOT</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <script type="module">
        import { createWeb3Modal, defaultWagmiConfig } from 'https://esm.run/@web3modal/wagmi@3.5.0';
        import { polygon } from 'https://esm.run/viem/chains';
        import { watchAccount, disconnect, getWalletClient } from 'https://esm.run/@wagmi/core';

        const projectId = '1731f99148b9cf6107dee70b6efb14b7';
        const metadata = {
            name: 'PepeVolt Tap Game',
            description: 'PepeVolt Mini App',
            url: window.location.origin,
            icons: ['images/IMG_1850.png']
        };

        const chains = [polygon];
        const wagmiConfig = defaultWagmiConfig({ chains, projectId, metadata });

        // Initialize Web3Modal
        const modal = createWeb3Modal({ wagmiConfig, projectId, chains });

        // Share modules globally with vanilla JS functions below
        window.web3ModalInstance = modal;
        window.wagmiDisconnect = disconnect;
        window.wagmiConfig = wagmiConfig;

        // Helper function to extract an Ethers Signer out of a WalletConnect Session
        window.getWalletConnectSigner = async function() {
            try {
                const client = await getWalletClient(wagmiConfig);
                if (!client) return null;
                const provider = new ethers.providers.Web3Provider(client.transport);
                return provider.getSigner();
            } catch (err) {
                console.error("Failed to extract WalletConnect signer:", err);
                return null;
            }
        };

        // Listen for WalletConnect success/disconnect actions
        watchAccount((account) => {
            if (account && account.isConnected && account.address) {
                window.syncWalletState(account.address, "walletconnect");
            } else if (!window.ethereumActive) {
                window.clearWalletState();
            }
        });
    </script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            -webkit-tap-highlight-color:transparent;
            touch-action:manipulation;
            user-select:none;
            -webkit-user-select:none;
        }

        body{
            background:#050f1e;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
            color:white;
            display:flex;
            flex-direction:column;
            min-height:100vh;
            align-items:center;
            overflow-y:auto;
            overflow-x:hidden;
            padding:0 0 env(safe-area-inset-bottom) 0;
        }

        .topbar{
            position:sticky;
            top:0;
            z-index:999;
            background:#050f1e;
            width:100%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-weight:bold;
            font-size:15px;
            padding:calc(14px + env(safe-area-inset-top)) 24px 14px 24px;
            border-bottom:1px solid rgba(255,255,255,0.05);
            box-shadow:0 4px 20px rgba(0,0,0,0.4);
        }

        .stat-item{
            display:flex;
            align-items:center;
            gap:6px;
        }

        .main-container{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            flex-grow:1;
            gap:25px;
            width:100%;
            padding:25px 0 20px 0;
        }

        .character-btn{
            background:none;
            border:none;
            cursor:pointer;
            outline:none;
            border-radius:50%;
            transition:transform .05s ease;
        }

        .character-btn:active{
            transform:scale(.95);
        }

        .character-btn img{
            width:220px;
            height:220px;
            border-radius:50%;
            box-shadow:0 0 40px rgba(0,255,153,0.3);
        }

        .ui-card{
            width:90%;
            max-width:360px;
            display:flex;
            flex-direction:column;
            gap:10px;
            text-align:center;
        }

        .address-display{
            width:100%;
            padding:14px;
            border-radius:14px;
            background:#0a182c;
            color:#8fa3bf;
            border:1px solid rgba(255,255,255,0.02);
            font-size:14px;
            text-align:center;
            font-weight:bold;
            outline:none;
        }

        .btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:14px;
            font-size:15px;
            font-weight:bold;
            color:black;
            cursor:pointer;
            background:linear-gradient(90deg,#00ff99,#00ccff);
            transition:opacity .2s,transform .1s;
            text-transform:uppercase;
            letter-spacing:.5px;
        }

        .btn:active{
            opacity:.9;
            transform:scale(.99);
        }

        .btn-withdraw{
            background:linear-gradient(90deg,#ffcc00,#ff3300);
            color:white;
        }

        .btn-disconnect {
            background: linear-gradient(90deg, #ff3333, #aa0000) !important;
            color: white !important;
        }

        .live-balances-box{
            background:rgba(255,255,255,0.02);
            margin-top:5px;
            padding:12px;
            border-radius:12px;
            font-size:12px;
            color:#a2b7d4;
            display:flex;
            flex-direction:column;
            gap:6px;
            text-align:left;
            border:1px solid rgba(255,255,255,0.03);
        }

        .balance-line{
            display:flex;
            justify-content:space-between;
        }

        .balance-val{
            font-weight:bold;
            color:#00ff99;
        }

        .footer-rules{
            font-size:11px;
            line-height:1.6;
            color:#697d95;
            text-align:center;
            margin-bottom:25px;
            font-weight:500;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="stat-item">🛢️ <span id="energy">0</span></div>
        <div class="stat-item">⚡ <span id="points">0</span></div>
        <div class="stat-item">💎 <span id="pvltg">0.0000</span></div>
    </div>

    <div class="main-container">
        <button class="character-btn" onclick="handleTap()">
            <img src="images/IMG_1850.png" alt="PepeVolt">
        </button>

        <div class="ui-card">
            <input class="address-display" id="walletDisplay" value="Wallet Not Connected" readonly>
            <button class="btn" id="connectBtn" onclick="handleWalletAction()">CONNECT WALLET</button>
            <button class="btn" onclick="triggerBuyEnergy()">BUY INSTANT ENERGY</button>
            <button class="btn" onclick="swapPoints()">SWAP POINTS → PVLTG</button>
            <button class="btn btn-withdraw" onclick="triggerWithdrawal()">WITHDRAWAL PVLT</button>

            <div class="live-balances-box">
                <div class="balance-line">
                    <span>Your Personal Wallet PVLT:</span>
                    <span class="balance-val" id="userWalletPvlt">0.0000</span>
                </div>
                <div class="balance-line">
                    <span>Available Treasury Pool:</span>
                    <span class="balance-val" id="treasuryVaultPvlt" style="color:#00ccff;">0.0000</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-rules">
        1 Tap = 2 Points<br>
        2000 Points = 4 PVLTG<br>
        3000 PVLTG = 6 PVLT<br>
        Min Withdrawal: 10 PVLT | Max: 1000 PVLT
    </div>

    <script>
        const API_URL = "https://pepevolt-game-suite.onrender.com";
        const MAIN_TOKEN_CONTRACT = "0x75996ad3ffd2fe2d55b38fdfad974c5e9ebe5400";
        const TREASURY_CONTRACT = "0x3FdCE8aB325E03d527605dd2f01730cd981F594F";

        const ERC20_ABI = [
            "function balanceOf(address owner) view returns (uint256)",
            "function decimals() view returns (uint8)",
            "function approve(address spender,uint256 amount) returns(bool)"
        ];

        let walletAddress = "";
        let connectionType = ""; 
        let points = 0;
        let energy = 0;
        let pvltg = 0;
        let autoRefillInterval = null;
        window.ethereumActive = false;

        function updateUI(){
            document.getElementById("energy").innerText = energy;
            document.getElementById("points").innerText = points;
            document.getElementById("pvltg").innerText = Number(pvltg).toFixed(4);
        }

        function initializeEnergyTracking(){
            if(autoRefillInterval) clearInterval(autoRefillInterval);
            autoRefillInterval = setInterval(()=>{
                if(walletAddress && energy < 20){
                    energy += 1;
                    updateUI();
                }
            }, 1000);
        }

        async function checkExistingConnection() {
            try {
                if (window.ethereum) {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const accounts = await provider.listAccounts();
                    if (accounts.length > 0) {
                        window.ethereumActive = true;
                        await syncWalletState(accounts[0], "injected");
                    }
                }
            } catch (err) {
                console.log("Silent injection check skipped.");
            }
        }

        async function handleWalletAction(){
            if(walletAddress) {
                if(connectionType === "walletconnect" && window.wagmiDisconnect && window.wagmiConfig) {
                    await window.wagmiDisconnect(window.wagmiConfig);
                }
                window.ethereumActive = false;
                clearWalletState();
                return;
            }

            if(window.ethereum) {
                try {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    const signer = provider.getSigner();
                    const addr = await signer.getAddress();
                    const network = await provider.getNetwork();

                    if(network.chainId !== 137){
                        await provider.send("wallet_switchEthereumChain", [{ chainId:"0x89" }]);
                    }
                    window.ethereumActive = true;
                    await syncWalletState(addr, "injected");
                    return;
                } catch(e) {
                    console.log("Fallback triggering web3Modal container routing.");
                }
            }

            if(window.web3ModalInstance) {
                window.web3ModalInstance.open();
            }
        }

        async function getActiveSigner() {
            if (connectionType === "injected" && window.ethereum) {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                return provider.getSigner();
            } else if (connectionType === "walletconnect" && window.getWalletConnectSigner) {
                return await window.getWalletConnectSigner();
            }
            return null;
        }

        window.syncWalletState = async function(address, type) {
            walletAddress = address;
            connectionType = type;
            
            const connectBtn = document.getElementById("connectBtn");
            document.getElementById("walletDisplay").value = walletAddress.slice(0,6) + "..." + walletAddress.slice(-4);
            connectBtn.innerText = "DISCONNECT";
            connectBtn.classList.add("btn-disconnect");

            try {
                const res = await fetch(`${API_URL}/user`, {
                    method:"POST",
                    headers: { "Content-Type":"application/json" },
                    body:JSON.stringify({ wallet:walletAddress })
                });
                const data = await res.json();
                
                points = data.points || 0; 
                energy = data.energy !== undefined ? data.energy : 0; 
                pvltg = data.pvltg || 0;

                updateUI();
                await loadOnChainBalances();
            } catch(err) {
                console.log("API syncing failed: ", err);
            }
        }

        window.clearWalletState = function() {
            walletAddress = "";
            connectionType = "";
            points = 0;
            energy = 0;
            pvltg = 0;
            
            const connectBtn = document.getElementById("connectBtn");
            document.getElementById("walletDisplay").value = "Wallet Not Connected";
            connectBtn.innerText = "CONNECT WALLET";
            connectBtn.classList.remove("btn-disconnect");
            
            document.getElementById("userWalletPvlt").innerText = "0.0000";
            document.getElementById("treasuryVaultPvlt").innerText = "0.0000";
            
            updateUI();
        }

        async function loadOnChainBalances(){
            if(!walletAddress) return;
            const provider = window.ethereum ? new ethers.providers.Web3Provider(window.ethereum) : new ethers.providers.JsonRpcProvider("https://polygon-rpc.com");
            
            try{
                const token = new ethers.Contract(MAIN_TOKEN_CONTRACT, ERC20_ABI, provider);
                const decimals = await token.decimals();
                const userBalance = await token.balanceOf(walletAddress);
                const treasuryBalance = await token.balanceOf(TREASURY_CONTRACT);

                document.getElementById("userWalletPvlt").innerText = Number(ethers.utils.formatUnits(userBalance, decimals)).toFixed(4);
                document.getElementById("treasuryVaultPvlt").innerText = Number(ethers.utils.formatUnits(treasuryBalance, decimals)).toFixed(4);
            } catch(err){ console.log(err); }
        }

        async function handleTap(){
            if(!walletAddress){ alert("Connect wallet first"); return; }
            if(energy <= 0){ alert("Out of energy! Wait for refill."); return; }
            
            try{
                const res = await fetch(`${API_URL}/tap`, {
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body:JSON.stringify({ wallet:walletAddress })
                });
                const data = await res.json();
                if(data.error){ alert(data.error); return; }
                
                points = data.points;
                energy = data.energy;
                pvltg = data.pvltg;
                updateUI();
            } catch(err){ console.log(err); }
        }

        // --- FIXED FOR WALLETCONNECT ROUTING AND NO DUAL SIGNING FAILS ---
        async function triggerBuyEnergy(){
            if(!walletAddress){ alert("Connect wallet first"); return; }
            
            const signer = await getActiveSigner();
            if(!signer) {
                alert("Could not access active wallet credentials. Please reconnect.");
                return;
            }

            try{
                const token = new ethers.Contract(MAIN_TOKEN_CONTRACT, ERC20_ABI, signer);
                
                // Player approves treasury contract to spend their 100 PVLT tokens on-chain
                console.log("Requesting payment token allowance approval...");
                const approveTx = await token.approve(TREASURY_CONTRACT, ethers.utils.parseEther("100"));
                await approveTx.wait();

                // Call the API backend route. The server wallet executes the final on-chain function
                console.log("Submitting transaction payload to game engine server...");
                const res = await fetch(`${API_URL}/buy-energy`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet: walletAddress })
                });
                const data = await res.json();
                if(data.error){ alert(data.error); return; }

                energy = data.energy; 
                updateUI();
                await loadOnChainBalances();
                alert("Instant Energy pack applied successfully!");
            }
            catch(err){
                console.error(err);
                alert("Energy purchase rejected or failed.");
            }
        }

        async function swapPoints(){
            if(!walletAddress){ alert("Connect wallet first"); return; }
            try{
                const res = await fetch(`${API_URL}/swap-points`, {
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body:JSON.stringify({ wallet:walletAddress })
                });
                const data = await res.json();
                if(data.error){ alert(data.error); return; }
                
                points = data.points || 0;
                pvltg = data.pvltg;
                updateUI();
            } catch(err){ console.log(err); alert("Swap conversion failed"); }
        }

        // --- ALIGNED TARGET ENDPOINT TO MATCH THE SERVER WRAPPER ---
        async function triggerWithdrawal(){
            if(!walletAddress){ alert("Connect wallet first"); return; }

            try{
                console.log("Requesting secure withdrawal allocation signature...");
                const res = await fetch(`${API_URL}/withdraw-pvltg`, {
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body:JSON.stringify({ wallet:walletAddress })
                });
                const data = await res.json();
                if(data.error){ alert(data.error); return; }

                pvltg = 0;
                updateUI();
                await loadOnChainBalances();
                alert(`Withdrawal success! Tx Hash: ${data.tx}`);
            }
            catch(err){ console.error(err); alert("Withdrawal routine failed"); }
        }

        initializeEnergyTracking();
        checkExistingConnection();
    </script>
</body>
</html>
