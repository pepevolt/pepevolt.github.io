<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<title>PVLT Game</title>

<style>

body{margin:0;font-family:Arial;background:#0b1220;color:white;text-align:center;}

.navbar{
position:fixed;top:0;left:0;right:0;height:55px;
background:#111827;display:flex;justify-content:space-between;
align-items:center;padding:0 10px;font-size:12px;
}

.container{padding-top:80px;}

.tap{
width:160px;height:160px;border-radius:50%;
background:#00ff99;border:none;font-size:22px;
font-weight:bold;
}

.card{
margin:15px;background:#111827;padding:15px;border-radius:10px;
}

input{width:85%;padding:10px;border:none;border-radius:8px;}

button{padding:12px;border:none;border-radius:10px;margin-top:10px;}

</style>

</head>

<body>

<div class="navbar">
<div>Points: <span id="p">0</span></div>
<div>PVLT: <span id="t">0</span></div>
<div>ID: <span id="id">---</span></div>
</div>

<div class="container">

<h2>PVLT Tap Game</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<input id="wallet" placeholder="BSC wallet">
<button onclick="link()">LINK WALLET</button>
</div>

<div class="card">
<input id="claimAmt" placeholder="100 - 500 tokens">
<button onclick="claim()">CLAIM</button>
</div>

</div>

<script>

/* SAFE STATE */
let tgUser = "guest";
let points = 0;
let pvlt = 0;
let wallet = null;

/* TELEGRAM SAFE INIT */
function init(){

try{
if(window.Telegram && Telegram.WebApp){
Telegram.WebApp.ready();
Telegram.WebApp.expand();
tgUser = Telegram.WebApp.initDataUnsafe?.user?.id || "guest";
}
}catch(e){}

document.getElementById("id").innerText = tgUser;

}

function tap(){
points++;
document.getElementById("p").innerText = points;
}

function link(){
wallet = document.getElementById("wallet").value;
alert(wallet ? "linked" : "enter wallet");
}

/* REAL CLAIM CALL */
async function claim(){

let amt = parseInt(document.getElementById("claimAmt").value);

if(!wallet) return alert("link wallet");
if(amt < 100 || amt > 500) return alert("100-500 only");

try{

// call BSC contract
alert("Sending claim tx... (connect contract here)");

}catch(e){
alert("failed");
}

}

window.onload = init;

</script>

</body>

</html>
