<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tap Tap Game</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #ffffff; overflow: hidden;
        }

        .game-container { display: flex; flex-direction: column; height: 100vh; }

        /* Updated Header for 3 Assets */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            padding: 15px 10px;
            background: #16213e;
            font-size: 0.9rem;
            text-align: center;
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .emoji { font-size: 1.2rem; margin-bottom: 2px; }

        .interaction-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; }

        .tap-circle {
            width: 200px; height: 200px; border-radius: 50%; border: none;
            background: radial-gradient(circle, #4ecca3, #45b791);
            color: white; font-size: 2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.05s;
        }
        .tap-circle:active { transform: scale(0.92); }

        .shop-panel { padding: 20px; background: #0f3460; text-align: center; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- New 3-Asset Header -->
        <header class="stats">
            <div class="stat-item">
                <span class="emoji">💎</span>
                <span id="points">0</span>
            </div>
            <div class="stat-item">
                <span class="emoji">🎲</span>
                <span id="chips">0</span>
            </div>
            <div class="stat-item">
                <span class="emoji">💰</span>
                <span id="currency">0.00</span>
            </div>
        </header>

        <main class="interaction-area">
            <button id="tap-button" class="tap-circle">TAP!</button>
        </main>

        <footer class="shop-panel">
            <button onclick="convertPoints()">Convert 💎 to 🎲</button>
        </footer>
    </div>

    <script>
        let points = 0;
        let chips = 0;
        let currency = 0;

        const pDisplay = document.getElementById('points');
        const cDisplay = document.getElementById('chips');
        const curDisplay = document.getElementById('currency');

        document.getElementById('tap-button').addEventListener('click', () => {
            points += 1;
            pDisplay.innerText = points;
        });

        function convertPoints() {
            if (points >= 10) {
                points -= 10;
                chips += 1;
                pDisplay.innerText = points;
                cDisplay.innerText = chips;
            } else {
                alert("Need 10 💎 to get 1 🎲");
            }
        }
    </script>
</body>
</html>
