<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PepeVolt</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:16px;
  gap:14px;
}

/* TOP */
.top{
  display:flex;
  gap:10px;
}

.box{
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  text-align:center;
  padding:10px 6px;
  color:white;
}

.label{
  font-size:11px;
  opacity:0.7;
}

.value{
  font-size:18px;
  font-weight:bold;
}

/* CONNECT */
#connectBtn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg,#00b894,#00cec9);
}

/* CENTER */
.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.circle{
  width:min(65vw,240px);
  height:min(65vw,240px);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffcc00,#ff8800);
  border:8px solid white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  color:#111;
  box-shadow:0 0 60px rgba(255,180,0,0.4);
  cursor:pointer;
  user-select:none;
}

/* BUTTONS */
.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.btn{
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  color:white;
}

.buy{background:#00cec9;}
.claim{background:#ff7b54;}

</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="box">
      <div class="label">⚡ Energy</div>
      <div class="value" id="energy">100</div>
    </div>

    <div class="box">
      <div class="label">💎 Points</div>
      <div class="value" id="points">0</div>
    </div>

    <div class="box">
      <div class="label">🪙 PVLT</div>
      <div class="value" id="pvlt">0</div>
    </div>
  </div>

  <button id="connectBtn">Connect Wallet</button>

  <div class="center">
    <div class="circle" id="tapBtn">TAP</div>
  </div>

  <div class="actions">
    <button class="btn buy" id="buyBtn">Buy 10000 Energy (100 PVLT)</button>
    <button class="btn claim" id="claimBtn">Claim PVLT</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<script>

/* CONTRACT CONFIG */
const GAME_ADDRESS = "0xYourGameContract";
const TOKEN_ADDRESS = "0xYourPVLTToken";

const GAME_ABI = [
  "function tap()",
  "function buyEnergy()",
  "function claim()",
  "function getPlayer(address) view returns (uint256,uint256,uint256)"
];

const ERC20_ABI = [
  "function approve(address spender, uint256 amount) returns (bool)"
];

/* STATE */
let game;
let connected = false;

/* UI */
const energyEl = document.getElementById("energy");
const pointsEl = document.getElementById("points");
const pvltEl = document.getElementById("pvlt");

/* CONNECT WALLET (FIXED) */
document.getElementById("connectBtn").onclick = async () => {
  try {

    if (!window.ethereum) {
      alert("MetaMask not found");
      return;
    }

    const accounts = await window.ethereum.request({
      method: "eth_requestAccounts"
    });

    if (!accounts || accounts.length === 0) {
      alert("No wallet found");
      return;
    }

    const provider = new ethers.providers.Web3Provider(window.ethereum, "any");
    const signer = provider.getSigner();

    const user = await signer.getAddress();

    game = new ethers.Contract(GAME_ADDRESS, GAME_ABI, signer);

    window.user = user;
    window.signer = signer;

    connected = true;

    document.getElementById("connectBtn").innerText =
      user.slice(0,6) + "..." + user.slice(-4);

  } catch (err) {
    console.error(err);
    alert("Wallet connection failed");
  }
};

/* TAP */
document.getElementById("tapBtn").onclick = async () => {
  try {

    if (!connected) return alert("Connect wallet first");

    await game.tap();

    const data = await game.getPlayer(window.user);

    energyEl.innerText = data[0].toNumber();
    pointsEl.innerText = data[1].toNumber();
    pvltEl.innerText = data[2].toNumber();

  } catch (err) {
    console.error(err);
    alert("Tap failed");
  }
};

/* BUY ENERGY */
document.getElementById("buyBtn").onclick = async () => {
  try {

    if (!connected) return alert("Connect wallet first");

    const token = new ethers.Contract(TOKEN_ADDRESS, ERC20_ABI, window.signer);

    await token.approve(GAME_ADDRESS, ethers.utils.parseEther("100"));
    await game.buyEnergy();

    const data = await game.getPlayer(window.user);

    energyEl.innerText = data[0].toNumber();

  } catch (err) {
    console.error(err);
    alert("Buy failed");
  }
};

/* CLAIM */
document.getElementById("claimBtn").onclick = async () => {
  try {

    if (!connected) return alert("Connect wallet first");

    await game.claim();

    const data = await game.getPlayer(window.user);

    pvltEl.innerText = data[2].toNumber();

  } catch (err) {
    console.error(err);
    alert("Claim failed");
  }
};

</script>

</body>
</html>
