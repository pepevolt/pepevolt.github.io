<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PepeVolt</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#06101d;
  touch-action:manipulation;
}

body{
  display:flex;
  justify-content:center;
}

/* APP */

.app{

  width:100%;
  max-width:430px;

  height:100vh;
  height:100dvh;

  background:
  radial-gradient(circle at top,#13233d 0%,#07111f 75%);

  display:flex;
  flex-direction:column;

  padding:
  max(16px, env(safe-area-inset-top))
  16px
  max(16px, env(safe-area-inset-bottom));

  overflow:hidden;

  position:relative;
}

/* TOP NAV */

.top-nav{

  width:100%;

  display:flex;
  gap:10px;

  margin-top:5px;
}

.nav-box{

  flex:1;

  background:rgba(255,255,255,0.05);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:18px;

  padding:12px 8px;

  text-align:center;

  backdrop-filter:blur(10px);
}

.nav-title{

  font-size:11px;
  color:#9fb2d0;

  margin-bottom:6px;
}

.nav-value{

  font-size:18px;
  font-weight:bold;
  color:white;
}

/* CONNECT */

.wallet-wrap{

  width:100%;
  margin-top:16px;
}

#connectBtn{

  width:100%;

  border:none;
  outline:none;

  border-radius:18px;

  padding:15px;

  font-size:16px;
  font-weight:bold;

  color:white;

  cursor:pointer;

  background:
  linear-gradient(
  135deg,
  #00b894,
  #00cec9
  );

  box-shadow:
  0 0 25px rgba(0,255,200,0.25);
}

#connectBtn:active{
  transform:scale(0.98);
}

/* CENTER */

.center{

  flex:1;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* TAP */

.tap-circle{

  width:min(62vw,240px);
  height:min(62vw,240px);

  border-radius:50%;

  background:
  radial-gradient(
  circle at 30% 30%,
  #ffcc00,
  #ff8800
  );

  border:8px solid rgba(255,255,255,0.9);

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:
  0 0 80px rgba(255,180,0,0.45),
  inset 0 0 35px rgba(255,255,255,0.15);

  cursor:pointer;

  user-select:none;
}

.tap-circle:active{
  transform:scale(0.95);
}

.tap-circle img{

  width:30%;
  height:30%;

  object-fit:contain;

  pointer-events:none;
}

/* ACTIONS */

.actions{

  width:100%;

  display:flex;
  flex-direction:column;

  gap:12px;

  margin-bottom:10px;
}

.action-btn{

  width:100%;

  border:none;
  outline:none;

  border-radius:18px;

  padding:16px;

  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;
}

.action-btn:active{
  transform:scale(0.98);
}

.buy{
  background:
  linear-gradient(135deg,#00b894,#00cec9);
}

.convert{
  background:
  linear-gradient(135deg,#6c5ce7,#8e7dff);
}

.claim{
  background:
  linear-gradient(135deg,#ffb347,#ff7b54);
}

/* FLOAT */

.float{

  position:fixed;

  color:white;

  font-weight:bold;

  pointer-events:none;

  z-index:9999;

  animation:floatUp 1s linear forwards;
}

@keyframes floatUp{

  0%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-70px);
  }
}

</style>
</head>

<body>

<div class="app">

  <!-- TOP NAV -->

  <div class="top-nav">

    <div class="nav-box">
      <div class="nav-title">
        ⚡ Energy
      </div>

      <div
      class="nav-value"
      id="energy">
        100
      </div>
    </div>

    <div class="nav-box">
      <div class="nav-title">
        💎 gPVLT
      </div>

      <div
      class="nav-value"
      id="gpvlt">
        0
      </div>
    </div>

    <div class="nav-box">
      <div class="nav-title">
        🪙 PVLT
      </div>

      <div
      class="nav-value"
      id="pvlt">
        0
      </div>
    </div>

  </div>

  <!-- CONNECT -->

  <div class="wallet-wrap">

    <button id="connectBtn">
      Connect Wallet
    </button>

  </div>

  <!-- TAP -->

  <div class="center">

    <div
    class="tap-circle"
    id="tapBtn">

      <img
      src="https://cdn-icons-png.flaticon.com/512/825/825508.png">

    </div>

  </div>

  <!-- BUTTONS -->

  <div class="actions">

    <button
    class="action-btn buy"
    id="buyBtn">
      Buy Energy
    </button>

    <button
    class="action-btn convert"
    id="convertBtn">
      Convert
    </button>

    <button
    class="action-btn claim"
    id="claimBtn">
      Claim
    </button>

  </div>

</div>

<script type="module">

/* WALLET */

import { createAppKit }
from 'https://esm.sh/@reown/appkit@latest';

import { EthersAdapter }
from 'https://esm.sh/@reown/appkit-adapter-ethers@latest';

import { polygon }
from 'https://esm.sh/@reown/appkit/networks@latest';

const connectBtn =
document.getElementById('connectBtn');

const projectId =
'1731f99148b9cf6107dee70b6efb14b7';

const modal = createAppKit({

  adapters:[new EthersAdapter()],

  networks:[polygon],

  metadata:{
    name:'PepeVolt',
    description:'PepeVolt Game',
    url:'https://pepevolt.github.io',
    icons:[
      'https://avatars.githubusercontent.com/u/179229932'
    ]
  },

  projectId,

  features:{
    analytics:true
  }

});

let walletConnected = false;
let walletAddress = null;

/* CONNECT */

connectBtn.onclick = async ()=>{

  try{

    await modal.open();

  }catch(err){

    console.log(err);

  }

};

/* STATE */

modal.subscribeState((state)=>{

  if(state.isConnected && state.address){

    walletConnected = true;

    walletAddress = state.address;

    connectBtn.innerText =
    state.address.slice(0,6)
    + '...'
    + state.address.slice(-4);

  }else{

    walletConnected = false;

    connectBtn.innerText =
    'Connect Wallet';

  }

});

/* ELEMENTS */

const tapBtn =
document.getElementById('tapBtn');

const buyBtn =
document.getElementById('buyBtn');

const convertBtn =
document.getElementById('convertBtn');

const claimBtn =
document.getElementById('claimBtn');

const energyEl =
document.getElementById('energy');

const gpvltEl =
document.getElementById('gpvlt');

const pvltEl =
document.getElementById('pvlt');

/* GAME STATE */

let energy = 100;

let gpvlt = 0;

let pvlt = 0;

let pendingPVLT = 0;

/* TAP */

tapBtn.onclick = (e)=>{

  if(!walletConnected){

    alert('Connect Wallet First');

    return;
  }

  if(energy <= 0){

    alert('No Energy');

    return;
  }

  energy--;

  /* 1 TAP = 1 gPVLT */

  gpvlt++;

  /* AUTO CONVERT */

  if(gpvlt >= 100){

    gpvlt -= 100;

    pvlt += 1;
  }

  /* UPDATE */

  energyEl.innerText = energy;

  gpvltEl.innerText = gpvlt;

  pvltEl.innerText = pvlt;

  /* FLOAT */

  const float =
  document.createElement('div');

  float.className = 'float';

  float.innerText = '+1 gPVLT';

  float.style.left =
  e.clientX + 'px';

  float.style.top =
  e.clientY + 'px';

  document.body.appendChild(float);

  setTimeout(()=>{

    float.remove();

  },1000);

};

/* BUY ENERGY */

buyBtn.onclick = ()=>{

  if(!walletConnected){

    alert('Connect Wallet First');

    return;
  }

  if(pvlt < 100){

    alert('Need 100 PVLT');

    return;
  }

  pvlt -= 100;

  energy += 10000;

  energyEl.innerText = energy;

  pvltEl.innerText = pvlt;

  alert('+10000 Energy');

};

/* CONVERT */

convertBtn.onclick = ()=>{

  if(!walletConnected){

    alert('Connect Wallet First');

    return;
  }

  if(gpvlt < 100){

    alert('Need 100 gPVLT');

    return;
  }

  gpvlt -= 100;

  pvlt += 1;

  gpvltEl.innerText = gpvlt;

  pvltEl.innerText = pvlt;

  alert('+1 PVLT');

};

/* CLAIM */

claimBtn.onclick = async ()=>{

  if(!walletConnected){

    alert('Connect Wallet First');

    return;
  }

  if(pvlt <= 0){

    alert('No PVLT');

    return;
  }

  alert(
    pvlt +
    ' PVLT Sent To Wallet:\n\n'
    + walletAddress
  );

  pvlt = 0;

  pvltEl.innerText = pvlt;

};

</script>

</body>
</html>
