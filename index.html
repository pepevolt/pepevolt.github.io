<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is critical to prevent zooming/scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap Game</title>
    <style>
        /* Force layout stability */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            overflow: hidden; /* Prevents bounce scrolling */
            touch-action: manipulation; /* Disables zoom on tap */
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 15px 5px;
            background: #16213e;
            text-align: center;
        }

        .stat-item { 
            display: flex; 
            flex-direction: column; 
            font-size: 0.75rem;
            align-items: center;
        }

        .emoji { font-size: 1.2rem; margin-bottom: 4px; }

        .interaction-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .tap-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            background: #4ecca3;
            color: #1a1a2e;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.05s;
            outline: none;
            box-shadow: 0 8px 0 #3a9b7c; /* Adds depth without layout shift */
        }

        .tap-circle:active {
            transform: scale(0.95);
            box-shadow: 0 4px 0 #3a9b7c;
        }

        .footer-panel {
            padding: 20px;
            background: #0f3460;
            text-align: center;
        }

        .convert-btn {
            padding: 12px 25px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="stats">
            <div class="stat-item">
                <span class="emoji">⚡</span>
                <span id="energy">0</span>
            </div>
            <div class="stat-item">
                <span class="emoji">💎</span>
                <span id="points">0</span>
            </div>
            <div class="stat-item">
                <span class="emoji">🪙</span>
                <span id="gpvlt">0.00</span>
            </div>
        </header>

        <main class="interaction-area">
            <button id="tap-button" class="tap-circle">TAP!</button>
        </main>

        <footer class="footer-panel">
            <div id="pvlt-display" style="margin-bottom: 10px; font-weight: bold;">Claimable: 0.000 PVLT</div>
            <button class="convert-btn" onclick="convertPoints()">Convert 50 💎 to 0.5 gPVLT</button>
        </footer>
    </div>

    <script>
        let energy = 0;
        let points = 0;
        let gpvlt = 0;

        const eEl = document.getElementById('energy');
        const pEl = document.getElementById('points');
        const gEl = document.getElementById('gpvlt');
        const cEl = document.getElementById('pvlt-display');

        function updateUI() {
            eEl.innerText = energy;
            pEl.innerText = points;
            gEl.innerText = gpvlt.toFixed(2);
            let pvlt = gpvlt / 1000;
            cEl.innerText = `Claimable: ${pvlt.toFixed(3)} PVLT`;
        }

        document.getElementById('tap-button').addEventListener('click', () => {
            energy += 1;
            points += 1;
            updateUI();
        });

        function convertPoints() {
            if (points >= 50) {
                points -= 50;
                gpvlt += 0.5;
                updateUI();
            } else {
                alert("Need 50 Points!");
            }
        }
    </script>
</body>
</html>
