<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PVLT Tap Game</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@reown/appkit-ethers5@1.1.0/dist/umd/index.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020b18;
            font-family: Arial, sans-serif;
            color: white;
            touch-action: none; 
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .topbar {
            width: 100%;
            padding: 14px 18px;
            background: #091426;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }
        
        /* PERFECT HITBOX CIRCLE BOUNDS */
        .tapContainer {
            width: 240px;
            height: 240px;
            margin-top: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ef2a4, #00bfff);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 255, 180, 0.25);
            cursor: pointer;
            clip-path: circle(50% at 50% 50%);
            -webkit-clip-path: circle(50% at 50% 50%);
            user-select: none;
            -webkit-user-select: none;
            transform: translateZ(0);
        }
        .tapContainer:active {
            transform: scale(0.96);
        }
        .tapContainer img {
            width: 78%;
            height: 78%;
            object-fit: contain;
            pointer-events: none;
        }
        
        .card {
            width: 100%;
            max-width: 380px;
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #0c1628;
            color: white;
            font-size: 14px;
            outline: none;
            text-align: center;
        }
        .actionBtn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff99, #00ccff);
            color: black;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .actionBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #223147;
            color: #7a8b9e;
        }
        .withdrawBtn {
            background: linear-gradient(90deg, #ffcc00, #ff6600);
            color: white;
        }
        .status {
            text-align: center;
            font-size: 12px;
            color: #00ff99;
            font-weight: bold;
            display: none;
        }
        .info {
            margin-top: 16px;
            font-size: 12px;
            line-height: 1.7;
            opacity: 0.8;
            text-align: center;
            max-width: 380px;
        }
        .balance-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .balance-line {
            display: flex;
            justify-content: space-between;
        }
        .balance-val-user {
            color: #00ff99;
            font-weight: bold;
        }
        .balance-val-treasury {
            color: #00ccff;
            font-weight: bold;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 11, 24, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            width: 90%;
            max-width: 340px;
            background: #091426;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: 0.25s;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #00ff99;
        }
        .modal-box p {
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
            margin-bottom: 24px;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-confirm {
            background: linear-gradient(90deg, #00ff99, #00ccff);
            color: black;
        }
        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body>

<div class="topbar">
    <div>🛢️ <span id="energy">50</span></div>
    <div>⚡ <span id="points">0</span></div>
    <div>💎 <span id="pvltg">0.0000</span></div>
</div>

<div class="main">
    <div class="tapContainer" id="tapZone">
        <img src="images/IMG_1850.png" alt="Pepe Target Grid">
    </div>

    <div class="card">
        <input id="walletInput" value="Connecting to network..." readonly>
        
        <button class="actionBtn" id="walletBtn" onclick="connectWallet()" disabled>LOADING ENGINE...</button>
        <div class="status" id="walletStatus">CONNECTED</div>

        <div class="balance-box">
            <div class="balance-line">
                <span>Your Personal Wallet PVLT:</span>
                <span class="balance-val-user" id="userPvltBalance">0.0000</span>
            </div>
            <div class="balance-line">
                <span>Available Treasury Pool:</span>
                <span class="balance-val-treasury" id="treasuryPvltPool">0.0000</span>
            </div>
        </div>

        <button class="actionBtn" onclick="openBuyModal()">BUY INSTANT ENERGY</button>
        <button class="actionBtn" onclick="swapPoints()">SWAP POINTS → PVLTG</button>
        <button class="actionBtn withdrawBtn" onclick="claimPVLT()">WITHDRAW PVLT</button>
    </div>

    <div class="info">
        1 Tap = 1 Point<br>
        10000 Points = 1 PVLTG<br>
        100 PVLTG = 1 PVLT
    </div>
</div>

<div class="modal-overlay" id="buyModal">
    <div class="modal-box">
        <h3>Buy Energy Pack</h3>
        <p>Buy <b>100,000 Energy</b> for <b>100 PVLT</b></p>
        <div class="modal-buttons">
            <button class="modal-btn btn-cancel" onclick="closeBuyModal()">Cancel</button>
            <button class="modal-btn btn-confirm" id="confirmPaymentBtn" onclick="executeEnergyPurchase()">Confirm</button>
        </div>
    </div>
</div>

<script>
    const API = "https://pepevolt-game-suite.onrender.com/";
    const REOWN_PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";

    const PVLT_TOKEN_ADDRESS = "0xf4c400280f0d6aF9340fCD491F0cb5A7b51f70F1";
    const GAME_TREASURY_ADDRESS = "0x1dC8375d5D8C3fbCBaD85417ce66E9740D6b05e7";
    const TOKEN_DECIMALS = 18;

    let appKitInstance = null;
    let web3Provider = null;
    let wallet = "";
    let points = 0;
    let energy = 50;
    let pvltg = 0;

    const polygonMainnet = {
        chainId: 137,
        name: 'Polygon',
        currency: 'MATIC',
        explorerUrl: 'https://polygonscan.com',
        rpcUrl: 'https://polygon-rpc.com'
    };

    const metadata = {
        name: 'PepeVolt',
        description: 'PVLT Tap Token Game Ecosystem',
        url: 'https://pepevolt.github.io',
        icons: ['https://pepevolt.github.io/images/IMG_1850.png']
    };

    // Engine self-healing boot cycle
    window.addEventListener('load', () => {
        setTimeout(initAppKitEngine, 500); 
    });

    function initAppKitEngine() {
        try {
            if (window.AppKitEthers && window.AppKitEthers.createAppKit) {
                appKitInstance = window.AppKitEthers.createAppKit({
                    ethersConfig: window.AppKitEthers.defaultEthersConfig({ metadata }),
                    chains: [polygonMainnet],
                    projectId: REOWN_PROJECT_ID,
                    features: { analytics: false }
                });

                // Subscribe to connection provider states natively
                appKitInstance.subscribeProvider((state) => {
                    if (state.isConnected && state.provider) {
                        syncConnectedWallet(state.provider);
                    }
                });

                // Ready! Activate custom styling buttons
                const btn = document.getElementById("walletBtn");
                btn.innerText = "CONNECT WALLET";
                btn.disabled = false;
                document.getElementById("walletInput").value = "Connect Polygon Wallet";
            } else {
                setTimeout(initAppKitEngine, 1000);
            }
        } catch (initErr) {
            console.error("Framework configuration exception caught:", initErr);
        }
    }

    function updateUI() {
        document.getElementById("energy").innerText = energy;
        document.getElementById("points").innerText = points;
        document.getElementById("pvltg").innerText = Number(pvltg).toFixed(4);
    }

    function openBuyModal() {
        if (!wallet) { alert("Connect wallet first"); return; }
        document.getElementById("buyModal").classList.add("active");
    }

    function closeBuyModal() {
        document.getElementById("buyModal").classList.remove("active");
    }

    async function fetchOnChainBalances() {
        if (!web3Provider || !wallet) return;
        try {
            const minABI = ["function balanceOf(address owner) external view returns (uint256)"];
            const tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, minABI, web3Provider.getSigner());
            
            const userBalRaw = await tokenContract.balanceOf(wallet);
            const treasuryBalRaw = await tokenContract.balanceOf(GAME_TREASURY_ADDRESS);
            
            document.getElementById("userPvltBalance").innerText = Number(ethers.utils.formatUnits(userBalRaw, TOKEN_DECIMALS)).toFixed(4);
            document.getElementById("treasuryPvltPool").innerText = Number(ethers.utils.formatUnits(treasuryBalRaw, TOKEN_DECIMALS)).toFixed(4);
        } catch (e) {
            console.error("Balance synchronization failed:", e);
        }
    }

    // Programmatic popup activation method
    async function connectWallet() {
        if (!appKitInstance) return;
        try { 
            // This triggers the complete interactive popup sheet with all wallets
            await appKitInstance.open(); 
        } catch (err) { 
            console.error("UI overlay display interrupted:", err);
        }
    }

    async function syncConnectedWallet(rawProvider) {
        try {
            web3Provider = new ethers.providers.Web3Provider(rawProvider);
            const signer = web3Provider.getSigner();
            wallet = await signer.getAddress();

            document.getElementById("walletInput").value = wallet.slice(0, 6) + "..." + wallet.slice(-4);
            document.getElementById("walletBtn").style.display = "none";
            document.getElementById("walletStatus").style.display = "block";

            let res = await fetch(API + "user", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ wallet })
            });
            
            const data = await res.json();
            points = data.points || 0;
            energy = data.energy || 50;
            pvltg = data.pvltg || 0;

            updateUI();
            await fetchOnChainBalances();
        } catch (syncErr) {
            console.error("User match extraction failure:", syncErr);
        }
    }

    async function tap() {
        if (!wallet) { alert("Connect wallet first"); return; }
        try {
            const res = await fetch(API + "tap", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ wallet })
            });
            const data = await res.json();
            if (data.error) { alert(data.error); return; }
            points = data.points;
            energy = data.energy;
            updateUI();
        } catch (err) {
            console.error(err);
        }
    }

    document.getElementById("tapZone").addEventListener("pointerdown", (e) => {
        e.preventDefault();
        tap();
    });

    async function executeEnergyPurchase() {
        const confirmBtn = document.getElementById("confirmPaymentBtn");
        try {
            confirmBtn.innerText = "Processing...";
            confirmBtn.disabled = true;

            const signer = web3Provider.getSigner();
            const treasury = new ethers.Contract(GAME_TREASURY_ADDRESS, ["function buyEnergyPack(uint256 amount) external"], signer);
            const token = new ethers.Contract(PVLT_TOKEN_ADDRESS, [
                "function approve(address spender, uint256 amount) external returns (bool)",
                "function balanceOf(address owner) external view returns (uint256)"
            ], signer);

            const amount = ethers.utils.parseUnits("100", TOKEN_DECIMALS);
            const rawBalance = await token.balanceOf(wallet);

            if (rawBalance.lt(amount)) { alert("Insufficient PVLT Balance"); return; }

            const appTx = await token.approve(GAME_TREASURY_ADDRESS, amount);
            await appTx.wait();

            const tx = await treasury.buyEnergyPack(amount);
            closeBuyModal();
            await tx.wait();

            const refillRes = await fetch(API + "refill", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ wallet, txHash: tx.hash })
            });

            const refillData = await refillRes.json();
            energy = refillData.energy;
            updateUI();
            await fetchOnChainBalances();
            alert("100,000 Energy Refilled!");
        } catch (err) {
            console.error(err);
            alert("Transaction processing dropped.");
        } finally {
            confirmBtn.innerText = "Confirm";
            confirmBtn.disabled = false;
            closeBuyModal();
        }
    }

    async function swapPoints() {
        if (!wallet) { alert("Connect wallet first"); return; }
        try {
            const res = await fetch(API + "swap-points", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ wallet })
            });
            const data = await res.json();
            if (data.error) { alert(data.error); return; }
            points = data.points;
            pvltg = data.pvltg;
            updateUI();
            alert("Points converted to PVLTG successfully.");
        } catch (err) {
            console.error(err);
        }
    }

    async function claimPVLT() {
        if (!wallet) { alert("Connect wallet first"); return; }
        if (pvltg < 100) { alert("Need minimum 100 PVLTG to withdraw real tokens."); return; }
        try {
            const res = await fetch(API + "claim-pvltg", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ wallet })
            });
            const data = await res.json();
            if (data.error) { alert(data.error); return; }
            pvltg = data.pvltg;
            updateUI();
            await fetchOnChainBalances();
            alert("Withdrawal Complete! PVLT sent directly to your wallet.");
        } catch (err) {
            console.error(err);
        }
    }

    setInterval(() => {
        if (wallet && energy < 50) {
            energy += 1;
            updateUI();
        }
    }, 30000);

    updateUI();
</script>
</body>
</html>
