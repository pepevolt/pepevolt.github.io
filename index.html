<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PVLT Tap Game — Next Gen Interface</title>
  <!-- Ethers + WalletConnect (same core libs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 30%, #030d1f, #01060f);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: white;
      touch-action: none;
    }

    /* glassmorphism + smooth scroll main container */
    body {
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(0px);
    }

    /* ===== NEW MODERN TOPBAR ===== */
    .topbar {
      width: 100%;
      padding: 16px 22px;
      background: rgba(8, 20, 40, 0.65);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 255, 170, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .stat-badge {
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 18px;
      border-radius: 60px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0,255,180,0.3);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .stat-badge span:first-child {
      font-size: 18px;
    }

    .stat-value {
      font-weight: 800;
      background: linear-gradient(135deg, #eef2ff, #a0f0e0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 4px rgba(0,255,200,0.3);
    }

    /* main area with improved spacing */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 30px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    /* TAP BUTTON — 3D + ripple + glow */
    .tap-btn-wrapper {
      position: relative;
      margin: 12px 0 10px;
    }

    .tapBtn {
      width: 270px;
      height: 270px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #00ffc3, #0099ff);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.08s linear;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 30px rgba(0, 200, 180, 0.4), 0 0 0 2px rgba(0,255,210,0.5) inset, 0 0 0 4px rgba(255,255,255,0.2) inset;
    }

    .tapBtn:active {
      transform: scale(0.93);
      box-shadow: 0 8px 18px rgba(0,200,180,0.7), 0 0 0 2px #b0ffe0 inset;
    }

    .tapBtn img {
      width: 72%;
      height: 72%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    /* modern card panel with neumorphism */
    .glass-card {
      width: 100%;
      max-width: 440px;
      margin-top: 28px;
      background: rgba(12, 25, 45, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 42px;
      border: 1px solid rgba(0, 255, 180, 0.25);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 18px 35px -10px rgba(0,0,0,0.4);
    }

    .input-fancy {
      width: 100%;
      padding: 16px 18px;
      border: none;
      border-radius: 60px;
      background: #07152b;
      color: white;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      border: 1px solid rgba(0,255,180,0.2);
      text-align: center;
      letter-spacing: 0.3px;
    }

    .input-fancy:focus {
      border-color: #00ffaa;
      box-shadow: 0 0 8px #00ffaa60;
    }

    /* gradient buttons with micro-interactions */
    .actionBtn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 60px;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(95deg, #00ffb3, #0cb0ff);
      color: #010a14;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
      box-shadow: 0 5px 12px rgba(0,220,180,0.2);
    }

    .actionBtn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 5px rgba(0,255,180,0.4);
    }

    .status {
      text-align: center;
      font-size: 12px;
      opacity: 0.85;
      background: #0c1b2e80;
      border-radius: 50px;
      padding: 6px;
      display: none;
    }

    .info {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.6;
      background: rgba(0,0,0,0.3);
      padding: 12px 20px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      text-align: center;
      max-width: 440px;
      font-weight: 500;
    }

    /* premium modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 12, 27, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 90%;
      max-width: 360px;
      background: #0a1a2f;
      border: 1px solid rgba(0, 255, 200, 0.5);
      border-radius: 40px;
      padding: 28px 20px;
      text-align: center;
      transform: scale(0.92);
      transition: 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      box-shadow: 0 25px 40px black;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-box h3 {
      font-size: 26px;
      margin-bottom: 12px;
      background: linear-gradient(120deg, #aaffdd, #88ddff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .modal-box p {
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.9;
      margin-bottom: 28px;
    }

    .modal-buttons {
      display: flex;
      gap: 14px;
    }

    .modal-btn {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.1s;
    }

    .btn-confirm {
      background: linear-gradient(95deg, #00ffc3, #1e90ff);
      color: #0a0f1a;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* custom scroll */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: #021020;
    }
    ::-webkit-scrollbar-thumb {
      background: #00ffaa;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="stat-badge">
    <span>🔋</span> 
    <span class="stat-value" id="energy">50</span>
  </div>
  <div class="stat-badge">
    <span>⚡</span> 
    <span class="stat-value" id="points">0</span>
  </div>
  <div class="stat-badge">
    <span>💎</span> 
    <span class="stat-value" id="pvltg">0.0000</span>
  </div>
</div>

<div class="main">
  <div class="tap-btn-wrapper">
    <button class="tapBtn" onclick="tap()">
      <img src="images/IMG_1850.png" alt="Tap Coin" onerror="this.src='https://placehold.co/200x200/0a2a3a/00ffaa?text=PVLT'">
    </button>
  </div>

  <div class="glass-card">
    <input id="walletInput" class="input-fancy" placeholder="🔗 Connect wallet (Polygon)" readonly>
    <button class="actionBtn" id="walletBtn" onclick="connectWallet()">
      🚀 CONNECT WALLET
    </button>
    <div class="status" id="walletStatus">
      ✅ Wallet synced
    </div>
    <button class="actionBtn" onclick="openBuyModal()">
      ⚡ BUY ENERGY (100k)
    </button>
    <button class="actionBtn" onclick="swapPoints()">
      🔄 SWAP POINTS → PVLTG
    </button>
    <button class="actionBtn" onclick="claimPVLT()">
      💰 CLAIM PVLT
    </button>
  </div>

  <div class="info">
    ✨ 1 Tap = 1 Point &nbsp;&nbsp;|&nbsp;&nbsp; 10,000 Points = 1 PVLTG <br>
    💎 100 PVLTG = 1 PVLT &nbsp;&nbsp;⚡ Energy restores +1 / 30 sec
  </div>
</div>

<!-- buy energy modal -->
<div class="modal-overlay" id="buyModal">
  <div class="modal-box">
    <h3>💎 ENERGY PACK</h3>
    <p>Buy <strong style="color:#aaffdd">100,000 Energy</strong><br>for <strong style="color:#ffdd88">100 PVLT</strong></p>
    <div class="modal-buttons">
      <button class="modal-btn btn-cancel" onclick="closeBuyModal()">Cancel</button>
      <button class="modal-btn btn-confirm" id="confirmPaymentBtn" onclick="executeEnergyPurchase()">Confirm</button>
    </div>
  </div>
</div>

<script>
  /* ================= CONFIGURATION (SAME BACKEND) ================= */
  const API = "https://pvlt-server.onrender.com";
  const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";
  const PVLT_TOKEN_ADDRESS = "0xC096dB70Fa05255b210Be58Ec2508Bed61e8dfD6";
  const PVLTG_TOKEN_ADDRESS = "0x3094Dc50cB01721eE6c0ECAf18bd0D15c154ba2d";
  const GAME_TREASURY_ADDRESS = "0xe2bb81bD8e36367F2C85c89F0B03570dFCaf5D57";
  const TOKEN_DECIMALS = 18;

  let web3Provider = null;
  let wallet = "";
  let points = 0;
  let energy = 50;
  let pvltg = 0;

  // Helper UI updates (smooth)
  function updateUI() {
    const energyEl = document.getElementById("energy");
    const pointsEl = document.getElementById("points");
    const pvltgEl = document.getElementById("pvltg");
    if (energyEl) energyEl.innerText = Math.floor(energy);
    if (pointsEl) pointsEl.innerText = points;
    if (pvltgEl) pvltgEl.innerText = Number(pvltg).toFixed(4);
  }

  // modal controls
  function openBuyModal() {
    if (!wallet) {
      alert("🔐 Connect wallet first to buy energy.");
      return;
    }
    document.getElementById("buyModal").classList.add("active");
  }
  function closeBuyModal() {
    document.getElementById("buyModal").classList.remove("active");
  }

  // Connect wallet (works with both metamask & walletconnect)
  async function connectWallet() {
    try {
      if (window.ethereum) {
        await window.ethereum.request({ method: "eth_requestAccounts" });
        web3Provider = new ethers.providers.Web3Provider(window.ethereum);
      } else {
        const WalletConnectProvider = window["@walletconnect/ethereum-provider"].EthereumProvider;
        const wcProvider = await WalletConnectProvider.init({
          projectId: PROJECT_ID,
          chains: [137],
          showQrModal: true
        });
        await wcProvider.connect();
        web3Provider = new ethers.providers.Web3Provider(wcProvider);
      }
      const signer = web3Provider.getSigner();
      wallet = await signer.getAddress();
      document.getElementById("walletInput").value = wallet.slice(0,6) + "..." + wallet.slice(-4);
      document.getElementById("walletBtn").innerHTML = "✅ CONNECTED";
      document.getElementById("walletStatus").style.display = "block";

      // load user data from backend
      const res = await fetch(API + "/user", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await res.json();
      points = data.points ?? 0;
      energy = data.energy ?? 50;
      pvltg = data.pvltg ?? 0;
      updateUI();
    } catch (err) {
      console.error(err);
      alert("⚠️ Connection failed: " + (err.message || "unknown error"));
    }
  }

  // TAP GAME action (energy system + points)
  async function tap() {
    if (!wallet) {
      alert("🔗 Please connect wallet before tapping");
      return;
    }
    try {
      const res = await fetch(API + "/tap", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      points = data.points;
      energy = data.energy;
      updateUI();

      // subtle haptic feedback (vibration if supported)
      if (navigator.vibrate) navigator.vibrate(20);
    } catch (err) {
      console.error(err);
      alert("Tap error, check network");
    }
  }

  // BUY ENERGY (100 PVLT transaction)
  async function executeEnergyPurchase() {
    const confirmBtn = document.getElementById("confirmPaymentBtn");
    try {
      if (!wallet) throw new Error("Connect wallet first");
      confirmBtn.innerText = "⏳ Processing...";
      confirmBtn.disabled = true;

      if (!web3Provider) throw new Error("No provider");
      const network = await web3Provider.getNetwork();
      if (network.chainId !== 137) {
        alert("🌐 Switch to Polygon Mainnet (chainId 137)");
        return;
      }
      const signer = web3Provider.getSigner();
      const tokenContract = new ethers.Contract(
        PVLT_TOKEN_ADDRESS,
        ["function transfer(address to,uint256 amount) external returns(bool)", "function balanceOf(address owner) view returns(uint256)"],
        signer
      );
      const amount = ethers.utils.parseUnits("100", TOKEN_DECIMALS);
      const rawBalance = await tokenContract.balanceOf(wallet);
      if (rawBalance.lt(amount)) {
        alert(`❌ Insufficient PVLT balance. Need 100 PVLT. Your balance: ${ethers.utils.formatUnits(rawBalance, TOKEN_DECIMALS)} PVLT`);
        return;
      }
      const tx = await tokenContract.transfer(GAME_TREASURY_ADDRESS, amount);
      closeBuyModal();
      alert("📡 Transaction submitted, waiting confirmation...");
      await tx.wait();

      // call backend refill
      const refillRes = await fetch(API + "/refill", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet, txHash: tx.hash })
      });
      const refillData = await refillRes.json();
      if (refillData.error) throw new Error(refillData.error);
      energy = refillData.energy;
      updateUI();
      alert("✅ +100,000 ENERGY! Keep tapping!");
    } catch (err) {
      console.error(err);
      let msg = err.reason || err.data?.message || err.message || "Transaction failed";
      alert("❌ Energy purchase failed:\n" + msg);
    } finally {
      confirmBtn.innerText = "Confirm";
      confirmBtn.disabled = false;
      closeBuyModal();
    }
  }

  // SWAP POINTS -> PVLTG (backend handles conversion)
  async function swapPoints() {
    if (!wallet) {
      alert("Connect wallet first");
      return;
    }
    if (points < 1) {
      alert("No points to swap. Tap first!");
      return;
    }
    try {
      const res = await fetch(API + "/swap-points", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      points = 0;
      pvltg = data.pvltg;
      updateUI();
      alert(`✨ Swapped! New PVLTG balance: ${pvltg.toFixed(4)}`);
    } catch (err) {
      console.error(err);
      alert("Swap error, try again");
    }
  }

  // CLAIM PVLT (needs min 100 PVLTG, uses approve + backend)
  async function claimPVLT() {
    if (!wallet) {
      alert("Connect wallet first");
      return;
    }
    if (pvltg < 100) {
      alert(`⚠️ Minimum 100 PVLTG required to claim PVLT. Current: ${pvltg.toFixed(4)} PVLTG`);
      return;
    }
    try {
      const signer = web3Provider.getSigner();
      const pvltTokenContract = new ethers.Contract(
        PVLT_TOKEN_ADDRESS,
        ["function approve(address spender,uint256 amount) external returns(bool)"],
        signer
      );
      const amountToApprove = ethers.utils.parseUnits(pvltg.toString(), TOKEN_DECIMALS);
      const approveTx = await pvltTokenContract.approve(GAME_TREASURY_ADDRESS, amountToApprove);
      await approveTx.wait();

      // call claim endpoint
      const res = await fetch(API + "/claim-pvltg", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      pvltg = 0;
      updateUI();
      alert("🎉 PVLT successfully claimed to your wallet!");
    } catch (err) {
      console.error(err);
      alert("Claim failed: " + (err.message || "unknown error"));
    }
  }

  // auto energy refill (every 30 sec, max maybe uncapped but logic sync with backend)
  // improved: energy restoration LOCAL simulation, but also syncs after each tap or refill.
  // However to be consistent with backend, we only update UI locally.
  setInterval(() => {
    if (wallet && energy < 500) {
      // mimic energy +1 but does not desync because actual tap/refill will override.
      // but we also respect backend reality: only local display to feel reactive.
      // worst case, next tap fetches fresh. To avoid UI desync, we push gentle increment.
      if (energy < 9999) {
        energy = Math.min(energy + 1, 9999);
        updateUI();
        // optional: silently notify server to prevent out of sync? not needed, next tap corrects.
        // This is pure UI positive feedback.
      }
    } else if (!wallet) {
      // nothing
    } else {
      if (energy < 9999) {
        energy = energy + 1;
        updateUI();
      }
    }
  }, 30000);

  // also extra interval for background energy correction for players who keep page open? not mandatory but nice.
  // plus network online sync if needed? keep original functional.

  // add listener for network changes to refresh wallet metadata
  if (window.ethereum) {
    window.ethereum.on('accountsChanged', (accounts) => {
      if (accounts.length === 0) {
        wallet = "";
        document.getElementById("walletInput").value = "";
        document.getElementById("walletBtn").innerHTML = "CONNECT WALLET";
        document.getElementById("walletStatus").style.display = "none";
        points = 0; energy = 50; pvltg = 0;
        updateUI();
      } else {
        window.location.reload(); // simpler: reload to re-fetch data
      }
    });
    window.ethereum.on('chainChanged', () => window.location.reload());
  }

  // init UI
  updateUI();
  
  // small fallback image if img missing
  document.querySelectorAll('.tapBtn img').forEach(img => {
    img.onerror = function() { this.src = "https://placehold.co/240x240/0b2a3a/00ffaa?text=PVLT"; };
  });
</script>
</body>
</html>
