<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>PVLT Tap Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
}

body{
display:flex;
flex-direction:column;
}

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow:hidden;
}

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:25px;

font-size:28px;
font-weight:bold;

background:linear-gradient(135deg,#00ff99,#00ccff);
color:black;
}

.tap:active{
transform:scale(0.96);
}

.card{
width:90%;
max-width:360px;
margin-top:15px;
padding:15px;

background:rgba(255,255,255,0.05);
border-radius:14px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>

</head>

<body>

<!-- NAV -->
<div class="nav">
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0.0000</span></div>
<div>🔋 <span id="energy">50</span></div>
<div>👤 <span id="walletView">guest</span></div>
</div>

<!-- MAIN -->
<div class="container">

<button class="tap" onclick="tap()">TAP</button>

<div class="small">1 Tap = 1 Point | Energy max 50</div>

<!-- WALLET -->
<div class="card">

<input id="walletInput" placeholder="Paste BSC wallet">

<button onclick="toggleWallet()">
CONNECT WALLET
</button>

</div>

<!-- ENERGY -->
<div class="card">

<div class="small">
Buy Energy using PVLT Token
</div>

<button onclick="buyEnergy()">
BUY ENERGY (RECHARGE)
</button>

</div>

<!-- CLAIM SECTION (ADDED FIX) -->
<div class="card">

<div class="small">
Min Claim: 100 Tokens  
Max Claim: 500 Tokens  
</div>

<button onclick="claim()">
CLAIM TOKENS
</button>

</div>

</div>

<script>

/* ================= STATE ================= */

let wallet="";
let points=0;

let energy=50;
const MAX_ENERGY=50;

/* ================= ENERGY REGEN ================= */

setInterval(()=>{

if(energy < MAX_ENERGY){
energy += 1;
document.getElementById("energy").innerText = energy;
}

},4000);

/* ================= TAP ================= */

function tap(){

if(!wallet){
alert("Connect wallet");
return;
}

if(energy<=0){
alert("No energy");
return;
}

energy--;
points++;

updateUI();

}

/* ================= BUY ENERGY ================= */

function buyEnergy(){

if(!wallet){
alert("Connect wallet");
return;
}

/*
REAL CONTRACT HOOK:
PVLT token payment will be added here:
approve() + transferFrom()
*/

energy = MAX_ENERGY;
updateUI();

alert("Energy recharged using PVLT tokens (pending contract integration)");
}

/* ================= CLAIM FUNCTION ================= */

function claim(){

if(!wallet){
alert("Connect wallet");
return;
}

let tokens = points / 10000;

/* MIN/MAX RULE */
if(tokens < 100){
alert("Minimum 100 tokens required");
return;
}

if(tokens > 500){
tokens = 500;
}

/* hidden fee (NOT shown in UI) */
let fee = 1; // $1 internal deduction

/* RESET AFTER CLAIM */
points = 0;

updateUI();

alert(
"CLAIM SUCCESS\n\n" +
"Tokens: " + tokens.toFixed(4) +
"\nStatus: Completed"
);

}

/* ================= WALLET ================= */

function toggleWallet(){

const input=document.getElementById("walletInput");
const view=document.getElementById("walletView");

if(wallet){

wallet="";
points=0;
energy=50;

input.value="";

view.innerText="guest";

updateUI();

return;
}

let w=input.value.trim();

if(!w.startsWith("0x")||w.length!==42){
alert("Invalid wallet");
return;
}

wallet=w.toLowerCase();

view.innerText=
wallet.slice(0,6)+"..."+wallet.slice(-4);

}

/* ================= UI ================= */

function updateUI(){

document.getElementById("points").innerText=points;
document.getElementById("tokens").innerText=(points/10000).toFixed(4);
document.getElementById("energy").innerText=energy;

}

</script>

</body>
</html>
