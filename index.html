<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap Game</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a2e; color: #ffffff; font-family: sans-serif; overflow: hidden; touch-action: manipulation; }
        .game-container { display: flex; flex-direction: column; height: 100vh; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 15px 5px; background: #16213e; text-align: center; }
        .stat-item { display: flex; flex-direction: column; font-size: 0.75rem; }
        .emoji { font-size: 1.2rem; margin-bottom: 4px; }
        .interaction-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
        .tap-circle { width: 180px; height: 180px; border-radius: 50%; border: none; background: #4ecca3; color: #1a1a2e; font-size: 2rem; font-weight: bold; cursor: pointer; transition: transform 0.05s; box-shadow: 0 8px 0 #3a9b7c; }
        .tap-circle:active { transform: scale(0.95); box-shadow: 0 4px 0 #3a9b7c; }
        .energy-bar { margin: 10px 0; width: 80%; height: 20px; background: #0f3460; border-radius: 10px; overflow: hidden; }
        .energy-fill { height: 100%; background: #4ecca3; width: 100%; transition: width 0.3s; }
        
        /* Buttons */
        .footer-panel { padding: 15px; background: #0f3460; text-align: center; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 12px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-convert { background: #e94560; color: white; }
        .btn-claim { background: #f39c12; color: #1a1a2e; font-size: 1.1rem; width: 80%; }
        .btn-buy-energy { background: #4ecca3; color: #1a1a2e; font-size: 1.1rem; width: 80%; }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="stats">
            <div class="stat-item"><span class="emoji">⚡</span><span id="energy">50/50</span></div>
            <div class="stat-item"><span class="emoji">💎</span><span id="points">0</span></div>
            <div class="stat-item"><span class="emoji">🪙</span><span id="gpvlt">0.00</span></div>
        </header>

        <main class="interaction-area">
            <button id="tap-button" class="tap-circle">TAP!</button>
            <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
            <div id="pvlt-display" style="font-size: 1.2rem; font-weight: bold;">Balance: 0.000 PVLT</div>
            
            <!-- Claim and Buy Buttons -->
            <button class="btn-claim" onclick="claimReward()">Claim Reward</button>
            <button class="btn-buy-energy" onclick="buyEnergy()">Buy Energy (1 gPVLT)</button>
        </main>

        <footer class="footer-panel">
            <button class="btn-convert" onclick="convertPoints()">Convert 100 💎 → 1 gPVLT</button>
            <button class="btn-convert" style="background: #f1c40f; color: #1a1a2e;" onclick="convertGPVLT()">Convert 100 gPVLT → 1 PVLT</button>
        </footer>
    </div>

    <script>
        let energy = parseInt(localStorage.getItem('energy')) || 50;
        let points = parseInt(localStorage.getItem('points')) || 0;
        let gpvlt = parseFloat(localStorage.getItem('gpvlt')) || 0;
        let pvlt = parseFloat(localStorage.getItem('pvlt')) || 0;

        function saveGame() {
            localStorage.setItem('energy', energy);
            localStorage.setItem('points', points);
            localStorage.setItem('gpvlt', gpvlt);
            localStorage.setItem('pvlt', pvlt);
        }

        setInterval(() => {
            if (energy < 50) {
                energy++;
                updateUI();
                saveGame();
            }
        }, 1000);

        function updateUI() {
            document.getElementById('energy').innerText = `${energy}/50`;
            document.getElementById('energy-fill').style.width = (energy / 50 * 100) + "%";
            document.getElementById('points').innerText = points;
            document.getElementById('gpvlt').innerText = gpvlt.toFixed(2);
            document.getElementById('pvlt-display').innerText = `Balance: ${pvlt.toFixed(3)} PVLT`;
        }

        document.getElementById('tap-button').addEventListener('click', () => {
            if (energy > 0) {
                energy--;
                points += 1;
                updateUI();
                saveGame();
            }
        });

        function buyEnergy() {
            if (gpvlt >= 1) {
                gpvlt -= 1;
                energy = 50;
                updateUI();
                saveGame();
            } else {
                alert("Need 1 gPVLT to refill energy!");
            }
        }

        function convertPoints() {
            if (points >= 100) {
                points -= 100;
                gpvlt += 1;
                updateUI(); saveGame();
            } else { alert("Need 100 💎!"); }
        }

        function convertGPVLT() {
            if (gpvlt >= 100) {
                gpvlt -= 100;
                pvlt += 1;
                updateUI(); saveGame();
            } else { alert("Need 100 gPVLT!"); }
        }

        function claimReward() {
            if (pvlt > 0) {
                alert(`Success! Claimed ${pvlt.toFixed(3)} PVLT.`);
                pvlt = 0;
                updateUI(); saveGame();
            } else { alert("No PVLT available."); }
        }

        updateUI();
    </script>
</body>
</html>
