<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Game - Vibrant UI</title>
    <style>
        :root {
            --accent-purple: #8e44ad;
            --accent-blue: #3498db;
            --accent-green: #27ae60;
            --accent-orange: #f39c12;
            --bg: #fdfdfd;
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: #f0f2f5; color: #333;
        }

        .game-container { padding: 20px; max-width: 400px; margin: auto; }

        /* Colorful Stats */
        .stats-card { 
            background: white; padding: 20px; border-radius: 28px; 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin-bottom: 30px; border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .stat-item { text-align: center; }
        .stat-val { display: block; font-size: 1.2rem; font-weight: 800; }
        #energy-display { color: var(--accent-orange); }
        #points-display { color: var(--accent-purple); }
        #burned-display { color: var(--accent-green); }

        /* Colorful Tap Circle */
        .tap-circle { 
            width: 190px; height: 190px; border-radius: 50%; 
            border: none; cursor: pointer;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: white; font-size: 1.8rem; font-weight: 900;
            box-shadow: 0 15px 30px rgba(250, 208, 196, 0.6);
            margin: 0 auto 30px; display: block;
            transition: transform 0.2s;
        }
        .tap-circle:active { transform: scale(0.9); }
        .tap-circle:disabled { background: #e0e0e0; box-shadow: none; color: #999; }

        /* Colorful Energy */
        .energy-bar { height: 12px; background: #eee; border-radius: 6px; margin-bottom: 30px; overflow: hidden; }
        .energy-fill { 
            height: 100%; background: linear-gradient(90deg, var(--accent-orange), #ff4757); 
            border-radius: 6px; width: 0%; transition: 0.3s; 
        }

        /* Action Buttons */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { 
            padding: 14px; border-radius: 16px; border: none; font-weight: 700; 
            cursor: pointer; color: white; transition: filter 0.2s;
        }
        .btn:active { filter: brightness(0.9); }
        #wallet-btn { background: var(--accent-blue); grid-column: span 2; }
        #buy-btn { background: var(--accent-orange); }
        #convert-btn { background: var(--accent-purple); }
        #claim-btn { background: var(--accent-green); grid-column: span 2; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-card">
            <div class="stat-item"><span class="stat-val" id="energy-display">0</span><small>Energy</small></div>
            <div class="stat-item"><span class="stat-val" id="points-display">0</span><small>Gems</small></div>
            <div class="stat-item"><span class="stat-val" id="burned-display">0.0</span><small>Balance</small></div>
        </div>

        <button id="tap-button" class="tap-circle" disabled>TAP!</button>

        <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>

        <div class="action-grid">
            <button id="wallet-btn" class="btn" onclick="toggleWallet()">Connect Wallet</button>
            <button id="buy-btn" class="btn" onclick="confirmRefill()" disabled>Refill</button>
            <button id="convert-btn" class="btn" onclick="convertPVLT()" disabled>Convert</button>
            <button id="claim-btn" class="btn" onclick="claimPVLT()" disabled>Claim Rewards</button>
        </div>
    </div>
</body>
</html>
