<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #080b10; --accent: #ffaa00; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* Top Status Bar */
        .header { display: flex; justify-content: space-between; padding: 20px; font-weight: bold; background: rgba(255,255,255,0.05); }
        
        /* Fixed Center Tap Area */
        .tap-zone { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .tap-btn { 
            width: 180px; height: 180px; background: radial-gradient(circle, #ffaa00, #5d3d00);
            border-radius: 50%; border: 4px solid #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 4rem;
            box-shadow: 0 0 30px rgba(255,170,0,0.5); transition: transform 0.1s;
        }
        .tap-btn:active { transform: scale(0.95); }

        /* Bottom Control Panel */
        .footer { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #111; }
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-swap { background: #333; color: white; }
        .btn-main { background: var(--accent); color: #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>Mined: <span id="count">0</span></div>
        <div>Pool: <span id="pool">145</span></div>
    </div>

    <div class="tap-zone">
        <div class="tap-btn" onclick="tap()">🪙</div>
    </div>

    <div class="footer">
        <button class="btn btn-swap" onclick="swap()">Swap</button>
        <button class="btn btn-main" onclick="convert()">Convert</button>
    </div>
</div>

<script>
    let count = 0;
    const tg = window.Telegram.WebApp;
    tg.expand();

    function tap() {
        count++;
        document.getElementById('count').textContent = count;
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function swap() { alert("Swapping points..."); }
    function convert() { alert("Converting assets..."); }
</script>
</body>
</html>
