<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PVLT Tap Game</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
  text-align: center;
}

.header {
  padding: 15px;
  font-size: 18px;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: #2d6cdf;
  color: white;
  font-weight: bold;
}

#tapArea {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at top, #3ee6a8, #167dff);
  margin: 40px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  user-select: none;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(0,255,200,0.4);
}

.stats {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="header">
  <button id="connectBtn">WalletConnect - Connect Your Wallet</button>
</div>

<div id="tapArea">TAP</div>

<div class="stats">
  <div>Points: <span id="points">0</span></div>
  <div>Energy: <span id="energy">0</span></div>
</div>

<button onclick="refill()">Refill Energy</button>
<button onclick="convert()">Convert Points</button>

<!-- WalletConnect + Ethers -->
<script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.11.0/dist/index.umd.js"></script>

<script>
const PVLT_ABI = [ /* your ABI shortened in UI below not repeated for space */ ];
const GAME_ABI = [ /* your ABI shortened */ ];
const TREASURY_ABI = [ /* your ABI shortened */ ];

const PVLT_ADDRESS = "0x5f7df6862f439b691507dc20069f4f73a37cb08b";
const GAME_ADDRESS = "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

let provider, signer, gameContract, user;

const connectBtn = document.getElementById("connectBtn");

async function connectWallet() {
  const ethereumProvider = await WalletConnectEthereumProvider.init({
    projectId: "1731f99148b9cf6107dee70b6efb14b7",
    chains: [137], // Polygon
    showQrModal: true,
    methods: ["eth_sendTransaction", "eth_sign", "personal_sign"],
    events: ["chainChanged", "accountsChanged"]
  });

  await ethereumProvider.connect();

  provider = new ethers.providers.Web3Provider(ethereumProvider);
  signer = provider.getSigner();
  user = await signer.getAddress();

  gameContract = new ethers.Contract(GAME_ADDRESS, GAME_ABI, signer);

  connectBtn.innerText = "Connected: " + user.slice(0,6) + "...";

  loadStats();
}

connectBtn.onclick = connectWallet;

document.getElementById("tapArea").onclick = async () => {
  if (!gameContract) return alert("Connect wallet first");
  const tx = await gameContract.tap();
  await tx.wait();
  loadStats();
};

async function loadStats() {
  const data = await gameContract.players(user);
  document.getElementById("points").innerText = data.points.toString();
  document.getElementById("energy").innerText = data.energy.toString();
}

async function refill() {
  if (!gameContract) return;
  const tx = await gameContract.refillEnergy();
  await tx.wait();
  loadStats();
}

async function convert() {
  if (!gameContract) return;
  const tx = await gameContract.convertPoints();
  await tx.wait();
  loadStats();
}
</script>

</body>
</html>
