<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PVLT Tap Game</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020b18;
font-family:Arial,sans-serif;
color:white;

/* 🔥 FIX ZOOM ISSUE */
touch-action: manipulation;
overscroll-behavior: none;
-webkit-text-size-adjust: 100%;
}

/* ================= BODY ================= */

body{
display:flex;
flex-direction:column;
}

/* ================= TOPBAR ================= */

.topbar{
width:100%;
padding:14px 18px;
background:#091426;
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
font-weight:bold;
}

/* ================= MAIN ================= */

.main{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow-y:auto;
}

/* ================= TAP BUTTON FIX ================= */

.tapBtn{
width:240px;
height:240px;
border:none;
border-radius:50%;
overflow:hidden;
margin-top:20px;
background:linear-gradient(135deg,#00ff99,#00ccff);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 30px rgba(0,255,180,0.25);
cursor:pointer;

/* FIX FOR ZOOM & JITTER */
transform: translateZ(0);
-webkit-transform: translateZ(0);
will-change: transform;
}

.tapBtn:active{
transform: scale(0.97) translateZ(0);
}

.tapBtn img{
width:78%;
height:78%;
object-fit:contain;
pointer-events:none;
}

/* ================= CARD ================= */

.card{
width:100%;
max-width:380px;
margin-top:28px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:18px;
display:flex;
flex-direction:column;
gap:14px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#0c1628;
color:white;
font-size:14px;
outline:none;
}

.actionBtn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
cursor:pointer;
}

.status{
text-align:center;
font-size:12px;
opacity:0.8;
display:none;
}

.info{
margin-top:16px;
font-size:12px;
line-height:1.7;
opacity:0.8;
text-align:center;
max-width:380px;
}

/* ================= MODAL ================= */

.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(2,11,24,0.85);
backdrop-filter:blur(5px);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
opacity:0;
pointer-events:none;
transition:0.25s;
}

.modal-overlay.active{
opacity:1;
pointer-events:auto;
}

.modal-box{
width:90%;
max-width:340px;
background:#091426;
border:1px solid rgba(255,255,255,0.15);
border-radius:20px;
padding:24px;
text-align:center;
transform:scale(0.9);
transition:0.25s;
}

.modal-overlay.active .modal-box{
transform:scale(1);
}

.modal-box h3{
font-size:18px;
margin-bottom:12px;
color:#00ff99;
}

.modal-box p{
font-size:14px;
line-height:1.5;
opacity:0.9;
margin-bottom:24px;
}

.modal-buttons{
display:flex;
gap:12px;
}

.modal-btn{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.btn-confirm{
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.btn-cancel{
background:rgba(255,255,255,0.1);
color:white;
}

</style>

</head>

<body>

<div class="topbar">
<div>🔋 <span id="energy">50</span></div>
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="pvltg">0.0000</span></div>
</div>

<div class="main">

<button class="tapBtn" onclick="tap()">
<img src="images/IMG_1850.png">
</button>

<div class="card">

<input id="walletInput" placeholder="Connect Wallet" readonly>

<button class="actionBtn" onclick="connectWallet()" id="walletBtn">
CONNECT WALLET
</button>

<div class="status" id="walletStatus">Wallet Connected</div>

<button class="actionBtn" onclick="openBuyModal()">BUY ENERGY</button>
<button class="actionBtn" onclick="swapPoints()">SWAP POINTS</button>
<button class="actionBtn" onclick="claimPVLT()">CLAIM PVLT</button>

</div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="buyModal">
<div class="modal-box">

<h3>Buy Energy Pack</h3>
<p>Buy 100,000 Energy for 100 PVLT</p>

<div class="modal-buttons">
<button class="modal-btn btn-cancel" onclick="closeBuyModal()">Cancel</button>
<button class="modal-btn btn-confirm" id="confirmPaymentBtn" onclick="executeEnergyPurchase()">Confirm</button>
</div>

</div>
</div>

<script>

/* ================= BLOCK ZOOM (FINAL FIX) ================= */

document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("gestureend", e => e.preventDefault());

document.addEventListener("touchmove", function(e){
    if(e.scale !== 1){
        e.preventDefault();
    }
}, { passive:false });

/* ================= CONFIG ================= */

const API = "https://pvlt-server.onrender.com";
const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";

const PVLT_TOKEN_ADDRESS = "0xC096dB70Fa05255b210Be58Ec2508Bed61e8dfD6";
const GAME_TREASURY_ADDRESS = "0xe2bb81bD8e36367F2C85c89F0B03570dFCaf5D57";
const TOKEN_DECIMALS = 18;

/* ================= STATE ================= */

let web3Provider;
let wallet = "";
let points = 0;
let energy = 50;
let pvltg = 0;

/* ================= UI ================= */

function updateUI(){
document.getElementById("energy").innerText = energy;
document.getElementById("points").innerText = points;
document.getElementById("pvltg").innerText = Number(pvltg).toFixed(4);
}

/* ================= MODAL ================= */

function openBuyModal(){
if(!wallet) return alert("Connect wallet first");
document.getElementById("buyModal").classList.add("active");
}

function closeBuyModal(){
document.getElementById("buyModal").classList.remove("active");
}

/* ================= TAP ================= */

async function tap(){

if(!wallet) return alert("Connect wallet first");

const res = await fetch(API+"/tap",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet})
});

const data = await res.json();

if(data.error) return alert(data.error);

points = data.points;
energy = data.energy;

updateUI();
}

/* ================= CONNECT ================= */

async function connectWallet(){

if(window.ethereum){
await window.ethereum.request({method:"eth_requestAccounts"});
web3Provider = new ethers.providers.Web3Provider(window.ethereum);
}

const signer = web3Provider.getSigner();
wallet = await signer.getAddress();

document.getElementById("walletInput").value =
wallet.slice(0,6)+"..."+wallet.slice(-4);

}

/* ================= BUY ENERGY ================= */

async function executeEnergyPurchase(){

const signer = web3Provider.getSigner();

const contract = new ethers.Contract(
PVLT_TOKEN_ADDRESS,
["function transfer(address,uint256)"],
signer
);

const amount = ethers.utils.parseUnits("100", TOKEN_DECIMALS);

const tx = await contract.transfer(GAME_TREASURY_ADDRESS, amount);

await tx.wait();

await fetch(API+"/refill",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet,txHash:tx.hash})
});

alert("Energy Added");

closeBuyModal();
}

/* ================= SWAP ================= */

async function swapPoints(){
await fetch(API+"/swap-points",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet})
});
}

/* ================= CLAIM ================= */

async function claimPVLT(){
await fetch(API+"/claim-pvltg",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet})
});
}

updateUI();

</script>

</body>
</html>
