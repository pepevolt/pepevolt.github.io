<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<title>Tap Volt Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:55px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
font-size:12px;
}

.val{color:#00ff99;font-weight:bold;}

.container{padding-top:80px;}

.tap{
width:170px;
height:170px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:26px;
font-weight:bold;
color:black;
}

.card{
margin:20px;
background:#111827;
padding:15px;
border-radius:12px;
}

input{
width:85%;
padding:10px;
border:none;
border-radius:8px;
margin-top:10px;
}

button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="navbar">
<div>Points: <span id="points">0</span></div>
<div>Tokens: <span id="tokens">0</span></div>
<div>ID: <span id="userId">---</span></div>
</div>

<div class="container">

<h2>Tap Volt Game</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<h3>Wallet</h3>
<input id="wallet" placeholder="Enter BSC wallet">
<br>
<button onclick="linkWallet()">LINK</button>
</div>

<div class="card">
<h3>Withdraw</h3>
<input id="withdrawAmount" placeholder="Tokens (100 - 500)">
<br>
<button onclick="withdraw()">WITHDRAW</button>
</div>

</div>

<script>

/* SAFE STATE */
let userId = "guest";
let points = 0;
let tokens = 0;
let wallet = null;
let lastWithdraw = 0;

/* TELEGRAM SAFE INIT */
function init(){

try{

if(window.Telegram && Telegram.WebApp){

Telegram.WebApp.ready();
Telegram.WebApp.expand();

userId = Telegram.WebApp.initDataUnsafe?.user?.id || "guest";

}

}catch(e){
console.log(e);
}

document.getElementById("userId").innerText = userId;
render();

}

/* RENDER */
function render(){
document.getElementById("points").innerText = points;
document.getElementById("tokens").innerText = tokens;
}

/* TAP */
function tap(){
points += 1;
render();
}

/* LINK WALLET */
function linkWallet(){

let w = document.getElementById("wallet").value;

if(!w) return alert("Enter wallet");

wallet = w;

alert("Wallet linked");

}

/* WITHDRAW (FRONTEND SIMULATION) */
function withdraw(){

let amount = parseInt(document.getElementById("withdrawAmount").value);

if(!wallet) return alert("Link wallet first");

if(amount < 100 || amount > 500){
alert("Only 100 - 500 tokens allowed");
return;
}

let requiredPoints = amount * 100000;

if(points < requiredPoints){
alert("Not enough points");
return;
}

let now = Date.now();

if(now - lastWithdraw < 86400000){
alert("Only 1 withdraw per day");
return;
}

/* simulate conversion */
points -= requiredPoints;
tokens += amount;

lastWithdraw = now;

render();

alert("Withdraw request submitted (demo)");

}

/* ERROR SAFE */
window.onerror = function(msg){
console.log(msg);
};

window.addEventListener("load", init);

</script>

</body>

</html>
