<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PVLT Tap Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { width:100%; height:100%; overflow:hidden; background:#020b18; font-family:Arial,sans-serif; color:white; touch-action: none; }
        body { display:flex; flex-direction:column; }
        .topbar { width:100%; padding:14px 18px; background:#091426; display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:bold; }
        .main { flex:1; display:flex; flex-direction:column; align-items:center; padding:20px; overflow-y:auto; }
        .tapBtn { width:240px; height:240px; border:none; border-radius:50%; overflow:hidden; margin-top:20px; background:linear-gradient(135deg,#00ff99,#00ccff); display:flex; justify-content:center; align-items:center; box-shadow:0 0 30px rgba(0,255,180,0.25); cursor:pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        .tapBtn:active { transform:scale(0.96); }
        .tapBtn img { width:78%; height:78%; object-fit:contain; pointer-events:none; }
        .card { width:100%; max-width:380px; margin-top:28px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:14px; }
        input { width:100%; padding:15px; border:none; border-radius:12px; background:#0c1628; color:white; font-size:14px; outline:none; text-align:center; }
        .actionBtn { width:100%; padding:15px; border:none; border-radius:12px; font-size:15px; font-weight:bold; background:linear-gradient(90deg,#00ff99,#00ccff); color:black; cursor:pointer; }
        .actionBtn.disconnect-style { background: linear-gradient(90deg, #ff3366, #ff6630) !important; color: white !important; }
        .status { text-align:center; font-size:12px; opacity:0.8; display:none; color: #00ff99; }
        .metrics-container { display: flex; flex-direction: column; gap: 8px; background:rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius:12px; padding:12px; }
        .metric-row { display: flex; justify-content: space-between; align-items: center; font-size:13px; font-weight: bold; }
        .treasury-color { color: #00ff99; }
        .user-color { color: #00ccff; }
        .info { margin-top:16px; font-size:12px; line-height:1.7; opacity:0.8; text-align:center; max-width:380px; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2,11,24,0.85); backdrop-filter:blur(5px); display:flex; justify-content:center; align-items:center; z-index:9999; opacity:0; pointer-events:none; transition:0.25s; }
        .modal-overlay.active { opacity:1; pointer-events:auto; }
        .modal-box { width:90%; max-width:340px; background:#091426; border:1px solid rgba(255,255,255,0.15); border-radius:20px; padding:24px; text-align:center; transform:scale(0.9); transition:0.25s; }
        .modal-box h3 { font-size:18px; margin-bottom:12px; color:#00ff99; }
        .modal-box p { font-size:14px; line-height:1.5; opacity:0.9; margin-bottom:24px; }
        .modal-buttons { display:flex; gap:12px; }
        .modal-btn { flex:1; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:bold; cursor:pointer; }
        .btn-confirm { background:linear-gradient(90deg,#00ff99,#00ccff); color:black; }
        .btn-cancel { background:rgba(255,255,255,0.1); color:white; }
    </style>
</head>
<body>

<div class="topbar">
    <div>🔋 <span id="energy">50</span></div>
    <div>⚡ <span id="points">0</span></div>
    <div>💎 <span id="pvlt">0.0000</span></div>
</div>

<div class="main">
    <button class="tapBtn" onclick="tap()">
        <img src="images/IMG_1850.png" alt="Tap">
    </button>

    <div class="card">
        <input id="walletInput" placeholder="Connect Polygon Wallet" readonly>
        <button class="actionBtn" id="walletBtn" onclick="toggleWalletConnection()">CONNECT WALLET</button>
        <div class="status" id="walletStatus">Wallet Connected</div>
        
        <div class="metrics-container">
            <div class="metric-row treasury-color">
                <span>🏛️ Treasury Vault:</span>
                <span><span id="treasuryCapacity">0.00</span> PVLT</span>
            </div>
            <div class="metric-row user-color">
                <span>👛 Your Wallet:</span>
                <span><span id="userHolding">0.00</span> PVLT</span>
            </div>
        </div>

        <button class="actionBtn" style="background: linear-gradient(90deg, #00ffcc, #0099ff);" onclick="convertGPVLT()">CONVERT gPVLT</button>
        <button class="actionBtn" onclick="openBuyModal()">BUY ENERGY</button>
        <button class="actionBtn" onclick="claimPVLT()">CLAIM PVLT</button>
    </div>

    <div class="info">
        1 Tap = 1 gPVLT<br>
        10,000 gPVLT = 1 PVLT Token<br>
        <b style="color: #00ff99;">Claim Limits: Minimum 100 PVLT - Maximum 500 PVLT</b>
    </div>
</div>

<div class="modal-overlay" id="buyModal">
    <div class="modal-box">
        <h3>Buy Energy Pack</h3>
        <p>Buy <b>10,000 Premium Energy</b><br>for <b>100 PVLT</b></p>
        <div class="modal-buttons">
            <button class="modal-btn btn-cancel" onclick="closeBuyModal()">Cancel</button>
            <button class="modal-btn btn-confirm" id="confirmPaymentBtn" onclick="executeEnergyPurchase()">Confirm</button>
        </div>
    </div>
</div>

<script>
const API = "https://pvlt-server.onrender.com"; 
const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";

// Synchronized production mainnet parameters
const PVLT_TOKEN_ADDRESS = "0xce363c769BA1A1CDf2A7500B39CB996856E81D16"; 
const GAME_TREASURY_ADDRESS = "0x10c6db776d58AF42143677ee847F007D9f91B5D2"; 

let web3Provider, rawWcInstance, wallet = "", points = 0, energy = 50, pvltBalance = 0.0;

function updateUI() {
    document.getElementById("energy").innerText = energy;
    document.getElementById("points").innerText = points;
    document.getElementById("pvlt").innerText = pvltBalance.toFixed(4);
}

function openBuyModal() { if(!wallet){alert("Connect wallet first");return;} document.getElementById("buyModal").classList.add("active"); }
function closeBuyModal() { document.getElementById("buyModal").classList.remove("active"); }

async function refreshOnChainBalances() {
    try {
        const queryProvider = web3Provider || new ethers.providers.JsonRpcProvider("https://polygon-rpc.com");
        const tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, ["function balanceOf(address owner) view returns (uint256)"], queryProvider);
        
        const rawTreasury = await tokenContract.balanceOf(GAME_TREASURY_ADDRESS);
        document.getElementById("treasuryCapacity").innerText = parseFloat(ethers.utils.formatUnits(rawTreasury, 18)).toLocaleString(undefined, {minimumFractionDigits:2});

        if (wallet) {
            const rawUser = await tokenContract.balanceOf(wallet);
            document.getElementById("userHolding").innerText = parseFloat(ethers.utils.formatUnits(rawUser, 18)).toLocaleString(undefined, {minimumFractionDigits:2});
        } else {
            document.getElementById("userHolding").innerText = "0.00";
        }
    } catch (e) { console.error("Balance synchronization pending:", e); }
}

function toggleWalletConnection() { if(!wallet) connectWallet(); else disconnectWallet(); }

async function connectWallet() {
    try {
        if (window.ethereum) {
            await window.ethereum.request({ method: "eth_requestAccounts" });
            web3Provider = new ethers.providers.Web3Provider(window.ethereum);
        } else {
            const providerInstance = new WalletConnectProvider.default({
                rpc: {
                    137: "https://polygon-rpc.com"
                },
                qrcode: true
            });
            await providerInstance.enable();
            web3Provider = new ethers.providers.Web3Provider(providerInstance);
            rawWcInstance = providerInstance;
        }
        
        const network = await web3Provider.getNetwork();
        if(network.chainId !== 137) {
            alert("Please switch your network interface to Polygon Mainnet");
            return;
        }

        wallet = await web3Provider.getSigner().getAddress();
        document.getElementById("walletInput").value = wallet.slice(0,6) + "..." + wallet.slice(-4);
        
        const btn = document.getElementById("walletBtn");
        btn.innerText = "DISCONNECT WALLET";
        btn.classList.add("disconnect-style");
        document.getElementById("walletStatus").style.display = "block";

        const res = await fetch(`${API}/user`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
        const data = await res.json();
        points = data.points || 0;
        energy = data.energy || 50;
        pvltBalance = data.pvltBalance || 0.0;
        
        updateUI();
        refreshOnChainBalances();
    } catch (err) { alert("Wallet connection closed or rejected."); }
}

async function disconnectWallet() {
    if(rawWcInstance) await rawWcInstance.disconnect();
    wallet = ""; web3Provider = null; rawWcInstance = null; points = 0; energy = 50; pvltBalance = 0.0;
    document.getElementById("walletInput").value = "";
    const btn = document.getElementById("walletBtn");
    btn.innerText = "CONNECT WALLET"; btn.classList.remove("disconnect-style");
    document.getElementById("walletStatus").style.display = "none";
    updateUI(); refreshOnChainBalances();
}

async function tap() {
    if(!wallet) { alert("Connect wallet first"); return; }
    if(energy <= 0) return;
    try {
        const res = await fetch(`${API}/tap`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
        const data = await res.json();
        points = data.points; energy = data.energy;
        updateUI();
    } catch(e){}
}

async function convertGPVLT() {
    if(!wallet) { alert("Connect wallet first!"); return; }
    // Fixed: Alerts user explicitly if lightning points check fails instead of freezing
    if(points < 10000) {
        alert(`Conversion Denied: You currently have ${points} gPVLT. You need at least 10,000 lightning points before you can swap into a diamond asset value.`);
        return;
    }
    try {
        const res = await fetch(`${API}/swap-points`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
        const data = await res.json();
        if(data.error){ alert(data.error); return; }
        points = data.points; pvltBalance = data.pvltBalance;
        updateUI();
    } catch(e){}
}

async function executeEnergyPurchase() {
    const confirmBtn = document.getElementById("confirmPaymentBtn");
    try {
        confirmBtn.innerText = "Processing..."; confirmBtn.disabled = true;
        const signer = web3Provider.getSigner();
        
        const tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, [
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function balanceOf(address owner) view returns (uint256)"
        ], signer);

        const vaultContract = new ethers.Contract(GAME_TREASURY_ADDRESS, ["function buyEnergyPack() external"], signer);
        const cost = ethers.utils.parseUnits("100", 18);

        const bal = await tokenContract.balanceOf(wallet);
        if(bal.lt(cost)) { alert("Transaction Failed: Insufficient PVLT balance to cover cost."); return; }

        // Core ERC20 Token Approval Call
        const appTx = await tokenContract.approve(GAME_TREASURY_ADDRESS, cost);
        await appTx.wait();

        // Core Treasury Engine Transfer Execution Call
        const buyTx = await vaultContract.buyEnergyPack();
        await buyTx.wait();

        const res = await fetch(`${API}/refill`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
        const data = await res.json();
        energy = data.energy;
        
        updateUI(); refreshOnChainBalances(); closeBuyModal();
        alert("Payment Successful! 10,000 Energy added to your profile.");
    } catch (err) { alert("Transaction processing encountered errors."); }
    finally { confirmBtn.innerText = "Confirm"; confirmBtn.disabled = false; }
}

async function claimPVLT() {
    if(!wallet) { alert("Connect wallet first!"); return; }
    // Fixed: Alerts user explicitly if diamond limits check fails instead of freezing
    if(pvltBalance < 100 || pvltBalance > 500) {
        alert(`Claim Restricted: Your diamond balance is ${pvltBalance.toFixed(4)} PVLT. On-chain claims can only be executed when your balance is between 100 and 500 PVLT.`);
        return;
    }
    try {
        const res = await fetch(`${API}/claim-pvlt`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wallet }) });
        const data = await res.json();
        if(data.error) { alert(data.error); return; }

        const signer = web3Provider.getSigner();
        const vault = new ethers.Contract(GAME_TREASURY_ADDRESS, ["function claimUserRewards(uint256 amount, bytes signature) external"], signer);
        
        const tx = await vault.claimUserRewards(data.claimAmount, data.signature);
        await tx.wait();

        pvltBalance = data.remainingPvlt;
        updateUI(); refreshOnChainBalances();
        alert("Tokens claimed successfully! Sent directly from treasury.");
    } catch(e) { alert("Claim execution rejected or canceled."); }
}

// 3-second recovery tick loop
setInterval(() => { if(wallet && energy < 50) { energy++; document.getElementById("energy").innerText = energy; } }, 3000);
refreshOnChainBalances();
</script>
</body>
</html>
