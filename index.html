<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PepeVolt | Tap to Earn PVLT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300ffcc'/%3E%3Ctext x='50' y='70' font-size='48' text-anchor='middle' fill='%23000'%3E🐸%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#090912">

<!-- ethers & telegram webapp (lightweight for potential tg integration) -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

:root {
  --bg: #090912;
  --card: #0e0f1a;
  --primary: #00ffcc;
  --secondary: #ffd700;
  --muted: #9ba3c2;
  --border: rgba(0,255,204,0.2);
  --radius: 16px;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 440px;
  margin: 0 auto;
  padding: 16px;
  overflow: hidden;
}

.energy-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
  backdrop-filter: blur(2px);
}
.energy-left .val { font-family: monospace; font-weight: 800; font-size: 20px; color: var(--primary); }
.energy-right { width: 52%; }
.prog-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.prog-bar-fill { height: 100%; background: var(--primary); transition: width .4s ease; box-shadow: 0 0 4px var(--primary);}
.regen-lbl { font-size: 9px; color: var(--muted); text-align: right; margin-top: 4px; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-card.primary-card { border: 1px solid var(--border); }
.stat-card.secondary-card { border: 1px solid rgba(255,215,0,0.2); }
.stat-card .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .val { font-family: monospace; font-weight: 800; font-size: 22px; }
.stat-card.secondary-card .val { color: var(--secondary); }

/* Contract card — premium highlight */
.contract-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  transition: all 0.2s ease;
  cursor: pointer;
}
.contract-card .lbl {
  font-size: 10px;
  color: var(--primary);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: rgba(0,255,204,0.12);
  padding: 4px 10px;
  border-radius: 40px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.contract-card .addr {
  font-family: monospace;
  font-size: 12px;
  font-weight: 500;
  color: #fff;
  background: rgba(0,0,0,0.4);
  padding: 6px 12px;
  border-radius: 32px;
  letter-spacing: 0.3px;
  word-break: break-all;
  text-align: right;
  flex: 1;
}
.contract-card .copy-icon {
  background: rgba(0,255,204,0.15);
  padding: 6px;
  border-radius: 32px;
  font-size: 13px;
  cursor: pointer;
  transition: 0.1s;
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
}
.contract-card .copy-icon:active { transform: scale(0.92); background: rgba(0,255,204,0.3); }

.wallet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.wallet-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
}
.wallet-card .lbl { font-size: 9px; color: var(--muted); }
.wallet-card .val { font-family: monospace; font-size: 13px; font-weight: 600; }

main { flex: 1; display: flex; align-items: center; justify-content: center; }
.pepe-btn {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #00ebbc, #008f74);
  border: 4px solid rgba(0,255,204,0.6);
  cursor: pointer;
  transition: transform .08s;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0,255,204,0.4);
}
.pepe-btn:active { transform: scale(.95); }
.pepe-btn.no-energy { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.2);}
.pepe-btn img { width: 70%; height: 70%; object-fit: contain; }

footer {
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 12px;
  margin-top: 8px;
}
.status-txt { text-align: center; font-size: 11px; font-family: monospace; color: var(--muted); margin-bottom: 10px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 20px;}
.btn {
  width: 100%;
  border: none;
  border-radius: 44px;
  padding: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #000; }
.btn-secondary { background: var(--secondary); color: #000; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.2); color: #fff; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-small { padding: 10px; font-size: 13px; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #000; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--card);
  border-radius: 24px;
  padding: 20px;
  width: 90%;
  max-width: 320px;
  border: 1px solid var(--border);
}
.modal-title { font-size: 18px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 16px; }
.wallet-option {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03);
  cursor: pointer;
  width: 100%;
  margin-bottom: 10px;
}
.wallet-option:hover { background: rgba(0,255,204,.1); }
.wallet-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255,255,255,.1); }
.modal-close { float: right; cursor: pointer; font-size: 20px; color: var(--muted); }

.toast-msg {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e1f2c;
  backdrop-filter: blur(12px);
  color: var(--primary);
  padding: 8px 18px;
  border-radius: 40px;
  font-size: 13px;
  font-family: monospace;
  z-index: 200;
  border: 1px solid var(--border);
  pointer-events: none;
  animation: fadeOut 2s forwards;
}
@keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>

<div class="app">
  <div class="energy-row">
    <div class="energy-left"><div class="val" id="energyVal">100 / 100</div></div>
    <div class="energy-right">
      <div class="prog-bar"><div class="prog-bar-fill" id="energyBar" style="width:100%"></div></div>
      <div class="regen-lbl" id="regenLbl"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card primary-card">
      <div class="lbl">Points</div>
      <div class="val"><span id="pointsVal">0</span><span style="font-size:14px">/100</span></div>
    </div>
    <div class="stat-card secondary-card">
      <div class="lbl">💎 Game PVLT</div>
      <div class="val" id="gamePvltVal">0</div>
    </div>
  </div>

  <!-- CONTRACT CARD: matches design -->
  <div class="contract-card" id="contractCard">
    <div class="lbl">📜 CONTRACT</div>
    <div class="addr" id="contractAddrDisplay">0x03741f950eafd9cbaa217e2b0491a0f143492f0a</div>
    <div class="copy-icon" id="copyContractBtn">📋</div>
  </div>

  <div class="wallet-row">
    <div class="wallet-card"><div class="lbl">💼 Wallet</div><div class="val" id="walletVal">0.00</div></div>
    <div class="wallet-card"><div class="lbl">🏦 Treasury</div><div class="val" id="treasuryVal">0</div></div>
  </div>

  <main>
    <button class="pepe-btn no-energy" id="tapBtn">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23fff' opacity='0.2'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23ffffff'%3E🐸%3C/text%3E%3C/svg%3E" alt="Pepe">
    </button>
  </main>

  <footer>
    <div class="status-txt" id="statusTxt">🔒 Connect wallet to start</div>
    <div id="stateDisconnected">
      <button class="btn btn-primary" id="connectBtn">💼 CONNECT WALLET</button>
    </div>
    <div id="stateConnected" style="display:none">
      <button class="btn btn-outline" id="disconnectBtn" style="display:none"></button>
      <div class="action-grid" id="actionGrid" style="display:none">
        <button class="btn btn-secondary btn-small" id="buyBtn">⚡ BUY ENERGY<span> (100 PVLT)</span></button>
        <button class="btn btn-primary btn-small" id="claimBtn">💎 CLAIM<span id="claimSub"> TO WALLET</span></button>
      </div>
    </div>
  </footer>
</div>

<div id="walletModal" class="modal-overlay">
  <div class="modal-sheet">
    <div style="text-align:right"><span class="modal-close" id="closeModal">✕</span></div>
    <div class="modal-title">Connect Wallet</div>
    <button class="wallet-option" id="metaMaskOption">
      <div class="wallet-icon">🦊</div>
      <div>MetaMask</div>
    </button>
    <div style="text-align:center; font-size:11px; color:var(--muted); margin-top:12px">
      Make sure you're on <span style="color:var(--primary)">Polygon Mainnet</span>
    </div>
  </div>
</div>

<script>
  // ============ CONTRACT ADDRESSES ============
  const PVLT_TOKEN_ADDRESS = "0x03741F950eaFD9CbAa217E2B0491a0F143492f0A";
  const GAME_CONTRACT_ADDRESS = "0xE522370EA3A22D9075bB446027c7E46b5D979806";
  const TREASURY_ADDRESS = "0x2f5d721F771f53F55845AA927b95E40d5Ad30EF4";

  const GAME_ABI = [
    "function buyEnergy(uint256 pvltAmount) external",
    "function claimRewards(uint256 pvltAmount) external",
    "function getTreasuryBalance() view returns (uint256)"
  ];
  const PVLT_ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function approve(address,uint256) returns (bool)",
    "function allowance(address,address) view returns (uint256)",
    "function decimals() view returns (uint8)"
  ];

  // DOM elements
  const $ = id => document.getElementById(id);
  const energyValEl = $('energyVal');
  const energyBarEl = $('energyBar');
  const regenLblEl = $('regenLbl');
  const pointsValEl = $('pointsVal');
  const gamePvltValEl = $('gamePvltVal');
  const walletValEl = $('walletVal');
  const treasuryValEl = $('treasuryVal');
  const tapBtnEl = $('tapBtn');
  const statusTxtEl = $('statusTxt');
  const connectBtnEl = $('connectBtn');
  const stateDisc = $('stateDisconnected');
  const stateConn = $('stateConnected');
  const disconnBtnEl = $('disconnectBtn');
  const actionGridEl = $('actionGrid');
  const buyBtnEl = $('buyBtn');
  const claimBtnEl = $('claimBtn');
  const claimSubEl = $('claimSub');
  const walletModal = $('walletModal');
  const closeModal = $('closeModal');
  const metaMaskOption = $('metaMaskOption');
  const contractAddrSpan = $('contractAddrDisplay');
  const copyContractBtn = $('copyContractBtn');

  // State variables
  let account = null;
  let provider = null;
  let signer = null;
  let tokenC = null;
  let gameC = null;
  let decimals = 18;

  let maxEnergy = 100;
  let energy = 100;
  let points = 0;
  let gamePvlt = 0;
  let walletBal = 0;
  let treasuryBal = 0;
  let lastRegen = Date.now();
  let regenTimer = null;

  // Toast notification
  function showToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    toast.textContent = message;
    if (isError) toast.style.color = '#ff8888';
    else toast.style.color = '#00ffcc';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  // Copy contract address
  function copyContractAddress() {
    const addr = PVLT_TOKEN_ADDRESS;
    navigator.clipboard.writeText(addr).then(() => {
      showToast('✅ Contract address copied!', false);
    }).catch(() => showToast('⚠️ Could not copy', true));
  }
  copyContractBtn.addEventListener('click', (e) => { e.stopPropagation(); copyContractAddress(); });
  $('contractCard').addEventListener('click', (e) => {
    if (e.target === copyContractBtn || copyContractBtn.contains(e.target)) return;
    copyContractAddress();
  });

  // Persist local progress per account
  function save() {
    if (!account) return;
    localStorage.setItem(`pv_${account}`, JSON.stringify({ energy, points, gamePvlt, lastRegen, maxEnergy }));
  }
  function load() {
    if (!account) return;
    try {
      const data = JSON.parse(localStorage.getItem(`pv_${account}`) || '{}');
      maxEnergy = data.maxEnergy ?? 100;
      points = data.points ?? 0;
      gamePvlt = data.gamePvlt ?? 0;
      lastRegen = data.lastRegen ?? Date.now();
      const offSecs = Math.floor((Date.now() - lastRegen) / 1000);
      const offRegen = Math.min(Math.floor(offSecs / 15), maxEnergy);
      energy = Math.min((data.energy ?? 100) + offRegen, maxEnergy);
      if (offRegen > 0) lastRegen = Date.now();
    } catch(e) { console.warn(e); }
  }

  function renderUI() {
    energyValEl.textContent = `${Math.floor(energy)} / ${maxEnergy}`;
    energyBarEl.style.width = `${Math.min((energy / maxEnergy) * 100, 100)}%`;
    pointsValEl.textContent = points;
    gamePvltValEl.textContent = Math.floor(gamePvlt);
    walletValEl.textContent = walletBal.toFixed(2);
    treasuryValEl.textContent = Math.floor(treasuryBal);
    if (gamePvlt >= 1) claimSubEl.innerHTML = ` ${Math.floor(gamePvlt)} PVLT`;
    else claimSubEl.innerHTML = ' TO WALLET';

    if (account) {
      tapBtnEl.classList.remove('no-energy');
      stateDisc.style.display = 'none';
      stateConn.style.display = 'block';
      disconnBtnEl.style.display = 'block';
      actionGridEl.style.display = 'grid';
      disconnBtnEl.textContent = `🔴 ${account.slice(0,6)}...${account.slice(-4)}`;
      buyBtnEl.disabled = walletBal < 100;
      claimBtnEl.disabled = gamePvlt < 1;
    } else {
      tapBtnEl.classList.add('no-energy');
      stateDisc.style.display = 'block';
      stateConn.style.display = 'none';
    }
  }

  function tickRegen() {
    if (account && energy < maxEnergy) {
      const secondsGap = Math.floor((Date.now() - lastRegen) / 1000);
      const gained = Math.floor(secondsGap / 15);
      if (gained > 0) {
        energy = Math.min(energy + gained, maxEnergy);
        lastRegen = Date.now();
        save();
      }
      const remaining = 15 - (Math.floor((Date.now() - lastRegen) / 1000) % 15);
      regenLblEl.textContent = `⚡ +1 energy in ${remaining}s`;
    } else {
      regenLblEl.textContent = '';
    }
    renderUI();
  }

  async function refreshBalances() {
    if (!account || !tokenC) return;
    try {
      const [balanceBn, treasuryBn] = await Promise.all([
        tokenC.balanceOf(account),
        gameC.getTreasuryBalance().catch(() => ethers.BigNumber.from(0))
      ]);
      walletBal = parseFloat(ethers.utils.formatUnits(balanceBn, decimals));
      treasuryBal = parseFloat(ethers.utils.formatUnits(treasuryBn, decimals));
      renderUI();
    } catch(e) { console.error('Balance error', e); }
  }

  function showFloatingText(x, y, text, color = '#00ffcc') {
    const div = document.createElement('div');
    div.innerText = text;
    div.style.position = 'fixed';
    div.style.left = `${x - 20}px`;
    div.style.top = `${y - 20}px`;
    div.style.color = color;
    div.style.fontFamily = 'monospace';
    div.style.fontWeight = '800';
    div.style.fontSize = '22px';
    div.style.pointerEvents = 'none';
    div.style.zIndex = '999';
    div.style.animation = 'floatUp 1s forwards';
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1000);
  }
  const styleFloat = document.createElement('style');
  styleFloat.textContent = `@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}`;
  document.head.appendChild(styleFloat);

  let tapLock = false;
  function handleTap(clientX, clientY) {
    if (!account) { showToast('🔌 Connect wallet first', true); return; }
    if (energy <= 0) { showToast('⛔ No energy left! Wait or buy energy', true); return; }
    if (tapLock) return;
    tapLock = true; setTimeout(() => tapLock = false, 80);
    energy--;
    points++;
    let earnedPvlt = 0;
    if (points >= 100) {
      earnedPvlt = Math.floor(points / 100);
      gamePvlt += earnedPvlt;
      points %= 100;
      showFloatingText(clientX, clientY - 40, `+${earnedPvlt} PVLT! 🎉`, '#ffd700');
    }
    showFloatingText(clientX, clientY, '+1 ⚡', '#00ffcc');
    save();
    renderUI();
  }

  tapBtnEl.addEventListener('click', (e) => {
    const rect = tapBtnEl.getBoundingClientRect();
    handleTap(rect.left + rect.width/2, rect.top + rect.height/2);
  });
  tapBtnEl.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    handleTap(touch.clientX, touch.clientY);
  }, { passive: false });

  // ========== METAMASK CONNECTION ==========
  async function connectMetaMask() {
    if (!window.ethereum) {
      alert("Please install MetaMask extension!");
      return false;
    }
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      account = accounts[0];
      provider = new ethers.providers.Web3Provider(window.ethereum);
      signer = provider.getSigner();
      const network = await provider.getNetwork();
      if (network.chainId !== 137) {
        setStatus('🔄 Switching to Polygon...');
        try {
          await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] });
        } catch(switchErr) {
          await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{
            chainId: '0x89', chainName: 'Polygon Mainnet',
            nativeCurrency: { name: 'MATIC', symbol: 'MATIC', decimals: 18 },
            rpcUrls: ['https://polygon-rpc.com/']
          }]});
        }
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
      }
      tokenC = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      gameC = new ethers.Contract(GAME_CONTRACT_ADDRESS, GAME_ABI, signer);
      decimals = await tokenC.decimals();
      load();
      await refreshBalances();
      setStatus(`✅ Connected: ${account.slice(0,6)}...${account.slice(-4)}`);
      renderUI();
      if (regenTimer) clearInterval(regenTimer);
      regenTimer = setInterval(async () => { tickRegen(); await refreshBalances(); }, 1000);
      window.ethereum.on('accountsChanged', (newAccs) => {
        if (!newAccs.length) disconnect();
        else if (newAccs[0] !== account) location.reload();
      });
      return true;
    } catch(e) {
      console.error(e);
      setStatus('❌ ' + (e.message?.slice(0,60) || 'Connection failed'));
      return false;
    }
  }

  async function disconnect() {
    if (regenTimer) clearInterval(regenTimer);
    save();
    account = null;
    walletBal = 0; treasuryBal = 0;
    energy = 100; maxEnergy = 100; points = 0; gamePvlt = 0;
    lastRegen = Date.now();
    setStatus('🔒 Disconnected');
    renderUI();
  }

  // BUY ENERGY (working with proper approval and gas)
  async function buyEnergy() {
    if (!account) { setStatus("Connect wallet first"); return; }
    if (walletBal < 100) { setStatus(`❌ Need 100 PVLT. Balance: ${walletBal.toFixed(2)}`); return; }
    buyBtnEl.disabled = true;
    try {
      const amountWei = ethers.utils.parseUnits("100", decimals);
      setStatus("🔍 Checking allowance...");
      const allowance = await tokenC.allowance(account, GAME_CONTRACT_ADDRESS);
      if (allowance.lt(amountWei)) {
        setStatus("✍️ Approving PVLT spending...");
        const approveGas = await tokenC.estimateGas.approve(GAME_CONTRACT_ADDRESS, amountWei);
        const approveTx = await tokenC.approve(GAME_CONTRACT_ADDRESS, amountWei, { gasLimit: approveGas.mul(12).div(10) });
        setStatus("⏳ Waiting for approval...");
        await approveTx.wait();
        setStatus("✅ Approval done!");
        await new Promise(r => setTimeout(r, 1500));
      }
      setStatus("⚡ Buying 1000 Energy (100 PVLT)...");
      const freshBalance = await tokenC.balanceOf(account);
      if (parseFloat(ethers.utils.formatUnits(freshBalance, decimals)) < 100) throw new Error("Balance insufficient after approval");
      const gasEstimate = await gameC.estimateGas.buyEnergy(amountWei).catch(() => ethers.BigNumber.from(300000));
      const tx = await gameC.buyEnergy(amountWei, { gasLimit: gasEstimate.mul(12).div(10) });
      setStatus("⛏️ Transaction sent, confirming...");
      await tx.wait();
      maxEnergy += 1000;
      energy += 1000;
      save();
      await refreshBalances();
      setStatus(`🎉 +1000 Energy! Max: ${maxEnergy}`);
      showFloatingText(window.innerWidth/2, window.innerHeight/2 - 60, '⚡ +1000 ENERGY!', '#ffd700');
    } catch(err) {
      console.error(err);
      let msg = err.message?.includes('user rejected') ? 'Transaction rejected' : (err.message?.slice(0,80) || 'Buy failed');
      setStatus(`❌ ${msg}`);
    } finally {
      buyBtnEl.disabled = walletBal < 100;
    }
  }

  async function claimRewards() {
    if (!account) { setStatus("Connect first"); return; }
    if (gamePvlt < 1) { setStatus(`❌ No Game PVLT to claim (have ${Math.floor(gamePvlt)})`); return; }
    if (treasuryBal < gamePvlt) { setStatus(`❌ Treasury balance insufficient: ${treasuryBal.toFixed(0)} PVLT`); return; }
    const claimAmount = Math.floor(gamePvlt);
    const amountWei = ethers.utils.parseUnits(claimAmount.toString(), decimals);
    claimBtnEl.disabled = true;
    try {
      setStatus(`⏳ Claiming ${claimAmount} PVLT...`);
      const gasEstimate = await gameC.estimateGas.claimRewards(amountWei);
      const tx = await gameC.claimRewards(amountWei, { gasLimit: gasEstimate.mul(12).div(10) });
      setStatus("⌛ Waiting confirmation...");
      await tx.wait();
      gamePvlt = 0;
      points = 0;
      save();
      await refreshBalances();
      setStatus(`✅ Claimed ${claimAmount} REAL PVLT to your wallet!`);
      showFloatingText(window.innerWidth/2, window.innerHeight/2, `💎 +${claimAmount} PVLT!`, '#00ffcc');
    } catch(err) {
      console.error(err);
      let msg = err.message?.includes('rejected') ? 'Claim rejected' : (err.message?.slice(0,80) || 'Claim failed');
      setStatus(`❌ ${msg}`);
    } finally {
      claimBtnEl.disabled = gamePvlt < 1;
    }
  }

  function setStatus(msg) { statusTxtEl.textContent = msg; console.log("[status]", msg); }

  // Modal actions
  function openModal() { walletModal.classList.add('open'); }
  function closeModalFn() { walletModal.classList.remove('open'); }
  connectBtnEl.onclick = () => { if (account) disconnect(); else openModal(); };
  closeModal.onclick = closeModalFn;
  walletModal.onclick = (e) => { if (e.target === walletModal) closeModalFn(); };
  metaMaskOption.onclick = async () => {
    closeModalFn();
    connectBtnEl.innerHTML = '<span class="spinner"></span> CONNECTING...';
    connectBtnEl.disabled = true;
    const success = await connectMetaMask();
    connectBtnEl.innerHTML = '💼 CONNECT WALLET';
    connectBtnEl.disabled = false;
    if (!success) setStatus('Connection failed. Try again.');
  };
  disconnBtnEl.onclick = () => disconnect();
  buyBtnEl.onclick = buyEnergy;
  claimBtnEl.onclick = claimRewards;

  // initialize
  renderUI();
  setInterval(tickRegen, 1000);
  setStatus('🔒 Connect wallet to start mining PVLT');
</script>
</body>
</html>
