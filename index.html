<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt - Tap Tap Game</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00ccff;
            --accent: #ff6b00;
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-hover: #1a1a25;
            --text: #ffffff;
            --text-muted: #888899;
            --danger: #ff4444;
            --success: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 255, 136, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 204, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 107, 0, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 20px 0 30px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .tagline {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Connect Button */
        .connect-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #00cc6a);
            border: none;
            border-radius: 12px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }

        .connect-btn.connected {
            background: var(--bg-card);
            color: var(--text);
            border: 2px solid var(--primary);
        }

        /* Card Styles */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-item {
            background: var(--bg-hover);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Energy Bar */
        .energy-bar-container {
            margin-bottom: 20px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .energy-bar {
            height: 24px;
            background: var(--bg-hover);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border-radius: 12px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #000;
        }

        /* Tap Button */
        .tap-btn {
            width: 100%;
            height: 200px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            background: radial-gradient(circle, var(--bg-card) 0%, var(--bg-dark) 100%);
            color: var(--text);
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }

        .tap-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .tap-btn:active {
            transform: scale(0.95);
            border-color: var(--secondary);
        }

        .tap-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .tap-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tap-label {
            position: relative;
            z-index: 1;
        }

        .tap-points {
            font-size: 0.9rem;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }

        /* Action Buttons */
        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-btn {
            padding: 16px 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-energy {
            background: linear-gradient(135deg, var(--secondary), #0099cc);
            color: #000;
        }

        .btn-refill {
            background: var(--bg-hover);
            color: var(--text);
            border: 2px solid var(--secondary);
        }

        .btn-convert {
            background: linear-gradient(135deg, var(--accent), #cc5500);
            color: #fff;
        }

        .btn-claim {
            background: linear-gradient(135deg, var(--primary), #00cc6a);
            color: #000;
            grid-column: span 2;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .action-subtitle {
            font-size: 0.7rem;
            opacity: 0.8;
            font-weight: 400;
        }

        /* Token Balance */
        .token-balance {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-hover);
            border-radius: 12px;
            margin-top: 16px;
        }

        .token-symbol {
            font-weight: 700;
            color: var(--secondary);
        }

        .token-amount {
            font-weight: 800;
            font-size: 1.1rem;
        }

        /* Error/Success Messages */
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 12px;
            font-size: 0.9rem;
            display: none;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .message.success {
            background: rgba(0, 255, 136, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Pending State */
        .pending {
            pointer-events: none;
            opacity: 0.7;
        }

        /* Network Badge */
        .network-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .network-correct {
            background: rgba(0, 255, 136, 0.2);
            color: var(--primary);
        }

        .network-wrong {
            background: rgba(255, 68, 68, 0.2);
            color: var(--danger);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">⚡ PEPEVOLT</div>
            <div class="tagline">Tap Tap Game</div>
            <div id="networkBadge" class="network-badge network-wrong">Wrong Network</div>
        </header>

        <!-- Connect Wallet -->
        <button id="connectBtn" class="connect-btn">
            🔗 Connect Wallet
        </button>

        <!-- Main Game Card -->
        <div class="card" id="gameCard" style="display: none;">
            <div class="card-title">⚡ Your Energy</div>
            
            <div class="energy-bar-container">
                <div class="energy-info">
                    <span id="energyDisplay">0 / 50</span>
                    <span id="userType">FREE USER</span>
                </div>
                <div class="energy-bar">
                    <div id="energyFill" class="energy-fill" style="width: 0%"></div>
                </div>
            </div>

            <!-- TAP BUTTON -->
            <button id="tapBtn" class="tap-btn" disabled>
                <span class="tap-label">TAP!</span>
                <div class="tap-points">+1 point per tap</div>
            </button>

            <!-- Game Stats -->
            <div class="stats-grid">
                <div class="stat-item">
                    <div id="pointsDisplay" class="stat-value">0</div>
                    <div class="stat-label">POINTS</div>
                </div>
                <div class="stat-item">
                    <div id="gPvltDisplay" class="stat-value">0</div>
                    <div class="stat-label">gPVLT</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions" style="margin-top: 20px;">
                <button id="buyEnergyBtn" class="action-btn btn-energy">
                    ⚡ Buy Energy
                    <span class="action-subtitle">100 PVLT</span>
                </button>
                
                <button id="refillBtn" class="action-btn btn-refill">
                    🔄 Refill
                    <span class="action-subtitle">+1 Energy</span>
                </button>
                
                <button id="convertBtn" class="action-btn btn-convert">
                    🔥 Convert
                    <span class="action-subtitle">100 pts → 1 gPVLT</span>
                </button>
                
                <button id="claimBtn" class="action-btn btn-claim">
                    🎁 Claim Rewards
                    <span class="action-subtitle">Need 100-1000 gPVLT burned</span>
                </button>
            </div>

            <!-- Token Balance -->
            <div class="token-balance">
                <span class="token-symbol">PVLT Balance</span>
                <span id="pvltBalance" class="token-amount">0</span>
            </div>

            <!-- Message Display -->
            <div id="messageBox" class="message"></div>
        </div>

        <!-- Contract Addresses Info -->
        <div class="card" id="infoCard" style="display: none;">
            <div class="card-title">📋 Contract Addresses</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">
                <p style="margin-bottom: 8px;">
                    <strong>PVLT:</strong> <span id="pvltAddress" style="color: var(--secondary);">-</span>
                </p>
                <p style="margin-bottom: 8px;">
                    <strong>Treasury:</strong> <span id="treasuryAddress" style="color: var(--secondary);">-</span>
                </p>
                <p>
                    <strong>Game:</strong> <span id="gameAddress" style="color: var(--secondary);">-</span>
                </p>
            </div>
        </div>

        <footer>
            <p>PepeVolt Ecosystem © 2024</p>
            <p style="margin-top: 5px;">
                <a href="#" onclick="alert('Set contract addresses in the code before deploying!')">Setup Guide</a>
            </p>
        </footer>
    </div>

    <script>
