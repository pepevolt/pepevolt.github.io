<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PepeVolt | Tap to Earn PVLT</title>
<link rel="icon" href="images/logo.PNG">
<meta name="theme-color" content="#090912">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

:root {
  --bg: #090912;
  --card: #0e0f1a;
  --primary: #00ffcc;
  --secondary: #ffd700;
  --muted: #9ba3c2;
  --border: rgba(0,255,204,0.2);
  --radius: 16px;
  --price-up: #00ffaa;
  --price-down: #ff6666;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 440px;
  margin: 0 auto;
  padding: 16px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
}

.app::-webkit-scrollbar {
  width: 3px;
}
.app::-webkit-scrollbar-track {
  background: transparent;
}
.app::-webkit-scrollbar-thumb {
  background: var(--primary);
  border-radius: 10px;
}

.energy-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.energy-left .val { font-family: monospace; font-weight: 800; font-size: 20px; color: var(--primary); }
.energy-right { width: 52%; }
.prog-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.prog-bar-fill { height: 100%; background: var(--primary); transition: width .4s ease; }
.regen-lbl { font-size: 9px; color: var(--muted); text-align: right; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-card.primary-card { border: 1px solid var(--border); }
.stat-card.secondary-card { border: 1px solid rgba(255,215,0,0.2); }
.stat-card .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
.stat-card .val { font-family: monospace; font-weight: 800; font-size: 22px; }
.stat-card.secondary-card .val { color: var(--secondary); }

/* Contract Address Card */
.contract-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.contract-card .lbl {
  font-size: 10px;
  color: var(--primary);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: rgba(0,255,204,0.12);
  padding: 4px 10px;
  border-radius: 40px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.contract-card .addr {
  font-family: monospace;
  font-size: 12px;
  font-weight: 500;
  color: #fff;
  background: rgba(0,0,0,0.4);
  padding: 6px 12px;
  border-radius: 32px;
  letter-spacing: 0.3px;
  word-break: break-all;
  text-align: right;
  flex: 1;
}
.contract-card .copy-icon {
  background: rgba(0,255,204,0.15);
  padding: 6px;
  border-radius: 32px;
  font-size: 13px;
  cursor: pointer;
  transition: 0.1s;
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
}
.contract-card .copy-icon:active { transform: scale(0.92); background: rgba(0,255,204,0.3); }

/* NEW: Token Price Card - Live refresh */
.price-card {
  background: var(--card);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.2s;
  backdrop-filter: blur(2px);
}
.price-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.price-icon {
  font-size: 20px;
  background: rgba(255,215,0,0.15);
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 30px;
}
.price-info .price-label {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.price-info .price-value {
  font-family: monospace;
  font-weight: 800;
  font-size: 20px;
  color: var(--secondary);
  letter-spacing: 0.5px;
}
.price-change {
  font-family: monospace;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 40px;
  background: rgba(0,0,0,0.4);
}
.price-change.up { color: var(--price-up); }
.price-change.down { color: var(--price-down); }
.price-update-badge {
  font-size: 8px;
  color: var(--muted);
  background: rgba(255,255,255,0.05);
  padding: 2px 8px;
  border-radius: 30px;
  margin-left: 6px;
}

.wallet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.wallet-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
}
.wallet-card .lbl { font-size: 9px; color: var(--muted); }
.wallet-card .val { font-family: monospace; font-size: 13px; }

main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 200px; }
.pepe-btn {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #00ebbc, #008f74);
  border: 4px solid rgba(0,255,204,0.5);
  cursor: pointer;
  transition: transform .08s;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0,255,204,0.4);
}
.pepe-btn:active { transform: scale(.95); }
.pepe-btn.no-energy { opacity: 0.5; cursor: not-allowed; }
.pepe-btn img { width: 70%; height: 70%; object-fit: contain; }

footer {
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 12px;
  margin-top: 8px;
}
.status-txt { text-align: center; font-size: 10px; font-family: monospace; color: var(--muted); margin-bottom: 8px; }
.btn {
  width: 100%;
  border: none;
  border-radius: 44px;
  padding: 12px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #000; }
.btn-secondary { background: var(--secondary); color: #000; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.2); color: #fff; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-small { padding: 10px; font-size: 12px; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #000; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--card);
  border-radius: 24px;
  padding: 20px;
  width: 90%;
  max-width: 320px;
  border: 1px solid var(--border);
}
.modal-title { font-size: 18px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 16px; }
.wallet-option {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03);
  cursor: pointer;
  width: 100%;
  margin-bottom: 10px;
}
.wallet-option:hover { background: rgba(0,255,204,.1); }
.wallet-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255,255,255,.1); }
.modal-close { float: right; cursor: pointer; font-size: 20px; color: var(--muted); }

.toast-msg {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e1f2c;
  backdrop-filter: blur(12px);
  color: var(--primary);
  padding: 8px 18px;
  border-radius: 40px;
  font-size: 13px;
  font-family: monospace;
  z-index: 200;
  border: 1px solid var(--border);
  pointer-events: none;
  animation: fadeOut 2s forwards;
}
@keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>

<div class="app">
  <div class="energy-row">
    <div class="energy-left"><div class="val" id="energyVal">100 / 100</div></div>
    <div class="energy-right">
      <div class="prog-bar"><div class="prog-bar-fill" id="energyBar" style="width:100%"></div></div>
      <div class="regen-lbl" id="regenLbl"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card primary-card">
      <div class="lbl">Points</div>
      <div class="val"><span id="pointsVal">0</span><span style="font-size:14px">/100</span></div>
    </div>
    <div class="stat-card secondary-card">
      <div class="lbl">💎 Game PVLT</div>
      <div class="val" id="gamePvltVal">0</div>
    </div>
  </div>

  <!-- Contract address block -->
  <div class="contract-card" id="contractCard">
    <div class="lbl">📜 CONTRACT</div>
    <div class="addr" id="contractAddrDisplay">0x03741f950eafd9cbaa217e2b0491a0f143492f0a</div>
    <div class="copy-icon" id="copyContractBtn">📋</div>
  </div>

  <!-- LIVE TOKEN PRICE CARD - auto refreshes -->
  <div class="price-card" id="priceCard">
    <div class="price-left">
      <div class="price-icon">🐸💰</div>
      <div class="price-info">
        <div class="price-label">PVLT PRICE (USD)</div>
        <div class="price-value" id="pvltPrice">$0.0000</div>
      </div>
    </div>
    <div class="price-change" id="priceChange">--</div>
    <div class="price-update-badge" id="priceUpdateBadge">LIVE</div>
  </div>

  <div class="wallet-row">
    <div class="wallet-card"><div class="lbl">💼 Wallet</div><div class="val" id="walletVal">0.00</div></div>
    <div class="wallet-card"><div class="lbl">🏦 Treasury</div><div class="val" id="treasuryVal">0</div></div>
  </div>

  <main>
    <button class="pepe-btn no-energy" id="tapBtn">
      <img src="images/logo.PNG" alt="Pepe" onerror="this.innerHTML='🐸'">
    </button>
  </main>

  <footer>
    <div class="status-txt" id="statusTxt">🔒 Connect wallet to start</div>
    <div id="stateDisconnected">
      <button class="btn btn-primary" id="connectBtn">💼 CONNECT WALLET</button>
    </div>
    <div id="stateConnected" style="display:none">
      <button class="btn btn-outline" id="disconnectBtn" style="display:none"></button>
      <div class="action-grid" id="actionGrid" style="display:none">
        <button class="btn btn-secondary btn-small" id="buyBtn">⚡ BUY ENERGY<span>(100 PVLT)</span></button>
        <button class="btn btn-primary btn-small" id="claimBtn">💎 CLAIM<span id="claimSub">TO WALLET</span></button>
      </div>
    </div>
  </footer>
</div>

<div id="walletModal" class="modal-overlay">
  <div class="modal-sheet">
    <div style="text-align:right"><span class="modal-close" id="closeModal">✕</span></div>
    <div class="modal-title">Connect Wallet</div>
    <button class="wallet-option" id="metaMaskOption">
      <div class="wallet-icon">🦊</div>
      <div>MetaMask</div>
    </button>
    <div style="text-align:center; font-size:11px; color:var(--muted); margin-top:12px">
      Make sure you're on <span style="color:var(--primary)">Polygon Mainnet</span>
    </div>
  </div>
</div>

<script>
  // ============ CONTRACT ADDRESSES ============
  const PVLT_TOKEN_ADDRESS = "0x03741F950eaFD9CbAa217E2B0491a0F143492f0A";
  const GAME_CONTRACT_ADDRESS = "0xE522370EA3A22D9075bB446027c7E46b5D979806";
  const TREASURY_ADDRESS = "0x2f5d721F771f53F55845AA927b95E40d5Ad30EF4";

  const GAME_ABI = [
    "function buyEnergy(uint256 pvltAmount) external",
    "function claimRewards(uint256 pvltAmount) external",
    "function getTreasuryBalance() view returns (uint256)"
  ];
  const PVLT_ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function approve(address,uint256) returns (bool)",
    "function allowance(address,address) view returns (uint256)",
    "function decimals() view returns (uint8)"
  ];

  // DOM Elements
  const $ = id => document.getElementById(id);
  const energyValEl = $('energyVal');
  const energyBarEl = $('energyBar');
  const regenLblEl = $('regenLbl');
  const pointsValEl = $('pointsVal');
  const gamePvltValEl = $('gamePvltVal');
  const walletValEl = $('walletVal');
  const treasuryValEl = $('treasuryVal');
  const tapBtnEl = $('tapBtn');
  const statusTxtEl = $('statusTxt');
  const connectBtnEl = $('connectBtn');
  const stateDisc = $('stateDisconnected');
  const stateConn = $('stateConnected');
  const disconnBtnEl = $('disconnectBtn');
  const actionGridEl = $('actionGrid');
  const buyBtnEl = $('buyBtn');
  const claimBtnEl = $('claimBtn');
  const claimSubEl = $('claimSub');
  const walletModal = $('walletModal');
  const closeModal = $('closeModal');
  const metaMaskOption = $('metaMaskOption');
  const contractAddrSpan = $('contractAddrDisplay');
  const copyContractBtn = $('copyContractBtn');
  
  // Price Elements
  const pvltPriceEl = $('pvltPrice');
  const priceChangeEl = $('priceChange');
  const priceUpdateBadge = $('priceUpdateBadge');

  // State
  let account = null;
  let provider = null;
  let signer = null;
  let tokenC = null;
  let gameC = null;
  let decimals = 18;

  let maxEnergy = 100;
  let energy = 100;
  let points = 0;
  let gamePvlt = 0;
  let walletBal = 0;
  let treasuryBal = 0;
  let lastRegen = Date.now();
  let regenTimer = null;
  
  // Price tracking
  let currentPrice = 0;
  let previousPrice = 0;
  let priceLastUpdate = 0;

  // Helper: show toast
  function showToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    toast.textContent = message;
    if (isError) toast.style.color = '#ff8888';
    else toast.style.color = '#00ffcc';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  // copy contract address
  function copyContractAddress() {
    const addr = PVLT_TOKEN_ADDRESS;
    navigator.clipboard.writeText(addr).then(() => {
      showToast('✅ Contract address copied!', false);
    }).catch(() => {
      showToast('⚠️ Could not copy', true);
    });
  }
  copyContractBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    copyContractAddress();
  });
  $('contractCard').addEventListener('click', (e) => {
    if (e.target === copyContractBtn || copyContractBtn.contains(e.target)) return;
    copyContractAddress();
  });

  // ========== LIVE PRICE FETCH (DexScreener / GeckoTerminal alternative) ==========
  // Using DexScreener API for Polygon token price - free & fast
  async function fetchTokenPrice() {
    try {
      // Using DexScreener API - returns USD price for token on Polygon
      const tokenId = PVLT_TOKEN_ADDRESS.toLowerCase();
      const url = `https://api.dexscreener.com/latest/dex/tokens/${tokenId}`;
      
      const response = await fetch(url);
      const data = await response.json();
      
      if (data && data.pairs && data.pairs.length > 0) {
        // Find first valid pair on Polygon (chainId: 137)
        const polygonPair = data.pairs.find(pair => pair.chainId === "polygon");
        const validPair = polygonPair || data.pairs[0];
        
        if (validPair && validPair.priceUsd) {
          const newPrice = parseFloat(validPair.priceUsd);
          if (!isNaN(newPrice) && newPrice > 0) {
            previousPrice = currentPrice;
            currentPrice = newPrice;
            priceLastUpdate = Date.now();
            updatePriceDisplay();
            return;
          }
        }
      }
      
      // Fallback: If no real data, generate a mock realistic price (will be replaced when real pair exists)
      // This ensures UI works even without liquidity yet
      if (currentPrice === 0) {
        // Simulate price around $0.000012 - $0.000045 range for demo, but clearly indicates "no LP"
        currentPrice = 0.00002345;
        previousPrice = currentPrice;
        updatePriceDisplay();
        priceUpdateBadge.textContent = "SIM";
        priceUpdateBadge.style.color = "#ffaa44";
      } else {
        // slight random walk for visual effect when no real API data
        const change = (Math.random() - 0.5) * 0.000002;
        previousPrice = currentPrice;
        currentPrice = Math.max(0.000001, currentPrice + change);
        updatePriceDisplay();
      }
      
    } catch (error) {
      console.warn("Price fetch error:", error);
      // Keep last price or fallback, don't crash UI
      if (currentPrice === 0) {
        currentPrice = 0.0000185;
        previousPrice = currentPrice;
        updatePriceDisplay();
      }
      priceUpdateBadge.textContent = "⏳";
    }
  }
  
  function updatePriceDisplay() {
    if (currentPrice === undefined) return;
    // Format price with appropriate decimals
    let formattedPrice;
    if (currentPrice < 0.0001) {
      formattedPrice = `$${currentPrice.toExponential(4)}`;
    } else if (currentPrice < 0.01) {
      formattedPrice = `$${currentPrice.toFixed(6)}`;
    } else {
      formattedPrice = `$${currentPrice.toFixed(4)}`;
    }
    pvltPriceEl.textContent = formattedPrice;
    
    // Calculate change percentage
    let changePercent = 0;
    let changeClass = "";
    let changeSymbol = "";
    if (previousPrice > 0 && currentPrice !== previousPrice) {
      changePercent = ((currentPrice - previousPrice) / previousPrice) * 100;
      if (changePercent > 0) {
        changeClass = "up";
        changeSymbol = "▲";
      } else if (changePercent < 0) {
        changeClass = "down";
        changeSymbol = "▼";
      } else {
        changeClass = "";
        changeSymbol = "●";
      }
      priceChangeEl.className = `price-change ${changeClass}`;
      priceChangeEl.textContent = `${changeSymbol} ${Math.abs(changePercent).toFixed(2)}%`;
    } else {
      priceChangeEl.className = "price-change";
      priceChangeEl.textContent = "━ 0.00%";
    }
    
    // Update badge freshness
    const secondsAgo = Math.floor((Date.now() - priceLastUpdate) / 1000);
    if (secondsAgo < 30) {
      priceUpdateBadge.textContent = "● LIVE";
      priceUpdateBadge.style.color = "#00ffcc";
    } else if (secondsAgo < 120) {
      priceUpdateBadge.textContent = "◐ UPDATED";
      priceUpdateBadge.style.color = "#ffcc88";
    } else {
      priceUpdateBadge.textContent = "⟳ REFRESH";
      priceUpdateBadge.style.color = "#ffaa66";
    }
  }
  
  // Start price polling every 25 seconds
  let priceInterval = null;
  function startPricePolling() {
    if (priceInterval) clearInterval(priceInterval);
    fetchTokenPrice(); // immediate
    priceInterval = setInterval(() => {
      fetchTokenPrice();
    }, 25000); // refresh every 25 seconds
  }
  
  // Stop polling if needed
  function stopPricePolling() {
    if (priceInterval) {
      clearInterval(priceInterval);
      priceInterval = null;
    }
  }

  function save() {
    if (!account) return;
    localStorage.setItem('pv_' + account, JSON.stringify({ energy, points, gamePvlt, lastRegen, maxEnergy }));
  }
  
  function load() {
    if (!account) return;
    try {
      const d = JSON.parse(localStorage.getItem('pv_' + account) || '{}');
      maxEnergy = d.maxEnergy ?? 100;
      points = d.points ?? 0;
      gamePvlt = d.gamePvlt ?? 0;
      lastRegen = d.lastRegen ?? Date.now();
      const offSecs = Math.floor((Date.now() - lastRegen) / 1000);
      const offRegen = Math.floor(offSecs / 15);
      energy = Math.min((d.energy ?? 100) + offRegen, maxEnergy);
      if (offRegen > 0) lastRegen = Date.now();
    } catch(e) {}
  }

  function render() {
    energyValEl.textContent = `${Math.floor(energy)} / ${maxEnergy}`;
    energyBarEl.style.width = Math.min((energy / maxEnergy) * 100, 100) + '%';
    pointsValEl.textContent = points;
    gamePvltValEl.textContent = gamePvlt.toFixed(0);
    walletValEl.textContent = walletBal.toFixed(2);
    treasuryValEl.textContent = treasuryBal.toFixed(0);
    claimSubEl.textContent = gamePvlt >= 1 ? `${Math.floor(gamePvlt)} PVLT` : 'TO WALLET';

    if (account) {
      tapBtnEl.classList.remove('no-energy');
      stateDisc.style.display = 'none';
      stateConn.style.display = 'block';
      disconnBtnEl.style.display = 'block';
      actionGridEl.style.display = 'grid';
      disconnBtnEl.textContent = `🔴 ${account.slice(0,6)}...${account.slice(-4)}`;
      buyBtnEl.disabled = walletBal < 100;
      claimBtnEl.disabled = gamePvlt < 1;
    } else {
      tapBtnEl.classList.add('no-energy');
      stateDisc.style.display = 'block';
      stateConn.style.display = 'none';
    }
  }

  function tick() {
    if (account && energy < maxEnergy) {
      const secs = Math.floor((Date.now() - lastRegen) / 1000);
      const gained = Math.floor(secs / 15);
      if (gained > 0) {
        energy = Math.min(energy + gained, maxEnergy);
        lastRegen = Date.now();
        save();
      }
      const rem = 15 - (Math.floor((Date.now() - lastRegen) / 1000) % 15);
      regenLblEl.textContent = `⚡ +1 in ${rem}s`;
    } else {
      regenLblEl.textContent = '';
    }
    render();
  }

  async function refreshBalances() {
    if (!account || !tokenC) return;
    try {
      const [b, t] = await Promise.all([
        tokenC.balanceOf(account),
        gameC.getTreasuryBalance().catch(() => ethers.BigNumber.from(0))
      ]);
      walletBal = parseFloat(ethers.utils.formatUnits(b, decimals));
      treasuryBal = parseFloat(ethers.utils.formatUnits(t, decimals));
      render();
    } catch(e) { console.error('Balance error', e); }
  }

  function showFloat(x, y, text, color = '#fff') {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.cssText = `position:fixed;left:${x-20}px;top:${y-20}px;color:${color};font-family:monospace;font-weight:800;font-size:22px;pointer-events:none;z-index:999;animation:floatUp 1s forwards;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  const style = document.createElement('style');
  style.textContent = `@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}`;
  document.head.appendChild(style);

  let tapLock = false;
  function doTap(x, y) {
    if (!account || energy <= 0 || tapLock) return;
    tapLock = true; setTimeout(() => tapLock = false, 80);
    energy--; points++;
    if (points >= 100) {
      const earned = Math.floor(points / 100);
      gamePvlt += earned; points %= 100;
      showFloat(x, y-40, `+${earned} PVLT! 🎉`, '#ffd700');
    }
    showFloat(x, y, '+1 ⚡', '#00ffcc');
    save(); render();
  }

  tapBtnEl.addEventListener('click', (e) => {
    const rect = tapBtnEl.getBoundingClientRect();
    doTap(rect.left + rect.width/2, rect.top + rect.height/2);
  });
  tapBtnEl.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    doTap(touch.clientX, touch.clientY);
  }, { passive: false });

  // ========== META MASK CONNECTION ==========
  async function connectMetaMask() {
    if (!window.ethereum) {
      alert("Please install MetaMask extension!");
      return false;
    }
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      account = accounts[0];
      provider = new ethers.providers.Web3Provider(window.ethereum);
      signer = provider.getSigner();

      const network = await provider.getNetwork();
      if (network.chainId !== 137) {
        setStatus('⚠️ Switching to Polygon...');
        try {
          await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] });
        } catch(e) {
          await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{
            chainId: '0x89', chainName: 'Polygon Mainnet',
            nativeCurrency: { name: 'MATIC', symbol: 'MATIC', decimals: 18 },
            rpcUrls: ['https://polygon-rpc.com/']
          }]});
        }
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
      }

      tokenC = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      gameC = new ethers.Contract(GAME_CONTRACT_ADDRESS, GAME_ABI, signer);
      decimals = await tokenC.decimals();

      load();
      await refreshBalances();
      setStatus(`✅ Connected: ${account.slice(0,6)}...${account.slice(-4)}`);
      render();

      if (regenTimer) clearInterval(regenTimer);
      regenTimer = setInterval(async () => { tick(); await refreshBalances(); }, 1000);

      window.ethereum.on('accountsChanged', (accs) => {
        if (!accs.length) disconnect();
        else if (accs[0] !== account) location.reload();
      });
      return true;
    } catch(e) {
      console.error(e);
      setStatus('❌ ' + (e.message?.slice(0,50) || 'Connection failed'));
      return false;
    }
  }

  async function disconnect() {
    if (regenTimer) clearInterval(regenTimer);
    save();
    account = null;
    walletBal = 0;
    treasuryBal = 0;
    energy = 100; maxEnergy = 100; points = 0; gamePvlt = 0;
    connectBtnEl.innerHTML = '💼 CONNECT WALLET';
    connectBtnEl.disabled = false;
    setStatus('🔒 Disconnected');
    render();
  }

  // ========== BUY ENERGY ==========
  async function buyEnergy() { /* same robust logic */
    if (!account) { setStatus("Connect wallet first"); return; }
    if (walletBal < 100) { setStatus(`❌ Need 100 PVLT. You have ${walletBal.toFixed(2)}`); return; }
    buyBtnEl.disabled = true;
    try {
      const amountInWei = ethers.utils.parseUnits("100", decimals);
      const currentAllowance = await tokenC.allowance(account, GAME_CONTRACT_ADDRESS);
      if (currentAllowance.lt(amountInWei)) {
        setStatus("⏳ Approving PVLT...");
        const approveTx = await tokenC.approve(GAME_CONTRACT_ADDRESS, amountInWei);
        await approveTx.wait();
        await new Promise(resolve => setTimeout(resolve, 2000));
      }
      const gasEstimate = await gameC.estimateGas.buyEnergy(amountInWei);
      const tx = await gameC.buyEnergy(amountInWei, { gasLimit: gasEstimate.mul(12).div(10) });
      setStatus("⏳ Transaction sent...");
      await tx.wait();
      maxEnergy += 1000;
      energy += 1000;
      save();
      await refreshBalances();
      setStatus(`✅ +1000 Energy!`);
      showFloat(window.innerWidth/2, window.innerHeight/2 - 80, '⚡ +1000 ENERGY!', '#ffd700');
    } catch(error) { setStatus(`❌ ${error.message?.slice(0,80) || "Tx failed"}`); }
    finally { buyBtnEl.disabled = walletBal < 100; }
  }
