<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
font-size:12px;
}

.val{color:#00ff99;font-weight:bold;}

.container{
padding-top:80px;
}

.tap{
width:180px;
height:180px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:26px;
font-weight:bold;
color:black;
}

button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.card{
margin:20px;
background:#111827;
padding:15px;
border-radius:10px;
}

input{
padding:10px;
width:80%;
border-radius:8px;
border:none;
}

</style>

</head>

<body>

<div class="navbar">

<div>Points: <span id="pointsNav" class="val">0</span></div>

<div>PVLT: <span id="tokenNav" class="val">0</span></div>

<div>ID: <span id="idNav" class="val">---</span></div>

</div>

<div class="container">

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">

<h3>Link Wallet</h3>

<input id="walletInput" placeholder="Enter BSC Wallet">
<br>
<button onclick="linkWallet()">LINK WALLET</button>

</div>

<div class="card">
<button onclick="claim()">CLAIM TOKENS</button>
</div>

</div>

<script>

/* TELEGRAM INIT */
let tg = window.Telegram.WebApp;
tg.expand();

let user = tg.initDataUnsafe.user;
let telegramId = user.id;

document.getElementById("idNav").innerText = telegramId;

/* CONTRACT */
const TAP = "YOUR_TAP_CONTRACT";
const TOKEN = "YOUR_PVLT_TOKEN";

const provider = new ethers.providers.JsonRpcProvider(
"https://bsc-dataseed.binance.org/"
);

const abi = [
"function tap(uint256,uint256)",
"function getPoints(uint256) view returns (uint256)",
"function linkWallet(uint256,address)",
"function claim(uint256)"
];

const contract = new ethers.Contract(TAP, abi, provider);

/* TAP */
async function tap(){

await contract.tap(telegramId,1);

load();

}

/* LOAD POINTS */
async function load(){

let p = await contract.getPoints(telegramId);

document.getElementById("pointsNav").innerText = p;

}

/* LINK WALLET */
async function linkWallet(){

let w = document.getElementById("walletInput").value;

if(!w) return alert("Enter wallet");

alert("Wallet linked (call contract in real deploy)");

}

/* CLAIM */
async function claim(){

try{
await contract.claim(telegramId);
alert("Claim sent");
load();
}catch(e){
alert(e.message);
}

}

load();

</script>

</body>

</html>
