<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PVLT Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      margin-top: 40px;
      text-align: center;
    }

    button {
      padding: 12px 18px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .tap { background: #00ff88; }
    .claim { background: #ffcc00; }
    .wallet { background: #0088ff; }
  </style>
</head>

<body>

<div class="container">
  <h2>⚡ PVLT Mini App</h2>

  <p>User: <span id="user">Loading...</span></p>
  <p>Wallet: <span id="wallet">Not connected</span></p>
  <p>Score: <span id="score">0</span></p>

  <button class="tap" onclick="tap()">TAP</button>
  <button class="wallet" onclick="connectWallet()">CONNECT WALLET</button>
  <button class="tap" onclick="submitScore()">SUBMIT</button>
  <button class="claim" onclick="claimReward()">CLAIM</button>
</div>

<script>
let score = 0;
let wallet = "";

// SAFE TELEGRAM INIT
let tg = null;
let user = { username: "Guest", id: "0" };

try {
  tg = window.Telegram?.WebApp;
  if (tg) {
    tg.expand();
    user = tg.initDataUnsafe?.user || user;
  }
} catch (e) {
  console.log("Telegram not available");
}

document.getElementById("user").innerText = user.username || "Guest";

// TAP GAME
function tap() {
  score++;
  document.getElementById("score").innerText = score;
}

// WALLET CONNECT
async function connectWallet() {
  try {
    if (!window.ethereum) {
      alert("Install MetaMask");
      return;
    }

    const accounts = await ethereum.request({
      method: "eth_requestAccounts"
    });

    wallet = accounts[0];
    document.getElementById("wallet").innerText = wallet;

  } catch (err) {
    alert("Wallet error");
    console.log(err);
  }
}

// SUBMIT SCORE
async function submitScore() {
  try {
    if (!wallet) return alert("Connect wallet first");

    await fetch("https://YOUR-BACKEND.onrender.com/api/submit", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        telegramId: user.id,
        wallet: wallet,
        score: score
      })
    });

    alert("Score submitted");
  } catch (err) {
    alert("Submit failed");
    console.log(err);
  }
}

// CLAIM REWARD
async function claimReward() {
  try {
    const res = await fetch("https://YOUR-BACKEND.onrender.com/api/claim", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ wallet })
    });

    const data = await res.json();

    if (data.success) {
      alert("Reward: " + data.amount);
      score = 0;
      document.getElementById("score").innerText = 0;
    } else {
      alert(data.error || "Failed");
    }

  } catch (err) {
    alert("Claim error");
    console.log(err);
  }
}
</script>

</body>
</html>
