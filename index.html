<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PVLT TAP • crypto energy</title>
  <!-- Ethers + WalletConnect -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #07112a, #020815);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      color: #f0f4ff;
      min-height: 100vh;
      touch-action: pan-y;     /* allow vertical scroll, but no pinch-zoom on main container */
      overflow-x: hidden;
    }

    /* smooth scrolling for modal + taps */
    .main {
      max-width: 550px;
      margin: 0 auto;
      padding: 16px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100vh;
      scroll-behavior: smooth;
    }

    /* topbar glass */
    .topbar {
      position: sticky;
      top: 0;
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
      background: rgba(9, 20, 38, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 255, 180, 0.25);
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
      z-index: 10;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    }

    .topbar div {
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }

    /* tap button - better feedback, no zoom, no selection */
    .tapBtn {
      width: 260px;
      height: 260px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(145deg, #00f5a0, #0bc6ff);
      box-shadow: 0 20px 35px rgba(0, 255, 170, 0.3), 0 0 0 4px rgba(0, 255, 200, 0.2);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.08s linear, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 8px;
    }

    .tapBtn:active {
      transform: scale(0.94);
      box-shadow: 0 8px 20px rgba(0, 255, 170, 0.5);
      transition: 0.02s;
    }

    .tapBtn img {
      width: 72%;
      height: 72%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    /* modern card */
    .card {
      width: 100%;
      background: rgba(12, 22, 45, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 200, 0.2);
      border-radius: 36px;
      padding: 20px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 35px -12px black;
    }

    input {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 32px;
      background: #0a1022;
      color: #eef5ff;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      text-align: center;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #00ffaa;
      box-shadow: 0 0 8px rgba(0,255,160,0.3);
    }

    .actionBtn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 44px;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(95deg, #00f2b5, #01ccff);
      color: #021020;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      letter-spacing: 0.5px;
    }

    .actionBtn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 6px black;
    }

    .status {
      text-align: center;
      font-size: 13px;
      background: rgba(0,255,170,0.15);
      border-radius: 40px;
      padding: 8px;
      display: none;
      font-weight: 500;
      color: #b5ffdd;
    }

    .info {
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      padding: 14px 18px;
      border-radius: 28px;
      font-size: 13px;
      text-align: center;
      width: 100%;
      line-height: 1.55;
      font-weight: 500;
      color: #ccdeff;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Modal beautiful */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 8, 20, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 86%;
      max-width: 340px;
      background: #0f172fb3;
      border: 1px solid rgba(0, 255, 180, 0.5);
      border-radius: 44px;
      padding: 28px 20px;
      text-align: center;
      transform: scale(0.92);
      transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      backdrop-filter: blur(20px);
      background: linear-gradient(145deg, #0d142e, #070e24);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-box h3 {
      font-size: 24px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #aaffdd, #6effc0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .modal-box p {
      font-size: 15px;
      margin: 12px 0 20px;
      background: #03071270;
      padding: 12px;
      border-radius: 60px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 60px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-confirm {
      background: #00f7b0;
      color: #041f1a;
      font-weight: 800;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* scroll & energy progress vibe */
    .energy-badge {
      background: #1b2b44;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }

    /* utility */
    .flex-gap {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    @media (max-width: 480px) {
      .tapBtn {
        width: 210px;
        height: 210px;
      }
      .topbar {
        padding: 10px 16px;
      }
      .card {
        padding: 16px;
      }
      .actionBtn {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div>🔋 <span id="energy">50</span> / 100</div>
  <div>⚡ <span id="points">0</span> pts</div>
  <div>💎 <span id="pvltg">0.0000</span> PVLTG</div>
</div>

<div class="main">
  <button class="tapBtn" id="tapButton">
    <img src="images/IMG_1850.png" alt="TAP ENERGY" onerror="this.src='https://placehold.co/200x200/00aa77/white?text=PVLT'; this.onerror=null;">
  </button>

  <div class="card">
    <input id="walletInput" placeholder="🌐 Not Connected" readonly>
    <button class="actionBtn" id="walletBtn">🔗 CONNECT WALLET</button>
    <div class="status" id="walletStatus">✅ Wallet Ready</div>
    <button class="actionBtn" id="buyEnergyBtn">💊 BUY ENERGY (100k)</button>
    <button class="actionBtn" id="swapPointsBtn">🔄 SWAP POINTS → PVLTG</button>
    <button class="actionBtn" id="claimPVLTBtn">🏆 CLAIM PVLT</button>
  </div>

  <div class="info">
    ✨ 1 Tap = 1 Point &nbsp;|&nbsp; 🔥 10,000 Points = 1 PVLTG <br>
    💎 100 PVLTG → 1 PVLT &nbsp;&nbsp;⚡ Energy regen: +1 / 30 sec
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="buyModal">
  <div class="modal-box">
    <h3>💊 ENERGY PACK</h3>
    <p>💥 <strong>+100,000 ENERGY</strong> <br> 💰 Cost: <strong>100 PVLT</strong> (Polygon)</p>
    <div class="modal-buttons">
      <button class="modal-btn btn-cancel" id="cancelBuyBtn">Cancel</button>
      <button class="modal-btn btn-confirm" id="confirmBuyBtn">Confirm Purchase</button>
    </div>
  </div>
</div>

<script>
  /* ==================  CONFIGURATION ================== */
  const API = "https://pvlt-server.onrender.com";
  const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";
  const PVLT_TOKEN_ADDRESS = "0xC096dB70Fa05255b210Be58Ec2508Bed61e8dfD6";
  const PVLTG_TOKEN_ADDRESS = "0x3094Dc50cB01721eE6c0ECAf18bd0D15c154ba2d";
  const GAME_TREASURY_ADDRESS = "0xe2bb81bD8e36367F2C85c89F0B03570dFCaf5D57";
  const TOKEN_DECIMALS = 18;

  let web3Provider = null;
  let walletAddress = "";
  let points = 0;
  let energy = 50;
  let pvltg = 0;

  // DOM elements
  const energySpan = document.getElementById("energy");
  const pointsSpan = document.getElementById("points");
  const pvltgSpan = document.getElementById("pvltg");
  const walletInput = document.getElementById("walletInput");
  const walletBtn = document.getElementById("walletBtn");
  const walletStatusDiv = document.getElementById("walletStatus");
  const tapButton = document.getElementById("tapButton");
  const buyEnergyBtn = document.getElementById("buyEnergyBtn");
  const swapPointsBtn = document.getElementById("swapPointsBtn");
  const claimPVLTBtn = document.getElementById("claimPVLTBtn");
  const modalOverlay = document.getElementById("buyModal");
  const confirmBuyBtn = document.getElementById("confirmBuyBtn");
  const cancelBuyBtn = document.getElementById("cancelBuyBtn");

  // Helper: update UI
  function updateUI() {
    energySpan.innerText = Math.floor(energy);
    pointsSpan.innerText = Math.floor(points);
    pvltgSpan.innerText = Number(pvltg).toFixed(4);
    // energy visual indicator extra
    if (energy <= 5) energySpan.style.color = "#ffaa88";
    else energySpan.style.color = "#e0ffc0";
  }

  // Regen every 30 sec (max 100)
  setInterval(() => {
    if (walletAddress && energy < 100) {
      energy = Math.min(100, energy + 1);
      updateUI();
      // optional silent sync with server? but we keep local consistency after each action, safe.
    } else if (!walletAddress && energy < 100) {
      // guest mode? but we require connect for tap, but anyway.
      if (energy < 100) energy = Math.min(100, energy + 1);
      updateUI();
    }
  }, 30000);

  // Modal controls
  function openBuyModal() {
    if (!walletAddress) {
      alert("🔐 Please connect wallet first");
      return;
    }
    modalOverlay.classList.add("active");
  }
  function closeBuyModal() {
    modalOverlay.classList.remove("active");
  }
  cancelBuyBtn.onclick = closeBuyModal;

  // ========== WALLET CONNECTION (fixed ui & chain validation) ==========
  async function connectWallet() {
    try {
      let provider;
      if (window.ethereum) {
        await window.ethereum.request({ method: "eth_requestAccounts" });
        provider = new ethers.providers.Web3Provider(window.ethereum);
      } else {
        const WalletConnectProvider = window["@walletconnect/ethereum-provider"].EthereumProvider;
        const wcProvider = await WalletConnectProvider.init({
          projectId: PROJECT_ID,
          chains: [137],
          showQrModal: true,
          optionalChains: [],
        });
        await wcProvider.connect();
        provider = new ethers.providers.Web3Provider(wcProvider);
      }
      const signer = provider.getSigner();
      const address = await signer.getAddress();
      web3Provider = provider;
      walletAddress = address;

      // UI feedback
      walletInput.value = `${address.slice(0,6)}...${address.slice(-4)}`;
      walletBtn.innerText = "✅ WALLET CONNECTED";
      walletStatusDiv.style.display = "block";
      walletStatusDiv.innerText = `🟢 ${address.slice(0,6)}...${address.slice(-4)}`;

      // Load user data from backend
      const res = await fetch(API + "/user", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet: walletAddress })
      });
      const data = await res.json();
      points = data.points ?? 0;
      energy = data.energy ?? 50;
      pvltg = data.pvltg ?? 0;
      updateUI();

      // ensure energy not over 100
      if (energy > 100) energy = 100;
      updateUI();
    } catch (err) {
      console.error(err);
      alert("Connection failed. Try again or use MetaMask / Polygon Wallet.");
    }
  }

  // ========== TAP function (with energy validation) ==========
  async function tapAction() {
    if (!walletAddress) {
      alert("🔌 Connect wallet to earn points!");
      return;
    }
    if (energy < 1) {
      alert("⛔ Out of energy! Buy energy pack or wait for regeneration.");
      return;
    }
    try {
      const res = await fetch(API + "/tap", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet: walletAddress })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      points = data.points;
      energy = data.energy;
      updateUI();
      // subtle haptic if supported (vibration)
      if (navigator.vibrate) navigator.vibrate(30);
    } catch (err) {
      console.error(err);
      alert("Tap error, check network");
    }
  }

  // ========== BUY ENERGY (100 PVLT) ==========
  async function executeEnergyPurchase() {
    if (!web3Provider || !walletAddress) {
      alert("Connect wallet first");
      closeBuyModal();
      return;
    }
    const originalText = confirmBuyBtn.innerText;
    confirmBuyBtn.innerText = "⏳ Sending...";
    confirmBuyBtn.disabled = true;
    try {
      const network = await web3Provider.getNetwork();
      if (network.chainId !== 137) {
        alert("⚠️ Please switch to Polygon Mainnet (chainId 137)");
        return;
      }
      const signer = web3Provider.getSigner();
      const tokenContract = new ethers.Contract(
        PVLT_TOKEN_ADDRESS,
        [
          "function transfer(address to, uint256 amount) external returns(bool)",
          "function balanceOf(address owner) view returns(uint256)"
        ],
        signer
      );
      const amountToSend = ethers.utils.parseUnits("100", TOKEN_DECIMALS);
      const balance = await tokenContract.balanceOf(walletAddress);
      if (balance.lt(amountToSend)) {
        alert(`❌ Insufficient PVLT balance. Need 100 PVLT.\nYour balance: ${ethers.utils.formatUnits(balance, TOKEN_DECIMALS)} PVLT`);
        return;
      }
      const tx = await tokenContract.transfer(GAME_TREASURY_ADDRESS, amountToSend);
      closeBuyModal();
      alert("📦 Transaction broadcast! Waiting confirmation...");
      await tx.wait();
      // call backend refill
      const refillRes = await fetch(API + "/refill", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet: walletAddress, txHash: tx.hash })
      });
      const refillData = await refillRes.json();
      if (refillData.error) throw new Error(refillData.error);
      energy = refillData.energy;
      if (energy > 100) energy = 100;
      updateUI();
      alert("✅ +100,000 Energy delivered! Tap away!");
    } catch (err) {
      console.error(err);
      let msg = err.reason || err.message || "Transaction failed";
      alert("Energy purchase failed: " + msg);
    } finally {
      confirmBuyBtn.innerText = originalText;
      confirmBuyBtn.disabled = false;
      closeBuyModal();
    }
  }

  // ========== SWAP POINTS -> PVLTG ==========
  async function swapPoints() {
    if (!walletAddress) {
      alert("Connect wallet first");
      return;
    }
    if (points < 1) {
      alert("No points to swap");
      return;
    }
    try {
      const res = await fetch(API + "/swap-points", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet: walletAddress })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      points = 0;
      pvltg = data.pvltg;
      updateUI();
      alert(`✨ Swapped! You now have ${pvltg.toFixed(4)} PVLTG`);
    } catch (err) {
      alert("Swap failed: " + err.message);
    }
  }

  // ========== CLAIM PVLT (requires 100 PVLTG + approve) ==========
  async function claimPVLT() {
    if (!walletAddress || !web3Provider) {
      alert("Connect wallet first");
      return;
    }
    if (pvltg < 100) {
      alert(`💎 Need at least 100 PVLTG to claim 1 PVLT. Current: ${pvltg.toFixed(4)} PVLTG`);
      return;
    }
    try {
      const network = await web3Provider.getNetwork();
      if (network.chainId !== 137) {
        alert("Switch to Polygon network to claim PVLT");
        return;
      }
      const signer = web3Provider.getSigner();
      // PVLTG token approval (for treasury to burn or manage)
      const pvltgContract = new ethers.Contract(
        PVLTG_TOKEN_ADDRESS,
        ["function approve(address spender, uint256 amount) external returns(bool)"],
        signer
      );
      const amountToApprove = ethers.utils.parseUnits(pvltg.toString(), TOKEN_DECIMALS);
      const approveTx = await pvltgContract.approve(GAME_TREASURY_ADDRESS, amountToApprove);
      await approveTx.wait();

      const res = await fetch(API + "/claim-pvltg", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet: walletAddress })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      pvltg = 0;
      updateUI();
      alert("🎉 PVLT claimed successfully! Check your wallet.");
    } catch (err) {
      console.error(err);
      alert("Claim failed: " + (err.message || "approve or server error"));
    }
  }

  // ========== Attach event listeners with mobile friendliness ==========
  tapButton.addEventListener("click", (e) => {
    e.preventDefault();
    tapAction();
  });
  // disable context menu on tap image / button
  tapButton.addEventListener("contextmenu", (e) => e.preventDefault());

  walletBtn.addEventListener("click", () => connectWallet());
  buyEnergyBtn.addEventListener("click", () => openBuyModal());
  swapPointsBtn.addEventListener("click", () => swapPoints());
  claimPVLTBtn.addEventListener("click", () => claimPVLT());
  confirmBuyBtn.addEventListener("click", () => executeEnergyPurchase());

  // Prevent double-tap zoom on buttons (additional)
  const allButtons = document.querySelectorAll("button, .tapBtn");
  allButtons.forEach(btn => {
    btn.addEventListener("touchstart", (e) => {
      // just to ensure no zoom triggers
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
  });
  // reset preventdefault only for button to avoid breaking clicks, but better UX: we use fast clicks
  // Use pointer events fine, but touch-action on body is pan-y. Keep tap button responsive.

  // Also ensure energy never negative/discrepancy, manual sync
  window.addEventListener("load", () => {
    updateUI();
    // if any stored data from previous session? no, but default.
    if (localStorage.getItem("guestWalletNotice")) {} // placeholder
  });

  // Side effect: auto-reconnect if ethereum accounts changed? optional but keep user friendly
  if (window.ethereum) {
    window.ethereum.on("accountsChanged", (accounts) => {
      if (accounts.length === 0) {
        walletAddress = "";
        walletInput.value = "Not connected";
        walletBtn.innerText = "🔗 CONNECT WALLET";
        walletStatusDiv.style.display = "none";
        points = 0; energy = 50; pvltg = 0;
        updateUI();
      } else {
        connectWallet();
      }
    });
    window.ethereum.on("chainChanged", () => window.location.reload());
  }

  // Fix missing image fallback
  const tapImg = document.querySelector(".tapBtn img");
  if (tapImg) {
    tapImg.onerror = () => {
      tapImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300ccaa'/%3E%3Ctext x='50' y='67' text-anchor='middle' fill='white' font-size='28' font-weight='bold'%3ETAP%3C/text%3E%3C/svg%3E";
    };
  }

  // UI polish: show loading if needed
  console.log("UI fixed — smooth tapping, energy logic, modals and wallet ready");
</script>
</body>
</html>
