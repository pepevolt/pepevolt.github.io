<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>PepeVolt</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100vh;
  background: radial-gradient(circle at top,#183153 0%,#07111f 75%);
  display:flex;
  flex-direction:column;
  padding:16px;
}

/* TOP */
.top-nav{
  display:flex;
  gap:10px;
}

.nav-box{
  flex:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:12px;
  text-align:center;
}

.nav-title{
  font-size:11px;
  color:#9fb2d0;
}

.nav-value{
  font-size:18px;
  font-weight:bold;
  color:white;
}

/* BUTTON */
#connectBtn{
  margin-top:14px;
  width:100%;
  border:none;
  border-radius:18px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg,#00b894,#00cec9);
}

/* CENTER */
.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* TAP CIRCLE */
.tap-circle{
  position:relative;
  width:min(62vw,240px);
  height:min(62vw,240px);
  border-radius:50%;
  background: radial-gradient(circle at 30% 30%,#ffcc00,#ff8800);
  border:8px solid white;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 80px rgba(255,180,0,0.45);
  cursor:pointer;
}

/* PROGRESS RING */
.progress-ring{
  position:absolute;
  top:-8px;
  left:-8px;
  width:calc(100% + 16px);
  height:calc(100% + 16px);
  transform:rotate(-90deg);
}

circle{
  fill:none;
  stroke-width:10;
}

.bg{
  stroke:rgba(255,255,255,0.15);
}

.fg{
  stroke:#00cec9;
  stroke-linecap:round;
  transition:stroke-dashoffset 0.3s linear;
}

/* ACTIONS */
.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.action-btn{
  padding:16px;
  border:none;
  border-radius:18px;
  color:white;
  font-weight:bold;
}

.buy{
  background:linear-gradient(135deg,#00b894,#00cec9);
}

.claim{
  background:linear-gradient(135deg,#ffb347,#ff7b54);
}

/* FLOAT */
.float{
  position:fixed;
  color:white;
  font-weight:bold;
  animation:floatUp 1s linear forwards;
}

@keyframes floatUp{
  0%{opacity:1;transform:translateY(0);}
  100%{opacity:0;transform:translateY(-70px);}
}

</style>
</head>

<body>

<div class="app">

  <div class="top-nav">
    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">100</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">💎 Points</div>
      <div class="nav-value" id="points">0</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>
  </div>

  <button id="connectBtn">Connect Wallet</button>

  <div class="center">

    <div class="tap-circle" id="tapBtn">

      <!-- PROGRESS RING -->
      <svg class="progress-ring">
        <circle class="bg" cx="120" cy="120" r="110"></circle>
        <circle class="fg" cx="120" cy="120" r="110"></circle>
      </svg>

      <img src="https://cdn-icons-png.flaticon.com/512/825/825508.png" width="30%">

    </div>

  </div>

  <div class="actions">
    <button class="action-btn buy" id="buyBtn">Buy 10000 Energy</button>
    <button class="action-btn claim" id="claimBtn">Claim PVLT</button>
  </div>

</div>

<script>

const connectBtn = document.getElementById('connectBtn');
const tapBtn = document.getElementById('tapBtn');

const energyEl = document.getElementById('energy');
const pointsEl = document.getElementById('points');
const pvltEl = document.getElementById('pvlt');

const fg = document.querySelector('.fg');

let connected=false;
let energy=100;
let points=0;
let pvlt=0;

const MAX_ENERGY=100;

/* RING SETUP */
const radius = 110;
const circumference = 2 * Math.PI * radius;

fg.style.strokeDasharray = circumference;
fg.style.strokeDashoffset = 0;

/* UPDATE RING */
function updateRing(){
  const percent = energy / MAX_ENERGY;
  fg.style.strokeDashoffset = circumference * (1 - percent);
}

/* ENERGY REGEN +1 PER SECOND */
setInterval(()=>{
  if(energy < MAX_ENERGY){
    energy += 1;
    energyEl.innerText = energy;
    updateRing();
  }
},1000);

/* CONNECT */
connectBtn.addEventListener('click', async ()=>{

  if(!window.ethereum){
    alert('Install MetaMask');
    return;
  }

  const accounts = await window.ethereum.request({
    method:'eth_requestAccounts'
  });

  connectBtn.innerText =
    accounts[0].slice(0,6)+'...'+accounts[0].slice(-4);

  connected=true;
});

/* TAP */
tapBtn.addEventListener('click',(e)=>{

  if(!connected){
    alert('Connect Wallet First');
    return;
  }

  if(energy<=0){
    alert('No Energy');
    return;
  }

  energy-=1;
  points+=1;

  if(points>=1000){
    pvlt += Math.floor(points/1000);
    points = points%1000;
  }

  energyEl.innerText=energy;
  pointsEl.innerText=points;
  pvltEl.innerText=pvlt;

  updateRing();

  const f=document.createElement('div');
  f.className='float';
  f.innerText='+1 Point';
  f.style.left=e.clientX+'px';
  f.style.top=e.clientY+'px';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1000);

});

</script>

</body>
</html>
