<!-- Add these to your dashboard-screen div -->
<div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('mine')">Mine</button>
    <button class="tab-btn" onclick="switchTab('vault')">Vault</button>
</div>

<!-- Main Content Area -->
<div id="content-area">
    <!-- MINE TAB -->
    <div id="tab-mine" class="tab-content">
        <div class="token-target" id="target">🐸</div>
        <div class="energy-status">Stamina: <span id="energy-text">50/50</span></div>
    </div>

    <!-- VAULT TAB -->
    <div id="tab-vault" class="tab-content hidden">
        <div class="vault-card">
            <h3>Conversion Hub</h3>
            <p>Swap your mined points for Governance tokens, or bridge to mainnet.</p>
            <button class="btn" onclick="swapPointsToGov()">Swap Points to gPVLT</button>
            <button class="btn secondary" onclick="convertGovToPvlt()">Bridge gPVLT to PVLT</button>
            <button class="btn accent" id="final-claim-btn" style="display:none;" onclick="executeWeb3Claim()">Confirm & Claim</button>
        </div>
    </div>
</div>

<style>
    .tabs-nav { display: flex; gap: 10px; padding: 15px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #1a2230; color: #fff; cursor: pointer; }
    .tab-btn.active { background: var(--accent-color); color: #000; }
    .tab-content { display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .hidden { display: none; }
    .vault-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; width: 100%; text-align: center; }
    .secondary { background: var(--gov-color); }
</style>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        event.currentTarget.classList.add('active');
    }
</script>
