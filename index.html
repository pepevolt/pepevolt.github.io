<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PVLT Tap Game</title>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
-webkit-text-size-adjust:100%;
overscroll-behavior:none;
}

body{
display:flex;
flex-direction:column;
}

/* ================= NAV ================= */

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
}

/* ================= MAIN ================= */

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

/* ================= TAP ================= */

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;
margin-top:20px;

background:linear-gradient(135deg,#00ff99,#00ccff);

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;
position:relative;

touch-action:manipulation;
user-select:none;
-webkit-user-select:none;
}

.tap:active{
transform:scale(0.96);
}

/* LOGO */

.tapLogo{
width:75%;
height:75%;
object-fit:contain;
pointer-events:none;
}

/* ================= CARD ================= */

.bigCard{
width:90%;
max-width:380px;
margin-top:20px;
padding:18px;

background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;

display:flex;
flex-direction:column;
gap:12px;
}

/* ================= INPUT ================= */

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

/* ================= BUTTON ================= */

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
cursor:pointer;
}

/* ================= STATUS ================= */

.status{
font-size:12px;
text-align:center;
margin-top:5px;
display:none;
}

/* CONNECT / DISCONNECT COLORS */

.connected{
background:linear-gradient(90deg,#ff4d4d,#ff1a1a) !important;
color:white !important;
}

.disconnected{
background:linear-gradient(90deg,#00ff99,#00ccff) !important;
color:black !important;
}

</style>

</head>

<body>

<!-- NAV -->
<div class="nav">

<div>🔋 <span id="energy">50</span></div>
<div>⚡ <span id="points">0</span></div>
<div>💎 <span id="tokens">0.0000</span></div>

</div>

<!-- MAIN -->
<div class="container">

<button class="tap" onclick="tap()">
  <img src="images/IMG_1850.png" class="tapLogo">
</button>

<div class="small">1 Tap = 1 Point</div>

<div class="bigCard">

<input id="walletInput" placeholder="Paste BSC wallet">

<button id="walletBtn" onclick="toggleWallet()">
CONNECT WALLET
</button>

<div id="walletStatus" class="status">Wallet Connected</div>

<button onclick="buyEnergy()">
BUY ENERGY (REFILL)
</button>

<button onclick="claim()">
CLAIM TOKENS
</button>

</div>

</div>

<script>

/* ================= STATE ================= */

let wallet = "";
let points = 0;
let energy = 50;

/* ================= STORAGE ================= */

function saveState(){
  if(!wallet) return;

  localStorage.setItem(wallet, JSON.stringify({
    points,
    energy
  }));
}

function loadState(addr){
  let data = localStorage.getItem(addr);

  if(data){
    let obj = JSON.parse(data);
    points = obj.points || 0;
    energy = obj.energy || 50;
  } else {
    points = 0;
    energy = 50;
  }
}

/* ================= UI ================= */

function updateUI(){

document.getElementById("energy").innerText = energy;
document.getElementById("points").innerText = points;
document.getElementById("tokens").innerText =
(points / 10000).toFixed(4);

}

/* ================= WALLET ================= */

function toggleWallet(){

const input = document.getElementById("walletInput");
const btn = document.getElementById("walletBtn");
const status = document.getElementById("walletStatus");

if(wallet){

wallet = "";
points = 0;
energy = 50;

input.value = "";

btn.innerText = "CONNECT WALLET";
btn.classList.remove("connected");
btn.classList.add("disconnected");

status.style.display = "none";

updateUI();

return;
}

let w = input.value.trim();

if(!w.startsWith("0x") || w.length !== 42){
alert("Invalid wallet");
return;
}

wallet = w.toLowerCase();

loadState(wallet);

btn.innerText = "DISCONNECT WALLET";
btn.classList.remove("disconnected");
btn.classList.add("connected");

status.style.display = "block";

updateUI();

}

/* ================= TAP ================= */

function tap(){

if(!wallet){
alert("Connect wallet first");
return;
}

if(energy <= 0){
alert("No energy");
return;
}

energy--;
points++;

saveState();
updateUI();

}

/* ================= BUY ENERGY (FIXED SIMPLE POPUP) ================= */

function buyEnergy(){

if(!wallet){
alert("Connect wallet first");
return;
}

let amt = prompt("Enter Energy Amount (10000 Energy = $1 BNB)");

if(!amt || isNaN(amt) || amt <= 0){
return;
}

let energyAmount = Number(amt);
let price = energyAmount / 10000;

alert(
"Energy Purchase:\n" +
"Energy: " + energyAmount + "\n" +
"Price: $" + price.toFixed(4) + " (BNB)"
);

/* REFILL */
energy += energyAmount;

saveState();
updateUI();

}

/* ================= CLAIM ================= */

function claim(){

if(!wallet){
alert("Connect wallet first");
return;
}

let tokens = points / 10000;

if(tokens < 100){
alert("Minimum 100 tokens required");
return;
}

if(tokens > 500){
tokens = 500;
}

points = 0;

saveState();
updateUI();

alert("CLAIM SUCCESS\nTokens: " + tokens.toFixed(4));

}

</script>

</body>
</html>
