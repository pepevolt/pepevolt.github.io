<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1120; }
        .gradient-btn { background: linear-gradient(to right, #06b6d4, #3b82f6); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white font-sans">

    <div class="w-full max-w-sm p-4">
        <div class="flex justify-between mb-8 text-sm">
            <span>🔋 50</span>
            <span>⚡ 0</span>
            <span>💎 0.0000</span>
        </div>

        <div class="flex justify-center mb-8">
            <div class="w-32 h-20 bg-teal-400 rounded-full flex items-center justify-center shadow-lg shadow-teal-500/20">
                <span class="text-xs text-black font-bold">PEPEVOLT</span>
            </div>
        </div>

        <div class="bg-[#111827] border border-gray-700 rounded-2xl p-6">
            <div class="text-gray-400 text-sm mb-4">Connect Polygon Wallet</div>
            
            <button class="w-full py-3 rounded-lg font-bold text-black bg-cyan-400 mb-6">
                CONNECT WALLET
            </button>

            <div class="space-y-3 mb-6">
                <div class="flex justify-between text-sm">
                    <span class="text-teal-400">🏛 Treasury Vault:</span>
                    <span>0.00 PVLT</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-pink-300">💩 Your Wallet:</span>
                    <span>0.00 PVLT</span>
                </div>
            </div>

            <div class="space-y-3">
                <button class="w-full py-3 rounded-lg font-bold text-white gradient-btn">CONVERT gPVLT</button>
                <button class="w-full py-3 rounded-lg font-bold text-white gradient-btn">BUY ENERGY</button>
                <button class="w-full py-3 rounded-lg font-bold text-white gradient-btn">CLAIM PVLT</button>
            </div>
        </div>

        <div class="text-center mt-6 text-xs text-gray-400 space-y-1">
            <p>1 Tap = 1 gPVLT</p>
            <p>10,000 gPVLT = 1 PVLT Token</p>
            <p class="text-teal-400">Claim Limits: Minimum 100 PVLT - Maximum 500 PVLT</p>
        </div>
    </div>
</body>
</html>
