<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<style>

html, body {
margin:0;
padding:0;
height:100%;
overflow:hidden;
touch-action:none;
-webkit-text-size-adjust:100%;
}

body{
font-family:Arial;
background: radial-gradient(circle at top, #0b1220, #020617);
color:white;
position:fixed;
width:100%;
height:100%;
text-align:center;
}

.navbar{
position:relative;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
background: rgba(255,255,255,0.06);
backdrop-filter: blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:12px;
}

.container{
position:absolute;
top:60px;
left:0;
right:0;
bottom:0;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
overflow:hidden;
}

.tap{
width:180px;
height:180px;
border-radius:50%;
background: linear-gradient(135deg,#00ff99,#00ccff);
border:none;
font-size:22px;
font-weight:bold;
color:black;
box-shadow:0 0 25px rgba(0,255,200,0.3);
}

.tap:active{transform:scale(0.96);}

.live{
margin-top:20px;
font-size:14px;
opacity:0.9;
}

.card{
margin:12px;
padding:15px;
width:85%;
background: rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:14px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background: rgba(0,0,0,0.3);
color:white;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
margin-top:10px;
background: linear-gradient(90deg,#00ff99,#00ccff);
color:black;
font-weight:bold;
}

</style>

</head>

<body>

<div class="navbar">
<div>⚡ POINTS: <span id="totalPoints">0</span></div>
<div>💎 TOKENS: <span id="totalTokens">0.0000</span></div>
<div>👤 <span id="userId">guest</span></div>
</div>

<div class="container">

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="live">
<div>LIVE POINTS: <span id="livePoints">0</span></div>
</div>

<div class="card">
<input id="wallet" placeholder="Enter wallet">
<br>
<button onclick="saveWallet()">LINK WALLET</button>
</div>

<div class="card">
<input id="withdraw" placeholder="100 - 500 tokens">
<br>
<button onclick="withdraw()">WITHDRAW</button>
</div>

</div>

<script>

/* ================= STATE ================= */
let livePoints = 0;
let totalPoints = 0;

let wallet = "";
let userId = "guest";

let lastTap = Date.now();

const POINTS_PER_TOKEN = 10000;

/* ================= UI ================= */
function set(id,val){
let el=document.getElementById(id);
if(el) el.innerText=val;
}

/* ================= INIT ================= */
function init(){
try{
if(window.Telegram && window.Telegram.WebApp){
let tg=window.Telegram.WebApp;
tg.ready();
tg.expand();
userId=tg.initDataUnsafe?.user?.id||"guest";
}
}catch(e){}
set("userId",userId);
}

/* ================= TAP ================= */
function tap(){
livePoints++;
totalPoints++;
lastTap=Date.now();
updateUI();
}

/* ================= TOKEN CALC ================= */
function getTokens(){
return totalPoints / POINTS_PER_TOKEN;
}

/* ================= UI UPDATE ================= */
function updateUI(){
set("livePoints", livePoints);
set("totalPoints", totalPoints);
set("totalTokens", getTokens().toFixed(4));
}

/* ================= WALLET ================= */
function saveWallet(){
let w=document.getElementById("wallet");
if(!w || !w.value) return alert("Enter wallet");

wallet=w.value;
userId=w.value.slice(0,6)+"..."+w.value.slice(-4);

set("userId",userId);
alert("Wallet linked");
}

/* ================= WITHDRAW ================= */
function withdraw(){

let amt=parseInt(document.getElementById("withdraw").value);

if(!wallet) return alert("Connect wallet first");

if(amt<100 || amt>500)
return alert("Only 100–500 tokens allowed");

/* required points */
let requiredPoints = amt * POINTS_PER_TOKEN;

if(totalPoints < requiredPoints)
return alert("Not enough points");

/* ================= SUCCESS CLAIM ================= */
totalPoints -= requiredPoints;

/* 🔥 FULL RESET AFTER SUCCESS WITHDRAW */
totalPoints = 0;
livePoints = 0;

updateUI();

alert("Withdrawal successful — all data reset");
}

/* ================= AUTO RESET LIVE ================= */
setInterval(()=>{

if(Date.now() - lastTap > 3000){
livePoints = 0;
updateUI();
}

},500);

/* ================= START ================= */
window.addEventListener("DOMContentLoaded",init);

</script>

</body>

</html>
