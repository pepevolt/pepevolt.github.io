<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt UI</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-accent: #00ffcc;
        }

        body { 
            margin: 0; background-color: var(--bg-color); color: white;
            font-family: sans-serif; display: flex; justify-content: center;
        }

        .game-container { width: 100%; max-width: 400px; padding: 20px; }

        /* Perfect Circular Tapping Area */
        .tap-zone {
            display: flex; justify-content: center; align-items: center;
            margin: 30px auto;
        }

        .tap-circle {
            width: 180px; height: 180px; /* Exact same dimensions */
            background: radial-gradient(circle, #00ffcc, #0099ff);
            border-radius: 50%; /* Perfect circle */
            border: 4px solid #1f2937;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            transition: transform 0.1s;
        }

        .tap-circle:active { transform: scale(0.95); }

        /* Main Card */
        .main-card { 
            background: var(--card-bg); padding: 20px; border-radius: 20px; 
            border: 1px solid #30363d;
        }

        .btn { 
            width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px;
            border: none; font-weight: 800; cursor: pointer;
            background: linear-gradient(90deg, #00ffcc, #0099ff);
            color: black; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="tap-zone">
            <button class="tap-circle">
                <img src="pepe-icon.png" alt="Pepe" width="80">
            </button>
        </div>

        <div class="main-card">
            <button class="btn">Connect Wallet</button>
            <button class="btn">Convert gPVLT</button>
            <button class="btn">Buy Energy</button>
            <button class="btn">Claim PVLT</button>
        </div>
    </div>
</body>
</html>
