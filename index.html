<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt Game</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/ethereum-provider/dist/index.umd.js"></script>
    <style>
        body { background: #07101d; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; margin: 10px; cursor: pointer; border-radius: 10px; border: none; background: #00ff99; font-weight: bold; }
    </style>
</head>
<body>
    <h1>PepeVolt</h1>
    <button id="connectBtn" onclick="connect()">CONNECT WALLET</button>
    <div id="gameUI" style="display:none;">
        <p>Energy: <span id="e">0</span> | Points: <span id="p">0</span></p>
        <button onclick="tap()">TAP</button>
        <button onclick="buyEnergy()">BUY ENERGY (100 PVLT)</button>
        <button onclick="claim()">CLAIM REWARDS</button>
    </div>

    <script>
        const GAME_ADDR = "0x151803532A33837E4bBc2Afc23c6b1f59039B82D";
        const PVLT_ADDR = "0xb8010fD52D5208eC05574a7D5A939c0d446A862a";
        const ABI = [
            "function tap() external",
            "function buyEnergy() external",
            "function claimRewards() external",
            "function getPlayer(address) view returns(uint256, uint256, uint256, bool, uint256)"
        ];

        let provider, signer, account;

        async function connect() {
            provider = await EthereumProvider.init({
                projectId: "1731f99148b9cf6107dee70b6efb14b7",
                chains: [137],
                metadata: { name: "PepeVolt", description: "Game", url: window.location.origin, icons: [] }
            });
            await provider.enable();
            const web3Provider = new ethers.providers.Web3Provider(provider);
            signer = web3Provider.getSigner();
            account = await signer.getAddress();
            document.getElementById("gameUI").style.display = "block";
            updateUI();
        }

        async function updateUI() {
            const game = new ethers.Contract(GAME_ADDR, ABI, signer);
            const data = await game.getPlayer(account);
            document.getElementById("e").innerText = data[0];
            document.getElementById("p").innerText = data[1];
        }

        async function tap() {
            const game = new ethers.Contract(GAME_ADDR, ABI, signer);
            await (await game.tap()).wait();
            updateUI();
        }

        async function buyEnergy() {
            // 1. Approve PVLT to the Treasury address
            const token = new ethers.Contract(PVLT_ADDR, ["function approve(address, uint256)"], signer);
            await (await token.approve("0x3c25FE15e6fa0Eeb226Af53D1c9D8f8FA8BA21bc", ethers.utils.parseEther("100"))).wait();
            // 2. Buy
            const game = new ethers.Contract(GAME_ADDR, ABI, signer);
            await (await game.buyEnergy()).wait();
            updateUI();
        }
        
        async function claim() {
            const game = new ethers.Contract(GAME_ADDR, ABI, signer);
            await (await game.claimRewards()).wait();
            alert("Claimed!");
        }
    </script>
</body>
</html>
