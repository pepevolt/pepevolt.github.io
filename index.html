<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Game - Clean UI</title>
    <style>
        body { 
            margin: 0; font-family: 'Inter', -apple-system, sans-serif; 
            background: #f4f7f6; color: #1a1a1a;
        }

        .game-container { padding: 20px; max-width: 400px; margin: auto; }

        /* Stats Card */
        .stats-card { 
            background: white; padding: 20px; border-radius: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin-bottom: 30px;
        }
        .stat-item { text-align: center; }
        .stat-val { display: block; font-size: 1.1rem; font-weight: 700; color: #2d3436; }
        .stat-label { font-size: 0.65rem; color: #b2bec3; text-transform: uppercase; letter-spacing: 1px; }

        /* Tap Circle */
        .tap-circle { 
            width: 180px; height: 180px; border-radius: 40px; 
            border: none; background: #2d3436; color: white;
            font-size: 1.5rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 15px 35px rgba(45, 52, 54, 0.2);
            margin: 0 auto 30px; display: block;
            transition: transform 0.2s;
        }
        .tap-circle:active { transform: translateY(5px); }
        .tap-circle:disabled { background: #dfe6e9; color: #b2bec3; }

        /* Energy Bar */
        .energy-bar { height: 8px; background: #dfe6e9; border-radius: 4px; margin-bottom: 30px; }
        .energy-fill { height: 100%; background: #00b894; border-radius: 4px; width: 0%; transition: 0.3s; }

        /* Actions */
        .action-grid { display: flex; flex-direction: column; gap: 10px; }
        .btn { 
            padding: 16px; border-radius: 16px; border: none; font-weight: 600; 
            background: #fff; cursor: pointer; border: 1px solid #eee;
            transition: 0.2s;
        }
        .btn:hover { background: #f9f9f9; }
        .btn-primary { background: #2d3436; color: white; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-card">
            <div class="stat-item"><span class="stat-label">Energy</span><span class="stat-val" id="energy-display">0</span></div>
            <div class="stat-item"><span class="stat-label">Gems</span><span class="stat-val" id="points-display">0</span></div>
            <div class="stat-item"><span class="stat-label">Balance</span><span class="stat-val" id="burned-display">0.0</span></div>
        </div>

        <button id="tap-button" class="tap-circle" disabled>TAP</button>

        <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>

        <div class="action-grid">
            <button id="wallet-btn" class="btn" onclick="toggleWallet()">Connect Wallet</button>
            <button id="buy-btn" class="btn" onclick="confirmRefill()" disabled>Refill Energy</button>
            <button id="claim-btn" class="btn btn-primary" onclick="claimPVLT()" disabled>Claim Rewards</button>
        </div>
    </div>
</body>
</html>
