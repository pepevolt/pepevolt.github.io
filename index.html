<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PVLT Mining</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#070a12;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:12px;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.stat{
  text-align:center;
  font-size:12px;
}

.stat b{
  display:block;
  font-size:14px;
  margin-top:3px;
}

/* WALLET */
.wallet{
  text-align:center;
  padding:10px;
  font-size:12px;
  opacity:0.8;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:20px;
}

/* MINING BUTTON */
.mineBtn{
  width:min(240px, 70vw);
  height:min(240px, 70vw);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #ffd700, #ff7b00);
  box-shadow:0 0 60px rgba(255,180,0,0.25);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  user-select:none;
  transition:0.1s;
}

.mineBtn:active{
  transform:scale(0.94);
}

/* PROGRESS */
.bar{
  width:70%;
  height:10px;
  background:#1c2235;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:50%;
  background:linear-gradient(90deg,#ffb300,#ff3d00);
  transition:0.2s;
}

/* BUTTON */
button{
  padding:10px 16px;
  border:none;
  border-radius:12px;
  background:#ffffff10;
  color:white;
  backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="stat">⚡ Energy <b id="energy">50</b></div>
  <div class="stat">⛏ Mined <b id="points">0</b></div>
  <div class="stat">🪙 PVLT <b id="pvlt">0</b></div>
</div>

<!-- WALLET -->
<div class="wallet">
  <button onclick="connectWallet()">Connect Wallet</button>
  <div id="wallet">Not Connected</div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="mineBtn" onclick="mine()">
    MINE
  </div>

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <div style="font-size:12px;opacity:0.8">
    Mining Rate: +1 / tap • Auto regen energy
  </div>

  <button onclick="claim()">Claim PVLT</button>
</div>

<script>
let energy = 50;
let points = 0;
let pvlt = 0;

let signer, user;

/* UI */
function update(){
  document.getElementById("energy").innerText = energy;
  document.getElementById("points").innerText = points;
  document.getElementById("pvlt").innerText = pvlt;

  let percent = (energy/50)*100;
  document.getElementById("fill").style.width = percent + "%";
}

/* MINING */
function mine(){
  if(energy <= 0) return;

  energy--;
  points++;

  update();
}

/* ENERGY REGEN */
setInterval(()=>{
  if(energy < 50){
    energy++;
    update();
  }
}, 2500);

/* WALLET */
async function connectWallet(){
  if(!window.ethereum){
    alert("Install MetaMask");
    return;
  }

  const provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);

  signer = provider.getSigner();
  user = await signer.getAddress();

  document.getElementById("wallet").innerText =
    user.slice(0,6)+"..."+user.slice(-4);
}

/* CLAIM (mock logic ready for smart contract) */
async function claim(){
  let tokens = Math.floor(points / 100);
  if(tokens <= 0){
    alert("Need more mining!");
    return;
  }

  pvlt += tokens;
  points = 0;

  alert("Claimed "+tokens+" PVLT (test mode)");
  update();
}

update();
</script>

</body>
</html>
