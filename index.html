<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PepeVolt — PVLT⚡ Tap-to-Earn on Polygon</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(ellipse at 20% 30%, #0a0f1f, #000000);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
      touch-action: pan-y pinch-zoom;
    }

    /* UPDATE THESE AFTER DEPLOYMENT */
    :root {
      --api-url: "https://YOUR-RENDER-URL.onrender.com";
      --pvlt-token: "0x...";
      --treasury: "0x...";
      --game-contract: "0x...";
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(6, 12, 24, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 255, 200, 0.4);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid rgba(0, 255, 180, 0.45);
    }

    .stat-value {
      background: linear-gradient(135deg, #e0fffa, #2effd0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
    }

    .wallet-badge {
      background: #0e2a3ecc;
      border-radius: 60px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border: 0.5px solid #2effc0;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .game-container {
      margin-top: 85px;
      padding: 20px 16px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .energy-section {
      width: 100%;
      max-width: 380px;
      margin-bottom: 24px;
    }
    .energy-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #b0ffe0;
    }
    .energy-bar-bg {
      width: 100%;
      height: 14px;
      background: #1e2a3e;
      border-radius: 30px;
      overflow: hidden;
    }
    .energy-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2effb0, #00d4ff);
      border-radius: 30px;
      transition: width 0.2s ease;
      box-shadow: 0 0 8px #00ffc0;
    }

    .tap-area {
      position: relative;
      margin: 12px 0 8px;
      display: flex;
      justify-content: center;
    }
    .tap-circle {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2effc0, #0a6eff);
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.05s cubic-bezier(0.2, 1.2, 0.8, 1);
      box-shadow: 0 0 0 0 rgba(0, 255, 200, 0.7), 0 18px 32px rgba(0, 0, 0, 0.5), inset 0 0 12px rgba(255,255,200,0.8);
      animation: pulseGlow 1.8s infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(0, 255, 200, 0.5), 0 18px 32px rgba(0,0,0,0.5), inset 0 0 12px #ffeeaa; }
      50% { box-shadow: 0 0 0 18px rgba(0, 255, 200, 0.2), 0 20px 40px rgba(0,0,0,0.6), inset 0 0 20px #b5ffdd; }
      100% { box-shadow: 0 0 0 0 rgba(0, 255, 200, 0), 0 18px 32px rgba(0,0,0,0.5), inset 0 0 12px #ffeeaa; }
    }
    .tap-circle:active {
      transform: scale(0.92);
      box-shadow: 0 0 0 8px rgba(0, 255, 200, 0.6);
    }
    .tap-circle span {
      font-size: 56px;
      font-weight: 800;
      background: linear-gradient(145deg, #fff, #aaffdd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .floating-points {
      position: fixed;
      pointer-events: none;
      font-weight: 800;
      font-size: 26px;
      background: linear-gradient(135deg, #fff, #6effc0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      z-index: 200;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0px) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
    }

    .glass-card {
      width: 100%;
      max-width: 440px;
      background: rgba(12, 22, 40, 0.7);
      backdrop-filter: blur(18px);
      border-radius: 48px;
      border: 1px solid rgba(0, 255, 180, 0.4);
      padding: 20px 20px;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .neon-btn {
      width: 100%;
      padding: 14px 12px;
      border-radius: 60px;
      border: none;
      background: linear-gradient(95deg, #00ffb3, #1f6eff);
      font-weight: 800;
      font-size: 16px;
      color: #021a1f;
      cursor: pointer;
      transition: all 0.2s;
    }
    .neon-btn:active { transform: scale(0.97); }
    .neon-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .claim-special { background: linear-gradient(95deg, #ffb347, #ff6b4a); color: white; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(5, 12, 24, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid #2effc055;
      display: flex;
      justify-content: space-around;
      padding: 12px 20px 20px;
      z-index: 90;
    }
    .nav-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #b0ffdd;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: #0f1c2cee;
      border: 1px solid #2effc0;
      border-radius: 56px;
      padding: 28px 24px;
      width: 85%;
      max-width: 340px;
      text-align: center;
    }
    .reward-popup {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, #1effb0, #0b9060);
      padding: 16px 24px;
      border-radius: 80px;
      color: black;
      font-weight: bold;
      z-index: 1100;
      animation: fadeOut 2s forwards;
      pointer-events: none;
    }
    @keyframes fadeOut {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8);}
      100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9);}
    }

    @media (max-width: 520px) {
      .tap-circle { width: 220px; height: 220px; }
      .stat-item { padding: 4px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="stat-item">🔋 <span class="stat-value" id="energyDisplay">50</span><span style="font-size:11px;">/10000</span></div>
  <div class="stat-item">⚡ <span class="stat-value" id="pointsDisplay">0</span></div>
  <div class="stat-item">💎 <span class="stat-value" id="gpvltDisplay">0.0000</span></div>
  <div class="wallet-badge" id="walletAddressShort" onclick="connectWallet()">Connect Wallet</div>
</div>

<div class="game-container">
  <div class="energy-section">
    <div class="energy-label"><span>⚡ ENERGY</span><span id="energyFraction">50/10000</span></div>
    <div class="energy-bar-bg"><div class="energy-fill" id="energyFillBar" style="width: 0.5%;"></div></div>
  </div>

  <div class="tap-area">
    <button class="tap-circle" id="tapButton"><span>⚡TAP</span></button>
  </div>

  <div class="glass-card">
    <button class="neon-btn" id="connectWalletBtn" onclick="connectWallet()">🌐 CONNECT WALLET (POLYGON)</button>
    <button class="neon-btn" id="buyEnergyBtn" onclick="buyEnergy()">💎 BUY 10000 ENERGY (100 PVLT)</button>
    <button class="neon-btn claim-special" id="claimPvltBtn" onclick="claimPVLT()">🏆 CLAIM PVLT (100 gPVLT → PVLT)</button>
  </div>
  <div style="font-size:12px; margin-top: 16px; text-align:center; background:#00000066; padding:8px 16px; border-radius:40px;">
    🔄 AUTO: 100 Points → 1 gPVLT &nbsp;|&nbsp; 🔋 Energy +1/3s
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-icon">🏠</div>
  <div class="nav-icon">💎</div>
  <div class="nav-icon">⚙️</div>
</div>

<div id="txModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="color:#2effc0;" id="modalTitle">⏳ PROCESSING</h3>
    <p id="txModalMsg">Confirm transaction in wallet...</p>
    <div id="modalSpinner" style="height:4px; background:#2effc0; width:100%; margin-top:16px; animation: pulse 1s infinite;"></div>
  </div>
</div>

<script>
  // ========== CONFIGURATION - UPDATE AFTER DEPLOYMENT ==========
  const API_URL = "https://YOUR-RENDER-URL.onrender.com"; // UPDATE THIS
  const PVLT_TOKEN_ADDRESS = "0x..."; // UPDATE FROM REMIX
  const GAME_TREASURY = "0x..."; // UPDATE FROM REMIX (TreasuryVolt)
  const PEPEVOLT_GAME = "0x..."; // UPDATE FROM REMIX (GameVolt)
  
  const PROJECT_ID = "1731f99148b9cf6107dee70b6efb14b7";
  const TOKEN_DECIMALS = 18;
  const POLYGON_CHAIN_ID = 137;

  const ERC20_ABI = [
    "function transfer(address to, uint256 amount) external returns(bool)",
    "function approve(address spender, uint256 amount) external returns(bool)",
    "function balanceOf(address owner) view returns(uint256)",
    "function allowance(address owner, address spender) view returns(uint256)"
  ];

  const GAME_ABI = [
    "function buyEnergy() external returns(bool)",
    "function claimPVLT() external returns(bool)",
    "function tap() external",
    "function getUserData(address) external view returns(uint256, uint256, uint256)"
  ];

  // Game state
  let wallet = "";
  let web3Provider = null;
  let points = 0;
  let energy = 50;
  let gpvlt = 0;
  const MAX_ENERGY = 10000;
  let tapCooldown = false;
  let isProcessing = false;

  // DOM elements
  const energyDisplay = document.getElementById("energyDisplay");
  const pointsDisplay = document.getElementById("pointsDisplay");
  const gpvltDisplay = document.getElementById("gpvltDisplay");
  const energyFill = document.getElementById("energyFillBar");
  const energyFraction = document.getElementById("energyFraction");
  const walletSpan = document.getElementById("walletAddressShort");

  function updateUI() {
    energyDisplay.innerText = Math.floor(energy);
    pointsDisplay.innerText = points;
    gpvltDisplay.innerText = gpvlt.toFixed(4);
    const percent = (energy / MAX_ENERGY) * 100;
    energyFill.style.width = `${Math.min(100, percent)}%`;
    energyFraction.innerText = `${Math.floor(energy)}/${MAX_ENERGY}`;
    if(wallet) {
      walletSpan.innerText = wallet.slice(0,5)+"..."+wallet.slice(-4);
    } else {
      walletSpan.innerText = "Connect Wallet";
    }
  }

  function showPopup(message, isError = false) {
    const popup = document.createElement("div");
    popup.className = "reward-popup";
    if(isError) popup.style.background = "radial-gradient(circle, #ff4444, #cc0000)";
    popup.innerText = message;
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 2500);
  }

  function showFloatingPoints(x, y) {
    const el = document.createElement("div");
    el.className = "floating-points";
    el.innerText = "+1";
    el.style.left = `${x-20}px`;
    el.style.top = `${y-40}px`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  async function syncWithBackend() {
    if(!wallet) return;
    try {
      const response = await fetch(`${API_URL}/user`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await response.json();
      points = data.points || 0;
      energy = data.energy || 50;
      gpvlt = data.gpvlt || 0;
      updateUI();
    } catch(e) { console.error("Sync error:", e); }
  }

  async function switchToPolygon(provider) {
    try {
      await provider.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x89" }] });
      return true;
    } catch(e) {
      if(e.code === 4902) {
        await provider.request({ method: "wallet_addEthereumChain", params: [{
          chainId: "0x89", chainName: "Polygon Mainnet",
          nativeCurrency: { name: "MATIC", symbol: "MATIC", decimals: 18 },
          rpcUrls: ["https://polygon-rpc.com"],
          blockExplorerUrls: ["https://polygonscan.com"]
        }]});
        return true;
      }
      return false;
    }
  }

  async function connectWallet() {
    try {
      let providerRaw;
      if(window.ethereum) {
        providerRaw = window.ethereum;
        await providerRaw.request({ method: "eth_requestAccounts" });
        web3Provider = new ethers.providers.Web3Provider(providerRaw);
      } else {
        const WalletConnectProvider = window["@walletconnect/ethereum-provider"].EthereumProvider;
        const wcProv = await WalletConnectProvider.init({ 
          projectId: PROJECT_ID, 
          chains: [POLYGON_CHAIN_ID], 
          showQrModal: true, 
          rpcMap: { 137: "https://polygon-rpc.com" } 
        });
        await wcProv.connect();
        web3Provider = new ethers.providers.Web3Provider(wcProv);
        providerRaw = wcProv;
      }
      
      const network = await web3Provider.getNetwork();
      if(network.chainId !== POLYGON_CHAIN_ID) {
        const switched = await switchToPolygon(providerRaw);
        if(!switched) { alert("Please switch to Polygon Mainnet manually"); return; }
        if(window.ethereum) web3Provider = new ethers.providers.Web3Provider(window.ethereum);
      }
      
      const signer = web3Provider.getSigner();
      wallet = await signer.getAddress();
      
      await syncWithBackend();
      updateUI();
      showPopup("Wallet Connected! 🎉");
      document.getElementById("connectWalletBtn").innerHTML = "✅ WALLET CONNECTED";
    } catch(err) { 
      console.error(err); 
      alert("Connection failed: "+err.message); 
    }
  }

  async function performTap(event) {
    if(!wallet) { alert("Connect wallet first"); return; }
    if(tapCooldown) return;
    if(energy <= 0) { alert("No energy! Wait or buy more."); return; }
    
    tapCooldown = true;
    setTimeout(() => { tapCooldown = false; }, 120);

    try {
      const response = await fetch(`${API_URL}/tap`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet })
      });
      const data = await response.json();
      
      if(data.error) {
        alert(data.error);
        return;
      }
      
      points = data.points;
      energy = data.energy;
      gpvlt = data.gpvlt;
      updateUI();

      let clientX, clientY;
      if(event.touches) { 
        clientX = event.touches[0].clientX; 
        clientY = event.touches[0].clientY; 
      } else { 
        clientX = event.clientX; 
        clientY = event.clientY; 
      }
      if(clientX && clientY) showFloatingPoints(clientX, clientY);
      if(navigator.vibrate) navigator.vibrate(10);
      
    } catch(err) { 
      console.error(err);
      tapCooldown = false;
    }
  }

  async function buyEnergy() {
    if(!wallet) { alert("Connect wallet first"); return; }
    if(isProcessing) { alert("Transaction in progress..."); return; }
    
    const modal = document.getElementById("txModal");
    const modalMsg = document.getElementById("txModalMsg");
    
    isProcessing = true;
    modal.classList.add("active");
    modalMsg.innerText = "Checking PVLT balance...";
    
    try {
      const signer = web3Provider.getSigner();
      const pvltContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, ERC20_ABI, signer);
      const gameContract = new ethers.Contract(PEPEVOLT_GAME, GAME_ABI, signer);
      const amountToSend = ethers.utils.parseUnits("100", TOKEN_DECIMALS);
      
      const balance = await pvltContract.balanceOf(wallet);
      if(balance.lt(amountToSend)) {
        throw new Error(`Need 100 PVLT. Balance: ${ethers.utils.formatUnits(balance, TOKEN_DECIMALS)} PVLT`);
      }
      
      modalMsg.innerText = "Approving PVLT...";
      const allowance = await pvltContract.allowance(wallet, GAME_TREASURY);
      if(allowance.lt(amountToSend)) {
        const approveTx = await pvltContract.approve(GAME_TREASURY, amountToSend);
        await approveTx.wait();
      }
      
      modalMsg.innerText = "Buying energy...";
      const buyTx = await gameContract.buyEnergy();
      await buyTx.wait();
      
      // Update backend
      await fetch(`${API_URL}/refill`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet, txHash: buyTx.hash })
      });
      
      await syncWithBackend();
      modal.classList.remove("active");
      showPopup("⚡ +10000 ENERGY! ⚡");
      
    } catch(err) {
      modal.classList.remove("active");
      showPopup("❌ " + err.message.substring(0, 100), true);
      alert("Purchase failed: " + err.message);
    } finally {
      isProcessing = false;
    }
  }

  async function claimPVLT() {
    if(!wallet) { alert("Connect wallet first"); return; }
    if(gpvlt < 100) {
      alert(`Need 100 gPVLT. Current: ${gpvlt.toFixed(4)}`);
      return;
    }
    if(isProcessing) return;
    
    const modal = document.getElementById("txModal");
    isProcessing = true;
    modal.classList.add("active");
    document.getElementById("txModalMsg").innerText = "Claiming PVLT...";
    
    try {
      const signer = web3Provider.getSigner();
      const gameContract = new ethers.Contract(PEPEVOLT_GAME, GAME_ABI, signer);
      
      const claimTx = await gameContract.claimPVLT();
      await claimTx.wait();
      
      await syncWithBackend();
      modal.classList.remove("active");
      showPopup("🏆 1 PVLT CLAIMED! 🏆");
      
    } catch(err) {
      modal.classList.remove("active");
      showPopup("❌ Claim failed: " + err.message.substring(0, 100), true);
    } finally {
      isProcessing = false;
    }
  }

  // Auto energy regen sync
  setInterval(() => {
    if(wallet) syncWithBackend();
  }, 5000);

  // Event binding
  document.addEventListener("DOMContentLoaded", () => {
    const tapBtn = document.getElementById("tapButton");
    if(tapBtn) {
      tapBtn.addEventListener("click", (e) => { e.preventDefault(); performTap(e); });
      tapBtn.addEventListener("touchstart", (e) => { e.preventDefault(); performTap(e); });
    }
    updateUI();
  });
  
  updateUI();
</script>
</body>
</html>
