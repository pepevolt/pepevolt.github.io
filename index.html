<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap Game</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a2e; color: #ffffff; font-family: sans-serif; overflow: hidden; touch-action: manipulation; }
        .game-container { display: flex; flex-direction: column; height: 100vh; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 15px 5px; background: #16213e; text-align: center; }
        .stat-item { display: flex; flex-direction: column; font-size: 0.75rem; }
        .emoji { font-size: 1.2rem; margin-bottom: 4px; }
        .interaction-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 10px; }
        .tap-circle { width: 160px; height: 160px; border-radius: 50%; border: none; background: #4ecca3; color: #1a1a2e; font-size: 2rem; font-weight: bold; cursor: pointer; transition: transform 0.05s; box-shadow: 0 8px 0 #3a9b7c; }
        .tap-circle:active { transform: scale(0.95); }
        .energy-bar { width: 80%; height: 20px; background: #0f3460; border-radius: 10px; overflow: hidden; }
        .energy-fill { height: 100%; background: #4ecca3; width: 100%; transition: width 0.3s; }
        
        .buy-menu { background: #16213e; padding: 15px; border-radius: 10px; width: 90%; text-align: center; }
        button { padding: 12px; margin: 5px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
        .btn-claim { background: #f39c12; color: #1a1a2e; width: 80%; }
        .btn-confirm { background: #4ecca3; color: #1a1a2e; width: 80%; }
        .btn-fast-convert { background: #e94560; color: white; width: 80%; }
        .footer-panel { padding: 10px; background: #0f3460; text-align: center; display: flex; flex-direction: column; gap: 5px; }
        .btn-convert { background: #e94560; color: white; }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="stats">
            <div class="stat-item"><span class="emoji">⚡</span><span id="energy">50/50</span></div>
            <div class="stat-item"><span class="emoji">💎</span><span id="points">0</span></div>
            <div class="stat-item"><span class="emoji">🪙</span><span id="gpvlt">0.00</span></div>
        </header>

        <main class="interaction-area">
            <button id="tap-button" class="tap-circle">TAP!</button>
            <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
            <div id="pvlt-display" style="font-weight: bold;">Balance: 0.000 PVLT</div>
            
            <!-- Added Convert Button here -->
            <button class="btn-fast-convert" onclick="convertPoints()">Convert 100 💎 → 1 gPVLT</button>
            <button class="btn-claim" onclick="claimReward()">Claim Reward</button>

            <div class="buy-menu">
                <div style="margin-bottom: 8px; font-size: 0.9rem;">10,000 Energy = 100 PVLT</div>
                <button class="btn-confirm" onclick="confirmRefill()">Confirm Refill</button>
            </div>
        </main>

        <footer class="footer-panel">
            <button class="btn-convert" style="background: #f1c40f; color: #1a1a2e;" onclick="convertGPVLT()">Convert 100 gPVLT → 1 PVLT</button>
        </footer>
    </div>

    <script>
        let energy = 50, points = 0, gpvlt = 0, pvlt = 0;

        function updateUI() {
            document.getElementById('energy').innerText = `${energy}/50`;
            document.getElementById('energy-fill').style.width = (energy / 50 * 100) + "%";
            document.getElementById('points').innerText = points;
            document.getElementById('gpvlt').innerText = gpvlt.toFixed(2);
            document.getElementById('pvlt-display').innerText = `Balance: ${pvlt.toFixed(3)} PVLT`;
        }

        document.getElementById('tap-button').addEventListener('click', () => {
            if (energy > 0) { energy--; points++; updateUI(); }
        });

        function convertPoints() { 
            if (points >= 100) { points -= 100; gpvlt += 1; updateUI(); } 
            else { alert("Need 100 💎!"); } 
        }

        function confirmRefill() {
            if (pvlt >= 100) { 
                pvlt -= 100; 
                energy = 50; 
                updateUI();
                alert("Energy Refilled to Full!");
            } else { 
                alert("Need 100 PVLT!"); 
            }
        }

        function convertGPVLT() { if (gpvlt >= 100) { gpvlt -= 100; pvlt += 1; updateUI(); } else alert("Need 100 gPVLT!"); }
        function claimReward() { if (pvlt > 0) { alert("Claimed: " + pvlt.toFixed(3) + " PVLT"); pvlt = 0; updateUI(); } else alert("No PVLT to claim."); }

        setInterval(() => { if (energy < 50) { energy++; updateUI(); } }, 1000);
        updateUI();
    </script>
</body>
</html>
