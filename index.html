<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PepeVolt | Tap to Earn PVLT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle fill='%2300ffcc' cx='50' cy='50' r='50'/%3E%3Ctext x='50' y='67' text-anchor='middle' fill='%23000' font-size='50' font-family='Arial'%3E🐸%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#090912">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

:root {
  --bg: #090912;
  --card: #0e0f1a;
  --primary: #00ffcc;
  --secondary: #ffd700;
  --muted: #9ba3c2;
  --border: rgba(0,255,204,0.2);
  --radius: 16px;
  --accent-red: #ff3366;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 440px;
  margin: 0 auto;
  padding: 16px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
}

.app::-webkit-scrollbar {
  width: 3px;
}
.app::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
}
.app::-webkit-scrollbar-thumb {
  background: var(--primary);
  border-radius: 10px;
}

.energy-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.energy-left .val { font-family: monospace; font-weight: 800; font-size: 20px; color: var(--primary); }
.energy-right { width: 52%; }
.prog-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.prog-bar-fill { height: 100%; background: var(--primary); transition: width .4s ease; }
.regen-lbl { font-size: 9px; color: var(--muted); text-align: right; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-card.primary-card { border: 1px solid var(--border); }
.stat-card.secondary-card { border: 1px solid rgba(255,215,0,0.2); }
.stat-card .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
.stat-card .val { font-family: monospace; font-weight: 800; font-size: 22px; }
.stat-card.secondary-card .val { color: var(--secondary); }

.wallet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.wallet-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
}
.wallet-card .lbl { font-size: 9px; color: var(--muted); }
.wallet-card .val { font-family: monospace; font-size: 13px; }

/* Contract Address Area - Red Highlight */
.contract-area {
  background: linear-gradient(135deg, rgba(255,51,102,0.08) 0%, rgba(255,51,102,0.02) 100%);
  border: 1px solid rgba(255,51,102,0.35);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin: 10px 0 8px 0;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  position: relative;
}
.contract-area:hover {
  background: linear-gradient(135deg, rgba(255,51,102,0.12) 0%, rgba(255,51,102,0.04) 100%);
  border-color: rgba(255,51,102,0.6);
}
.contract-area:active { transform: scale(0.99); }
.contract-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #ff6680;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  font-weight: 600;
}
.copy-hint {
  font-size: 9px;
  background: rgba(255,51,102,0.2);
  padding: 2px 8px;
  border-radius: 30px;
  font-weight: 500;
  color: #ff8099;
}
.contract-address {
  font-family: 'Monaco', 'Courier New', monospace;
  font-size: 12px;
  font-weight: 500;
  word-break: break-all;
  color: #ff99aa;
  background: rgba(0,0,0,0.3);
  padding: 8px 10px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.contract-address code {
  font-family: inherit;
  font-size: 11px;
  flex: 1;
  overflow-x: auto;
  white-space: nowrap;
}
.copy-badge-modern {
  background: rgba(255,51,102,0.25);
  color: #ff99aa;
  font-size: 9px;
  padding: 4px 10px;
  border-radius: 40px;
  font-weight: 700;
  white-space: nowrap;
  border: 0.5px solid rgba(255,51,102,0.4);
}
.copy-tooltip {
  position: absolute;
  top: -28px;
  right: 12px;
  background: #00ffcc;
  color: #000;
  padding: 4px 12px;
  border-radius: 40px;
  font-size: 11px;
  font-weight: bold;
  animation: fadeOutModern 1.2s forwards;
  pointer-events: none;
  z-index: 200;
}
@keyframes fadeOutModern {
  0% { opacity: 1; transform: translateY(0); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-12px); visibility: hidden; }
}

/* LIVE TOKEN PRICE CARD - PVLT/WPOL */
.price-card {
  background: linear-gradient(135deg, rgba(0,255,204,0.07) 0%, rgba(0,255,204,0.02) 100%);
  border: 1px solid rgba(0,255,204,0.3);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin: 8px 0 8px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.price-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.price-label span:first-child { font-size: 16px; }
.price-value {
  font-family: 'Monaco', monospace;
  font-weight: 800;
  font-size: 18px;
  color: var(--primary);
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.price-change {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  background: rgba(0,0,0,0.4);
}
.price-change.positive { color: #00ffaa; }
.price-change.negative { color: #ff4466; }
.price-update-time {
  font-size: 8px;
  color: var(--muted);
  margin-left: auto;
}

main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 170px; }
.pepe-btn {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #00ebbc, #008f74);
  border: 4px solid rgba(0,255,204,0.5);
  cursor: pointer;
  transition: transform .08s;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0,255,204,0.4);
}
.pepe-btn:active { transform: scale(.95); }
.pepe-btn.no-energy { opacity: 0.5; cursor: not-allowed; }
.pepe-btn img { width: 70%; height: 70%; object-fit: contain; }

footer {
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 12px;
  margin-top: 6px;
}
.status-txt { text-align: center; font-size: 11px; font-family: monospace; color: var(--muted); margin-bottom: 10px; }
.btn {
  width: 100%;
  border: none;
  border-radius: 44px;
  padding: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #000; }
.btn-secondary { background: var(--secondary); color: #000; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.2); color: #fff; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-small { padding: 10px; font-size: 13px; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #000; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--card);
  border-radius: 24px;
  padding: 20px;
  width: 90%;
  max-width: 320px;
  border: 1px solid var(--border);
}
.modal-title { font-size: 18px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 16px; }
.wallet-option {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03);
  cursor: pointer;
  width: 100%;
  margin-bottom: 10px;
}
.wallet-option:hover { background: rgba(0,255,204,.1); }
.wallet-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255,255,255,.1); }
.modal-close { float: right; cursor: pointer; font-size: 20px; color: var(--muted); }
</style>
</head>
<body>

<div class="app">
  <div class="energy-row">
    <div class="energy-left"><div class="val" id="energyVal">100 / 100</div></div>
    <div class="energy-right">
      <div class="prog-bar"><div class="prog-bar-fill" id="energyBar" style="width:100%"></div></div>
      <div class="regen-lbl" id="regenLbl"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card primary-card">
      <div class="lbl">Points</div>
      <div class="val"><span id="pointsVal">0</span><span style="font-size:14px">/100</span></div>
    </div>
    <div class="stat-card secondary-card">
      <div class="lbl">💎 Game PVLT</div>
      <div class="val" id="gamePvltVal">0</div>
    </div>
  </div>

  <div class="wallet-row">
    <div class="wallet-card"><div class="lbl">💼 Wallet</div><div class="val" id="walletVal">0.00</div></div>
    <div class="wallet-card"><div class="lbl">🏦 Treasury</div><div class="val" id="treasuryVal">0</div></div>
  </div>

  <!-- RED HIGHLIGHTED CONTRACT ADDRESS AREA -->
  <div class="contract-area" id="contractCopyArea">
    <div class="contract-label">
      <span>📜 TOKEN CONTRACT (PVLT)</span>
      <span class="copy-hint">⧉ tap to copy</span>
    </div>
    <div class="contract-address">
      <code id="contractAddressCode">0x03741f950eafd9cbaa217e2b0491a0f143492f0a</code>
      <span class="copy-badge-modern">COPY</span>
    </div>
  </div>

  <!-- LIVE PVLT/WPOL PRICE DISPLAY -->
  <div class="price-card" id="priceCard">
    <div class="price-label">
      <span>💹</span>
      <span>PVLT / WPOL</span>
    </div>
    <div class="price-value">
      <span id="tokenPrice">0.0000 WPOL</span>
      <span id="priceChange" class="price-change">--</span>
    </div>
    <div class="price-update-time" id="priceUpdateTime">updating...</div>
  </div>

  <main>
    <button class="pepe-btn no-energy" id="tapBtn">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle fill='%23ffffffcc' cx='50' cy='50' r='45'/%3E%3Ctext x='50' y='70' text-anchor='middle' fill='%23008866' font-size='50' font-family='Arial'%3E🐸%3C/text%3E%3C/svg%3E" alt="Pepe">
    </button>
  </main>

  <footer>
    <div class="status-txt" id="statusTxt">🔒 Connect wallet to start</div>
    <div id="stateDisconnected">
      <button class="btn btn-primary" id="connectBtn">💼 CONNECT WALLET</button>
    </div>
    <div id="stateConnected" style="display:none">
      <button class="btn btn-outline" id="disconnectBtn" style="display:none"></button>
      <div class="action-grid" id="actionGrid" style="display:none">
        <button class="btn btn-secondary btn-small" id="buyBtn">⚡ BUY ENERGY<span>(100 PVLT)</span></button>
        <button class="btn btn-primary btn-small" id="claimBtn">💎 CLAIM<span id="claimSub">TO WALLET</span></button>
      </div>
    </div>
  </footer>
</div>

<div id="walletModal" class="modal-overlay">
  <div class="modal-sheet">
    <div style="text-align:right"><span class="modal-close" id="closeModal">✕</span></div>
    <div class="modal-title">Connect Wallet</div>
    <button class="wallet-option" id="metaMaskOption">
      <div class="wallet-icon">🦊</div>
      <div>MetaMask</div>
    </button>
    <div style="text-align:center; font-size:11px; color:var(--muted); margin-top:12px">
      Make sure you're on <span style="color:var(--primary)">Polygon Mainnet</span>
    </div>
  </div>
</div>

<script>
  // ============ CONTRACT ADDRESSES ============
  const PVLT_TOKEN_ADDRESS = "0x03741F950eaFD9CbAa217E2B0491a0F143492f0A";
  const GAME_CONTRACT_ADDRESS = "0xE522370EA3A22D9075bB446027c7E46b5D979806";
  const TREASURY_ADDRESS = "0x2f5d721F771f53F55845AA927b95E40d5Ad30EF4";

  const GAME_ABI = ["function buyEnergy(uint256 pvltAmount) external", "function claimRewards(uint256 pvltAmount) external", "function getTreasuryBalance() view returns (uint256)"];
  const PVLT_ABI = ["function balanceOf(address) view returns (uint256)", "function approve(address,uint256) returns (bool)", "function allowance(address,address) view returns (uint256)", "function decimals() view returns (uint8)"];

  // DOM Elements
  const $ = id => document.getElementById(id);
  const energyValEl = $('energyVal'), energyBarEl = $('energyBar'), regenLblEl = $('regenLbl');
  const pointsValEl = $('pointsVal'), gamePvltValEl = $('gamePvltVal'), walletValEl = $('walletVal'), treasuryValEl = $('treasuryVal');
  const tapBtnEl = $('tapBtn'), statusTxtEl = $('statusTxt'), connectBtnEl = $('connectBtn');
  const stateDisc = $('stateDisconnected'), stateConn = $('stateConnected'), disconnBtnEl = $('disconnectBtn');
  const actionGridEl = $('actionGrid'), buyBtnEl = $('buyBtn'), claimBtnEl = $('claimBtn'), claimSubEl = $('claimSub');
  const walletModal = $('walletModal'), closeModal = $('closeModal'), metaMaskOption = $('metaMaskOption');
  const contractCopyArea = $('contractCopyArea'), contractAddressCode = $('contractAddressCode');
  const tokenPriceSpan = $('tokenPrice'), priceChangeSpan = $('priceChange'), priceUpdateTimeSpan = $('priceUpdateTime');

  // State
  let account = null, provider = null, signer = null, tokenC = null, gameC = null, decimals = 18;
  let currentPrice = 0, previousPrice = 0;
  let maxEnergy = 100, energy = 100, points = 0, gamePvlt = 0, walletBal = 0, treasuryBal = 0, lastRegen = Date.now(), regenTimer = null, priceTimer = null;

  // ============ LIVE PVLT/WPOL PRICE from DexScreener ============
  async function fetchTokenPrice() {
    try {
      const url = `https://api.dexscreener.com/latest/dex/tokens/${PVLT_TOKEN_ADDRESS}`;
      const response = await fetch(url);
      const data = await response.json();
      
      if (data && data.pairs && data.pairs.length > 0) {
        // Find PVLT/WPOL pair specifically
        let wpolPair = null;
        let bestLiquidity = 0;
        
        for (const pair of data.pairs) {
          if (pair.chainId === 'polygon') {
            // Check for MATIC/WMATIC/WPOL pair
            const isWpolPair = pair.quoteToken?.symbol === 'MATIC' || 
                               pair.quoteToken?.symbol === 'WMATIC' ||
                               pair.quoteToken?.symbol === 'WPOL' ||
                               pair.baseToken?.symbol === 'MATIC' ||
                               pair.baseToken?.symbol === 'WMATIC' ||
                               pair.baseToken?.symbol === 'WPOL';
            
            if (isWpolPair && pair.priceNative) {
              const liquidity = parseFloat(pair.liquidity?.usd || 0);
              if (liquidity > bestLiquidity) {
                bestLiquidity = liquidity;
                wpolPair = pair;
              }
            }
          }
        }
        
        // If found PVLT/WPOL pair
        if (wpolPair && wpolPair.priceNative) {
          const newPrice = parseFloat(wpolPair.priceNative);
          previousPrice = currentPrice;
          currentPrice = newPrice;
          
          // Format: 1 PVLT = X WPOL
          tokenPriceSpan.textContent = `${currentPrice.toFixed(8)} WPOL`;
          
          if (previousPrice > 0 && previousPrice !== currentPrice) {
            const percentChange = ((currentPrice - previousPrice) / previousPrice) * 100;
            const changeFormatted = percentChange > 0 ? `+${percentChange.toFixed(2)}%` : `${percentChange.toFixed(2)}%`;
            priceChangeSpan.textContent = changeFormatted;
            priceChangeSpan.className = `price-change ${percentChange >= 0 ? 'positive' : 'negative'}`;
          } else if (previousPrice > 0) {
            priceChangeSpan.textContent = '0.00%';
            priceChangeSpan.className = 'price-change';
          } else {
            priceChangeSpan.textContent = 'live';
            priceChangeSpan.className = 'price-change positive';
          }
          
          const now = new Date();
          priceUpdateTimeSpan.textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
          return;
        }
        
        // Fallback: show USD if WPOL pair not found
        for (const pair of data.pairs) {
          if (pair.chainId === 'polygon' && pair.priceUsd) {
            tokenPriceSpan.textContent = `$${parseFloat(pair.priceUsd).toFixed(8)} USD`;
            priceChangeSpan.textContent = 'no WPOL';
            priceChangeSpan.className = 'price-change';
            return;
          }
        }
      }
      
      // No data available
      tokenPriceSpan.textContent = `0.0000 WPOL`;
      priceChangeSpan.textContent = 'no liquidity';
      priceChangeSpan.className = 'price-change';
      priceUpdateTimeSpan.textContent = 'checking...';
    } catch (error) {
      console.error("Price fetch error:", error);
      tokenPriceSpan.textContent = `0.0000 WPOL`;
      priceChangeSpan.textContent = 'error';
      priceChangeSpan.className = 'price-change';
    }
  }

  // Start price polling (every 30 seconds)
  function startPricePolling() {
    fetchTokenPrice();
    if (priceTimer) clearInterval(priceTimer);
    priceTimer = setInterval(fetchTokenPrice, 30000);
  }

  // Copy contract address
  function copyContractAddress() {
    const address = PVLT_TOKEN_ADDRESS;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(address).then(() => showCopyTooltip("✓ Copied!"));
    } else { fallbackCopy(address); }
  }
  
  function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed'; textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    showCopyTooltip("✓ Copied!");
    document.body.removeChild(textarea);
  }
  
  function showCopyTooltip(msg) {
    const oldTip = document.querySelector('.copy-tooltip');
    if (oldTip) oldTip.remove();
    const tooltip = document.createElement('div');
    tooltip.className = 'copy-tooltip';
    tooltip.textContent = msg;
    contractCopyArea.style.position = 'relative';
    contractCopyArea.appendChild(tooltip);
    setTimeout(() => tooltip.remove(), 1300);
  }
  
  contractCopyArea.addEventListener('click', (e) => { e.stopPropagation(); copyContractAddress(); });
  contractAddressCode.textContent = PVLT_TOKEN_ADDRESS;

  // Game save/load
  function save() { if (account) localStorage.setItem('pv_' + account, JSON.stringify({ energy, points, gamePvlt, lastRegen, maxEnergy })); }
  function load() {
    if (!account) return;
    try {
      const d = JSON.parse(localStorage.getItem('pv_' + account) || '{}');
      maxEnergy = d.maxEnergy ?? 100; points = d.points ?? 0; gamePvlt = d.gamePvlt ?? 0; lastRegen = d.lastRegen ?? Date.now();
      const offSecs = Math.floor((Date.now() - lastRegen) / 1000);
      const offRegen = Math.floor(offSecs / 15);
      energy = Math.min((d.energy ?? 100) + offRegen, maxEnergy);
      if (offRegen > 0) lastRegen = Date.now();
      if (energy < 0) energy = 0;
    } catch(e) {}
  }
  
  function render() {
    energyValEl.textContent = `${Math.floor(energy)} / ${maxEnergy}`;
    energyBarEl.style.width = Math.min((energy / maxEnergy) * 100, 100) + '%';
    pointsValEl.textContent = points;
    gamePvltValEl.textContent = gamePvlt.toFixed(0);
    walletValEl.textContent = walletBal.toFixed(2);
    treasuryValEl.textContent = treasuryBal.toFixed(0);
    claimSubEl.textContent = gamePvlt >= 1 ? `${Math.floor(gamePvlt)} PVLT` : 'TO WALLET';
    if (account) {
      tapBtnEl.classList.remove('no-energy');
      stateDisc.style.display = 'none';
      stateConn.style.display = 'block';
      disconnBtnEl.style.display = 'block';
      actionGridEl.style.display = 'grid';
      disconnBtnEl.textContent = `🔴 ${account.slice(0,6)}...${account.slice(-4)}`;
      if (buyBtnEl) buyBtnEl.disabled = walletBal < 100;
      if (claimBtnEl) claimBtnEl.disabled = gamePvlt < 1;
    } else {
      tapBtnEl.classList.add('no-energy');
      stateDisc.style.display = 'block';
      stateConn.style.display = 'none';
    }
  }
  
  function tick() {
    if (account && energy < maxEnergy) {
      const secs = Math.floor((Date.now() - lastRegen) / 1000);
      const gained = Math.floor(secs / 15);
      if (gained > 0) { energy = Math.min(energy + gained, maxEnergy); lastRegen = Date.now(); save(); }
      const rem = 15 - (Math.floor((Date.now() - lastRegen) / 1000) % 15);
      regenLblEl.textContent = `⚡ +1 in ${rem}s`;
    } else { regenLblEl.textContent = ''; }
    render();
  }
  
  async function refreshBalances() {
    if (!account || !tokenC) return;
    try {
      const [b, t] = await Promise.all([tokenC.balanceOf(account), gameC.getTreasuryBalance().catch(() => ethers.BigNumber.from(0))]);
      walletBal = parseFloat(ethers.utils.formatUnits(b, decimals));
      treasuryBal = parseFloat(ethers.utils.formatUnits(t, decimals));
      render();
    } catch(e) {}
  }
  
  function showFloat(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.cssText = `position:fixed;left:${x-20}px;top:${y-20}px;color:${color};font-family:monospace;font-weight:800;font-size:22px;pointer-events:none;z-index:999;animation:floatUp 1s forwards;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
  
  const style = document.createElement('style');
  style.textContent = `@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}`;
  document.head.appendChild(style);
  
  let tapLock = false;
  function doTap(x, y) {
    if (!account || energy <= 0 || tapLock) return;
    tapLock = true; setTimeout(() => tapLock = false, 80);
    energy--; points++;
    if (points >= 100) {
      const earned = Math.floor(points / 100);
      gamePvlt += earned; points %= 100;
      showFloat(x, y-40, `+${earned} PVLT! 🎉`, '#ffd700');
    }
    showFloat(x, y, '+1 ⚡', '#00ffcc');
    save(); render();
  }
  
  tapBtnEl.addEventListener('click', (e) => { const rect = tapBtnEl.getBoundingClientRect(); doTap(rect.left + rect.width/2, rect.top + rect.height/2); });
  tapBtnEl.addEventListener('touchstart', (e) => { e.preventDefault(); const touch = e.touches[0]; doTap(touch.clientX, touch.clientY); }, { passive: false });

  async function connectMetaMask() {
    if (!window.ethereum) { alert("Please install MetaMask!"); return false; }
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      account = accounts[0];
      provider = new ethers.providers.Web3Provider(window.ethereum);
      signer = provider.getSigner();
      const network = await provider.getNetwork();
      if (network.chainId !== 137) {
        setStatus('⚠️ Switching to Polygon...');
        try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] }); } catch(e) {
          await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x89', chainName: 'Polygon Mainnet', nativeCurrency: { name: 'MATIC', symbol: 'MATIC', decimals: 18 }, rpcUrls: ['https://polygon-rpc.com/'] }] });
        }
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
      }
      tokenC = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      gameC = new ethers.Contract(GAME_CONTRACT_ADDRESS, GAME_ABI, signer);
      decimals = await tokenC.decimals();
      load();
      await refreshBalances();
      setStatus(`✅ Connected: ${account.slice(0,6)}...${account.slice(-4)}`);
      render();
      if (regenTimer) clearInterval(regenTimer);
      regenTimer = setInterval(async () => { tick(); await refreshBalances(); }, 1000);
      window.ethereum.on('accountsChanged', (accs) => { if (!accs.length) disconnect(); else if (accs[0] !== account) location.reload(); });
      return true;
    } catch(e) { setStatus('❌ ' + (e.message?.slice(0,50) || 'Connection failed')); return false; }
  }
  
  async function disconnect() {
    if (regenTimer) clearInterval(regenTimer);
    save();
    account = null; walletBal = 0; treasuryBal = 0; energy = 100; maxEnergy = 100; points = 0; gamePvlt = 0;
    connectBtnEl.innerHTML = '💼 CONNECT WALLET';
    connectBtnEl.disabled = false;
    setStatus('🔒 Disconnected');
    render();
  }
