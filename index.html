<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVLT Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
border-bottom:1px solid #1f2937;
font-size:13px;
z-index:10;
}

.nav-item{
color:#94a3b8;
}

.nav-value{
color:#00ff99;
font-weight:bold;
}

/* MAIN */
.container{
padding-top:80px;
text-align:center;
}

.tap-btn{
width:200px;
height:200px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:30px;
font-weight:bold;
margin-top:20px;
}

.card{
margin-top:20px;
background:#111827;
padding:15px;
border-radius:15px;
margin-left:15px;
margin-right:15px;
}

button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.connect{
background:#38bdf8;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div class="nav-item">
Points: <span class="nav-value" id="pointsNav">0</span>
</div>

<div class="nav-item">
PVLT: <span class="nav-value" id="tokenNav">0</span>
</div>

<div class="nav-item">
Wallet: <span class="nav-value" id="walletNav">Not</span>
</div>

</div>

<!-- MAIN -->
<div class="container">

<h2>PEPE VOLT TAP GAME</h2>

<button class="connect" onclick="connectWallet()">
Connect BSC Wallet
</button>

<div class="card">
<h3>Tap Zone</h3>

<div style="font-size:40px;color:#00ff99" id="pointsMain">0</div>

<button class="tap-btn" onclick="tap()">TAP</button>

</div>

</div>

<script>

let provider, signer, wallet;

let points = 0;

// ---- CONTRACT SETTINGS ----
const contractAddress = "YOUR_TAP_CONTRACT";

const abi = [
"function tap(uint256)",
"function getPoints(address) view returns (uint256)"
];

let contract;

// ---- CONNECT WALLET ----
async function connectWallet(){

if(!window.ethereum){
alert("Install MetaMask / BSC wallet");
return;
}

provider = new ethers.providers.Web3Provider(window.ethereum);

await provider.send("eth_requestAccounts", []);

signer = provider.getSigner();

wallet = await signer.getAddress();

document.getElementById("walletNav").innerText =
wallet.slice(0,4)+"..."+wallet.slice(-4);

contract = new ethers.Contract(contractAddress, abi, signer);

loadData();

}

// ---- TAP ----
async function tap(){

points++;

document.getElementById("pointsMain").innerText = points;

document.getElementById("pointsNav").innerText = points;

// send to chain (batched style)
await contract.tap(1);

loadData();

}

// ---- LOAD ON-CHAIN DATA ----
async function loadData(){

if(!wallet) return;

let p = await contract.getPoints(wallet);

document.getElementById("pointsNav").innerText = p;
document.getElementById("pointsMain").innerText = p;

// PVLT token balance (separate contract)
let tokenAbi = [
"function balanceOf(address) view returns (uint256)"
];

let tokenContract = new ethers.Contract(
"YOUR_PVLT_TOKEN",
tokenAbi,
provider
);

let bal = await tokenContract.balanceOf(wallet);

document.getElementById("tokenNav").innerText =
ethers.utils.formatEther(bal);

}

</script>

</body>
</html>
