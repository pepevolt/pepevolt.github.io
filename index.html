<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>PVLT Tap Game</title>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial;
color:white;
touch-action:manipulation;
-webkit-text-size-adjust:100%;
overscroll-behavior:none;
}

button,input{
font-size:16px;
touch-action:manipulation;
}

/* ================= LAYOUT ================= */

body{
display:flex;
flex-direction:column;
}

.nav{
display:flex;
justify-content:space-between;
padding:14px;
background:#101b2e;
font-size:12px;
flex-shrink:0;
}

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow:hidden;
}

/* ================= TAP ================= */

.tap{
width:220px;
height:220px;
border-radius:50%;
border:none;

margin-top:30px;

font-size:28px;
font-weight:bold;

background:linear-gradient(135deg,#00ff99,#00ccff);
color:black;

display:flex;
align-items:center;
justify-content:center;
}

.tap:active{
transform:scale(0.96);
}

/* ================= CARD ================= */

.card{
width:90%;
max-width:360px;
margin-top:20px;
padding:15px;

background:rgba(255,255,255,0.05);
border-radius:14px;
}

/* ================= INPUT ================= */

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
font-size:16px;
}

/* ================= BUTTON ================= */

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

/* ================= STATUS ================= */

.status{
margin-top:8px;
font-size:12px;
color:#00ff99;
display:none;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>

</head>

<body>

<!-- ================= NAV ================= -->

<div class="nav">

<div>⚡ <span id="points">0</span></div>

<div>💎 <span id="tokens">0.0000</span></div>

<div>🔋 <span id="energy">100</span></div>

<div>👤 <span id="walletView">guest</span></div>

</div>

<!-- ================= MAIN ================= -->

<div class="container">

<button class="tap" onclick="tap()">
TAP
</button>

<div class="small" style="margin-top:10px;">
1 Tap = 1 Point | Energy System Active
</div>

<!-- ================= WALLET ================= -->

<div class="card">

<input id="walletInput"
placeholder="Paste BSC wallet">

<button id="walletBtn"
onclick="toggleWallet()">
CONNECT WALLET
</button>

<div id="walletStatus" class="status">
CONNECTED
</div>

</div>

<!-- ================= CLAIM INFO ================= -->

<div class="card">

<div class="small">
Min Claim: 100 Tokens
<br>
Max Claim: 500 Tokens
<br>
Energy: Auto regenerates
</div>

<button onclick="claim()">
CLAIM TOKENS
</button>

</div>

<script>

/* ================= STATE ================= */

let wallet = "";
let points = 0;

/* ENERGY SYSTEM */
let energy = 100;
const MAX_ENERGY = 100;

/* ================= UPDATE UI ================= */

function set(id,val){
document.getElementById(id).innerText = val;
}

/* ================= ENERGY REGEN ================= */

setInterval(()=>{

if(energy < MAX_ENERGY){
energy += 1;
set("energy",energy);
}

},3000); // regen every 3 sec

/* ================= TAP ================= */

function tap(){

if(!wallet){
alert("Connect wallet first");
return;
}

/* energy check */
if(energy <= 0){
alert("No energy");
return;
}

/* consume energy */
energy -= 1;

points += 1;

set("points",points);
set("energy",energy);

}

/* ================= CLAIM SYSTEM ================= */

function claim(){

if(!wallet){
alert("Connect wallet first");
return;
}

let tokens = points / 10000;

/* MIN MAX RULE */
if(tokens < 100){
alert("Minimum 100 tokens required");
return;
}

/* hidden fee logic (NOT shown in UI) */
let fee = 1; // $1 internal fee

if(tokens > 500){
tokens = 500;
}

/* RESET SYSTEM */
points = 0;
energy = 100;

set("points",0);
set("energy",energy);
set("tokens","0.0000");

alert(
"CLAIM SUCCESS\n" +
"Tokens: " + tokens.toFixed(4) +
"\nFee deducted"
);

}

/* ================= WALLET TOGGLE ================= */

function toggleWallet(){

const input = document.getElementById("walletInput");
const btn = document.getElementById("walletBtn");
const status = document.getElementById("walletStatus");
const view = document.getElementById("walletView");

if(wallet){

wallet = "";
points = 0;
energy = 100;

input.value = "";

btn.innerText = "CONNECT WALLET";
status.style.display = "none";

view.innerText = "guest";

set("points",0);
set("tokens","0.0000");
set("energy",100);

return;
}

let w = input.value.trim();

if(!w.startsWith("0x") || w.length !== 42){
alert("Invalid wallet");
return;
}

wallet = w.toLowerCase();

btn.innerText = "DISCONNECT WALLET";
status.style.display = "block";

view.innerText =
wallet.slice(0,6)+"..."+wallet.slice(-4);

}

</script>

</body>
</html>
