<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>PVLT Mining</title>

<style>

body{
margin:0;
font-family:Arial;
background:#08111f;
color:white;
text-align:center;
}

.nav{
display:flex;
justify-content:space-between;
padding:15px;
background:#101b2e;
font-size:13px;
}

.container{
padding:20px;
}

.mineBtn{
width:220px;
height:220px;
border-radius:50%;
border:none;

background:linear-gradient(135deg,#00ff99,#00ccff);

font-size:28px;
font-weight:bold;

margin-top:30px;
}

.mineBtn:active{
transform:scale(0.96);
}

.card{
margin-top:20px;
padding:15px;

background:rgba(255,255,255,0.05);

border-radius:14px;
}

input{
width:90%;
padding:14px;

border:none;
outline:none;

border-radius:12px;

background:#111827;
color:white;
}

button{
width:95%;
padding:14px;

margin-top:10px;

border:none;
border-radius:12px;

font-weight:bold;

background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>

</head>

<body>

<div class="nav">

<div>
⚡ Points:
<span id="points">0</span>
</div>

<div>
💎 Tokens:
<span id="tokens">0.0000</span>
</div>

<div>
👤 <span id="walletView">guest</span>
</div>

</div>

<div class="container">

<h2>⛏ PVLT Mining</h2>

<button
class="mineBtn"
onclick="mine()"
>
MINE
</button>

<div class="card">

<input
id="wallet"
placeholder="Paste BSC wallet"
>

<button onclick="connectWallet()">
CONNECT WALLET
</button>

</div>

<div class="card">

<div>
Minimum Claim: 100 PVLT
</div>

<div>
Maximum Claim: 500 PVLT
</div>

<div>
1 Token = 10,000 Points
</div>

<div>
Claim cooldown: 24h
</div>

</div>

<button onclick="claim()">
CLAIM TOKENS
</button>

</div>

<script>

/* ===============================
CHANGE THIS
=============================== */

const API =
"https://pvlt-server.onrender.com";

/* ===============================
STATE
=============================== */

let wallet = "";

/* ===============================
CONNECT
=============================== */

async function connectWallet(){

let w =
document.getElementById("wallet")
.value.trim();

if(
!w.startsWith("0x") ||
w.length !== 42
){

alert("Invalid wallet");
return;

}

wallet = w.toLowerCase();

let res = await fetch(

API + "/connect",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
wallet
})

}

);

let data = await res.json();

if(data.success){

document.getElementById(
"walletView"
).innerText =
wallet.slice(0,6) +
"..." +
wallet.slice(-4);

document.getElementById(
"points"
).innerText = data.points;

document.getElementById(
"tokens"
).innerText = data.tokens;

alert("Wallet connected");

}

}

/* ===============================
MINE
=============================== */

async function mine(){

if(!wallet){

alert("Connect wallet");
return;

}

let res = await fetch(

API + "/mine",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
wallet
})

}

);

let data = await res.json();

if(data.success){

document.getElementById(
"points"
).innerText = data.points;

document.getElementById(
"tokens"
).innerText = data.tokens;

}

}

/* ===============================
CLAIM
=============================== */

async function claim(){

if(!wallet){

alert("Connect wallet");
return;

}

let res = await fetch(

API + "/claim",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
wallet
})

}

);

let data = await res.json();

alert(data.message);

if(data.success){

document.getElementById(
"points"
).innerText = 0;

document.getElementById(
"tokens"
).innerText = "0.0000";

}

}

</script>

</body>

</html>
