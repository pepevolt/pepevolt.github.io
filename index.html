<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
font-size:12px;
z-index:10;
}

.val{color:#00ff99;font-weight:bold;}

.container{
padding-top:80px;
text-align:center;
}

input{
padding:12px;
width:80%;
border-radius:10px;
border:none;
margin-top:10px;
}

.tap{
width:200px;
height:200px;
border-radius:50%;
background:#00ff99;
border:none;
font-size:28px;
font-weight:bold;
color:black;
margin-top:20px;
}

button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.card{
margin:20px;
background:#111827;
padding:15px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="navbar">

<div>Points: <span class="val" id="pointsNav">0</span></div>

<div>PVLT: <span class="val" id="tokenNav">0</span></div>

<div>Address: <span class="val" id="addrNav">---</span></div>

</div>

<div class="container">

<h2>PVLT TAP GAME</h2>

<input id="addr" placeholder="Enter BSC Address" />

<br>

<button onclick="start()">START GAME</button>

<br>

<button class="tap" onclick="tap()">TAP</button>

<div class="card">
<button onclick="claim()">CLAIM</button>
</div>

</div>

<script>

const TAP = "YOUR_TAP_CONTRACT";
const TOKEN = "YOUR_PVLT_TOKEN";

const tapAbi = [
"function tap(address,uint256)",
"function getPoints(address) view returns (uint256)",
"function claim(address)"
];

const tokenAbi = [
"function balanceOf(address) view returns (uint256)"
];

let user;

let provider = new ethers.providers.JsonRpcProvider(
"https://bsc-dataseed.binance.org/"
);

let contract = new ethers.Contract(TAP, tapAbi, provider);
let tokenContract = new ethers.Contract(TOKEN, tokenAbi, provider);

/* START */
function start(){

user = document.getElementById("addr").value;

if(!user || user.length < 10){
alert("Enter valid BSC address");
return;
}

document.getElementById("addrNav").innerText =
user.slice(0,6)+"...";

load();

}

/* TAP */
async function tap(){

if(!user) return;

await contract.tap(user,1);
load();

}

/* CLAIM */
async function claim(){

try{
await contract.claim(user);
alert("Claim done");
load();
}catch(e){
alert(e.message);
}

}

/* LOAD */
async function load(){

if(!user) return;

let p = await contract.getPoints(user);
document.getElementById("pointsNav").innerText = p;

let b = await tokenContract.balanceOf(user);
document.getElementById("tokenNav").innerText =
ethers.utils.formatEther(b);

}

</script>

</body>
</html>
