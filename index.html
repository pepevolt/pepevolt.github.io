<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt | Official Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tap-circle { background: radial-gradient(circle, #34d399 0%, #059669 100%); transition: transform 0.1s; }
        .tap-circle:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6 flex flex-col items-center">

    <div class="grid grid-cols-3 gap-3 w-full max-w-sm mb-8">
        <div class="glass p-3 rounded-2xl text-center"><p class="text-[10px] text-slate-400 uppercase">Energy</p><p id="energy" class="font-bold text-lg">0</p></div>
        <div class="glass p-3 rounded-2xl text-center"><p class="text-[10px] text-slate-400 uppercase">Points</p><p id="points" class="font-bold text-lg">0</p></div>
        <div class="glass p-3 rounded-2xl text-center"><p class="text-[10px] text-slate-400 uppercase">PVLT</p><p id="pvlt" class="font-bold text-lg">0</p></div>
    </div>

    <button id="tapBtn" class="tap-circle w-64 h-64 rounded-full mb-10 shadow-[0_0_50px_rgba(52,211,153,0.3)] flex items-center justify-center font-bold text-3xl">TAP!</button>

    <button id="connectBtn" class="w-full max-w-sm bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold mb-6 transition-all">Connect Wallet</button>

    <div class="w-full max-w-sm space-y-3">
        <button id="refillBtn" class="w-full glass p-4 rounded-2xl border border-slate-700 hover:border-slate-500 transition">Refill Energy</button>
        <button id="convertBtn" class="w-full glass p-4 rounded-2xl border border-slate-700 hover:border-slate-500 transition">Convert Points</button>
        <button id="claimBtn" class="w-full bg-yellow-600 hover:bg-yellow-500 p-4 rounded-2xl font-bold text-slate-900 transition">Claim Rewards</button>
    </div>

    <script type="module">
        import { createAppKit, defaultConfig } from 'https://esm.sh/@reown/appkit@1.0.0';
        import { mainnet } from 'https://esm.sh/@reown/appkit/networks@1.0.0';
        import { BrowserProvider, Contract } from 'https://esm.sh/ethers@6.12.1';

        const PROJECT_ID = '1731f99148b9cf6107dee70b6efb14b7';
        const GAME_ADDR = "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";
        const PVLT_ADDR = "0x5f7df6862f439b691507dc20069f4f73a37cb08b";
        
        const GAME_ABI = [{"inputs":[],"name":"tap","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"refillEnergy","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"convertPoints","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"claimRewards","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"players","outputs":[{"internalType":"uint256","name":"energy","type":"uint256"},{"internalType":"uint256","name":"points","type":"uint256"},{"internalType":"uint256","name":"burnedGPVLT","type":"uint256"},{"internalType":"bool","name":"paidUser","type":"bool"},{"internalType":"uint256","name":"lastClaimDay","type":"uint256"}],"stateMutability":"view","type":"function"}];
        const TOKEN_ABI = [{"inputs":[{"internalType":"address","name":"account","type":"address"}],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}];

        const modal = createAppKit({
            adapters: [defaultConfig({ metadata: { name: 'PepeVolt', description: 'Tap & Earn', url: 'https://pepevolt.github.io', icons: [] } })],
            networks: [mainnet],
            projectId: PROJECT_ID
        });

        let signer, gameContract, tokenContract;

        // UI Listeners
        document.getElementById('connectBtn').addEventListener('click', () => modal.open());
        document.getElementById('tapBtn').addEventListener('click', () => handleAction('tap'));
        document.getElementById('refillBtn').addEventListener('click', () => handleAction('refillEnergy'));
        document.getElementById('convertBtn').addEventListener('click', () => handleAction('convertPoints'));
        document.getElementById('claimBtn').addEventListener('click', () => handleAction('claimRewards'));

        modal.subscribeState(async (state) => {
            if (state.isConnected) {
                const provider = new BrowserProvider(modal.getWalletProvider());
                signer = await provider.getSigner();
                gameContract = new Contract(GAME_ADDR, GAME_ABI, signer);
                tokenContract = new Contract(PVLT_ADDR, TOKEN_ABI, signer);
                document.getElementById('connectBtn').innerText = "Wallet Connected";
                updateStats();
            }
        });

        async function updateStats() {
            if (!signer) return;
            const addr = await signer.getAddress();
            const [stats, balance] = await Promise.all([
                gameContract.players(addr),
                tokenContract.balanceOf(addr)
            ]);
            document.getElementById('energy').innerText = stats.energy.toString();
            document.getElementById('points').innerText = stats.points.toString();
            document.getElementById('pvlt').innerText = (Number(balance) / 1e18).toFixed(2);
        }

        async function handleAction(fn) {
            if (!gameContract) return alert("Connect Wallet first!");
            try {
                const tx = await gameContract[fn]();
                document.getElementById('connectBtn').innerText = "Processing...";
                await tx.wait();
                updateStats();
                document.getElementById('connectBtn').innerText = "Wallet Connected";
            } catch (e) { alert("Transaction failed."); }
        }
    </script>
</body>
</html>
