<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TapVerse — Web3 Tapping Game on Polygon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(145deg, #0B1120 0%, #0A0F1A 100%);
            font-family: 'Inter', sans-serif;
            color: #EFF3FF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 550px;
            width: 100%;
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            border: 1px solid rgba(72, 187, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            padding: 18px 24px;
            background: rgba(6, 12, 24, 0.7);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            gap: 12px;
        }

        .nav-card {
            flex: 1;
            background: #0E1628;
            border-radius: 40px;
            padding: 10px 14px;
            text-align: center;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .nav-label {
            font-size: 12px;
            color: #8F9BB5;
            margin-bottom: 6px;
        }

        .nav-value {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #A0D6FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .energy-value {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .energy-current {
            font-size: 26px;
            font-weight: 800;
            color: #FFD966;
        }

        .energy-max {
            font-size: 15px;
            font-weight: 600;
            color: #7D8FB3;
        }

        .body-area {
            padding: 32px 24px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tap-circle {
            width: 210px;
            height: 210px;
            background: radial-gradient(circle at 30% 25%, #FFB347, #FF7E05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
            transition: transform 0.08s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            margin-bottom: 32px;
            font-size: 32px;
            font-weight: 800;
            color: white;
        }

        .tap-circle:active {
            transform: scale(0.94);
        }

        .tap-circle.disabled-tap {
            filter: grayscale(0.3);
            opacity: 0.75;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            gap: 18px;
            margin: 12px 0 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            border: none;
            font-weight: 700;
            padding: 12px 18px;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-primary {
            background: linear-gradient(95deg, #2D5F9E, #1C3E6C);
            color: white;
            border: 1px solid #3D8BFF;
        }

        .btn-success {
            background: linear-gradient(95deg, #1F6D43, #0F4A2E);
            color: white;
            border: 1px solid #4cd964;
        }

        .btn-claim {
            background: linear-gradient(95deg, #9B4D96, #6B2E68);
            color: white;
            border: 1px solid #E879F9;
        }

        .claim-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 48px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 12px;
        }

        .wallet-status {
            background: #070C1A;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .dot-connected {
            width: 10px;
            height: 10px;
            background: #6B7280;
            border-radius: 50%;
        }

        .dot-connected.connected {
            background: #27E0A6;
            box-shadow: 0 0 6px #27E0A6;
        }

        .error-msg {
            color: #FF8A8A;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            min-height: 36px;
        }

        .network-badge {
            font-size: 10px;
            background: #2a2f45;
            padding: 2px 8px;
            border-radius: 30px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-family: 'Inter', sans-serif;
        }

        .modal-container {
            background: #1A1F2E;
            border-radius: 32px;
            width: 90%;
            max-width: 420px;
            padding: 24px 20px 28px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .modal-header h3 {
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-subtitle {
            color: #9CA3AF;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .wallets-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 12px;
            margin-bottom: 28px;
        }

        .wallet-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 16px;
            transition: 0.1s;
        }

        .wallet-option:hover {
            background: #2A2F42;
        }

        .wallet-option img {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: #0F111A;
            padding: 6px;
        }

        .wallet-option span {
            color: #EFF3FF;
            font-size: 12px;
            font-weight: 500;
        }

        .recent-section {
            background: #0F111A;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .recent-label {
            color: #7D8FB3;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .recent-wallet {
            color: white;
            font-size: 14px;
        }

        .view-all-btn {
            width: 100%;
            background: #2D3748;
            border: none;
            padding: 10px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .wallets-grid { gap: 12px; }
            .wallet-option img { width: 40px; height: 40px; }
            .tap-circle { width: 170px; height: 170px; font-size: 26px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="top-nav">
        <div class="nav-card">
            <div class="nav-label">⚡ ENERGY</div>
            <div class="energy-value">
                <span class="energy-current" id="energyCurrent">50</span>
                <span class="energy-max">/ <span id="energyMax">10000</span></span>
            </div>
        </div>
        <div class="nav-card">
            <div class="nav-label">🎯 POINTS</div>
            <div class="nav-value" id="pointsDisplay">0</div>
        </div>
        <div class="nav-card">
            <div class="nav-label">💎 GAME CURRENCY</div>
            <div class="nav-value" id="gameCurrencyDisplay">0</div>
        </div>
    </div>

    <div class="body-area">
        <div class="wallet-status">
            <span class="dot-connected" id="walletDot"></span>
            <span id="walletAddressText">Not Connected</span>
            <span id="networkBadge" class="network-badge">Polygon</span>
        </div>

        <div class="tap-circle" id="tapCircle">
            👆 TAP
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="connectWalletBtn">🔗 Connect Wallet</button>
            <button class="btn btn-success" id="buyEnergyBtn">⚡ Buy 10000 Energy (100 PVLT)</button>
        </div>

        <div class="claim-area">
            <span class="claim-text">💰 Burn 10 Game Currency → Claim PVLT</span>
            <button class="btn btn-claim" id="claimBtn">🔥 CLAIM</button>
        </div>

        <div id="txFeedback" class="error-msg"></div>
        <div style="font-size: 11px; text-align: center; margin-top: 16px; opacity: 0.8;">
            🎯 Tap: +1 point -1 energy | ⚡ Auto refill +1/3s up to 50<br>
            💰 Buy 10000 energy with 100 PVLT (Polygon) | 💎 100 points → +1 Game Currency | 10 GC → Claim PVLT
        </div>
    </div>
</div>

<script>
    // GAME STATE
    let energy = 50;
    let maxBaseRefillCap = 50;
    let absoluteMaxEnergy = 10000;
    let points = 0;
    let gameCurrency = 0;
    let refillInterval = null;
    const POINTS_TO_CURRENCY = 100;
    const CURRENCY_BURN_REWARD = 10;

    // Web3 State
    let provider = null;
    let signer = null;
    let userAddress = null;
    let walletConnected = false;
    let currentChainId = null;

    // DOM Elements
    const energyCurrentEl = document.getElementById('energyCurrent');
    const pointsDisplayEl = document.getElementById('pointsDisplay');
    const gameCurrencyDisplayEl = document.getElementById('gameCurrencyDisplay');
    const walletAddressSpan = document.getElementById('walletAddressText');
    const walletDot = document.getElementById('walletDot');
    const networkBadge = document.getElementById('networkBadge');
    const tapCircle = document.getElementById('tapCircle');
    const txFeedback = document.getElementById('txFeedback');

    function updateGameUI() {
        energyCurrentEl.innerText = Math.floor(energy);
        pointsDisplayEl.innerText = points;
        gameCurrencyDisplayEl.innerText = gameCurrency;
        if (energy <= 0) {
            tapCircle.classList.add('disabled-tap');
        } else {
            tapCircle.classList.remove('disabled-tap');
        }
    }

    function startRefill() {
        if (refillInterval) clearInterval(refillInterval);
        refillInterval = setInterval(() => {
            if (energy < maxBaseRefillCap) {
                let newEnergy = energy + 1;
                if (newEnergy > maxBaseRefillCap) newEnergy = maxBaseRefillCap;
                if (newEnergy !== energy) {
                    energy = newEnergy;
                    updateGameUI();
                }
            }
        }, 3000);
    }

    function handleTap() {
        if (energy <= 0) {
            showFeedback("⛔ No energy! Wait for refill or buy energy.", 1500);
            return;
        }
        energy--;
        points++;

        if (points >= POINTS_TO_CURRENCY) {
            const convertedCount = Math.floor(points / POINTS_TO_CURRENCY);
            gameCurrency += convertedCount;
            points = points % POINTS_TO_CURRENCY;
            showFeedback(`✨ +${convertedCount} Game Currency!`, 1200);
        }

        updateGameUI();
        if (navigator.vibrate) navigator.vibrate(20);
    }

    function addPurchasedEnergy() {
        let newEnergy = energy + 10000;
        if (newEnergy > absoluteMaxEnergy) newEnergy = absoluteMaxEnergy;
        energy = newEnergy;
        updateGameUI();
        showFeedback(`⚡ +10000 Energy! Total: ${energy}/${absoluteMaxEnergy}`, 2000);
    }

    async function buyEnergyWithPVLT() {
        if (!walletConnected || !signer) {
            showFeedback("❌ Please connect your wallet first!", 2000);
            return;
        }

        if (currentChainId !== 137 && currentChainId !== 80001) {
            showFeedback("⚠️ Please switch to Polygon Mainnet (chainId 137) or Mumbai testnet.", 3500);
            return;
        }

        showFeedback("⏳ Initiating 100 PVLT purchase on Polygon...", 2000);
        
        // Simulate transaction (in production, call actual PVLT contract)
        setTimeout(() => {
            addPurchasedEnergy();
            showFeedback("✅ Purchase successful! +10000 Energy added.", 2500);
        }, 1500);
    }

    async function claimPVLT() {
        if (!walletConnected || !signer) {
            showFeedback("🔌 Connect wallet to claim PVLT!", 2000);
            return;
        }
        if (gameCurrency < CURRENCY_BURN_REWARD) {
            showFeedback(`💢 Need ${CURRENCY_BURN_REWARD} Game Currency. You have ${gameCurrency}`, 2000);
            return;
        }

        showFeedback("🔥 Burning 10 Game Currency, claiming PVLT...", 2000);
        setTimeout(() => {
            gameCurrency -= CURRENCY_BURN_REWARD;
            updateGameUI();
            showFeedback(`🎉 Claimed 10 PVLT to ${userAddress?.slice(0,8)}...!`, 2800);
        }, 1000);
    }

    function showFeedback(msg, duration = 2500) {
        txFeedback.innerText = msg;
        setTimeout(() => {
            if (txFeedback.innerText === msg) txFeedback.innerText = "";
        }, duration);
    }

    function updateWalletUI(address, chainId) {
        if (address) {
            walletAddressSpan.innerHTML = `${address.slice(0,6)}...${address.slice(-4)}`;
            walletDot.classList.add('connected');
        } else {
            walletAddressSpan.innerHTML = "Not Connected";
            walletDot.classList.remove('connected');
        }
        
        if (chainId === 137) {
            networkBadge.innerHTML = `🟣 Polygon Mainnet`;
        } else if (chainId === 80001) {
            networkBadge.innerHTML = `🟣 Mumbai Testnet`;
        } else {
            networkBadge.innerHTML = `⚡ Polygon`;
        }
    }

    // Wallet Modal
    function showWalletModal() {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal-overlay';
        modalDiv.innerHTML = `
            <div class="modal-container">
                <div class="modal-header">
                    <h3>WalletConnect</h3>
                    <button class="modal-close-btn" id="closeModalBtn">✕</button>
                </div>
                <div class="modal-subtitle">Connect your wallet</div>
                <div class="wallets-grid">
                    <div class="wallet-option" data-wallet="metamask">
                        <img src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1.635/networks/metamask.svg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23F6851B%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%23F6851B%22/%3E%3C/svg%3E'">
                        <span>MetaMask</span>
                    </div>
                    <div class="wallet-option" data-wallet="trust">
                        <img src="https://assets.trustwalletapp.com/logo.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%233377FF%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%233377FF%22/%3E%3C/svg%3E'">
                        <span>Trust Wallet</span>
                    </div>
                    <div class="wallet-option" data-wallet="binance">
                        <img src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1.635/icon/BNB.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23F3BA2F%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%23F3BA2F%22/%3E%3C/svg%3E'">
                        <span>Binance</span>
                    </div>
                    <div class="wallet-option" data-wallet="safepal">
                        <img src="https://www.safepal.com/favicon.ico" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%234CAF50%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%234CAF50%22/%3E%3C/svg%3E'">
                        <span>SafePal</span>
                    </div>
                    <div class="wallet-option" data-wallet="okx">
                        <img src="https://www.okx.com/favicon.ico" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23000000%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%23000000%22/%3E%3C/svg%3E'">
                        <span>OKX Wallet</span>
                    </div>
                    <div class="wallet-option" data-wallet="tokenpocket">
                        <img src="https://tokenpocket.pro/static/img/logo.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%233399FF%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%233399FF%22/%3E%3C/svg%3E'">
                        <span>TokenPocket</span>
                    </div>
                    <div class="wallet-option" data-wallet="walletconnect">
                        <img src="https://walletconnect.com/favicon.ico" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%233B88F0%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%233B88F0%22/%3E%3C/svg%3E'">
                        <span>WalletConnect</span>
                    </div>
                    <div class="wallet-option" data-wallet="fireblocks">
                        <img src="https://www.fireblocks.com/wp-content/uploads/2022/12/cropped-favicon-32x32.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23FF6B35%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%23FF6B35%22/%3E%3C/svg%3E'">
                        <span>Fireblocks</span>
                    </div>
                </div>
                <div class="recent-section">
                    <div class="recent-label">RECENT</div>
                    <div class="recent-wallet" id="recentWallet">—</div>
                </div>
                <button class="view-all-btn">View All</button>
            </div>
        `;
        document.body.appendChild(modalDiv);

        document.getElementById('closeModalBtn').addEventListener('click', () => modalDiv.remove());
        
        document.querySelectorAll('.wallet-option').forEach(opt => {
            opt.addEventListener('click', async () => {
                modalDiv.remove();
                await connectWalletWithInjected();
            });
        });
    }

    async function connectWalletWithInjected() {
        if (!window.ethereum) {
            showFeedback("❌ No wallet found! Please install MetaMask or Trust Wallet.", 3000);
            return;
        }

        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            const network = await provider.getNetwork();
            currentChainId = Number(network.chainId);
            
            walletConnected = true;
            updateWalletUI(userAddress, currentChainId);
            showFeedback(`✅ Connected to ${userAddress.slice(0,6)}...`, 2000);
        } catch (err) {
            showFeedback(`Connection failed: ${err.message}`, 3000);
            walletConnected = false;
        }
    }

    // Event Listeners
    function init() {
        startRefill();
        updateGameUI();
        
        document.getElementById('connectWalletBtn').addEventListener('click', showWalletModal);
        document.getElementById('buyEnergyBtn').addEventListener('click', buyEnergyWithPVLT);
        document.getElementById('claimBtn').addEventListener('click', claimPVLT);
        tapCircle.addEventListener('click', handleTap);
    }

    init();
</script>
</body>
</html>
