<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#020b18;
font-family:Arial,sans-serif;
color:white;
touch-action:manipulation;
-webkit-user-select:none;
user-select:none;
}

body{
display:flex;
justify-content:center;
align-items:center;
padding:12px;
}

.app{
width:100%;
max-width:430px;
height:100%;
max-height:930px;
background:
linear-gradient(
180deg,
#07101f 0%,
#0d1830 50%,
#07111d 100%
);
border-radius:28px;
overflow:hidden;
display:flex;
flex-direction:column;
border:1px solid rgba(255,255,255,0.08);
box-shadow:
0 0 30px rgba(0,255,170,0.08);
}

.topbar{
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
background:#091426;
font-weight:bold;
font-size:14px;
}

.main{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow-y:auto;
}

.tapBtn{
width:250px;
height:250px;
border:none;
border-radius:50%;
margin-top:20px;
background:
linear-gradient(
135deg,
#00ff99,
#00ccff
);
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
font-weight:800;
color:#031018;
cursor:pointer;
box-shadow:
0 0 40px rgba(0,255,180,0.3);
transition:0.08s;
}

.tapBtn:active{
transform:scale(0.95);
}

.card{
width:100%;
max-width:380px;
margin-top:30px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:18px;
display:flex;
flex-direction:column;
gap:14px;
}

.walletBox{
width:100%;
padding:14px;
border-radius:12px;
background:#0c1628;
text-align:center;
font-size:14px;
word-break:break-all;
}

.actionBtn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
background:
linear-gradient(
90deg,
#00ff99,
#00ccff
);
color:black;
cursor:pointer;
transition:0.08s;
}

.actionBtn:active{
transform:scale(0.98);
}

.info{
margin-top:18px;
font-size:12px;
line-height:1.8;
opacity:0.75;
text-align:center;
}

.status{
margin-top:14px;
font-size:12px;
opacity:0.7;
text-align:center;
}

</style>

</head>

<body>

<div class="app">

<div class="topbar">

<div>
🔋 <span id="energy">0</span>
</div>

<div>
⚡ <span id="points">0</span>
</div>

<div>
💎 <span id="gpvlt">0</span>
</div>

</div>

<div class="main">

<button
class="tapBtn"
id="tapBtn"
>
TAP
</button>

<div class="card">

<div
class="walletBox"
id="walletDisplay"
>
NOT CONNECTED
</div>

<button
class="actionBtn"
id="connectBtn"
>
CONNECT WALLET
</button>

<button
class="actionBtn"
id="refillBtn"
>
REFILL ENERGY
</button>

<button
class="actionBtn"
id="convertBtn"
>
CONVERT POINTS
</button>

<button
class="actionBtn"
id="claimBtn"
>
CLAIM PVLT
</button>

<div
class="status"
id="status"
>
Ready
</div>

</div>

<div class="info">
1 Tap = 1 Point<br>
10 Points = 1 gPVLT<br>
10 gPVLT = 1 PVLT
</div>

</div>

</div>

<script>

/* ================= CONTRACTS ================= */

const GAME_ADDRESS =
"0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

const TREASURY_ADDRESS =
"0x4251Ef24D10bf637494C173621F5f84262e9Bda5";

/* ================= ABIS ================= */

const GAME_ABI = [

"function tap() external",

"function refillEnergy() external",

"function convertPoints() external",

"function players(address) view returns(uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"

];

const TREASURY_ABI = [

"function claimRewards() external"

];

/* ================= STATE ================= */

let provider;
let signer;
let game;
let treasury;
let wallet;

/* ================= UI ================= */

const energyEl =
document.getElementById("energy");

const pointsEl =
document.getElementById("points");

const gpvltEl =
document.getElementById("gpvlt");

const walletDisplay =
document.getElementById("walletDisplay");

const statusEl =
document.getElementById("status");

/* ================= STATUS ================= */

function setStatus(text){

statusEl.innerText = text;

}

/* ================= CONNECT WALLET ================= */

async function connectWallet(){

try{

if(!window.ethereum){

alert(
"Open inside MetaMask or Trust Wallet browser"
);

return;

}

setStatus("Connecting wallet...");

await window.ethereum.request({
method:"eth_requestAccounts"
});

provider =
new ethers.providers.Web3Provider(
window.ethereum
);

const network =
await provider.getNetwork();

if(network.chainId !== 137){

try{

await window.ethereum.request({
method:"wallet_switchEthereumChain",
params:[{
chainId:"0x89"
}]
});

}catch(err){

alert("Switch to Polygon Mainnet");

setStatus("Wrong network");

return;

}

}

signer =
provider.getSigner();

wallet =
await signer.getAddress();

walletDisplay.innerText =
wallet.slice(0,6) +
"..." +
wallet.slice(-4);

game =
new ethers.Contract(
GAME_ADDRESS,
GAME_ABI,
signer
);

treasury =
new ethers.Contract(
TREASURY_ADDRESS,
TREASURY_ABI,
signer
);

await loadPlayer();

setStatus("Wallet connected");

}catch(err){

console.log(err);

setStatus("Connection failed");

alert(
err.message ||
"Wallet connection failed"
);

}

}

/* ================= LOAD PLAYER ================= */

async function loadPlayer(){

if(!game || !wallet) return;

try{

const data =
await game.players(wallet);

energyEl.innerText =
Number(data.energy);

pointsEl.innerText =
Number(data.points);

gpvltEl.innerText =
Number(data.burnedGPVLT);

}catch(err){

console.log(err);

}

}

/* ================= TAP ================= */

async function tapGame(){

if(!game){

alert("Connect wallet first");

return;

}

try{

setStatus("Tapping...");

const tx =
await game.tap();

await tx.wait();

await loadPlayer();

setStatus("Tap successful");

}catch(err){

console.log(err);

setStatus("Tap failed");

alert("No energy or transaction rejected");

}

}

/* ================= REFILL ================= */

async function refillEnergy(){

if(!game){

alert("Connect wallet first");

return;

}

try{

setStatus("Refilling...");

const tx =
await game.refillEnergy();

await tx.wait();

await loadPlayer();

setStatus("Energy refilled");

}catch(err){

console.log(err);

setStatus("Refill failed");

alert("Refill failed");

}

}

/* ================= CONVERT ================= */

async function convertPoints(){

if(!game){

alert("Connect wallet first");

return;

}

try{

setStatus("Converting...");

const tx =
await game.convertPoints();

await tx.wait();

await loadPlayer();

setStatus("Converted");

}catch(err){

console.log(err);

setStatus("Convert failed");

alert("Need minimum 10 points");

}

}

/* ================= CLAIM ================= */

async function claimPVLT(){

if(!treasury){

alert("Connect wallet first");

return;

}

try{

setStatus("Claiming...");

const tx =
await treasury.claimRewards();

await tx.wait();

await loadPlayer();

setStatus("PVLT claimed");

alert("PVLT claimed successfully");

}catch(err){

console.log(err);

setStatus("Claim failed");

alert("Claim failed");

}

}

/* ================= BUTTON EVENTS ================= */

document
.getElementById("connectBtn")
.addEventListener(
"click",
connectWallet
);

document
.getElementById("tapBtn")
.addEventListener(
"click",
tapGame
);

document
.getElementById("refillBtn")
.addEventListener(
"click",
refillEnergy
);

document
.getElementById("convertBtn")
.addEventListener(
"click",
convertPoints
);

document
.getElementById("claimBtn")
.addEventListener(
"click",
claimPVLT
);

/* ================= AUTO CONNECT ================= */

window.addEventListener(
"load",
async()=>{

try{

if(window.ethereum){

const accounts =
await window.ethereum.request({
method:"eth_accounts"
});

if(accounts.length > 0){

connectWallet();

}

}

}catch(err){

console.log(err);

}

}
);

</script>

</body>
</html>
