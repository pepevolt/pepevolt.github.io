<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPEVOLT GAME</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>

<style>
body{margin:0;background:#050f1e;color:white;font-family:sans-serif;text-align:center}
button{padding:14px;margin:8px;border-radius:10px;border:none;font-weight:bold}
input{padding:12px;width:80%;border-radius:10px;text-align:center}
.connect{background:linear-gradient(90deg,#00ff99,#00ccff)}
.action{background:linear-gradient(90deg,#ffcc00,#ff6600)}
.danger{background:linear-gradient(90deg,#ff3333,#990000)}
</style>
</head>

<body>

<h2>PEPEVOLT GAME</h2>

<input id="walletDisplay" value="Wallet Not Connected" readonly />
<br>

<button class="connect" id="connectBtn" onclick="connectWallet()">CONNECT WALLET</button>

<br>

<button class="action" onclick="buyEnergy()">BUY ENERGY</button>
<button class="action" onclick="swapPoints()">SWAP POINTS</button>
<button class="danger" onclick="withdraw()">WITHDRAW</button>

<script>

let wallet = "";
let provider, signer;
let wcProvider;
let CONFIG = {};

// load backend config
async function loadConfig(){
  const res = await fetch("/config");
  CONFIG = await res.json();
}
loadConfig();

// CONNECT WALLET (FIXED)
async function connectWallet(){

try{

// META MASK
if(window.ethereum){
await window.ethereum.request({method:"eth_requestAccounts"});
provider = new ethers.providers.Web3Provider(window.ethereum);
}

// WALLETCONNECT
else{
const EthereumProvider = window["@walletconnect/ethereum-provider"].EthereumProvider;

wcProvider = await EthereumProvider.init({
projectId: CONFIG.reown,
chains:[137],
showQrModal:true
});

await wcProvider.enable();

provider = new ethers.providers.Web3Provider(wcProvider);
}

signer = provider.getSigner();
wallet = await signer.getAddress();

document.getElementById("walletDisplay").value =
wallet.slice(0,6)+"..."+wallet.slice(-4);

document.getElementById("connectBtn").innerText = "CONNECTED";

}catch(e){
console.log(e);
alert("Wallet connection failed");
}

}

// CONTRACT HELPERS
function getContract(address){
return new ethers.Contract(address, [
"function balanceOf(address) view returns (uint256)",
"function transfer(address,uint256) returns (bool)"
], signer);
}

// ACTIONS (PLACEHOLDERS FOR NOW)

async function buyEnergy(){
if(!wallet) return alert("Connect wallet");
alert("ENGINE CONTRACT: " + CONFIG.engine);
}

async function swapPoints(){
if(!wallet) return alert("Connect wallet");
alert("TOKEN CONTRACT: " + CONFIG.token);
}

async function withdraw(){
if(!wallet) return alert("Connect wallet");
alert("TREASURY CONTRACT: " + CONFIG.treasury);
}

</script>

</body>
</html>
