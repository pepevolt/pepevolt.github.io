<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PVLT Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f0f0f;
      color: white;
    }

    .box {
      margin-top: 40px;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .tap {
      background: #00ff88;
    }

    .claim {
      background: #ffcc00;
    }

    .wallet {
      background: #0088ff;
    }
  </style>
</head>

<body>

<h2>⚡ PVLT Mini App</h2>

<div class="box">
  <p>Telegram User: <span id="user"></span></p>
  <p>Wallet: <span id="wallet">Not connected</span></p>
  <p>Score: <span id="score">0</span></p>
</div>

<button class="tap" onclick="tap()">TAP</button>
<button class="wallet" onclick="connectWallet()">CONNECT WALLET</button>
<button class="tap" onclick="submitScore()">SUBMIT SCORE</button>
<button class="claim" onclick="claimReward()">CLAIM REWARD</button>

<script>
let score = 0;
let walletAddress = "";

const tg = window.Telegram.WebApp;
tg.expand();

document.getElementById("user").innerText =
  tg.initDataUnsafe?.user?.username || "Guest";

// TAP GAME
function tap() {
  score++;
  document.getElementById("score").innerText = score;
}

// WALLET CONNECT (MetaMask)
async function connectWallet() {
  if (window.ethereum) {
    const accounts = await ethereum.request({ method: "eth_requestAccounts" });
    walletAddress = accounts[0];
    document.getElementById("wallet").innerText = walletAddress;
  } else {
    alert("Install MetaMask");
  }
}

// SUBMIT SCORE TO BACKEND
async function submitScore() {
  if (!walletAddress) return alert("Connect wallet first");

  const res = await fetch("https://YOUR-RENDER-URL.onrender.com/api/submit", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      telegramId: tg.initDataUnsafe.user.id,
      wallet: walletAddress,
      score: score
    })
  });

  const data = await res.json();
  alert("Score submitted: " + JSON.stringify(data));
}

// CLAIM REWARD
async function claimReward() {
  const res = await fetch("https://YOUR-RENDER-URL.onrender.com/api/claim", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      wallet: walletAddress
    })
  });

  const data = await res.json();

  if (data.success) {
    alert("Reward received: " + data.amount + " PVLT");
    score = 0;
    document.getElementById("score").innerText = 0;
  } else {
    alert(data.error || "Error");
  }
}
</script>

</body>
</html>
