<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #00ff66; --bg: #080b10; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .tap-zone { text-align: center; margin: 40px 0; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-main { background: var(--accent); }
    </style>
</head>
<body>

<div class="stats">
    <div>Pts: <span id="pts">0</span></div>
    <div>gPVLT: <span id="gpvlt">0</span></div>
    <div>PVLT: <span id="pvlt">0</span></div>
</div>

<div class="energy-bar">Energy: <span id="energy">50</span>/100000</div>

<div class="tap-zone">
    <button onclick="tap()" style="width:150px; height:150px; border-radius:50%; border:none; background:var(--accent);">TAP</button>
</div>

<button class="btn" onclick="convert()">Convert 500 Pts -> 10gPVLT</button>
<button class="btn" onclick="bridge()">Bridge 100gPVLT -> 1PVLT</button>
<button class="btn btn-main" onclick="claim()">Claim PVLT (Polygon)</button>

<script>
    let state = { pts: 0, gpvlt: 0, pvlt: 0, energy: 50 };

    function tap() {
        if (state.energy <= 0) {
            if(confirm("Buy 10,000 Energy for 500 PVLT?")) buyEnergy();
            return;
        }
        state.pts++; state.energy--;
        updateUI();
    }

    function convert() {
        if (state.pts >= 500) {
            state.pts -= 500; state.gpvlt += 10;
            updateUI();
        } else alert("Need 500 Pts");
    }

    function bridge() {
        if (state.gpvlt >= 100) {
            state.gpvlt -= 100; state.pvlt += 1;
            updateUI();
        }
    }

    async function claim() {
        if (state.pvlt < 1 || state.pvlt > 1000) return alert("Invalid Amount");
        // Integration Point: Call your Polygon Smart Contract here
        alert("Initiating Polygon Transaction...");
        // After blockchain confirmation:
        state.pvlt = 0;
        updateUI();
    }

    async function buyEnergy() {
        if (state.pvlt >= 500) {
            // Integration Point: Execute transaction to smart contract
            // Once verified:
            state.pvlt -= 500;
            state.energy += 10000;
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('pts').textContent = state.pts;
        document.getElementById('gpvlt').textContent = state.gpvlt;
        document.getElementById('pvlt').textContent = state.pvlt;
        document.getElementById('energy').textContent = state.energy;
    }
</script>
</body>
</html>
