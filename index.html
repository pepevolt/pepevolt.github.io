<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no"/>

<title>PepeVolt</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#081120;
    color:white;
}

/* APP */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* TOP NAV */

.top-nav{
    width:100%;
    padding:14px;
    display:flex;
    align-items:center;
    gap:10px;
}

.stats{
    flex:1;
    display:flex;
    gap:8px;
}

.card{
    flex:1;
    background:#111b2e;
    border-radius:16px;
    padding:12px 8px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.05);
}

.label{
    font-size:11px;
    opacity:.7;
    margin-bottom:5px;
}

.value{
    font-size:18px;
    font-weight:bold;
}

#connectBtn{
    border:none;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    padding:14px 16px;
    border-radius:16px;
    font-weight:bold;
    font-size:12px;
    min-width:110px;
    cursor:pointer;
}

/* CENTER */

.center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    padding-bottom:130px;
}

/* TAP BUTTON */

.tap-area{
    width:250px;
    height:250px;
    border-radius:50%;
    background:
    radial-gradient(circle at top,#fde047,#f97316);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:38px;
    font-weight:900;

    cursor:pointer;
    user-select:none;

    box-shadow:
    0 0 25px rgba(249,115,22,.5),
    0 0 70px rgba(249,115,22,.2),
    inset 0 8px 20px rgba(255,255,255,.3);

    transition:transform .08s ease;
}

.tap-area:active{
    transform:scale(.95);
}

.tap-disabled{
    opacity:.5;
    pointer-events:none;
}

/* FLOATING */

.float{
    position:absolute;
    color:#22c55e;
    font-size:28px;
    font-weight:bold;
    pointer-events:none;
    animation:floatUp .8s linear forwards;
}

@keyframes floatUp{

    0%{
        opacity:1;
        transform:translateY(0);
    }

    100%{
        opacity:0;
        transform:translateY(-80px);
    }

}

/* FIXED BOTTOM */

.bottom-fixed{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#0d1728;
    padding:14px;
    border-top:1px solid rgba(255,255,255,.06);

    display:flex;
    flex-direction:column;
    gap:12px;
}

/* ENERGY BAR */

.energy-bar{
    width:100%;
    height:18px;
    background:#1a2940;
    border-radius:50px;
    overflow:hidden;
}

.energy-fill{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#22c55e,#4ade80);
    border-radius:50px;
    transition:.3s;
}

.energy-text{
    margin-top:6px;
    text-align:center;
    font-size:12px;
    opacity:.7;
}

/* BUTTONS */

.action-buttons{
    width:100%;
    display:flex;
    gap:10px;
}

.action-buttons button{
    flex:1;
    height:54px;
    border:none;
    border-radius:16px;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.buy-btn{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.claim-btn{
    background:linear-gradient(135deg,#9333ea,#7e22ce);
}

/* MOBILE */

@media(max-width:480px){

    .tap-area{
        width:220px;
        height:220px;
        font-size:34px;
    }

    .top-nav{
        flex-direction:column;
    }

    .stats{
        width:100%;
    }

    #connectBtn{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- TOP -->

    <div class="top-nav">

        <div class="stats">

            <div class="card">
                <div class="label">ENERGY</div>
                <div class="value">
                    <span id="energy">50</span>
                </div>
            </div>

            <div class="card">
                <div class="label">POINTS</div>
                <div class="value">
                    <span id="points">0</span>
                </div>
            </div>

            <div class="card">
                <div class="label">PVLT</div>
                <div class="value">
                    <span id="pvlt">0</span>
                </div>
            </div>

        </div>

        <button id="connectBtn">
            CONNECT
        </button>

    </div>

    <!-- CENTER -->

    <div class="center">

        <div class="tap-area tap-disabled" id="tapButton">
            TAP
        </div>

    </div>

</div>

<!-- FIXED BOTTOM -->

<div class="bottom-fixed">

    <div>

        <div class="energy-bar">
            <div class="energy-fill" id="energyFill"></div>
        </div>

        <div class="energy-text">
            +1 Energy every 3 seconds
        </div>

    </div>

    <div class="action-buttons">

        <button class="buy-btn" onclick="buyEnergy()">
            Buy 10K Energy
        </button>

        <button class="claim-btn" onclick="claimPvlt()">
            Claim PVLT
        </button>

    </div>

</div>

<script>

let connected = false;

let maxEnergy = 50;
let energy = 50;

let points = 0;
let pvlt = 0;

const tapButton = document.getElementById("tapButton");
const connectBtn = document.getElementById("connectBtn");

/* UPDATE */

function updateUI(){

    document.getElementById("energy").innerText = energy;
    document.getElementById("points").innerText = points;
    document.getElementById("pvlt").innerText = pvlt;

    let percent = (energy/maxEnergy)*100;

    document.getElementById("energyFill").style.width =
    percent + "%";
}

/* CONNECT */

connectBtn.onclick = ()=>{

    connected = true;

    connectBtn.innerText = "CONNECTED";

    tapButton.classList.remove("tap-disabled");
};

/* TAP */

tapButton.addEventListener("click",(e)=>{

    if(!connected) return;

    if(energy <= 0){
        alert("No Energy Left");
        return;
    }

    energy--;
    points++;

    if(points >= 100){

        points -= 100;
        pvlt++;
    }

    updateUI();

    /* FLOAT */

    const plus = document.createElement("div");

    plus.className = "float";
    plus.innerText = "+1";

    plus.style.left = e.clientX + "px";
    plus.style.top = e.clientY + "px";

    document.body.appendChild(plus);

    setTimeout(()=>{
        plus.remove();
    },800);

});

/* REGEN */

setInterval(()=>{

    if(energy < maxEnergy){

        energy++;

        updateUI();
    }

},3000);

/* BUY */

function buyEnergy(){

    if(!connected){
        alert("Connect Wallet First");
        return;
    }

    if(pvlt < 100){
        alert("Need 100 PVLT");
        return;
    }

    pvlt -= 100;

    energy += 10000;
    maxEnergy += 10000;

    updateUI();

    alert("10,000 Energy Added");
}

/* CLAIM */

function claimPvlt(){

    if(!connected){
        alert("Connect Wallet First");
        return;
    }

    if(pvlt < 10){
        alert("Minimum 10 PVLT Required");
        return;
    }

    alert("Claiming " + pvlt + " PVLT");

    pvlt = 0;

    updateUI();
}

updateUI();

</script>

</body>
</html>
