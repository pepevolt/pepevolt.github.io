<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PepeVolt | PVLT Token Game</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  background:radial-gradient(circle at top, #183153 0%, #07111f 75%);
  display:flex;
  flex-direction:column;
  padding:16px;
  position:relative;
}

.top-nav{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.nav-box{
  flex:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:12px;
  text-align:center;
}

.nav-title{
  font-size:11px;
  color:#9fb2d0;
}

.nav-value{
  font-size:20px;
  font-weight:bold;
  color:white;
  font-family:monospace;
}

#connectBtn{
  margin-bottom:14px;
  width:100%;
  border:none;
  border-radius:18px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg, #00b894, #00cec9);
  cursor:pointer;
  transition:transform 0.1s ease;
}
#connectBtn:active{transform:scale(0.98);}

.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.tap-circle{
  position:relative;
  width:min(60vw,230px);
  height:min(60vw,230px);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #00d2a8, #00a884);
  border:8px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 70px rgba(0,255,180,0.25);
  cursor:pointer;
  overflow:hidden;
  transition:transform 0.05s linear;
}
.tap-circle:active{transform:scale(0.96);}
.tap-circle img{
  width:80%;
  object-fit:contain;
  pointer-events:none;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:12px;
}

.action-btn{
  padding:16px;
  border:none;
  border-radius:20px;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  transition:transform 0.1s ease;
}
.action-btn:active{transform:scale(0.97);}

.buy{
  background:linear-gradient(135deg, #00b894, #00cec9);
}
.claim{
  background:linear-gradient(135deg, #f59e0b, #ea580c);
}

.float{
  position:fixed;
  color:#00ffcc;
  font-weight:bold;
  text-shadow:0 0 5px black;
  pointer-events:none;
  animation:floatUp 0.8s ease-out forwards;
  z-index:9999;
  font-size:1.2rem;
}

@keyframes floatUp{
  0%{ opacity:1; transform:translateY(0px);}
  100%{ opacity:0; transform:translateY(-60px);}
}

.wallet-status{
  text-align:center;
  font-size:11px;
  margin-top:10px;
  color:#7e8cac;
  background:rgba(0,0,0,0.3);
  border-radius:16px;
  padding:8px;
}

.balance-row{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
  gap:12px;
}

.balance-item{
  flex:1;
  text-align:center;
  font-size:11px;
}

.balance-label{
  opacity:0.7;
}

.balance-amount{
  font-weight:bold;
  color:#00ffcc;
  font-size:13px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>

<body>

<div class="app">

  <div class="top-nav">
    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">50</div>
    </div>
    <div class="nav-box">
      <div class="nav-title">💎 Points</div>
      <div class="nav-value" id="points">0</div>
    </div>
    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>
  </div>

  <button id="connectBtn">🔗 Connect Wallet (Polygon)</button>
  
  <div class="wallet-status" id="walletStatus">
    <div>⚡ Tap to earn PVLT! Connect wallet to claim.</div>
  </div>

  <div class="center">
    <div class="tap-circle" id="tapBtn">
      <img src="https://i.imgur.com/8Km9tLL.png" alt="pepe">
    </div>
  </div>

  <div class="actions">
    <button class="action-btn buy" id="buyEnergyBtn">⚡ Buy 10,000 Energy (100 PVLT)</button>
    <button class="action-btn claim" id="claimPvltBtn">💎 Claim PVLT → Wallet</button>
  </div>

</div>

<script>
  // ========== YOUR CONTRACT ADDRESSES ==========
  const PVLT_TOKEN_ADDRESS = "0x5f7df6862f439b691507dc20069f4f73a37cb08b";
  const TREASURY_VOLT = "0x4251Ef24D10bf637494C173621F5f84262e9Bda5";
  
  // ERC20 ABI
  const PVLT_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address to, uint256 amount) returns (bool)",
    "function decimals() view returns (uint8)",
    "function symbol() view returns (string)"
  ];
  
  // ========== DOM ELEMENTS ==========
  const connectBtn = document.getElementById('connectBtn');
  const walletStatusDiv = document.getElementById('walletStatus');
  const energySpan = document.getElementById('energy');
  const pointsSpan = document.getElementById('points');
  const pvltSpan = document.getElementById('pvlt');
  const tapCircle = document.getElementById('tapBtn');
  const buyEnergyBtn = document.getElementById('buyEnergyBtn');
  const claimPvltBtn = document.getElementById('claimPvltBtn');

  // ========== GAME STATE ==========
  let energy = 50;
  let points = 0;
  let inGamePvlt = 0;
  let realWalletPvltBalance = 0;
  let tokenDecimals = 18;
  
  // ========== WALLET STATE ==========
  let userAccount = null;
  let provider = null;
  let signer = null;
  let tokenContract = null;

  // ========== HELPER FUNCTIONS ==========
  function showFloating(x, y, text, color = '#00ffcc') {
    const el = document.createElement('div');
    el.className = 'float';
    el.innerText = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  function saveGame() {
    const data = { energy, points, inGamePvlt };
    localStorage.setItem('pepevolt_data', JSON.stringify(data));
  }

  function loadGame() {
    const saved = localStorage.getItem('pepevolt_data');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        energy = data.energy ?? 50;
        points = data.points ?? 0;
        inGamePvlt = data.inGamePvlt ?? 0;
      } catch(e) {}
    }
    if (energy < 0) energy = 0;
    if (energy > 10000) energy = 10000;
  }

  // ========== FETCH REAL WALLET BALANCE ==========
  async function fetchRealWalletBalance() {
    if (!userAccount || !tokenContract) {
      realWalletPvltBalance = 0;
      return 0;
    }
    try {
      const balance = await tokenContract.balanceOf(userAccount);
      realWalletPvltBalance = parseFloat(ethers.utils.formatUnits(balance, tokenDecimals));
      console.log(`💰 Real wallet PVLT: ${realWalletPvltBalance}`);
      return realWalletPvltBalance;
    } catch(e) {
      console.warn("Balance fetch error:", e);
      realWalletPvltBalance = 0;
      return 0;
    }
  }

  // ========== FETCH TOKEN INFO ==========
  async function fetchTokenInfo() {
    if (!tokenContract) return;
    try {
      const decimals = await tokenContract.decimals();
      tokenDecimals = decimals;
      const symbol = await tokenContract.symbol();
      console.log(`✅ PVLT Token: ${symbol} (${tokenDecimals} decimals)`);
    } catch(e) {
      console.warn("Token info error:", e);
    }
  }

  // ========== UPDATE UI ==========
  async function updateUI() {
    energySpan.innerText = Math.floor(energy);
    pointsSpan.innerText = Math.floor(points);
    pvltSpan.innerText = Math.floor(inGamePvlt);

    if (userAccount && tokenContract) {
      await fetchRealWalletBalance();
    }

    // Update button states
    if (buyEnergyBtn) {
      buyEnergyBtn.disabled = !userAccount;
      buyEnergyBtn.style.opacity = userAccount ? '1' : '0.5';
      buyEnergyBtn.style.cursor = userAccount ? 'pointer' : 'not-allowed';
    }
    if (claimPvltBtn) {
      const canClaim = userAccount && inGamePvlt >= 1;
      claimPvltBtn.disabled = !canClaim;
      claimPvltBtn.style.opacity = canClaim ? '1' : '0.5';
      claimPvltBtn.style.cursor = canClaim ? 'pointer' : 'not-allowed';
    }

    if (userAccount) {
      walletStatusDiv.innerHTML = `
        <div>✅ Connected: ${userAccount.slice(0,6)}...${userAccount.slice(-4)}</div>
        <div class="balance-row">
          <div class="balance-item">
            <div class="balance-label">🎮 In-Game PVLT</div>
            <div class="balance-amount">${Math.floor(inGamePvlt)}</div>
          </div>
          <div class="balance-item">
            <div class="balance-label">💎 Wallet PVLT</div>
            <div class="balance-amount">${realWalletPvltBalance.toFixed(4)}</div>
          </div>
          <div class="balance-item">
            <div class="balance-label">⚡ Energy</div>
            <div class="balance-amount">${Math.floor(energy)}/10000</div>
          </div>
        </div>
        <div style="font-size:9px; margin-top:4px;">🏦 Treasury: ${TREASURY_VOLT.slice(0,6)}...${TREASURY_VOLT.slice(-4)}</div>
      `;
    } else {
      walletStatusDiv.innerHTML = `
        <div>⚡ Free mode: ${Math.floor(energy)}/10000 Energy</div>
        <div class="balance-row">
          <div class="balance-item">
            <div class="balance-label">🎮 In-Game PVLT</div>
            <div class="balance-amount">${Math.floor(inGamePvlt)}</div>
          </div>
          <div class="balance-item">
            <div class="balance-label">💎 Wallet PVLT</div>
            <div class="balance-amount">Not connected</div>
          </div>
          <div class="balance-item">
            <div class="balance-label">⚡ Energy</div>
            <div class="balance-amount">${Math.floor(energy)}/10000</div>
          </div>
        </div>
        <div style="font-size:10px; margin-top:4px;">🔗 Click "Connect Wallet" to start earning!</div>
      `;
    }
    
    saveGame();
  }

  // ========== TAP LOGIC ==========
  function handleTap(clientX, clientY) {
    if (energy <= 0) {
      showFloating(clientX, clientY, '❌ No Energy', '#ff8888');
      return;
    }

    energy -= 1;
    points += 1;
    if (energy < 0) energy = 0;

    if (points >= 100) {
      const convertCount = Math.floor(points / 100);
      inGamePvlt += convertCount;
      points = points % 100;
      showFloating(clientX, clientY - 20, `✨ +${convertCount} PVLT ✨`, '#ffd966');
    }

    updateUI();
    showFloating(clientX, clientY, '+1⭐ -1⚡', '#7bed9f');
    if (navigator.vibrate) navigator.vibrate(20);
  }

  // ========== BUY ENERGY ==========
  async function buyEnergy() {
    if (!userAccount) {
      alert('🔗 Please connect wallet first');
      return;
    }
    if (!tokenContract) {
      alert('⚠️ Token contract not initialized. Please reconnect wallet.');
      return;
    }
    
    await fetchRealWalletBalance();
    if (realWalletPvltBalance < 100) {
      alert(`❌ Need 100 PVLT in your wallet to buy 10,000 Energy.\nYour wallet has: ${realWalletPvltBalance.toFixed(4)} PVLT`);
      return;
    }

    const amountInWei = ethers.utils.parseUnits("100", tokenDecimals);

    try {
      showFloating(window.innerWidth/2, window.innerHeight/2, '⏳ Processing purchase...', '#ffaa44');
      const tx = await tokenContract.transfer(TREASURY_VOLT, amountInWei);
      alert(`⏳ Buy Energy submitted!\nHash: ${tx.hash}\nWaiting...`);
      await tx.wait(1);
      await fetchRealWalletBalance();
      energy = Math.min(energy + 10000, 10000);
      updateUI();
      alert(`✅ Successfully purchased 10,000 Energy!`);
      showFloating(window.innerWidth / 2, window.innerHeight - 120, `+10,000 ⚡ ENERGY`, '#60a5fa');
    } catch (err) {
      console.error(err);
      alert(`Purchase failed: ${err.message || 'Transaction rejected'}`);
    }
  }

  // ========== CLAIM PVLT ==========
  async function claimToWallet() {
    if (!userAccount) {
      alert('🔗 Connect your wallet first to claim PVLT');
      return;
    }
    if (inGamePvlt < 1) {
      alert(`No PVLT to claim. Keep tapping! (100 points = 1 PVLT)`);
      return;
    }
    if (!tokenContract) {
      alert('⚠️ Token contract not configured.');
      return;
    }

    const amountToClaim = Math.floor(inGamePvlt);
    const amountInWei = ethers.utils.parseUnits(amountToClaim.toString(), tokenDecimals);

    try {
      showFloating(window.innerWidth/2, window.innerHeight/2, '⏳ Claiming PVLT...', '#c084fc');
      const tx = await tokenContract.transfer(userAccount, amountInWei);
      alert(`⏳ Claim submitted!\nHash: ${tx.hash}\nWaiting...`);
      await tx.wait(1);
      inGamePvlt -= amountToClaim;
      await fetchRealWalletBalance();
      updateUI();
      alert(`✅ Successfully claimed ${amountToClaim} PVLT to your wallet!\nTransaction: ${tx.hash}`);
      showFloating(window.innerWidth / 2, 150, `+${amountToClaim} PVLT claimed!`, '#c084fc');
    } catch (err) {
      console.error(err);
      alert(`Claim failed: ${err.message || 'Transaction rejected'}`);
    }
  }

  // ========== ENERGY REGENERATION ==========
  setInterval(() => {
    if (energy < 10000) {
      energy = Math.min(energy + 1, 10000);
      updateUI();
    }
  }, 15000);

  // ========== CHECK IF WALLET ALREADY CONNECTED ==========
  async function checkExistingConnection() {
    if (window.ethereum && window.ethereum.selectedAddress) {
      try {
        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
        if (accounts && accounts.length > 0) {
          userAccount = accounts[0];
          provider = new ethers.providers.Web3Provider(window.ethereum);
          signer = provider.getSigner();
          tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
          await fetchTokenInfo();
          await fetchRealWalletBalance();
          connectBtn.innerText = `✅ ${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
          await updateUI();
          console.log(`✅ Auto-connected to: ${userAccount}`);
        }
      } catch(e) {
        console.warn("Auto-connect failed:", e);
      }
    }
  }

  // ========== CONNECT WALLET (MetaMask/Web3) ==========
  async function connectWallet() {
    if (!window.ethereum) {
      alert('❌ Please install MetaMask or a Web3 wallet!\n\nYou can download MetaMask from: https://metamask.io/download/');
      window.open('https://metamask.io/download/', '_blank');
      return;
    }

    try {
      // Request account access
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      userAccount = accounts[0];
      
      // Setup provider
      provider = new ethers.providers.Web3Provider(window.ethereum);
      signer = provider.getSigner();
      
      // Check network - should be Polygon Mainnet (chainId 137)
      const network = await provider.getNetwork();
      if (network.chainId !== 137) {
        alert('⚠️ Please switch to Polygon Mainnet in your wallet!');
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: '0x89' }], // Polygon Mainnet
          });
        } catch(e) {
          console.warn('Network switch failed', e);
        }
      }
      
      // Initialize token contract
      tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      await fetchTokenInfo();
      await fetchRealWalletBalance();
      
      connectBtn.innerText = `✅ ${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
      await updateUI();
      
      console.log(`✅ Connected to: ${userAccount}`);
      console.log(`✅ Real PVLT Balance: ${realWalletPvltBalance}`);
      
      // Listen for account changes
      window.ethereum.on('accountsChanged', async (accounts) => {
        console.log("Accounts changed:", accounts);
        if (accounts.length === 0) {
          userAccount = null;
          tokenContract = null;
          realWalletPvltBalance = 0;
          connectBtn.innerText = "🔗 Connect Wallet (Polygon)";
          await updateUI();
        } else {
          userAccount = accounts[0];
          tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
          connectBtn.innerText = `✅ ${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
          await fetchRealWalletBalance();
          await updateUI();
        }
      });
      
      // Listen for chain changes
      window.ethereum.on('chainChanged', () => {
        window.location.reload();
      });
      
    } catch (err) {
      console.error(err);
      alert(`Connection failed: ${err.message}`);
      userAccount = null;
      connectBtn.innerText = "🔗 Connect Wallet (Polygon)";
      updateUI();
    }
  }

  // ========== EVENT LISTENERS ==========
  tapCircle.addEventListener('click', (e) => {
    let clientX = e.clientX, clientY = e.clientY;
    if (!clientX || !clientY) {
      const rect = tapCircle.getBoundingClientRect();
      clientX = rect.left + rect.width / 2;
      clientY = rect.top + rect.height / 2;
    }
    handleTap(clientX, clientY);
  });

  tapCircle.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    if (touch) handleTap(touch.clientX, touch.clientY);
  }, { passive: false });

  buyEnergyBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await buyEnergy();
  });

  claimPvltBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await claimToWallet();
  });

  connectBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    connectWallet();
  });

  // ========== INIT ==========
  loadGame();
  updateUI();
  checkExistingConnection();
  
  console.log("✅ PepeVolt is ready!");
  console.log(`📋 PVLT Token: ${PVLT_TOKEN_ADDRESS}`);
  console.log(`🏦 TreasuryVolt: ${TREASURY_VOLT}`);
</script>
</body>
</html>
