<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PepeVolt | PVLT Token on Polygon</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:#07111f;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  background:radial-gradient(circle at top, #183153 0%, #07111f 75%);
  display:flex;
  flex-direction:column;
  padding:16px;
  position:relative;
}

.top-nav{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.nav-box{
  flex:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:12px;
  text-align:center;
}

.nav-title{
  font-size:11px;
  color:#9fb2d0;
}

.nav-value{
  font-size:20px;
  font-weight:bold;
  color:white;
  font-family:monospace;
}

#connectBtn{
  margin-bottom:14px;
  width:100%;
  border:none;
  border-radius:18px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg, #00b894, #00cec9);
  cursor:pointer;
  transition:transform 0.1s ease;
}
#connectBtn:active{transform:scale(0.98);}

.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.tap-circle{
  position:relative;
  width:min(60vw,230px);
  height:min(60vw,230px);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #00d2a8, #00a884);
  border:8px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 70px rgba(0,255,180,0.25);
  cursor:pointer;
  overflow:hidden;
  transition:transform 0.05s linear;
}
.tap-circle:active{transform:scale(0.96);}
.tap-circle img{
  width:80%;
  object-fit:contain;
  pointer-events:none;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:12px;
}

.action-btn{
  padding:16px;
  border:none;
  border-radius:20px;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  transition:transform 0.1s ease;
}
.action-btn:active{transform:scale(0.97);}

.buy{
  background:linear-gradient(135deg, #00b894, #00cec9);
}
.claim{
  background:linear-gradient(135deg, #f59e0b, #ea580c);
}

.float{
  position:fixed;
  color:#00ffcc;
  font-weight:bold;
  text-shadow:0 0 5px black;
  pointer-events:none;
  animation:floatUp 0.8s ease-out forwards;
  z-index:9999;
  font-size:1.2rem;
}

@keyframes floatUp{
  0%{ opacity:1; transform:translateY(0px);}
  100%{ opacity:0; transform:translateY(-60px);}
}

.wallet-status{
  text-align:center;
  font-size:11px;
  margin-top:10px;
  color:#7e8cac;
  background:rgba(0,0,0,0.3);
  border-radius:16px;
  padding:8px;
}

.balance-row{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
  gap:12px;
}

.balance-item{
  flex:1;
  text-align:center;
  font-size:11px;
}

.balance-label{
  opacity:0.7;
}

.balance-amount{
  font-weight:bold;
  color:#00ffcc;
  font-size:13px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script type="importmap">
  {
    "imports": {
      "@walletconnect/ethereum-provider": "https://esm.sh/@walletconnect/ethereum-provider@2.11.0"
    }
  }
</script>
</head>

<body>

<div class="app">

  <div class="top-nav">
    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">50</div>
    </div>
    <div class="nav-box">
      <div class="nav-title">💎 Points</div>
      <div class="nav-value" id="points">0</div>
    </div>
    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>
  </div>

  <button id="connectBtn">🔗 Connect Wallet (Polygon)</button>
  
  <div class="wallet-status" id="walletStatus">
    <div>⚡ Free mode: 50 Energy</div>
  </div>

  <div class="center">
    <div class="tap-circle" id="tapBtn">
      <img src="https://i.imgur.com/8Km9tLL.png" alt="pepe">
    </div>
  </div>

  <div class="actions">
    <button class="action-btn buy" id="buyEnergyBtn">⚡ Buy 10,000 Energy (100 PVLT)</button>
    <button class="action-btn claim" id="claimPvltBtn">💎 Claim PVLT → Wallet</button>
  </div>

</div>

<script type="module">
  import { EthereumProvider } from "@walletconnect/ethereum-provider";

  // ========== YOUR PVLT TOKEN CONFIGURATION ==========
  // Your PVLT token address on Polygon
  const PVLT_TOKEN_ADDRESS = "0x5f7df6862f439b691507dc20069f4f73a37cb08b";
  
  // Your wallet address (for verification)
  const YOUR_WALLET = "0x4251Ef24D10bf637494C173621F5f84262e9Bda5";
  
  // Game wallet where PVLT is sent when buying energy (burn address for now)
  const GAME_WALLET = "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";
  
  const PVLT_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address to, uint256 amount) returns (bool)",
    "function decimals() view returns (uint8)",
    "function symbol() view returns (string)"
  ];
  
  let tokenContract = null;

  // ========== GAME STATE ==========
  let energy = 50;
  let points = 0;
  let inGamePvlt = 0;
  let userAccount = null;
  let provider = null;
  let signer = null;
  let realWalletPvltBalance = 0;
  let tokenDecimals = 18;

  // ========== FETCH TOKEN INFO & REAL WALLET PVLT BALANCE ==========
  async function fetchTokenInfo() {
    if (!tokenContract) return;
    try {
      const decimals = await tokenContract.decimals();
      tokenDecimals = decimals;
      const symbol = await tokenContract.symbol();
      console.log(`✅ PVLT Token: ${symbol} (${tokenDecimals} decimals)`);
    } catch(e) {
      console.warn("Token info fetch error:", e);
    }
  }
  
  async function fetchRealWalletBalance() {
    if (!userAccount) return 0;
    if (!tokenContract) return 0;
    try {
      const balance = await tokenContract.balanceOf(userAccount);
      realWalletPvltBalance = parseFloat(ethers.utils.formatUnits(balance, tokenDecimals));
      return realWalletPvltBalance;
    } catch(e) {
      console.warn("Balance fetch error:", e);
      return 0;
    }
  }

  // ========== UPDATE UI ==========
  async function updateUI() {
    energySpan.innerText = Math.floor(energy);
    pointsSpan.innerText = Math.floor(points);
    pvltSpan.innerText = Math.floor(inGamePvlt);

    if (userAccount && tokenContract) {
      await fetchRealWalletBalance();
    }

    // Update button states
    if (buyEnergyBtn) {
      const hasEnoughRealPvlt = realWalletPvltBalance >= 100;
      if (userAccount && hasEnoughRealPvlt) buyEnergyBtn.style.opacity = '1';
      else buyEnergyBtn.style.opacity = '0.6';
    }
    
    if (claimPvltBtn) {
      if (userAccount && inGamePvlt >= 1) claimPvltBtn.style.opacity = '1';
      else claimPvltBtn.style.opacity = '0.5';
    }

    // Update wallet status display
    if (userAccount) {
      walletStatusDiv.innerHTML = `
        <div>✅ Connected: ${userAccount.slice(0,6)}...${userAccount.slice(-4)}</div>
        <div class="balance-row">
          <div class="balance-item">
            <div class="balance-label">🎮 In-Game PVLT</div>
            <div class="balance-amount">${Math.floor(inGamePvlt)}</div>
          </div>
          <div class="balance-item">
            <div class="balance-label">💎 Real Wallet PVLT</div>
            <div class="balance-amount">${realWalletPvltBalance.toFixed(2)}</div>
          </div>
          <div class="balance-item">
            <div class="balance-label">⚡ Energy</div>
            <div class="balance-amount">${Math.floor(energy)}/10000</div>
          </div>
        </div>
      `;
    } else {
      walletStatusDiv.innerHTML = `⚡ Free mode: ${Math.floor(energy)}/10000 Energy (connect wallet to earn & claim PVLT)`;
    }
    
    saveGame();
  }

  // ========== DOM ELEMENTS ==========
  const connectBtn = document.getElementById('connectBtn');
  const walletStatusDiv = document.getElementById('walletStatus');
  const energySpan = document.getElementById('energy');
  const pointsSpan = document.getElementById('points');
  const pvltSpan = document.getElementById('pvlt');
  const tapCircle = document.getElementById('tapBtn');
  const buyEnergyBtn = document.getElementById('buyEnergyBtn');
  const claimPvltBtn = document.getElementById('claimPvltBtn');

  function saveGame() {
    const data = { energy, points, inGamePvlt };
    localStorage.setItem('pepevolt_data', JSON.stringify(data));
  }

  function loadGame() {
    const saved = localStorage.getItem('pepevolt_data');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        energy = data.energy ?? 50;
        points = data.points ?? 0;
        inGamePvlt = data.inGamePvlt ?? 0;
      } catch(e) {}
    }
    if (energy < 0) energy = 0;
    if (energy > 10000) energy = 10000;
    updateUI();
  }

  function showFloating(x, y, text, color = '#00ffcc') {
    const el = document.createElement('div');
    el.className = 'float';
    el.innerText = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  // ========== TAP LOGIC ==========
  function handleTap(clientX, clientY) {
    if (energy <= 0) {
      showFloating(clientX, clientY, '❌ No Energy', '#ff8888');
      return;
    }

    energy -= 1;
    points += 1;
    if (energy < 0) energy = 0;

    if (points >= 100) {
      const convertCount = Math.floor(points / 100);
      inGamePvlt += convertCount;
      points = points % 100;
      showFloating(clientX, clientY - 20, `✨ +${convertCount} PVLT ✨`, '#ffd966');
    }

    updateUI();
    showFloating(clientX, clientY, '+1⭐ -1⚡', '#7bed9f');
    if (navigator.vibrate) navigator.vibrate(20);
  }

  // ========== BUY ENERGY: Spend 100 REAL PVLT from wallet ==========
  async function buyEnergy() {
    if (!userAccount) {
      alert('🔗 Please connect wallet first');
      return;
    }
    if (!tokenContract) {
      alert('⚠️ Token contract not initialized. Please reconnect wallet.');
      return;
    }
    
    await fetchRealWalletBalance();
    if (realWalletPvltBalance < 100) {
      alert(`❌ Need 100 PVLT in your wallet to buy 10,000 Energy.\nYour wallet has: ${realWalletPvltBalance.toFixed(2)} PVLT`);
      return;
    }

    const amountInWei = ethers.utils.parseUnits("100", tokenDecimals);

    try {
      showFloating(window.innerWidth/2, window.innerHeight/2, '⏳ Processing purchase...', '#ffaa44');
      const tx = await tokenContract.transfer(GAME_WALLET, amountInWei);
      alert(`⏳ Buy Energy transaction submitted!\nHash: ${tx.hash}\nWaiting for confirmation...`);
      await tx.wait(1);
      await fetchRealWalletBalance();
      energy = Math.min(energy + 10000, 10000);
      updateUI();
      alert(`✅ Successfully purchased 10,000 Energy!`);
      showFloating(window.innerWidth / 2, window.innerHeight - 120, `+10,000 ⚡ ENERGY`, '#60a5fa');
    } catch (err) {
      console.error(err);
      alert(`Purchase failed: ${err.message || 'Transaction rejected'}`);
    }
  }

  // ========== CLAIM PVLT: Transfer in-game PVLT to real wallet ==========
  async function claimToWallet() {
    if (!userAccount) {
      alert('🔗 Connect your wallet first to claim PVLT');
      return;
    }
    if (inGamePvlt < 1) {
      alert(`No PVLT to claim. Keep tapping! (100 points = 1 PVLT)`);
      return;
    }
    if (!tokenContract) {
      alert('⚠️ Token contract not configured.');
      return;
    }

    const amountToClaim = Math.floor(inGamePvlt);
    const amountInWei = ethers.utils.parseUnits(amountToClaim.toString(), tokenDecimals);

    try {
      showFloating(window.innerWidth/2, window.innerHeight/2, '⏳ Claiming PVLT to wallet...', '#c084fc');
      const tx = await tokenContract.transfer(userAccount, amountInWei);
      alert(`⏳ Claim transaction submitted!\nHash: ${tx.hash}\nWaiting for confirmation...`);
      await tx.wait(1);
      inGamePvlt -= amountToClaim;
      await fetchRealWalletBalance();
      updateUI();
      alert(`✅ Successfully claimed ${amountToClaim} PVLT to your wallet!\nTransaction: ${tx.hash}`);
      showFloating(window.innerWidth / 2, 150, `+${amountToClaim} PVLT claimed!`, '#c084fc');
    } catch (err) {
      console.error(err);
      alert(`Claim failed: ${err.message || 'Transaction rejected'}`);
    }
  }

  // ========== ENERGY REGENERATION ==========
  setInterval(() => {
    if (energy < 10000) {
      energy = Math.min(energy + 1, 10000);
      updateUI();
    }
  }, 15000);

  // ========== WALLET CONNECTION ==========
  async function connectWallet() {
    try {
      const wcProvider = await EthereumProvider.init({
        projectId: "1731f99148b9cf6107dee70b6efb14b7",
        chains: [137],
        showQrModal: true,
        methods: ["eth_sendTransaction", "personal_sign", "eth_signTypedData"],
        rpcMap: { 137: "https://polygon-rpc.com" },
        metadata: {
          name: "PepeVolt",
          description: "Tap to Earn PVLT on Polygon",
          url: window.location.origin,
          icons: ["https://cdn-icons-png.flaticon.com/512/825/825508.png"]
        }
      });

      await wcProvider.connect();
      const accounts = await wcProvider.request({ method: "eth_accounts" });
      userAccount = accounts[0];
      
      provider = wcProvider;
      signer = new ethers.providers.Web3Provider(wcProvider).getSigner();
      
      // Initialize your PVLT token contract
      tokenContract = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      await fetchTokenInfo();
      await fetchRealWalletBalance();
      
      connectBtn.innerText = `✅ ${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
      updateUI();
      
      console.log(`✅ Connected to: ${userAccount}`);
      console.log(`✅ PVLT Token: ${PVLT_TOKEN_ADDRESS}`);
      
      wcProvider.on("accountsChanged", async (accs) => {
        if (accs.length === 0) {
          userAccount = null;
          realWalletPvltBalance = 0;
          connectBtn.innerText = "🔗 Connect Wallet (Polygon)";
          updateUI();
        } else {
          userAccount = accs[0];
          connectBtn.innerText = `✅ ${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
          if (tokenContract) await fetchRealWalletBalance();
          updateUI();
        }
      });
      
    } catch (err) {
      console.error(err);
      alert("Wallet connection failed. Please try again.");
    }
  }

  // ========== EVENT LISTENERS ==========
  tapCircle.addEventListener('click', (e) => {
    let clientX = e.clientX, clientY = e.clientY;
    if (!clientX || !clientY) {
      const rect = tapCircle.getBoundingClientRect();
      clientX = rect.left + rect.width / 2;
      clientY = rect.top + rect.height / 2;
    }
    handleTap(clientX, clientY);
  });

  tapCircle.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    if (touch) handleTap(touch.clientX, touch.clientY);
  }, { passive: false });

  buyEnergyBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await buyEnergy();
  });

  claimPvltBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await claimToWallet();
  });

  connectBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    connectWallet();
  });

  // ========== INIT ==========
  loadGame();
  
  console.log("✅ PepeVolt is ready!");
  console.log(`📋 PVLT Token Address: ${PVLT_TOKEN_ADDRESS}`);
  console.log(`👛 Your Wallet: ${YOUR_WALLET}`);
</script>
</body>
</html>
