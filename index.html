<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  viewport-fit=cover,
/>

<title>PepeVolt | PVLT Token Game</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#07111f;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:#9fb2d0;

  --green1:#00d2a8;
  --green2:#00a884;

  --orange1:#f59e0b;
  --orange2:#ea580c;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:#07111f;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:white;
}

body{
  display:flex;
  justify-content:center;

  background:
    radial-gradient(circle at top,
    #183153 0%,
    #07111f 75%);
}

.app{
  width:100%;
  max-width:430px;
  min-height:100dvh;

  padding:
    max(16px, env(safe-area-inset-top))
    16px
    max(22px, env(safe-area-inset-bottom))
    16px;

  display:flex;
  flex-direction:column;
  gap:14px;

  position:relative;
  overflow:hidden;
}

/* =========================
   TOP NAV
========================= */

.top-nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.nav-box{
  background:var(--card);
  border:1px solid var(--border);

  border-radius:18px;

  padding:14px 10px;

  text-align:center;

  backdrop-filter:blur(12px);
}

.nav-title{
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
}

.nav-value{
  font-size:20px;
  font-weight:800;
  font-family:monospace;
  color:white;
}

/* =========================
   CONNECT
========================= */

#connectBtn{
  width:100%;

  border:none;
  border-radius:18px;

  padding:15px;

  font-size:15px;
  font-weight:700;

  color:white;

  background:
    linear-gradient(
      135deg,
      #00b894,
      #00cec9
    );

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .2s ease;
}

#connectBtn:active{
  transform:scale(.98);
}

#connectBtn.loading{
  opacity:.7;
  pointer-events:none;
}

/* =========================
   STATUS
========================= */

.wallet-status{
  background:rgba(0,0,0,0.28);

  border:1px solid rgba(255,255,255,0.05);

  border-radius:18px;

  padding:12px;

  font-size:12px;

  color:#c3d1eb;

  backdrop-filter:blur(10px);
}

.status-top{
  text-align:center;
  margin-bottom:10px;
}

.balance-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.balance-item{
  background:rgba(255,255,255,0.04);
  border-radius:14px;
  padding:10px 8px;
  text-align:center;
}

.balance-label{
  font-size:10px;
  opacity:.7;
  margin-bottom:5px;
}

.balance-amount{
  font-size:13px;
  font-weight:700;
  color:#00ffcc;
}

/* =========================
   CENTER
========================= */

.center{
  flex:1;

  display:flex;
  justify-content:center;
  align-items:center;

  min-height:280px;
}

.tap-circle{
  width:min(68vw,250px);
  height:min(68vw,250px);

  border-radius:50%;

  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

  cursor:pointer;

  background:
    radial-gradient(
      circle at 30% 30%,
      var(--green1),
      var(--green2)
    );

  border:10px solid rgba(255,255,255,.08);

  box-shadow:
    0 0 70px rgba(0,255,180,.22),
    inset 0 0 35px rgba(255,255,255,.08);

  transition:
    transform .12s cubic-bezier(.2,.8,.2,1),
    box-shadow .2s ease;
}

.tap-circle.tap{
  transform:scale(.95);
}

.tap-circle img{
  width:82%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
}

.tap-circle::after{
  content:'';

  position:absolute;
  inset:0;

  border-radius:50%;

  background:
    radial-gradient(
      circle at top left,
      rgba(255,255,255,.25),
      transparent 45%
    );
}

/* =========================
   ACTIONS
========================= */

.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.action-btn{
  width:100%;

  padding:16px;

  border:none;
  border-radius:20px;

  color:white;

  font-size:15px;
  font-weight:700;

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .2s ease;
}

.action-btn:active{
  transform:scale(.98);
}

.action-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.buy{
  background:
    linear-gradient(
      135deg,
      #00b894,
      #00cec9
    );
}

.claim{
  background:
    linear-gradient(
      135deg,
      #f59e0b,
      #ea580c
    );
}

/* =========================
   FLOATING TEXT
========================= */

.float{
  position:absolute;

  transform:translate(-50%,-50%);

  font-size:1.1rem;
  font-weight:800;

  pointer-events:none;

  z-index:9999;

  text-shadow:0 2px 10px rgba(0,0,0,.45);

  animation:floatUp .8s ease-out forwards;
}

@keyframes floatUp{

  0%{
    opacity:1;
    transform:
      translate(-50%,0);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-60px);
  }
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  font-size:11px;
  color:#7e8cac;
  margin-top:4px;
}

/* =========================
   MOBILE
========================= */

@media (max-height:700px){

  .center{
    min-height:220px;
  }

  .tap-circle{
    width:210px;
    height:210px;
  }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script type="importmap">
{
  "imports": {
    "@walletconnect/ethereum-provider":
    "https://esm.sh/@walletconnect/ethereum-provider@2.11.0"
  }
}
</script>

</head>

<body>

<div class="app" id="app">

  <!-- TOP NAV -->
  <div class="top-nav">

    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">100</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">💎 Points</div>
      <div class="nav-value" id="points">0</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>

  </div>

  <!-- CONNECT -->
  <button id="connectBtn">
    🔗 Connect Wallet (Polygon)
  </button>

  <!-- STATUS -->
  <div class="wallet-status" id="walletStatus">

    <div class="status-top">
      ⚡ Tap to earn PVLT!
    </div>

    <div class="balance-row">

      <div class="balance-item">
        <div class="balance-label">⚡ ENERGY</div>
        <div class="balance-amount" id="energyMini">
          100/100
        </div>
      </div>

      <div class="balance-item">
        <div class="balance-label">💎 POINTS</div>
        <div class="balance-amount" id="pointsMini">
          0
        </div>
      </div>

      <div class="balance-item">
        <div class="balance-label">🪙 PVLT</div>
        <div class="balance-amount" id="pvltMini">
          0
        </div>
      </div>

    </div>

  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="tap-circle" id="tapBtn">

      <img
        src="https://i.imgur.com/8Km9tLL.png"
        alt="PepeVolt"
        draggable="false"
      />

    </div>

  </div>

  <!-- ACTIONS -->
  <div class="actions">

    <button
      class="action-btn buy"
      id="buyEnergyBtn"
    >
      ⚡ Buy 100 Energy
    </button>

    <button
      class="action-btn claim"
      id="claimPvltBtn"
    >
      💎 Convert Points → PVLT
    </button>

  </div>

  <div class="footer">
    PepeVolt • Polygon • PVLT
  </div>

</div>

<script type="module">

import {
  EthereumProvider
} from "@walletconnect/ethereum-provider";

/* =========================
   CONTRACTS
========================= */

const PVLT_TOKEN_ADDRESS =
  "0x5f7df6862f439b691507dc20069f4f73a37cb08b";

const TREASURY_VOLT =
  "0x4251Ef24D10bf637494C173621F5f84262e9Bda5";

const PEPEVOLT_GAME =
  "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

/* =========================
   ABI
========================= */

const PVLT_ABI = [

  "function balanceOf(address owner) view returns (uint256)",

  "function transfer(address to,uint256 amount) returns (bool)",

  "function decimals() view returns (uint8)",

  "function symbol() view returns (string)"

];

/* =========================
   DOM
========================= */

const app =
  document.getElementById('app');

const connectBtn =
  document.getElementById('connectBtn');

const walletStatus =
  document.getElementById('walletStatus');

const energyEl =
  document.getElementById('energy');

const pointsEl =
  document.getElementById('points');

const pvltEl =
  document.getElementById('pvlt');

const energyMini =
  document.getElementById('energyMini');

const pointsMini =
  document.getElementById('pointsMini');

const pvltMini =
  document.getElementById('pvltMini');

const tapBtn =
  document.getElementById('tapBtn');

const buyEnergyBtn =
  document.getElementById('buyEnergyBtn');

const claimPvltBtn =
  document.getElementById('claimPvltBtn');

/* =========================
   GAME STATE
========================= */

const MAX_ENERGY = 100;

let energy = 100;
let points = 0;
let inGamePvlt = 0;

let tokenDecimals = 18;

let realWalletPvltBalance = 0;

/* =========================
   WALLET STATE
========================= */

let userAccount = null;
let provider = null;
let signer = null;
let tokenContract = null;

/* =========================
   SAVE / LOAD
========================= */

function saveGame(){

  localStorage.setItem(
    'pepevolt_save',
    JSON.stringify({
      energy,
      points,
      inGamePvlt
    })
  );
}

function loadGame(){

  const save =
    localStorage.getItem(
      'pepevolt_save'
    );

  if(!save) return;

  try{

    const data =
      JSON.parse(save);

    energy =
      Math.max(
        0,
        Math.min(
          MAX_ENERGY,
          data.energy || 100
        )
      );

    points =
      Math.max(
        0,
        data.points || 0
      );

    inGamePvlt =
      Math.max(
        0,
        data.inGamePvlt || 0
      );

  }catch(err){
    console.log(err);
  }
}

/* =========================
   FLOAT
========================= */

function showFloating(
  x,
  y,
  text,
  color='#00ffcc'
){

  const el =
    document.createElement('div');

  el.className = 'float';

  el.innerText = text;

  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.style.color = color;

  app.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },800);
}

/* =========================
   TOKEN INFO
========================= */

async function fetchTokenInfo(){

  if(!tokenContract) return;

  try{

    tokenDecimals =
      await tokenContract.decimals();

  }catch(err){
    console.log(err);
  }
}

/* =========================
   WALLET BALANCE
========================= */

async function fetchWalletBalance(){

  if(
    !userAccount ||
    !tokenContract
  ){
    realWalletPvltBalance = 0;
    return;
  }

  try{

    const balance =
      await tokenContract.balanceOf(
        userAccount
      );

    realWalletPvltBalance =
      parseFloat(
        ethers.utils.formatUnits(
          balance,
          tokenDecimals
        )
      );

  }catch(err){

    console.log(err);

    realWalletPvltBalance = 0;
  }
}

/* =========================
   UI
========================= */

async function updateUI(){

  energyEl.innerText =
    Math.floor(energy);

  pointsEl.innerText =
    Math.floor(points);

  pvltEl.innerText =
    Math.floor(inGamePvlt);

  energyMini.innerText =
    `${Math.floor(energy)}/${MAX_ENERGY}`;

  pointsMini.innerText =
    Math.floor(points);

  pvltMini.innerText =
    Math.floor(inGamePvlt);

  if(
    userAccount &&
    tokenContract
  ){
    await fetchWalletBalance();
  }

  claimPvltBtn.disabled =
    points < 100;

  buyEnergyBtn.disabled =
    !userAccount;

  buyEnergyBtn.style.opacity =
    userAccount ? '1' : '.5';

  if(userAccount){

    connectBtn.innerText =
      `✅ ${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;

    walletStatus.innerHTML = `

      <div class="status-top">
        ✅ Connected:
        ${userAccount.slice(0,6)}
        ...
        ${userAccount.slice(-4)}
      </div>

      <div class="balance-row">

        <div class="balance-item">
          <div class="balance-label">
            🎮 GAME PVLT
          </div>

          <div class="balance-amount">
            ${Math.floor(inGamePvlt)}
          </div>
        </div>

        <div class="balance-item">
          <div class="balance-label">
            💎 WALLET
          </div>

          <div class="balance-amount">
            ${realWalletPvltBalance.toFixed(2)}
          </div>
        </div>

        <div class="balance-item">
          <div class="balance-label">
            ⚡ ENERGY
          </div>

          <div class="balance-amount">
            ${Math.floor(energy)}/${MAX_ENERGY}
          </div>
        </div>

      </div>
    `;

  }else{

    connectBtn.innerText =
      '🔗 Connect Wallet (Polygon)';

    walletStatus.innerHTML = `

      <div class="status-top">
        ⚡ Demo Mode Active
      </div>

      <div class="balance-row">

        <div class="balance-item">
          <div class="balance-label">
            🎮 GAME PVLT
          </div>

          <div class="balance-amount">
            ${Math.floor(inGamePvlt)}
          </div>
        </div>

        <div class="balance-item">
          <div class="balance-label">
            💎 WALLET
          </div>

          <div class="balance-amount">
            Not Connected
          </div>
        </div>

        <div class="balance-item">
          <div class="balance-label">
            ⚡ ENERGY
          </div>

          <div class="balance-amount">
            ${Math.floor(energy)}/${MAX_ENERGY}
          </div>
        </div>

      </div>
    `;
  }

  saveGame();
}

/* =========================
   TAP LOGIC
========================= */

let tapCooldown = false;

function handleTap(x,y){

  if(tapCooldown) return;

  tapCooldown = true;

  setTimeout(()=>{
    tapCooldown = false;
  },70);

  if(energy <= 0){

    showFloating(
      x,
      y,
      '❌ No Energy',
      '#ff8888'
    );

    return;
  }

  energy -= 1;

  points += 1;

  tapBtn.classList.add('tap');

  setTimeout(()=>{
    tapBtn.classList.remove('tap');
  },100);

  showFloating(
    x,
    y,
    '+1⭐',
    '#7bed9f'
  );

  if(points >= 100){

    const earned =
      Math.floor(points / 100);

    inGamePvlt += earned;

    points = points % 100;

    showFloating(
      x,
      y - 25,
      `✨ +${earned} PVLT`,
      '#ffd966'
    );
  }

  if(navigator.vibrate){
    navigator.vibrate(10);
  }

  updateUI();
}

/* =========================
   BUY ENERGY
========================= */

async function buyEnergy(){

  if(!userAccount){

    alert(
      'Connect wallet first'
    );

    return;
  }

  if(
    realWalletPvltBalance < 1
  ){

    alert(
      'Need at least 1 PVLT in wallet'
    );

    return;
  }

  energy = MAX_ENERGY;

  updateUI();

  showFloating(
    window.innerWidth/2,
    window.innerHeight - 120,
    '+100⚡',
    '#60a5fa'
  );
}

/* =========================
   CLAIM
========================= */

async function claimPvlt(){

  if(!userAccount){

    alert(
      'Connect wallet first'
    );

    return;
  }

  if(inGamePvlt < 1){

    alert(
      'No PVLT available'
    );

    return;
  }

  showFloating(
    window.innerWidth/2,
    window.innerHeight/2,
    '⚠️ Demo UI Only',
    '#c084fc'
  );

  alert(
    'This UI demo does not send real on-chain rewards yet.\n\nConnect smart contract reward logic first.'
  );
}

/* =========================
   CONNECT WALLET
========================= */

async function connectWallet(){

  try{

    connectBtn.classList.add(
      'loading'
    );

    connectBtn.innerText =
      'Connecting...';

    const wcProvider =
      await EthereumProvider.init({

      projectId:
        "YOUR_WALLETCONNECT_PROJECT_ID",

      chains:[137],

      showQrModal:true,

      rpcMap:{
        137:
        "https://polygon-rpc.com"
      },

      metadata:{
        name:"PepeVolt",

        description:
          "Tap to Earn PVLT",

        url:
          window.location.origin,

        icons:[
          "https://cdn-icons-png.flaticon.com/512/825/825508.png"
        ]
      }
    });

    await wcProvider.connect();

    const accounts =
      await wcProvider.request({
        method:"eth_accounts"
      });

    if(
      !accounts ||
      !accounts.length
    ){
      throw new Error(
        'No wallet found'
      );
    }

    userAccount =
      accounts[0];

    provider = wcProvider;

    const ethersProvider =
      new ethers.providers.Web3Provider(
        wcProvider
      );

    signer =
      ethersProvider.getSigner();

    tokenContract =
      new ethers.Contract(
        PVLT_TOKEN_ADDRESS,
        PVLT_ABI,
        signer
      );

    await fetchTokenInfo();

    await fetchWalletBalance();

    updateUI();

    wcProvider.on(
      "accountsChanged",
      async(accs)=>{

      if(!accs.length){

        userAccount = null;

        tokenContract = null;

        updateUI();

        return;
      }

      userAccount = accs[0];

      updateUI();
    });

    wcProvider.on(
      "disconnect",
      ()=>{

      userAccount = null;

      tokenContract = null;

      updateUI();
    });

  }catch(err){

    console.log(err);

    alert(
      err.message ||
      'Wallet connection failed'
    );

    userAccount = null;

    tokenContract = null;

    updateUI();

  }finally{

    connectBtn.classList.remove(
      'loading'
    );
  }
}

/* =========================
   EVENTS
========================= */

tapBtn.addEventListener(
  'pointerdown',
  (e)=>{

  e.preventDefault();

  const rect =
    tapBtn.getBoundingClientRect();

  const x =
    e.clientX - rect.left;

  const y =
    e.clientY - rect.top;

  handleTap(
    x + rect.left,
    y + rect.top
  );
});

buyEnergyBtn.addEventListener(
  'click',
  buyEnergy
);

claimPvltBtn.addEventListener(
  'click',
  claimPvlt
);

connectBtn.addEventListener(
  'click',
  connectWallet
);

/* =========================
   ENERGY REGEN
========================= */

setInterval(()=>{

  if(energy < MAX_ENERGY){

    energy += 1;

    updateUI();
  }

},5000);

/* =========================
   INIT
========================= */

loadGame();

updateUI();

console.log(
  "✅ PepeVolt Ready"
);

console.log(
  "📋 PVLT:",
  PVLT_TOKEN_ADDRESS
);

console.log(
  "🏦 Treasury:",
  TREASURY_VOLT
);

console.log(
  "🎮 Game:",
  PEPEVOLT_GAME
);

</script>

</body>
</html>
