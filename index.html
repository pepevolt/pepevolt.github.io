<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEPEVOLT WEB APP</title>
    
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0c1524;
            --border-color: #1a2638;
            --accent-green: #00ff88;
            --accent-blue: #00d2ff;
            --accent-purple: #6a1b9a;
            --text-main: #ffffff;
            --text-muted: #8492a6;
            --accent-yellow: #ffb300;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 480px; background: linear-gradient(180deg, #070e1b 0%, #050911 100%); padding-bottom: 40px; }
        
        .top-navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: rgba(6, 11, 19, 0.95); border-bottom: 1px solid var(--border-color); font-size: 13px; font-weight: 600; }
        .stat-item { display: flex; align-items: center; gap: 4px; }

        .clicker-section { display: flex; flex-direction: column; align-items: center; padding: 25px 20px 10px; }
        .avatar-wrapper { width: 190px; height: 190px; border-radius: 50%; background: linear-gradient(135deg, #3bfad1 0%, #0099ff 100%); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.05s; position: relative; user-select: none; -webkit-user-select: none; }
        .avatar-wrapper:active { transform: scale(0.96); }
        .avatar-img { width: 95%; height: 95%; border-radius: 50%; object-fit: cover; background-color: #111; pointer-events: none; }

        .floating-pop { position: absolute; color: var(--accent-green); font-weight: 800; font-size: 24px; pointer-events: none; animation: floatUp 0.5s ease-out forwards; z-index: 10; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

        .panel-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; margin: 15px; padding: 20px; }
        .panel-title { color: var(--accent-green); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-bottom: 15px; border-bottom: 1px dashed rgba(26, 38, 56, 0.6); padding-bottom: 8px; }
        .panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
        .row-label { color: var(--text-muted); }
        .row-value { font-weight: 600; }
        
        .card-btn { width: 100%; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; color: white; margin-top: 5px; }
        .btn-blue-grad { background: linear-gradient(135deg, #182848 0%, #293a5a 100%); border: 1px solid #3b4e70; }
        .btn-purple { background: linear-gradient(135deg, #7b1fa2 0%, #5e1784 100%); }
        
        .wallet-mount { display: flex; justify-content: center; width: 100%; }
        appkit-button { width: 100% !important; display: flex; justify-content: center; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-navbar">
        <div class="stat-item">🛢️ Energy: <span id="top-energy">50</span></div>
        <div class="stat-item">⚡ Points: <span id="top-points">0</span></div>
        <div class="stat-item">💎 gPVLT: <span id="top-g-pvlt">0.0000</span></div>
    </div>

    <div class="clicker-section">
        <div class="avatar-wrapper" id="tap-target">
            <img src="https://pepevolt.github.io/images/pepe-logo.png" onerror="this.src='https://placehold.co/300x300/111/fff?text=PEPE'" class="avatar-img" alt="Target Logo">
        </div>
    </div>

    <div class="panel-card">
        <div class="panel-title">Identity & Access</div>
        <div class="wallet-mount">
            <appkit-button balance="show"></appkit-button>
        </div>
    </div>

    <div class="panel-card">
        <div class="panel-title">Token Ledger (Contract #1)</div>
        <div class="panel-row"><span class="row-label">Personal Wallet PVLT:</span><span class="row-value" style="color:var(--accent-green)" id="wallet-pvlt">0.0000</span></div>
        <div class="panel-row"><span class="row-label">Internal Game Currency:</span><span class="row-value" style="color:var(--accent-yellow)" id="game-gpvlt">0.0000 gPVLT</span></div>
        <div class="panel-row"><span class="row-label">Current Energy Pool:</span><span class="row-value" id="energy-pool">50/50</span></div>
        <button class="card-btn btn-blue-grad" id="buy-energy-btn">Buy 10,000 Energy (150 PVLT)</button>
    </div>

    <div class="panel-card">
        <div class="panel-title">Staking Engine (Contract #2)</div>
        <div class="panel-row"><span class="row-label">Accumulated Points:</span><span class="row-value" id="accum-points">0</span></div>
        <div class="panel-row"><span class="row-label
