<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap Game</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a2e; color: #ffffff; font-family: sans-serif; overflow: hidden; touch-action: manipulation; }
        .game-container { display: flex; flex-direction: column; height: 100vh; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 10px 5px; background: #16213e; text-align: center; }
        .stat-item { display: flex; flex-direction: column; font-size: 0.75rem; }
        .emoji { font-size: 1.2rem; margin-bottom: 4px; }
        
        .interaction-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }
        
        .tap-circle { 
            width: 160px; height: 160px; border-radius: 50%; border: none; 
            background: #4ecca3; color: #1a1a2e; font-size: 2rem; font-weight: bold; 
            cursor: pointer; transition: transform 0.05s, background 0.3s;
            box-shadow: 0 8px 0 #3a9b7c; 
        }
        .tap-circle:disabled { background: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        .tap-circle:active:not(:disabled) { transform: scale(0.95); }

        .wallet-btn { background: #3498db; color: white; padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        .energy-bar { width: 80%; height: 20px; background: #0f3460; border-radius: 10px; overflow: hidden; }
        .energy-fill { height: 100%; background: #4ecca3; width: 50%; transition: width 0.3s; }
        
        .btn-confirm { background: #4ecca3; color: #1a1a2e; padding: 12px; border: none; border-radius: 5px; font-weight: bold; width: 80%; }
        .footer-panel { padding: 10px; background: #0f3460; text-align: center; display: flex; flex-direction: column; gap: 5px; }
        .btn-convert { background: #e94560; color: white; padding: 10px; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="stats">
            <div class="stat-item"><span class="emoji">⚡</span><span id="energy">50/50</span></div>
            <div class="stat-item"><span class="emoji">💎</span><span id="points">0</span></div>
            <div class="stat-item"><span class="emoji">🪙</span><span id="gpvlt">0.00</span></div>
        </header>

        <main class="interaction-area">
            <button id="connect-wallet" class="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
            
            <button id="tap-button" class="tap-circle" disabled>TAP!</button>
            
            <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
            <div id="pvlt-display" style="font-weight: bold;">Balance: 0.000 PVLT</div>
            
            <div class="buy-menu" style="text-align: center;">
                <div style="margin-bottom: 8px; font-size: 0.9rem;">10,000 Energy = 100 PVLT</div>
                <button class="btn-confirm" onclick="confirmRefill()">Confirm Refill</button>
            </div>
        </main>

        <footer class="footer-panel">
            <button class="btn-convert" onclick="convertPoints()">Convert 100 💎 → 1 gPVLT</button>
        </footer>
    </div>

    <script>
        let energy = 50, points = 0, gpvlt = 0, pvlt = 0;
        let isWalletConnected = false;

        function connectWallet() {
            // Simulated connection
            alert("Wallet Connected!");
            isWalletConnected = true;
            document.getElementById('connect-wallet').innerText = "Wallet Connected";
            document.getElementById('connect-wallet').disabled = true;
            document.getElementById('tap-button').disabled = false;
        }

        function updateUI() {
            document.getElementById('energy').innerText = `${energy > 50 ? 50 : energy}/50`;
            document.getElementById('energy-fill').style.width = (Math.min(energy, 50) / 50 * 100) + "%";
            document.getElementById('points').innerText = points;
            document.getElementById('gpvlt').innerText = gpvlt.toFixed(2);
            document.getElementById('pvlt-display').innerText = `Balance: ${pvlt.toFixed(3)} PVLT`;
        }

        document.getElementById('tap-button').addEventListener('click', () => {
            if (isWalletConnected && energy > 0) {
                energy--;
                points++;
                updateUI();
            }
        });

        function confirmRefill() {
            if (pvlt >= 100) { pvlt -= 100; energy += 10000; updateUI(); alert("Refilled!"); }
            else { alert("Need 100 PVLT!"); }
        }

        function convertPoints() { if (points >= 100) { points -= 100; gpvlt += 1; updateUI(); } else alert("Need 100 💎!"); }

        setInterval(() => { if (energy < 50) { energy++; updateUI(); } }, 1000);
        updateUI();
    </script>
</body>
</html>
