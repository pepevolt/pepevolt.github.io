<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PepeVolt</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#11152f;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:430px;
    height:100vh;
    background:#15173a;
    position:relative;
    overflow:hidden;
}

/* TOP NAV */

.topnav{
    width:100%;
    background:#2b4056;
    padding:28px 18px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-item{
    flex:1;
    text-align:center;
}

.nav-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:14px;
}

.nav-value{
    color:#22e27d;
    font-size:22px;
    font-weight:900;
}

/* MAIN */

.main{
    width:100%;
    height:calc(100vh - 90px);
    overflow-y:auto;
    padding-bottom:120px;
}

/* TAP */

.tap-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:70px;
    margin-bottom:60px;
}

.tap-btn{
    width:230px;
    height:230px;
    border-radius:50%;
    border:none;

    background:#35d06f;

    color:#07131d;
    font-size:58px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
    inset 0 -10px 0 rgba(0,0,0,0.08);

    transition:0.08s;
}

.tap-btn:active{
    transform:scale(0.94);
}

/* BUTTONS */

.action-area{
    width:100%;
    padding:0 22px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:26px 20px;

    font-size:18px;
    font-weight:800;

    cursor:pointer;

    color:white;
}

.wallet-btn{
    background:#4097d8;
}

.orange-btn{
    background:#e98421;
}

.message{
    text-align:center;
    margin-top:40px;
    color:#9ca0aa;
    font-size:18px;
    padding:0 20px;
    line-height:1.5;
}

/* FOOTER */

.footer{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);

    width:100%;
    max-width:430px;

    background:#1e2735;

    display:flex;
    justify-content:space-around;
    align-items:center;

    padding:16px 0;

    border-top:
    1px solid rgba(255,255,255,0.05);
}

.footer-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;

    font-size:13px;
    opacity:0.8;
}

.loading{
    opacity:0.6;
    pointer-events:none;
}

</style>
</head>

<body>

<div class="app">

    <!-- TOP NAV -->
    <div class="topnav">

        <div class="nav-item">

            <div class="nav-title">
                ⚡ Energy
            </div>

            <div id="energy" class="nav-value">
                50
            </div>

        </div>

        <div class="nav-item">

            <div class="nav-title">
                💎 Points
            </div>

            <div id="points" class="nav-value">
                0
            </div>

        </div>

        <div class="nav-item">

            <div class="nav-title">
                🌕 gPVLT
            </div>

            <div id="gpvlt" class="nav-value">
                0
            </div>

        </div>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- TAP -->
        <div class="tap-wrap">

            <button id="tapBtn" class="tap-btn">
                TAP
            </button>

        </div>

        <!-- ACTIONS -->
        <div class="action-area">

            <button
            id="walletBtn"
            class="btn wallet-btn">

                Connect Wallet

            </button>

            <button
            id="buyBtn"
            class="btn orange-btn">

                Buy 10,000 Energy (100 PVLT)

            </button>

            <button
            id="convertBtn"
            class="btn orange-btn">

                Convert 10 Points → 1 gPVLT

            </button>

            <button
            id="claimBtn"
            class="btn orange-btn">

                Claim Reward (10 gPVLT)

            </button>

        </div>

        <div
        id="status"
        class="message">

            Ready.

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">

        <div class="footer-item">
            🏠
            <span>Home</span>
        </div>

        <div class="footer-item">
            📈
            <span>Markets</span>
        </div>

        <div class="footer-item">
            🔄
            <span>Trade</span>
        </div>

        <div class="footer-item">
            🧭
            <span>Discover</span>
        </div>

        <div class="footer-item">
            💼
            <span>Assets</span>
        </div>

    </div>

</div>

<script>

/* CONTRACTS */

const PVLT_ADDRESS =
"0x5f7df6862f439b691507dc20069f4f73a37cb08b";

const TREASURY_ADDRESS =
"0x4251Ef24D10bf637494C173621F5f84262e9Bda5";

const GAME_ADDRESS =
"0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

/* GAME ABI */

const GAME_ABI = [

    "function tap() external",

    "function convertPoints() external",

    "function refillEnergy() external",

    "function players(address) view returns(uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"

];

/* TREASURY ABI */

const TREASURY_ABI = [

    "function claimRewards() external"

];

/* ERC20 ABI */

const ERC20_ABI = [

    "function approve(address spender,uint256 amount) external returns(bool)",

    "function balanceOf(address owner) external view returns(uint256)"

];

/* VARIABLES */

let provider;
let signer;
let user;

let game;
let treasury;
let pvlt;

/* ELEMENTS */

const walletBtn =
document.getElementById("walletBtn");

const statusText =
document.getElementById("status");

const energyText =
document.getElementById("energy");

const pointsText =
document.getElementById("points");

const gpvltText =
document.getElementById("gpvlt");

/* CONNECT */

async function connectWallet(){

    try{

        if(!window.ethereum){

            alert("Install MetaMask");

            return;
        }

        provider =
        new ethers.providers.Web3Provider(
            window.ethereum
        );

        await provider.send(
            "eth_requestAccounts",
            []
        );

        const network =
        await provider.getNetwork();

        if(network.chainId !== 137){

            alert(
                "Switch to Polygon Mainnet"
            );

            return;
        }

        signer =
        provider.getSigner();

        user =
        await signer.getAddress();

        game =
        new ethers.Contract(
            GAME_ADDRESS,
            GAME_ABI,
            signer
        );

        treasury =
        new ethers.Contract(
            TREASURY_ADDRESS,
            TREASURY_ABI,
            signer
        );

        pvlt =
        new ethers.Contract(
            PVLT_ADDRESS,
            ERC20_ABI,
            signer
        );

        walletBtn.innerText =
        "Disconnect: " +
        user.slice(0,6) +
        "..." +
        user.slice(-4);

        statusText.innerText =
        "Wallet connected.";

        await autoRefillEnergy();

        await loadPlayer();

    }catch(err){

        console.log(err);

        statusText.innerText =
        "Connection failed.";
    }
}

/* AUTO REFILL */

async function autoRefillEnergy(){

    try{

        const data =
        await game.players(user);

        let energy =
        Number(data.energy);

        const paidUser =
        data.paidUser;

        const target =
        paidUser ? 10000 : 50;

        // REFILL ONLY WHEN EMPTY
        if(energy <= 0){

            statusText.innerText =
            "Refilling energy...";

            const refillCount =
            target;

            // WARNING:
            // BAD CONTRACT DESIGN
            // THIS SPAMS TRANSACTIONS

            for(let i=0;i<refillCount;i++){

                const tx =
                await game.refillEnergy();

                await tx.wait();
            }

            statusText.innerText =
            "Energy refilled.";
        }

    }catch(err){

        console.log(err);
    }
}

/* LOAD PLAYER */

async function loadPlayer(){

    if(!user) return;

    try{

        const data =
        await game.players(user);

        energyText.innerText =
        Number(data.energy);

        pointsText.innerText =
        Number(data.points);

        gpvltText.innerText =
        Number(data.burnedGPVLT);

    }catch(err){

        console.log(err);
    }
}

/* EXECUTOR */

async function execute(
    button,
    callback
){

    try{

        button.classList.add(
            "loading"
        );

        const tx =
        await callback();

        statusText.innerText =
        "Transaction pending...";

        await tx.wait();

        await autoRefillEnergy();

        await loadPlayer();

        statusText.innerText =
        "Transaction successful.";

    }catch(err){

        console.log(err);

        statusText.innerText =
        err?.reason ||
        err?.message ||
        "Transaction failed.";
    }

    button.classList.remove(
        "loading"
    );
}

/* TAP */

document.getElementById(
    "tapBtn"
).onclick = async(e)=>{

    await execute(
        e.target,
        ()=>game.tap()
    );
};

/* CONVERT */

document.getElementById(
    "convertBtn"
).onclick = async(e)=>{

    await execute(
        e.target,
        ()=>game.convertPoints()
    );
};

/* CLAIM */

document.getElementById(
    "claimBtn"
).onclick = async(e)=>{

    await execute(
        e.target,
        ()=>treasury.claimRewards()
    );
};

/* BUY ENERGY */

document.getElementById(
    "buyBtn"
).onclick = async()=>{

    statusText.innerText =
    "Your contract does NOT include buyEnergy().";

    // THIS BUTTON CANNOT WORK
    // WITHOUT CONTRACT FUNCTION
};

/* CONNECT */

walletBtn.onclick =
connectWallet;

/* EVENTS */

window.ethereum?.on(
    "accountsChanged",
    ()=>window.location.reload()
);

window.ethereum?.on(
    "chainChanged",
    ()=>window.location.reload()
);

</script>

</body>
</html>
