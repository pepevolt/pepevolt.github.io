<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PepeVolt Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:manipulation;
    font-family:Arial,sans-serif;
    background:
    radial-gradient(circle at center,
    #1d2c57 0%,
    #091126 100%);
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.container{
    width:100%;
    max-width:500px;
    height:100vh;
    overflow-y:auto;
    padding-bottom:40px;
}

/* TOP BAR */

.topbar{
    width:100%;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:space-around;
    padding:20px 10px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.stat{
    text-align:center;
}

.stat .icon{
    font-size:30px;
    margin-bottom:8px;
}

.stat .value{
    font-size:28px;
    font-weight:bold;
}

.stat .label{
    font-size:14px;
    opacity:0.8;
}

/* GAME */

.game{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 20px;
}

.tap-area{
    margin-top:40px;
    margin-bottom:35px;
}

.tap-btn{
    width:230px;
    height:230px;
    border-radius:50%;
    border:none;
    outline:none;
    cursor:pointer;
    background:
    linear-gradient(180deg,
    #5cf0c7,
    #3fc7a3);
    color:#1273ff;
    font-size:52px;
    font-weight:900;
    box-shadow:
    0 15px 0 #239578,
    0 0 50px rgba(92,240,199,0.45);
    transition:0.08s;
    user-select:none;
}

.tap-btn:active{
    transform:translateY(10px);
    box-shadow:
    0 5px 0 #239578,
    0 0 20px rgba(92,240,199,0.4);
}

.wallet-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:18px;
    background:#ef4b3f;
    color:white;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.progress-wrap{
    width:100%;
    height:30px;
    border-radius:30px;
    overflow:hidden;
    background:rgba(255,255,255,0.08);
    margin-bottom:18px;
}

.progress{
    width:0%;
    height:100%;
    border-radius:30px;
    background:#59e3bb;
    transition:0.3s;
}

.balance{
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
}

.action-btn{
    width:100%;
    padding:22px;
    border:none;
    border-radius:18px;
    background:#59e3bb;
    color:#07111f;
    font-size:24px;
    font-weight:900;
    margin-bottom:20px;
}

.card{
    width:100%;
    background:rgba(255,255,255,0.08);
    border-radius:24px;
    padding:25px;
    margin-top:10px;
}

.card h2{
    text-align:center;
    margin-bottom:25px;
    font-size:32px;
}

.refill-btn{
    width:100%;
    padding:22px;
    border:none;
    border-radius:18px;
    background:#59e3bb;
    color:#07111f;
    font-size:24px;
    font-weight:bold;
}

.status{
    margin-top:20px;
    text-align:center;
    font-size:16px;
    color:#59e3bb;
    word-break:break-word;
}

/* FLOAT TEXT */

.float{
    position:absolute;
    color:#5cf0c7;
    font-weight:bold;
    font-size:34px;
    pointer-events:none;
    animation:floatUp 1s linear forwards;
}

@keyframes floatUp{
    0%{
        opacity:1;
        transform:translateY(0);
    }
    100%{
        opacity:0;
        transform:translateY(-100px);
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- TOP BAR -->

    <div class="topbar">

        <div class="stat">
            <div class="icon">⚡</div>
            <div class="value" id="energy">50/50</div>
        </div>

        <div class="stat">
            <div class="icon">💎</div>
            <div class="value" id="points">0</div>
        </div>

        <div class="stat">
            <div class="icon">🪙</div>
            <div class="value" id="gpvlt">0.00</div>
        </div>

    </div>

    <!-- GAME -->

    <div class="game">

        <div class="tap-area">
            <button class="tap-btn" id="tapBtn">
                TAP!
            </button>
        </div>

        <button class="wallet-btn" id="connectBtn">
            Connect Wallet
        </button>

        <div class="progress-wrap">
            <div class="progress" id="progress"></div>
        </div>

        <div class="balance">
            Balance:
            <span id="pvltBalance">0.000</span>
            PVLT
        </div>

        <button class="action-btn" id="convertBtn">
            Convert 100 💎 → 1 gPVLT
        </button>

        <button class="action-btn" id="claimBtn">
            Claim Reward
        </button>

        <div class="card">

            <h2>
                10,000 Energy = 100 PVLT
            </h2>

            <button class="refill-btn" id="refillBtn">
                Confirm Refill
            </button>

        </div>

        <div class="status" id="status">
            Ready
        </div>

    </div>

</div>

<script>

/* =========================
   CONTRACTS
========================= */

const GAME_ADDRESS =
"0x151803532A33837E4bBc2";

const TREASURY_ADDRESS =
"0x3c25FE15e6fa0Eeb226Af53D1c9D8f8FA8BA21bc";

const PVLT_ADDRESS =
"0xb8010fD52D5208eC05574a7D5A939c0d446A862a";

const CHAIN_ID = 137;

/* =========================
   ABI
========================= */

const GAME_ABI = [
"function tap() external",
"function convertPoints() external",
"function refillEnergy() external",
"function players(address) view returns(uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"
];

const TREASURY_ABI = [
"function claimRewards() external"
];

const ERC20_ABI = [
"function balanceOf(address) view returns(uint256)"
];

/* =========================
   GLOBALS
========================= */

let provider;
let signer;
let userAddress;

let game;
let treasury;
let pvlt;

/* =========================
   ELEMENTS
========================= */

const connectBtn =
document.getElementById("connectBtn");

const tapBtn =
document.getElementById("tapBtn");

const convertBtn =
document.getElementById("convertBtn");

const refillBtn =
document.getElementById("refillBtn");

const claimBtn =
document.getElementById("claimBtn");

const energyEl =
document.getElementById("energy");

const pointsEl =
document.getElementById("points");

const gpvltEl =
document.getElementById("gpvlt");

const pvltBalanceEl =
document.getElementById("pvltBalance");

const progressEl =
document.getElementById("progress");

const statusEl =
document.getElementById("status");

/* =========================
   CONNECT WALLET
========================= */

async function connectWallet(){

    try{

        if(!window.ethereum){
            alert("Install MetaMask");
            return;
        }

        provider =
        new ethers.providers.Web3Provider(window.ethereum);

        await provider.send(
            "eth_requestAccounts",
            []
        );

        signer = provider.getSigner();

        userAddress =
        await signer.getAddress();

        const network =
        await provider.getNetwork();

        if(network.chainId !== CHAIN_ID){
            alert("Switch to Polygon Mainnet");
            return;
        }

        game =
        new ethers.Contract(
            GAME_ADDRESS,
            GAME_ABI,
            signer
        );

        treasury =
        new ethers.Contract(
            TREASURY_ADDRESS,
            TREASURY_ABI,
            signer
        );

        pvlt =
        new ethers.Contract(
            PVLT_ADDRESS,
            ERC20_ABI,
            provider
        );

        connectBtn.innerHTML =
        "Disconnect Wallet";

        statusEl.innerHTML =
        "Wallet Connected";

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Connection Failed";

    }

}

/* =========================
   LOAD PLAYER
========================= */

async function loadPlayer(){

    try{

        if(!userAddress) return;

        const data =
        await game.players(userAddress);

        const energy =
        Number(data.energy);

        const points =
        Number(data.points);

        const gpvlt =
        Number(data.burnedGPVLT);

        const balance =
        await pvlt.balanceOf(userAddress);

        const pvltFormatted =
        ethers.utils.formatEther(balance);

        energyEl.innerHTML =
        energy + "/50";

        pointsEl.innerHTML =
        points;

        gpvltEl.innerHTML =
        gpvlt.toFixed(2);

        pvltBalanceEl.innerHTML =
        Number(pvltFormatted).toFixed(3);

        const progress =
        Math.min((points / 100) * 100, 100);

        progressEl.style.width =
        progress + "%";

    }catch(err){

        console.log(err);

    }

}

/* =========================
   FLOAT TEXT
========================= */

function showFloat(){

    const div =
    document.createElement("div");

    div.className = "float";

    div.innerHTML = "+1";

    const rect =
    tapBtn.getBoundingClientRect();

    div.style.left =
    rect.left + rect.width/2 + "px";

    div.style.top =
    rect.top + "px";

    document.body.appendChild(div);

    setTimeout(()=>{
        div.remove();
    },1000);

}

/* =========================
   TAP
========================= */

async function tap(){

    try{

        if(!game){
            alert("Connect wallet");
            return;
        }

        showFloat();

        const tx =
        await game.tap();

        await tx.wait();

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Tap failed";

    }

}

/* =========================
   CONVERT
========================= */

async function convert(){

    try{

        const tx =
        await game.convertPoints();

        statusEl.innerHTML =
        "Converting...";

        await tx.wait();

        statusEl.innerHTML =
        "Converted";

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Convert failed";

    }

}

/* =========================
   CLAIM
========================= */

async function claim(){

    try{

        const tx =
        await treasury.claimRewards();

        statusEl.innerHTML =
        "Claiming rewards...";

        await tx.wait();

        statusEl.innerHTML =
        "Rewards claimed";

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Claim failed";

    }

}

/* =========================
   REFILL
========================= */

async function refill(){

    try{

        const tx =
        await game.refillEnergy();

        statusEl.innerHTML =
        "Refilling energy...";

        await tx.wait();

        statusEl.innerHTML =
        "Energy refilled";

        loadPlayer();

    }catch(err){

        console.log(err);

        statusEl.innerHTML =
        "Refill failed";

    }

}

/* =========================
   EVENTS
========================= */

connectBtn.addEventListener(
"click",
connectWallet
);

tapBtn.addEventListener(
"click",
tap
);

convertBtn.addEventListener(
"click",
convert
);

claimBtn.addEventListener(
"click",
claim
);

refillBtn.addEventListener(
"click",
refill
);

</script>

</body>
</html>
