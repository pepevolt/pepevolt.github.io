<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PepeVolt</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#06101d;
  touch-action:manipulation;
}

/* APP */

.app{

  width:100%;
  max-width:430px;

  height:100vh;
  height:100dvh;

  margin:auto;

  background:
  radial-gradient(circle at top,#13233d 0%,#07111f 75%);

  display:flex;
  flex-direction:column;

  padding:
  max(16px, env(safe-area-inset-top))
  16px
  max(16px, env(safe-area-inset-bottom));

  position:relative;

  overflow:hidden;
}

/* TOP NAV */

.top-nav{

  width:100%;

  display:flex;
  gap:10px;

  margin-top:5px;
}

.nav-box{

  flex:1;

  background:rgba(255,255,255,0.05);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:18px;

  padding:12px 8px;

  text-align:center;

  backdrop-filter:blur(10px);
}

.nav-title{

  font-size:11px;
  color:#9fb2d0;

  margin-bottom:6px;
}

.nav-value{

  font-size:18px;
  font-weight:bold;
  color:white;
}

/* CONNECT */

.wallet-wrap{

  width:100%;
  margin-top:16px;
}

#connectBtn{

  width:100%;

  border:none;
  outline:none;

  border-radius:18px;

  padding:15px;

  font-size:16px;
  font-weight:bold;

  color:white;

  cursor:pointer;

  background:
  linear-gradient(
  135deg,
  #00b894,
  #00cec9
  );

  box-shadow:
  0 0 25px rgba(0,255,200,0.25);

  position:relative;
  z-index:10;
}

#connectBtn:active{
  transform:scale(0.98);
}

/* CENTER */

.center{

  flex:1;

  display:flex;
  justify-content:center;
  align-items:center;

  width:100%;
}

/* TAP */

.tap-circle{

  width:min(60vw,240px);
  height:min(60vw,240px);

  border-radius:50%;

  background:
  radial-gradient(
  circle at 30% 30%,
  #ffcc00,
  #ff8800
  );

  border:8px solid rgba(255,255,255,0.9);

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:
  0 0 80px rgba(255,180,0,0.4),
  inset 0 0 35px rgba(255,255,255,0.15);

  cursor:pointer;

  user-select:none;

  position:relative;
  z-index:10;
}

.tap-circle:active{
  transform:scale(0.94);
}

.tap-circle img{

  width:28%;
  height:28%;

  object-fit:contain;

  pointer-events:none;
}

/* BUTTONS */

.actions{

  width:100%;

  display:flex;
  flex-direction:column;

  gap:12px;

  margin-bottom:10px;
}

.action-btn{

  width:100%;

  border:none;
  outline:none;

  border-radius:18px;

  padding:16px;

  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  position:relative;
  z-index:10;
}

.action-btn:active{
  transform:scale(0.98);
}

.buy{
  background:
  linear-gradient(135deg,#00b894,#00cec9);
}

.convert{
  background:
  linear-gradient(135deg,#6c5ce7,#8e7dff);
}

.claim{
  background:
  linear-gradient(135deg,#ffb347,#ff7b54);
}

/* FLOAT */

.float{

  position:fixed;

  color:white;

  font-weight:bold;

  pointer-events:none;

  z-index:9999;

  animation:floatUp 1s linear forwards;
}

@keyframes floatUp{

  0%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-70px);
  }
}

/* MOBILE FIX */

@media(max-height:700px){

  .tap-circle{
    width:190px;
    height:190px;
  }

  .action-btn{
    padding:14px;
  }
}

</style>
</head>

<body>

<div class="app">

  <!-- TOP NAV -->

  <div class="top-nav">

    <div class="nav-box">
      <div class="nav-title">
        ⚡ Energy
      </div>

      <div
      class="nav-value"
      id="energy">
        100
      </div>
    </div>

    <div class="nav-box">
      <div class="nav-title">
        💎 gPVLT
      </div>

      <div
      class="nav-value"
      id="gpvlt">
        0
      </div>
    </div>

    <div class="nav-box">
      <div class="nav-title">
        🪙 PVLT
      </div>

      <div
      class="nav-value"
      id="pvlt">
        0
      </div>
    </div>

  </div>

  <!-- CONNECT -->

  <div class="wallet-wrap">

    <button id="connectBtn">
      Connect Wallet
    </button>

  </div>

  <!-- CENTER -->

  <div class="center">

    <div
    class="tap-circle"
    id="tapBtn">

      <img
      src="https://cdn-icons-png.flaticon.com/512/825/825508.png">

    </div>

  </div>

  <!-- BUTTONS -->

  <div class="actions">

    <button
    class="action-btn buy"
    id="buyBtn">
      Buy
    </button>

    <button
    class="action-btn convert"
    id="convertBtn">
      Convert
    </button>

    <button
    class="action-btn claim"
    id="claimBtn">
      Claim
    </button>

  </div>

</div>

<script type="module">

/* WALLET */

import { createAppKit }
from 'https://esm.sh/@reown/appkit@latest';

import { EthersAdapter }
from 'https://esm.sh/@reown/appkit-adapter-ethers@latest';

import { polygon }
from 'https://esm.sh/@reown/appkit/networks@latest';

const connectBtn =
document.getElementById('connectBtn');

const projectId =
'1731f99148b9cf6107dee70b6efb14b7';

const modal = createAppKit({

  adapters:[new EthersAdapter()],

  networks:[polygon],

  metadata:{
    name:'PepeVolt',
    description:'PepeVolt Game',
    url:'https://pepevolt.github.io',
    icons:[
      'https://avatars.githubusercontent.com/u/179229932'
    ]
  },

  projectId,

  features:{
    analytics:true
  }

});

/* CONNECT CLICK */

connectBtn.onclick = async ()=>{

  try{

    await modal.open();

  }catch(err){

    console.log(err);

  }

};

/* WALLET STATE */

modal.subscribeState((state)=>{

  if(state.isConnected && state.address){

    const address = state.address;

    connectBtn.innerText =
    address.slice(0,6)
    + '...'
    + address.slice(-4);

  }else{

    connectBtn.innerText =
    'Connect Wallet';

  }

});

/* GAME */

const tapBtn =
document.getElementById('tapBtn');

const buyBtn =
document.getElementById('buyBtn');

const convertBtn =
document.getElementById('convertBtn');

const claimBtn =
document.getElementById('claimBtn');

const energyEl =
document.getElementById('energy');

const gpvltEl =
document.getElementById('gpvlt');

const pvltEl =
document.getElementById('pvlt');

let energy = 100;
let points = 0;
let gpvlt = 0;
let pvlt = 0;

/* TAP */

tapBtn.onclick = (e)=>{

  if(energy <= 0){

    alert('No Energy');

    return;
  }

  energy--;
  points++;

  energyEl.innerText = energy;

  /* 100 POINTS = 1 GPVLT */

  if(points >= 100){

    points = 0;

    gpvlt++;

    gpvltEl.innerText = gpvlt;
  }

  /* 100 GPVLT = 1 PVLT */

  if(gpvlt >= 100){

    gpvlt = 0;

    pvlt++;

    gpvltEl.innerText = gpvlt;

    pvltEl.innerText = pvlt;
  }

  /* FLOAT */

  const float =
  document.createElement('div');

  float.className = 'float';

  float.innerText = '+1';

  float.style.left =
  e.clientX + 'px';

  float.style.top =
  e.clientY + 'px';

  document.body.appendChild(float);

  setTimeout(()=>{

    float.remove();

  },1000);

};

/* BUY */

buyBtn.onclick = ()=>{

  energy += 100;

  energyEl.innerText = energy;

  alert('+100 Energy');

};

/* CONVERT */

convertBtn.onclick = ()=>{

  if(points < 100){

    alert('Need 100 Points');

    return;
  }

  points -= 100;

  gpvlt++;

  gpvltEl.innerText = gpvlt;

  alert('+1 gPVLT');

};

/* CLAIM */

claimBtn.onclick = ()=>{

  if(gpvlt < 100){

    alert('Need 100 gPVLT');

    return;
  }

  gpvlt -= 100;

  pvlt++;

  gpvltEl.innerText = gpvlt;

  pvltEl.innerText = pvlt;

  alert('+1 PVLT');

};

</script>

</body>
</html>
