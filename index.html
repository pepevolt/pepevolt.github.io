<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PVLT Tap Game</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020b18;
            font-family: Arial;
            color: white;
        }

        body { display: flex; flex-direction: column; }

        .topbar {
            width: 100%;
            padding: 14px 18px;
            background: #091426;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .tapBtn {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00ff99, #00ccff);
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .tapBtn:active { transform: scale(0.96); }

        .tapBtn img {
            width: 78%;
            height: 78%;
            object-fit: contain;
            pointer-events: none;
        }

        .card {
            width: 100%;
            max-width: 380px;
            margin-top: 28px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: #0c1628;
            color: white;
        }

        .actionBtn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff99, #00ccff);
            color: black;
        }

        .info {
            margin-top: 16px;
            font-size: 12px;
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="topbar">
    <div>🔋 <span id="energy">50</span></div>
    <div>⚡ <span id="points">0</span></div>
    <div>💎 <span id="gPVLT">0</span></div>
    <div>🏆 <span id="pvlt">0</span></div>
</div>

<div class="main">

    <button class="tapBtn" onclick="tap()">
        <img src="images/IMG_1850.png">
    </button>

    <div class="card">

        <input id="walletInput" placeholder="Connect Wallet" readonly>

        <button class="actionBtn" onclick="connectWallet()">CONNECT WALLET</button>

        <button class="actionBtn" onclick="openBuyModal()">BUY ENERGY</button>

        <button class="actionBtn" onclick="claimPVLT()">CLAIM PVLT</button>

    </div>

    <div class="info">
        1 Tap = 1 Point<br>
        10 Points = 1 gPVLT<br>
        10 gPVLT = 1 PVLT
    </div>

</div>

<script>
const API = "https://pvlt-server.onrender.com";

let wallet = "";
let points = 0;
let gPVLT = 0;
let pvlt = 0;
let energy = 50;

/* ================= UI ================= */
function updateUI() {
    document.getElementById("energy").innerText = energy;
    document.getElementById("points").innerText = points;
    document.getElementById("gPVLT").innerText = gPVLT;
    document.getElementById("pvlt").innerText = pvlt;
}

/* ================= CONVERSION ENGINE ================= */
function convert() {

    // points → gPVLT
    if (points >= 10) {
        const add = Math.floor(points / 10);
        gPVLT += add;
        points = points % 10;
    }

    // gPVLT → PVLT
    if (gPVLT >= 10) {
        const add = Math.floor(gPVLT / 10);
        pvlt += add;
        gPVLT = gPVLT % 10;
    }
}

/* ================= TAP ================= */
function tap() {
    if (!wallet) return alert("Connect wallet first");

    points += 1;
    energy = Math.max(0, energy - 1);

    convert();
    updateUI();
}

/* ================= WALLET ================= */
async function connectWallet() {
    if (!window.ethereum) return alert("No wallet found");

    const acc = await window.ethereum.request({ method: "eth_requestAccounts" });
    wallet = acc[0];

    document.getElementById("walletInput").value =
        wallet.slice(0,6) + "..." + wallet.slice(-4);
}

/* ================= CLAIM ================= */
function claimPVLT() {
    if (pvlt < 1) return alert("Need at least 1 PVLT");

    alert("Claim request sent for " + pvlt + " PVLT");

    pvlt = 0;
    updateUI();
}

/* ================= AUTO ENERGY ================= */
setInterval(() => {
    if (energy < 50) energy++;
    updateUI();
}, 30000);

/* INIT */
updateUI();
</script>

</body>
</html>
