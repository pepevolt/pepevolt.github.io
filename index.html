<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<style>

/* ================= GLOBAL ================= */
html, body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
touch-action:none;
-webkit-text-size-adjust:100%;
}

body{
font-family:Arial;
background:radial-gradient(circle at top,#0b1220,#020617);
color:white;
position:fixed;
width:100%;
text-align:center;
}

/* ================= NAVBAR ================= */
.navbar{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;

background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);

border-bottom:1px solid rgba(255,255,255,0.08);

font-size:12px;
}

/* ================= MAIN ================= */
.container{
position:absolute;
top:60px;
left:0;
right:0;
bottom:0;

display:flex;
flex-direction:column;
align-items:center;

padding:15px;
gap:14px;
overflow:hidden;
}

/* ================= TITLE ================= */
h2{
margin:5px 0;
font-size:24px;

background:linear-gradient(90deg,#00ff99,#00ccff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* ================= TAP BUTTON ================= */
.tap{
width:190px;
height:190px;
border-radius:50%;

border:none;

background:linear-gradient(135deg,#00ff99,#00ccff);

font-size:24px;
font-weight:bold;
color:black;

box-shadow:0 0 30px rgba(0,255,200,0.35);
}

.tap:active{
transform:scale(0.96);
}

/* ================= LIVE ================= */
.live{
font-size:14px;
opacity:0.8;
}

/* ================= CARD ================= */
.card{
width:90%;
max-width:360px;

padding:14px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.08);
border-radius:14px;

display:flex;
flex-direction:column;
gap:10px;
}

/* ================= INPUT ================= */
input{
width:100%;
padding:14px;

border:none;
outline:none;
border-radius:12px;

box-sizing:border-box;

background:rgba(0,0,0,0.35);
color:white;

font-size:14px;
}

/* ================= BUTTON ================= */
button{
width:100%;
padding:14px;

border:none;
border-radius:12px;

font-weight:bold;
font-size:14px;

background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

/* ================= INFO ================= */
.info{
font-size:11px;
opacity:0.6;
}

/* ================= STATUS ================= */
.status{
font-size:12px;
color:#00ff99;
display:none;
}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">

<div>
⚡ POINTS:
<span id="totalPoints">0</span>
</div>

<div>
💎 TOKENS:
<span id="totalTokens">0.0000</span>
</div>

<div>
👤 <span id="userId">guest</span>
</div>

</div>

<!-- ================= MAIN ================= -->
<div class="container">

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">
TAP
</button>

<div class="live">
1 Tap = 1 Point
</div>

<!-- ================= WALLET ================= -->
<div class="card">

<input
id="wallet"
placeholder="Paste BSC wallet address"
>

<button
id="walletBtn"
onclick="toggleWallet()"
>
CONNECT WALLET
</button>

<div
id="walletStatus"
class="status"
>
Wallet connected
</div>

</div>

<!-- ================= AUTO PAYOUT ================= -->
<div class="card">

<div style="font-size:13px;">
🤖 Auto Withdrawal Enabled
</div>

<div class="info">
Minimum: 100 Tokens
<br>
Maximum: 500 Tokens
<br><br>
1 Token = 10,000 Points
<br>
1 Token Price = 0.000000001 BNB
<br><br>
Auto payout works once every 24 hours
</div>

</div>

</div>

<script>

/* ================= CONFIG ================= */

const POINTS_PER_TOKEN = 10000;

const MIN_WITHDRAW = 100;
const MAX_WITHDRAW = 500;

const DAILY_LIMIT = 24 * 60 * 60 * 1000;

/* ================= STATE ================= */

let wallet = "";
let totalPoints = 0;

let lastWithdraw = 0;

/* ================= STORAGE ================= */

function saveData(){

if(!wallet) return;

localStorage.setItem(wallet, JSON.stringify({

points: totalPoints,
lastWithdraw: lastWithdraw

}));

}

function loadData(address){

let data = localStorage.getItem(address);

if(data){

let obj = JSON.parse(data);

totalPoints = obj.points || 0;
lastWithdraw = obj.lastWithdraw || 0;

}else{

totalPoints = 0;
lastWithdraw = 0;

}

}

/* ================= UI ================= */

function set(id,val){

let el=document.getElementById(id);

if(el) el.innerText=val;

}

function updateUI(){

if(!wallet){

set("totalPoints",0);
set("totalTokens","0.0000");
set("userId","guest");

return;

}

set("totalPoints", totalPoints);

set(
"totalTokens",
(totalPoints / POINTS_PER_TOKEN).toFixed(4)
);

set(
"userId",
wallet.slice(0,6) + "..." + wallet.slice(-4)
);

}

/* ================= TAP ================= */

function tap(){

if(!wallet){

alert("Connect wallet first");
return;

}

totalPoints++;

updateUI();

saveData();

/* ================= AUTO PAYOUT ================= */

let tokens = totalPoints / POINTS_PER_TOKEN;

let now = Date.now();

/* daily cooldown */
if(now - lastWithdraw < DAILY_LIMIT){
return;
}

/* min requirement */
if(tokens >= MIN_WITHDRAW){

let payout = tokens;

/* max cap */
if(payout > MAX_WITHDRAW){
payout = MAX_WITHDRAW;
}

/* save payout time */
lastWithdraw = now;

/* reset after payout */
totalPoints = 0;

updateUI();

saveData();

alert(

"✅ AUTO PAYOUT SUCCESS\n\n" +

"Payout: " +
payout.toFixed(4) +
" PVLT\n\n" +

"Wallet:\n" +
wallet +

"\n\nNext payout available in 24 hours"

);

}

}

/* ================= CONNECT/DISCONNECT ================= */

function toggleWallet(){

let input = document
.getElementById("wallet");

let btn = document
.getElementById("walletBtn");

let status = document
.getElementById("walletStatus");

/* CONNECT */
if(!wallet){

let addr = input.value.trim();

/* validate */
if(
!addr.startsWith("0x") ||
addr.length !== 42
){

alert("Invalid BSC wallet");
return;

}

wallet = addr;

loadData(wallet);

btn.innerText = "DISCONNECT WALLET";

status.style.display = "block";

updateUI();

alert("Wallet connected");

}

/* DISCONNECT */
else{

saveData();

wallet = "";

totalPoints = 0;

btn.innerText = "CONNECT WALLET";

status.style.display = "none";

input.value = "";

updateUI();

alert("Wallet disconnected");

}

}

/* ================= INIT ================= */

window.addEventListener(
"DOMContentLoaded",
updateUI
);

</script>

</body>

</html>
