<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PEPEVOLT BOT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #050f1e; font-family: Arial, sans-serif; color: white; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; align-items: center; padding: 20px 0; }
        
        .topbar { width: 90%; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; }
        .main-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; gap: 25px; width: 100%; }
        
        .character-btn { background: none; border: none; cursor: pointer; outline: none; border-radius: 50%; transition: transform 0.05s; }
        .character-btn:active { transform: scale(0.95); }
        .character-btn img { width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 0 40px rgba(0, 255, 153, 0.3); }
        
        .ui-card { width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
        .address-display { width: 100%; padding: 14px; border-radius: 12px; background: #0a182c; color: #8fa3bf; border: none; font-size: 14px; text-align: center; font-weight: bold; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 15px; font-weight: bold; color: black; cursor: pointer; background: linear-gradient(90deg, #00ff99, #00ccff); transition: opacity 0.2s; }
        .btn:active { opacity: 0.9; }
        .btn-withdraw { background: linear-gradient(90deg, #ffcc00, #ff3300); color: white; }
        
        .footer-rules { font-size: 11px; line-height: 1.6; color: #697d95; text-align: center; }
    </style>
</head>
<body>

<div class="topbar">
    <div>🛢️ <span id="energy">9787</span></div>
    <div>⚡ <span id="points">265</span></div>
    <div>💎 <span id="pvltg">0.0000</span></div>
</div>

<div class="main-container">
    <button class="character-btn" onclick="handleTap()">
        <img src="images/IMG_1850.png" alt="PepeVolt">
    </button>
    <div class="ui-card">
        <input class="address-display" id="walletDisplay" value="Wallet Not Connected" readonly>
        <button class="btn" id="connectBtn" onclick="toggleWalletConnection()">CONNECT WALLET</button>
        <button class="btn" onclick="triggerBuyEnergy()">BUY ENERGY</button>
        <button class="btn" onclick="swapPoints()">SWAP POINTS → PVLTG</button>
        <button class="btn btn-withdraw" onclick="triggerWithdrawal()">WITHDRAWAL PVLT</button>
    </div>
</div>

<div class="footer-rules">
    1 Tap = 1 Point<br>
    10000 Points = 1 PVLTG<br>
    100 PVLTG = 1 PVLT
</div>

<script>
    const API_URL = "https://pvlt-server.onrender.com"; 
    let walletAddress = "", points = 265, energy = 9787, pvltg = 0;

    function updateUI() {
        document.getElementById("energy").innerText = energy;
        document.getElementById("points").innerText = points;
        document.getElementById("pvltg").innerText = Number(pvltg).toFixed(4);
    }

    async function toggleWalletConnection() {
        if (walletAddress) {
            walletAddress = "";
            document.getElementById("walletDisplay").value = "Wallet Not Connected";
            document.getElementById("connectBtn").innerText = "CONNECT WALLET";
            return;
        }
        if (window.ethereum) {
            await window.ethereum.request({ method: "eth_requestAccounts" });
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            walletAddress = await provider.getSigner().getAddress();
            document.getElementById("walletDisplay").value = walletAddress.slice(0,6) + "..." + walletAddress.slice(-4);
            document.getElementById("connectBtn").innerText = "DISCONNECT";
            
            const res = await fetch(`${API_URL}/user`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ wallet: walletAddress })
            });
            const data = await res.json();
            points = data.points; energy = data.energy; pvltg = data.pvltg;
            updateUI();
        }
    }

    async function handleTap() {
        if (!walletAddress) return;
        const res = await fetch(`${API_URL}/tap`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet: walletAddress })
        });
        const data = await res.json();
        points = data.points; energy = data.energy;
        updateUI();
    }

    async function triggerBuyEnergy() {
        if (!walletAddress) return;
        const res = await fetch(`${API_URL}/buy-energy`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet: walletAddress })
        });
        const data = await res.json();
        energy = data.energy;
        updateUI();
    }

    async function swapPoints() {
        if (!walletAddress) return;
        const res = await fetch(`${API_URL}/swap-points`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet: walletAddress })
        });
        const data = await res.json();
        if (data.error) return alert(data.error);
        pvltg = data.pvltg; points = data.remainingPoints;
        updateUI();
    }

    async function triggerWithdrawal() {
        if (!walletAddress) return alert("Connect wallet first");
        if (pvltg < 100) return alert("Need minimum 100 PVLTG to withdraw");

        const res = await fetch(`${API_URL}/withdraw-pvltg`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet: walletAddress })
        });
        const data = await res.json();
        if (data.error) return alert(data.error);
        pvltg = 0;
        updateUI();
        alert("Withdrawal complete! Converted PVLT transferred directly to your wallet.");
    }
</script>
</body>
</html>
