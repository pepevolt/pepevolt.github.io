<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt | Connect</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f0f12;
            font-family: sans-serif;
        }
        #connect-button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #3b82f6;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        #connect-button:hover {
            background-color: #2563eb;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <button id="connect-button">Connect Wallet</button>

    <script type="module">
        import { createAppKit } from 'https://cdn.jsdelivr.net/npm/@reown/appkit@latest/+esm'
        import { EthersAdapter } from 'https://cdn.jsdelivr.net/npm/@reown/appkit-adapter-ethers@latest/+esm'
        import { mainnet } from 'https://cdn.jsdelivr.net/npm/@reown/appkit/networks@latest/+esm'

        // 1. Get your Project ID from https://cloud.reown.com/
        const projectId = '1731f99148b9cf6107dee70b6efb14b7'

        // 2. Metadata (Must match your site)
        const metadata = {
            name: 'PepeVolt',
            description: 'Connect to your wallet',
            url: 'https://pepevolt.github.io', 
            icons: ['https://avatars.githubusercontent.com/u/37784886']
        }

        // 3. Create Modal Instance
        const modal = createAppKit({
            adapters: [new EthersAdapter()],
            networks: [mainnet],
            metadata,
            projectId,
            features: {
                analytics: true 
            }
        })

        // 4. Attach event
        document.getElementById('connect-button').addEventListener('click', () => {
            modal.open()
        })
    </script>
</body>
</html>
