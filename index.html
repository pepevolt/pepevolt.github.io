<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #0f172a; 
            color: white; 
            font-family: sans-serif; 
            height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .app-container { 
            width: 90%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
        }
        /* Top Stats Row */
        .stats { 
            display: flex; 
            justify-content: space-around; 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 12px;
            margin-bottom: 20px;
        }
        /* Big Circle Button */
        .tap-btn { 
            width: 200px; 
            height: 200px; 
            border-radius: 50%; 
            border: none; 
            background: #334155; 
            color: #38bdf8; 
            font-size: 24px; 
            font-weight: bold; 
            cursor: pointer; 
            margin: 0 auto 20px auto; 
            display: block;
        }
        /* General Buttons */
        .action-btn { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: none; 
            background: #3b82f6; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .green-btn { background: #10b981; }
        
        /* Progress Bar */
        .progress-container { width: 100%; height: 20px; background: #1e293b; border-radius: 10px; }
        .progress-fill { width: 45%; height: 100%; background: #10b981; border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="stats">
        <div>⚡ 21</div>
        <div>💎 63</div>
        <div>🌕 5.00</div>
    </div>

    <button class="tap-btn" onclick="tap()">TAP!</button>

    <button class="action-btn" onclick="disconnect()">Disconnect</button>
    <button class="action-btn green-btn" onclick="buyEnergy()">Buy 10,000 Energy (100 PVLT)</button>
    
    <div class="progress-container"><div class="progress-fill"></div></div>
    
    <button class="action-btn green-btn" onclick="convert()">Convert</button>
    <button class="action-btn green-btn" onclick="claim()">Claim</button>
</div>

<script>
    function tap() { console.log("Tapping..."); }
    function disconnect() { console.log("Disconnecting..."); }
    function buyEnergy() { console.log("Buying..."); }
    function convert() { console.log("Converting..."); }
    function claim() { console.log("Claiming..."); }
</script>
</body>
</html>
