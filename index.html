<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PVLT Tap Game</title>

<style>

html, body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
touch-action:none;
-webkit-text-size-adjust:100%;
}

body{
font-family:Arial;
background:radial-gradient(circle at top,#0b1220,#020617);
color:white;
position:fixed;
width:100%;
text-align:center;
}

.navbar{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;

background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:12px;
}

.container{
position:absolute;
top:60px;
left:0;
right:0;
bottom:0;

display:flex;
flex-direction:column;
align-items:center;

padding:15px;
gap:14px;
overflow:hidden;
}

h2{
margin:5px 0;
font-size:24px;
background:linear-gradient(90deg,#00ff99,#00ccff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tap{
width:190px;
height:190px;
border-radius:50%;
border:none;
background:linear-gradient(135deg,#00ff99,#00ccff);
font-size:24px;
font-weight:bold;
color:black;
box-shadow:0 0 30px rgba(0,255,200,0.35);
}

.liveBox{
font-size:15px;
font-weight:bold;
}

.card{
width:90%;
max-width:360px;
padding:14px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:14px;
display:flex;
flex-direction:column;
gap:10px;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:rgba(0,0,0,0.35);
color:white;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-weight:bold;
background:linear-gradient(90deg,#00ff99,#00ccff);
color:black;
}

.status{
font-size:12px;
color:#00ff99;
display:none;
}

</style>

</head>

<body>

<div class="navbar" id="navbar" style="display:none;">

<div>⚡ POINTS: <span id="totalPoints">0</span></div>

<div>💎 TOKEN: <span id="totalTokens">0.0000</span></div>

<div>👤 <span id="userId">guest</span></div>

</div>

<div class="container">

<h2>PVLT TAP GAME</h2>

<button class="tap" onclick="tap()">TAP</button>

<div class="liveBox">
SESSION POINTS: <span id="sessionPoints">0</span>
</div>

<div class="liveBox">
SESSION TOKENS: <span id="sessionTokens">0.0000</span>
</div>

<div class="card">

<input id="wallet" placeholder="Paste BSC wallet address">

<button id="walletBtn" onclick="toggleWallet()">CONNECT WALLET</button>

<div id="walletStatus" class="status">Wallet connected</div>

</div>

</div>

<script>

const POINTS_PER_TOKEN = 10000;

let wallet = "";

let totalPoints = 0;
let totalTokens = 0;

let sessionPoints = 0;
let sessionTokens = 0;

let tapTimer = null;

/* STORAGE KEY PER WALLET */
function key(){
return "PVLT_USER_" + wallet.toLowerCase();
}

/* SAVE */
function saveData(){
if(!wallet) return;
localStorage.setItem(key(), JSON.stringify({
totalPoints,
totalTokens
}));
}

/* LOAD */
function loadData(){
let raw = localStorage.getItem(key());
if(raw){
let d = JSON.parse(raw);
totalPoints = d.totalPoints || 0;
totalTokens = d.totalTokens || 0;
}else{
totalPoints = 0;
totalTokens = 0;
}
}

/* UI */
function set(id,val){
let el = document.getElementById(id);
if(el) el.innerText = val;
}

function updateUI(){

if(!wallet){
document.getElementById("navbar").style.display = "none";
return;
}

document.getElementById("navbar").style.display = "flex";

set("totalPoints", totalPoints);
set("totalTokens", totalTokens.toFixed(4));

set("sessionPoints", sessionPoints);
set("sessionTokens", sessionTokens.toFixed(4));

set("userId", wallet.slice(0,6)+"..."+wallet.slice(-4));
}

/* CONNECT ONLY MANUAL */
function toggleWallet(){

let input = document.getElementById("wallet");
let btn = document.getElementById("walletBtn");
let status = document.getElementById("walletStatus");

if(!wallet){

let addr = input.value.trim().toLowerCase();

if(!addr.startsWith("0x") || addr.length !== 42){
alert("Invalid wallet");
return;
}

wallet = addr;

loadData();

sessionPoints = 0;
sessionTokens = 0;

btn.innerText = "DISCONNECT WALLET";
status.style.display = "block";

updateUI();

}else{

saveData();

wallet = "";

sessionPoints = 0;
sessionTokens = 0;

totalPoints = 0;
totalTokens = 0;

input.value = "";

btn.innerText = "CONNECT WALLET";
status.style.display = "none";

updateUI();

}

}

/* SESSION RESET */
function resetSession(){

totalPoints += sessionPoints;
totalTokens = totalPoints / POINTS_PER_TOKEN;

sessionPoints = 0;
sessionTokens = 0;

saveData();
updateUI();

}

/* TAP */
function tap(){

if(!wallet){
alert("Connect wallet first");
return;
}

clearTimeout(tapTimer);

sessionPoints++;
sessionTokens = sessionPoints / POINTS_PER_TOKEN;

updateUI();

tapTimer = setTimeout(()=>{
resetSession();
},3000);

}

/* INIT (IMPORTANT FIX: NO AUTO RESTORE) */
window.addEventListener("DOMContentLoaded", ()=>{
updateUI();
});

</script>

</body>
</html>
