<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>PVLT Tap Game</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020b18;
    font-family:Arial,sans-serif;
    color:white;
}

/* ================= BODY ================= */

body{
    display:flex;
    flex-direction:column;
}

/* ================= TOP BAR ================= */

.topbar{
    width:100%;
    padding:14px 18px;
    background:#091426;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    font-weight:bold;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
    overflow-y:auto;
}

/* ================= TAP BUTTON ================= */

.tapBtn{
    width:240px;
    height:240px;
    border:none;
    border-radius:50%;
    overflow:hidden;
    margin-top:20px;
    background:linear-gradient(
    135deg,
    #00ff99,
    #00ccff);

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 0 30px rgba(0,255,180,0.25);

    cursor:pointer;
    touch-action:manipulation;
}

.tapBtn:active{
    transform:scale(0.96);
}

.tapBtn img{
    width:78%;
    height:78%;
    object-fit:contain;
    pointer-events:none;
}

/* ================= CARD ================= */

.card{
    width:100%;
    max-width:380px;
    margin-top:28px;

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:18px;

    padding:18px;

    display:flex;
    flex-direction:column;
    gap:14px;
}

/* ================= INPUT ================= */

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#0c1628;
    color:white;
    font-size:14px;
    outline:none;
}

/* ================= BUTTON ================= */

.actionBtn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;

    background:
    linear-gradient(
    90deg,
    #00ff99,
    #00ccff);

    color:black;
    cursor:pointer;
}

/* ================= STATUS ================= */

.status{
    text-align:center;
    font-size:12px;
    opacity:0.8;
    display:none;
}

/* ================= INFO ================= */

.info{
    margin-top:16px;
    font-size:12px;
    line-height:1.7;
    opacity:0.8;
    text-align:center;
    max-width:380px;
}

/* ================= FLOAT ================= */

.float{
    position:fixed;
    color:white;
    font-weight:bold;
    pointer-events:none;
    animation:floatUp 1s linear forwards;
    z-index:9999;
}

@keyframes floatUp{
    0%{
        opacity:1;
        transform:translateY(0);
    }

    100%{
        opacity:0;
        transform:translateY(-70px);
    }
}

/* ================= MODAL ================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.82);

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:9999;

    opacity:0;
    pointer-events:none;

    transition:0.25s;
}

.modal-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.modal-box{
    width:92%;
    max-width:360px;

    background:#111827;

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:22px;

    padding:22px;
}

.modal-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}

.wallet-option{
    width:100%;
    padding:16px;
    margin-bottom:12px;

    border:none;
    border-radius:14px;

    background:#1f2937;

    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:pointer;
}

.wallet-option:last-child{
    margin-bottom:0;
}

.badge{
    font-size:11px;
    opacity:0.7;
}

</style>
</head>

<body>

<div class="topbar">

    <div>
        🔋 <span id="energy">50</span>
    </div>

    <div>
        ⚡ <span id="points">0</span>
    </div>

    <div>
        💎 <span id="pvltg">0.0000</span>
    </div>

</div>

<div class="main">

    <button class="tapBtn" onclick="tap(event)">
        <img src="https://i.imgur.com/8Km9tLL.png">
    </button>

    <div class="card">

        <input
        id="walletInput"
        placeholder="Connect Polygon Wallet"
        readonly>

        <button
        class="actionBtn"
        onclick="openWalletModal()">

            CONNECT WALLET

        </button>

        <div
        class="status"
        id="walletStatus">

            Wallet Connected

        </div>

        <button
        class="actionBtn">

            BUY ENERGY

        </button>

        <button
        class="actionBtn">

            SWAP POINTS → PVLTG

        </button>

        <button
        class="actionBtn">

            CLAIM PVLT

        </button>

    </div>

    <div class="info">

        1 Tap = 1 Point<br>
        10000 Points = 1 PVLTG<br>
        100 PVLTG = 1 PVLT

    </div>

</div>

<div
class="modal-overlay"
id="walletModal">

    <div class="modal-box">

        <div class="modal-title">
            Connect Wallet
        </div>

        <button
        class="wallet-option"
        onclick="connectWalletConnect()">

            <span>Connect with WalletConnect</span>

        </button>

    </div>

</div>

<script>

/* ================= CONFIG ================= */

const API =
"https://pvlt-server.onrender.com"

const PROJECT_ID =
"1731f99148b9cf6107dee70b6efb14b7"

/* ================= STATE ================= */

let web3Provider
let wallet = ""

let points = 0
let energy = 50
let pvltg = 0

/* ================= UI ================= */

function updateUI(){

    document
    .getElementById("energy")
    .innerText = energy

    document
    .getElementById("points")
    .innerText = points

    document
    .getElementById("pvltg")
    .innerText =
    Number(pvltg).toFixed(4)
}

/* ================= MODAL ================= */

function openWalletModal(){

    document
    .getElementById("walletModal")
    .classList.add("active")
}

function closeWalletModal(){

    document
    .getElementById("walletModal")
    .classList.remove("active")
}

/* ================= METAMASK ================= */

async function connectMetaMask(){

    try{

        if(!window.ethereum){

            alert("Install MetaMask")

            return
        }

        await window.ethereum.request({
            method:"eth_requestAccounts"
        })

        web3Provider =
        new ethers.providers.Web3Provider(
            window.ethereum
        )

        const signer =
        web3Provider.getSigner()

        wallet =
        await signer.getAddress()

        walletConnected()

    }catch(err){

        console.log(err)

        alert(
            "MetaMask connection failed"
        )
    }
}

/* ================= WALLETCONNECT ================= */

async function connectWalletConnect(){

    try{

        const WalletConnectProvider =
        window["@walletconnect/ethereum-provider"]
        .EthereumProvider

        const wcProvider =
        await WalletConnectProvider.init({

            projectId:
            PROJECT_ID,

            chains:[137],

            showQrModal:true,

            methods:[
                "eth_sendTransaction",
                "personal_sign",
                "eth_signTypedData"
            ],

            optionalMethods:[
                "eth_accounts",
                "eth_requestAccounts",
                "eth_chainId"
            ],

            rpcMap:{
                137:
                "https://polygon-rpc.com"
            },

            metadata:{
                name:"PepeVolt",

                description:
                "PepeVolt Game",

                url:
                window.location.origin,

                icons:[
                    "https://cdn-icons-png.flaticon.com/512/825/825508.png"
                ]
            }

        })

        await wcProvider.connect()

        web3Provider =
        new ethers.providers.Web3Provider(
            wcProvider
        )

        const signer =
        web3Provider.getSigner()

        wallet =
        await signer.getAddress()

        walletConnected()

    }catch(err){

        console.log(err)

        alert(
            "WalletConnect failed"
        )
    }
}

/* ================= WALLET CONNECTED ================= */

async function walletConnected(){

    closeWalletModal()

    document
    .getElementById("walletInput")
    .value =
    wallet.slice(0,6)
    +"..."
    +wallet.slice(-4)

    document
    .getElementById("walletStatus")
    .style.display = "block"

    try{

        const res =
        await fetch(API+"/user",{

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
                wallet
            })

        })

        const data =
        await res.json()

        points =
        data.points || 0

        energy =
        data.energy || 50

        pvltg =
        data.pvltg || 0

        updateUI()

    }catch(err){

        console.log(err)
    }
}

/* ================= TAP ================= */

async function tap(e){

    if(!wallet){

        alert(
            "Connect wallet first"
        )

        return
    }

    if(energy <= 0){

        alert("No Energy")

        return
    }

    try{

        const res =
        await fetch(API+"/tap",{

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
                wallet
            })

        })

        const data =
        await res.json()

        if(data.error){

            alert(data.error)

            return
        }

        points =
        data.points

        energy =
        data.energy

        updateUI()

        const f =
        document.createElement("div")

        f.className = "float"

        f.innerText = "+1"

        f.style.left =
        e.clientX + "px"

        f.style.top =
        e.clientY + "px"

        document.body.appendChild(f)

        setTimeout(()=>{
            f.remove()
        },1000)

    }catch(err){

        console.log(err)

        alert("Tap failed")
    }
}

/* ================= ENERGY REGEN ================= */

setInterval(()=>{

    if(energy < 50){

        energy++

        updateUI()
    }

},30000)

/* ================= START ================= */

updateUI()

</script>

</body>
</html>
