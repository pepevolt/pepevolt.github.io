<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PVLT Tap Game</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.js"></script>

<style>
body{margin:0;background:#020b18;color:white;font-family:Arial;text-align:center}
button{padding:14px;margin:8px;border:none;border-radius:10px;font-weight:bold}
input{padding:12px;width:80%;border-radius:10px;text-align:center}
.btn{background:linear-gradient(90deg,#00ff99,#00ccff)}
.swap{background:linear-gradient(90deg,#ffcc00,#ff6600)}
.danger{background:linear-gradient(90deg,#ff3333,#990000)}
</style>
</head>

<body>

<h2>PVLT TAP GAME</h2>

<input id="walletInput" value="Wallet Not Connected" readonly />
<br>

<button class="btn" onclick="connectWallet()" id="connectBtn">
CONNECT WALLET
</button>

<br>

<button class="btn" onclick="tap()">TAP</button>
<button class="swap" onclick="swapPoints()">SWAP</button>
<button class="danger" onclick="claimPVLT()">CLAIM</button>

<script>

/* ================= CONFIG ================= */

const API = "https://pvlt-server.onrender.com";

let wallet = "";
let provider, signer;

/* game state */
let points = 0;
let energy = 50;
let pvltg = 0;

/* ================= UI UPDATE ================= */

function updateUI(){
  document.getElementById("walletInput").value =
    wallet ? wallet.slice(0,6)+"..."+wallet.slice(-4) : "Wallet Not Connected";
}

/* ================= CONNECT WALLET ================= */

async function connectWallet(){

try{

if(window.ethereum){

await window.ethereum.request({method:"eth_requestAccounts"});

provider = new ethers.providers.Web3Provider(window.ethereum);

}else{

const wc = window["@walletconnect/ethereum-provider"].EthereumProvider;

const wcProvider = await wc.init({
projectId: "1731f99148b9cf6107dee70b6efb14b7",
chains:[137],
showQrModal:true
});

await wcProvider.enable();

provider = new ethers.providers.Web3Provider(wcProvider);
}

signer = provider.getSigner();
wallet = await signer.getAddress();

updateUI();

/* LOAD USER SAFE */
const res = await fetch(API+"/user",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({wallet})
});

const data = await res.json();

points = data.points || 0;
energy = data.energy || 50;
pvltg = data.pvltg || 0;

alert("Wallet Connected");

}catch(err){
console.log(err);
alert("Wallet connection failed");
}

}

/* ================= TAP ================= */

async function tap(){

try{

if(!wallet){
alert("Connect wallet first");
return;
}

const res = await fetch(API+"/tap",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({wallet})
});

const data = await res.json();

if(data.error){
alert(data.error);
return;
}

points = data.points;
energy = data.energy;

}catch(err){
console.log("TAP ERROR",err);
alert("Tap failed (server error)");
}

}

/* ================= SWAP ================= */

async function swapPoints(){

try{

if(!wallet){
alert("Connect wallet first");
return;
}

const res = await fetch(API+"/swap-points",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({wallet})
});

const data = await res.json();

if(data.error){
alert(data.error);
return;
}

pvltg = data.pvltg;
points = 0;

alert("Swap successful");

}catch(err){
console.log("SWAP ERROR",err);
alert("Swap failed (server error)");
}

}

/* ================= CLAIM ================= */

async function claimPVLT(){

try{

if(!wallet){
alert("Connect wallet first");
return;
}

const res = await fetch(API+"/claim-pvltg",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({wallet})
});

const data = await res.json();

if(data.error){
alert(data.error);
return;
}

pvltg = 0;

alert("Claim success");

}catch(err){
console.log("CLAIM ERROR",err);
alert("Claim failed");
}

}

</script>

</body>
</html>
