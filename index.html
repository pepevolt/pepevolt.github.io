<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>PVLT TapTap Game</title>

<style>

html,body{
margin:0;
padding:0;
overflow:hidden;
font-family:Arial;
background:#08111f;
color:white;
height:100%;
}

body{
display:flex;
flex-direction:column;
}

/* ================= NAVBAR ================= */

.nav{

display:flex;
justify-content:space-between;
align-items:center;

padding:14px;

background:#101b2e;

font-size:12px;

border-bottom:
1px solid rgba(255,255,255,0.08);

}

/* ================= MAIN ================= */

.container{

flex:1;

display:flex;
flex-direction:column;

align-items:center;

padding:20px;

overflow:hidden;

}

/* ================= TITLE ================= */

.title{

font-size:26px;
font-weight:bold;

margin-top:10px;

background:
linear-gradient(90deg,#00ff99,#00ccff);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* ================= TAP BUTTON ================= */

.tapBtn{

width:220px;
height:220px;

border-radius:50%;

border:none;

margin-top:40px;

font-size:30px;
font-weight:bold;

color:black;

background:
linear-gradient(135deg,#00ff99,#00ccff);

box-shadow:
0 0 40px rgba(0,255,200,0.25);

transition:0.1s;

}

.tapBtn:active{

transform:scale(0.95);

}

/* ================= SESSION ================= */

.session{

margin-top:20px;

font-size:14px;

opacity:0.85;

}

/* ================= CARD ================= */

.card{

width:90%;
max-width:360px;

margin-top:20px;

padding:15px;

border-radius:16px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.06);

}

/* ================= INPUT ================= */

input{

width:100%;

padding:14px;

border:none;
outline:none;

border-radius:12px;

background:#111827;

color:white;

font-size:14px;

box-sizing:border-box;

}

/* ================= BUTTON ================= */

.actionBtn{

width:100%;

padding:14px;

margin-top:10px;

border:none;

border-radius:12px;

font-weight:bold;

background:
linear-gradient(90deg,#00ff99,#00ccff);

color:black;

}

/* ================= INFO ================= */

.info{

font-size:12px;

opacity:0.7;

line-height:1.6;

}

/* ================= STATUS ================= */

.status{

margin-top:10px;

font-size:12px;

color:#00ff99;

display:none;

}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="nav">

<div>
⚡ POINTS:
<span id="points">0</span>
</div>

<div>
💎 TOKENS:
<span id="tokens">0.0000</span>
</div>

<div>
👤 <span id="walletView">guest</span>
</div>

</div>

<!-- ================= MAIN ================= -->

<div class="container">

<div class="title">
PVLT TAP TAP
</div>

<button
class="tapBtn"
onclick="tapTap()"
>
TAP
</button>

<div class="session">

SESSION POINTS:
<span id="sessionPoints">0</span>

<br><br>

SESSION TOKENS:
<span id="sessionTokens">0.0000</span>

</div>

<!-- ================= WALLET ================= -->

<div class="card">

<input
id="wallet"
placeholder="Paste BSC wallet address"
>

<button
class="actionBtn"
id="walletBtn"
onclick="connectWallet()"
>
CONNECT WALLET
</button>

<div
id="walletStatus"
class="status"
>
Wallet connected
</div>

</div>

<!-- ================= INFO ================= -->

<div class="card">

<div class="info">

1 Tap = 1 Point
<br><br>

10,000 Points = 1 PVLT
<br><br>

Minimum Claim:
100 PVLT
<br>

Maximum Claim:
500 PVLT
<br><br>

Claim Cooldown:
24 Hours

</div>

</div>

<!-- ================= CLAIM ================= -->

<button
class="actionBtn"
onclick="claimTokens()"
style="width:90%;max-width:360px;"
>
CLAIM TOKENS
</button>

</div>

<script>

/* ================= API ================= */

const API =
"https://pvlt-server.onrender.com";

/* ================= CONFIG ================= */

const POINTS_PER_TOKEN = 10000;

const SESSION_TIMEOUT = 3000;

/* ================= STATE ================= */

let wallet = "";

let sessionPoints = 0;

let sessionTimer = null;

/* ================= UI ================= */

function set(id,val){

document
.getElementById(id)
.innerText = val;

}

/* ================= CONNECT ================= */

async function connectWallet(){

/* DISCONNECT */

if(wallet){

wallet = "";

set("walletView","guest");

set("points",0);

set("tokens","0.0000");

set("sessionPoints",0);

set("sessionTokens","0.0000");

document
.getElementById("wallet")
.value = "";

document
.getElementById("walletBtn")
.innerText =
"CONNECT WALLET";

document
.getElementById("walletStatus")
.style.display = "none";

return;

}

/* CONNECT */

let w =
document
.getElementById("wallet")
.value
.trim();

if(
!w.startsWith("0x") ||
w.length !== 42
){

alert("Invalid BSC wallet");

return;

}

wallet = w.toLowerCase();

let res = await fetch(

API + "/connect",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
wallet
})

}

);

let data = await res.json();

if(data.success){

set(
"walletView",
wallet.slice(0,6) +
"..." +
wallet.slice(-4)
);

set("points",data.points);

set("tokens",data.tokens);

document
.getElementById("walletBtn")
.innerText =
"DISCONNECT WALLET";

document
.getElementById("walletStatus")
.style.display = "block";

}

}

/* ================= TAP ================= */

async function tapTap(){

if(!wallet){

alert("Connect wallet first");

return;

}

/* SESSION */

sessionPoints++;

set(
"sessionPoints",
sessionPoints
);

set(

"sessionTokens",

(sessionPoints /
POINTS_PER_TOKEN)
.toFixed(4)

);

/* API */

let res = await fetch(

API + "/mine",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
wallet
})

}

);

let data = await res.json();

if(data.success){

/* TOTAL NAVBAR */

set("points",data.points);

set("tokens",data.tokens);

}

/* RESET TIMER */

clearTimeout(sessionTimer);

sessionTimer =
setTimeout(()=>{

sessionPoints = 0;

set("sessionPoints",0);

set("sessionTokens","0.0000");

}, SESSION_TIMEOUT);

}

/* ================= CLAIM ================= */

async function claimTokens(){

if(!wallet){

alert("Connect wallet");

return;

}

let res = await fetch(

API + "/claim",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
wallet
})

}

);

let data = await res.json();

alert(data.message);

if(data.success){

set("points",0);

set("tokens","0.0000");

set("sessionPoints",0);

set("sessionTokens","0.0000");

}

}

</script>

</body>

</html>
