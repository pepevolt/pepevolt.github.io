<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PVLT Tap Game</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#020b18;
font-family:Arial,sans-serif;
color:white;
touch-action:manipulation;
}

body{
display:flex;
flex-direction:column;
}

.topbar{
width:100%;
padding:14px 18px;
background:#091426;
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
font-weight:bold;
}

.main{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
overflow-y:auto;
}

.tapBtn{
width:240px;
height:240px;
border:none;
border-radius:50%;
margin-top:20px;
background:
linear-gradient(
135deg,
#00ff99,
#00ccff
);
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
font-weight:800;
color:#021018;
box-shadow:
0 0 40px rgba(0,255,180,0.3);
cursor:pointer;
transition:0.08s;
}

.tapBtn:active{
transform:scale(0.95);
}

.card{
width:100%;
max-width:380px;
margin-top:28px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:18px;
display:flex;
flex-direction:column;
gap:14px;
}

.wallet{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#0c1628;
color:white;
font-size:14px;
text-align:center;
}

.actionBtn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
background:
linear-gradient(
90deg,
#00ff99,
#00ccff
);
color:black;
cursor:pointer;
}

.actionBtn:active{
transform:scale(0.98);
}

.info{
margin-top:16px;
font-size:12px;
line-height:1.7;
opacity:0.8;
text-align:center;
max-width:380px;
}

</style>

</head>

<body>

<div class="topbar">

<div>
🔋 <span id="energy">0</span>
</div>

<div>
⚡ <span id="points">0</span>
</div>

<div>
💎 <span id="gpvlt">0</span>
</div>

</div>

<div class="main">

<button
class="tapBtn"
id="tapBtn"
>
TAP
</button>

<div class="card">

<div
class="wallet"
id="walletDisplay"
>
NOT CONNECTED
</div>

<button
class="actionBtn"
id="connectBtn"
>
CONNECT WALLET
</button>

<button
class="actionBtn"
id="refillBtn"
>
REFILL ENERGY
</button>

<button
class="actionBtn"
id="convertBtn"
>
CONVERT POINTS
</button>

<button
class="actionBtn"
id="claimBtn"
>
CLAIM PVLT
</button>

</div>

<div class="info">
10 Points = 1 gPVLT<br>
10 gPVLT = 1 PVLT
</div>

</div>

<script>

const GAME_ADDRESS =
"0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

const TREASURY_ADDRESS =
"0x4251Ef24D10bf637494C173621F5f84262e9Bda5";

const GAME_ABI = [

"function tap() external",

"function refillEnergy() external",

"function convertPoints() external",

"function players(address) view returns(uint256 energy,uint256 points,uint256 burnedGPVLT,bool paidUser,uint256 lastClaimDay)"

];

const TREASURY_ABI = [

"function claimRewards() external"

];

let provider;
let signer;
let game;
let treasury;
let wallet;

const energyEl =
document.getElementById("energy");

const pointsEl =
document.getElementById("points");

const gpvltEl =
document.getElementById("gpvlt");

const walletDisplay =
document.getElementById("walletDisplay");

async function connectWallet(){

try{

if(!window.ethereum){

alert("Install MetaMask");

return;

}

await window.ethereum.request({
method:"eth_requestAccounts"
});

provider =
new ethers.providers.Web3Provider(
window.ethereum
);

const network =
await provider.getNetwork();

if(network.chainId !== 137){

await window.ethereum.request({
method:"wallet_switchEthereumChain",
params:[{
chainId:"0x89"
}]
});

}

signer =
provider.getSigner();

wallet =
await signer.getAddress();

walletDisplay.innerText =
wallet.slice(0,6) +
"..." +
wallet.slice(-4);

game =
new ethers.Contract(
GAME_ADDRESS,
GAME_ABI,
signer
);

treasury =
new ethers.Contract(
TREASURY_ADDRESS,
TREASURY_ABI,
signer
);

loadPlayer();

}catch(err){

console.log(err);

alert(
err.message || "Wallet connection failed"
);

}

}

async function loadPlayer(){

if(!game || !wallet) return;

try{

const data =
await game.players(wallet);

energyEl.innerText =
Number(data.energy);

pointsEl.innerText =
Number(data.points);

gpvltEl.innerText =
Number(data.burnedGPVLT);

}catch(err){

console.log(err);

}

}

async function tapGame(){

if(!game){

alert("Connect wallet first");

return;

}

try{

const tx =
await game.tap();

await tx.wait();

loadPlayer();

}catch(err){

console.log(err);

alert("Tap failed");

}

}

async function refillEnergy(){

if(!game){

alert("Connect wallet first");

return;

}

try{

const tx =
await game.refillEnergy();

await tx.wait();

loadPlayer();

}catch(err){

console.log(err);

alert("Refill failed");

}

}

async function convertPoints(){

if(!game){

alert("Connect wallet first");

return;

}

try{

const tx =
await game.convertPoints();

await tx.wait();

loadPlayer();

}catch(err){

console.log(err);

alert("Need 10 points");

}

}

async function claimPVLT(){

if(!treasury){

alert("Connect wallet first");

return;

}

try{

const tx =
await treasury.claimRewards();

await tx.wait();

loadPlayer();

alert("PVLT claimed");

}catch(err){

console.log(err);

alert("Claim failed");

}

}

document
.getElementById("connectBtn")
.addEventListener(
"click",
connectWallet
);

document
.getElementById("tapBtn")
.addEventListener(
"click",
tapGame
);

document
.getElementById("refillBtn")
.addEventListener(
"click",
refillEnergy
);

document
.getElementById("convertBtn")
.addEventListener(
"click",
convertPoints
);

document
.getElementById("claimBtn")
.addEventListener(
"click",
claimPVLT
);

window.addEventListener(
"load",
async()=>{

if(window.ethereum){

const accounts =
await ethereum.request({
method:"eth_accounts"
});

if(accounts.length > 0){

connectWallet();

}

}

}
);

</script>

</body>
</html>
