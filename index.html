<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* Modern Dark Theme */
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Stats Bar (Top) */
        .stats-bar {
            background-color: #2c3e50;
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stat-item { text-align: center; }
        .stat-value { color: #2ecc71; font-weight: bold; display: block; margin-top: 5px; }

        /* TAP Button (Center) */
        .tap-circle {
            background-color: #2ecc71;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 60px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 0 #27ae60;
            transition: transform 0.1s;
        }
        .tap-circle:active { transform: scale(0.95); }

        /* Action Buttons (Bottom) */
        .btn-action {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            width: 85%;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item">⚡ Energy <span class="stat-value" id="energy">9,995</span></div>
        <div class="stat-item">💎 Points <span class="stat-value" id="points">5</span></div>
        <div class="stat-item">🪙 gPVLT <span class="stat-value" id="gpvlt">0</span></div>
    </div>

    <div class="tap-circle" onclick="handleTap()">TAP</div>

    <button class="btn-action">Disconnect: 0xBa5B...1DFE</button>
    <button class="btn-action">Buy 10,000 Energy (100 PVLT)</button>
    <button class="btn-action">Convert 10 Points → 1 gPVLT</button>
    <button class="btn-action">Claim Reward (10-1000 gPVLT)</button>

</body>
</html>
