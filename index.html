<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PepeVolt</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body{
      background:#07111f;
      font-family:Arial, sans-serif;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }

    .app{
      width:100%;
      max-width:430px;
      height:100vh;
      background:
      radial-gradient(circle at top,#13213d 0%,#07111f 70%);
      border-radius:30px;
      padding:20px;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(0,255,200,0.15);
    }

    /* TOP NAV */

    .top-nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top:10px;
    }

    .nav-box{
      flex:1;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      padding:12px 10px;
      text-align:center;
      backdrop-filter: blur(10px);
      box-shadow:
      0 0 20px rgba(0,0,0,0.3),
      inset 0 0 10px rgba(255,255,255,0.03);
    }

    .nav-title{
      font-size:12px;
      color:#9fb2d0;
      margin-bottom:5px;
    }

    .nav-value{
      font-size:18px;
      font-weight:bold;
    }

    /* CONNECT */

    .wallet-wrap{
      margin-top:20px;
    }

    #connectBtn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:15px;
      font-size:16px;
      font-weight:bold;
      color:white;
      cursor:pointer;

      background:linear-gradient(
      135deg,
      #00b894,
      #00cec9
      );

      box-shadow:
      0 0 25px rgba(0,255,200,0.3);

      transition:0.2s;
    }

    #connectBtn:active{
      transform:scale(0.98);
    }

    /* TAP AREA */

    .tap-area{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      margin-top:80px;
      margin-bottom:80px;
    }

    .tap-circle{
      width:220px;
      height:220px;
      border-radius:50%;
      position:relative;
      cursor:pointer;

      background:
      radial-gradient(circle at 30% 30%, #ffcc00, #ff8800);

      border:8px solid rgba(255,255,255,0.9);

      display:flex;
      justify-content:center;
      align-items:center;

      box-shadow:
      0 0 60px rgba(255,200,0,0.45),
      inset 0 0 40px rgba(255,255,255,0.15);

      transition:0.1s;
    }

    .tap-circle:active{
      transform:scale(0.94);
    }

    .tap-circle img{
      width:60px;
      height:60px;
      object-fit:contain;
      pointer-events:none;
      user-select:none;
    }

    /* ACTIONS */

    .actions{
      position:absolute;
      bottom:35px;
      left:20px;
      right:20px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .action-btn{
      border:none;
      border-radius:18px;
      padding:16px;
      font-size:16px;
      font-weight:bold;
      color:white;
      cursor:pointer;
      transition:0.2s;
    }

    .action-btn:active{
      transform:scale(0.98);
    }

    .buy{
      background:linear-gradient(135deg,#00b894,#00cec9);
      box-shadow:0 0 25px rgba(0,255,200,0.25);
    }

    .convert{
      background:linear-gradient(135deg,#6c5ce7,#a29bfe);
      box-shadow:0 0 25px rgba(162,155,254,0.25);
    }

    .claim{
      background:linear-gradient(135deg,#fdcb6e,#e17055);
      box-shadow:0 0 25px rgba(253,203,110,0.25);
    }

    /* FLOAT */

    .floating{
      position:absolute;
      color:#fff;
      font-weight:bold;
      pointer-events:none;
      animation:floatUp 1s ease forwards;
      text-shadow:0 0 10px rgba(255,255,255,0.8);
    }

    @keyframes floatUp{
      0%{
        opacity:1;
        transform:translateY(0);
      }
      100%{
        opacity:0;
        transform:translateY(-80px);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- TOP NAV -->

  <div class="top-nav">

    <div class="nav-box">
      <div class="nav-title">⚡ Energy</div>
      <div class="nav-value" id="energy">100</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">💎 gPVLT</div>
      <div class="nav-value" id="gpvlt">0</div>
    </div>

    <div class="nav-box">
      <div class="nav-title">🪙 PVLT</div>
      <div class="nav-value" id="pvlt">0</div>
    </div>

  </div>

  <!-- CONNECT -->

  <div class="wallet-wrap">
    <button id="connectBtn">
      Connect Wallet
    </button>
  </div>

  <!-- TAP -->

  <div class="tap-area">

    <div class="tap-circle" id="tapBtn">

      <img src="https://cdn-icons-png.flaticon.com/512/825/825508.png">

    </div>

  </div>

  <!-- ACTIONS -->

  <div class="actions">

    <button class="action-btn buy">
      Buy
    </button>

    <button class="action-btn convert">
      Convert
    </button>

    <button class="action-btn claim">
      Claim
    </button>

  </div>

</div>

<script type="module">

  import { createAppKit } from 'https://esm.sh/@reown/appkit@latest';
  import { EthersAdapter } from 'https://esm.sh/@reown/appkit-adapter-ethers@latest';
  import { polygon } from 'https://esm.sh/@reown/appkit/networks@latest';

  const projectId = '1731f99148b9cf6107dee70b6efb14b7';

  const modal = createAppKit({
    adapters: [new EthersAdapter()],
    networks: [polygon],

    metadata: {
      name: 'PepeVolt',
      description: 'PepeVolt Game',
      url: 'https://pepevolt.github.io',
      icons: ['https://avatars.githubusercontent.com/u/179229932']
    },

    projectId,
    features: {
      analytics: true
    }
  });

  const connectBtn = document.getElementById('connectBtn');

  connectBtn.addEventListener('click', () => {
    modal.open();
  });

  modal.subscribeState((state) => {

    if(state.isConnected && state.address){

      const address = state.address;

      connectBtn.innerText =
      address.slice(0,6) + "..." +
      address.slice(-4);

    }else{
      connectBtn.innerText = "Connect Wallet";
    }

  });

  // TAP EFFECT

  const tapBtn = document.getElementById('tapBtn');

  let energy = 100;
  let points = 0;
  let gpvlt = 0;
  let pvlt = 0;

  tapBtn.addEventListener('click', (e) => {

    if(energy <= 0) return;

    energy--;
    points++;

    document.getElementById('energy').innerText = energy;

    // 100 points = 1 gPVLT
    if(points >= 100){

      points = 0;
      gpvlt++;

      document.getElementById('gpvlt').innerText = gpvlt;
    }

    // 100 gPVLT = 1 PVLT
    if(gpvlt >= 100){

      gpvlt = 0;
      pvlt++;

      document.getElementById('gpvlt').innerText = gpvlt;
      document.getElementById('pvlt').innerText = pvlt;
    }

    // FLOATING TEXT

    const float = document.createElement('div');

    float.className = 'floating';
    float.innerText = '+1';

    float.style.left = e.pageX + 'px';
    float.style.top = e.pageY + 'px';

    document.body.appendChild(float);

    setTimeout(()=>{
      float.remove();
    },1000);

  });

</script>

</body>
</html>
