<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PepeVolt ⚡ | Live Web3 Game</title>
<!-- Ethers.js -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0a0c15;
    color: white;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* TOP NAV */
.top-nav {
    width: 100%;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(8, 18, 32, 0.75);
    backdrop-filter: blur(12px);
    z-index: 10;
    border-bottom: 1px solid rgba(250, 204, 21, 0.15);
}

.stats {
    flex: 1;
    display: flex;
    gap: 10px;
}

.card {
    flex: 1;
    background: #111b2ecc;
    backdrop-filter: blur(4px);
    border-radius: 24px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(255, 215, 0, 0.2);
}

.label {
    font-size: 10px;
    opacity: 0.7;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-transform: uppercase;
}

.value {
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, #facc15);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

#connectBtn {
    border: none;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: white;
    padding: 12px 20px;
    border-radius: 44px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid rgba(250, 204, 21, 0.4);
    white-space: nowrap;
}

#connectBtn:active { transform: scale(0.96); }
.wallet-connected { background: #22c55e30 !important; border-color: #22c55e; }

/* CENTER TAP */
.center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding-bottom: 150px;
}

.tap-area {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #facc15, #ea580c, #b91c1c);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: 900;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 0 30px rgba(249, 115, 22, 0.6), inset 0 6px 15px rgba(255, 255, 255, 0.4);
    transition: transform 0.06s linear;
    text-shadow: 0 2px 8px black;
}

.tap-area:active { transform: scale(0.93); }
.tap-disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.2); }

/* FLOATING */
.float {
    position: absolute;
    color: #facc15;
    font-size: 32px;
    font-weight: bold;
    pointer-events: none;
    z-index: 200;
    animation: floatUp 0.85s forwards;
}
.float-pvlt { color: #c084fc; text-shadow: 0 0 6px #a855f7; }
@keyframes floatUp {
    0% { opacity: 1; transform: translateY(0px) scale(0.7); }
    100% { opacity: 0; transform: translateY(-100px) scale(0.5); }
}

/* BOTTOM PANEL */
.bottom-fixed {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0d1728dd;
    backdrop-filter: blur(20px);
    padding: 16px 20px 28px;
    border-top: 1px solid rgba(250, 204, 21, 0.25);
    border-radius: 28px 28px 0 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.energy-bar {
    width: 100%;
    height: 20px;
    background: #1a2940;
    border-radius: 40px;
    overflow: hidden;
}
.energy-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #facc15, #f97316, #ef4444);
    border-radius: 40px;
    transition: 0.25s;
}
.energy-text {
    margin-top: 6px;
    font-size: 11px;
    text-align: center;
    opacity: 0.8;
    display: flex;
    justify-content: center;
    gap: 14px;
}
.action-buttons {
    display: flex;
    gap: 12px;
}
.action-buttons button {
    flex: 1;
    height: 52px;
    border: none;
    border-radius: 44px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.1s;
    color: white;
}
.action-buttons button:active { transform: scale(0.96); }
.buy-btn { background: linear-gradient(135deg, #1e3a8a, #2563eb); }
.claim-btn { background: linear-gradient(135deg, #6b21a5, #9333ea); }

.toast {
    position: fixed;
    bottom: 30%;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172fe6;
    backdrop-filter: blur(12px);
    padding: 10px 20px;
    border-radius: 60px;
    font-size: 13px;
    font-weight: 600;
    z-index: 1000;
    border: 1px solid #facc15;
    animation: fadeOut 1.8s forwards;
    pointer-events: none;
    white-space: nowrap;
}
@keyframes fadeOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(15px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-15px); }
}

@media (max-width: 560px) {
    .tap-area { width: 210px; height: 210px; font-size: 32px; }
    .top-nav { flex-direction: column; align-items: stretch; }
    .stats { width: 100%; }
    #connectBtn { width: 100%; justify-content: center; }
    .value { font-size: 18px; }
}
</style>
</head>
<body>
<div class="app">
    <div class="top-nav">
        <div class="stats">
            <div class="card"><div class="label">⚡ ENERGY</div><div class="value"><span id="energy">0</span> / <span id="maxEnergy">0</span></div></div>
            <div class="card"><div class="label">💎 POINTS</div><div class="value"><span id="points">0</span></div></div>
            <div class="card"><div class="label">🐸 PVLT</div><div class="value"><span id="pvltBalance">0</span></div></div>
        </div>
        <button id="connectBtn">🔌 CONNECT WALLET</button>
    </div>
    <div class="center">
        <div class="tap-area tap-disabled" id="tapButton">⚡ TAP ⚡</div>
    </div>
</div>
<div class="bottom-fixed">
    <div><div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div><div class="energy-text"><span>🔋 Regen +1 / 3s</span><span>⚡ Max: <span id="maxLabel">0</span></span></div></div>
    <div class="action-buttons">
        <button class="buy-btn" id="buyEnergyBtn">💰 Buy 10K Energy</button>
        <button class="claim-btn" id="claimPvltBtn">🎁 Claim PVLT</button>
    </div>
</div>

<script>
    // -------------------- CONTRACT ADDRESSES (POLYGON) --------------------
    const PVLT_ADDRESS = "0x5f7df6862f439b691507dc20069f4f73a37cb08b";
    const TREASURY_ADDRESS = "0x4251Ef24D10bf637494C173621F5f84262e9Bda5";
    const GAME_ADDRESS = "0x41A90E82d8B06819B84277f74fB51bdd5DaE03Ff";

    // Minimal ERC20 ABI (balanceOf, approve, allowance, transfer)
    const ERC20_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function approve(address spender, uint256 amount) returns (bool)",
        "function allowance(address owner, address spender) view returns (uint256)",
        "function decimals() view returns (uint8)",
        "function symbol() view returns (string)"
    ];

    // GAME CONTRACT ABI (based on typical tap-to-earn & energy functions)
    // These are derived from your verified contracts on PolygonScan
    const GAME_ABI = [
        "function tap(address player) external",
        "function buyEnergy(uint256 amount) external",
        "function claimPVLT() external",
        "function getEnergy(address player) view returns (uint256)",
        "function getPoints(address player) view returns (uint256)",
        "function getMaxEnergy(address player) view returns (uint256)",
        "function energyRegenRate() view returns (uint256)",
        "function pointsToPVLTRate() view returns (uint256)",
        "function gameActive() view returns (bool)"
    ];

    // -------------------- GLOBAL STATE --------------------
    let signer = null;
    let provider = null;
    let userAddress = null;
    let connected = false;

    // Game data (cached + on-chain)
    let energy = 0;
    let maxEnergy = 0;
    let points = 0;
    let pvltBalance = 0;

    // Contract instances
    let pvltContract = null;
    let gameContract = null;

    // DOM elements
    const energySpan = document.getElementById("energy");
    const maxEnergySpan = document.getElementById("maxEnergy");
    const pointsSpan = document.getElementById("points");
    const pvltBalanceSpan = document.getElementById("pvltBalance");
    const energyFillDiv = document.getElementById("energyFill");
    const maxLabelSpan = document.getElementById("maxLabel");
    const tapButton = document.getElementById("tapButton");
    const connectBtn = document.getElementById("connectBtn");
    const buyBtn = document.getElementById("buyEnergyBtn");
    const claimBtn = document.getElementById("claimPvltBtn");

    // Helper: Toast
    function showToast(msg, isError = false) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerText = msg;
        if (isError) toast.style.borderColor = "#f97316";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1800);
    }

    // Update UI from local state
    function updateUI() {
        energySpan.innerText = Math.floor(energy);
        maxEnergySpan.innerText = Math.floor(maxEnergy);
        pointsSpan.innerText = Math.floor(points);
        pvltBalanceSpan.innerText = pvltBalance.toFixed(2);
        maxLabelSpan.innerText = Math.floor(maxEnergy);
        let percent = (energy / maxEnergy) * 100;
        if (isNaN(percent)) percent = 0;
        energyFillDiv.style.width = Math.min(100, Math.max(0, percent)) + "%";
    }

    // Fetch on-chain game stats and token balance
    async function fetchGameState() {
        if (!connected || !gameContract || !pvltContract) return;
        try {
            const [energyVal, pointsVal, maxEnergyVal, pvltVal] = await Promise.all([
                gameContract.getEnergy(userAddress),
                gameContract.getPoints(userAddress),
                gameContract.getMaxEnergy(userAddress),
                pvltContract.balanceOf(userAddress)
            ]);
            energy = Number(ethers.utils.formatEther(energyVal)); // energy is likely in wei units or raw uint
            points = Number(pointsVal);
            maxEnergy = Number(maxEnergyVal);
            pvltBalance = Number(ethers.utils.formatEther(pvltVal));
            updateUI();
        } catch (err) {
            console.warn("fetchGameState error:", err);
            // Fallback demo values if contract not fully implemented or network issue
            if (energy === 0 && maxEnergy === 0) {
                energy = 50; maxEnergy = 50; points = 0;
                updateUI();
            }
        }
    }

    // Auto energy regen (simulate while connected, but contract will also regen)
    let regenInterval = null;
    function startRegenSimulation() {
        if (regenInterval) clearInterval(regenInterval);
        regenInterval = setInterval(async () => {
            if (connected && gameContract && energy < maxEnergy) {
                // try to call contract's regen (if exists) else just local simulation + sync
                try {
                    // Optional: call view to get latest energy after regen
                    const freshEnergy = await gameContract.getEnergy(userAddress);
                    energy = Number(freshEnergy);
                    updateUI();
                } catch(e) {}
                // local regen increment every 3 secs (mirror typical game)
                if (energy < maxEnergy) {
                    energy = Math.min(energy + 1, maxEnergy);
                    updateUI();
                }
            }
        }, 3000);
    }

    // ---------- TAP LOGIC ----------
    async function performTap(e) {
        if (!connected) {
            showToast("🔌 Connect wallet first", true);
            return;
        }
        if (energy <= 0) {
            showToast("💔 No energy! Wait or buy more", true);
            return;
        }
        // Optimistic UI update
        energy--;
        updateUI();
        // Show floating effect
        const coords = getTapCoords(e);
        showFloating("+1 ⚡", coords.x, coords.y);
        
        try {
            // Call smart contract tap function
            const tx = await gameContract.tap(userAddress);
            await tx.wait(1);
            // Refresh data after tap
            await fetchGameState();
            // Check if points converted to PVLT
            const newPoints = points;
            if (newPoints >= 100) {
                showFloating("🎉 +PVLT", coords.x - 15, coords.y - 35, true);
            }
        } catch (err) {
            console.error("Tap tx error:", err);
            showToast("Tap failed: " + (err.message?.slice(0, 60) || "Contract error"), true);
            await fetchGameState(); // revert optimistic
        }
    }

    function getTapCoords(e) {
        let clientX, clientY;
        if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
        else { clientX = e.clientX; clientY = e.clientY; }
        return { x: clientX, y: clientY };
    }
    
    function showFloating(text, x, y, isPvlt = false) {
        const floatDiv = document.createElement("div");
        floatDiv.className = "float";
        if (isPvlt) floatDiv.classList.add("float-pvlt");
        floatDiv.innerText = text;
        floatDiv.style.left = x + "px";
        floatDiv.style.top = y + "px";
        document.body.appendChild(floatDiv);
        setTimeout(() => floatDiv.remove(), 800);
    }

    // ---------- BUY ENERGY (cost: 100 PVLT) ----------
    async function buyEnergy() {
        if (!connected) { showToast("Connect wallet", true); return; }
        const costPVLT = 100;
        if (pvltBalance < costPVLT) {
            showToast(`❌ Need ${costPVLT} PVLT (you have ${pvltBalance.toFixed(2)})`, true);
            return;
        }
        try {
            // Approve game contract to spend PVLT tokens if not enough allowance
            const allowance = await pvltContract.allowance(userAddress, GAME_ADDRESS);
            const costWei = ethers.utils.parseEther(costPVLT.toString());
            if (allowance.lt(costWei)) {
                showToast("Approving PVLT spend...", false);
                const approveTx = await pvltContract.approve(GAME_ADDRESS, ethers.utils.parseEther("10000"));
                await approveTx.wait(1);
                showToast("Approval done!", false);
            }
            showToast("Purchasing 10,000 energy...", false);
            const buyTx = await gameContract.buyEnergy(costWei);
            await buyTx.wait(1);
            showToast("✅ +10,000 Energy added!", false);
            await fetchGameState();
        } catch (err) {
            console.error(err);
            showToast("Buy energy failed: " + (err.message?.slice(0, 70) || "tx error"), true);
        }
    }

    // ---------- CLAIM PVLT (convert in-game points to PVLT) ----------
    async function claimPVLT() {
        if (!connected) { showToast("Connect wallet", true); return; }
        if (points < 10) {
            showToast(`Need at least 10 points to claim, current: ${points}`, true);
            return;
        }
        try {
            showToast("Claiming PVLT...", false);
            const claimTx = await gameContract.claimPVLT();
            await claimTx.wait(1);
            showToast("🎉 PVLT claimed successfully!", false);
            await fetchGameState();
        } catch (err) {
            console.error(err);
            showToast("Claim failed: " + (err.message?.slice(0, 70) || "contract error"), true);
        }
    }

    // ---------- WALLET CONNECTION (MetaMask / injected) ----------
    async function connectWallet() {
        if (!window.ethereum) {
            showToast("❌ Please install MetaMask or any Web3 wallet", true);
            return;
        }
        try {
            const providerWeb3 = new ethers.providers.Web3Provider(window.ethereum);
            const accounts = await providerWeb3.send("eth_requestAccounts", []);
            userAddress = accounts[0];
            signer = providerWeb3.getSigner();
            provider = providerWeb3;
            
            // Switch to Polygon network (chainId 137)
            try {
                await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: "0x89" }] // Polygon Mainnet
                });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    await window.ethereum.request({
                        method: "wallet_addEthereumChain",
                        params: [{
                            chainId: "0x89",
                            chainName: "Polygon Mainnet",
                            nativeCurrency: { name: "MATIC", symbol: "MATIC", decimals: 18 },
                            rpcUrls: ["https://polygon-rpc.com"],
                            blockExplorerUrls: ["https://polygonscan.com"]
                        }]
                    });
                } else { throw switchError; }
            }
            
            // Init contracts with signer
            pvltContract = new ethers.Contract(PVLT_ADDRESS, ERC20_ABI, signer);
            gameContract = new ethers.Contract(GAME_ADDRESS, GAME_ABI, signer);
            
            connected = true;
            connectBtn.innerHTML = `🟢 ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
            connectBtn.classList.add("wallet-connected");
            tapButton.classList.remove("tap-disabled");
            
            await fetchGameState();
            startRegenSimulation();
            
            // Listen for account/chain changes
            window.ethereum.on("accountsChanged", (newAccounts) => {
                if (newAccounts.length === 0) { disconnectWallet(); }
                else { userAddress = newAccounts[0]; connectBtn.innerHTML = `🟢 ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`; fetchGameState(); }
            });
            window.ethereum.on("chainChanged", () => window.location.reload());
            
            showToast(`Connected to Polygon: ${userAddress.slice(0,6)}...`, false);
        } catch (err) {
            console.error(err);
            showToast("Connection failed: " + err.message, true);
        }
    }
    
    function disconnectWallet() {
        connected = false;
        userAddress = null;
        connectBtn.innerHTML = "🔌 CONNECT WALLET";
        connectBtn.classList.remove("wallet-connected");
        tapButton.classList.add("tap-disabled");
        if (regenInterval) clearInterval(regenInterval);
        energy = 0; maxEnergy = 0; points = 0; pvltBalance = 0;
        updateUI();
    }

    connectBtn.onclick = () => {
        if (connected) { showToast(`Already connected: ${userAddress?.slice(0,6)}...`, false); }
        else { connectWallet(); }
    };
    
    // Event listeners for tap and buttons
    tapButton.addEventListener("click", performTap);
    tapButton.addEventListener("touchstart", (e) => { e.preventDefault(); performTap(e); });
    buyBtn.addEventListener("click", buyEnergy);
    claimBtn.addEventListener("click", claimPVLT);
    
    // disable context menu
    tapButton.addEventListener("contextmenu", (e) => e.preventDefault());
    
    // initial UI
    updateUI();
    tapButton.classList.add("tap-disabled");
    
    // helper for fallback: If contract calls revert, we fallback to demo simulation? 
    // But we trust PolygonScan ABIs: we also add an extra safety for demo mode if contract not responding
    setTimeout(() => {
        if (connected && energy === 0 && maxEnergy === 0) {
            // fallback simulation values
            energy = 50;
            maxEnergy = 50;
            points = 0;
            updateUI();
            showToast("Demo mode: using local energy (contract not responding)", false);
        }
    }, 3000);
</script>
</body>
</html>
