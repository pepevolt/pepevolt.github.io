<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PepeVolt | Tap to Earn PVLT</title>
  <link rel="icon" href="images/logo.PNG">
  <meta name="theme-color" content="#090912">
  
  <!-- Essential libs only -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    :root {
      --bg: #090912;
      --card: #0e0f1a;
      --primary: #00ffcc;
      --secondary: #ffd700;
      --muted: #9ba3c2;
      --border: rgba(0,255,204,0.2);
      --radius: 16px;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 440px;
      margin: 0 auto;
      padding: 16px;
      overflow: hidden;
    }
    .energy-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .energy-left .val { font-family: monospace; font-weight: 800; font-size: 20px; color: var(--primary); }
    .energy-right { width: 52%; }
    .prog-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
    .prog-bar-fill { height: 100%; background: var(--primary); transition: width .4s ease; }
    .regen-lbl { font-size: 9px; color: var(--muted); text-align: right; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 10px 12px;
      text-align: center;
    }
    .stat-card.primary-card { border: 1px solid var(--border); }
    .stat-card.secondary-card { border: 1px solid rgba(255,215,0,0.2); }
    .stat-card .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
    .stat-card .val { font-family: monospace; font-weight: 800; font-size: 22px; }
    .stat-card.secondary-card .val { color: var(--secondary); }
    .wallet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .wallet-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
    }
    .wallet-card .lbl { font-size: 9px; color: var(--muted); }
    .wallet-card .val { font-family: monospace; font-size: 13px; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }
    .pepe-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00ebbc, #008f74);
      border: 4px solid rgba(0,255,204,0.5);
      cursor: pointer;
      transition: transform .08s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0,255,204,0.4);
    }
    .pepe-btn:active { transform: scale(.95); }
    .pepe-btn.no-energy { opacity: 0.5; cursor: not-allowed; }
    .pepe-btn img { width: 70%; height: 70%; object-fit: contain; }
    footer {
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 12px;
      margin-top: 8px;
    }
    .status-txt { text-align: center; font-size: 11px; font-family: monospace; color: var(--muted); margin-bottom: 10px; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 44px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-secondary { background: var(--secondary); color: #000; }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.2); color: #fff; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #000; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.9);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      width: 90%;
      max-width: 320px;
      border: 1px solid var(--border);
    }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 16px; }
    .wallet-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.03);
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }
    .wallet-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255,255,255,.1); }
    .modal-close { float: right; cursor: pointer; font-size: 20px; color: var(--muted); }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-80px); }
    }
    .float-text {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      font-family: monospace;
      font-weight: 800;
      font-size: 22px;
      animation: floatUp 1s forwards;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="energy-row">
    <div class="energy-left"><div class="val" id="energyVal">100 / 100</div></div>
    <div class="energy-right">
      <div class="prog-bar"><div class="prog-bar-fill" id="energyBar" style="width:100%"></div></div>
      <div class="regen-lbl" id="regenLbl"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card primary-card">
      <div class="lbl">Points</div>
      <div class="val"><span id="pointsVal">0</span><span style="font-size:14px">/100</span></div>
    </div>
    <div class="stat-card secondary-card">
      <div class="lbl">💎 Game PVLT</div>
      <div class="val" id="gamePvltVal">0</div>
    </div>
  </div>

  <div class="wallet-row">
    <div class="wallet-card"><div class="lbl">💼 Wallet</div><div class="val" id="walletVal">0.00</div></div>
    <div class="wallet-card"><div class="lbl">🏦 Treasury</div><div class="val" id="treasuryVal">0</div></div>
  </div>

  <main>
    <button class="pepe-btn no-energy" id="tapBtn">
      <img src="images/logo.PNG" alt="Pepe" onerror="this.innerHTML='🐸'">
    </button>
  </main>

  <footer>
    <div class="status-txt" id="statusTxt">🔒 Connect wallet to start</div>
    <div id="stateDisconnected">
      <button class="btn btn-primary" id="connectBtn">💼 CONNECT WALLET</button>
    </div>
    <div id="stateConnected" style="display:none">
      <div class="action-grid">
        <button class="btn btn-secondary" id="buyBtn">⚡ BUY ENERGY (100 PVLT)</button>
        <button class="btn btn-primary" id="claimBtn">💎 CLAIM <span id="claimSub">TO WALLET</span></button>
      </div>
    </div>
  </footer>
</div>

<div id="walletModal" class="modal-overlay">
  <div class="modal-sheet">
    <div style="text-align:right"><span class="modal-close" id="closeModal">✕</span></div>
    <div class="modal-title">Connect</div>
    <button class="wallet-option" id="metaMaskOption">
      <div class="wallet-icon">🏦</div>
      <div>MetaMask</div>
    </button>
    <div style="text-align:center; font-size:11px; color:var(--muted); margin-top:12px">
      Make sure you're on <span style="color:var(--primary)">Polygon Mainnet</span>
    </div>
  </div>
</div>

<script>
  // ==================== CONTRACT DETAILS ====================
  const PVLT_TOKEN_ADDRESS = "0x03741F950eaFD9CbAa217E2B0491a0F143492f0A";
  const GAME_CONTRACT_ADDRESS = "0xE522370EA3A22D9075bB446027c7E46b5D979806";
  const TREASURY_ADDRESS = "0x2f5d721F771f53F55845AA927b95E40d5Ad30EF4";

  const GAME_ABI = [
    "function buyEnergy(uint256 pvltAmount) external",
    "function claimRewards(uint256 pvltAmount) external",
    "function getTreasuryBalance() view returns (uint256)"
  ];
  const PVLT_ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function approve(address,uint256) returns (bool)",
    "function allowance(address,address) view returns (uint256)",
    "function decimals() view returns (uint8)"
  ];

  // DOM shortcuts
  const $ = id => document.getElementById(id);
  const elements = {
    energyVal: $('energyVal'), energyBar: $('energyBar'), regenLbl: $('regenLbl'),
    pointsVal: $('pointsVal'), gamePvltVal: $('gamePvltVal'),
    walletVal: $('walletVal'), treasuryVal: $('treasuryVal'),
    tapBtn: $('tapBtn'), statusTxt: $('statusTxt'), connectBtn: $('connectBtn'),
    stateDisc: $('stateDisconnected'), stateConn: $('stateConnected'),
    buyBtn: $('buyBtn'), claimBtn: $('claimBtn'), claimSub: $('claimSub'),
    walletModal: $('walletModal'), closeModal: $('closeModal'), metaMaskOption: $('metaMaskOption')
  };

  // Game state
  let account = null, provider = null, signer = null, tokenC = null, gameC = null, decimals = 18;
  let maxEnergy = 100, energy = 100, points = 0, gamePvlt = 0, walletBal = 0, treasuryBal = 0;
  let lastRegen = Date.now(), regenTimer = null, tapLock = false;

  // ---------- helpers ----------
  function saveLocal() { if(account) localStorage.setItem(`pv_${account}`, JSON.stringify({ energy, points, gamePvlt, lastRegen, maxEnergy })); }
  function loadLocal() {
    if(!account) return;
    try {
      const d = JSON.parse(localStorage.getItem(`pv_${account}`) || '{}');
      maxEnergy = d.maxEnergy ?? 100;
      points = d.points ?? 0;
      gamePvlt = d.gamePvlt ?? 0;
      lastRegen = d.lastRegen ?? Date.now();
      const offSecs = Math.floor((Date.now() - lastRegen) / 1000);
      const gained = Math.min(Math.floor(offSecs / 15), maxEnergy - (d.energy ?? 100));
      energy = Math.min((d.energy ?? 100) + gained, maxEnergy);
      if(gained > 0) lastRegen = Date.now();
    } catch(e) {}
  }

  function showFloat(x, y, text, color = '#fff') {
    const div = document.createElement('div');
    div.className = 'float-text';
    div.textContent = text;
    div.style.left = `${x - 20}px`;
    div.style.top = `${y - 20}px`;
    div.style.color = color;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1000);
  }

  function setStatus(msg) { if(elements.statusTxt) elements.statusTxt.textContent = msg; }

  // UI render
  function renderUI() {
    elements.energyVal.textContent = `${Math.floor(energy)} / ${maxEnergy}`;
    elements.energyBar.style.width = `${Math.min((energy / maxEnergy) * 100, 100)}%`;
    elements.pointsVal.textContent = points;
    elements.gamePvltVal.textContent = gamePvlt.toFixed(0);
    elements.walletVal.textContent = walletBal.toFixed(2);
    elements.treasuryVal.textContent = treasuryBal.toFixed(0);
    elements.claimSub.textContent = gamePvlt >= 1 ? `${Math.floor(gamePvlt)} PVLT` : 'TO WALLET';
    
    if(account) {
      elements.tapBtn.classList.remove('no-energy');
      elements.stateDisc.style.display = 'none';
      elements.stateConn.style.display = 'block';
      elements.buyBtn.disabled = walletBal < 100;
      elements.claimBtn.disabled = gamePvlt < 1;
      const shortAddr = `${account.slice(0,6)}...${account.slice(-4)}`;
      if(!document.getElementById('disconnectBtn')) {
        const disBtn = document.createElement('button');
        disBtn.id = 'disconnectBtn';
        disBtn.className = 'btn btn-outline';
        disBtn.style.marginBottom = '8px';
        disBtn.textContent = `🔴 ${shortAddr}`;
        disBtn.onclick = () => disconnect();
        elements.stateConn.insertBefore(disBtn, elements.stateConn.firstChild);
      } else {
        const btn = document.getElementById('disconnectBtn');
        if(btn) btn.textContent = `🔴 ${shortAddr}`;
      }
    } else {
      elements.tapBtn.classList.add('no-energy');
      elements.stateDisc.style.display = 'block';
      elements.stateConn.style.display = 'none';
      const oldBtn = document.getElementById('disconnectBtn');
      if(oldBtn) oldBtn.remove();
    }
  }

  // regen tick & UI
  function regenTick() {
    if(account && energy < maxEnergy) {
      const secs = Math.floor((Date.now() - lastRegen) / 1000);
      const gained = Math.floor(secs / 15);
      if(gained > 0) {
        energy = Math.min(energy + gained, maxEnergy);
        lastRegen = Date.now();
        saveLocal();
      }
      const rem = 15 - (Math.floor((Date.now() - lastRegen) / 1000) % 15);
      elements.regenLbl.textContent = `⚡ +1 in ${rem}s`;
    } else {
      elements.regenLbl.textContent = '';
    }
    renderUI();
  }

  async function refreshBalances() {
    if(!account || !tokenC) return;
    try {
      const [bal, treasury] = await Promise.all([
        tokenC.balanceOf(account),
        gameC.getTreasuryBalance().catch(() => ethers.BigNumber.from(0))
      ]);
      walletBal = parseFloat(ethers.utils.formatUnits(bal, decimals));
      treasuryBal = parseFloat(ethers.utils.formatUnits(treasury, decimals));
      renderUI();
    } catch(e) { console.warn(e); }
  }

  // Tap action
  function doTap(x, y) {
    if(!account || energy <= 0 || tapLock) return;
    tapLock = true;
    setTimeout(() => tapLock = false, 80);
    energy--;
    points++;
    if(points >= 100) {
      const earned = Math.floor(points / 100);
      gamePvlt += earned;
      points %= 100;
      showFloat(x, y-40, `+${earned} PVLT! 🎉`, '#ffd700');
    }
    showFloat(x, y, '+1 ⚡', '#00ffcc');
    saveLocal();
    renderUI();
  }

  // ---------- blockchain interactions ----------
  async function connectMetaMask() {
    if(!window.ethereum) { alert("Please install MetaMask!"); return false; }
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      account = accounts[0];
      provider = new ethers.providers.Web3Provider(window.ethereum);
      signer = provider.getSigner();
      const network = await provider.getNetwork();
      if(network.chainId !== 137) {
        setStatus("⚠️ Switching to Polygon...");
        try {
          await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] });
        } catch(e) {
          await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{
            chainId: '0x89', chainName: 'Polygon Mainnet',
            nativeCurrency: { name: 'MATIC', symbol: 'MATIC', decimals: 18 },
            rpcUrls: ['https://polygon-rpc.com/']
          }]});
        }
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
      }
      tokenC = new ethers.Contract(PVLT_TOKEN_ADDRESS, PVLT_ABI, signer);
      gameC = new ethers.Contract(GAME_CONTRACT_ADDRESS, GAME_ABI, signer);
      decimals = await tokenC.decimals();
      loadLocal();
      await refreshBalances();
      setStatus(`✅ Connected: ${account.slice(0,6)}...${account.slice(-4)}`);
      renderUI();
      if(regenTimer) clearInterval(regenTimer);
      regenTimer = setInterval(async () => { regenTick(); await refreshBalances(); }, 1000);
      window.ethereum.on('accountsChanged', (accs) => { if(!accs.length) disconnect(); else if(accs[0] !== account) location.reload(); });
      return true;
    } catch(e) {
      console.error(e);
      setStatus(`❌ ${e.message?.slice(0,50) || 'Connection failed'}`);
      return false;
    }
  }

  async function disconnect() {
    if(regenTimer) clearInterval(regenTimer);
    if(account) saveLocal();
    account = null; walletBal = 0; treasuryBal = 0;
    energy = 100; maxEnergy = 100; points = 0; gamePvlt = 0;
    setStatus('🔒 Disconnected');
    renderUI();
  }

  async function buyEnergy() {
    if(!account) { setStatus("Connect wallet first"); return; }
    if(walletBal < 100) { setStatus(`❌ Need 100 PVLT. You have ${walletBal.toFixed(2)}`); return; }
    elements.buyBtn.disabled = true;
    setStatus("⏳ Checking allowance...");
    try {
      const amount = ethers.utils.parseUnits("100", decimals);
      const allowance = await tokenC.allowance(account, GAME_CONTRACT_ADDRESS);
      if(allowance.lt(amount)) {
        setStatus("⏳ Approving 100 PVLT...");
        const approveTx = await tokenC.approve(GAME_CONTRACT_ADDRESS, amount);
        await approveTx.wait();
        setStatus("✅ Approval confirmed! Buying energy...");
        await new Promise(r => setTimeout(r, 1500));
      }
      setStatus("⏳ Buying +1000 Energy...");
      const gasEstimate = await gameC.estimateGas.buyEnergy(amount);
      const tx = await gameC.buyEnergy(amount, { gasLimit: gasEstimate.mul(12).div(10) });
      setStatus("⏳ Transaction sent. Waiting...");
      await tx.wait();
      maxEnergy += 1000;
      energy += 1000;
      saveLocal();
      await refreshBalances();
      setStatus(`✅ +1000 Energy! Max: ${maxEnergy}`);
      showFloat(window.innerWidth/2, window.innerHeight/2 - 80, '⚡ +1000 ENERGY!', '#ffd700');
    } catch(e) {
      console.error(e);
      let errMsg = e.message || "Tx failed";
      if(errMsg.includes("insufficient funds")) errMsg = "Insufficient MATIC for gas!";
      else if(errMsg.includes("user rejected")) errMsg = "Transaction rejected";
      else if(errMsg.includes("execution reverted")) errMsg = "Contract execution failed";
      setStatus(`❌ ${errMsg.slice(0,80)}`);
    } finally {
      elements.buyBtn.disabled = walletBal < 100;
    }
  }

  async function claimRewards() {
    if(!account) { setStatus("Connect wallet first"); return; }
    if(gamePvlt < 1) { setStatus(`❌ No GAME PVLT!`); return; }
    if(treasuryBal < gamePvlt) { setStatus(`❌ Treasury low! Has ${treasuryBal.toFixed(0)} PVLT`); return; }
    const amount = Math.floor(gamePvlt);
    const amountWei = ethers.utils.parseUnits(amount.toString(), decimals);
    elements.claimBtn.disabled = true;
    setStatus(`⏳ Claiming ${amount} PVLT...`);
    try {
      const gasEstimate = await gameC.estimateGas.claimRewards(amountWei);
      const tx = await gameC.claimRewards(amountWei, { gasLimit: gasEstimate.mul(12).div(10) });
      setStatus("⏳ Waiting confirmation...");
      await tx.wait();
      gamePvlt = 0;
      points = 0;
      saveLocal();
      await refreshBalances();
      setStatus(`✅ Claimed ${amount} REAL PVLT!`);
      showFloat(window.innerWidth/2, window.innerHeight/2 - 80, `💎 +${amount} PVLT!`, '#00ffcc');
    } catch(e) {
      console.error(e);
      setStatus(`❌ ${e.message?.slice(0,80) || "Claim failed"}`);
    } finally {
      elements.claimBtn.disabled = gamePvlt < 1;
    }
  }

  // ---------- event binding ----------
  elements.tapBtn.addEventListener('click', (e) => {
    const rect = elements.tapBtn.getBoundingClientRect();
    doTap(rect.left + rect.width/2, rect.top + rect.height/2);
  });
  elements.tapBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    doTap(touch.clientX, touch.clientY);
  }, { passive: false });

  // modal handling
  function openModal() { elements.walletModal.classList.add('open'); }
  function closeModalFn() { elements.walletModal.classList.remove('open'); }
  elements.connectBtn.onclick = () => { if(account) disconnect(); else openModal(); };
  elements.closeModal.onclick = closeModalFn;
  elements.walletModal.onclick = (e) => { if(e.target === elements.walletModal) closeModalFn(); };
  elements.metaMaskOption.onclick = async () => {
    closeModalFn();
    elements.connectBtn.innerHTML = '<span class="spinner"></span> CONNECTING...';
    elements.connectBtn.disabled = true;
    const ok = await connectMetaMask();
    elements.connectBtn.innerHTML = '💼 CONNECT WALLET';
    elements.connectBtn.disabled = false;
    if(!ok) setStatus("Connection failed");
  };
  elements.buyBtn.onclick = buyEnergy;
  elements.claimBtn.onclick = claimRewards;

  // initial tick loop and UI
  setInterval(regenTick, 1000);
  renderUI();
  setStatus('🔒 Click CONNECT WALLET to start');
</script>
</body>
</html>
