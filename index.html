<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeVolt Ecosystem | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen font-sans">
    
    <nav class="border-b border-gray-800 p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-green-500 tracking-tight">PEPEVOLT<span class="text-white">GAME</span></h1>
            <button id="connectBtn" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-full text-sm font-semibold transition-all">Connect Wallet</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 space-y-8">
        
        <div class="text-center py-10">
            <h2 class="text-4xl font-extrabold mb-4">Ecosystem Overview</h2>
            <p class="text-gray-400">Interact with the PepeVolt smart contracts directly from your browser.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800">
                <p class="text-gray-500 text-xs font-bold uppercase">Energy Price</p>
                <p id="energyPrice" class="text-2xl font-mono text-white mt-1">--</p>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800">
                <p class="text-gray-500 text-xs font-bold uppercase">Free Cap</p>
                <p id="freeCap" class="text-2xl font-mono text-white mt-1">--</p>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800">
                <p class="text-gray-500 text-xs font-bold uppercase">Paid Cap</p>
                <p id="paidCap" class="text-2xl font-mono text-white mt-1">--</p>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800">
                <p class="text-gray-500 text-xs font-bold uppercase">Treasury Status</p>
                <p id="treasuryAddr" class="text-sm font-mono text-green-400 mt-2 break-all">--</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 bg-gray-900 p-8 rounded-3xl border border-gray-800 shadow-xl">
                <h3 class="text-lg font-bold mb-6">Contract Controls</h3>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="handleAction('tap', this)" class="bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold transition">TAP</button>
                    <button onclick="handleAction('buyEnergy', this)" class="bg-purple-600 hover:bg-purple-700 py-4 rounded-xl font-bold transition">Buy Energy</button>
                    <button onclick="handleAction('refillEnergy', this)" class="bg-yellow-600 hover:bg-yellow-700 py-4 rounded-xl font-bold transition">Refill</button>
                    <button onclick="handleAction('claimRewards', this)" class="bg-emerald-600 hover:bg-emerald-700 py-4 rounded-xl font-bold transition">Claim</button>
                </div>
            </div>

            <div class="bg-gray-900 p-8 rounded-3xl border border-gray-800">
                <h3 class="text-lg font-bold mb-4">Activity Log</h3>
                <div id="log" class="text-xs text-gray-500 font-mono space-y-2 h-48 overflow-y-auto">
                    <p>> System ready...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-10 text-gray-600 text-sm">
        <p>&copy; 2026 PepeVolt Ecosystem. Securely connected via Web3.</p>
    </footer>

    <script>
        const CONTRACT_ADDRESS = "0x151803532A33837E4bBc2Afc23c6b1f59039B82D";
        const ABI = [ /* PASTE ABI HERE */ ];

        let contract;

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += `<p>> ${msg}</p>`;
            l.scrollTop = l.scrollHeight;
        }

        async function connect() {
            if (!window.ethereum) return alert("MetaMask required");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
            document.getElementById('connectBtn').innerText = "Connected";
            log("Wallet connected");
            updateStats();
        }

        async function updateStats() {
            try {
                const [price, free, paid, treasury] = await Promise.all([
                    contract.ENERGY_PRICE(),
                    contract.FREE_CAP(),
                    contract.PAID_CAP(),
                    contract.treasury()
                ]);
                document.getElementById('energyPrice').innerText = ethers.formatEther(price).slice(0, 8);
                document.getElementById('freeCap').innerText = free.toString();
                document.getElementById('paidCap').innerText = paid.toString();
                document.getElementById('treasuryAddr').innerText = treasury.slice(0, 10) + "...";
            } catch (e) { log("Error loading stats"); }
        }

        async function handleAction(funcName, btn) {
            if (!contract) return log("Connect wallet first!");
            const originalText = btn.innerText;
            try {
                btn.innerText = "Waiting...";
                btn.disabled = true;
                log(`Calling ${funcName}...`);
                const tx = await contract[funcName]();
                await tx.wait();
                log(`${funcName} success!`);
            } catch (err) {
                log("Transaction cancelled");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        document.getElementById('connectBtn').addEventListener('click', connect);
    </script>
</body>
</html>
